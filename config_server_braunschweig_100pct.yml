## Synthetic population pipeline for the Braunschweig region (ZGB-8) - 100% sample
## incl. MATSim outputs. SERVER (Linux) variant, derived from
## config_server_braunschweig_25pct.yml.
##
## Differences vs the 25% server config:
##   - sampling_rate 1.0 (full ~1.13 M synthetic persons)
##   - matsim_last_iteration 99 (a 100-iteration test run)
##   - resources tuned for the 64-core / 128 GB run server (processes 32,
##     java_memory 100G) -- leaves headroom for the OS and the synpp Python driver
##   - the validated household-realism features are ENABLED (joint age x size
##     margin + age-aware chunking + sex-aware couples + parent-age targeting),
##     so this is the first 100% test of the #3 / #3b work.
## Required input data: see eqasim-data/DOWNLOAD_CHECKLIST_BS.md.

working_directory: eqasim-data/cache_bs_100pct

run:
  - synthesis.output
  - matsim.output
  - braunschweig.analysis.cordon_validation   # per-run commuter_validation + gate flows (cordon)

config:
  # 64-core server. 32 keeps RAM in check at 100% (each synthesis worker holds
  # large GeoDataFrames; oversubscribing risks an OOM on the 128 GB box). Raise
  # toward 48 if a run shows memory headroom; MATSim uses this as its thread count.
  processes: 32

  # ENTD 2008 remains the HTS for v1 (keep_bavaria_hts user preference)
  hts: entd

  sampling_rate: 1.0
  random_seed: 1234

  data_path: eqasim-data/data
  output_path: eqasim-data/output_bs_100pct
  output_prefix: braunschweig_100pct_

  # Vehicle fleet (spec A4 / Task F5): emit exactly the MiD-H7 number_of_cars
  # vehicles per household (each owned by a licensed adult, typed via the
  # KBA/HBEFA fleet chain) instead of one identical default car per person.
  # OFF (vehicles_method: "default") reproduces the legacy fleet byte-identically.
  vehicles_method: household
  # German fleet model switches (Task F7), default ON. fleet_model_enabled:false
  # (or vehicles_method:"default") reproduces the legacy single default_car fleet
  # byte-identically. fleet_model_brands toggles the additive (non-HBEFA)
  # brand/model attributes. fleet_electric_calibration selects the electric-share
  # model (per-Kreis KBA FZ 27.15 mix + per-Gemeinde FZ 27.17 BEV tilt).
  fleet_model_enabled: true
  fleet_model_brands: true
  # Additive HSN/TSN engine attributes (power kW/PS, displacement ccm, a
  # representative HSN/TSN and the matched dominant fuel) attached to every
  # vehicle by brand + model family. Completeness data only -- not consumed by
  # the simulation yet. Default ON; OFF -> the six engine columns are absent and
  # the writer emits no engine attributes (byte-identical to pre-feature).
  fleet_hsn_tsn_attributes: true
  fleet_electric_calibration: kreis_mix_gemeinde_bev_tilt

  # 128 GB box: give the JVM 110G and leave ~18 GB for the OS + file cache.
  # During MATSim the Python driver is idle, so the JVM can own most of the RAM;
  # a larger heap reduces GC pressure on the full 1.13 M-agent scenario.
  java_memory: 110G

  # Build our OWN editable Java project (../eqasim-java-bs, braunschweig module)
  # instead of cloning upstream eqasim-java. Required: the Python class refs are
  # org.eqasim.braunschweig.* -- the sibling source tree must exist next to the repo.
  eqasim_source_path: ../eqasim-java-bs

  # MATSim thread counts, decoupled from the memory-bound synthesis "processes"
  # (32) AND split between the two MATSim phases, because they parallelise very
  # differently (see the MATSim literature: Dobler 2013, Waraich 2009):
  #   * global.numberOfThreads (routing / replanning / scoring between iterations)
  #     parallelises per-person and scales well -> use most of the 64 cores.
  #   * qsim.numberOfThreads (the mobsim) is a shared-memory parallel queue that
  #     plateaus at ~4-8 threads (memory-bandwidth bound); more threads waste
  #     cores and add sync overhead -> keep it low.
  # This only affects the MATSim phase; synthesis still uses "processes" workers.
  matsim_threads: 48        # global.numberOfThreads (routing/replanning/scoring)
  matsim_qsim_threads: 12   # qsim.numberOfThreads (mobsim; ~plateau, kept low)

  # MATSim simulation: 100 iterations (0..99) on the full 100% population -- a
  # scale + behaviour test of the whole chain. Keep output light: events only at
  # the final iteration, plans every 50th (start, mid, end). scorestats /
  # stopwatch are written every iteration by MATSim regardless.
  matsim_last_iteration: 99
  matsim_write_events_interval: 0
  matsim_write_plans_interval: 50

  home_location_sampling: weighted
  mode_choice: false
  # Optimization step (1): richer exogenous HTS matching keys (employed,
  # household_size_class, urban_class). See config_local_braunschweig_25pct.yml
  # for the full rationale. urban_class target column added by
  # braunschweig.ipf.attributed.attach_urban_class (commune_id -> RegioStaR-2).
  matching_attributes: ["sex", "age_class", "employed", "has_license", "household_size_class", "urban_class"]

  # --- Tier A3: reactivate couple / studies / socioprofessional_class person
  # attributes (see config_local_braunschweig_25pct.yml for the full rationale).
  # couple <- hh_type; studies <- age x Destatis education-participation share;
  # socioprofessional_class <- broad activity status. ``studies`` is appended as
  # the lowest-priority HTS matching key. Default ON; false reproduces legacy.
  reactivate_person_attributes: true

  # Urban parking: tag urban residents (isParis) + inner-ring activities so the
  # BavariaCarCostModel charges 3 EUR/h parking for non-resident car trips into
  # the BS inner ring (8 km around Hbf). Braunschweig's core is parking-priced in
  # reality, so this is the more realistic setting (shifts ~1.3 pp off car).
  enable_urban_parking: true

  # --- R-A: Gravity calibration (TASK-001). See 25pct config for provenance.
  gravity_slope: -0.065
  gravity_constant: -2.4
  gravity_diagonal: 1.0
  gravity_slope_by_regiostar7:
    72: -0.0558
    73: -0.0638
    74: -0.0640
    75: -0.0704
    76: -0.0719
    77: -0.0667

  # --- IPF margins -------------------------------------------------------------
  # Per-commune household-size margin (Zensus 2022 1000A-2081).
  braunschweig.ipf.use_household_size_margin: true
  # Determine economic_status from the MiD household-type x region predictor
  # (Bayes: P(status|hhtype,region), Niedersachsen base tilted by RegioStaR-7),
  # then re-derive household_income / household_income_eur from the sampled
  # status. Household type is a much stronger SES predictor than the legacy 1:1
  # income-class mapping. OFF -> legacy income-derived status (byte-identical).
  status_from_hhtype: true
  # Consistent car_availability (A5, causal IPF chain). Derive car_availability
  # in {none, some, all} conditionally on the per-person MiD-P17.1 licence and
  # the MiD-H7 household car count, then rake the residual to the MiD-P19
  # "jederzeit" marginal (no "all" in a 0-car or licence-less household; "some"
  # reinstated). OFF -> legacy free P19 IPF + all/none binarisation
  # (byte-identical). Requires the vehicle-count / licence sampling that now runs
  # before car_availability (output-identical re-order).
  consistent_car_availability: true

  # Income/household-type-aware household car count (number_of_cars). ON -> draw
  # number_of_cars per household from the MiD-coupled pmf
  # P(num_cars | hhtype, status, raumtyp) (richer / family households own more
  # cars), then rake the per-Kreis distribution back to the MiD-H7 Kreis control
  # so each Kreis's 0/1/2/3+ totals stay EXACTLY the H7 marginal -- only the
  # within-Kreis allocation by income/household type/raumtyp changes. OFF ->
  # legacy per-Kreis MiD-H7 draw (byte-identical). Feeds the F5 fleet generator.
  cars_income_aware: true

  # Distribution-based household_income_eur. ON -> draw the monthly net household
  # income in EUR from the REAL MiD 2023 distribution P(bracket | hh_size,
  # raumtyp) (10 brackets, Niedersachsen base + RegioStaR raumtyp tilt) instead of
  # the coarse 5 class-midpoints x a single INKAR Kreis scalar. The draw is
  # rank-aligned to economic_status (income monotone in the SES anchor, bracket
  # marginal preserved exactly), the open top bracket gets a heavy-tail draw, and
  # INKAR is applied only as a FINE within-region Kreis tilt (scale / mean-scale,
  # no double-count of the already-regional MiD level). household_income (the EUR
  # class label) + high_income are re-derived from the continuous value;
  # economic_status is unchanged. OFF -> legacy class-midpoint x INKAR-scale path
  # (byte-identical household_income_eur). Flows into the A1 MATSim attribute
  # writer (householdIncomeEur) and any income-sensitive downstream model.
  income_eur_from_distribution: true

  # Completeness household attribute housing_tenure {rent, own, other}. ON -> per
  # household a tenure is sampled from P(tenure | income_bracket, raumtyp) (MiD
  # income x Wohnen, NDS base + raumtyp tilt, Bayes-inverted) and written to the
  # MATSim population as the string attribute "housingTenure". It is NOT consumed
  # by the simulation (a completeness attribute, like the HSN/TSN vehicle engine
  # attributes); it is provided for downstream studies. OFF -> the attribute is
  # absent and the population output is byte-identical.
  synthesise_housing_tenure: true

  # A6 (Tier A): condition pt_subscription on student/employment status. ON ->
  # the combined MiD P24.1 Job-/Semesterticket category is zeroed for persons who
  # are neither employed nor studying and the per-person ticket-type vector
  # re-normalised before sampling (a work/study pass requires a work/study
  # relationship). OFF -> the exact legacy 3-margin {Kreis,sex,age} P24.1 IPF
  # (byte-identical). The optional carless<->PT car-availability margin activates
  # only when the MiD P24.1 x Pkw-Verfuegbarkeit cross-tab CSV is present.
  pt_subscription_conditioned: true
  # Dirichlet seed prior (sparse rural cells); 4-way employment margin.
  braunschweig.ipf.dirichlet_prior_strength: 0.5
  braunschweig.ipf.use_employment_margin: true

  # --- Household realism (#3 / #3b), validated this session --------------------
  # Joint age x household-size margin (Zensus 2022 1000A-3082): ties the age and
  # size marginals with the observed correlation. Bounds (15,30,40,50,60).
  braunschweig.ipf.use_joint_age_size_margin: true
  # Age-aware household composition: couples paired by age, children placed with
  # plausibly-aged parents, all-children households hard-blocked. Replaces the
  # legacy random chunk + independent hh_type draw. Needs the size margin (on).
  braunschweig.ipf.age_aware_chunking: true
  # Sex-aware couple pairing: opposite-sex by default, ~1.1% same-sex
  # (Destatis Mikrozensus 2025). The remaining chunking parameters use their
  # calibrated defaults (parent_child_gap_years 31.8, child_parent_age_target_weight
  # 0.85 -> realised mean gap 31.8, same_sex_couple_share 0.011).
  braunschweig.chunking.sex_aware_couples: true

  # --- Secondary-location chain solving: parallelised --------------------------
  # Person activity chains are independent, so the chainsolvers stage shards them
  # across worker processes (the chainsolvers package has no internal
  # parallelism). On the 64-core box this turns the single-core bottleneck of the
  # heaviest synthesis stage into a near-linear speed-up -- essential at 100%
  # (~1.13 M persons). Each shard is seeded deterministically from (random_seed,
  # shard_index), so a run is fully reproducible for a fixed worker count, which
  # is therefore pinned here. 32 mirrors the `processes` memory budget (each
  # worker holds a copy of the secondary-locations table); raise toward 48 if a
  # run shows headroom. Decoupled from `processes` so the chain solve can use a
  # different core count than the memory-bound MATSim mobsim. Default OFF
  # elsewhere keeps the serial path byte-identical.
  braunschweig.chainsolvers.parallel: true
  braunschweig.chainsolvers.processes: 32

  # --- Cross-cordon external demand (Einpendler injection) at 100% --------------
  # Enlarge the OSM network clip by cordon_network_source_buffer_m so motorways reach
  # beyond the cordon, cut the prepared scenario at the cordon (ZGB +
  # cordon_network_buffer_fraction), and inject in-commuter agents (gates derived from
  # the cut network, gravity-placed, Mikrozensus mode restricted to car+PT, outside
  # home via the cutter). Validated end-to-end at 1% and at scale at 25%.
  cordon_enabled: true
  cordon_network_source_buffer_m: 45000     # 45 km network+schedule ring beyond ZGB:
  # drives BOTH data/osm/cleaned (road network) AND data/gtfs/cleaned (transit schedule)
  # via cordon.network_clip.osm_clip_geometry, so PT entry stations are derived from the
  # same extent. 45 km (was 30 km) so Magdeburg Hbf (~35 km E of the ZGB edge, a major
  # Sachsen-Anhalt inbound corridor) is captured as a direct PT entry + eastern road gate;
  # Hannover Hbf (~18 km W) was already inside at 30 km. Larger ring = bigger network
  # (more RAM/runtime). Requires the germany ring pbf for the road side (state-clipped
  # niedersachsen pbf has no roads east of the NDS border regardless of this buffer).
  cordon_network_buffer_fraction: 0.10      # cordon = ZGB + 10% of half-diagonal (~7.6 km)

  gtfs_path: gtfs_cordon   # Germany-wide GTFS (de_full); cut to the enlarged cordon extent
  vrb_stations_path: vrb/stations.json
  osm_path: osm

  # --- Braunschweig region scope (ZGB-8) ---------------------------------------
  braunschweig.political_prefix:
    - "03101"
    - "03102"
    - "03103"
    - "03151"
    - "03153"
    - "03154"
    - "03157"
    - "03158"

  # --- Input data paths (Braunschweig / Niedersachsen) -------------------------
  braunschweig.population_path: braunschweig/12111-0001_population_ni.xlsx
  braunschweig.employment_path: braunschweig/13111-06-02-4.xlsx
  braunschweig.employment_gemband_path: braunschweig/gemband-dlk-0-202506-xlsx.xlsx
  braunschweig.employees_path: braunschweig/13111-01-03-5.xlsx
  braunschweig.work_flow_path:  braunschweig/pendler_ni.xlsx
  braunschweig.pendler_ein_path: braunschweig/statistik_pendler_2026042493412.csv
  braunschweig.pendler_aus_path: braunschweig/statistik_pendler_2026042493430.csv
  braunschweig.zensus_households_path: braunschweig/5000H-2001_de_flat.csv
  braunschweig.inkar_household_income_path: braunschweig/E_Haushaltseinkommen.xls
  braunschweig.inkar_year: latest
  braunschweig.home_density_weighting: true
  braunschweig.buildings_path: braunschweig/buildings
  # Cordon network source: a Germany-wide pbf clipped to the ZGB + 30 km ring
  # (scripts/clip_osm_to_cordon_ring.py). The Geofabrik niedersachsen extract is
  # clipped at the Niedersachsen state border, so east of ZGB (Sachsen-Anhalt:
  # A2 Magdeburg, A39, B188 Wolfsburg, Helmstedt) there are no roads and NO eastern
  # cordon gates are derived. The germany ring pbf reaches ~30 km beyond ZGB in every
  # direction so whole-region gates are created. Requires the clipped pbf to exist
  # (run scripts/clip_osm_to_cordon_ring.py first). See
  # docs/superpowers/plans/2026-06-08-whole-region-cordon-gates-and-pt-bahnhof-entry.md.
  osm_network_path: osm/germany-latest.zgb_ring.osm.pbf

  # External toolchain (Linux paths - installed on PATH, see server setup).
  osmosis_binary: /usr/bin/osmosis
  osmconvert_binary: /usr/bin/osmconvert

# --- Aliases ------------------------------------------------------------------
# Identical to config_server_braunschweig_25pct.yml (education gravity stays OFF
# for this test -> the legacy OSM education replacement is used).
aliases:
  data.census.filtered: braunschweig.ipf.attributed
  synthesis.population.income.selected: braunschweig.synthesis.income
  synthesis.population.spatial.home.zones: braunschweig.synthesis.spatial.home_zones
  synthesis.locations.home.locations: braunschweig.locations.home
  synthesis.locations.education: eqasim_common.locations.education
  synthesis.locations.secondary: braunschweig.locations.secondary
  synthesis.population.spatial.secondary.locations: braunschweig.synthesis.locations.secondary_chainsolvers
  synthesis.locations.work: braunschweig.locations.work
  data.od.weighted: braunschweig.gravity.model
  data.spatial.iris: eqasim_common.data.spatial.iris
  data.spatial.codes: eqasim_common.spatial.entd_codes
  synthesis.population.spatial.primary.locations: eqasim_common.locations.synthesis.replacement
  synthesis.population.enriched: braunschweig.synthesis.population.enriched
  matsim.simulation.prepare: braunschweig.matsim.simulation.prepare
  synthesis.population.spatial.commute_distance: braunschweig.synthesis.spatial.commute_distance
  # Cross-cordon einpendler injection: terminal injection at the MATSim writers
  # (no-op when cordon_enabled=false). Resident synthesis chain untouched.
  matsim.scenario.population: braunschweig.matsim.scenario.population
  matsim.scenario.households: braunschweig.matsim.scenario.households
  matsim.scenario.vehicles: braunschweig.matsim.scenario.vehicles
  matsim.scenario.facilities: braunschweig.matsim.scenario.facilities
