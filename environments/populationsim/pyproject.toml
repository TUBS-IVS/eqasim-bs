# The PopulationSim environment the popsim stage launches (`uv run --no-sync populationsim`).
# It pins the group's PopulationSim fork and, as constraints, the versions of the environment that
# ran production run prod100_20261031, so a run with this environment differs from that run by the
# fork only. Why and how to sync it: docs/codebase/notes/populationsim-fork.md (issue #645).
[project]
name = "eqasim-bs-populationsim"
version = "0.1.0"
description = "PopulationSim environment of the eqasim-bs popsim stage"
requires-python = "==3.12.*"
dependencies = [
    "populationsim",
]

[tool.uv]
package = false
constraint-dependencies = [
    "absl-py==2.3.1",
    "blosc2==3.12.2",
    "certifi==2026.1.4",
    "cffi==2.0.0",
    "charset-normalizer==3.4.4",
    "clarabel==0.11.1",
    "cvxopt==1.3.2",
    "cvxpy==1.7.5",
    "idna==3.11",
    "immutabledict==4.2.2",
    "joblib==1.5.3",
    "llvmlite==0.46.0",
    "markupsafe==3.0.3",
    "msgpack==1.1.2",
    "ndindex==1.10.1",
    "numba==0.63.1",
    "numexpr==2.14.1",
    "numpy==1.26.4",
    "orca==1.8",
    "ortools==9.14.6206",
    "osqp==1.0.5",
    "packaging==26.0",
    "pandas==2.3.3",
    "platformdirs==4.5.1",
    "protobuf==6.31.1",
    "psutil==7.2.1",
    "py-cpuinfo==9.0.0",
    "pyarrow==23.0.0",
    "pycparser==3.0",
    "pyinstrument==5.1.2",
    "python-dateutil==2.9.0.post0",
    "pytz==2025.2",
    "pyyaml==6.0.3",
    "requests==2.32.5",
    "scipy==1.17.0",
    "scs==3.2.11",
    "setuptools==80.10.1",
    "six==1.17.0",
    "tables==3.10.2",
    "toolz==1.1.0",
    "typing-extensions==4.15.0",
    "tzdata==2025.3",
    "urllib3==2.6.3",
]

[tool.uv.sources]
populationsim = { git = "https://github.com/TUBS-IVS/populationsim", tag = "v0.10.0+bs.1" }
