dataset: srv2023_license_by_sex_cohort
title: SrV 2023 car-licence share by sex x age cohort, 18+ (committed aggregate)
inventory_id: E5.4
provider: derived in-repo from SrV 2023 Braunschweig + RGB scientific-use microdata
vintage: 2023 survey year
geography: Braunschweig + Regionalverband Grossraum Braunschweig; rows at three levels
  (total / kreis / stratum). Covers 7 of the 8 ZGB Kreise - Wolfsburg (03103) is not part of
  this survey and never appears.
crs: null
