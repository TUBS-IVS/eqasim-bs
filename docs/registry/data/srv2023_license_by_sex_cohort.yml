    Regenerate with: python scripts/extract_srv_kreis_tables.py [--raw <dir>]
    [--out-dir <dir>], which writes this table together with the other eight committed SrV
    aggregates. Reads SrV2023_Personen.csv (V_ALTER, V_GESCHLECHT, V_FUEHR_PKW,
    GEWICHT_P_ZENSUS) joined to the household file for the Kreis; the raw microdata is
