limitations: |
  Construct: share of persons holding a car driving licence (V_FUEHR_PKW == 1),
  GEWICHT_P_ZENSUS-weighted, per (level, sex, age cohort); cohorts split at age 65 into 18_64
  and 65plus. Universe: V_ALTER >= 18, V_FUEHR_PKW in {1 ja, 2 nein}, V_GESCHLECHT in
  {1 male, 2 female}; V_FUEHR_PKW == -8 (Nicht erhoben) and sex codes 3/4 (divers / keine
  Angabe, 0.13% of respondents) are excluded with a logged rate rather than imputed, because
  the synthesis carries a binary sex and has no comparable counterpart for them.
  The 18+ base is deliberate and differs from the sibling srv2023_car_license_17plus_by_kreis
  table (17+) and from MiD P17.1 (14+): it is the universe the synthesis assigns licences on,
  so no BF17 / minimum-age convention enters a comparison against it.
  Coverage caveat inherited from every SrV table: the sample is a stratified PSU design over
  about 44 selected municipalities, so per-Kreis (and total) rows extrapolate from the sampled
  municipalities to the full Kreis and are ASSUMPTION-grade; per-stratum rows are the
  design-safe level. Thinnest cell 126 unweighted respondents, median 404.
  NOT A CONTROL TARGET, deliberately - see ADR-0094. The 65+ female cell disagrees with MiD by
  about 8pp (89.7% here vs 81.8% in MiD Niedersachsen), and this survey's overall licence level
  sits about 7pp above MiD's, the ADR-0079 identification problem that this project has twice
  declined to arbitrate.
notes: |
  Exists to make licence-structure comparisons like-for-like (issue #322): the committed MiD
  references resolve sex and age as separate marginals, and comparing an overall male-female
  difference against the by-sex marginal produced a spurious "missing 8pp gradient" - the gap
  is a 65+ phenomenon (here +6.7pp) and nearly absent below (here +0.8pp).
  Guarded by tests/test_license_sex_cohort_reference.py: the committed file's cell grid, share
  bounds, the seven-Kreis coverage with Wolfsburg absent, and the cohort-concentration finding;
  the extraction builder is covered on synthetic input, including that an empty cell raises
  instead of being silently dropped.
  Companion table on the donor side: mid2023_license_by_sex_cohort (larger n, but no Kreis
  resolution is possible from the MiD microdata at all).
