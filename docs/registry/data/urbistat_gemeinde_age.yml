acquisition:
  method: scrape
  source: https://urbistat.com (AdminStat tables)
  script: scripts/scrape_urbistat_bs.py
storage:
  expected_path: eqasim-data/data/braunschweig/urbistat_age_gemeinden.csv
  committed: false
  local_only: true
