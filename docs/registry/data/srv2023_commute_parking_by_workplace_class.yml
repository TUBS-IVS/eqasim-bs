dataset: srv2023_commute_parking_by_workplace_class
title: SrV 2023 parking place and payment of car commuters by workplace class (committed aggregate)
inventory_id: null
provider: >-
  TU Dresden, SrV 2023 Braunschweig + RGB scientific-use file SciUse_v4 (the two P2 add-on
  person modules, the person file and the trip file); aggregated in-repo
vintage: 2023 survey year
geography: >-
  Workplace classes inside the ZGB (parking-cost-zones design, spec 2026-09-28, section 3.4):
  Braunschweig split into bs_zentrum, bs_innenbereich and bs_outer (SrV Oberbezirke 1, 2-3 and
  4-6), one class per other ZGB Kreis (03102, 03103, 03151, 03153, 03154, 03157, 03158), plus a
  total row pooling exactly the class rows. Respondents are residents of seven of the eight ZGB
  Kreise, Braunschweig and the six other surveyed Kreise; Wolfsburg (03103) is not surveyed and
  appears as a workplace only, through in-commuters.
crs: null
roles:
- calibration_target
- validation_reference
used_by:
- braunschweig.parking.zones_stage
acquisition:
  method: committed
  source: |
    Regenerate with: python scripts/extract_srv_commute_parking.py --raw <srv2023_raw directory>
    --out-dir eqasim-data/data/braunschweig/srv --source-commit <sha> (one run writes this table
    and srv2023_city_center_parking). Reads the two P2 add-on person modules (local copies
    SrV2023_Personen_Zusatz_Braunschweig.csv and SrV2023_Personen_Zusatz_RGB.csv: V_*_PARKENAPL
    and its follow-ups V_*_PARKENAPL<k>_ENTGELT), SrV2023_Personen.csv (GEWICHT_P_ZENSUS) and
    SrV2023_Wege.csv (WNR, V_ZWECK, V_ZIEL_AGS, V_ZIEL_OBERBEZIRK); the definitions live in
    braunschweig/calibration/srv_parking.py. The raw microdata is local-only (srv2023_raw) and
    never committed; free-text columns are never read.
  script: scripts/extract_srv_commute_parking.py
storage:
  expected_path: eqasim-data/data/braunschweig/srv/srv2023_commute_parking_by_workplace_class.csv
  committed: true
  local_only: false
verification:
  verifier_entry: D8
  notes: |
    Listed as D8 (matsim_only, committed) in scripts/verify_braunschweig_inputs.py. Read by
    braunschweig.parking.zones_stage (config key parking_workplace_shares_path) when
    parking_zones_enabled is true, which configs/base_bs.yml sets since ADR-0139; that stage
    raises for a missing file and for a tariff workplace class without a class row
    (tests/test_parking_zones_stage.py).
    Guarded by tests/test_srv_parking.py: the builders on synthetic
    input (code maps, missing codes, duplicate respondents across the modules, the min_cell_n
    guard, the total row pooling exactly the class rows), the extractor's provenance header on
    synthetic raw files, and the committed file itself (column set, all ten workplace classes,
    share bounds and sums, bs_zentrum as the Braunschweig class with the lowest free share).
requirements:
  synthesis: not_needed
  matsim: required
  production: required
licensing:
  license: derived aggregate of a scientific-use file; no microdata
  restricted: false
  redistribution: allowed
limitations: |
  Construct: GEWICHT_P_ZENSUS-weighted shares of the usual parking place when driving to
  work/education (employer or institution lot, public street, underground/multi-storey garage or
  large lot, other place) and of free versus paid parking, among CURRENT car commuters whose
  first work/education trip (V_ZWECK 1 or 6, lowest WNR) of the survey day ends in the class. The
  question asks for the usual place, not for the survey-day trip. n_eff is the Kish effective
  sample size; it is well below n_unweighted in several classes, so per-class shares carry a
  few percentage points of sampling uncertainty.
  ASSUMPTION A1 (parking-cost-zones design): the free share observed among current car commuters
  applies to all workers/students of the class. Workers who would have to pay can choose another
  mode and may therefore be under-represented among car commuters, so the transferred free share
  may be too high; the design's sensitivity arm parking_workplace_free_share_shift exists for
  this.
  Selection: car commuters without a work/education trip on the survey day (about a third of the
  universe), with a destination outside the ZGB, without a destination AGS, or with a
  Braunschweig destination whose Oberbezirk could not be computed belong to no row; the file
  header states their counts and, for groups of at least min_cell_n respondents, their free
  share next to the total row's.
  Coverage: respondents live in seven of the eight ZGB Kreise, Braunschweig and the six other
  surveyed Kreise (stratified PSU sample of about 44 municipalities, srv2023_covered_municipalities).
  Wolfsburg (03103) residents are not surveyed, so the 03103 row describes in-commuters from the
  surveyed area only; in-commuters from outside the Verbandsgebiet are represented in no row.
  Use as a proxy (ASSUMPTION A1-b, parking cost zones v2, spec Amendment D5): the free-parking draw does NOT use
  the 03103 share (0.9475) for the paid zones of Wolfsburg. That share was measured on in-commuters only and is
  dominated by commuters to the Volkswagen plant, which has its own free parking and lies outside every paid zone,
  while the paid zones are the city centre with paid street parking like the Braunschweig centre. The draw takes
  the share of the class bs_zentrum (Braunschweig Oberbezirk Zentrum, 0.7938, the only centre-specific SrV value)
  instead, through the configuration key parking_free_share_proxy_classes ({"03103": "bs_zentrum"} in
  configs/base_bs.yml; the entry {"03103": null} in a config overlay restores the class share and is the
  sensitivity arm, an overlay {} would not, because overlays are deep-merged). The file itself is
  unchanged and its 03103 row stays what it is, an in-commuter measurement. Salzgitter (03102, 0.9870) and the
  Landkreis towns keep their own class shares. The 2023 survey also predates the TU ticketing of the Parkordnung
  2026, so it cannot supply the free share of the campus work/education persons (ASSUMPTION C2, the configuration key
  parking_campus_free_share, an owner estimate); no row of this file is used for a campus zone.
  Read workplace_class as text: the Kreis keys carry a leading zero.
notes: |
  Issue #249 deliverable. Consumer: braunschweig.parking.zones_stage loads the table (workplace_class
  read as text) and braunschweig.parking.attach.draw_parking_free reads share_free_total of the
  level == class rows as P(free | workplace_class) for the parkingFree draw. The total row is
  informational. scripts/parking/compare_parking_targets.py reads share_free_total of every class row and, since the
  revision below, the PAID-only garage share of the class bs_zentrum (a calibration target of the commuter decay length,
  ADR-0140 decision 12) and of the row 03103 (an independent check) as references of a run comparison.
  Exclusion counts, the selection check, min_cell_n (100 unweighted car commuters per class, a
  smaller class raises instead of being pooled silently) and the SHA-256 of every raw input live
  in the file header, the single place that records them. No class was below the guard in this
  extraction, so no class was pooled.
  Regenerated on 2026-09-30 (code state dcc1c770) only to correct the header's coverage wording:
  the data rows are byte-identical to the extraction of 2026-09-29, but the file hash differs from
  the one the smoke run parking-zones-smoke-zgb-1pct-2026-09-30 recorded in its tariff model
  sources (ef7eaa362bee...).
  Revision of 2026-10-09 (Task 4h fix round 1, ruling R-4h-1; code state fc4fce6e): the table gained eight columns, the
  per-place payment shares share_<place>_<paid|free> for the four places (employer_lot, street, garage_large_lot, other),
  each the weighted fraction of the WHOLE universe of the row that reports the place and its payment (the eight columns sum
  to 1, and share_<place>_paid + share_<place>_free = share_<place>; the payment follow-up V_*_PARKENAPL<k>_ENTGELT of
  the reported place was already read for share_paid_total and share_free_total). The existing ten columns are unchanged in
  meaning and in value (checked cell by cell against the table of 2026-09-30), and the regeneration from the same four raw
  files (identical SHA-256 to the earlier extraction) changes nothing else; the city-centre table is byte-identical apart from
  the generation date and the code state of its header. Reason: the free-inclusive garage share share_garage_large_lot /
  (share_garage_large_lot + share_street) has the free street and garage parkers in its denominator, which the model's
  commuter universe (work and education activities without parkingFree, i.e. payers only) does not contain; the like-for-like
  quantity is share_garage_large_lot_paid / (share_garage_large_lot_paid + share_street_paid): bs_zentrum 0.0965 / (0.0965 +
  0.0456) = 0.679 (of the 221 respondents of the class, 29 report a paid garage or large lot and 13 a paid street, counted on
  the raw delivery), 03103 0.0225 / (0.0225 + 0.0080) = 0.738 (22 and 5 of 691). The paid cells are small, so these shares
  carry a wide sampling uncertainty that is not quantified. SHA-256 of the committed table (LF line endings):
  bff6aa4eade4c8617204adf01867d1591197f9399eb11ad749655e8037e4c8be (the table of 2026-09-30 held ten columns).
