    (tests/test_parking_raw_package_records.py). Members the committed code reads, from the zip and never extracted (member
    SHA-256 verified): data/resident_wolfsburg_address_eligibility.json
    525ac99eeb929bdd067d0012a9759b65f60cc0a81556f871c4cf4bbf1475057c (the 67-row Wolfsburg street list),
    raw_sources/resident_other_cities/peine_zone_street_list.pdf
    c9c2208e3d9106a9f9930a24cc12d52a5153afc215a84059a0936dcc4f16e99f, helmstedt_parking_brochure.pdf
    f1dc902583b195972c7ddd83450be46e273867c07e31509e20ce46d9cce824df and wolfenbuettel_area_map.pdf
    06b2e4e98a19a4d096f1ab20e4eacac3cc70e7b4e7689b885f4d54bfd98ba472 (all in the same folder). Members that the tariff
    corrections of spec v3 B1 were entered from by hand (their values are enforced by the curation checks, not read at run time):
    data/root_findings.json 1b301ca2e92d9787e9cb024a0824e06caa976743001f39a951c8701aa62a070d, research/street_sz_pe_gf.json
    8cb9e9a3ad76068e197b73c1d15bdb7818e225a76d1a72a577d40398676d54c0, research/street_wf_harz.json
    930736c78394185019f00ac1c44d58e3a7d059a4d22411663c656c53183bb37c and research/wob_residents_street.json
    130d1fe080b663e396beb7b96188936173d2d80b70f47a8838b861e1ca7bcf31. No committed code reads any other member; the
