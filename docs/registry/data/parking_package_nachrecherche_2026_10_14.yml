verification:
  verifier_entry: D12
  script: scripts/verify_braunschweig_inputs.py
  notes: >-
    Listed as D12 (optional, restricted, matsim_only) in scripts/verify_braunschweig_inputs.py: only the curation chain needs
    it. A missing file is reported as [RESTRICTED] with the route to obtain it; the SHA-256 is checked by the curation code
    that reads the package, not by the preflight.
requirements:
  synthesis: not_needed
  matsim: not_needed
  production: not_needed
licensing:
  license: >-
    Owner research product; the archived originals keep the terms of their publishers (city ordinances and gazettes are
    official acts, brochures, street lists and maps are city publications; no reuse licence was verified for them). Used by
    owner decision 2026-10-14.
  notes: >-
    The data derived from it and kept in the repository are facts of public rules (the tariff table, the coverage register)
    and, as local restricted files, the zone and district geometry; their licences are stated in their own records
    (parking_tariffs_2026, parking_resident_districts_2026, parking_zones_2026).
  redistribution: restricted
  restricted: true
limitations: >-
  A research package, not an official data set: its statements are the owner's reading of the archived sources and must be
  traced to the source named for them. It says of itself that the Wolfsburg street list proves the entitlement of resident
  ADDRESSES and is not the final delimitation of a permit's parking area, that the Helmstedt effective date of the amended fee
  ordinance (2026-01-01) is an assumption of the package, that an empty maximum-stay field of a Wolfsburg area means unknown
  and not unlimited, and that the Braunschweig monthly-price gaps stay partly open. The v3 data records state how each of
  these is handled (parking_tariffs_2026, parking_resident_districts_2026, parking_zones_2026).
notes: >-
  Used by the parking v3 Part B of issue #436 (ADR-0142): the tariff corrections of the zone table (B1), the resident
  districts of Wolfsburg, Peine, Helmstedt and Wolfenbuettel (B3) and the Salzgitter and Gifhorn findings of the coverage
  register. Registered as a raw source of its own on 2026-10-15; the earlier owner deliveries of 2026-10-01, 2026-10-07,
  2026-10-08 and 2026-10-13 are registered since 2026-10-17 with one record per delivery folder
  (parking_packages_municipal_2026_10_01, parking_packages_municipal_2026_10_07, parking_packages_municipal_2026_10_08 and
  parking_packages_municipal_2026_10_13).
