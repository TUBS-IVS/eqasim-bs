dataset: parking_package_nachrecherche_2026_10_14
title: >-
  Owner research package Parkdaten_Nachrecherche_2026-10-14.zip (parking rules and resident parking of eleven towns, raw
  source of the parking v3 data corrections and the resident districts of four towns)
inventory_id: null
provider: >-
  The owner's (L. Bienzeisler's) research package of 2026-10-14 for issue #436, delivered as one zip: research findings and
  archived original sources (city ordinances, gazettes, brochures, street lists, maps) of eleven towns of the Braunschweig
  region and eight earlier packages. The package states of itself that it is research evidence and no executable tariff
  model. The archived originals belong to their publishers (Stadt Braunschweig, Wolfsburg, Peine, Salzgitter, Helmstedt,
  Wolfenbuettel, Goslar, Seesen, Bad Harzburg, Gifhorn and others, each named with URL and retrieval date in the package)
vintage: >-
  Status 2026-10-14 (the package README states the date). Its sources have their own dates, named per source in the package
  (for example the Wolfsburg resident street list of 2023-07-20, the Peine ordinance as amended 2022-12-22 and effective
  2023-04-01, the Salzgitter ordinance effective 2026-06-25, the Helmstedt brochure of December 2024)
geography: >-
  Braunschweig (monthly products), Wolfsburg, Goslar, Helmstedt, Salzgitter, Peine, Wolfenbuettel, Seesen, Bad Harzburg,
  Braunlage and Gifhorn (the eleven towns of the task list of the package)
crs: null
roles:
- supply_input
- assumption_basis
acquisition:
  method: restricted_delivery
  source: >-
    Owner-supplied file, not downloaded by the pipeline. The package is a research product of the owner; the sources it
    archives are public pages and documents whose URLs, retrieval dates and SHA-256 are listed in its own
    RAW_SOURCE_MANIFEST.json. Obtain it from the owner (open an issue in TUBS-IVS/eqasim-bs) and verify it against the SHA-256
    in storage.notes.
  notes: >-
    194 files below the root directory Parkdaten_Nachrecherche_2026-10-14/: 3 at the root and the rest in 4 folders (data,
    research, raw_sources, scripts). The root files are README.md (German; the findings, the eleven-town table),
    RAW_SOURCE_MANIFEST.json and VALIDATION.json; data/ (5 files: root_findings.json,
    resident_wolfsburg_address_eligibility.json, existing_package_audit.json, helmstedt_effective_date_assumption.json,
    pulp_capacity_observations.json), research/ (street_sz_pe_gf.json, street_wf_harz.json, wob_residents_street.json,
    resident_other_cities.json, bs_monthly_wemolo.json), raw_sources/ (180 archived originals in the sub-folders root,
    street_sz_pe_gf, street_wf_harz, resident_other_cities, wob_residents_street, bs_monthly_wemolo, helmstedt_update) and
    scripts/collect_root_sources.py.
storage:
  expected_path: eqasim-data/data/braunschweig/parking/raw_sources/municipal_2026-10-14/Parkdaten_Nachrecherche_2026-10-14.zip
  committed: false
  local_only: true
  notes: >-
    Not distributed in the repository (the archived originals are third-party documents whose redistribution is not
