    ODbL 1.0, (c) OpenStreetMap contributors, for every polygon whose coordinates depend on OpenStreetMap: through
    an OSM outline (the five BgA car parks including Markthalle, whose outlines are also cut out of bs_zone_ia, and
    the six TU campus areas), OSM street geometry (the street_list_buffer zones: Stadthalle 132, the three
    Parkscheininseln, Salzgitter; the fee-tagged objects of Peine and Helmstedt; the Goslar, Wolfenbuettel and
    Gifhorn hulls from the OSM-derived car network) or a georeference on OSM street centrelines (the Stadthalle concept
    plan behind the Parkscheininseln). The polygons from municipal sources (spec Amendment C) carry the terms of their
    sources: bs_zone_ia and bs_zone_ib: Stadt Braunschweig, published fee zone map (2025-11-26) and Amtsblatt
    2024-04-30 map annex; digitised (owner-supplied package 2026-10-01); working accuracy 25 m; base map Open GeoData
    dl-de/by-2-0. wob_tarifzone_1, wob_tarifzone_2 and wob_tarifzone_3: Stadt Wolfsburg, Geoviewer Themenkarte Parken
    (Stand 12/2024); open reuse licence not verified; used by owner decision 2026-10-01. Which areas are paid
    follows the municipal maps and ordinances (facts of public law; maps of the Stadt Braunschweig, Abt.
    Geoinformation); attribution to the municipalities. The GeoJSON carries both as top-level members (license,
    attribution; assemble_parking_zones.py licence_members names the municipal sources). A rule-based
    osm_fee_erosion polygon (v2 lever 1; none in this release, no core was accepted) is derived from the OSM
    on-street parking and car-park tags of an Overpass response and carries the same terms; the assembly then
    writes the extended licence and attribution members (assemble_parking_zones.py LICENSE_V2, ATTRIBUTION_V2).
    An osm_supply_majority polygon (spec Amendment B; none in this release: B5 failed at the share 0.5, H2 at
    the owner's 0.3) derives from the parking
    tags of the Geofabrik extract and carries the same terms (LICENSE_SUPPLY, ATTRIBUTION_SUPPLY).
  restricted: false
  redistribution: allowed
  notes: >-
    Redistribution must keep the OpenStreetMap attribution and the ODbL share-alike terms of the OSM-derived polygons
    and, for zones 1a and 1b, the attribution 'Datenquelle: Stadt Braunschweig - Open GeoData, 2026, Lizenz:
    dl-de/by-2-0' with the note that the data were changed; the package states that this licence covers the base
    maps of the georeference, not a separately verified release of the zone graphics. The QA table
    parking_zones_2026_qa.csv holds counts and areas derived from the OSM regulation responses and carries the
    OpenStreetMap attribution (ODbL 1.0) in its header, as does the QA table parking_zones_2026_supply_share_qa.csv for
    the counts and areas derived from the Geofabrik extract; the QA table parking_zones_2026_municipal_qa.csv names
    the municipal sources in its header.
limitations: >-
  Centre approximations (not sourced boundaries): tu_zentralcampus, tu_campus_nord, tu_campus_ost_beethovenstrasse,
  tu_campus_ost_langer_kamp, tu_international_house, tu_forschungsflughafen (OSM campus outlines or TU car parks
  standing for the ticketed campus areas), gs_altstadt_zone1 (streets chosen to stand for zone 1, no official street
  list), wf_innenstadt and gf_innenstadt (hulls of centre streets); sz_lebenstedt, pe_innenstadt and he_innenstadt
  are hulls of named streets or fee-tagged car parks, not ordinance extents. Zones 1a and 1b (since spec Amendment
  C, 2026-10-01) are the owner's digitisation of the city's fee zone map of 2025-11-26, not an official GIS export:
  an affine georeference on the Open GeoData city map (fit RMSE 4.53 m, a consistency measure of the matched map
  features, not the boundary accuracy; the 25 m working accuracy is an estimate, not a confidence bound, and the
  reference map itself is stated at +/-15 m); the southern part of 1a, which that map cuts off, is reconstructed from
  the map annex of the Amtsblatt of 2024-04-30 and joined at the crop seam (field reconstructed_section_m2; a newer
  complete boundary of that section was not verified). The v1 tracing of the same map (georeferenced with an RMS of
  4.5 m) missed that southern part. The ParkGO annex map (sec. 2(1); 'Anlage zur ParkGO', published on page 3 of
  2_08_Parkgebuehrenordnung_2025.pdf) also draws zone II, which stays unzoned apart from the three Parkscheininseln
  (free by Z1): the annex could not be georeferenced to an RMS of 10 m or better (best affine fit at about 3.7 m per
  pixel: 11.1 m RMS between the v1 1a/1b outline and the annex zone lines, 26.8 m RMS at the five BgA car parks as
  check points), and the owner's package does not cover zone II. The Wolfsburg tariff zones (spec Amendment C2) rest
  on ASSUMPTION C-a, 50 m around the city's Handyparkzonen street sections; these are the city's phone-parking areas
  (layer Stand 12/2024), not a complete map of its paid parking (the package: outside the polygons neither free
  parking nor a ban may be inferred), so outside the three zones parking is free by Z1, and where the 50 m areas of
  two tariff zones overlap each point belongs to the tariff zone of its nearest section (no choice between nearby
  sections is modelled). The Goslar comparison (spec Amendment C4) is a cross-check, not a validation of the centre
  approximation: the service data were last edited in 2018 and carry no tariffs. The Parkscheininseln follow the blue kerb lines of the Stadthalle concept plan
  (file 202308-Beschilderung-Bestand-PRMK-Stadthalle), which the city labels an overview only (signage on site
  governs). Not digitised: resident zones 120B and 330B, the permit districts A/B/C, ParkGO zone II apart from the
  Parkscheininseln, the BgA car park Willy-Brandt-Platz, TU Volkmaroder Strasse (ticketed from 2026-10-01) and
  Bevenroder Strasse, Goslar zone 2 (see the coverage register). The five BgA car-park polygons contain no activity
  of the local 1 % scenario; activities are located at buildings, so a car park without buildings rarely carries a
  destination. v2 lever 1 (2026-09-30, fix round 1) accepted no rule-based core, so every approximation and gap
  above stays: gs_altstadt_zone1, wf_innenstadt and gf_innenstadt remain centre approximations, ParkGO zone II and
  the southern part of zone 1a remain unzoned, and the Wolfsburg, Peine, Helmstedt and Salzgitter polygons are
  unchanged (QA only); the southern part of zone 1a and the Wolfsburg polygon changed only with the municipal data of
  spec Amendment C (above). Why the cores are empty (parking_zones_2026_qa.csv and the local QA files under
  raw_overpass/derived_fix_round_1/, reproducible from the raw responses): (1) in all eight towns erode(fill(R),
  250 m) is already empty before F is subtracted (eroded_filled_area_m2 0): R is a set of 50 m wide strips along
  the regulated ways (in Braunschweig 778 regulated ways, 768 of them with no paid or restricted side: 511
  forbidden on both sides, 125 with a free other side, 92 with a side mapped separately and 40 with an untagged
  one; no street is paid by its own tags, because the 8 fee-tagged ways map their paid side separately and the fee
  sits on the 415 paid street-side areas; side_class_pairs of 03101000_qa_w250_b25_l10_h20000_i10000.json), and
  kerbside streets without any parking tag and pedestrian streets (which the regulation query does not fetch) leave
  the blocks open. (2) The fill cap Q3 binds whatever the tagging: with every fetched kerbside street counted as
  regulated (the diagnostic counterfactual --all-kerbside-streets-regulated adds 2,100 of the 2,835 kerbside
  streets to the 778 regulated ways), erode(fill(R), 250 m) inside the annex zones is only 858 m2 (Ia 8, Ib 0, II
  850) at the pre-registered 2 ha cap and 1.161 km2 (Ia 0.427, Ib 0.294, II 0.440) at a 10 ha cap (python
  scripts/build_parking_zones_from_osm.py --regulation --ags 03101000 --bbox 52.2330,10.4980,52.2800,10.5870
  --from-raw raw_overpass/03101000_regulation_overpass_2026-09-30.json --reference-outline
  raw_sources/bs_2_08_annex_zones_georeferenced.geojson --all-kerbside-streets-regulated
  [--maximum-filled-hole-m2 100000] --out-dir <dir>; note column of the Braunschweig row): better OSM tagging alone
  cannot produce the ParkGO zones under Q3 = 2 ha. The tagging completeness of rule Q4 is measured inside fill(R),
  which is built from tagged ways, and overstates the mapping of the ordinance areas (Braunschweig 0.733 inside
  fill(R) against 0.364 inside the annex zones, column reference_tagging_completeness). ASSUMPTION (no fee tag =
  free): a parking side or a street-side area without any fee tag counts as free supply; in Braunschweig 363 of the
  372 ways with a free side and 439 of the 839 free street-side areas rest on it (free_segments_without_fee_tag,
  free_street_side_areas_without_fee_tag), and inside the annex zones OSM makes 15 (Ia), 12 (Ib) and 47 (II) ways
  free on a side, 72 of them only by that assumption, next to 269, 183 and 1 paid street-side areas (column
  reference_conflicts names them per zone; conflicts are resolved by the source, not by the script). At the
  sensitivity arms W = 150 m and 400 m no town gives a core (Braunschweig at 150 m: erode(fill(R)) 294 m2, Z 0 once
  F is subtracted). The majority rule over the parking supply of spec Amendment B (2026-09-30) was not applied
  either, because its pre-registered validation B5 failed in Braunschweig (recall 0.696 below 0.70 after the
  correction of fix round 1; decided by the reading of parking:<side>=yes, see the interpretations under
  acquisition), so the same approximations and gaps stay. At the share 0.5 its Braunschweig rule covers
  92.5 % of the ordinance
  polygon of zone Ia (89.0 % of the annex zone Ia, which includes the southern Ia) and 12.5 % of the annex zone II
  (the station quarter), but only 36.1 % of zone Ib (the Wallring), where OSM maps much free street parking; 0.677
  of its 3.183 km2 lie outside every annex zone. Behind every cell lie the assumptions B-a (79.0 % of the free
  street capacity of the Braunschweig box has no fee tag), B-c (30.0 % of its public off-street capacity is
  excluded for lack of a fee tag) and B-d (66.8 % of the usable capacity comes from the heuristic); columns
  free_street_spaces_without_fee_tag_share, offstreet_spaces_without_fee_tag_share and heuristic_capacity_share of
  parking_zones_2026_supply_share_qa.csv. With the owner's post hoc share 0.3 (owner decision 2) H1 passes in
  Braunschweig (recall 0.883, precision 0.856), but the pre-registered holdout check H2 fails on the pooled precision
  (0.314 against 0.70): in Salzgitter, Wolfsburg, Peine and Helmstedt only 22 % to 54 % of the rule inside the query
  box lies inside the reference polygon (partly areas the references do not cover, such as the Autostadt car parks in
  the Wolfsburg box), so the rule is still applied nowhere and the approximations and gaps above stay; no arm of
  owner decisions 2 and 3 (S, T, S+T) passes H2 either.
