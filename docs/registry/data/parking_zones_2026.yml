    outlines are OSM-derived (ODbL 1.0; the licence and attribution members name them). Reproducibility: two independent
    runs of the step on the release before the step give the identical zone file and QA table. SHA-256 (LF):
    parking_zones_2026.geojson 4008d609c2791cefd2b912b1e058875947f6b42e608da209f5cc84f3995d9490 (before:
    0bf44df5588171bc0edd05e31f3ecdcaf1a96a3e3d14c3dd6eb76e348e975ba4; the 37 other features are unchanged text),
    parking_zones_2026_municipal_qa.csv e79dd6f36ebd0681d73dff4f44473dbda25937ced3fc2a75df34f65def0a718e (before:
    3b2dfc1c9e698385f321fee1a3f78c03c6df4e8525538b43b5787607a52f2595). The raw inputs of the earlier steps of the chain
    (the OSM-derived car network output_bs and the cached municipality polygons) are not on this machine, so the whole
    chain was not re-run from scratch for this task; the step is additive by design and reads only the finished release.
    The municipality containment check against the pipeline's VG250 polygons could not run (the cached polygons are not on
    the machine), so the review used a substitute: all three zones lie 100 % inside the OSM boundary of Braunschweig
    (relation 62531, read from the pinned Niedersachsen PBF), with a margin of 3.4 to 3.65 km to the boundary;
    assemble_parking_zones.check_municipality_containment stays the pipeline check and runs at the next full chain run.
    The deck point of the Wolfsburg garage lies inside wob_tarifzone_1 (checked). The command must write the zone file
    under the name parking_zones_2026.geojson (the GeoJSON 'name' member follows the file name, so another name does not
    regenerate the release byte for byte; the step refuses another name).
