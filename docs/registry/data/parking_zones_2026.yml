    source of the garage products of plan Task 4); each holds a German readme, metadata and quality JSON,
    GeoPackage layers in EPSG:25832, GeoJSON in EPSG:4326, the original service responses and the export scripts.
    The curation step scripts/curation/parking_zones_2026/municipal_zones.py, run as assemble_parking_zones.py with
    the v1 inputs and --municipal-dir raw_sources/municipal_2026-10-01 --municipal-qa-out
    parking_zones_2026_municipal_qa.csv --municipal-tariffs parking_tariffs_2026.csv (no erosion or supply inputs:
    neither rule was applied), refuses a zip whose SHA-256 differs from the pinned one, reads the GeoPackage layers
    straight from the zips (GDAL /vsizip/, no extracted copy) and checks the attributes the provenance states (the
    working accuracy 25 m and the map dates of the Braunschweig layer, the Wolfsburg layer Stand 2024-12, the Goslar
    last edit 2018-11-22). C1: zones 1a and 1b of Braunschweig_Parkzonen.gpkg (layer parking_fee_zones; digitised by
    the owner from the city's fee zone map of 2025-11-26, the image the v1 tracing used, with an affine georeference
    on the Open GeoData city map 1:20,000 of March 2025, and for the southern part of 1a, which that map cuts off,
    from the map annex of the Amtsblatt of 2024-04-30) replace the geometry of bs_zone_ia and bs_zone_ib;
    geometry_source stays ordinance_map, the tariff rows stay, and the v1 precedence still cuts the five BgA car parks
    out of bs_zone_ia (no other zone overlaps 1a or 1b). The field reconstructed_section_m2, the flag of C1, holds the
    area of each of the two polygons inside the package layer reconstructed_section (0 for 1b). ParkGO zone II stays
    unzoned (the package does not cover it). C2: wob_innenstadt is replaced by wob_tarifzone_1, wob_tarifzone_2 and
    wob_tarifzone_3 (geometry_source municipal_street_sections_buffered, provenance section_buffer_m), each the area
    within 50 m (ASSUMPTION C-a: the access walk from the destination to a paid street section) of the street
    sections of its tariff zone (layer mobile_parking_areas, the city's Handyparkzonen: 73 sections in tariff zones
    1, 2 and 3). Where the 50 m areas of two tariff zones overlap (zones 1 and 2 only), the nearer street section
    decides: a generalised Voronoi split of the section boundaries sampled every 1 m (the split line lies within
    0.5 m of the exact one), each tariff zone competing with its sections minus those of every higher tariff, so
    that ties (overlapping sections and the points equidistant from both) go to the higher hourly rate; the zones are
    then simplified by 0.5 m and cut in tariff order with the 5 cm clearance of the rule-based sources, and parts below
    20 m2 are dropped (the sliver rule of every v1 zone, not the 1 ha island rule Q2 of the OSM rule cores; none
    occurred). The three Wolfsburg tariff rows come from the section attributes (data record parking_tariffs_2026).
    C4: gs_altstadt_zone1 stays (centre approximation); the resident and facility areas of the Goslar service are
    compared with it. Every area and overlap (the package zones against the v1 tracings, both before the precedence
    cuts; the release polygons against the package; the Wolfsburg zones against wob_innenstadt, their 50 m areas
    and the contested part; the Goslar cross-check) is in the committed QA table parking_zones_2026_municipal_qa.csv
    (its header defines every column; the release areas are measured in the written zone file). Re-running the chain
    without --municipal-dir reproduces the release before this step byte for byte (SHA-256
    146af05ce1b50bdc02208dec7bf68390827a06c7e6d94fd75e687bc197f8bba0, unchanged from the v1 review fix round, which
    cut the Parkscheininseln out of zone 132, up to this step); with it, this file. The QA tables of lever 1 (parking_zones_2026_qa.csv)
    and of Amendment B (parking_zones_2026_supply_share_qa.csv and the release parking_paid_share_2026) were computed
    against that earlier release and stay as they are: their v1 references (bs_zone_ia and bs_zone_ib for B5 and H1,
    wob_innenstadt among the H2 holdout references) are the polygons of the release before Amendment C, so re-deriving
    them needs that file.
