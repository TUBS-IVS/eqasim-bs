dataset: parking_zones_2026
title: Parking cost zone polygons of the ZGB, first release (24 zones in eight municipalities)
inventory_id: null
provider: >-
  Own digitisation (issue #249) from public sources: City of Braunschweig parking-zone overview map and
  BgA Entgeltordnung annex maps, the city's resident parking concept plans, TU Braunschweig GB3 parking pages,
  OpenStreetMap (Overpass API) and the municipal parking pages of Wolfsburg, Salzgitter, Peine, Goslar,
  Wolfenbuettel, Gifhorn and Helmstedt
vintage: >-
  Sources retrieved and zones digitised on 2026-09-29; OSM base timestamps 2026-09-29T05:10Z to 05:13Z;
  target world September 2026 (design spec decision 1).
geography: >-
  Paid-parking areas of Braunschweig (ParkGO zones Ia and Ib, five BgA car parks, resident concept Stadthalle
  zone 132 and its three Parkscheininseln, six TU campus areas), Wolfsburg Innenstadt, Salzgitter-Lebenstedt,
  Peine, Goslar Altstadt zone 1, Wolfenbuettel, Gifhorn and Helmstedt town centres
crs: EPSG:25832 (stored as WGS84 GeoJSON)
roles:
- spatial_input
used_by:
- braunschweig.parking.zones_stage
acquisition:
  method: committed
  source: >-
    https://www.braunschweig.de/leben/stadtplan_verkehr/parken-in-braunschweig/parken-in-der-innenstadt.php
    (zone map), https://www.braunschweig.de/politik_verwaltung/politik/stadtrecht/2_09_Entgeltordnung-BgA-Parkraumbewirtschaftung.pdf,
    https://www.braunschweig.de/leben/stadtplan_verkehr/parken-in-braunschweig/parkraummanagement.php,
    https://www.tu-braunschweig.de/gb3/parkraumbewirtschaftung/parkbereiche, https://overpass-api.de/api/interpreter
  script: scripts/build_parking_zones_from_osm.py
  notes: >-
    Hand curation, not reproducible by one command (the curation scripts named below re-create the file from
    the gitignored raw inputs). Every feature carries geometry_source
    (street_list_buffer = named streets of a municipal source buffered 15 m and dissolved; osm_fee_tags =
    fee-tagged OSM parking objects; centre_approximation = a polygon around a town centre or campus whose
    extent the digitising_note justifies; ordinance_map = extent set by a municipal zone map or ordinance
    annex: traced from the map for zones 1a/1b, the OSM outline of the lot the BgA annex marks for Markthalle),
    source_url, source_date, digitised_on and a digitising_note with the method and all parameters (buffers, windows,
    closing distances, OSM ids, the affine of the georeferenced Braunschweig zone map). Raw inputs kept locally
    (gitignored) under eqasim-data/data/braunschweig/parking/raw_overpass/ (one Overpass response per
    municipality, written by scripts/build_parking_zones_from_osm.py) and raw_sources/ (retrieved pages and
    documents; SHA-256 of the zone map image 20251126_Karte-Parkzone-Innenstadt-a-b-2025-01 94a8d46e...,
    of the BgA order 50444731..., of the Stadthalle concept plan ac9275bf..., of the ParkGO 59957701...). The
    Overpass QL of the five successful requests (03101000, 03102000, 03103000, 03154028, 03157006; bounding boxes
    and tag filters only, no OSM data), which the builder writes next to each response as
    <ags>_overpass_2026-09-29.query.txt, is committed under scripts/curation/parking_zones_2026/overpass_queries/;
    the raw responses stay local. The
    one-off curation scripts that produced the geometry are committed under scripts/curation/parking_zones_2026/
    (not pipeline stages; they read the gitignored raw inputs): georeference_zone_map.py (chamfer fit of the
    zone map to OSM centrelines) and extract_braunschweig_zone_map.py (pixel masks of the dotted 1a outline and
    the green 1b fill), digitise_stadthalle_fee_islands.py (the three Parkscheininseln: the blue kerb lines of the
    Stadthalle concept plan, georeferenced on nine street junctions in stadthalle_plan_control_points.json, matched
    to the named OSM ways) and assemble_parking_zones.py (all polygons, precedence, municipality containment, the
    licence members). Re-run in the review fix round (2026-09-30), they reproduce the zone-map affine and the
    coordinates of every polygon of the first commit exactly, except zone 132, from which two fee islands are now
    cut out.
    Overpass requests for Goslar, Wolfenbuettel and Gifhorn failed (HTTP 504) and were not repeated; their
    centre polygons use the OSM-derived car network of the local MATSim scenario eqasim-data/output_bs
    (2026-04-29) instead. Overlaps are resolved by precedence (BgA car parks and the International House lots
    cut out of Ia and the campus areas, the Parkscheininseln cut out of zone 132), so no two zones overlap by more
    than 1 m2.
    Rule-based geometry, parking cost zones v2 lever 1 (issue #436, spec amendments A1 and A2, 2026-09-30; fix
    round 1 rulings R-T1-e to R-T1-g):
    scripts/build_parking_zones_from_osm.py --regulation sent one regulation request per municipality (every
    kerbside street, every highway way with a parking:* key and every car park of a centre box, with all tags;
    5 s courtesy pause, up to three attempts with 60 and 120 s backoff; the seven failed attempts, HTTP 429 and
    504, are appended to raw_overpass/overpass_failures.log, Peine answered only to a second invocation) for
    Braunschweig, Goslar, Wolfenbuettel and Gifhorn (cores that may replace polygons) and for Wolfsburg, Peine,
    Helmstedt and Salzgitter (QA only). The raw responses <ags>_regulation_overpass_2026-09-30.json (OSM base
    2026-09-30T14:24Z to 14:38Z) stay local; their query texts are committed next to the v1 ones under
    scripts/curation/parking_zones_2026/overpass_queries/. The committed QA table was re-derived from these
    responses without any new request (--from-raw) into raw_overpass/derived_fix_round_1/, where every output
    carries its parameter tag (<ags>_qa_w250_b25_l10_h20000_i10000.json, <ags>_core_..., <ags>_regulated_...,
    and the two diagnostic Braunschweig files ..._allstreets.json) and is replaced only with --overwrite; the
    untagged <ags>_{regulated,core,qa} files and the tagged files in raw_overpass/ itself are superseded
    intermediate outputs (before ruling R-T1-e and the paid-area report), no input of the committed table.
    braunschweig.parking.zone_geometry built each core: R = the ways with a paid, restricted or forbidden side
    buffered 25 m plus the paid or restricted parking objects (car parks and separately mapped street-side areas)
    buffered 10 m; holes up to 2 ha filled; F = the ways with a free side plus the free public street-side areas;
    a side mapped separately (parking:<side>=separate) is neither R nor F, its separately mapped area decides by
    its own class (R-T1-e); Z = erode(fill(R), 250 m) minus the 250 m buffer of F, parts below 1 ha dropped; the
    pre-registered acceptance rule Q4 (core >= 1 ha and tagging completeness >= 60 %) decided. Braunschweig was
    compared with the ParkGO annex outlines (scripts/curation/parking_zones_2026/extract_parkgo_annex_zones.py
    with the v1 page-3 affine parkgo_annex_affine.json; that parameter file is the only record of the v1 fit,
    whose line mask exists only in the v1 scratch area: the committed extractor needs a darkness threshold of 100
    on the rendering in raw_sources where the v1 mask used 60 on another rendering, so the fit cannot be re-run
    from the repository), the other towns with their v1 polygons. An accepted Braunschweig core would be cut by
    every v1 zone and each remaining piece assigned WHOLE to the annex zone it overlaps most (bs_zone_ia_sued,
    bs_zone_ii; R-T1-f, the annex is never a clipping geometry), pinned with the rest of the accepted path by
    tests/test_parking_zone_assembly.py on synthetic inputs. Counts, areas, ordinance conflicts, diagnostics and
    decisions are the committed QA table parking_zones_2026_qa.csv (assemble_parking_zones.py --erosion-dir
    raw_overpass/derived_fix_round_1 --counterfactual-qa <the two _allstreets files>; its header defines every
    column); the assembly refuses QA inputs without the pre-registered parameters (W 250 m, fill 20,000 m2,
    islands 10,000 m2, buffers 25 and 10 m) or with a counterfactual. No core was accepted, so no polygon changed:
    re-running the whole chain (georeference_zone_map.py, extract_braunschweig_zone_map.py,
    digitise_stadthalle_fee_islands.py, then assemble_parking_zones.py with the v2 cores) reproduces this file
    byte for byte.
storage:
  expected_path: eqasim-data/data/braunschweig/parking/parking_zones_2026.geojson
  committed: true
  local_only: false
  notes: >-
    Force-added (git add -f) like the other committed reference tables, as is the curation QA table
    parking_zones_2026_qa.csv next to it (v2 lever 1; read by scripts/validate_parking_zones.py, not by any
    stage); eqasim-data/ is ignored by default.
verification:
  verifier_entry: D5
  script: scripts/validate_parking_zones.py
  notes: >-
    Listed as D5 (matsim_only, committed) in scripts/verify_braunschweig_inputs.py; read by
    braunschweig.parking.zones_stage when parking_zones_enabled is true (configs/base_bs.yml since
    ADR-0139).
    braunschweig.parking.zones.load_zone_polygons reprojects to EPSG:25832, repairs invalid rings (0 on
    2026-09-30), checks provenance fields and pairwise overlap <= 1 m2; tests/test_parking_zones.py
    (test_committed_parking_data_is_valid, test_committed_zones_carry_real_provenance_only,
    test_committed_zones_carry_the_licence_notice, test_committed_parking_files_are_ascii,
    test_committed_parkscheininseln_are_street_paid_zones_cut_out_of_the_resident_zone) runs the validator and
    pins the licence members, ASCII text and the cut-out islands of the committed files.
    Since v2 lever 1 the validator also prints the geometry-source mix by area and, where the QA table exists
    (required as soon as a polygon has geometry_source osm_fee_erosion, whose unavoidable_walk_m and
    osm_timestamp load_zone_polygons requires for that source only), checks it against the polygons
    (braunschweig.parking.zones.validate_zone_qa) and re-applies rule Q4 and the pre-registered parameters to
    every row with a response; tests/test_parking_zones.py (test_osm_fee_erosion_zones_need_walk_and_snapshot_provenance,
    test_zone_qa_table_is_cross_checked_against_the_polygons, test_validator_reapplies_the_acceptance_rule_to_the_qa_table),
    tests/test_parking_zone_geometry.py (construction, tag classification, ordinance conflicts, the curation aid
    offline, parameter-tagged outputs) and tests/test_parking_zone_assembly.py (the accepted-core path of the
    assembly) pin it.
requirements:
  synthesis: not_needed
  matsim: required
  production: required
licensing:
  license: >-
    ODbL 1.0 for the whole file, (c) OpenStreetMap contributors: the coordinates of every polygon depend on
    OpenStreetMap, through an OSM outline (the five BgA car parks including Markthalle, the six TU campus areas),
    OSM street geometry (the street_list_buffer zones: Stadthalle 132, the three Parkscheininseln, Salzgitter;
    the fee-tagged objects of Wolfsburg, Peine and Helmstedt; the Goslar, Wolfenbuettel and Gifhorn hulls from the
    OSM-derived car network) or a georeference on OSM street centrelines (zones 1a and 1b, and the Stadthalle
    concept plan behind the Parkscheininseln). Which areas are paid follows the municipal maps and ordinances
    (facts of public law; maps of the Stadt Braunschweig, Abt. Geoinformation); attribution to the
    municipalities. The GeoJSON carries both as top-level members (license, attribution). A rule-based
    osm_fee_erosion polygon (v2 lever 1; none in this release, no core was accepted) is derived from the OSM
    on-street parking and car-park tags of an Overpass response and carries the same terms; the assembly then
    writes the extended licence and attribution members (assemble_parking_zones.py LICENSE_V2, ATTRIBUTION_V2).
  restricted: false
  redistribution: allowed
  notes: >-
    Redistribution must keep the OpenStreetMap attribution and the ODbL share-alike terms (whole file). The QA
    table parking_zones_2026_qa.csv holds counts and areas derived from the OSM regulation responses and carries
    the OpenStreetMap attribution (ODbL 1.0) in its header.
limitations: >-
  Centre approximations (not sourced boundaries): tu_zentralcampus, tu_campus_nord, tu_campus_ost_beethovenstrasse,
  tu_campus_ost_langer_kamp, tu_international_house, tu_forschungsflughafen (OSM campus outlines or TU car parks
  standing for the ticketed campus areas), gs_altstadt_zone1 (streets chosen to stand for zone 1, no official street
  list), wf_innenstadt and gf_innenstadt (hulls of centre streets); sz_lebenstedt, pe_innenstadt and he_innenstadt
  are hulls of named streets or fee-tagged car parks, not ordinance extents. Zones 1a and 1b are traced from the
  city's overview map of the two zones (georeferenced with an RMS of 4.5 m), not from the map that defines them: the
  ParkGO annex map (sec. 2(1); 'Anlage zur ParkGO', published on page 3 of 2_08_Parkgebuehrenordnung_2025.pdf) also
  draws zone II and the part of zone 1a south of the overview map, but it was not digitised in v1 because it could
  not be georeferenced to an RMS of 10 m or better (best affine fit at about 3.7 m per pixel: 11.1 m RMS between the
  1a/1b outline and the annex zone lines, 26.8 m RMS at the five BgA car parks as check points). Hence bs_zone_ia
  misses the part of zone 1a south of the overview map, and zone II is not zoned apart from the three
  Parkscheininseln (free by Z1). The Parkscheininseln follow the blue kerb lines of the Stadthalle concept plan
  (file 202308-Beschilderung-Bestand-PRMK-Stadthalle), which the city labels an overview only (signage on site
  governs). Not digitised: resident zones 120B and 330B, the permit districts A/B/C, ParkGO zone II apart from the
  Parkscheininseln, the BgA car park Willy-Brandt-Platz, TU Volkmaroder Strasse (ticketed from 2026-10-01) and
  Bevenroder Strasse, Goslar zone 2 (see the coverage register). The five BgA car-park polygons contain no activity
  of the local 1 % scenario; activities are located at buildings, so a car park without buildings rarely carries a
  destination. v2 lever 1 (2026-09-30, fix round 1) accepted no rule-based core, so every approximation and gap
  above stays: gs_altstadt_zone1, wf_innenstadt and gf_innenstadt remain centre approximations, ParkGO zone II and
  the southern part of zone 1a remain unzoned, and the Wolfsburg, Peine, Helmstedt and Salzgitter polygons are
  unchanged (QA only). Why the cores are empty (parking_zones_2026_qa.csv and the local QA files under
  raw_overpass/derived_fix_round_1/, reproducible from the raw responses): (1) in all eight towns erode(fill(R),
  250 m) is already empty before F is subtracted (eroded_filled_area_m2 0): R is a set of 50 m wide strips along
  the regulated ways (in Braunschweig 778 regulated ways, 768 of them with no paid or restricted side: 511
  forbidden on both sides, 125 with a free other side, 92 with a side mapped separately and 40 with an untagged
  one; no street is paid by its own tags, because the 8 fee-tagged ways map their paid side separately and the fee
  sits on the 415 paid street-side areas; side_class_pairs of 03101000_qa_w250_b25_l10_h20000_i10000.json), and
  kerbside streets without any parking tag and pedestrian streets (which the regulation query does not fetch) leave
  the blocks open. (2) The fill cap Q3 binds whatever the tagging: with every fetched kerbside street counted as
  regulated (the diagnostic counterfactual --all-kerbside-streets-regulated adds 2,100 of the 2,835 kerbside
  streets to the 778 regulated ways), erode(fill(R), 250 m) inside the annex zones is only 858 m2 (Ia 8, Ib 0, II
  850) at the pre-registered 2 ha cap and 1.161 km2 (Ia 0.427, Ib 0.294, II 0.440) at a 10 ha cap (python
  scripts/build_parking_zones_from_osm.py --regulation --ags 03101000 --bbox 52.2330,10.4980,52.2800,10.5870
  --from-raw raw_overpass/03101000_regulation_overpass_2026-09-30.json --reference-outline
  raw_sources/bs_2_08_annex_zones_georeferenced.geojson --all-kerbside-streets-regulated
  [--maximum-filled-hole-m2 100000] --out-dir <dir>; note column of the Braunschweig row): better OSM tagging alone
  cannot produce the ParkGO zones under Q3 = 2 ha. The tagging completeness of rule Q4 is measured inside fill(R),
  which is built from tagged ways, and overstates the mapping of the ordinance areas (Braunschweig 0.733 inside
  fill(R) against 0.364 inside the annex zones, column reference_tagging_completeness). ASSUMPTION (no fee tag =
  free): a parking side or a street-side area without any fee tag counts as free supply; in Braunschweig 363 of the
  372 ways with a free side and 439 of the 839 free street-side areas rest on it (free_segments_without_fee_tag,
  free_street_side_areas_without_fee_tag), and inside the annex zones OSM makes 15 (Ia), 12 (Ib) and 47 (II) ways
  free on a side, 72 of them only by that assumption, next to 269, 183 and 1 paid street-side areas (column
  reference_conflicts names them per zone; conflicts are resolved by the source, not by the script). At the
  sensitivity arms W = 150 m and 400 m no town gives a core (Braunschweig at 150 m: erode(fill(R)) 294 m2, Z 0 once
  F is subtracted).
notes: >-
  Validator summary on the committed files (scripts/validate_parking_zones.py --data-path eqasim-data/data,
  2026-09-30, after v2 lever 1): 24 zones, 24 tariff rows, 131 register rows (123 municipalities); zone_type
  campus 6, resident_zone 1, street_paid 17; geometry_source centre_approximation 9 (1.952 km2, 30.9 % of the
  zone area), ordinance_map 3 (2.368 km2, 37.5 %), osm_fee_tags 7 (1.268 km2, 20.1 %), street_list_buffer 5
  (0.733 km2, 11.6 %), osm_fee_erosion 0; zone QA 8 municipalities, q4_decision rejected 8, applied none;
  fee_window_source assumption 8, municipal_page 10, ordinance 6; per municipality
  03101000 Braunschweig 17 zones 3.048 km2, 03102000 Salzgitter 1 zone 0.574 km2, 03103000 Wolfsburg 1 zone
  0.592 km2, 03151009 Gifhorn 1 zone 0.284 km2, 03153017 Goslar 1 zone 0.642 km2, 03154028 Helmstedt 1 zone
  0.326 km2, 03157006 Peine 1 zone 0.343 km2, 03158037 Wolfenbuettel 1 zone 0.513 km2; register status zoned 8,
  no_paid_parking_known 0, not_audited 115, excluded 8; OK. Curation check, not a validation: assign_zones over
  the 47,362 activities of the local 1 % scenario eqasim-data/output_bs (2026-04-29) puts 1,950 (4.1 %) into a
  zone (Ia 375, Ib 220, Stadthalle 132 46, Parkscheininsel Marthastrasse/Koernerstrasse 13, the other two
  islands 0, TU campuses 274 of which 201 education and 44 work, Wolfsburg 283, Goslar 245, Peine 131,
  Wolfenbuettel 125, Helmstedt 115, Salzgitter 98, Gifhorn 25, BgA car parks and International House 0).
  Tariffs: parking_tariffs_2026; coverage: parking_coverage_register_2026.
