    QA rows; byte-identical re-runs; the licence wording), the exposure check by tests/test_parking_zone_exposure.py,
    and the committed release by tests/test_parking_zones.py
    (test_committed_braunschweig_zones_follow_spec_amendment_d1,
    test_committed_d3_sites_are_single_site_zones_with_sourced_tariffs,
    test_committed_register_records_the_regional_audit_of_spec_amendment_d3,
    test_committed_texts_do_not_claim_that_the_detection_zones_include_the_buildings,
    test_validator_rejects_a_single_site_zone_with_a_campus_geometry_source).
