verification:
  verifier_entry: D5
  script: scripts/validate_parking_zones.py
  notes: >-
    Listed as D5 (matsim_only, committed) in scripts/verify_braunschweig_inputs.py; read by
    braunschweig.parking.zones_stage when parking_zones_enabled is true (configs/base_bs.yml since
    ADR-0139).
    braunschweig.parking.zones.load_zone_polygons reprojects to EPSG:25832, repairs invalid rings, checks
    provenance fields and pairwise overlap <= 1 m2; the committed file must need no repair: the validator and the
    assembly reload it with max_repairs=0, which raises on any invalid polygon (0 repairs since fix round 1 of Task
    1d, 2026-10-01; the first Amendment C release held an invalid wob_tarifzone_2 that every load repaired);
    tests/test_parking_zones.py (test_committed_parking_data_is_valid, test_committed_zones_carry_real_provenance_only,
    test_committed_zones_carry_the_licence_notice, test_committed_parking_files_are_ascii,
    test_committed_parkscheininseln_are_street_paid_zones_cut_out_of_the_resident_zone) runs the validator and
    pins the licence members, ASCII text and the cut-out islands of the committed files.
    Since v2 lever 1 the validator also prints the geometry-source mix by area and, where the QA table exists
    (required as soon as a polygon has geometry_source osm_fee_erosion, whose unavoidable_walk_m and
    osm_timestamp load_zone_polygons requires for that source only), checks it against the polygons
    (braunschweig.parking.zones.validate_zone_qa) and re-applies rule Q4 and the pre-registered parameters to
    every row with a response; tests/test_parking_zones.py (test_osm_fee_erosion_zones_need_walk_and_snapshot_provenance,
    test_zone_qa_table_is_cross_checked_against_the_polygons, test_validator_reapplies_the_acceptance_rule_to_the_qa_table),
    tests/test_parking_zone_geometry.py (construction, tag classification, ordinance conflicts, the curation aid
    offline, parameter-tagged outputs) and tests/test_parking_zone_assembly.py (the accepted-core path of the
    assembly) pin it. Since Amendment B the validator also checks the supply-share QA table when it exists
    (required as soon as a polygon has geometry_source osm_supply_majority, whose supply_walk_m,
    paid_share_threshold, minimum_usable_spaces and osm_timestamp load_zone_polygons requires for that source
    only): braunschweig.parking.supply_share_qa.validate_supply_share_qa against the polygons, the default parameters of
    owner decision 2 (share 0.3) on every row and the application gate re-applied (H1 on the Braunschweig row, H2
    recomputed from the holdout overlaps of the town rows); tests/test_parking_supply_share.py (the rule on synthetic
    layouts, the holdout metrics and the H2 gate, the variants S and T, the curation aid on an OSM XML fixture read
    with the GDAL OSM driver, the B6 assembly with H1 and H2 passed and with either failed,
    test_validator_reapplies_the_h1_and_h2_gates_and_the_default_parameters) pins it. Since Amendment C the validator
    also checks the municipal QA table, required as soon as a polygon has geometry_source
    municipal_street_sections_buffered (whose section_buffer_m load_zone_polygons requires for that source only) or a
    reconstructed_section_m2 value (which must lie between 0 and the polygon's area):
    braunschweig.parking.municipal_zone_qa.validate_municipal_qa recomputes the shares from the recorded areas and
    compares every release area with its polygon, so a regenerated release cannot keep a stale table;
    tests/test_parking_municipal_zones.py (the step on synthetic packages: C1 with the v1 cut-outs and the
    reconstruction flag, C2 with the nearest-section split and the tie rule, also on irregular float sections, the
    opening of thin features, the Goslar cross-check, the provenance and licence wording, the refusal of changed
    packages, the Wolfsburg tariff evidence) and tests/test_parking_zones.py
    (test_municipal_zone_provenance_is_validated,
    test_validator_requires_the_municipal_qa_table_of_the_municipal_zones,
    test_committed_wolfsburg_zones_are_the_three_sourced_tariff_zones) pin it.
    Since Amendment D (2026-10-07) load_zone_polygons accepts the geometry sources campus_outline_and_detection_zones
    and campus_detection_zones (no provenance column) and single_site_buffered (site_buffer_m, a positive number of
    metres, empty for every other source), braunschweig.parking.zones.validate_geometry_source_zone_types (called by the
    validator after cross_validate) requires the tariff rows of such polygons to be of the zone type the source
    describes (campus, street_paid), and the municipal QA table must hold rows for these zones, too
