    because the conversions of the four precision towns rest on ticket machines in both readings). With eleven arms
    computed, a passing information arm would not have validated that arm; none passed H2. Payment evidence inside
    the query boxes after ruling R-T1c-a (QA columns ticket_machines and app_payment_elements, from the arm T at
    0.3): parking ticket machines Braunschweig 102, Goslar 14, Wolfenbuettel 19, Gifhorn 26, Wolfsburg 36, Helmstedt
    9, Peine 0, Salzgitter 0; parking elements with an app-payment tag 13, 19, 0, 0, 3, 3, 0, 0 (the literal reading
    counted 23, 21, 7, 1, 5, 3, 1, 1). T within 75 m turns 94 street sides and street-side areas with 2,288 spaces
    paid in Braunschweig, all by a ticket machine (the literal reading: 151 with 3,868 spaces, 56 of them through the
    app tags of shops, cafes or charging stations), and 0 to 21 elements elsewhere, all by ticket machines (column
    payment_evidence_paid_elements).
    The committed QA table parking_zones_2026_supply_share_qa.csv (since Task 1c the assembly run above; its header
    defines every column) holds per town the element counts per class, the cross-check, the tagged vs heuristic
    capacity share, the B-a and B-c rates, the payment evidence and what T turns paid, the classified cell share, the
    rule area, H1 and the pooled H2 on the Braunschweig row with the interpretation that decided B5 at 0.5 and its
    POST HOC counterfactual in the note, the holdout overlaps of the holdout towns, the overlap with the v1 polygon
    elsewhere, the Amendment B arms (column sensitivity) and the information arms (column variant_arms) with their H1
    and H2, and the decision; the classified cells are the release parking_paid_share_2026 (B7).
    Municipal data, parking cost zones v2 spec Amendment C (2026-10-01; the owner's decision to include the four
    municipal packages, the provenance worded per ruling R-C1 of the controller). The packages, copied unchanged
    into the gitignored eqasim-data/data/braunschweig/parking/raw_sources/municipal_2026-10-01/:
    Braunschweig_Parkzonen.zip (17,434,642 bytes, SHA-256
    b47c463296995b035afc9894fe58dc57abdaffa14fa9709b2de1bfd144cd5abe), Wolfsburg_Parkdaten.zip (74,529 bytes,
    73407d5b23ed2517547a0e648b6a91357772f4d9af1e4d1bc3b3efda4a3cad71), Goslar_Parkdaten.zip (438,525 bytes,
    aa1bc980ae605cbe5fc2f533a2a991b4ba32c0913dc9b27090cf9d67ddb5b9d9) and Braunschweig_Parkhaeuser.zip (17,965
