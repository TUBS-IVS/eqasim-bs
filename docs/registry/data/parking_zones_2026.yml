dataset: parking_zones_2026
title: Parking cost zone polygons of the ZGB (26 zones in eight municipalities)
inventory_id: null
provider: >-
  Own digitisation (issue #249) from public sources: City of Braunschweig parking-zone overview map and
  BgA Entgeltordnung annex maps, the city's resident parking concept plans, TU Braunschweig GB3 parking pages,
  OpenStreetMap (Overpass API) and the municipal parking pages of Wolfsburg, Salzgitter, Peine, Goslar,
  Wolfenbuettel, Gifhorn and Helmstedt; since 2026-10-01 (parking cost zones v2, spec Amendment C) also the
  owner-supplied municipal packages: the City of Braunschweig's fee zones 1a and 1b digitised from its published
  maps, the Stadt Wolfsburg Geoviewer theme Parken and, as a cross-check only, the Stadt Goslar ArcGIS service
  Bewohnerparken
vintage: >-
  Sources retrieved and zones digitised on 2026-09-29; OSM base timestamps 2026-09-29T05:10Z to 05:13Z;
  target world September 2026 (design spec decision 1). The municipal packages of spec Amendment C were supplied
  and assembled on 2026-10-01 (Braunschweig fee zone map of 2025-11-26 and Amtsblatt annex of 2024-04-30,
  Wolfsburg layer Stand 12/2024, Goslar service last edited 2018-11-22).
geography: >-
  Paid-parking areas of Braunschweig (ParkGO zones Ia and Ib, five BgA car parks, resident concept Stadthalle
  zone 132 and its three Parkscheininseln, six TU campus areas), the three Wolfsburg tariff zones of the city's
  Handyparkzonen, Salzgitter-Lebenstedt, Peine, Goslar Altstadt zone 1, Wolfenbuettel, Gifhorn and Helmstedt town
  centres
crs: EPSG:25832 (stored as WGS84 GeoJSON)
roles:
- spatial_input
used_by:
- braunschweig.parking.zones_stage
acquisition:
  method: committed
  source: >-
    https://www.braunschweig.de/leben/stadtplan_verkehr/parken-in-braunschweig/parken-in-der-innenstadt.php
    (zone map), https://www.braunschweig.de/politik_verwaltung/politik/stadtrecht/2_09_Entgeltordnung-BgA-Parkraumbewirtschaftung.pdf,
    https://www.braunschweig.de/leben/stadtplan_verkehr/parken-in-braunschweig/parkraummanagement.php,
    https://www.tu-braunschweig.de/gb3/parkraumbewirtschaftung/parkbereiche, https://overpass-api.de/api/interpreter;
    spec Amendment C (owner-supplied packages): https://www.braunschweig.de/politik_verwaltung/bekanntmachungen/amtsblatt/amtsblatt_stadt_braunschweig_2024_5.pdf
    (map annex), https://geoviewer.stadt.wolfsburg.de/default/ows/projects/gpt/parken (Wolfsburg Geoviewer theme
    Parken), https://services3.arcgis.com/X0EQlGp2g40JN62M/arcgis/rest/services/Bewohnerparken/FeatureServer (Goslar)
  script: scripts/build_parking_zones_from_osm.py
  notes: >-
    Hand curation, not reproducible by one command (the curation scripts named below re-create the file from
    the gitignored raw inputs). Every feature carries geometry_source
    (street_list_buffer = named streets of a municipal source buffered 15 m and dissolved; osm_fee_tags =
    fee-tagged OSM parking objects; centre_approximation = a polygon around a town centre or campus whose
    extent the digitising_note justifies; ordinance_map = extent set by a municipal zone map or ordinance
    annex: traced from the map for zones 1a/1b, the OSM outline of the lot the BgA annex marks for Markthalle),
    source_url, source_date, digitised_on and a digitising_note with the method and all parameters (buffers, windows,
    closing distances, OSM ids, the affine of the georeferenced Braunschweig zone map). Raw inputs kept locally
    (gitignored) under eqasim-data/data/braunschweig/parking/raw_overpass/ (one Overpass response per
    municipality, written by scripts/build_parking_zones_from_osm.py) and raw_sources/ (retrieved pages and
    documents; SHA-256 of the zone map image 20251126_Karte-Parkzone-Innenstadt-a-b-2025-01 94a8d46e...,
    of the BgA order 50444731..., of the Stadthalle concept plan ac9275bf..., of the ParkGO 59957701...). The
    Overpass QL of the five successful requests (03101000, 03102000, 03103000, 03154028, 03157006; bounding boxes
    and tag filters only, no OSM data), which the builder writes next to each response as
    <ags>_overpass_2026-09-29.query.txt, is committed under scripts/curation/parking_zones_2026/overpass_queries/;
    the raw responses stay local. The
    one-off curation scripts that produced the geometry are committed under scripts/curation/parking_zones_2026/
    (not pipeline stages; they read the gitignored raw inputs): georeference_zone_map.py (chamfer fit of the
    zone map to OSM centrelines) and extract_braunschweig_zone_map.py (pixel masks of the dotted 1a outline and
    the green 1b fill), digitise_stadthalle_fee_islands.py (the three Parkscheininseln: the blue kerb lines of the
    Stadthalle concept plan, georeferenced on nine street junctions in stadthalle_plan_control_points.json, matched
    to the named OSM ways) and assemble_parking_zones.py (all polygons, precedence, municipality containment, the
    licence members). Re-run in the review fix round (2026-09-30), they reproduce the zone-map affine and the
    coordinates of every polygon of the first commit exactly, except zone 132, from which two fee islands are now
    cut out.
    Overpass requests for Goslar, Wolfenbuettel and Gifhorn failed (HTTP 504) and were not repeated; their
    centre polygons use the OSM-derived car network of the local MATSim scenario eqasim-data/output_bs
    (2026-04-29) instead. Overlaps are resolved by precedence (BgA car parks and the International House lots
    cut out of Ia and the campus areas, the Parkscheininseln cut out of zone 132), so no two zones overlap by more
    than 1 m2.
    Rule-based geometry, parking cost zones v2 lever 1 (issue #436, spec amendments A1 and A2, 2026-09-30; fix
    round 1 rulings R-T1-e to R-T1-g):
    scripts/build_parking_zones_from_osm.py --regulation sent one regulation request per municipality (every
    kerbside street, every highway way with a parking:* key and every car park of a centre box, with all tags;
    5 s courtesy pause, up to three attempts with 60 and 120 s backoff; the seven failed attempts, HTTP 429 and
    504, are appended to raw_overpass/overpass_failures.log, Peine answered only to a second invocation) for
    Braunschweig, Goslar, Wolfenbuettel and Gifhorn (cores that may replace polygons) and for Wolfsburg, Peine,
    Helmstedt and Salzgitter (QA only). The raw responses <ags>_regulation_overpass_2026-09-30.json (OSM base
    2026-09-30T14:24Z to 14:38Z) stay local; their query texts are committed next to the v1 ones under
    scripts/curation/parking_zones_2026/overpass_queries/. The committed QA table was re-derived from these
    responses without any new request (--from-raw) into raw_overpass/derived_fix_round_1/, where every output
    carries its parameter tag (<ags>_qa_w250_b25_l10_h20000_i10000.json, <ags>_core_..., <ags>_regulated_...,
    and the two diagnostic Braunschweig files ..._allstreets.json) and is replaced only with --overwrite; the
    untagged <ags>_{regulated,core,qa} files and the tagged files in raw_overpass/ itself are superseded
    intermediate outputs (before ruling R-T1-e and the paid-area report), no input of the committed table.
    braunschweig.parking.zone_geometry built each core: R = the ways with a paid, restricted or forbidden side
    buffered 25 m plus the paid or restricted parking objects (car parks and separately mapped street-side areas)
    buffered 10 m; holes up to 2 ha filled; F = the ways with a free side plus the free public street-side areas;
    a side mapped separately (parking:<side>=separate) is neither R nor F, its separately mapped area decides by
    its own class (R-T1-e); Z = erode(fill(R), 250 m) minus the 250 m buffer of F, parts below 1 ha dropped; the
    pre-registered acceptance rule Q4 (core >= 1 ha and tagging completeness >= 60 %) decided. Braunschweig was
    compared with the ParkGO annex outlines (scripts/curation/parking_zones_2026/extract_parkgo_annex_zones.py
    with the v1 page-3 affine parkgo_annex_affine.json; that parameter file is the only record of the v1 fit,
    whose line mask exists only in the v1 scratch area: the committed extractor needs a darkness threshold of 100
    on the rendering in raw_sources where the v1 mask used 60 on another rendering, so the fit cannot be re-run
    from the repository), the other towns with their v1 polygons. An accepted Braunschweig core would be cut by
    every v1 zone and each remaining piece assigned WHOLE to the annex zone it overlaps most (bs_zone_ia_sued,
    bs_zone_ii; R-T1-f, the annex is never a clipping geometry), pinned with the rest of the accepted path by
    tests/test_parking_zone_assembly.py on synthetic inputs. Counts, areas, ordinance conflicts, diagnostics and
    decisions are the committed QA table parking_zones_2026_qa.csv (assemble_parking_zones.py --erosion-dir
    raw_overpass/derived_fix_round_1 --counterfactual-qa <the two _allstreets files>; its header defines every
    column); the assembly refuses QA inputs without the pre-registered parameters (W 250 m, fill 20,000 m2,
    islands 10,000 m2, buffers 25 and 10 m) or with a counterfactual. No core was accepted, so no polygon changed:
    re-running the whole chain (georeference_zone_map.py, extract_braunschweig_zone_map.py,
    digitise_stadthalle_fee_islands.py, then assemble_parking_zones.py with the v2 cores) reproduces this file
    byte for byte.
    Majority rule over the parking supply, parking cost zones v2 spec Amendment B (2026-09-30; the erosion rule
    above stays as the rejected approach A1). Data source (B8): the Geofabrik extract niedersachsen-260929.osm.pbf,
    the dated file of the 'latest' Niedersachsen extract, 506,480,293 bytes, Geofabrik MD5
    0c513947b19145d84afb0b3bc36d95f5 (checked against niedersachsen-260929.osm.pbf.md5 before every use), SHA-256
    c2b33b8414584686f9320971300de17f66ba66f92b45b23b24ad0a51b0218a94, OSM snapshot 2026-09-29T20:22:51Z (the
    osmosis_replication_timestamp of its PBF header, replication sequence 4917, written by osmium/1.16.0; the same
    'data up to' as the Geofabrik page), HTTP Last-Modified 2026-09-30 06:56:15 GMT, downloaded on 2026-09-30 into
    the gitignored eqasim-data/data/braunschweig/parking/raw_osm/; the pipeline's own OSM input osm_niedersachsen is
    not touched. python scripts/build_parking_zones_from_osm.py --supply-share --osm-extract
    raw_osm/niedersachsen-260929.osm.pbf --town 03101000=52.233,10.498,52.28,10.587 --town
    03153017=51.895,10.41,51.917,10.45 --town 03158037=52.15,10.515,52.178,10.555 --town
    03151009=52.465,10.53,52.49,10.565 --town 03103000=52.41,10.765,52.435,10.805 --town
    03157006=52.305,10.21,52.335,10.255 --town 03154028=52.215,10.99,52.24,11.03 --town
    03102000=52.14,10.305,52.17,10.355 (the boxes of the regulation queries above, checked against their
    .query.txt) --overpass-dir raw_overpass --reference
    03101000=raw_sources/bs_2_08_annex_zones_georeferenced.geojson --reference
    <ags>=raw_overpass/<ags>_v1_zone_reference.geojson (the seven other towns) --legal-zones
    parking_zones_2026.geojson --annex-affine scripts/curation/parking_zones_2026/parkgo_annex_affine.json
    --annex-image raw_sources/bs_2_08_annex_north_up.png --out-dir raw_osm/derived_supply_share
    --sensitivity-arms (5 min 19 s) read each GDAL OSM layer once over the union of the eight boxes grown by 1 km
    (reading times and feature counts in the data record parking_paid_share_2026) and wrote per town and parameter
    tag <ags>_supply_qa_<tag>.json, <ags>_supply_zones_<tag>.geojson, <ags>_paid_share_<tag>.csv.gz and
    <ags>_supply_elements_<tag>.geojson into raw_osm/derived_supply_share/ (local, new files only).
    braunschweig.parking.supply_share: every public parking element inside the box (street sides, street-side
    areas, off-street lots and garages) is paid, restricted, free or excluded (B1: B-a street parking without a
    fee tag is free, B-b disc parking is free, B-c off-street lots without an explicit fee tag are excluded,
    off-street lots with fee=no are free; a side mapped separately counts through its area), its capacity is the
    capacity tag or 5.5 m per street space, 12.5 m2 per street-side area space, 25 m2 per lot space times the levels
    of a multi-storey car park (B-d); a 25 m cell is classified from 50 usable spaces within 250 m (B-e) and paid
    from a paid share of 0.5 (B-f); the paid cells are united, smoothed +/-12.5 m and parts below 1 ha dropped (B4).
    The element counts per town, kind and class agree with the saved Overpass regulation responses of 2026-09-30
    up to at most two elements per class; the causes were identified per element: OSM edits in the day between the
    two snapshots (two Braunschweig street sides gained a parking tag, two ways are new) and eight multipolygon
    car-park relations in Braunschweig, Gifhorn, Peine and Salzgitter that the Overpass parser of the regulation
    mode cannot build and skips (logged) while the GDAL OSM driver builds them.
    Correction of the task review (fix round 1, 2026-09-30, ruling R-T1b-d, justified by the text of B1, not a tuning
    step): resident-only parking, tagged access=private with private=residents on the street side
    (parking:<side>:access=private + parking:<side>:private=residents) or on the car park or street-side area, is
    restricted (B1 names resident permits restricted); the first run excluded it as not public, any other private
    value stays excluded. In Braunschweig the restricted elements rise from 13 to 39 (13 street sides, 12
    street-side areas and 1 lot are resident-only and now restricted) and the restricted capacity from 397 to 854
    spaces;
    the other towns carry no such tagging and are unchanged. The eight towns were re-run with the corrected code from
    the saved inventory of the first run (raw_osm/derived_supply_share/supply_inventory_niedersachsen-260929.gpkg,
    checked against the Geofabrik MD5 with --from-inventory ... --osm-extract-md5 raw_osm/niedersachsen-260929
    .osm.pbf.md5, 2 min 10 s) into the new folder raw_osm/derived_supply_share_fix_round_1/ (the first run's files
    stay as the superseded evidence; nothing was rewritten). The pre-registered validation B5 FAILS in Braunschweig
    with the defaults: recall 0.696 (0.696112: 1,646,324 m2 of the 2,365,028 m2 of the ordinance polygons
    bs_zone_ia and bs_zone_ib lie inside the rule; 92.5 % of Ia, 36.1 % of Ib) below 0.70, precision 0.852
    (0.852189: 2,505,847 of the 2,940,482 m2 of the rule inside the annex map frame lie inside the annex zones);
    before the correction 0.688712 / 0.844781. So B6 was applied nowhere and no polygon changed: re-running
    assemble_parking_zones.py with --supply-share-dir raw_osm/derived_supply_share_fix_round_1 (without
    --erosion-dir) reproduces this file byte for byte (same git blob). The sensitivity arms, information only and
    never used to select a passing combination (changing a default is an owner decision recorded in an ADR), after
    (before) the correction: W 150 m recall 0.625 / precision 0.882 (0.614 / 0.874), W 400 m 0.613 / 0.772 (0.592 /
    0.762), share 0.3 0.883 / 0.856 (0.880 / 0.848), share 0.7 0.306 / 0.765 (0.294 / 0.757).
    Interpretations beyond B-a..B-f (implementation choices of Task 1b, not owner rulings; the one list, the other
    records and the QA table point here): (1) parking:<side>=yes, the fallback value of the street parking scheme,
    is a parking position, so such a side without a fee tag is free street parking (the literal B-a reading; lever 1
    reads it as no parking information). This reading DECIDES the B5 outcome: 69 free sides with 1,219 heuristic
    spaces in the Braunschweig query box, many within 250 m of zones Ia and Ib; with the literal reading B5 fails
    (0.696112 / 0.852189), while the POST HOC counterfactual that reads these sides as no parking information, as
    lever 1 does (builder --counterfactual yes_sides_no_information, files raw_osm/derived_supply_share_fix_round_1/
    03101000_*_w250_t0.5_u50_c25_s12.5_i10000_yesnoinfo.*), gives recall 0.768669 and precision 0.860518, which
    would pass (before the correction of fix round 1: 0.762837 / 0.854269, the figure of the task review, reproduced
    to the sixth decimal by the project code). The literal reading stays the default (ruling R-T1b-c: it was fixed
    before the result was known, and switching it because the other reading passes would select a passing
    combination); the counterfactual is not a validation and never a release input; the owner decides the tag
    meaning in the Amendment-B ADR. (2) Resident-only parking (access=private + private=residents) is restricted,
    any other private value and customers are excluded (above). (3) Precedence of a street side: the way not public
    -> mapped separately -> private or customers on the side -> paid -> permit or residents -> forbidden -> disc
    (free) -> any other access, restriction or condition (not public) -> a parking position with fee=no or without
    a fee tag (free); so a permit or a forbidden side wins over a disc tag. (4) fee:conditional with a 'yes @ (...)'
    clause is paid, also next to fee=no. (5) A fee value that is neither yes nor no (for example a time interval or
    an amount) excludes the element (fee_unrecognised). (6) access=designated, employees, delivery, no and every other
    non-public access value exclude a car park or side; access=yes, permissive, public, destination are public.
    (7) A side mapped separately (parking:<side>=separate) counts through its street-side area, never itself.
    (8) Street-side area or off-street lot: decided by parking=* in street_side, lane, on_kerb, half_on_kerb,
    shoulder, layby (B-a applies to those, B-c to all other car parks); a street-side area with authentication:disc=
    yes is free (B-b), an off-street lot without a fee tag stays excluded even with a disc tag (B-c). (9) Capacity:
    parking:<side>:capacity, legacy parking:lane:<side>:capacity and parking:condition:<side>:capacity, each falling
    back to both, which applies to each side; only a plain whole number counts, otherwise the heuristic (counted); a
    street-side area drawn as a line counts as a street side (length / 5.5 m); a node without a capacity tag carries
    0 spaces (counted); the levels (levels, then building:levels) multiply only parking=multi-storey. (10) The raster
    covers the EPSG:25832 bounds of the WGS84 query box (sliver cells beyond its corners) and its radius sums see the
    supply up to W plus one cell beyond the box; the capacity is spread every 5 m along lines and on a 5 m grid in
    areas; a share within 1e-9 of the threshold counts as reaching it and a supply within 1e-6 spaces of the
    minimum; the smoothing uses round joins; the inventory box is the union of the eight query boxes grown by 1 km.
    (11) Variant T (owner decision 3 with ruling R-T1c-a): the payment evidence is every parking ticket machine
    (amenity=vending_machine with vending=parking_tickets, nodes only; none is mapped as a way or an area) and every
    parking element with an app-payment key. A parking element is a parking facility (amenity=parking of any
    geometry: street-side areas, lots and nodes; a highway way with street-parking tags parking:*) or a parking
    payment device (vending=parking_tickets). An app-payment key starts with payment:app or payment:mobile or is a
    named parking-app key (payment:easypark, payment:parkster, payment:paybyphone), with a value that is not no;
    phone-wallet keys (payment:apple_pay, payment:google_pay, payment:samsung_pay and the like) and non-parking
    elements (shops, cafes, charging stations) never count. Ruling R-T1c-a corrects a definition error of the
    controller before the task review, not a tuning step: the first T run of Task 1c read the pre-registered pattern
    payment:app* literally, so payment:apple_pay and the app tags of shops and charging stations counted (87 elements
    in the inventory box against 40 now; its files *_payment75m stay as superseded evidence and are never read as T);
    T is information only and cannot be applied, and 75 m and every other T parameter are unchanged. The only named
    parking-app key in the inventory box is payment:paybyphone on 13 parking ticket machines (a read-only census of
    the extract found no element with a named key in the lines or multipolygons layer), all of them in the cached
    inventory of Task 1c, which the re-run of the T arms re-used. 'Within 75 m' is the smallest distance between the
    geometry of the side or area and the evidence, so a long side converts whole; the own-tag rule applies to
    street-side areas and lots without a fee tag (B-a, a disc area, B-c), never to fee=no, not public, restricted or
    forbidden elements; disc street sides (B-b) stay free; an evidence element counts whatever its own class (the
    Goslar car parks with payment:app=yes are paid by fee:conditional).
    (12) H2
    (owner decision 2): the per-town minimum of 0.50 covers every town with holdout references, Braunschweig included
    (its four street-list references, recall only); the reference polygons are those of this release
    (bs_resident_stadthalle_132 without the three Parkscheininseln cut out of it); a reference of a precision town
    must lie inside its query box, so that the precision numerator lies inside its frame (all four do). (13) The
    Overpass cross-check always compares the B1 classification of the full inventory, in every arm.
    Owner decisions 2 and 3 (spec Amendment B, 2026-09-30, plan Task 1c; the ADR text follows in Task 6). After B5
    failed with the pre-registered share 0.5 the owner chose the share threshold 0.3 with an independent cross-check
    and called the 70 % bound a set value, not a law. This is a POST HOC change of B-f: 0.3 is the default of the
    builder, the QA table and the release (braunschweig.parking.supply_share.DEFAULT_SUPPLY_PARAMETERS), 0.5 stays
    the centre of the Amendment B arms, and the rule may be applied only when H1 (B5 recomputed at 0.3) and H2 pass.
    H2, pre-registered in the spec before any holdout overlap at 0.3 was computed, uses references not used by B5 and
    no approximations: sz_lebenstedt (municipal street list), wob_innenstadt, pe_innenstadt and he_innenstadt (v1 OSM
    fee-tag polygons) and the Braunschweig street-list zones bs_parkscheininsel_marthastrasse_koernerstrasse,
    bs_parkscheininsel_gerstaeckerstrasse_kleine_campestrasse, bs_parkscheininsel_mentestrasse and
    bs_resident_stadthalle_132 (1,994,482 m2 in all); per town recall = rule inside the references / their area, and
    for the four towns only precision = rule inside the references / rule inside the town's query box; it passes when
    the pooled recall (area-weighted over every reference) and the pooled precision reach 0.70 and every town's
    recall reaches 0.50 (ASSUMPTION Q6, the set value of Q5). Owner decision 3 added the payment evidence of variant
    T (pre-registered before any T result: a street side or street-side area free only for lack of a fee tag becomes
    paid when its geometry lies within 75 m, ASSUMPTION T-a, of a parking ticket machine, amenity=vending_machine
    with vending=parking_tickets, or of a parking element with an app-payment tag (ruling R-T1c-a, interpretation
    (11)); a street-side area or lot with its own app-payment tag and no fee tag is paid; fee=no is never
    overridden; the evidence adds no capacity) and the
    street-supply variant S (off-street lots and garages leave the inventory). Seven arms of owner decisions 2 and 3
    were computed with H1 and H2 (B, S at 0.3 and 0.5, T and S+T at 0.5 and 0.3), plus the four Amendment B arms on
    the same code; only B may be applied. Run on 2026-09-30: python scripts/build_parking_zones_from_osm.py
    --supply-share --osm-extract raw_osm/niedersachsen-260929.osm.pbf with the eight --town boxes, the --reference
    outlines and the B5 inputs above, --holdout-zones parking_zones_2026.geojson --out-dir
    raw_osm/derived_supply_share_task_1c --variant-arms --sensitivity-arms (the T and S+T arms re-run after ruling
    R-T1c-a from its saved inventory with --from-inventory, --osm-extract-md5, --variant-arms --arms-only
    --variants T S+T into files *_parkingpayment75m, 88 s; the first run 8 min 27 s; the extract re-read once per
    layer with the layer filters of Task 1c, which add the payment evidence, reading times and feature counts in
    the data record parking_paid_share_2026; the supply selection is exact, so the rasters and rule
    polygons of fix round 1 are reproduced byte for byte), then assemble_parking_zones.py --supply-share-dir
    raw_osm/derived_supply_share_task_1c with the v1 inputs, --reference-outline, --supply-qa-out, --paid-share-out
    and --supply-counterfactual-qa with the Braunschweig yes-sides counterfactual of fix round 1
    (03101000_supply_qa_w250_t0.5_u50_c25_s12.5_i10000_yesnoinfo.json in raw_osm/derived_supply_share_fix_round_1/).
    Result of B (share 0.3): H1 passes (recall 0.883332: 2,089,104 of the 2,365,028 m2 of Ia and Ib; precision
    0.855943: 3,305,364 of the 3,861,663 m2 of the rule inside the annex map frame lie inside the annex zones), H2
    FAILS on the pooled precision 0.314482 (1,589,703 of the 5,054,985 m2 of the rule inside the query boxes of
    Salzgitter, Wolfsburg, Peine and Helmstedt lie inside their references; town precision 0.540, 0.223, 0.390 and
    0.352) while the pooled recall 0.861247 (1,717,742 of 1,994,482 m2) and every town recall pass (Braunschweig
    0.805, Salzgitter 0.592, Wolfsburg 1.000, Peine 0.966, Helmstedt 1.000). So nothing is applied: this file is
    unchanged (the assembly reproduces it byte for byte), Goslar, Wolfenbuettel and Gifhorn keep their centre
    approximations and zone II and the southern part of zone Ia stay unzoned. H2 counts every rule area outside a
    reference as wrong, although the references are no complete maps of the paid parking in their boxes
    (wob_innenstadt, for instance, leaves out the Autostadt car parks north of the canal, inside the Wolfsburg box);
