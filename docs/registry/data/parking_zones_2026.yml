  synthesis: not_needed
  matsim: required
  production: required
licensing:
  license: >-
    Per source; the file holds polygons under several regimes. (1) The OpenStreetMap-derived polygons: ODbL 1.0, (c)
    OpenStreetMap contributors, for every polygon whose coordinates depend on OpenStreetMap through an OSM outline (the
    outlines of the five Bad Harzburg car parks and the street Am Markt of Seesen, spec Amendment D3), OSM street
    geometry (the street_list_buffer zones: Stadthalle 132, the three Parkscheininseln, Salzgitter; the fee-tagged
    objects of Peine and Helmstedt; the Goslar, Wolfenbuettel and Gifhorn hulls from the OSM-derived car network) or a
    georeference on OSM street centrelines (the Stadthalle concept plan behind the Parkscheininseln), and the campus
    grounds of the TU zones (the OSM university outlines and the two OSM car parks at the International House of
    the v1 release, which each campus zone keeps, united with the detection zones of regime 5); the BgA car parks
    were OSM-derived in v1 and are not any more (regime 4). (2) bs_zone_ia and bs_zone_ib: Stadt Braunschweig, published fee zone map (2025-11-26) and Amtsblatt 2024-04-30 map annex; digitised
    (owner-supplied package 2026-10-01); working accuracy 25 m; base map Open GeoData dl-de/by-2-0. (3)
    wob_tarifzone_1, wob_tarifzone_2 and wob_tarifzone_3: Stadt Wolfsburg, Geoviewer Themenkarte Parken (Stand
    12/2024); open reuse licence not verified; used by owner decision 2026-10-01. Spec Amendment D (the regional
    evidence package of 2026-10-07): (4) the five bs_bga_* BgA car parks: Stadt Braunschweig, Amtsblatt 2022 Nr. 16
    (annex maps of the BgA Entgeltordnung B 660); digitised (owner-supplied package 2026-10-07); working accuracy 5 m;
    base map Open GeoData dl-de/by-2-0. (5) the camera detection zones of the six TU campus zones (geometry_source
    campus_outline_and_detection_zones, and campus_detection_zones for Volkmaroder Strasse): TU Braunschweig, GB3
    Parkbereiche campus maps (retrieved 2026-10-02; (c) d&d design & distribution); explicit consent for reuse of TU
    graphics not obtained; used by owner decision 2026-10-07. (6) the three gs_parkplatz_* car parks:
    Stadt Goslar, ArcGIS service Bewohnerparken (last edit 2018-11-22); open reuse licence not verified; used by owner
    decision 2026-10-07. (7) the two br_* car parks: Stadt Braunlage, official tourism coordinates of the car parks
    (source points, not outlines; the package records no licence or terms of reuse for them, none was verified).
    Which areas are paid follows the municipal maps and ordinances (facts of public
    law; maps of the Stadt Braunschweig, Abt. Geoinformation); attribution to the municipalities. The GeoJSON
    carries the licence and the attribution as top-level members (license, attribution;
    assemble_parking_zones.py licence_members names the sources of every regime; with the regional package the BgA
    lots cut out of bs_zone_ia are named as the package polygons, no longer as OSM outlines). A rule-based
    osm_fee_erosion polygon (v2 lever 1; none in this release, no core was accepted) is derived from the OSM
    on-street parking and car-park tags of an Overpass response and carries the same terms; the assembly then
    writes the extended licence and attribution members (assemble_parking_zones.py LICENSE_V2, ATTRIBUTION_V2).
    An osm_supply_majority polygon (spec Amendment B; none in this release: B5 failed at the share 0.5, H2 at
    the owner's 0.3) derives from the parking
    tags of the Geofabrik extract and carries the same terms (LICENSE_SUPPLY, ATTRIBUTION_SUPPLY).
  restricted: false
  redistribution: restricted
  notes: >-
    Redistribution per source, so the release as a whole is not cleared for redistribution (redistribution
    restricted): the OSM-derived polygons keep the OpenStreetMap attribution and the ODbL share-alike terms; zones 1a
    and 1b keep the attribution 'Datenquelle: Stadt Braunschweig - Open GeoData, 2026, Lizenz: dl-de/by-2-0' with the
    note that the data were changed, and the package states that this licence covers the base maps of the
    georeference, not a separately verified release of the zone graphics; the Wolfsburg tariff zones: redistribution
    not verified; the TU campus zones: the TU requires explicit consent for the reuse of its graphics, which was NOT
    obtained (the detection zones are traced from the TU maps; used by owner decision 2026-10-07; the campus grounds
    are OSM, ODbL); the Goslar car parks: open reuse licence of the city's service not verified; the Braunlage car
    parks: the terms of reuse of the town's tourism coordinates not verified. The file is committed by owner decisions 2026-10-01 and
    2026-10-07. The QA table
    parking_zones_2026_qa.csv holds counts and areas derived from the OSM regulation responses and carries the
    OpenStreetMap attribution (ODbL 1.0) in its header, as does the QA table parking_zones_2026_supply_share_qa.csv for
    the counts and areas derived from the Geofabrik extract; the QA table parking_zones_2026_municipal_qa.csv names
    the municipal sources in its header.
limitations: >-
  Centre approximations (not sourced boundaries): gs_altstadt_zone1 (streets chosen to stand for zone 1, no official
  street list; the Glockengiesserstrasse car park is cut out of it since spec Amendment D3), wf_innenstadt and
  gf_innenstadt (hulls of centre streets); sz_lebenstedt, pe_innenstadt and he_innenstadt are hulls of named streets or
  fee-tagged car parks, not ordinance extents. The six TU campus zones are, since spec Amendment D1 and ruling R-4a-8 (2026-10-07), the union of two sources that
  answer different questions: the campus grounds of the v1 release (the OSM amenity=university outlines, with the two
  OSM TU car parks at the International House merged into Langer Kamp; the destination area, where the buildings and so
  the activities are, an approximation of the campus and no surveyed boundary) and the red camera detection zones of the
  GB3 campus maps (the paid car parks, where the tickets are checked; the layer states they are no parking footprints,
  and they do not contain the buildings; the maps call themselves 'approximate; schematic source; deviations of several
  tens of metres possible', georeferencing residuals 5.7-16.1 m, a consistency measure, not an accuracy). How much the
  detection zones add to the grounds differs by campus: 54.9 % of the detection zones of the Forschungsflughafen lie
  inside its grounds (the zone grows from 56,553 to 65,118 m2), 58.0 % at the Zentralcampus (97,180 to 136,610 m2), 86.0
  % at Langer Kamp, 89.6 % at Campus Nord and 95.6 % at Beethovenstrasse; the yellow parking areas of the same maps lie
  99.5 % to 100 % inside the detection zones, which supports their georeference relative to the parking areas, not its
  absolute position. The nested red boundaries of Beethovenstrasse are unresolved: the outer one is used and the inner
  area (3,305 m2) belongs to the zone. Volkmaroder Strasse has no campus grounds (no v1 zone, no OSM university outline
  at the site), so its zone is the detection zone alone, a car park whose buildings are not in the zone. Bevenroder
  Strasse (detection zone TU_KAM_05_01, 7,015 m2) is not zoned, because no GB3 page states ticketing there. The five BgA lots (D1) are digitised from raster annex maps at the
  stroke midpoint (estimated position uncertainty 5 m, the package's working estimate and no confidence bound); the 0.5
  m simplification takes 0.2 % to 1.8 % off their areas; the new An der Martinikirche polygon shares no area with the v1
  polygon (an OSM lot buffered 5 m, its centroid 53 m away, on the neighbouring kerbside stalls) and
  Kannengiesserstrasse is no zone any more (a pocket park since April 2026). Zones 1a and 1b (since spec Amendment
  C, 2026-10-01) are the owner's digitisation of the city's fee zone map of 2025-11-26, not an official GIS export:
  an affine georeference on the Open GeoData city map (fit RMSE 4.53 m, a consistency measure of the matched map
  features, not the boundary accuracy; the 25 m working accuracy is an estimate, not a confidence bound, and the
  reference map itself is stated at +/-15 m); the southern part of 1a, which that map cuts off, is reconstructed from
  the map annex of the Amtsblatt of 2024-04-30 and joined at the crop seam (field reconstructed_section_m2; a newer
  complete boundary of that section was not verified). The v1 tracing of the same map (georeferenced with an RMS of
  4.5 m) missed that southern part. The ParkGO annex map (sec. 2(1); 'Anlage zur ParkGO', published on page 3 of
  2_08_Parkgebuehrenordnung_2025.pdf) also draws zone II, which stays unzoned apart from the three Parkscheininseln
  (free by Z1): the annex could not be georeferenced to an RMS of 10 m or better (best affine fit at about 3.7 m per
  pixel: 11.1 m RMS between the v1 1a/1b outline and the annex zone lines, 26.8 m RMS at the five BgA car parks as
  check points), and the owner's package does not cover zone II. The Wolfsburg tariff zones (spec Amendment C2) rest
  on ASSUMPTION C-a, 50 m around the city's Handyparkzonen street sections; these are the city's phone-parking areas
  (layer Stand 12/2024), not a complete map of its paid parking (the package: outside the polygons neither free
  parking nor a ban may be inferred), so outside the three zones parking is free by Z1, and where the 50 m areas of
  two tariff zones overlap each point belongs to the tariff zone of its nearest section (no choice between nearby
  sections is modelled). The Goslar comparison (spec Amendment C4) is a cross-check, not a validation of the centre
  approximation: the service data were last edited in 2018 and carry no tariffs. The Parkscheininseln follow the blue kerb lines of the Stadthalle concept plan
  (file 202308-Beschilderung-Bestand-PRMK-Stadthalle), which the city labels an overview only (signage on site
  governs). Not digitised: resident zones 120B and 330B, the permit districts A/B/C (a second layer, no fee zones),
  ParkGO zone II apart from the three Parkscheininseln and the BgA car park Willy-Brandt-Platz (spec Amendment D1: the
  city's phone-parking map of 2024 shows no other paid city parking outside the Okerumflut), TU Bevenroder Strasse,
  Goslar zone 2 (see the coverage register). The five BgA car-park polygons contain no activity of the local 1 %
  scenario; activities are located at buildings, so a car park without buildings rarely carries a destination. v2 lever 1 (2026-09-30, fix round 1) accepted no rule-based core, so every approximation and gap
  above stays: gs_altstadt_zone1, wf_innenstadt and gf_innenstadt remain centre approximations, ParkGO zone II and
  the southern part of zone 1a remain unzoned, and the Wolfsburg, Peine, Helmstedt and Salzgitter polygons are
  unchanged (QA only); the southern part of zone 1a and the Wolfsburg polygon changed only with the municipal data of
  spec Amendment C (above). Why the cores are empty (parking_zones_2026_qa.csv and the local QA files under
  raw_overpass/derived_fix_round_1/, reproducible from the raw responses): (1) in all eight towns erode(fill(R),
  250 m) is already empty before F is subtracted (eroded_filled_area_m2 0): R is a set of 50 m wide strips along
  the regulated ways (in Braunschweig 778 regulated ways, 768 of them with no paid or restricted side: 511
  forbidden on both sides, 125 with a free other side, 92 with a side mapped separately and 40 with an untagged
  one; no street is paid by its own tags, because the 8 fee-tagged ways map their paid side separately and the fee
  sits on the 415 paid street-side areas; side_class_pairs of 03101000_qa_w250_b25_l10_h20000_i10000.json), and
  kerbside streets without any parking tag and pedestrian streets (which the regulation query does not fetch) leave
  the blocks open. (2) The fill cap Q3 binds whatever the tagging: with every fetched kerbside street counted as
  regulated (the diagnostic counterfactual --all-kerbside-streets-regulated adds 2,100 of the 2,835 kerbside
  streets to the 778 regulated ways), erode(fill(R), 250 m) inside the annex zones is only 858 m2 (Ia 8, Ib 0, II
  850) at the pre-registered 2 ha cap and 1.161 km2 (Ia 0.427, Ib 0.294, II 0.440) at a 10 ha cap (python
  scripts/build_parking_zones_from_osm.py --regulation --ags 03101000 --bbox 52.2330,10.4980,52.2800,10.5870
  --from-raw raw_overpass/03101000_regulation_overpass_2026-09-30.json --reference-outline
  raw_sources/bs_2_08_annex_zones_georeferenced.geojson --all-kerbside-streets-regulated
  [--maximum-filled-hole-m2 100000] --out-dir <dir>; note column of the Braunschweig row): better OSM tagging alone
  cannot produce the ParkGO zones under Q3 = 2 ha. The tagging completeness of rule Q4 is measured inside fill(R),
  which is built from tagged ways, and overstates the mapping of the ordinance areas (Braunschweig 0.733 inside
  fill(R) against 0.364 inside the annex zones, column reference_tagging_completeness). ASSUMPTION (no fee tag =
  free): a parking side or a street-side area without any fee tag counts as free supply; in Braunschweig 363 of the
  372 ways with a free side and 439 of the 839 free street-side areas rest on it (free_segments_without_fee_tag,
  free_street_side_areas_without_fee_tag), and inside the annex zones OSM makes 15 (Ia), 12 (Ib) and 47 (II) ways
  free on a side, 72 of them only by that assumption, next to 269, 183 and 1 paid street-side areas (column
  reference_conflicts names them per zone; conflicts are resolved by the source, not by the script). At the
  sensitivity arms W = 150 m and 400 m no town gives a core (Braunschweig at 150 m: erode(fill(R)) 294 m2, Z 0 once
  F is subtracted). The majority rule over the parking supply of spec Amendment B (2026-09-30) was not applied
  either, because its pre-registered validation B5 failed in Braunschweig (recall 0.696 below 0.70 after the
  correction of fix round 1; decided by the reading of parking:<side>=yes, see the interpretations under
  acquisition), so the same approximations and gaps stay. At the share 0.5 its Braunschweig rule covers
  92.5 % of the ordinance
  polygon of zone Ia (89.0 % of the annex zone Ia, which includes the southern Ia) and 12.5 % of the annex zone II
  (the station quarter), but only 36.1 % of zone Ib (the Wallring), where OSM maps much free street parking; 0.677
  of its 3.183 km2 lie outside every annex zone. Behind every cell lie the assumptions B-a (79.0 % of the free
  street capacity of the Braunschweig box has no fee tag), B-c (30.0 % of its public off-street capacity is
  excluded for lack of a fee tag) and B-d (66.8 % of the usable capacity comes from the heuristic); columns
  free_street_spaces_without_fee_tag_share, offstreet_spaces_without_fee_tag_share and heuristic_capacity_share of
  parking_zones_2026_supply_share_qa.csv. With the owner's post hoc share 0.3 (owner decision 2) H1 passes in
  Braunschweig (recall 0.883, precision 0.856), but the pre-registered holdout check H2 fails on the pooled precision
  (0.314 against 0.70): in Salzgitter, Wolfsburg, Peine and Helmstedt only 22 % to 54 % of the rule inside the query
  box lies inside the reference polygon (partly areas the references do not cover, such as the Autostadt car parks in
  the Wolfsburg box), so the rule is still applied nowhere and the approximations and gaps above stay; no arm of
  owner decisions 2 and 3 (S, T, S+T) passes H2 either.
  Single paid sites (spec Amendment D3, geometry_source single_site_buffered, 11 zones): each zone is the area within 50
  m of the site (ASSUMPTION C-a, the same distance as the Wolfsburg sections), so it is always wider than the car park
  (7,800 m2 around a source point up to 43,000 m2 around the largest lot), and a destination within 50 m of a lot is
  priced as parking there although the person may park elsewhere. The geometry of three of the eleven sites is weaker
  than an outline (primary: the site's outline, 8 of 11 sites, 72.7 %; a street line 1, 9.1 %; a source point 2, 18.2
  %): Seesen Am Markt rests on a 94 m OSM street line, a location reference, not the exact paid extent, and the two
  Braunlage car parks on the official tourism coordinates, navigation points whose lot extent is unknown, so each is a
  circle of 50 m. The outlines of the Bad Harzburg lots are OSM ways (not surveyed, no official fee boundary) and those
  of the three Goslar lots the city's facility areas of 2018 (no confirmed current tariff extent; their membership of
  Goslar zone 2 is not asserted). The rates, windows and stays are stated in the tariff table (data record
  parking_tariffs_2026): the Bad Harzburg rate is the ParkGO ceiling for every car park (ASSUMPTION D3-b; a rule the package marks as not
  preferred for current use, status prior_snapshot, which the OSM charge tags of four of the five car parks
  corroborate), the Goslar
  billing unit the ParkGO half hour (ASSUMPTION D3-a), the fee windows of the Bad Harzburg and Braunlage sites are
  ASSUMPTION F1, and maximum stays (Bad Harzburg 6 h and 10 h, Seesen 6 h against 10 h in conflicting sources) are not
  modelled (ASSUMPTION M2). No zone overlaps another zone of the step, so the nearer-source split of overlapping 50 m
  areas, implemented and pinned by tests, did not act. The Bad Harzburg Grossparkplatz zone lies 85.3 % in the
  unincorporated area Harz of the pipeline's municipality polygons (the outline is 13 m beyond the boundary of Bad
  Harzburg), a declared exception of the municipality check. The audit found no further site with both a geometry and a
  sourced tariff: Clausthal-Zellerfeld has no zone, Seesen Unterer Bahnhofsplatz (a fee reported in 2019, the current
  tariff not confirmed) and the Seesen garage are not zoned, three more sites of an attraction page in Bad Harzburg and
  the public ticket machines of Braunlage have no geometry; Schoeningen, Koenigslutter, Wittingen, Langelsheim and
  Schoeppenstedt have no zone (see the coverage register). Station car parks (spec Amendment G1): each of the three
  zones is the area within 50 m of the lot, so a destination within 50 m of P1, P2 or P3 is priced as parking there
  although the person may park elsewhere (the zones are 21,600 to 43,900 m2 around outlines of 2,300 to 9,500 m2); the outlines are OSM ways, matched by name and not surveyed, no official fee boundary; they are 4.7, 4.6 and 9.2 times the area of the lots (P1, P2, P3); the OSM fee=no street-side parking west of the station lies 86 to 390 m outside the zones; the zones take in the station forecourt (P1) and private Siemens lots (P2, mostly free through the employer draw); the destination content is small (building potentials: P1 12 buildings, P2 4, P3 5); a bare outline without the 50 m area would leave the zones inert. The Kiss&Ride tariff and the
  evening tariff of P1 and the BahnCard and Pcard discounts are not modelled, and free street parking west of the
  station stays unzoned (ASSUMPTION Z1); the reported capacities differ between the sources (OSM, Contipark, DB
  BahnPark) and none enters the zones.
