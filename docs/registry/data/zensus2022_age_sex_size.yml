notes: |
  Two independent consumers, both activated by issue #251, so this file is now required for
  every IPF run: (1) the joint age x household-size IPF margin
  (braunschweig.ipf.use_joint_age_size_margin) via
  braunschweig.data.census.households_size_age; (2) the Gemeinde-within-Kreis population
  share (braunschweig.census.use_zensus_gemeinde_shares), replacing the scraped,
  redistribution-forbidden urbistat table (dataset urbistat_gemeinde_age). It is local-only
  and not committed, so a fresh clone must download it before an IPF run; the popsim
  production path does not use it.
