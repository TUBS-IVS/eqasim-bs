verification:
  verifier_entry: D17
  script: scripts/verify_braunschweig_inputs.py
  notes: >-
    Listed as D17 (optional, restricted, matsim_only) in scripts/verify_braunschweig_inputs.py with the consolidated package
    Regional_Parkdaten_Belege_2026-10-07.zip, the package the curation chain reads first: only the curation chain needs it. A
    missing file is reported as [RESTRICTED] with the route to obtain it; the SHA-256 is checked by the curation code that reads a
    package, not by the preflight.
requirements:
  synthesis: not_needed
  matsim: not_needed
  production: not_needed
licensing:
  license: >-
    Owner research products that archive public pages, municipal layers and operator tariffs; the sources keep the terms of their
    publishers. The consolidated package records its licence status in daten/license_status.json (no open licence for the Goslar
    service, dataset-specific licence needed for the Wolfsburg data, graphic reuse permission needed for the TU maps; the draft
    licence requests in the package were NOT sent), see the data record parking_zones_2026. Used by owner decision 2026-10-07.
  notes: >-
    The data derived from them and kept in the repository are facts of public rules and tariffs (parking_tariffs_2026, the
    coverage register) and, as local restricted files, the zone and garage geometry (parking_zones_2026, parking_garages_2026).
  redistribution: restricted
  restricted: true
limitations: >-
  Research products, not official data sets: the statements are the owner's reading of the archived sources and must be traced to
  the source named for them. The four working packages are superseded by the consolidated package. The Wolfsburg car-park review
  is superseded by the large-lot package of the folder municipal_2026-10-13 (data record parking_packages_municipal_2026_10_13).
notes: >-
  Used by the parking v2 and v3 work of issue #436 (ADR-0140, ADR-0142) through the curation chain
  (scripts/curation/parking_zones_2026/). Registered as a raw source of its own on 2026-10-17 (Part C final fix); before that the
  SHA-256 values were named in the data records parking_zones_2026 and parking_garages_2026 only.
