dataset: parking_packages_municipal_2026_10_07
title: >-
  Owner delivery of 2026-10-07 (the consolidated regional parking evidence package, two garage supplements, the Wolfsburg
  car-park review and four working packages), raw source of the regional zones and of the garage dataset
inventory_id: null
provider: >-
  The owner's (L. Bienzeisler's) research packages handed over on 2026-10-07 for issue #436 (parking cost zones v2, spec Amendments
  D and E): the consolidated regional evidence package Regional_Parkdaten_Belege_2026-10-07.zip (356 files, 27 GeoPackage layers,
  tariff rules and sources of the garage feed of Stadt Braunschweig (PULP) and the pages of the cities and garage operators, each
  rule with its source), the supplement and follow-up packages of the garage research, the review of the 24 car parks of the
  Wolfsburg city layer, and four working packages of 2026-10-02 that the consolidated package freezes and supersedes. The sources
  belong to their publishers (named per source in the packages)
vintage: >-
  Packages built 2026-10-02 (the four working packages) and 2026-10-07; their tariff rules and pages were retrieved between
  2026-10-02 and 2026-10-07 (source_date per rule), the Goslar positions are the city's snapshot of 2018-11-22
geography: >-
  Braunschweig, Wolfsburg, Goslar, Helmstedt, Peine, Salzgitter, Wolfenbuettel, Gifhorn, Bad Harzburg, Seesen, Koenigslutter and
  Schoeningen (the packages of the towns named in their file names)
crs: >-
  EPSG:25832 (GeoPackage layers of the regional package), as the package states
roles:
- spatial_input
- supply_input
acquisition:
  method: restricted_delivery
  source: >-
    Owner-supplied files, not downloaded by the pipeline. Obtain them from the owner (open an issue in TUBS-IVS/eqasim-bs) and
    verify them against the SHA-256 values in storage.notes.
  notes: >-
    Nine files in the folder municipal_2026-10-07/, stored byte for byte as received. READ by committed code (every one is checked
    against its pinned SHA-256 first, nothing is extracted): Regional_Parkdaten_Belege_2026-10-07.zip (the GeoPackage layers of
    the zone and garage curation and daten/tariff_rules.json: regional_zones.py, regional_garages.py),
    Parkhaus_Ergaenzungen_2026-10-07.zip (garage_supplement.py: four main points of garages without coordinates and six tariff
    checks) and Parkhaus_Nachrecherche_2026-10-07.zip (garage_supplement.py: the directory observations of Goslar and Wolfsburg).
    SUPERSEDED, history of the garage dataset only: Wolfsburg_Parkplaetze_Pruefung_2026-10-07.zip (the review of the 24 car parks of
    the Wolfsburg city layer; its reader was removed in Task 4l, owner decision 2026-10-14; regional_garages.py keeps the SHA-256
    as SUPERSEDED_WOLFSBURG_LOTS_SHA256). NOT READ by any committed code: the four working packages of 2026-10-02
    Braunschweig_Parkgebuehrenzonen_2023.zip, Goslar_Zone2_Gesamtpaket.zip, TU_Braunschweig_Parkbereiche.zip and
    Parken_BadHarzburg_Seesen_Koenigslutter_Schoeningen.zip (frozen and superseded by the consolidated package; archived, their
    contents are described in the data record parking_zones_2026), and MANIFEST.md, the owner's local inventory of the folder with the
    hashes and the content notes of the packages.
