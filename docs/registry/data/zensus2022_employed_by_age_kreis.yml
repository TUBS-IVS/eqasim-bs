dataset: zensus2022_employed_by_age_kreis
title: Zensus 2022 employed persons by age class and sex per Kreis (Regionaltabelle Bildung und Erwerbstaetigkeit)
inventory_id: B13
provider: Statistische Aemter des Bundes und der Laender
vintage: '2022-05-15'
geography: Kreis (ARS-5; the 8 ZGB Kreise) and Germany (00)
crs: null
roles:
- control
used_by:
- data.census.filtered
acquisition:
  method: derived
  source: 'Zensus 2022 Regionaltabelle "Bildung und Erwerbstaetigkeit" (https://www.zensus2022.de,
    Regionaltabelle_Bildung_Erwerbstaetigkeit.xlsx), sheet CSV-ET_Alter (columns
    ET_ALTER_ERW__<class>_<M|W>), the class order checked against sheet ET Alter; the cleancensus
    repository keeps the copy this table was written from under data/raw/regionaltabellen/
    (sha256 aad34940d33fa984e900ee18f732b53e60c6b6cb20da4d1305073d016c6a0a12, recorded in the
    CSV header).'
  script: scripts/extract_zensus2022_employed_by_age.py
  notes: 'Seven age classes (15-19, 20-29, 30-39, 40-49, 50-59, 60-67, 68+) x sex (M, F) for the
    8 ZGB Kreise and Germany; 126 rows. The employment grid merges 15-19 with 20-29 into its 16_29
    group and 60-67 with 68+ into 60plus (braunschweig.popsim.zensus_employment_age).'
storage:
  expected_path: eqasim-data/data/braunschweig/popsim/zensus2022_employed_by_age_kreis.csv
  committed: false
  local_only: true
  notes: Not committed under the data-protection policy in .gitignore (no data from statistical
    registers beyond the listed aggregate tables); regenerate it with the script.
verification:
  verifier_entry: B13
  script: scripts/verify_braunschweig_inputs.py
requirements:
  synthesis: optional
  matsim: not_needed
  production: required
licensing:
  license: dl-de/by-2-0
  restricted: false
  redistribution: allowed
limitations: 'Results of the Zensus 2022 sample survey (Haushaltebefragung), rounded by the
  publisher, like the Erwerbstaetige levels (kreis_erwerbsstatus) they shape. A Kreis missing from
  the table would take the national (00) shape, which the popsim stage logs as a WARNING.'
notes: 'Employment-grid age shape since ADR-0137 (braunschweig.population.popsim.
  employment_grid_age_shape_source: zensus2022_kreis_by_sex). It replaced
  zensus2022_employment_age, which is exact for the kreisfreie Staedte only.'
