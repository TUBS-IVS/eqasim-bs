dataset: copernicus_landuse_100m
title: Reclassified 100 m land-use tile (spatial prior for secondary locations), derived from clc_backbone
inventory_id: null
provider: derived (raw input and its provider and licence are the record clc_backbone)
vintage: unknown
geography: Lower Saxony bounding box, 100 m raster cells
crs: unknown
roles:
- derived_input
used_by: []
acquisition:
  method: derived
  source: Reclassified by hand from the raster of the data record clc_backbone into the classes
    braunschweig.data.inspire.landuse.VALID_CLASSES and written as GeoParquet; no preprocessing script exists
    in the repository.
  script: null
storage:
  expected_path: eqasim-data/data/braunschweig/preprocessed/inspire_landuse.parquet
  committed: false
  local_only: true
verification:
  verifier_entry: null
requirements:
  synthesis: not_needed
  matsim: not_needed
  production: not_needed
licensing:
  license: derived (source terms of clc_backbone apply)
  restricted: false
  redistribution: allowed
limitations: Read only when braunschweig.use_landuse_prior is true (default false); the stage is in no workflow
  DAG, so no committed configuration reads the tile. Vintage, CRS and the exact reclassification are unknown;
  braunschweig.data.inspire.landuse reprojects the tile to EPSG:3035 (or assumes EPSG:3035 when the file names no CRS).
notes: Read by the module braunschweig.data.inspire.landuse, which has no Stage Registry record because no
  workflow DAG contains it (so used_by stays empty). The path is the default of
  braunschweig.inspire_landuse_path.
