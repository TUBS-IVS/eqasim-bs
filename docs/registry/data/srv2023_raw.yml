notes: |
  Source of the committed srv2023_* aggregates: per-Kreis participation targets (#224,
  ADR-0055/0060), escort destination types (#201), secondary location types (#262).

  Only scripts/extract_srv_*.py (plus derive_srv_location_types.py, derive_escort_location_weights.py,
  build_srv_participation_aggregate.py) read this directory; nothing under braunschweig/ does. A
  checkout without it runs the whole pipeline normally -- it is needed only to REGENERATE an
  aggregate, which is why an empty srv2023_raw/ is easy to mistake for "the data is missing".

  The delivery ships longer file names and is copied+renamed into place; the untouched delivery
  stays outside the repository ("SrV 2023/Braunschweig und RGB/CSV/"):
    SrV2023_Einzeldaten_Braunschweig und RGB_SciUse_v4_P.csv -> SrV2023_Personen.csv
    SrV2023_Einzeldaten_Braunschweig und RGB_SciUse_v4_W.csv -> SrV2023_Wege.csv
    SrV2023_Einzeldaten_Braunschweig und RGB_SciUse_v4_H.csv -> SrV2023_Haushalte.csv
    SrV2023_Datenkodierung_SciUse.xlsx                       -> codebook/
    SrV2023_Teilraumkodierung_Braunschweig und RGB.xlsx      -> codebook/
  The delivery's ..._v4_P2_BRAU.csv / ..._v4_P2_RGB.csv are read by no generator and are
  deliberately not copied. Read format: sep=";", decimal=",", encoding="cp1252". The codebook is
  the authority for every variable value label; it is documentation, no generator opens it.

  Never-push guard: everything under eqasim-data/ is ignored ("eqasim-data/*" in the repository
  .gitignore) and the committed aggregates are the exception, force-added one by one. A nested
  .gitignore in srv2023_raw/ is a second barrier, because the ignore file's own comment block
  describes an "srv2023_*.csv" allowlist that a case-insensitive Windows checkout would let match
  SrV2023_Personen.csv. srv2023_raw/README.md (local-only) repeats this next to the data.
