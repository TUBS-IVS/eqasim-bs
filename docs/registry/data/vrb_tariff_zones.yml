dataset: vrb_tariff_zones
title: VRB tariff zones (Verkehrsverbund Region Braunschweig)
inventory_id: H2
provider: VRB
vintage: null
geography: null
crs: null
roles:
- supply_input
used_by:
- braunschweig.data.vrb.zones
acquisition:
  method: scrape
  source: https://www.vrb-online.de/de/tickets/tarifzonen-preisstufen
  script: scripts/build_vrb_stations_json.py
storage:
  expected_path: eqasim-data/data/vrb/tarifzonen.html -> vrb/stations.json
  committed: false
  local_only: true
verification:
  verifier_entry: null
requirements:
  synthesis: not_needed
  matsim: optional
  production: optional
licensing:
  license: VRB terms
  restricted: false
  redistribution: restricted
limitations: >-
  The HTML scrape assigns zones by locality NAME and therefore inherits the five wrong
  locality entries of the VRB website (see docs/data/vrb-tariff-zone-polygons-provider-notes.md)
  and leaves same-name localities in different Gemeinden ambiguous. Zone MEMBERSHIP should be
  taken from the official polygon layer (record vrb_tariff_zone_polygons) via the script's
  --waben mode; the scrape remains a cross-check only.
notes: Feeds the OeV fare module of the Java simulation (legacy ring remap in braunschweig.data.vrb.zones).
