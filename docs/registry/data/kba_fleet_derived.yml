dataset: kba_fleet_derived
title: Committed KBA/MiD fleet reference tables (kba/derived)
provider: derived in-repo from KBA / Destatis / MiD sources
vintage: 'mixed by design: 2025-01-01 (46251-02/-03, FZ 27), 2026-01-01 (Modellreihen, ID3438),
  2026-04-01 (Gemeinde EV, EV grid), MiD 2023'
geography: Germany (per-Kreis tables cover all ~400 Kreise; Gemeinde/grid tables cover the ZGB)
crs: null
roles:
- reference_table
- calibration_target
used_by:
- braunschweig.synthesis.vehicles.cars.household
acquisition:
  method: committed
  source: |
    Regenerate with, in this order:
      python scripts/extract_kba_fleet.py                      (18 tables from kba/ + kba/raw/)
      python scripts/build_mid_age_by_segment_status.py        (MiD Autos micro-data)
      python scripts/build_mid_antrieb_by_status.py            (MiD Autos micro-data)
    The two MiD builders need --mid-path unless the B1 package sits at their default location
    (see the mid2023_b1 entry). The extractor is idempotent: nine of the ten tables that predate
    issue #277 regenerate byte-identically from unchanged raw inputs.
  script: scripts/extract_kba_fleet.py
storage:
  expected_path: eqasim-data/data/braunschweig/kba/derived/*.csv
  committed: true
  local_only: false
verification:
  verifier_entry: null
requirements:
  synthesis: optional
  matsim: not_needed
  production: required
licensing:
  license: aggregate values
  restricted: false
  redistribution: allowed
limitations: |
  Multiple Stichtag vintages coexist BY DESIGN (ADR-0081): each table carries its own stichtag
  column and counts are never reconciled across vintages. Two source-side limitations are load-bearing
  for the model and are handled explicitly rather than papered over:
  * kba_gemeinde_ev.csv carries only the COMBINED electric share -- the KBA 2026.04 export publishes
    literal zeros in every BEV / plug-in-hybrid / fuel-cell column (ADR-0086).
  * Per-Kreis vehicle AGE and SEGMENT do not exist in any open source, so those axes stay national
    (ADR-0081); kba_age_national.csv is a validation anchor, not an IPF control.
  KBA counts vehicles REGISTERED in a Kreis (company cars at the business seat), the synthesis
  produces HOUSEHOLD cars: spatial patterns are comparable, exact levels are not.
notes: |
  18 tables. Powertrain and Euro class per Kreis (kba_kreis_fuel.csv 403 Kreise, kba_kreis_euro.csv),
  Euro-6 substage split (kba_fuel_euro6_substage_nds.csv), segment x powertrain, brand x powertrain,
  segment -> model series and per-model fuel weights (kba_segment_model.csv / kba_model_fuel.csv,
  658 series), per-Gemeinde EV 2026 and the 5 km EV grid (kba_gemeinde_ev.csv, kba_ev_grid.csv),
  the FZ 27.17 private BEV/PHEV sheet (kba_gemeinde_private_bev.csv, still the Kreis-mean denominator
  weight source), the national age anchor (kba_age_national.csv), the RegioStaR-7 EV cross-check
  (kba_ev_regiostar7.csv, logging only) and four MiD cross tables including
  mid2023_antrieb_by_status.csv (P(powertrain | economic status), the EV-income tilt input).
  scripts/measure_combustion_split.py and scripts/measure_gemeinde_join_coverage.py check the
  realised fleet against these tables.
