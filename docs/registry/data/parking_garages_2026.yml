dataset: parking_garages_2026
title: Parking garages and surface lots of eight ZGB towns with their own tariff, one point per facility (October 2026)
inventory_id: null
provider: >-
  Own curation (issue #436, parking cost zones v2, spec Amendment E1, Task 4b) of the owner-supplied regional evidence
  package Regional_Parkdaten_Belege_2026-10-07.zip (SHA-256 e789623752bf508b3e31f37ed2e30fe019e171cb43274f495cfacc12924008e7;
  its contents and licences are described in the data record parking_zones_2026), whose garage layers and preferred
  tariff rules rest on the garage feed of Stadt Braunschweig (PULP) and the pages of the garage operators and cities
  (braunschweig.de, wolfsburg.de, stadt-helmstedt.de, meingoslar.de, contipark.de, parkundtank.de, sabaparking.com,
  aufbau-gmbh.de, city-galerie-wolfsburg.de, designeroutlets-wolfsburg.de, brawo-carree-salzgitter.de,
  marktpassage-helmstedt.de, psg-gifhorn.de, stadtbetriebe-wf.de, stadtwerke-peine.de), the Stadt Wolfsburg Geoviewer
  Themenkarte Parken, the ArcGIS service Bewohnerparken of Stadt Goslar (positions of 2018) and, for some positions,
  directory pages (parkinglist.de, parkito.ch) and OpenStreetMap features read through mapcarta.com; the check of the
  car parks that are no garage also reads the city car-park directory of Braunschweig (bs_plan_parkplaetze.geojson,
  retrieved 2026-09-29); three further owner-supplied packages of 2026-10-07 complete it (spec E12, E13 and E14): the
  supplement
  Parkhaus_Ergaenzungen_2026-10-07.zip (SHA-256 76d2651433e05a4d0d0a75ba352fd17f99b329555eb3bb4525c34990383978fa: four main points of garages without coordinates, from
  OpenStreetMap, and six tariff checks of Braunschweig, Wolfsburg and Goslar) and the follow-up
  Parkhaus_Nachrecherche_2026-10-07.zip (SHA-256 3bbaff93fb8b26d6cdfb187c7e0bf746f099997c1c7fd04a961fcae7d37329d8: directory observations for Goslar Achtermann and
  Charley-Jacob-Strasse and the Wolfsburg Suedkopf-Center, and their recommendations) and the Wolfsburg car-park package
  Wolfsburg_Parkplaetze_Pruefung_2026-10-07.zip (SHA-256 650508f87c80ee2b84063def301ff67b5ecb8f2653cef2ab4202fb398c818df0:
  the review of the 24 car parks of the Wolfsburg city layer wob_parkplaetze, whose points are those of the Stadt Wolfsburg
  Geoviewer theme Parken, whose operator tariffs are those of the Autostadt GmbH and the Klinikum Wolfsburg and whose free
  car parks are those of the pages of the Wolfsburg Marketing GmbH and the Theater Wolfsburg); since Task 4j (spec Amendment
  I, owner decisions of 2026-10-13) the research package Grossparkplaetze_ZGB8_2026-10-12.zip (SHA-256
  d467275ced5b68717ff2f426ad94be4debd085a9bebfaa239cfa6f4518fc9db4: 152 reviewed records of large surface lots of the eight
  towns with 198 tariff rules, 238 sources and 120 research points, every rule with its source) is the source of every row
  of a surface lot and replaces the Wolfsburg car-park package for the rows (that package is SUPERSEDED: since Task 4l the
  curation step no longer reads it; it is listed here as the history of the dataset)
vintage: >-
  Package of 2026-10-07: the tariff rules and pages were retrieved between 2026-10-02 and 2026-10-07 (source_date per
  garage); the Braunschweig car-park directory 2026-09-29; the Goslar positions are the city's snapshot of 2018-11-22.
  The large-lot package: data state 2026-10-13, source_date per lot (2026-10-12 on 49 lots, 2026-10-07 on 5, 2026-10-13 on 1).
  Tariffs as published in October 2026, applied to the model's average weekday.
geography: >-
  94 rows in eight towns: 36 garages (Braunschweig 12, Wolfsburg 10, Wolfenbuettel 2, Gifhorn 1, Helmstedt 4, Peine 2,
  Salzgitter 1, Goslar 4) and 58 surface lots at the size threshold of 50 spaces (Braunschweig 11, Salzgitter 9, Goslar 9,
  Wolfsburg 10, Wolfenbuettel 7, Helmstedt 5, Peine 4, Gifhorn 3), so Braunschweig 23, Wolfsburg 20, Goslar 13, Salzgitter 10,
  Helmstedt 9, Wolfenbuettel 9, Peine 6, Gifhorn 4. Points, WGS84 (CRS84) on disk, EPSG:25832 in memory.
crs: EPSG:25832 (CRS84 on disk)
