dataset: parking_garages_2026
title: Parking garages of eight ZGB towns with their own tariff, one point per garage (October 2026)
inventory_id: null
provider: >-
  Own curation (issue #436, parking cost zones v2, spec Amendment E1, Task 4b) of the owner-supplied regional evidence
  package Regional_Parkdaten_Belege_2026-10-07.zip (SHA-256 e789623752bf508b3e31f37ed2e30fe019e171cb43274f495cfacc12924008e7;
  its contents and licences are described in the data record parking_zones_2026), whose garage layers and preferred
  tariff rules rest on the garage feed of Stadt Braunschweig (PULP) and the pages of the garage operators and cities
  (braunschweig.de, wolfsburg.de, stadt-helmstedt.de, meingoslar.de, contipark.de, parkundtank.de, sabaparking.com,
  aufbau-gmbh.de, city-galerie-wolfsburg.de, designeroutlets-wolfsburg.de, brawo-carree-salzgitter.de,
  marktpassage-helmstedt.de, psg-gifhorn.de, stadtbetriebe-wf.de, stadtwerke-peine.de), the Stadt Wolfsburg Geoviewer
  Themenkarte Parken, the ArcGIS service Bewohnerparken of Stadt Goslar (positions of 2018) and, for some positions,
  directory pages (parkinglist.de, parkito.ch) and OpenStreetMap features read through mapcarta.com; the check of the
  car parks that are no garage also reads the city car-park directory of Braunschweig (bs_plan_parkplaetze.geojson,
  retrieved 2026-09-29)
vintage: >-
  Package of 2026-10-07: the tariff rules and pages were retrieved between 2026-10-02 and 2026-10-07 (source_date per
  garage); the Braunschweig car-park directory 2026-09-29; the Goslar positions are the city's snapshot of 2018-11-22.
  Tariffs as published in October 2026, applied to the model's average weekday.
geography: >-
  31 garages in eight towns: Braunschweig 10, Wolfsburg 9, Wolfenbuettel 2, Gifhorn 1, Helmstedt 2, Peine 2,
  Salzgitter 1, Goslar 4. Points, WGS84 (CRS84) on disk, EPSG:25832 in memory.
crs: EPSG:25832 (CRS84 on disk)
roles:
- supply_input
- reference_table
used_by: []
acquisition:
  method: derived
  source: >-
    The package zip and the directory under eqasim-data/data/braunschweig/parking/raw_sources/ (local, gitignored): the
    garage layers bs_parkhaeuser, wob_parkhaeuser, region_parkhaeuser and gos_parking_locations of
    daten/Regional_Parkdaten.gpkg, the tables daten/facilities.json and daten/tariff_rules.json, and the directory
    bs_plan_parkplaetze.geojson (SHA-256 861bc29046fe1ee95dead0ead198908505529cd26ba133de46335efcfb62fd43)
  script: scripts/curation/parking_zones_2026/regional_garages.py
  notes: >-
    One-off curation, never a pipeline stage: python scripts/curation/parking_zones_2026/regional_garages.py
    --regional-dir eqasim-data/data/braunschweig/parking/raw_sources/municipal_2026-10-07 --directory
    eqasim-data/data/braunschweig/parking/raw_sources/bs_plan_parkplaetze.geojson --municipalities <pickle of the stage
    data.spatial.municipalities; on 2026-10-07
    eqasim-data/cache_bs_bpsmoke/data.spatial.municipalities__c04db1943ae15b4681d256f4d6eee421.p> --out
    eqasim-data/data/braunschweig/parking/parking_garages_2026.geojson --qa-out
    eqasim-data/data/braunschweig/parking/parking_garages_2026_qa.csv --tariffs
    eqasim-data/data/braunschweig/parking/parking_tariffs_2026.csv. The step checks the package and the directory against
    their pinned SHA-256 before it reads them, reads the layers from the zip (EPSG:25832, valid, non-empty; nothing is
    repaired) and prints a ledger per layer (features, garages, used, twins skipped). Every garage feature must be
    specified in regional_garage_specs.py or be a twin (a feature whose facility id another layer gives: three Goslar
    features), otherwise the step stops. A garage of the package's layers that is no garage of the dataset must be decided
    explicitly as a candidate (a station car park of DB BahnPark, a lot of long-term renters), a QA row with its reason;
    a facility is never both. A garage specification names the package facility and the ROLE of each tariff rule (a rate,
    or the tiers; a first period; the day cap; the charging window; other tiers; other caps; ignored rules), so no tariff
    number is typed: the columns are read from the rules, and the step refuses a rule that does not fit its role (a first
    period that does not end where the rate starts, a cap rule of another type, a window that crosses midnight in the
    single-window form, tiers that overlap or differ in their billing unit). The one typed exception is a charging window
    that a source states only in a page text which the package keeps as text (window=("stated", ...)); it is typed with its
    quotation, which the notes repeat (Helmstedt Edelhoefe: the brochure 'Oeffnungszeit: 24 Stunden' and the ordinance of
    2018-12-18 sec. 2(1), 00.00 to 24.00). PREFERRED FLAG (ruling R-4b-8): every rule that SETS a value (a rate, a tier, a
    first period or first unit, a cap, the window of a rule, the monthly product that is used) must be marked
    preferred_for_current_use in the package, with no waiver; a specification that names another rule for such a role
    stops the step. A rule that is not preferred may only be named as other tiers, other caps or an ignored rule, and the
    notes then mark it '[not preferred for current use]' and list every non-preferred rule that is used for nothing; the
    phrase '(all marked preferred_for_current_use in the package)' of the notes is derived from the flags, never written by
    hand. The consequence for Wolfsburg Poststrasse: its only window comes from the unresolved night rule
    WOB_POST_R03_150, which is not preferred, so it sets no window (ASSUMPTION P5, 0 to 24 h) and is named under P3. A
    garage is priced only where the published structure maps exactly to the garage columns or to time-of-day tiers
    (rulings R-4b-3 and R-4b-10b); otherwise it is listed and not priced with a reason code: banded_tariff (the bands cannot
    be expressed by a first period plus one rate or by tiers), free_period (a free first period the columns cannot
    express), conflicting_sources, incomplete_tariff or no_published_tariff. TWO FORMS (ruling R-4b-10b): the
    single-window form (garage_hourly_rate_eur and garage_billing_unit_min with the fee window garage_fee_start_h and
    garage_fee_end_h, optionally a first period and a day cap) and the tiered form (the one validated, human-readable
    column tariff_tiers, for example '08:00-10:00 0.30/30; 10:00-18:00 0.60/30; 18:00-22:00 0.30/30; 22:00-08:00 0.10/30':
    each tier is the EUR of one started unit of unit_min minutes that begins in the tier; a tier may cross midnight; a time
    of day outside every tier is free; one unit length per garage; no overlap; a first period and a day cap stay in their
    columns). The two forms are mutually exclusive: a tiered garage leaves the rate, the unit and the fee window empty, and
    the loader refuses a row that holds both. Six of the 19 priced garages are tiered: Braunschweig Eiermarkt, Wolfsburg
    Rathaus, Phaeno and Rothenfelder, Wolfenbuettel Schulwall and Rosenwall. The assumptions are named in the column
    assumptions and in the notes of the row, and counted at every run: P3 a night tariff that is no per-unit rate of the
    preferred rules (a flat night fee, an unresolved night tier) is stated in the notes and not charged; P4 a rate without
    a stated rounding is billed per started unit (precedent D3-a of the tariff table; the note cites the caution of the
    package that a stated hourly rate does not prove rounding up per hour, and the census of the package's preferred
    garage rate rules that the step prints and the note repeats: 25 of 54 state their rounding and all 25 say started
    unit); P5 the fee window is 0 to 24 h where no preferred rule states charging times (a ticket garage bills the stay
    from entry to exit; opening hours are no charging hours); P6 the pricing of tiers: units are counted from the arrival
    and each started unit costs the rate of the tier in force at the unit's start, a first period (where published) is
    charged once and applies from arrival at every hour, a time of day outside every tier is free (the pricing itself is
    implemented in the later tasks 4d and 4e; this record and the notes of every tiered garage state the semantics the
    tiers were encoded for); P7 the day cap column holds ONE cap and applies to the whole stay: of several published caps
    (a day cap, a night cap, a 24-hour maximum) the day cap or, where there is none, the 24-hour maximum is encoded and
    the others are named in the notes and not applied (five garages: Eiermarkt, Rathaus, Phaeno, Rothenfelder and
    Poststrasse). Two READINGS name no assumption id and are counted and named in the notes: a day cap whose day boundary
    the source does not state (cap period unspecified or absent) is read as a maximum per stay (11 of the 16 priced garages
    with a cap), and a time window without stated days is read as Monday to Friday (4 garages: Rathaus, Phaeno,
    Rothenfelder and Rosenwall; the package's README says that missing weekdays were not automatically read as Monday to
    Sunday). The step warns above two documented thresholds: more than 75 % (ASSUMPTION_WARNING_SHARE) of the priced garages
    on one assumption, and more than 75 % (garages.UNION_WARNING_SHARE, which the loader also applies) on at least one
    assumption or on P4 or P5; the union rates are 18 of 19 (94.7 %, a warning) on at least one assumption and 14 of 19
    (73.7 %) on P4 or P5. The operator column is the package's (a feature or facility attribute) or, where the page named in
    source_url is the operator's own page, that operator, with a note naming the page (Contipark: Eiermarkt and
    Wallstrasse; Park und Tank: Magni and Packhof). Monthly and 30-day products follow spec Amendment D2 and ruling R-D2-a:
    the cheapest publicly purchasable fixed-price product of a garage is monthly_eur (source in monthly_source_url, the
    product in monthly_product); a product that is limited by a waiting list is still a product of the public (it is used
    where it is the cheapest), whereas a permit that is capacity-limited for a closed group (the Goslar permits) is not; every
    product that is not used is a row of the QA table with the reason (not_the_cheapest, restricted_customer_group,
    no_fixed_price, capacity_limited_permits, no_coordinates, garage_not_listed, not_monthly_or_30_day, outdated_source).
    The QA table parking_garages_2026_qa.csv has three record types: garage (the decision on every garage),
    monthly_product (every product that the sources publish, used or not, with its amount; the used products of zone rows
    are the 30-day ticket of zone Ib and the TU member month ticket behind commuter_day_eur of the tariff table) and
    candidate (a package or directory entry that is no garage of the dataset, with the reason: bga_zone,
    zone_street_product, station_bahnpark, customer_regime, no_coordinates, no_published_tariff, outside_source_list,
    dauerparker_only; rulings R-4b-4, R-4b-9 and R-4b-10b). STATION CAR PARKS (rulings R-4b-4 and R-4b-9): a station car park
    run by a private operator or as DB BahnPark is no garage option, in Braunschweig and Wolfsburg alike; the Wolfsburg
    Parkdeck Hauptbahnhof P1 (Contipark / DB BahnPark) is therefore the candidate candidate_wob_hauptbahnhof and its
    monthly products are recorded and not used (garage_not_listed). SHOPPING-CENTRE GARAGES (ruling R-4b-9): Braunschweig
    Schloss-Arkaden and Ring Center, Wolfsburg City-Galerie and Suedkopf-Center and the Wolfsburg designer outlets stay
    garages. The coverage register (parking_coverage_register_2026.csv) lists the shopping-centre car parks and the designer
    outlets car park as 'excluded' rows because of their customer or visitor regimes: that keeps them out of the ZONE layer
    (paid street and area zones of parking_zones_2026), which is a different layer; as public garages with a published
    tariff they are garage options of spec Amendment E. A customer-only tariff is no part of the public tariff and is named
    in the notes as not encoded where the package states one. The positions are checked against the municipality polygons
    of the pipeline (every garage inside its own municipality, no two garages within 1 m; the municipality pickle of the
    command is the stage output named above; where the pipeline cache was absent in the worktree of Task 4b fix round 1 a
    pickle built from the VG250 municipality layer with ARS as commune_id was used, 31 of 31 inside); each row states how its
    position was found (geometry_method, geometry_source_url). The dataset and the QA table are written by
    braunschweig.parking.garages.write_garages (one feature per line, ASCII, LF, 7 decimals) and read back through the
    loaders and validators before the step ends; two runs write identical bytes.
storage:
  expected_path: eqasim-data/data/braunschweig/parking/parking_garages_2026.geojson
  committed: true
  local_only: false
  notes: >-
    Force-added (git add -f) like the rest of the parking release, with the QA table parking_garages_2026_qa.csv next to
    it (also force-added; the .gitignore comment of the committed parking release names both). GeoJSON FeatureCollection
    with the foreign members license, attribution and documentation (the definition of every column, from
    COLUMN_GLOSSARY of the curation step); ASCII, LF in the repository.
verification:
  verifier_entry: D11
  script: scripts/validate_parking_zones.py
  notes: >-
    Listed as D11 (matsim_only, optional, committed) in scripts/verify_braunschweig_inputs.py: no stage reads it yet.
    braunschweig.parking.garages.validate_garages checks unique ids, valid points inside the ZGB counties, the garage
    core all-or-none (spec Amendment A6), the two tariff forms (a tiered row has valid tariff_tiers and leaves the single
    window empty; a row never holds both), positive units, a day cap not below the first period, fee windows 0 <= start <
    end <= 24, complete priced rows, a reason on every unpriced row, a monthly product only with a source, every
    assumption named in the notes and ASSUMPTION P6 exactly on the tiered rows; load_garages logs the union rates and
    warns above garages.UNION_WARNING_SHARE; braunschweig.parking.garage_qa.validate_garage_qa checks the QA table against the
    dataset and, with the tariff table, commuter_day_eur against the used product over 21 working days.
    scripts/validate_parking_zones.py runs both when the dataset exists and prints one summary line (garages listed,
    priced, not priced by reason, per municipality, the assumption rates with the union rates and the tiered garages,
    the monthly products, the candidates).
    tests/test_parking_garages.py pins the loader, the writer and both validators on synthetic rows;
    tests/test_parking_regional_garages.py pins the curation step on a synthetic package and the committed files from a
    hand-written table of the sources (19 priced and 12 unpriced garages with their tier strings, the coverage numbers,
    the notes rules, the QA counts) and, where the package exists locally, reproduces both committed files byte for byte;
    the curation tests also refuse a rule that is not preferred for every value role (rate, first period, first unit, tier,
    cap, monthly product).
requirements:
  synthesis: not_needed
  matsim: optional
  production: optional
licensing:
  license: >-
    Per source; the dataset holds facts (tariffs, capacities, names and positions of garages) from public sources, none of
    them under a verified open licence: the garage feed of the City of Braunschweig (PULP; the package records no licence);
    the operator pages of the garages (tariff facts; the licence of the pages is not verified); the Stadt Wolfsburg
    Geoviewer Themenkarte Parken (Stand 12/2024; open reuse licence not verified; used by owner decision 2026-10-01); the
    Stadt Goslar ArcGIS service Bewohnerparken (last edit 2018-11-22) and its service page meingoslar.de/service (open reuse
    licence not verified; used by owner decision 2026-10-07); the Helmstedt city brochure (facts; licence not verified); and,
    for some positions, directory pages (parkinglist.de, parkito.ch; terms not verified) and OpenStreetMap features read
    through mapcarta.com (Peine Werderstrasse, Salzgitter BRAWO Carree): ODbL 1.0, (c) OpenStreetMap contributors.
  restricted: false
  redistribution: restricted
  notes: >-
    Redistribution per source, so the dataset as a whole is not cleared for redistribution (redistribution restricted):
    the two OpenStreetMap-derived positions keep the OpenStreetMap attribution and the ODbL share-alike terms; the other
    sources are facts of public pages whose licences were not verified; the file is committed as specified by ruling R-4b-1
    of Task 4b, and the Wolfsburg and Goslar sources are used by the owner decisions of 2026-10-01 and 2026-10-07 recorded in
    the data record parking_zones_2026. The file carries the licence and the attribution as top-level members; the QA table
    names its sources in its header.
limitations: >-
  No stage reads the dataset yet: the pricing code is unchanged, so no simulation output changes with this dataset, and the
  zone-level garage columns of the tariff table stay empty (spec Amendment E8); the distance-weighted garage options of spec
  Amendment E, and the pricing of the tiers (ASSUMPTION P6), are later tasks (4d and 4e). The dataset is a coverage of what
  the package documents, not a census of the garages of the towns. Not listed are: the car parks that the package knows
  without coordinates (Braunschweig Lange Strasse Sued and Steinstrasse, the Helmstedt parking deck Stobenstrasse, the
  Clausthal-Zellerfeld garage Am Rathaus; no geometry is invented) and the Helmstedt Tiefgarage Groepern (the city brochure of
  December 2024 lists 118 spaces, 0.70 EUR for the first hour, each further 0.30 EUR, 24 h; the package holds neither a
  facility record nor coordinates, so it is a candidate with the reason no_coordinates and the brochure tariff in its note);
  the Seesen garage (outside the towns of spec Amendment E1); the BgA lots (zones); the ParkGO zone 1 car parks of
  Braunschweig; the station car parks of Braunschweig and Wolfsburg (DB BahnPark and private operators, rulings R-4b-4 and
  R-4b-9; the Wolfsburg Parkdeck Hauptbahnhof P1 and its monthly products are a candidate and QA rows); the two Wolfenbuettel
  lots Parkpalette Karlstrasse and Parkplatzanlage Neue Strasse, which the operator page offers 'momentan nur Dauerparkern'
  (a closed group of long-term renters; the owner's direction is that their free or contract parking is covered by the
  model's averaged free-parking share; reason dauerparker_only); and the Wolfsburg car parks (no tariff in the package). 12 of
  the 31 listed garages are not priced, 7 of them because the published bands cannot be expressed exactly (banded_tariff), so
  Peine, Salzgitter and Goslar have no priced garage. The tariff values are the package's preferred rules of 2026-10-07; they
  were not compared with any observed payment, occupancy or cash-desk data, so the dataset says what the operators publish,
  not what drivers pay. Five assumptions and two readings carry the encoding and are counted per row (see the acquisition
  notes): P3 on 1 of the 19 priced garages (Wolfsburg Poststrasse), P4 on 8, P5 on 10, P6 on 6 (every tiered garage), P7 on
  5; 18 of the 19 priced garages rest on at least one assumption, and 14 of the 19 on P4 or P5, which is the share of the
  priced garages whose rounding or charging times the sources do not state: the dataset is mostly a structure published by
  the operators plus these assumptions, and a sensitivity arm can leave a group out by the id in the assumptions column.
  Round 1 of the fix replaced P3 by tiers wherever the night or shoulder tariff is a per-unit time-of-day rate: before it
  P3 stood on 7 garages (Eiermarkt, Rathaus, Phaeno, Rothenfelder, Poststrasse, Schulwall, Rosenwall); now only Poststrasse
  keeps it, because its night tier is unresolved. The two READINGS: a day cap whose day boundary is not stated is read
  as a maximum per stay (11 of the 16 capped garages), and a time window without stated days is read as Monday to Friday (4
  garages). P7: where a garage publishes a night cap or a 24-hour maximum next to its day cap (Eiermarkt, Rathaus, Phaeno,
  Rothenfelder, Poststrasse) the model applies the day cap to the whole stay, so a long stay is capped higher or lower than
  the operator's combination of caps would give. Judgements in single rows: the Wolfsburg garage Poststrasse has no
  window that a preferred rule states (the unresolved night rule is not preferred), so the model charges the whole stay at
  2.00 EUR per started hour up to the published day rate of 9.00 EUR (read as the day cap) and does not charge the night
  tier; Wolfenbuettel Schulwall and Rosenwall are priced from the operator pages of September 2026 with the four tiers of
  their weekday (the operator's Sunday and public-holiday line is not used, spec D1) and without a day cap (none is
  published); the Helmstedt garage Edelhoefe follows the city brochure of December 2024, which the package marks preferred,
  although the ordinance of 2018-12-18 states another structure (0.50 EUR first 30 min, 1.00 EUR up to 1 h, 2.00 EUR up to 2
  h, 0.50 EUR per further hour, at most 8.00 EUR), which is recorded in the notes and not encoded; the Goslar garage
  Achtermann is not priced because its published rates contradict its published totals (the package marks the rule set
  conflicting); the Goslar garage Charley-Jacob-Strasse is listed from a snapshot of 2018 whose current existence is not
  verified; the monthly products named Dauerparker Tag have no defined time scope in the application and are used as the
  cheapest product of their garage (D2); a product limited by a waiting list is used, a capacity-limited permit of a closed
  group (Goslar) is not; the shopping-centre garages are kept as garage options although the coverage register excludes
  their areas from the zone layer (ruling R-4b-9); the capacity is the reported value and no model input (conflicting totals
  are left empty and named in the notes). Positions are of different quality: the city feeds and the Geoviewer give points of
  the garage, operator map markers and directory navigation points are approximations, two positions are OpenStreetMap
  features (a feature centre, a parking node) read through mapcarta.com (no survey), and the Goslar garage Ca has a directory
  point 54 m from the city's point of 2018; the position check only requires the point inside its municipality. The operator
  column is empty where neither the package nor the page of the source names one (Braunschweig Forschungsflughafen, Lange
  Strasse Nord, Ring Center, Schloss-Arkaden, Schuetzenstrasse and Wilhelmstrasse, Wolfsburg Schillerstrasse and three
  Goslar garages).
