    (Wolfsburg BadeLand / Eis Arena and Wolfenbuettel Okeraue) and the one of the class mixed_public_and_customers
    (Wolfenbuettel P6 Bahnhof / Check In) are options under the package's own shortlist rule at their general tariff; the
    customer discount is not modelled. Spec E14 (e), which had excluded the BadeLand as a customer regime, is reversed for
    the BadeLand on the new evidence of the package: its general tariff (the Zone I fee of the bath tariff, 1.00 EUR per
    started 30 min) applies to everyone, and the free parking for guests of the bath with a validated ticket (the component
    WOB_PARK_1114127__2, not used) is a customer condition and not modelled (ruling R-4j-3). The Check In lot is a mixed
    site: the package states 334 spaces in total, 130 of them exclusively for the hotel guests of the elaya hotel, and
    derives 204 for the public; the row names this as 'derived capacity 204 of 334 (130 hotel guests)', a derivation of the
    package and no separately published value, and keeps the lot an option under the rule of ruling R-4j-3 (ruling R-4j-8);
    the capacity for the threshold is the 204, the lot is free by an explicit statement of its primary source. CAPACITY: a
    reported capacity fills capacity_reported on 34 of the 58 lots; the capacity for the threshold is named in the notes
    only and is no model input, and the weights of the garage options ignore it. Its ORIGIN is logged per run (the package's
    own selection order against its fallbacks): reported 34, an OpenStreetMap tag 5, an area estimate (the floor of the area
    divided by 25 m2, evidence level assumption, alone or as a sum of components) 18, derived 1; a selection method that the
    step does not know is counted as other and warned. EDGE CASES OF THE THRESHOLD: two options have exactly 50 spaces, the
    Gifhorn Iseparkplatz (an area estimate: the package states no capacity) and the Salzgitter Rathausvorplatz (an
    OpenStreetMap tag of 50, while a historic municipal survey states 47, which the package keeps separately and which would
    put the lot below the threshold); both are options at 30 and 50 spaces and none at 100. SOURCES AND POSITIONS: the
    source of a row's tariff is the first source of the package that states a URL and a date and is no web-service layer
    (the Geoviewer layer of the Stadt Wolfsburg places and zones a site and states no fee: the Allerpark now cites the page
    of the Wolfsburg Marketing GmbH that states it free, the BadeLand its own page of that company and the three lots with
    the zone product the Wolfsburg Parkgebuehrenordnung of 2020-07-21), a web-service layer only as a counted fallback (0 of
    58); the position source is the OpenStreetMap object that the package matched (53 lots), else a source that the package
    names for the coordinates (4), else the tariff source as a counted fallback (1 of 58: Volkswagen Arena P1, spec v3 B4; the
    earlier code let the tariff source stand in without a count, which no row of the release before B4 needed). The run logs each
    rate and warns of every
    fallback. EXPORT:
    the tariff model lists ASSUMPTION P14 in its register exactly when a priced row names it (the model of the release lists it for
    the two lots), like P13; no key, schema or golden fixture changes, and the register keeps the rule text of the withdrawn
    ASSUMPTION P12 (garages.WITHDRAWN_ASSUMPTIONS states the withdrawal in the dataset documentation and the curation log),
    because that text is part of the fixture model whose LF hash is pinned for the Java copies.
