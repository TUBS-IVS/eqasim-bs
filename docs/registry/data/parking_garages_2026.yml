verification:
  verifier_entry: D11
  script: scripts/validate_parking_zones.py
  notes: >-
    Task 4f (spec Amendment F): the validator accepts monthly_imputed_eur only together with P13 in assumptions (and P13
    only with the value), never next to a published monthly_eur, never at a surface lot or an unpriced garage; the QA
    validator recomputes the medians from the QA table (garage_qa.expected_imputed_monthly) so that a stale table fails; the
    script prints one line with the published, imputed and none counts per municipality and the medians. A dataset file
    without the column (written before Amendment F) is refused by load_garages (LegacyColumnsError, naming the column and the
    curation command); only a caller that opts in with allow_legacy_columns=True (the test fixtures; the zones stage only when
    every row carries the test-set marker) reads it with the column empty and a warning. The export and the curation warn per
    municipality when more than half of its priced garages carry an imputed instead of a published product.
    Listed as D11 (matsim_only, required, restricted, local only) in scripts/verify_braunschweig_inputs.py: the sixth input of the
    release of braunschweig.parking.zones_stage (config key parking_garages_path), which loads and validates it with
    the validator below; braunschweig.parking.tariff_export.garage_entries writes its priced garages into the tariff
    model (schema 4).
    braunschweig.parking.garages.validate_garages checks unique ids, valid points inside the ZGB counties, the garage
    core all-or-none (spec Amendment A6), the three tariff forms (a tiered row has valid tariff_tiers and leaves the
    single window empty; a banded row has valid tariff_duration_bands, leaves the rate, the unit, the first period and
    the tiers empty and sets its fee window; a row never mixes forms), the clock window of the first period (both
    hours or neither, only with a first period, 0 <= start < end <= 24), positive units, a day cap not below the first
    period, fee windows 0 <= start < end <= 24, complete priced rows, a reason on every unpriced row, a monthly
    product only with a source, every assumption named in the notes, ASSUMPTION P6 exactly on the tiered rows and
    ASSUMPTION P8 exactly on the rows with a priced duration schedule (not on the free schedule '0- free' and not on the
    grace period of a tiered row, which is one closed free band next to the tiers), ASSUMPTION P10 only with a free first
    band that something follows (a tiered row with a grace period lists it), ASSUMPTION P12 only with the free schedule (it
    is withdrawn since Task 4j: no row carries it, and the validator still accepts it for older datasets), ASSUMPTION P14
    only on a surface_lot, a facility_kind of garage or surface_lot on every row, one to five distinct package SHA-256
    values per row; load_garages logs the union rates and the banded count and warns above
    garages.UNION_WARNING_SHARE; braunschweig.parking.garage_qa.validate_garage_qa checks the QA table against the dataset
    and, with the tariff table, commuter_day_eur against the used product over 21 working days and the zone and the
    published hourly reference of every Wolfsburg car park inside a zone (garage_qa.zone_reference_check compares that
    reference with hourly_rate_eur of the zone: a difference is a finding, never an error). Since Task 4j it also checks
    every lot that carries the street product of its zone (garage_qa.zone_product_lot_check compares the whole street
    equivalent of the row, garage_qa.lot_street_equivalent: the rate, the billing unit, the grace period, the daily cap, the
    fee window, the maximum stay with its long-stay product and the commuter product, with the row of the tariff table: a
    difference fails the validation, because the dataset or the table is stale, and the zone tariff is never changed by a
    lot). Since the fix round (ruling R-4j-7) garage_qa.zone_consistency_check compares EVERY surface lot that the QA table
    assigns to a zone polygon (column zone_ids of its garage row) with the row of that zone, report-only: a difference of a
    lot with a package component is named in its QA note and is never an error, only a zone that the tariff table does not
    hold is.
    scripts/validate_parking_zones.py runs both when the dataset exists and prints one summary line (garages listed,
    priced, not priced by reason, per municipality, the assumption rates with the union rates and the tiered and the
    banded garages and those with the free schedule, the facility kinds, the monthly products, the candidates) and three
    lines with the consistency checks: the car parks inside a zone of spec E14 (0 checked, no candidate of the reason
    zone_street_product is left), the lots with the street product of their zone (12 checked, 12 equal, 0 differ) and the
    report-only pass over every lot inside a zone polygon (22 checked, 16 equal, 6 differ, the lots named in the acquisition
    notes; surface lots only: a garage inside a zone polygon, 28 of the 36, keeps its own operator tariff by design and is
    not compared with the street row of its zone).
    tests/test_parking_garages.py pins
    the loader, the writer,
    the band grammar, the evaluation and both validators on synthetic rows; tests/test_parking_regional_garages.py
    pins the curation step on a synthetic package and the committed files from a hand-written table of the sources (36
    garages and the 58 surface lots, each lot typed by hand from its package rules, with their tier and band strings, the
    published anchors of the band schedules and
    their edges, the identity check of the Ring-Center, the coverage numbers, the notes rules, the QA counts) and,
    where the packages exist locally, reproduces both committed files byte for byte; tests/test_parking_bs_monthly_products.py pins the Braunschweig monthly reader and ASSUMPTION P13 on a synthetic package (and reads the real package where it exists); tests/test_parking_large_lots.py
    pins that the reader of the superseded Wolfsburg package is gone (the option, the loader argument and the specifications of
    spec E14 are removed in Task 4l; the tests of that reader, tests/test_parking_wolfsburg_lots.py, were removed with it, and
    its tests of the committed rows of the 13 Wolfsburg car parks already in Task 4j); the same file pins the large-lot reader and the selection policy on a synthetic package (the
    verification of the zip and its manifest, every reason of the policy in its order, the conversion of the components, the zone
    product and its consistency check, ASSUMPTION P14 by zone and by municipality with the ties, the evidence gate of the free
    lots, the logged rates and warnings, ASCII, the refusal of a sensitivity threshold under the release names) and, where the
    package exists locally, the real counts (152 records, the shortlists of 57, 72 and 40, 58 options at 50, 70 at 30 and 39
    at 100, no tariff that stops the step, the primary method of each provenance column without a fallback) and the
    committed rows (every record of the package once against an independent reading of the policy, the zone product of the
    eleven lots equal to the table rows, and the twelve of the sweep (those eleven plus the Buergerpark under P14) priced like
    the street of its zone for every stay, the pass over
    every lot inside a zone polygon, the median donors of ASSUMPTION P14, the free lots at cost 0, the grace edges of
    Helmstedt and Salzgitter, the Peine Schlosswall bands against the minimum of its products);
    tests/test_parking_garage_supplement.py pins the supplement and follow-up readers
    (pinned hashes, manifest, main points, identity, release by decision, brochure
    quotations and the directory evidence, the grace form, the rest tier, the price table, the readings, the hash list) on synthetic packages; the curation tests also refuse a
    rule that is not preferred for every value role (rate, first period, first unit, tier, band, cap, monthly
    product).
requirements:
  synthesis: not_needed
  matsim: required
  production: required
licensing:
  license: >-
    Per source; the dataset holds facts (tariffs, capacities, names and positions of garages) from public sources, none of
    them under a verified open licence: the garage feed of the City of Braunschweig (PULP; the package records no licence);
    the operator pages of the garages (tariff facts; the licence of the pages is not verified); the Stadt Wolfsburg
    Geoviewer Themenkarte Parken (Stand 12/2024; open reuse licence not verified; used by owner decision 2026-10-01); the
    Stadt Goslar ArcGIS service Bewohnerparken (last edit 2018-11-22) and its service page meingoslar.de/service (open reuse
    licence not verified; used by owner decision 2026-10-07); the Helmstedt city brochure (facts; licence not verified); and,
    for some positions, directory pages (parkinglist.de, parkito.ch; terms not verified) and OpenStreetMap features read
    through mapcarta.com (Peine Werderstrasse, Salzgitter BRAWO Carree) and the four main points of the supplement package
    (OpenStreetMap nodes, one of them a derived access point): ODbL 1.0, (c) OpenStreetMap contributors. The supplement and
    follow-up packages keep copies of operator, city and directory pages and a budget excerpt; the packages state that no
    general licence for the re-publication of those original files was found, and none is established here (the dataset
    holds facts: tariffs, capacities, names, positions). The Wolfsburg car-park package (spec E14) holds the points of the
    Stadt Wolfsburg Geoviewer theme Parken (open reuse licence not verified; used by owner decision 2026-10-07), the tariffs
    of the Autostadt GmbH and the Klinikum Wolfsburg after their own pages and the statements of free parking of the pages
    of the Wolfsburg Marketing GmbH and the Theater Wolfsburg; the package states that a separate licence for the re-use of
    the municipal and operator geodata was not confirmed, and none is established here; its OpenStreetMap extracts only
    check positions (ODbL 1.0, (c) OpenStreetMap contributors) and no position of the 13 surface lots is taken from them (since
    Task 4j the package is no source of rows of the dataset).
    The Braunschweig monthly package (spec Amendment F1) holds facts (monthly prices of operators) from the pages of
    AGR Parking, APCOA, Contipark, Park und Tank and the city; the package states that no general licence for the
    re-publication of the original files was found and none is established here; the two Contipark captures are texts of
    public pages whose terms are not verified. The large-lot research package (spec Amendment I) holds the surface lots of the
    eight towns: capacities from the cities, operators, tourism pages, OpenStreetMap tags and area estimates, positions inside
    OpenStreetMap parking areas (the research point of a lot lies inside the area that geometry_source_url names: an OpenStreetMap
    object for 53 of the 58 lots; Arena P1 has a prior municipal point instead) and tariff facts from the pages of the cities and
    operators; its OpenStreetMap-derived values
    are under the ODbL 1.0, (c) OpenStreetMap contributors; the package states that city, operator and study sources keep their
    own rights and that it claims no additional release by the cities, the operators or the TU, and none is established here.
  restricted: true
  redistribution: restricted
  notes: >-
    Redistribution per source, so the dataset as a whole is not cleared for redistribution (redistribution restricted):
    the six OpenStreetMap-derived positions of garages and the positions of the 51 surface lots that lie inside an OpenStreetMap
    parking area (the research point of the package, geometry_source_url) keep the OpenStreetMap attribution and the ODbL
    share-alike terms; the other
    sources are facts of public pages whose licences were not verified; the file was specified as a committed file by ruling R-4b-1
    of Task 4b and is, since the decision of 2026-10-08, not distributed in the repository (see storage),
    and the Wolfsburg and Goslar sources are used by the owner decisions of 2026-10-01 and 2026-10-07 recorded in
    the data record parking_zones_2026. The file carries the licence and the attribution as top-level members; the QA table
    names its sources in its header.
limitations: >-
  Bad Harzburg (the bh_* zones) and Seesen (se_am_markt) lie outside the eight towns of the garage and lot inventory
  (research package Grossparkplaetze_ZGB8), so the model has no garage or lot there; this says nothing about whether car parks
  exist there. A stay above the maximum stay of these zones therefore has no option left: it is priced at the metered street
  rate with the maximum ignored and is flagged NO_FEASIBLE_OPTION in the outcome report (expected by construction, not an
  error). The Wolfsburg area zones 730 to 734 have only one or two options.
  The zone-level garage columns of the tariff table stay empty (spec Amendment E8). The zone release stage loads the
  dataset and the tariff model lists its priced garages (schema 4), but a garage becomes an option of a stay only with a
  decay length greater than 0 (config parking_garage_decay_m, spec E6); the decay length is the calibrated lambda of
  the data record parking_garage_decay_calibration_2026 (see there for the run, the plans and the result), so the model
  prices the garage options of a stay in a paid zone as an expected cost; with a decay length of 0 (the sensitivity arm)
  it prices none and the prices are those of the zone tariffs. The distance-weighted garage options of spec
  Amendment E, the pricing of the tiers (ASSUMPTION P6, with the clock window of the first period), of the duration bands
  (ASSUMPTION P8, with P9 beyond a closed schedule) and of the grace period (ASSUMPTION P10, encoded as bands) are the
  reference implementation braunschweig.parking.cost.parking_cost_with_garages (Task 4d); the Java port is Task 4e. The
  dataset is a coverage of what the packages document, not a census of the garages of the towns. Not listed are: the
  Clausthal-Zellerfeld garage Am Rathaus (the package knows it without coordinates; no geometry is invented); the
  Seesen garage (outside the towns of spec Amendment E1); the two Wolfenbuettel lots Parkpalette Karlstrasse and
  Parkplatzanlage Neue Strasse, which the operator page offers 'momentan nur Dauerparkern' (a closed group of long-term
  renters; the owner's direction is that their free or contract parking is covered by the model's averaged free-parking
  share; reason dauerparker_only); the Kurzzeitparkplatz Lilienthalplatz (customer regime); and, of the 152 records of the
  large-lot package, the 94 that fail the size and access policy of spec Amendment I (QA rows with a lot_* reason: 46
  without evidenced general public access, 23 below the size threshold of 50 spaces, 9 unconfirmed candidates, 6 that are no
  single surface lot, 3 whose capacity the package does not state, 1 free lot (VW-Bad) without an archived evidence page, 1
  (Volkswagen Arena P2, decided free outside match days by the owner) without a position in the package, 2 closed or
  planned, 2 paid and free sites without subarea geometry and 1 alias), the two Braunschweig directory entries
  Nimesstrasse and Loewenwall (no capacity stated) and the accessible-parking point of the Theater (a subpoint of a lot,
  never a second row). The BgA lots and the ParkGO car parks of Braunschweig are rows where the package holds them and they
  pass the policy (the Markthalle and the Hauptbahnhof car parks P1 to P3 are zone AND lot by owner decision A); the car
  parks of the Wolfsburg city layer are decided again by the same policy (spec E14 is superseded for the rows), so the
  Autostadt and the Klinikum, whose access is no general public use in the package, are no rows any more (the
  Volkswagen Arena P1 is a free row by the owner's decision of spec v3 B4, P2 has no position). Every one of the 94 listed rows is
  priced (specs E13, E14, G2, I and v3 B4), but not every price is an operator statement: 11
  of the 94 rows rest on a stronger assumption than the others (ASSUMPTION P10 or P11, counted from the assumptions column
  of the dataset: the Forschungsflughafen, the Suedkopf-Center, Achtermann, Charley-Jacob-Strasse, the Groepern garage, the
  five lots with a free short stay of Helmstedt and Salzgitter and the Buechereivorplatz of Salzgitter, which takes their
  product), and two lots carry an imputed tariff (ASSUMPTION P14: the Stadtbad Buergerpark and the Buechereivorplatz; the
  package states no general tariff of either, see the acquisition notes). ASSUMPTION P12 is withdrawn (spec Amendment I5a): no
  row rests on it, and the Wolfsburg lots that are free on a per-site source are rows only on an archived evidence page (three
  rows since spec v3 B4, VW-Bad stays a QA row for want of a page). Four rows rest on ASSUMPTION P11, the best available secondary
  evidence where no operator tariff is published
  (at Groepern for the monthly product only): Goslar Achtermann (an undated directory table
  that the follow-up package does not accept as the current operator tariff; operator unconfirmed), Goslar
  Charley-Jacob-Strasse (an undated directory entry; the identity of the archived 2018 map point with the municipal
  garage and the current public access and tariff are not verified; the budget of 2026 only documents that the garage
  exists; its 1.00 EUR per hour is below the 1.50 EUR per hour of the other Goslar garages, which the consistency check of
  P11 names and keeps), the day cap 5.00 EUR of the Wolfsburg Suedkopf-Center (a secondary directory; the follow-up package
  does not take it as confirmed) and the monthly product 33.00 EUR of the Helmstedt Groepern garage (an undated directory
  entry whose 2 h price differs from the brochure, so the amount may be outdated); eight rows (the Braunschweig
  Forschungsflughafen, the Wolfsburg Suedkopf-Center, which rests on both assumptions, the three Helmstedt lots Harsleber Tor,
  Holzberg and Suedertor, the two Salzgitter lots Konrad-Adenauer-Strasse 16 and Rathausvorplatz and the Salzgitter
  Buechereivorplatz) read a free period as a grace period (ASSUMPTION P10), for the airport on the general FAQ of the parking
  provider, which is not site-specific, for the Suedkopf-Center on no source (by analogy) and for the lots on the owner's
  reading of the Broetchentaste, a free ticket of up to 30 min, as a grace band and never as a free day (spec I3; the package
  keeps no additive free time for a longer paid stay). The tariff values of the garages are the preferred rules of the
  package of 2026-10-07, the released rules of the two supplement packages and the quotations of one brochure, those of the
  surface lots the rules of the large-lot package that an owner decision names or the street product of the zone of the lot;
  they were not compared with any observed payment, occupancy or cash-desk data, so the dataset says what the operators and,
  where none
  publishes a tariff, the directories publish, not what drivers pay. Eleven assumptions and five readings carry the encoding
  and are counted per row (see the acquisition notes; ASSUMPTION L50, the size threshold, selects the rows and is no value of
  the assumptions column): P3 on none of the 94 priced rows (it stays defined), P4 on 29, P5 on 27, P6 on 7 (every tiered
  row), P7 on 5, P8 on 18 (every row with a priced duration schedule), P10 on 8 and P11 on 4, P12 on none (withdrawn, it
  stays defined for older datasets) P14 on 2 and W-match on 1 (Arena P1); 49 of the 94 priced rows rest on at least one assumption
  (52.1 %, below
  the warning share of 75 %), and 39 of the 94 on P4 or P5 (41.5 %, below it too), which is the share of the priced rows
  whose rounding or charging times the sources do not state: the dataset is mostly a structure published by the operators
  plus these assumptions, and a sensitivity arm can leave a group out by the id in the assumptions column.
  The five READINGS: a day cap or a published day total whose day boundary is not stated is read as a maximum per stay (24
  of the 32 rows with a cap or a day total, garages and lots together), a cap stated per calendar day is
  held as a maximum per stay (2 garages,
  GALERIA and Wallstrasse), a time window without stated days is read as Monday to Friday (4 garages), and the unit of
  'jede weitere' of the Groepern brochure is read as the hour (confirmed by the directory entry HE_PARKINGLIST, 'jede
  weitere Stunde'; 1 garage), and a day rate without
  charging times takes the rest of the day beside a night tier (1 garage, the Poststrasse). P7: where a garage
  publishes a night cap or a 24-hour maximum next to its day cap (Eiermarkt, Rathaus, Phaeno, Rothenfelder, Poststrasse)
  the model applies the day cap to the whole stay, so a long stay is capped higher or lower than the operator's
  combination of caps would give (Poststrasse: 9.00 EUR where the operator's maximum for day and night together is 10.00
  EUR). P8: a stay beyond the last closed band (Peine, 1440 min) has no price in the schedule and the reference
  evaluation raises; the BRAWO day total from the seventh hour and the Goslar C&A and Achtermann 24-hour prices are read
  as maxima per stay because their day boundaries are not stated; a stay that spans several days is not modelled by the
  dataset (the model prices the stays of an average weekday). P10: a stay slightly above the free period pays the whole
  first unit (a free period of 15 min followed by 1.50 EUR per hour costs 1.50 EUR at 16 min), which is the owner's reading
  and not an operator statement. At the Helmstedt and Salzgitter lots a stay of 31 min costs the first total of the schedule
  (1.20 EUR and 0.70 EUR) as if there were no free period. LARGE SURFACE LOTS (spec Amendment I): the 32 free rows cost 0 for
  every stay (no closure for events or by a barrier is modelled, and the match days of the Arena are not modelled: ASSUMPTION
  W-match); 18 of the 58 lots carry a maximum stay or a weekend window
  that the columns do not carry (the model prices the stays of an average weekday; the notes of each row name them, among
  them the maximum stays of the zone products that the bands do not carry: 60 min at Cinemaxx, 15840 and 43200 min at the
  Hauptbahnhof car parks; the 180 min of zone Ia are the bands of its lots); the twelve lots with the street product of
  their zone repeat the zone price exactly (a stay inside the zone polygon keeps it, spec I1, ruling R-4j-6), and six lots
  inside a zone polygon differ from the row of their zone and keep the package component as documented (ruling R-4j-7, named
  in the acquisition notes); the CongressPark's paid hours are 07:00-15:00 in the package against the zone window
  07:00-18:00 that the dataset carries; the two lots of the class public_with_customer_discount and the one of the class
  mixed_public_and_customers are options with their general
  tariff, the customer discount is not modelled (BadeLand was excluded as customer_regime in spec E14 (e), the class of the
  package reverses that); the two lots under ASSUMPTION P14 (3.6 % of the lots) carry the median product of their zone and
  no statement of the lot; the VW-Bad lot (no archived page) and the Arena P2 (no position in the package) are not in the
  dataset, so the free off-street mass of Wolfsburg is smaller than the owner's decision allows until a page and a position are
  supplied; the free status of the Freibad and the Suedufer rests on pages that do not establish the exact surface (see the
  acquisition notes); availability and
  occupancy are not modelled; the capacity for the threshold (a reported value on 34 of the 58 lots, otherwise an
  OpenStreetMap value or an area estimate of floor(area / 25 m2)) is no model input, and the weights of the garage options
  ignore it (a lot of 50 spaces pulls as much as a garage of 1,300 spaces at the same distance, spec I7); the positions of the
  lots are the research points of the package inside the parking area, no entrances (no ring, no tariff extent).
  Judgements in single rows: the Wolfsburg garage Poststrasse has a day tier
  and a night
  tier (the unit of the night tier is published by the city page only, the night rounding is unknown); Wolfenbuettel
  Schulwall and Rosenwall are priced from the operator pages of September 2026 with the four tiers of their weekday (the
  operator's Sunday and public-holiday line is not used, spec D1) and without a day cap (none is published); the
  Helmstedt garage Edelhoefe follows the city brochure of December 2024, which the package marks preferred, although the
  ordinance of 2018-12-18 states another structure (0.50 EUR first 30 min, 1.00 EUR up to 1 h, 2.00 EUR up to 2 h, 0.50 EUR
  per further hour, at most 8.00 EUR), which is recorded in the notes and not encoded, and its 24 h window rests on the
  brochure's 'Oeffnungszeit: 24 Stunden' in its column of fee-liable times (the ordinance names opening hours only); the
  Helmstedt Groepern garage rests on the same brochure with the unit of its further hours read as one hour (the undated
  directory entry HE_PARKINGLIST confirms the hour but states 1.20 EUR at 2 h against the encoded 1.00 EUR, a conflicting
  variant that is not used, and its monthly product 33.00 EUR is used under P11 although the entry may be older than the
  brochure); the
  Braunschweig Ring-Center is priced from rules that the package files under a facility named 'Parkhaus
  Forschungsflughafen' (identity check above); the first two hours of the Ring-Center are read as 1.50 EUR per started
  hour (the package notes that the wording does not say 'je'); the Salzgitter BRAWO customer conditions (free time with a
  retailer validation) and the Wolfsburg and other customer-only tariffs are not encoded; the Goslar garage
  Charley-Jacob-Strasse keeps a municipal point of 2018 (its current entrance is unknown) and a directory tariff that is below the other Goslar
  garages (consistency check of ASSUMPTION P11: kept, the difference named); the monthly products named
  Dauerparker Tag have no defined time scope in the application and are used as the cheapest product of their garage
  (D2); a product limited by a waiting list is used, a capacity-limited permit of a closed group (Goslar) is not; the
  GALERIA Dauerstellplatz (39.00 EUR, direct operator, contract required, terms unverified) is used as the only public
  product, and so is the Groepern monthly product (33.00 EUR, undated directory entry, terms not stated); the
  shopping-centre garages are kept as garage options although the coverage register excludes their areas
  from the zone layer (ruling R-4b-9); the capacity is the reported value and no model input (conflicting totals and a
  total without a scope are left empty or not taken, and named in the notes). Positions are of different quality: the
  city feeds and the Geoviewer give points of the garage, operator map markers and directory navigation points are
  approximations, six positions are OpenStreetMap features (a feature centre, a parking node and the four main points of the
  supplement, one of which is a derived access point) with no survey, the Goslar garages keep the points of the city's
  service of 2018, and the Goslar garage Ca has a directory point 54 m from the city's point of 2018; the position check
  only requires the point inside its municipality (the 58 surface lots are research points of the large-lot package inside
  their parking area, an OpenStreetMap object for 53 of them, no entrances; Arena P1 has the prior municipal point of the package,
  not a verified entrance). The operator column is empty where neither the
  package nor the page of the source names one (Braunschweig Forschungsflughafen, Lange Strasse Nord and Sued, Ring Center,
  Schloss-Arkaden,
  Schuetzenstrasse and Wilhelmstrasse, Helmstedt Stobenstrasse and Groepern, Wolfsburg Schillerstrasse, the Goslar garages
  and all 58 surface lots: the large-lot package names no operator that the column takes).
  Monthly products (spec Amendment F): the access window of the Steinstrasse Tarif A (Mo-Fr 06:30-21:00) is not modelled, so
  a work stay outside it still uses the product; the division by 21 working days and the minimum taken per stay (no
  subscription ownership) are the named limitations of ASSUMPTION P2; the Wallstrasse price is the gross amount of the
  further months of one public configurator capture (first month pro rata); the Fichtengrund price of 129.00 EUR has an
  unknown end date of its offer (the package cautions that 150.00 EUR was published before) and is nevertheless a value of
  ASSUMPTION P13; the imputed products are medians of only four published products per city and carry the spread of those
  products (Braunschweig 80.00 to 129.00 EUR); no capacity of monthly places is modelled (the sold-out garages Magni and
  Packhof, and the Eiermarkt, whose operator offers no monthly product at all (Contipark capture of 2026-10-08), still
  get the imputed product), so the commuter garage share is an upper estimate of what the published offers allow; the
  Braunschweig P13 median mixes a Mo-Fr 06:30-21:00 product (Steinstrasse Tarif A, 100.00 EUR) with 24/7 products
  (Wallstrasse, Eves, Fichtengrund), so the imputed product prices a regular's access window that not every garage
  offers; the sensitivity
  arm parking_garage_monthly_imputation false (published products only) bounds the effect.
