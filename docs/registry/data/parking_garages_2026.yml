  Content on 2026-10-07 (Task 4b fix round 1): 31 garages (priced 19; not priced 12: banded_tariff 7, free_period 2,
  conflicting_sources 1, incomplete_tariff 1, no_published_tariff 1); per municipality 03101000 Braunschweig 10 listed 8
  priced, 03102000 Salzgitter 1 and 0, 03103000 Wolfsburg 9 and 6, 03151009 Gifhorn 1 and 1, 03153017 Goslar 4 and 0,
  03154028 Helmstedt 2 and 2, 03157006 Peine 2 and 0, 03158037 Wolfenbuettel 2 and 2; assumptions among the 19 priced
  garages P3 1, P4 8, P5 10, P6 6, P7 5; at least one assumption 18, P4 or P5 14; tiered form 6; monthly product on 7 garages.
  QA table 70 rows: 31 garages, 20 monthly products (used 9: seven garage rows, the zone Ib 30-day ticket and the TU member
  month ticket; recorded and not used 11: not_the_cheapest 3, outdated_source 2, capacity_limited_permits 1,
  garage_not_listed 1, no_coordinates 1, no_fixed_price 1, not_monthly_or_30_day 1, restricted_customer_group 1) and 19
  candidate records for 42 package or directory entries (no_published_tariff 24, no_coordinates 5, zone_street_product 4,
  station_bahnpark 3, bga_zone 2, dauerparker_only 2, customer_regime 1, outside_source_list 1). The same numbers are
  printed by scripts/validate_parking_zones.py and pinned by tests/test_parking_regional_garages.py. SHA-256 of the files as
  written by the step (LF; two runs identical): parking_garages_2026.geojson
