dataset: parking_garages_2026
title: Parking garages of eight ZGB towns with their own tariff, one point per garage (October 2026)
inventory_id: null
provider: >-
  Own curation (issue #436, parking cost zones v2, spec Amendment E1, Task 4b) of the owner-supplied regional evidence
  package Regional_Parkdaten_Belege_2026-10-07.zip (SHA-256 e789623752bf508b3e31f37ed2e30fe019e171cb43274f495cfacc12924008e7;
  its contents and licences are described in the data record parking_zones_2026), whose garage layers and preferred
  tariff rules rest on the garage feed of Stadt Braunschweig (PULP) and the pages of the garage operators and cities
  (braunschweig.de, wolfsburg.de, stadt-helmstedt.de, meingoslar.de, contipark.de, parkundtank.de, sabaparking.com,
  aufbau-gmbh.de, city-galerie-wolfsburg.de, designeroutlets-wolfsburg.de, brawo-carree-salzgitter.de,
  marktpassage-helmstedt.de, psg-gifhorn.de, stadtbetriebe-wf.de, stadtwerke-peine.de), the Stadt Wolfsburg Geoviewer
  Themenkarte Parken, the ArcGIS service Bewohnerparken of Stadt Goslar (positions of 2018) and, for some positions,
  directory pages (parkinglist.de, parkito.ch) and OpenStreetMap features read through mapcarta.com; the check of the
  car parks that are no garage also reads the city car-park directory of Braunschweig (bs_plan_parkplaetze.geojson,
  retrieved 2026-09-29); two further owner-supplied packages of 2026-10-07 complete it (spec E12 and E13): the supplement
  Parkhaus_Ergaenzungen_2026-10-07.zip (SHA-256 76d2651433e05a4d0d0a75ba352fd17f99b329555eb3bb4525c34990383978fa: four main points of garages without coordinates, from
  OpenStreetMap, and six tariff checks of Braunschweig, Wolfsburg and Goslar) and the follow-up
  Parkhaus_Nachrecherche_2026-10-07.zip (SHA-256 3bbaff93fb8b26d6cdfb187c7e0bf746f099997c1c7fd04a961fcae7d37329d8: directory observations for Goslar Achtermann and
  Charley-Jacob-Strasse and the Wolfsburg Suedkopf-Center, and their recommendations)
vintage: >-
  Package of 2026-10-07: the tariff rules and pages were retrieved between 2026-10-02 and 2026-10-07 (source_date per
  garage); the Braunschweig car-park directory 2026-09-29; the Goslar positions are the city's snapshot of 2018-11-22.
  Tariffs as published in October 2026, applied to the model's average weekday.
geography: >-
  35 garages in eight towns: Braunschweig 12, Wolfsburg 9, Wolfenbuettel 2, Gifhorn 1, Helmstedt 4, Peine 2,
  Salzgitter 1, Goslar 4. Points, WGS84 (CRS84) on disk, EPSG:25832 in memory.
crs: EPSG:25832 (CRS84 on disk)
roles:
- supply_input
- reference_table
used_by:
- braunschweig.parking.zones_stage
acquisition:
  method: derived
  source: >-
    The package zip and the directory under eqasim-data/data/braunschweig/parking/raw_sources/ (local, gitignored): the
    garage layers bs_parkhaeuser, wob_parkhaeuser, region_parkhaeuser and gos_parking_locations of
    daten/Regional_Parkdaten.gpkg, the tables daten/facilities.json and daten/tariff_rules.json, and the directory
    bs_plan_parkplaetze.geojson (SHA-256 861bc29046fe1ee95dead0ead198908505529cd26ba133de46335efcfb62fd43); and the two
    supplement zips next to the package: Parkhaus_Ergaenzungen_2026-10-07.zip (SHA-256 76d2651433e05a4d0d0a75ba352fd17f99b329555eb3bb4525c34990383978fa; members
    data/entrances.geojson, data/parking_patch.gpkg layer entrances, data/facility_updates.json, data/tariff_rules.json,
    data/tariff_observations.json, data/field_decisions.json, data/sources.json and two evidence texts) and
    Parkhaus_Nachrecherche_2026-10-07.zip (SHA-256 3bbaff93fb8b26d6cdfb187c7e0bf746f099997c1c7fd04a961fcae7d37329d8; members data/facility_review.json, data/tariff_rules.json,
    data/field_decisions.json, data/model_actions.json, data/archived_charley_point.geojson, data/sources.json)
  script: scripts/curation/parking_zones_2026/regional_garages.py
  notes: >-
    One-off curation, never a pipeline stage: python scripts/curation/parking_zones_2026/regional_garages.py
    --regional-dir eqasim-data/data/braunschweig/parking/raw_sources/municipal_2026-10-07 --supplement-zip
    eqasim-data/data/braunschweig/parking/raw_sources/municipal_2026-10-07/Parkhaus_Ergaenzungen_2026-10-07.zip
    --followup-zip
    eqasim-data/data/braunschweig/parking/raw_sources/municipal_2026-10-07/Parkhaus_Nachrecherche_2026-10-07.zip --directory
    eqasim-data/data/braunschweig/parking/raw_sources/bs_plan_parkplaetze.geojson --municipalities <pickle of the
    stage data.spatial.municipalities; on 2026-10-07
    eqasim-data/cache_bs_bpsmoke/data.spatial.municipalities__c04db1943ae15b4681d256f4d6eee421.p> --out
    eqasim-data/data/braunschweig/parking/parking_garages_2026.geojson --qa-out
    eqasim-data/data/braunschweig/parking/parking_garages_2026_qa.csv --tariffs
    eqasim-data/data/braunschweig/parking/parking_tariffs_2026.csv. The step checks the package and the directory
    against their pinned SHA-256 before it reads them, reads the layers from the zip (EPSG:25832, valid, non-empty;
    nothing is repaired) and prints a ledger per layer (features, garages, used, twins skipped). Every garage feature
    must be specified in regional_garage_specs.py or be a twin (a feature whose facility id another layer gives: three
    Goslar features), otherwise the step stops. A garage of the package's layers that is no garage of the dataset must
    be decided explicitly as a candidate (a station car park of DB BahnPark, a lot of long-term renters), a QA row
    with its reason; a facility is never both. A garage specification names the package facility and the ROLE of each
    tariff rule (a rate, the tiers or the bands; a first period; the day cap; the charging window; other tiers; other
    caps; ignored rules), so no tariff number is typed: the columns are read from the rules, and the step refuses a
    rule that does not fit its role (a first period that does not end where the rate starts, a cap rule of another
    type, a window that crosses midnight in the single-window form or for a first period, tiers that overlap or differ
    in their billing unit, bands with a gap or an overlap, a band rule of another type, a stated rounding that is no
    started unit). The one typed exception is a charging window that a source states only in a page text which the
    package keeps as text (window=("stated", ...)); it is typed with its quotation, which the notes repeat (Helmstedt
    Edelhoefe: the city brochure of December 2024 gives the garage 'Oeffnungszeit: 24 Stunden' in its column of
    fee-liable times, which is the basis of the window; the ordinance of 2018-12-18 sec. 2(1) states only the opening
    hours of the garage, 'geoeffnet 00.00 bis 24.00', which are no charging hours and not a source of the window).
    PREFERRED FLAG (ruling R-4b-8): every rule that SETS a value (a rate, a tier, a band, a first period or first
    unit, a cap, the window of a rule, the monthly product that is used) must be marked preferred_for_current_use in
    the package, with no waiver; a specification that names another rule for such a role stops the step. A rule that
    is not preferred may only be named as other tiers, other caps or an ignored rule, and the notes then mark it '[not
    preferred for current use]' and list every non-preferred rule that is used for nothing; the phrase '(all marked
    preferred_for_current_use in the package)' of the notes is derived from the flags, never written by hand. The
    consequence for Wolfsburg Poststrasse at the end of fix round 2: its only window came from the unresolved night
    rule WOB_POST_R03_150, which is not preferred, so it set no window (ASSUMPTION P5, 0 to 24 h) and was named under
    P3; the supplement (spec E12) resolves it, see the Task 4b2 paragraph below. A garage is priced
    only where the published structure maps exactly to the garage columns, to time-of-day tiers or to duration bands
    (rulings R-4b-3, R-4b-10b and R-4b-11); otherwise it is listed and not priced with a reason code: free_period (a
    free first period whose deduction from longer stays the source does not state), conflicting_sources,
    incomplete_tariff or no_published_tariff. The reason code banded_tariff no longer exists: ruling R-4b-11 (owner
    direction 2026-10-07: the information is there, so it has to be used) supersedes the banded part of ruling R-4b-3,
    because the cause of the gap was the column set (one first period, one rate, one cap), which could not express a
    duration schedule although the package holds every band as a structured preferred rule. THREE FORMS (rulings
    R-4b-10b and R-4b-11; one tariff structure per garage, so the forms are mutually exclusive and the loader refuses
    a row that mixes them). The single-window form: garage_hourly_rate_eur and garage_billing_unit_min with the fee
    window garage_fee_start_h and garage_fee_end_h, optionally a first period and a day cap. The tiered form: the one
    validated, human-readable column tariff_tiers, for example '08:00-10:00 0.30/30; 10:00-18:00 0.60/30; 18:00-22:00
    0.30/30; 22:00-08:00 0.10/30': each tier is the EUR of one started unit of unit_min minutes that begins in the
    tier; a tier may cross midnight; a time of day outside every tier is free; one unit length per garage; no overlap;
    a first period and a day cap stay in their columns. The banded form: the validated column tariff_duration_bands, a
    schedule over the elapsed duration d of the stay in minutes, for example '0-20 free; 20-120 total 1.00; 120-240
    0.50/60; 240-420 1.50/60; 420- 5.00/60' (Wolfsburg Designer Outlets). GRAMMAR: bands separated by '; ', each
    '<from_min>-<to_min> <kind>' with whole minutes and an empty end for the open last band; kind 'free' (the stay
    costs 0), 'total <eur>' (the stay costs this amount: an absolute price, no addition) or '<eur>/<unit_min>' (this
    amount per started unit counted from the band's start, added to the price reached at the band's start); EUR with
    two decimals. A band covers from < d <= to, so a stay of exactly 'to' minutes still belongs to it and one minute
    more to the next band. Rules: the first band starts at 0; the bands are contiguous and ascending with no gap or
    overlap; only the last may be open-ended; amounts and units are positive; the price never falls as the stay gets
    longer (a total is not below the price reached at its start, a free band can only be the first band). A banded
    garage leaves the rate and the billing unit empty, has no first period and no tiers, keeps its fee window (both
    hours set; 0 and 24 h under ASSUMPTION P5 where no preferred rule states charging times) and holds a published cap
    or 24-hour price in the day cap column (the price of a stay is the smaller of the schedule price and the cap).
    braunschweig.parking.garages.duration_band_price_eur is the pure reference evaluation (exact in cents, no rounding
    beyond the published amounts; it raises for a stay beyond a closed schedule instead of guessing a price); it is
    pinned by tests on the published anchors and the band edges and is called by the garage option pricing of
    braunschweig.parking.cost (Task 4d; a stay beyond a closed schedule is priced there by ASSUMPTION P9, which is a rule
    of the pricing code and no assumption a row rests on, see the assumptions register of the tariff model; a
    non-finite duration raises). The parser's rules "the price never falls as the stay gets longer" and "a free band can
    only be the first band" are STRICTER than spec Amendment E11, which states only the three band kinds and the cumulative
    reading (ruling R-4d-15): a published schedule that breaks them is rejected by the loader although E11 would let it
    be written; no schedule of this dataset needs it. Package rule types of a band: free gives a free band, duration_total and
    published_day_total_from_duration give a total band, increment gives an increment band; a cap rule,
    daily_rate_published or a 24-hour total (a duration total from 0 to 1440 min) is the day cap. A conditional free
    period tied to a purchase is a customer condition and is named in the notes and not used (Salzgitter BRAWO: 90 min
    free for customers of Kaufland or dm and 60 min free for customers of MediaMarkt or ABC-Schuhcenter, each with a
    retailer validation). Ten of the 35 priced garages are banded (Braunschweig Ring-Center, Wolfsburg
    Schillerstrasse and Designer Outlets, Peine Werderstrasse and Wallstrasse, Salzgitter BRAWO Carree, Goslar C&A, and
    since Task 4b2 Braunschweig Forschungsflughafen, Wolfsburg Suedkopf-Center and Goslar Achtermann), seven are tiered
    (Braunschweig Eiermarkt, Wolfsburg Rathaus, Phaeno, Rothenfelder and, since Task 4b2, Poststrasse, Wolfenbuettel
    Schulwall and Rosenwall) and 18 are single-window. The published anchors that the evaluation reproduces and the tests pin: Peine
    0.20 EUR at 30 min, 0.80 at 60 min and 4.00 at 300 min (equal to the 5-to-24 h total, so there is no jump at 5 h);
    Designer Outlets 0 at 20 min and 1.00 at 120 min; BRAWO 9.00 at 360 min and 15.00 beyond; Goslar C&A 4.50 at 180
    min and the 25.00 EUR cap from 931 min; Ring-Center 3.00 at 120 min and the day rate 15.00; Schillerstrasse 2.00
    at 120 min and the maximum 15.00. IDENTITY CHECK of the Braunschweig Ring-Center (ruling R-4b-11): in
    facilities.json the facility BS_None is NAMED 'Parkhaus Forschungsflughafen' (the name of the first of its two
    features, bs_parkhaeuser:2, which share the facility id BS_None), but the attributes of that record (source_id,
    address Berliner Platz 1, description_text) and its rules -19 to -21 are those of the Parkhaus Ring-Center
    (feature bs_parkhaeuser:6): the raw records of the three rules name facility_name 'Parkhaus Ring-Center', the rule
    ids carry the source id of the Ring-Center feature, and their source excerpts ('1. und 2. angef. Std.: 1,50 EUR',
    'jede weitere angef. Std.: 2 EUR / 60 Min.', 'Tagessatz (24 Std.): 15 EUR') are the tariff lines of the
    Ring-Center feed text, whereas the feed text of the Forschungsflughafen (free for 15 min, each hour 1.50 EUR, day
    ticket 15.00 EUR) has its own rules -5 to -9 under the facility BS_SOURCE_4781292017fb49b091cc3066a17483fafbca28.
    The package's facility name is a mislabel of the shared facility id (both features list the Ring-Center rules in
    their tariff_rule_ids): the Ring-Center tariff is encoded, the Forschungsflughafen keeps its own rules (it was
    unpriced until Task 4b2, which prices it under ASSUMPTION P10). The Ring-Center's opening hours (Mo-Fr 06:00-21:30, Sa
    06:30-21:30, closed on Sundays and public holidays) are no charging hours, so its fee window is 0 to 24 h
    (ASSUMPTION P5). FIRST-PERIOD WINDOW (ruling R-4b-12, amending P6): a first period that its source ties to a clock
    window carries that window in garage_first_period_start_h and garage_first_period_end_h (decimal hours of the
    weekday; both or neither, only with a first period, 0 <= start < end <= 24, as the fee window; a window that
    crosses midnight stops the step because no source needs a wrap rule). The columns are empty where the source ties
    the first period to no window. Three garages have one: Braunschweig Eiermarkt 07:00-18:00 (rule -35), Wolfsburg
    Rathaus and Phaeno 06:00-24:00 (rule R01, read from 06:00-00:00; the days are not stated, so the reading Monday to
    Friday is named). Before the amendment the dataset applied the first period from arrival at every hour, which
    over-priced a night arrival at Rathaus and Phaeno (1.10 EUR against 0.50 EUR per hour) and under-priced one at
    Eiermarkt (0.60 EUR against 1.00 EUR). The pricing of the window is braunschweig.parking.cost (Task 4d, Python
    reference; the Java port is Task 4e); this dataset and its notes state the semantics. The assumptions are named in the column assumptions and in the notes of the row, and counted
    at every run: P3 a night tariff that is no per-unit rate of the preferred rules (a flat night fee, an unresolved
    night tier) is stated in the notes and not charged; P4 a rate without a stated rounding is billed per started unit
    (precedent D3-a of the tariff table; the note cites the caution of the package that a stated hourly rate does not
    prove rounding up per hour, and the census of the package's preferred garage rate rules that the step prints and
    the note repeats: 25 of 54 state their rounding and all 25 say started unit; for a banded garage it applies to the
    increment bands); P5 the fee window is 0 to 24 h where no preferred rule states charging times (a ticket garage
    bills the stay from entry to exit; opening hours are no charging hours); P6 the pricing of tiers: units are
    counted from the arrival and each started unit costs the rate of the tier in force at the unit's start, a first
    period (where published) is charged once when the arrival lies inside its clock window (the whole day where the
    source ties it to none) and the tiers then apply per started unit from the end of the first period, an arrival
    outside the window pays the tiers from the arrival, a time of day outside every tier is free (the pricing itself
    is implemented by braunschweig.parking.cost.garage_metered_cents, Task 4d, pinned by the golden cases O11 to O24;
    this record and the notes of every tiered garage state the semantics the tiers were encoded for); P7 the day cap column holds ONE cap and applies to the whole stay: of several
    published caps (a day cap, a night cap, a 24-hour maximum) the day cap or, where there is none, the 24-hour
    maximum is encoded and the others are named in the notes and not applied (five garages: Eiermarkt, Rathaus,
    Phaeno, Rothenfelder and Poststrasse); P8 the cumulative reading of the duration bands: a total band sets the
    price of the stay to its amount (absolute), an increment band adds its amount for every started unit counted from
    the band's start to the price reached at the band's start, a free band costs nothing, where the source states no
    rounding the unit is a started unit (as in P4), and a published cap or 24-hour price applies as the day cap (the
    smaller of the schedule price and the cap); a stay beyond a closed schedule (Peine ends at 1440 min) has no price
    (the evaluation raises). Five READINGS name no assumption id and are counted and named in the notes (the same five as in
    the limitations; the first two here, the three that Task 4b2 added in its paragraphs below): a day cap or a
    published day total whose day boundary the source does not state (cap period unspecified or absent) is read as a
    maximum per stay (18 of the 26 garages with a cap or a day total after Task 4b2; 13 of 20 at the end of fix round
    2), and a time window without stated days is read
    as Monday to Friday (4 garages: Rathaus, Phaeno, Rothenfelder and Rosenwall; the package's README says that
    missing weekdays were not automatically read as Monday to Sunday; the first-period rules of Rathaus and Phaeno
    join the named rules). The step warns above two documented thresholds: more than 75 % (ASSUMPTION_WARNING_SHARE)
    of the priced garages on one assumption, and more than 75 % (garages.UNION_WARNING_SHARE, which the loader also
    applies) on at least one assumption or on P4 or P5; the union rates are 34 of 35 (97.1 %, a warning) on at least
    one assumption and 30 of 35 (85.7 %, a warning) on P4 or P5 (25 of 26 and 21 of 26 at the end of fix round 2); P8
    alone puts all ten banded garages into the first rate. The operator column is the package's (a feature or facility attribute) or, where the page named in
    source_url is the operator's own page, that operator, with a note naming the page (Contipark: Eiermarkt and
    Wallstrasse; Park und Tank: Magni and Packhof). Monthly and 30-day products follow spec Amendment D2 and ruling
    R-D2-a: the cheapest publicly purchasable fixed-price product of a garage is monthly_eur (source in
    monthly_source_url, the product in monthly_product); a product that is limited by a waiting list is still a
    product of the public (it is used where it is the cheapest), whereas a permit that is capacity-limited for a
    closed group (the Goslar permits) is not; every product that is not used is a row of the QA table with the reason
    (not_the_cheapest, restricted_customer_group, no_fixed_price, capacity_limited_permits, no_coordinates,
    garage_not_listed, not_monthly_or_30_day, outdated_source). The monthly products of the seven newly priced garages
    were re-decided under these rules and stay as they were: Wolfsburg Designer Outlets (55.00 EUR, fixed underground
    bay, entry and exit Mo-Fr 05:00-23:00, publicly purchasable, the only product) and Peine Werderstrasse and
    Wallstrasse (48.00 EUR, Dauerstellplatz, minimum contract 2 months) are used; Ring-Center, Schillerstrasse, BRAWO
    and Goslar C&A have no monthly product in the package. The counts at the end of fix round 2 were: monthly product
    on 7 garages, used 9, recorded and not used 11 (Task 4b2: 8, 10 and 12; after its fix round 1: 9, 11 and 12, see below). The QA table parking_garages_2026_qa.csv has three record types: garage (the
    decision on every garage), monthly_product (every product that the sources publish, used or not, with its amount;
    the used products of zone rows are the 30-day ticket of zone Ib and the TU member month ticket behind
    commuter_day_eur of the tariff table) and candidate (a package or directory entry that is no garage of the
    dataset, with the reason: bga_zone, zone_street_product, station_bahnpark, customer_regime, no_coordinates,
    no_published_tariff, outside_source_list, dauerparker_only; rulings R-4b-4, R-4b-9 and R-4b-10b). STATION CAR
    PARKS (rulings R-4b-4 and R-4b-9): a station car park run by a private operator or as DB BahnPark is no garage
    option, in Braunschweig and Wolfsburg alike; the Wolfsburg Parkdeck Hauptbahnhof P1 (Contipark / DB BahnPark) is
    therefore the candidate candidate_wob_hauptbahnhof and its monthly products are recorded and not used
    (garage_not_listed). SHOPPING-CENTRE GARAGES (ruling R-4b-9): Braunschweig Schloss-Arkaden and Ring Center,
    Wolfsburg City-Galerie and Suedkopf-Center and the Wolfsburg designer outlets stay garages. The coverage register
    (parking_coverage_register_2026.csv) lists the shopping-centre car parks and the designer outlets car park as
    'excluded' rows because of their customer or visitor regimes: that keeps them out of the ZONE layer (paid street
    and area zones of parking_zones_2026), which is a different layer; as public garages with a published tariff they
    are garage options of spec Amendment E. A customer-only tariff is no part of the public tariff and is named in the
    notes as not encoded where the package states one. The positions are checked against the municipality polygons of
    the pipeline (every garage inside its own municipality, no two garages within 1 m; the municipality pickle of the
    command is the stage output named above; where the pipeline cache was absent in the worktree of Task 4b (fix
    rounds 1 and 2 and Task 4b2) a pickle built from the VG250 municipality layer with ARS as commune_id was used, 35 of
    35 inside, including the four new points); each row states how its position was found (geometry_method, geometry_source_url). The dataset and the QA
    table are written by braunschweig.parking.garages.write_garages (one feature per line, ASCII, LF, 7 decimals) and
    read back through the loaders and validators before the step ends; two runs write identical bytes. SUPPLEMENT AND
    FOLLOW-UP PACKAGES (Task 4b2, spec E12 and E13, rulings R-4b2-0 to R-4b2-8). The step reads two further owner
    packages as optional inputs (--supplement-zip and --followup-zip; it stops where a specification rests on a package
    that is not passed): the supplement holds four main points and six tariff checks as partial records that the package
    marks full_cost_calculation_ready=false, the follow-up holds directory observations and recommendations. Each zip is
    checked against its pinned SHA-256 and every member read against the zip's own manifest.sha256; nothing is extracted
    and nothing in them (they carry scripts) is executed. A rule of a package sets a value only where an owner decision
    of regional_garage_specs releases it (SUPPLEMENT_RELEASED, FOLLOWUP_RELEASED), and only while the package's own
    field decision still has the status the decision relied on; a rule that is not released is named in the notes as not
    preferred and sets nothing; the released rule records which decision released it, in the notes. IDENTITY (package
    README, Feldweise Uebernahme): a supplement facility is matched by its facility_id or a verified legacy_id; the legacy
    key BS_None is never an identity (the airport keeps its row key BS_SOURCE_4781292017fb49b091cc3066a17483fafbca28, which
    the supplement's BS_FORSCHUNGSFLUGHAFEN names as its legacy key), and the Helmstedt underground garage has the new key
    HE_GROEPERN_TG_118, never HE_GROEPERN_STRASSE (18 fee-liable street spaces). PROVENANCE COLUMN: package_sha256 holds the
    SHA-256 of the regional package and, where a package touches the row (a position, a tariff value or a finding), the
    SHA-256 of the supplement and of the follow-up, in that order, ';'-joined: 25 rows cite the regional package only, 5
    the regional and the supplement package, 5 all three. NEW GARAGES (ruling R-4b2-1; the four candidates with the reason
    no_coordinates are garage rows now, Clausthal-Zellerfeld Am Rathaus is the one left): the positions are the main
    points of the supplement (entrances.geojson, EPSG:4326, cross-checked with the GeoPackage layer entrances in
    EPSG:25832 to 1 cm), never the reference points (alternatives, never read or counted), as points without buffers;
    geometry_method names the kind: osm_mapped_parking_entrance (Braunschweig Lange Strasse Sued, Steinstrasse / Am
    Bankplatz, Helmstedt Groepern) or derived_access_point_on_osm_node (the Stobenstrasse deck: the connection of the
    driveway to the street, no confirmed barrier or portal point); the supplement states no accuracy and no field
    verification. Lange Strasse Sued: first 60 min 1.00 EUR, then 0.50 EUR per started 30 min, day tariff 10.00 EUR as
    the day cap (day boundary not stated, a maximum per stay), expressed as a first period plus rate, which a test shows
    gives exactly the prices of the bands '0-60 total 1.00; 60- 0.50/30'; Steinstrasse: 1.80 EUR per started 60 min, 18.00
    EUR cap, operator AGR Parking UG (named by its own page, quotation 'Betreiber: AGR Parking UG' in the supplement's copy);
    Stobenstrasse: 0.80 EUR per started 60 min, Mo-Sa 07-19 h, 64 spaces; Groepern: 0.70 EUR first hour, 0.30 EUR each
    further hour, 24 h, 118 spaces. The Groepern tariff is the one tariff that no package rule holds: it is read from the
    quotations of the brochure text that the supplement keeps ('0,70 EUR / 1 Std.', 'jede weitere 0,30 EUR',
    'Oeffnungszeit: 24 Stunden'), PARSED from the quotations and checked to lie in the brochure row of the garage. The
    brochure (official, Stadt Helmstedt, December 2024; its column header is only 'Kosten') states no unit for 'jede
    weitere'. GROEPERN DIRECTORY (fix round 1 of Task 4b2, ruling R-4b2-9): the supplement's evidence copy of an undated
    directory entry of the same garage (source HE_PARKINGLIST, parkinglist.de, retrieved 2026-10-07, operator Stadt
    Helmstedt as the entry states it) states '0.70 Euro / 1 Stunde', '1.20 Euro / 2 Stunden', '0.30 Euro / jede weitere
    Stunde' and '33.00 Euro / Monat'. The encoded tariff stays the brochure's, because an official and dated source
    outranks an undated directory. The unit 'hour' of 'jede weitere' rests on the directory ('jede weitere Stunde'; the
    step stops unless the directory's first and further prices equal the brochure's), no longer on the ruling alone; the
    reading stays named and counted (1 garage). The directory's 1.20 EUR at 2 h against the 1.00 EUR that the encoded
    tariff gives (0.70 + 0.30) is a CONFLICTING variant: recorded in the notes and the QA table, not used. The directory's
    monthly product 33.00 EUR is the only product of the garage and names no restricted customer group, so under the
    rules of spec D2 it is the cheapest publicly purchasable one and is USED, under ASSUMPTION P11 (the best available
    evidence of the same facility, because the brochure states no monthly product; P11 covers the monthly product only,
    the tariff itself rests on the brochure). Basis and limits: the entry is secondary and undated and differs from the
    brochure at 2 h, so the amount may be outdated, and contract terms and availability are not stated; the decision is the
    QA row monthly_he_groepern_tiefgarage (used). ASSUMPTION P10 (grace period, spec E12, owner
    decision): a published free period at the start of a stay is a grace period, a stay not longer than it costs 0 and a
    longer stay is billed from the arrival as if there were no free period (the free minutes are not deducted); encoded as
    a free first band, the total of the first unit and the rate from the end of the first unit (bands '0-15 free; 15-60
    total 1.50; 60- 1.50/60' at the Forschungsflughafen, '0-30 free; 30-60 total 1.00; 60- 1.00/60' at the Suedkopf-Center).
    Basis: the general FAQ of the parking provider that the Forschungsflughafen's site page links (mh-parkservice.com),
    which describes a grace period without a deduction and is NOT site-specific (the supplement's field decision on the
    deduction stays open); for the Suedkopf-Center there is no source and the same reading is applied by analogy. Both rows
    state in their specification the supplement's field decision on the deduction and the status the ruling relied on
    (airport: open_with_general_operator_indication; Suedkopf-Center: open), and the build stops if the package holds the
    decision in another status. The
    Forschungsflughafen is priced (ruling R-4b2-2) with 1.50 EUR per started 60 min (rounding ceil, resolved), the day
    maximum 18.00 EUR of the visible operator block (the 15.00 EUR blocks of the same page are CSS-hidden templates, both
    named in the notes; its period is not stated, a maximum per stay) and the 99.00 EUR seven-day prebooked product as a
    separate product that is no cap and no monthly product (a QA row, not_monthly_or_30_day). The Suedkopf-Center is priced
    (ruling R-4b2-3) with 1.00 EUR per started 60 min, no rounding stated (P4); the 10.50 EUR lost-ticket price is no day
    maximum; the currentness of the city tariff is unconfirmed (city and centre publish different opening hours) and
    named. Goslar GALERIA is priced (ruling R-4b2-4): 1.50 EUR first and every further started hour (two operator sources
    and a third provider page, no rounding stated, P4), the day maximum 15.00 EUR per calendar day of the WVV service
    provider (owner decision of spec E12; the direct operator locator's 8.00 EUR, numeric price 8.0 with the menu
    identifier TH15, is the CONFLICTING variant, named in the notes and the QA table); the cap is stated per calendar day and
    the dataset holds a maximum per stay, a reading that is counted (2 garages: GALERIA and the Wallstrasse cap, whose
    period 'calendar_day_00_24' is the same kind, so its notes gained one sentence and its values did not change); the
    monthly product Dauerstellplatz 39.00 EUR (direct operator, contract required, terms unverified) is used under the
    rules of spec D2 (publicly purchasable with an online contract booking, no restricted customer group named, the only
    product). Wolfsburg Poststrasse (ruling R-4b2-5) has time-of-day tiers: the day tier keeps the preferred day rate
    (2.00 EUR per started 60 min), which states no charging times and so applies at every time of day outside the night
    tier (06:30-21:00; a named reading, counted), and the night tier 21:00-06:30 costs 1.00 EUR per 60 min, with price and
    times from the operator page (which states '1 EUR' without a unit) and the unit from the city page only (currentness
    unclear), night rounding unknown (P4); ASSUMPTION P3 stands on no garage any more. The step refuses a rest tier (a day rate without
    clock times) whose rule states charging times or a time window: such a rate is a tier of its own. The caps were re-checked against the
    tiers: the single cap column holds the day tariff 9.00 EUR and applies to the whole stay (P7), so a stay that includes
    the night is capped at 9.00 EUR where the operator's maximum for day and night together is 10.00 EUR (not applied).
    ASSUMPTION P11 (best available secondary evidence, spec E13, ruling R-4b2-8, which replaces ruling R-4b2-6 and
    overrides the follow-up package's recommendation to leave Achtermann and Charley-Jacob-Strasse unpriced): where no
    current operator tariff is published, the garage is priced from the best available secondary evidence for the same
    facility, checked for consistency against the garages of the same town, with the source, its lack of a date and the
    operator's missing confirmation named. Goslar Achtermann: the directory table (parkito.ch, undated) as bands '0-180
    1.50/60; 180-570 0.80/30; 570-720 total 15.00; 720- 1.00/60' with the 24-hour price 25.00 EUR as the day cap (a
    maximum per stay), P4, P5, P8, P11; the step evaluates the bands at EVERY price point of the table (60 to 570 min, 720
    min, 1440 min capped) and at the reported further hour, and a test pins every point independently; the table explains
    the tourism page's contradiction as 0.80 EUR per 30 min and agrees with Goslar C&A (1.50 EUR per hour for 3 h, then
    0.80 EUR per 30 min, 25.00 EUR for 24 h); the operator stays empty (the candidate Tessner Verwaltungs GmbH is named
    in the notes and unconfirmed), the hotel price (15.00 EUR per night) is for hotel guests only and no public tariff.
    Goslar Charley-Jacob-Strasse: priced from the undated directory entry for the Tiefgarage Stadtverwaltung (1.00 EUR
    per started 60 min, P4, P5, P11, no day cap stated, 58 spaces as a secondary directory total); the budget of Goslar
    for 2026 (product 546-01, the barrier system of the garage, and the asset plan of the GGM) documents that the garage
    exists, not its tariff; the position is the archived municipal point of 2018 (the same coordinate as before, checked
    to 1 cm, geometry_method archived_municipal_point_2018), not a current entrance; the directory's restriction 'public
    access outside core working hours' is not modelled (availability is not modelled, spec E3). CONSISTENCY CHECK of the P11 value against the garages of the
    same town: 1.00 EUR per hour is below the 1.50 EUR per hour of Parkhaus bei C&A, GALERIA and Achtermann in Goslar; the
    directory value is kept, because the garage is a municipal office garage that is public only outside the core working
    hours, where a lower municipal tariff is plausible, and no source for this garage states another price (the result
    of the check, with the difference named in the notes). Wolfsburg
    Suedkopf-Center additionally gets the day cap 5.00 EUR of the secondary directory (parkingworld.ch, undated, not
    confirmed; a maximum per stay; P11). The Forschungsflughafen and GALERIA notes carry the follow-up findings (18.00 EUR
    confirmed with the period unspecified, the 24 hours of the page concern late payment; a third provider page states
    1.50 EUR per hour without rounding) and no value changes beyond the earlier rulings. Capacities that the supplement
    reports without a scope (650 at the Forschungsflughafen, 194 at GALERIA against the reported 193) are named and not
    taken. No garage is left unpriced; the reason codes stay in the vocabulary of the loader, the validator and the QA table
    (no garage uses one now), because the validator and the tests refuse an unknown reason and a later garage may need
    one. Result: 35 garages listed and 35 priced; assumptions among the 35 priced: P4 22, P5 23, P6 7, P7 5, P8 10, P10 2,
    P11 4 (P3 0; at Groepern P11 covers the monthly product only); tiered 7, banded 10; monthly product on 9 garages.
storage:
  expected_path: eqasim-data/data/braunschweig/parking/parking_garages_2026.geojson
  committed: true
  local_only: false
  notes: >-
    Force-added (git add -f) like the rest of the parking release, with the QA table parking_garages_2026_qa.csv next to
    it (also force-added; the .gitignore comment of the committed parking release names both). GeoJSON FeatureCollection
    with the foreign members license, attribution and documentation (the definition of every column, from
    COLUMN_GLOSSARY of the curation step); ASCII, LF in the repository.
verification:
  verifier_entry: D11
  script: scripts/validate_parking_zones.py
  notes: >-
    Listed as D11 (matsim_only, required, committed) in scripts/verify_braunschweig_inputs.py: the sixth input of the
    release of braunschweig.parking.zones_stage (config key parking_garages_path), which loads and validates it with
    the validator below; braunschweig.parking.tariff_export.garage_entries writes its priced garages into the tariff
    model (schema 3).
    braunschweig.parking.garages.validate_garages checks unique ids, valid points inside the ZGB counties, the garage
    core all-or-none (spec Amendment A6), the three tariff forms (a tiered row has valid tariff_tiers and leaves the
    single window empty; a banded row has valid tariff_duration_bands, leaves the rate, the unit, the first period and
    the tiers empty and sets its fee window; a row never mixes forms), the clock window of the first period (both
    hours or neither, only with a first period, 0 <= start < end <= 24), positive units, a day cap not below the first
    period, fee windows 0 <= start < end <= 24, complete priced rows, a reason on every unpriced row, a monthly
    product only with a source, every assumption named in the notes, ASSUMPTION P6 exactly on the tiered rows and
    ASSUMPTION P8 exactly on the banded rows, ASSUMPTION P10 only with a free first band, one to three distinct package
    SHA-256 values per row; load_garages logs the union rates and the banded count and warns above
    garages.UNION_WARNING_SHARE; braunschweig.parking.garage_qa.validate_garage_qa checks the QA table against the
    dataset and, with the tariff table, commuter_day_eur against the used product over 21 working days.
    scripts/validate_parking_zones.py runs both when the dataset exists and prints one summary line (garages listed,
    priced, not priced by reason, per municipality, the assumption rates with the union rates and the tiered and the
    banded garages, the monthly products, the candidates). tests/test_parking_garages.py pins the loader, the writer,
    the band grammar, the evaluation and both validators on synthetic rows; tests/test_parking_regional_garages.py
    pins the curation step on a synthetic package and the committed files from a hand-written table of the sources (35
    priced garages with their tier and band strings, the published anchors of the band schedules and
    their edges, the identity check of the Ring-Center, the coverage numbers, the notes rules, the QA counts) and,
    where the packages exist locally, reproduces both committed files byte for byte; tests/test_parking_garage_supplement.py
    pins the supplement and follow-up readers (pinned hashes, manifest, main points, identity, release by decision, brochure
    quotations and the directory evidence, the grace form, the rest tier, the price table, the readings, the hash list) on synthetic packages; the curation tests also refuse a
    rule that is not preferred for every value role (rate, first period, first unit, tier, band, cap, monthly
    product).
requirements:
  synthesis: not_needed
  matsim: required
  production: required
licensing:
  license: >-
    Per source; the dataset holds facts (tariffs, capacities, names and positions of garages) from public sources, none of
    them under a verified open licence: the garage feed of the City of Braunschweig (PULP; the package records no licence);
    the operator pages of the garages (tariff facts; the licence of the pages is not verified); the Stadt Wolfsburg
    Geoviewer Themenkarte Parken (Stand 12/2024; open reuse licence not verified; used by owner decision 2026-10-01); the
    Stadt Goslar ArcGIS service Bewohnerparken (last edit 2018-11-22) and its service page meingoslar.de/service (open reuse
    licence not verified; used by owner decision 2026-10-07); the Helmstedt city brochure (facts; licence not verified); and,
    for some positions, directory pages (parkinglist.de, parkito.ch; terms not verified) and OpenStreetMap features read
    through mapcarta.com (Peine Werderstrasse, Salzgitter BRAWO Carree) and the four main points of the supplement package
    (OpenStreetMap nodes, one of them a derived access point): ODbL 1.0, (c) OpenStreetMap contributors. The supplement and
    follow-up packages keep copies of operator, city and directory pages and a budget excerpt; the packages state that no
    general licence for the re-publication of those original files was found, and none is established here (the dataset
    holds facts: tariffs, capacities, names, positions).
  restricted: false
  redistribution: restricted
  notes: >-
    Redistribution per source, so the dataset as a whole is not cleared for redistribution (redistribution restricted):
    the six OpenStreetMap-derived positions keep the OpenStreetMap attribution and the ODbL share-alike terms; the other
    sources are facts of public pages whose licences were not verified; the file is committed as specified by ruling R-4b-1
    of Task 4b, and the Wolfsburg and Goslar sources are used by the owner decisions of 2026-10-01 and 2026-10-07 recorded in
    the data record parking_zones_2026. The file carries the licence and the attribution as top-level members; the QA table
    names its sources in its header.
limitations: >-
  The zone-level garage columns of the tariff table stay empty (spec Amendment E8). The zone release stage loads the
  dataset and the tariff model lists its priced garages (schema 3), but a garage becomes an option of a stay only with a
  decay length greater than 0 (config parking_garage_decay_m, spec E6); the decay length is 0 until it is calibrated on
  the server plans (Task 5 of issue #436: the local reference plans were lost on 2026-10-07), so the model prices no
  garage option and the simulated prices are those of the zone tariffs. The distance-weighted garage options of spec
  Amendment E, the pricing of the tiers (ASSUMPTION P6, with the clock window of the first period), of the duration bands
  (ASSUMPTION P8, with P9 beyond a closed schedule) and of the grace period (ASSUMPTION P10, encoded as bands) are the
  reference implementation braunschweig.parking.cost.parking_cost_with_garages (Task 4d); the Java port is Task 4e. The
  dataset is a coverage of what the packages document, not a census of the garages of the towns. Not listed are: the
  Clausthal-Zellerfeld garage Am Rathaus (the package knows it without coordinates; no geometry is invented); the
  Seesen garage (outside the towns of spec Amendment E1); the BgA lots (zones); the ParkGO zone 1 car parks of
  Braunschweig; the station car parks of Braunschweig and Wolfsburg (DB BahnPark and private operators, rulings R-4b-4
  and R-4b-9; the Wolfsburg Parkdeck Hauptbahnhof P1 and its monthly products are a candidate and QA rows); the two
  Wolfenbuettel lots Parkpalette Karlstrasse and Parkplatzanlage Neue Strasse, which the operator page offers 'momentan
  nur Dauerparkern' (a closed group of long-term renters; the owner's direction is that their free or contract parking
  is covered by the model's averaged free-parking share; reason dauerparker_only); and the Wolfsburg car parks (no
  tariff in the package). Every one of the 35 listed garages is priced (spec E13), but not every price is an operator
  statement: 5 of the 35 rows rest on a stronger assumption than the others (ASSUMPTION P10 or P11, counted from the
  assumptions column of the dataset: the Forschungsflughafen, the Suedkopf-Center, Achtermann, Charley-Jacob-Strasse and the
  Groepern garage). Four rows rest on ASSUMPTION P11, the best available secondary evidence where no operator tariff is
  published (at Groepern for the monthly product only): Goslar Achtermann (an undated directory table
  that the follow-up package does not accept as the current operator tariff; operator unconfirmed), Goslar
  Charley-Jacob-Strasse (an undated directory entry; the identity of the archived 2018 map point with the municipal
  garage and the current public access and tariff are not verified; the budget of 2026 only documents that the garage
  exists; its 1.00 EUR per hour is below the 1.50 EUR per hour of the other Goslar garages, which the consistency check of
  P11 names and keeps), the day cap 5.00 EUR of the Wolfsburg Suedkopf-Center (a secondary directory; the follow-up package
  does not take it as confirmed) and the monthly product 33.00 EUR of the Helmstedt Groepern garage (an undated directory
  entry whose 2 h price differs from the brochure, so the amount may be outdated); two rows (the Braunschweig
  Forschungsflughafen and the Wolfsburg Suedkopf-Center, which rests on both assumptions) read a free
  period as a grace period (ASSUMPTION P10), for the airport on the general FAQ of the parking provider, which is not
  site-specific, and for the Suedkopf-Center on no source (by analogy). The tariff values are the preferred rules of the
  package of 2026-10-07, the released rules of the two supplement packages and the quotations of one brochure; they were not
  compared with any observed payment, occupancy or cash-desk data, so the dataset says what the operators and, where none
  publishes a tariff, the directories publish, not what drivers pay. Eight assumptions and five readings carry the
  encoding and are counted per row (see the acquisition notes): P3 on none of the 35 priced garages any more (it stays
  defined), P4 on 22, P5 on 23, P6 on 7 (every tiered garage), P7 on 5, P8 on 10 (every banded garage), P10 on 2 and P11 on
  4; 34 of the 35 priced garages rest on at least one assumption, and 30 of the 35 on P4 or P5, which is the share of the
  priced garages whose rounding or charging times the sources do not state: the dataset is mostly a structure published by
  the operators plus these assumptions, and a sensitivity arm can leave a group out by the id in the assumptions column.
  The five READINGS: a day cap or a published day total whose day boundary is not stated is read as a maximum per stay (18
  of the 26 garages with a cap or a day total), a cap stated per calendar day is held as a maximum per stay (2 garages,
  GALERIA and Wallstrasse), a time window without stated days is read as Monday to Friday (4 garages), and the unit of
  'jede weitere' of the Groepern brochure is read as the hour (confirmed by the directory entry HE_PARKINGLIST, 'jede
  weitere Stunde'; 1 garage), and a day rate without
  charging times takes the rest of the day beside a night tier (1 garage, the Poststrasse). P7: where a garage
  publishes a night cap or a 24-hour maximum next to its day cap (Eiermarkt, Rathaus, Phaeno, Rothenfelder, Poststrasse)
  the model applies the day cap to the whole stay, so a long stay is capped higher or lower than the operator's
  combination of caps would give (Poststrasse: 9.00 EUR where the operator's maximum for day and night together is 10.00
  EUR). P8: a stay beyond the last closed band (Peine, 1440 min) has no price in the schedule and the reference
  evaluation raises; the BRAWO day total from the seventh hour and the Goslar C&A and Achtermann 24-hour prices are read
  as maxima per stay because their day boundaries are not stated; a stay that spans several days is not modelled by the
  dataset (the model prices the stays of an average weekday). P10: a stay slightly above the free period pays the whole
  first unit (a free period of 15 min followed by 1.50 EUR per hour costs 1.50 EUR at 16 min), which is the owner's reading
  and not an operator statement. Judgements in single rows: the Wolfsburg garage Poststrasse has a day tier and a night
  tier (the unit of the night tier is published by the city page only, the night rounding is unknown); Wolfenbuettel
  Schulwall and Rosenwall are priced from the operator pages of September 2026 with the four tiers of their weekday (the
  operator's Sunday and public-holiday line is not used, spec D1) and without a day cap (none is published); the
  Helmstedt garage Edelhoefe follows the city brochure of December 2024, which the package marks preferred, although the
  ordinance of 2018-12-18 states another structure (0.50 EUR first 30 min, 1.00 EUR up to 1 h, 2.00 EUR up to 2 h, 0.50 EUR
  per further hour, at most 8.00 EUR), which is recorded in the notes and not encoded, and its 24 h window rests on the
  brochure's 'Oeffnungszeit: 24 Stunden' in its column of fee-liable times (the ordinance names opening hours only); the
  Helmstedt Groepern garage rests on the same brochure with the unit of its further hours read as one hour (the undated
  directory entry HE_PARKINGLIST confirms the hour but states 1.20 EUR at 2 h against the encoded 1.00 EUR, a conflicting
  variant that is not used, and its monthly product 33.00 EUR is used under P11 although the entry may be older than the
  brochure); the
  Braunschweig Ring-Center is priced from rules that the package files under a facility named 'Parkhaus
  Forschungsflughafen' (identity check above); the first two hours of the Ring-Center are read as 1.50 EUR per started
  hour (the package notes that the wording does not say 'je'); the Salzgitter BRAWO customer conditions (free time with a
  retailer validation) and the Wolfsburg and other customer-only tariffs are not encoded; the Goslar garage
  Charley-Jacob-Strasse keeps a municipal point of 2018 (its current entrance is unknown) and a directory tariff that is below the other Goslar
  garages (consistency check of ASSUMPTION P11: kept, the difference named); the monthly products named
  Dauerparker Tag have no defined time scope in the application and are used as the cheapest product of their garage
  (D2); a product limited by a waiting list is used, a capacity-limited permit of a closed group (Goslar) is not; the
  GALERIA Dauerstellplatz (39.00 EUR, direct operator, contract required, terms unverified) is used as the only public
  product, and so is the Groepern monthly product (33.00 EUR, undated directory entry, terms not stated); the
  shopping-centre garages are kept as garage options although the coverage register excludes their areas
  from the zone layer (ruling R-4b-9); the capacity is the reported value and no model input (conflicting totals and a
  total without a scope are left empty or not taken, and named in the notes). Positions are of different quality: the
  city feeds and the Geoviewer give points of the garage, operator map markers and directory navigation points are
  approximations, six positions are OpenStreetMap features (a feature centre, a parking node and the four main points of the
  supplement, one of which is a derived access point) with no survey, the Goslar garages keep the points of the city's
  service of 2018, and the Goslar garage Ca has a directory point 54 m from the city's point of 2018; the position check
  only requires the point inside its municipality. The operator column is empty where neither the package nor the page
  of the source names one (Braunschweig Forschungsflughafen, Lange Strasse Nord and Sued, Ring Center, Schloss-Arkaden,
  Schuetzenstrasse and Wilhelmstrasse, Helmstedt Stobenstrasse and Groepern, Wolfsburg Schillerstrasse and the Goslar
  garages).
