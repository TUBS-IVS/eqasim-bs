dataset: srv2023_ticket_groups4_14plus_by_kreis
title: SrV 2023 PT-ticket shares in FOUR groups, 14+ (committed aggregate, SrV half of the
  four-group blended target)
provider: derived in-repo from SrV 2023 Braunschweig + RGB scientific-use microdata
vintage: 2023 survey year
geography: Braunschweig + Regionalverband Grossraum Braunschweig; rows at three levels
  (total / kreis / stratum). Covers 7 of the 8 ZGB Kreise - Wolfsburg (03103) is not part of this
  survey and never appears.
crs: null
roles:
- calibration_target
- reference_table
used_by: []
acquisition:
  method: committed
  source: |
    Regenerate with: python scripts/extract_srv_kreis_tables.py [--raw <dir>] [--out-dir <dir>],
    whose build_ticket_groups4_table writes this table alongside the other committed SrV
    aggregates. Reads SrV2023_Personen.csv (V_ALTER, E_OEV_FK, GEWICHT_P_ZENSUS) joined to the
    household file for the Kreis; the raw microdata is local-only and never committed.
  script: scripts/extract_srv_kreis_tables.py
storage:
  expected_path: eqasim-data/data/braunschweig/srv/srv2023_ticket_groups4_14plus_by_kreis.csv
  committed: true
  local_only: false
verification:
  verifier_entry: null
  notes: |
    Not listed in scripts/verify_braunschweig_inputs.py and not in the README data-setup tables:
    the file ships committed, so a production run needs no acquisition step, and no pipeline stage
    reads it - it is a BUILD-TIME input to scripts/build_blended_kreis_targets.py, which is why
    requirements.production is "optional". Same treatment as the sibling committed srv2023_*
    tables that no stage reads. Guarded as a committed artefact by tests/test_blended_target_tables.py
    (row grid, English columns, shares summing to 1, provenance header present); the builder itself
    is covered on synthetic SrV input, including that an unmapped E_OEV_FK code raises.
requirements:
  synthesis: not_needed
  matsim: not_needed
  production: optional
licensing:
  license: aggregate values (data-protection reviewed)
  restricted: false
  redistribution: allowed
limitations: |
  Construct: GEWICHT_P_ZENSUS-weighted shares of deutschlandticket / other_flatrate / never_pt /
  occasional_ticket per (level, code). Universe as for the three-group sibling
  srv2023_ticket_groups_14plus_by_kreis: persons aged >= 14 (V_ALTER) with a valid
  GEWICHT_P_ZENSUS weight and E_OEV_FK != -10 (Unplausibel), which makes the table
  universe-compatible with MiD P24.1 ("ab 14 Jahre").
  Two mapping decisions carry the four-group split and are recorded in ADR-0099:
  (1) never_pt is E_OEV_FK == -8 ("nicht erhoben") ONLY - no PT use in the past 12 months. That is
  an ASSUMPTION-grade, usage-derived SKIP rather than an answer to the ticket question, and it
  carries roughly a third of the respondents (weighted regional share 28.64%, unweighted respondent
  rate 33.1%), so the group boundary rests on a construct match, not on identical questions.
  (2) E_OEV_FK == 60 (Freifahrtberechtigung: children, severely disabled persons) counts as
  occasional_ticket, NOT never_pt, because free-fare-entitled persons do ride PT.
  Unmapped E_OEV_FK codes raise rather than being dropped, and a group with zero total weight
  raises.
  Coverage caveat inherited from every SrV table: a stratified PSU design over about 44 selected
  municipalities, so total and per-Kreis (level=kreis) rows extrapolate from the sampled
  municipalities to the full Kreis and are ASSUMPTION-grade coverage estimates; per-stratum rows
  are the design-safe aggregation level. Stated in the file header.
notes: |
  Four-group variant of srv2023_ticket_groups_14plus_by_kreis (issue #329), which stays
  byte-identical so that the three-group OFF path is unaffected. Exists because the 2026-08-20
  100% run measured a spatial INVERSION inside the uncontrolled not_flatrate group (03101 realised
  30.17% never-PT against a 14.00% MiD reading) - see ADR-0099. Consumed by
  scripts/build_blended_kreis_targets.py as the SrV half of
  target2026_pt_ticket_group4_by_kreis; ADR-0060's usage-conditional objection to SrV ticket data
  is NARROWED, not overruled, for this one boundary (ADR-0099).
