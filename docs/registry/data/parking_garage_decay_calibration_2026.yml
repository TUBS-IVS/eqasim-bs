dataset: parking_garage_decay_calibration_2026
title: Calibrated decay length of the garage options and its provenance (committed table)
inventory_id: null
provider: >-
  Own calibration (issue #436, parking cost zones v2, spec Amendment E5, Task 4d) with scripts/parking/calibrate_garage_decay.py
  on the plans of the reference scenario, against the SrV 2023 city-centre parking shares (srv2023_city_center_parking)
vintage: >-
  generated 2026-10-09 (the header of the table states the date) on the plans of the 1 % reference run of 2026-10-08
  (server run, parking zones on, garage options off, no MATSim run)
geography: The Braunschweig city centre (the fee zones bs_zone_ia and bs_zone_ib) for the calibration; the value applies in every ZGB town (transfer assumption G3)
crs: EPSG:25832 (distances in metres)
roles:
- derived_input
- calibration_target
used_by: []
acquisition:
  method: derived
  source: |
    Run python scripts/parking/calibrate_garage_decay.py --plans <the plans of the reference scenario, server run of Task 5>
    [--data-path eqasim-data/data] [--out eqasim-data/data/braunschweig/parking/parking_garage_decay_calibration_2026.csv]
    [--overwrite]. Inputs: the plans file (MATSim .xml or .xml.gz, selected plans), parking_zones_2026 (zones bs_zone_ia and
    bs_zone_ib), parking_tariffs_2026, parking_garages_2026, srv2023_city_center_parking (the target is READ from its rows
    garage_large_lot and street) and srv2023_commute_parking_by_workplace_class (the commuter check). The header of the table
    names every input with its SHA-256, the universe, the target derivation, the search and the code state.
  script: scripts/parking/calibrate_garage_decay.py
storage:
  expected_path: eqasim-data/data/braunschweig/parking/parking_garage_decay_calibration_2026.csv
  committed: true
  local_only: false
  notes: >-
    Committed with git add -f (the data folder is gitignored by design). SHA-256 of the committed table (LF line endings):
    a47adbaf07a7ab51e2c2c9594f09a7d970de2d316bde84fd5ebed7fa3c363b06. Long format quantity,value,unit,note under a '#'
    header; read by calibrate_garage_decay.read_calibration_table. Produced by the unmodified script on a clean tree at the
    code state named in its header (commit 26a56cca); the header names the plans by a repo-relative path. Repeated runs on
    the same inputs and the same clean code state gave byte-identical files, so the generation date in the header and the
    code-state line are the only run-dependent content.
verification:
  verifier_entry: null
  notes: |
    Not listed in scripts/verify_braunschweig_inputs.py: no stage reads the table, the config value
    parking_garage_decay_m carries its result. tests/test_parking_garage_decay_config.py requires parking_garage_decay_m
    to equal decay_length_m of the table once it exists and to be 0 while it does not; tests/test_parking_garage_calibration.py
    pins the script on a synthetic universe (a known lambda, an unreachable target, the universe of E5, the table).
requirements:
  synthesis: not_needed
  matsim: not_needed
  production: optional
licensing:
  license: >-
    own derived scalar aggregate: the table holds lambda, counts and SHA-256 hashes only, no microdata and no
    geometry. Its inputs include the two restricted local-only files parking_zones_2026 and parking_garages_2026
    (see their data records) besides the committed SrV tables and the plans of the reference scenario.
    Redistribution of this aggregate is allowed (owner decision 2026-10-08: only the three geometry files stay out
    of the repository).
  restricted: false
  redistribution: allowed
limitations: |
  Calibration, not validation: the table reports the checks below as numbers and never as agreement. The target is the SrV
  share 0.708 / (0.708 + 0.2537) = 0.736 of garages and large lots among the Braunschweig residents who park on the street
  or in a garage when they drive to the city centre; SrV asks residents about their usual place, the model averages over the
  destinations of all persons of the plans (universe caveat, spec E5). The garage probability is the choice share of the
  options (weights exp(-d / lambda), street 1, garages within 1000 m), without price, early rules or E4. Independent check on
  the same plans: the mean garage probability of the work and education activities in the two zones against the commuter
  garage share 0.464 of the class bs_zentrum. The table checks no paid share (ruling R-5-4: the zone-level paid share was
  blind to the fee window and read 1.0 in the two zones); the time-aware paid share of a run is compared with the SrV by
  scripts/parking/compare_parking_targets.py. One lambda for every town is a transfer assumption (G3). The value depends on
  the plans file it was calibrated on: another scenario gives another lambda. The destination universe is 340 activities
  (the main activities of a 1 % sample inside bs_zone_ia and bs_zone_ib, 12,567 persons), so lambda is a coarse estimate
  and its sampling uncertainty is not quantified. The script logs the mean garage probability at the two ends of its
  search (0.0055 at 10 m, 0.8911 at 5,000 m, in the table header), so the mean rises monotonically with lambda over that
  range; no local sensitivity around the result is stated. The commuter check (0.7142 over 245 activities against the
  SrV 0.4636) is the pre-registered expected miss of ADR-0140 decision 7, a number and not a validation.
notes: |
  Result: lambda = 396.19 m (decay_length_m of the table; target 0.736196 read from srv2023_city_center_parking, achieved
  mean 0.736279, 340 of 340 universe activities with a priced garage within 1,000 m, all 49 priced options of the dataset).
  parking_garage_decay_m of configs/base_bs.yml and the two popsim fixture configs equals it (a test requires the equality),
  so the garage options are ON in the canonical configuration. The calibration is no validation (ADR-0140 decision 7).
  Plans provenance: the plans file braunschweig_1pct_parking_v2_plans_population.xml.gz (SHA-256
  a052270838a198c4450c992166133d371bc592e994e8047777555fdd1cfa02bc) is the output of the server run of 2026-10-08 14:45
  to 2026-10-09 03:36 (exit 0, server log logs/run_20261008_144516.log on felix) with the overlay ~/parking_v2_plans.yml
  on the server: configs/base_bs.yml plus the test_1pct scale block, run_matsim false,
  parking_zones_enabled true, enable_urban_parking false, parking_garage_decay_m 0 (plans without a garage option, as the
  calibration needs). The plans stay in the gitignored output folder of the main checkout; the run manifest of the v2 runs
  (Task 5b-3) will reference this plans run. Task 4d built the script and tested it on a synthetic fixture
  (tests/fixtures/parking/calibration_plans_fixture.xml).
