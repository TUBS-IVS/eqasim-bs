dataset: srv2023_plan_structure_reference
title: SrV 2023 daily plan-structure reference per person segment (committed aggregate)
provider: derived in-repo from SrV 2023 Braunschweig + RGB scientific-use microdata
vintage: 2023 survey year
geography: Braunschweig + Regionalverband Grossraum Braunschweig (ZGB); segments per home Kreis
  cover the 7 SrV-surveyed Kreise (03101 Braunschweig, 03102 Salzgitter, 03151 Gifhorn, 03153
  Goslar, 03154 Helmstedt, 03157 Peine, 03158 Wolfenbuettel). Wolfsburg (03103) is not surveyed
  by SrV and has no segment here.
crs: null
roles:
- validation_reference
used_by:
- braunschweig.analysis.synthesis.plan_structure_vs_srv
acquisition:
  method: committed
  source: |
    Regenerate with: python scripts/extract_srv_plan_structure.py --raw <srv2023_raw dir>
    --out-dir eqasim-data/data/braunschweig/srv --source-commit <sha>. Reads
    SrV2023_Personen.csv (V_ALTER, V_ERW, V_GESCHLECHT, E_ANZ_WEGE, E_ANZ_WEGE2,
    GEWICHT_P_ZENSUS, STICHTAG_WTAG, GEWICHT_P_WERKTAG), SrV2023_Wege.csv (WNR, V_ZWECK,
    E_START_ZWECK, E_BEGINN, E_ANKUNFT, GEWICHT_W_ZENSUS) and SrV2023_Haushalte.csv (AGS). The
    raw microdata is local-only and never committed.
  script: scripts/extract_srv_plan_structure.py
storage:
  expected_path: eqasim-data/data/braunschweig/srv/srv2023_plan_structure_reference.csv
  committed: true
  local_only: false
verification:
  verifier_entry: null
  notes: |
    One committed file: srv2023_plan_structure_reference.csv, long format with columns
    universe, segment, metric, value, n_unweighted (9,476 rows = 23 segments x 206 metrics x 2
    universes). Not listed in scripts/verify_braunschweig_inputs.py -- there is nothing external
    for a contributor to download or verify presence of, since the file ships committed with
    every clone (mirrors the sibling committed SrV tables, e.g. srv2023_work_participation).
    requirements.production is "required" since braunschweig.analysis.synthesis.plan_structure_vs_srv
    entered the production run lists (issue #369): that stage ABORTS with a FileNotFoundError
    naming the path when the reference is missing, rather than degrading to a model-only report
    that would read like a measured result. The README derived-inputs row was added with the same
    flip. Deliberately NOT added to scripts/verify_braunschweig_inputs.py: that verifier checks
    inputs a contributor has to acquire, and NO SrV table is listed there at all, because they all
    ship committed with every clone (checked 2026-09-06: the verifier contains no SrV entry).
    Definitions and the metric set live in braunschweig/calibration/srv_plan_structure.py; unit
    tests on a synthetic SrV-shaped fixture: tests/test_srv_plan_structure.py.
requirements:
  synthesis: not_needed
  matsim: not_needed
  production: required
licensing:
  license: aggregate values (data-protection reviewed); raw SciUse file restricted
  restricted: false
  redistribution: allowed
limitations: |
  Two universes are emitted, both from the same 18,223-person delivery (measured on the
  2026-09-06 extraction; every person carries a valid non-negative GEWICHT_P_ZENSUS, so no
  person or trip is dropped for an invalid weight):

  * at_home_zero (PRIMARY, 18,223 persons): every delivered person; the per-person trip count is
    E_ANZ_WEGE2, which counts a person who was away from home over the whole reporting day
    (E_ANZ_WEGE == -7, 954 persons) as 0 trips. This is the universe that matches a synthetic
    population, in which every person exists and starts the day at home.
  * at_home_only (SENSITIVITY, 17,269 persons): persons with E_ANZ_WEGE >= 0, i.e. the 954
    away-from-home persons excluded entirely. In this delivery -7 is the only negative
    E_ANZ_WEGE code, so the two universes differ by exactly those persons; the builder carries
    both flags and logs any disagreement rather than assuming it stays that way.

  The universe difference is large for the mobility metrics and must never be mixed: the "all"
  segment has mobility_rate 0.8437 (at_home_zero) vs 0.8879 (at_home_only) and trips_per_person
  3.1865 vs 3.3534; trip-level metrics (purpose shares, departure hours, work-activity
  durations) are identical between the two because away persons contribute no trips.

  Universe guards (the extraction raises, it never adapts): every STICHTAG_WTAG in {2, 3, 4}
  (pure Tuesday-Thursday "mittlerer Werktag" delivery) and GEWICHT_P_WERKTAG == -6 everywhere;
  the reconstructed per-person trip count must equal the delivered E_ANZ_WEGE2 for every person.

  Weights: GEWICHT_P_ZENSUS for person-level metrics, GEWICHT_W_ZENSUS for trip-level metrics
  (expansion to Zensus 2022; the stratum-internal GEWICHT_P/GEWICHT_W must not be used across
  strata, ADR-0055). Weighted person total 787,251.

  Accepted deviations / data-quality counts of the 2026-09-06 extraction, all written into the
  committed file's own "# Exclusions:" header line: 27 of 58,148 trips (0.05%) have
  V_ZWECK == -10 and map to "unknown"; 20 have an unknown origin purpose (E_START_ZWECK == -7).
  Unknown-purpose trips ARE counted as trips (n_trips, trips_per_person, trip-count
  distribution) but are EXCLUDED from the denominator of purpose_share_*, so the seven purpose
  shares sum to exactly 1.0; their weight is reported separately as
  share_trips_unknown_purpose (0.0007 for the "all" segment). This is the one deliberate
  deviation from the session analysis that this builder ports (which kept unknown trips in the
  purpose-share denominator); every other metric definition is identical, verified against the
  session's published headline values (mobility_rate 0.8437 / 0.8879, trips_per_person 3.186,
  participation_work 0.3316, participation_shop 0.2794, participation_leisure 0.3832 -- all
  reproduced to 4 decimals). 250 trips have no valid departure time and 298 no valid arrival
  time; they are excluded from the departure-hour and work-activity metrics only. 2 persons have
  no valid age (they fall into the senior_65plus_not_employed group by the group rule's default
  branch, kept identical to the session analysis rather than silently "fixed") and 34 have
  V_GESCHLECHT 3 "divers" or 4 "no answer" (they are in no sex segment).

  Segments (23): all; age_<band> for 0-5, 6-9, 10-17, 18-24, 25-44, 45-64, 65-74, 75+;
  group_<g> for employed, child_0_5, school_age_6_17_not_employed, adult_18_64_not_employed,
  senior_65plus_not_employed (employment x life phase, defined so a synthetic population without
  a pupil/student flag can express it: employed wins, the non-employed are split by age;
  employed = V_ERW in {8, 9, 10, 11}, see the employed-definition paragraph below);
  sex_male, sex_female; kreis_<ars5> for the 7 surveyed Kreise. An empty segment carries NaN
  values and is never dropped, so a consumer never has to guess whether a segment is missing or
  empty; n_unweighted repeats the segment's person count on every one of its rows so thin
  segments can be filtered without a second lookup.

  Employed definition (CHANGED 2026-09-07, issue #368 decision Q5): employed =
  srv_plan_structure.EMPLOYED_V_ERW = V_ERW in {8, 9, 10, 11} - in Ausbildung/Lehre, full-time,
  part-time, marginally employed. Code 8 (an apprenticeship WITH an employment contract) was
  previously EXCLUDED, which made this reference and the regional employment controls measure
  different populations: the MiD-side employment_status classes the controls target include
  in_ausbildung, MiD EMPLOYED_TAET includes P_TAET 8 (so the MODEL side of this very comparison
  already counted apprentices as employed), and ADR-0060 treats MiD in_ausbildung (1.93%) and
  SrV V_ERW 8 (1.87%) as apples-to-apples. A 16-year-old apprentice was therefore "employed" on
  the model side and "school_age_6_17_not_employed" here.

  Blast radius of that change, verified with a row-by-row pandas comparison of the regenerated
  table against the previously committed one (2026-09-07): 1,236 of 9,476 rows moved and EVERY
  one of them is a group_* row - the all, age_*, sex_* and kreis_* segments are identical to the
  last digit, as they must be since none of them conditions on employment, and the row grid (2
  universes x 23 segments x 206 metrics) is unchanged. The group counts moved as
  at_home_zero group_employed 8,066 -> 8,306 persons, adult_18_64_not_employed 2,675 -> 2,458,
  school_age_6_17_not_employed 2,062 -> 2,039 (240 apprentices reclassified = 217 + 23);
  at_home_only group_employed 7,682 -> 7,905, adult_18_64_not_employed 2,460 -> 2,259,
  school_age_6_17_not_employed 2,020 -> 1,998 (223 = 201 + 22). Headline metric moves:
  group_employed participation_work 0.6755 -> 0.6694 (at_home_zero) and 0.7087 -> 0.7033
  (at_home_only); group_adult_18_64_not_employed participation_work 0.1329 -> 0.0939 and
  0.1438 -> 0.1014 (the reclassified apprentices carried most of that group's work
  participation); group_school_age_6_17_not_employed participation_work 0.0099 -> 0.0056 and
  0.0100 -> 0.0057. The at_home_only group_employed participation_work 0.7033 now equals the
  p_work_employed 0.7032 of the new srv2023_work_by_employment aggregate (same universe, the
  0.0001 from its 14+ bound), which is the cross-check that both SrV-side definitions are
  aligned.

  Historical comparisons built with the OLD definition stay as they are: the arm-3 aggregates
  under eqasim-data/data/braunschweig/calibration/plan_structure_fix_arm3_100pct_2026-09-07/
  and the deltas recorded in docs/runs/plan-structure-fix-arm3-100pct-2026-09-07.yml were
  computed against the V_ERW {9, 10, 11} reference. Their group_* deltas are therefore NOT
  comparable to a re-run against this table; their all / age_* / sex_* / kreis_* deltas are.

  Coverage caveat: stratified PSU design over ~44 selected municipalities; per-Kreis segments
  represent the covered municipalities only (ASSUMPTION-grade for the full Kreis). Not a control
  target: nothing in the synthesis or location pipeline reads this file.
notes: |
  SrV side of the plan-structure comparison of issue #369 (14.1% of synthetic persons receive an
  empty plan because their MiD donor reported no diary). The table pins the OBSERVED daily plan
  structure -- mobility rate, trip-count distribution, per-purpose participation and trip rates,
  purpose shares, home-based share, tours per mobile person, day-closure indicators
  (share_mobile_first_from_home / share_mobile_last_to_home / share_mobile_odd_trip_count),
  consecutive-same-purpose share, work-activity durations and departure-hour profiles -- so the
  synthetic population can be measured against it with the SAME metric code
  (braunschweig.calibration.srv_plan_structure.segment_metrics is deliberately written against
  the harmonised schema only, never against SrV column names, so the model side passes through
  it unchanged). Headline values of the primary universe, "all" segment: mobility_rate 0.8437,
  trips_per_person 3.1865, trips_per_mobile_person 3.7767, participation_work 0.3316,
  share_trips_followed_by_same_purpose 0.0453, tours_per_mobile 1.5951,
  share_mobile_last_to_home 0.9776, mean_work_activity_h 6.2904.

  Code state in the committed header: the CSV's provenance header records commit b4e76d2d, the
  state of braunschweig/calibration/srv_plan_structure.py when the table was re-extracted on
  2026-09-07 for the EMPLOYED_V_ERW realignment (issue #368 decision Q5, see the
  employed-definition paragraph under limitations). It supersedes the previous extraction at
  1a841550, whose numbers survived the crosstab refactor at 734d0cba byte-identically (that
  refactor changed the module without changing the table, which was verified by re-running the
  extraction; the header id was deliberately left at 1a841550 then, since a rewrite would only
  have churned the header and cost the byte-identity evidence). Anything re-extracted from a
  commit that carries EMPLOYED_V_ERW = (8, 9, 10, 11) must reproduce the current table.
