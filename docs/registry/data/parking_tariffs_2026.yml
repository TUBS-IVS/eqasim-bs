dataset: parking_tariffs_2026
title: Parking tariffs of the ZGB parking cost zones, one sourced row per zone (September 2026)
inventory_id: null
provider: >-
  Own transcription (issue #249) of public tariff publications: Stadt Braunschweig (ParkGO 2022 as amended
  2025-11-04, BgA Entgeltordnung 2022, parkraummanagement.php, car-park directory of the city map), TU
  Braunschweig (Parkordnung Stand 2026-06-03, GB3 pages), Stadt Wolfsburg (the Geoviewer theme Parken of the
  owner-supplied package of 2026-10-01 and its Parkgebuehrenordnung of 2016 for the billing unit), Stadt Salzgitter,
  Stadt Peine, Stadt Goslar (ParkGO 2025-06-24 and the announced 2026 fees), Stadtbetriebe Wolfenbuettel,
  Parkraum- und Schwimmbadgesellschaft Stadt Gifhorn, Stadt Helmstedt (Gebuehrenordnung 2024; its brochure 'Parken in
  Helmstedt' of 12/2024 for the fee window, spec Amendment D1); since spec Amendment D
  (2026-10-07) the owner-supplied regional evidence package with the tariff sources of Stadt Bad Harzburg (ParkGO 2021
  and tourism page), Stadt Seesen (ParkGO 2017 and information page), Stadt Braunlage (ParkGO 2018 and the tariff page
  of the car park Hexenritt) and the service page of Stadt Goslar (three car parks at 1 EUR/h)
vintage: >-
  Tariffs as published in September 2026, retrieved 2026-09-29 (source_date of every row); the three Wolfsburg rows
  (spec Amendment C2) come from the city's Geoviewer layer of Stand 12/2024, retrieved 2026-10-01. valid_from per
  row is the first date the source confirms (the retrieval date where the start is not published). The 13 rows of spec
  Amendment D (the BgA car park Willy-Brandt-Platz, the campus Volkmaroder Strasse, three Goslar, five Bad Harzburg,
  one Seesen and two Braunlage car parks) rest on sources retrieved 2026-09-29 to 2026-10-07 (source_date per row). The
  commuter products (Task 4b, spec Amendments A4 and D2) rest on the ParkGO of Braunschweig (as amended 2025-11-04)
  and the TU Parkordnung (Stand 2026-06-03), both retrieved 2026-09-29; the fee windows of Helmstedt and Goslar zone 1
  (spec Amendment D1) on the Helmstedt brochure of 12/2024 and the Goslar service page, both of the owner-supplied
  package retrieved 2026-10-07 (source_date stays the retrieval date of the row's primary source).
geography: The 37 zones of parking_zones_2026 (eleven ZGB municipalities)
crs: null
roles:
- supply_input
- reference_table
used_by:
- braunschweig.parking.zones_stage
acquisition:
  method: committed
  source: >-
    https://www.braunschweig.de/politik_verwaltung/politik/stadtrecht/2_08_Parkgebuehrenordnung_2025.pdf and the
    other source_url values of the table (one primary source per row, secondary sources in the notes column)
  script: null
  notes: >-
    Hand transcription on 2026-09-29; every page and document was retrieved on that day (none taken from the
    2026-09-21 review list unverified). SHA-256 of the retrieved documents (kept locally under
    eqasim-data/data/braunschweig/parking/raw_sources/, gitignored): ParkGO Braunschweig 59957701...,
    BgA Entgeltordnung 50444731..., TU Parkordnung 037bb432..., ParkGO Goslar c3008752..., Helmstedt
    Gebuehrenordnung 89622fb2..., city car-park directory parkplaetze.geojson 861bc290.... The file's '#'
    header states the cost semantics of design spec section 3.2 and the assumptions Z1, D1, T1, M1, C1, R1,
    H1, F1, S1 (spec section 7), R2 and R2-a (spec Amendment C3; ruling R-T1e-a) and ASSUMPTION C-b (spec
    Amendment C2; ruling R-T1d-a) and, since spec Amendment D, C-a, M2, D3-a and D3-b and, since Task 4b, P1 and P2 (C1 now
    names the commuter product).
    The three Wolfsburg rows wob_tarifzone_1, wob_tarifzone_2 and wob_tarifzone_3 (spec Amendment C2, 2026-10-01)
    replace the row wob_innenstadt. Source per ruling R-C1: Stadt Wolfsburg, Geoviewer Themenkarte Parken (Stand
    12/2024); open reuse licence not verified; used by owner decision 2026-10-01. The values come from the attributes
    of the street sections of each tariff zone (layer digitalisierung_handyparkzonen_a of the owner-supplied package
    Wolfsburg_Parkdaten.zip, SHA-256 in the data record parking_zones_2026), derived by
    scripts/curation/parking_zones_2026/municipal_zones.py tariff_zone_evidence and checked against the rows by
    assemble_parking_zones.py --municipal-tariffs: the one price of a tariff zone (attribute Preis); the weekday fee
    window of most of its sections (S1; the interval of the attribute Kostenpflichtige Parkzeit without a day read as
    Monday to Friday, the Saturday interval not modelled, D1); a maximum stay only where every section states the same
    one (no tariff zone does); the short-stay flag (Kurzzeitparken) recorded in the notes only. The billing unit rests
    on ASSUMPTION C-b: the started half hour of the city's Parkgebuehrenordnung (sec. 1(2) of the version of
    2016-03-16, Amtsblatt Nr. 12 of 2016-03-24, read online on 2026-10-01; superseded), because the current version
    of 2020-07-21 linked on the city's Ortsrecht page returned HTTP 404 on 2026-10-01 and the city's Handyparken page
    only states that phone parking costs the same as the ticket machine. No first period, day cap or free period is
    published for the street sections; the values of the v1 row came from the Aufbau-Gesellschaft garage Tiefgarage
    Rathaus and cover no street section, so none was carried over.
    Spec Amendment D (2026-10-07; controller rulings R-4a-1 to R-4a-8 and R-D3-a) adds 13 rows and removes two. Added:
    the BgA car park bs_bga_willy_brandt_platz (BgA Entgeltordnung sec. 1(1), annex 6, sec. 2: 0.90 EUR per 30 min,
    minute-exact, no maximum stay, no day ticket; the package rule bs_bga_willy_brandt_platz_1 carries the same values;
    the fee window is ASSUMPTION F1, Mo-Sa 9-20 as at the directory-listed BgA car parks, because the city's car-park
    directory has no entry for the lot; resident_permits_valid false, ASSUMPTION R2-a); the TU campus
    tu_campus_volkmaroder_strasse (the TU Parkordnung values of the other campus rows; the GB3 page states 'Ab 1.
    Oktober 2026: Campus Forschungsflughafen, Standort Volkmaroder Strasse', so valid_from is 2026-10-01); the three
    Goslar car parks at 1 EUR/h gs_parkplatz_baeringerstrasse, gs_parkplatz_klubgartenstrasse_zob and
    gs_parkplatz_glockengiesserstrasse (the service page meingoslar.de/service of 2026-10-07: 1 EUR per hour,
    Baeringerstrasse Mo-Sa 10-18, Klubgartenstrasse/ZOB Mo-Fr 10-16, Glockengiesserstrasse Mo-Fr 10-18, the Saturday
    parts not modelled, D1; the billing unit is ASSUMPTION D3-a, the started half hour of the ParkGO of Goslar of
    2025-06-24 sec. 1(2), because the page states none; the permit flag follows ASSUMPTION R2-a: the service lists the
    Baeringerstrasse lot under 'Bewohnerparken Bereich A, C' and the Glockengiesserstrasse lot under 'Bereich H', so
    resident permits are valid there, the empty default of the zone type, and the notes of both rows name R2-a;
    for the ZOB car park the service states no resident regime, so resident_permits_valid is false as for the BgA
    car parks; the ZOB lies in no resident district, so R2 cannot act there today); the five Bad Harzburg car parks bh_sole_therme, bh_kurpark,
    bh_grossparkplatz, bh_burgberg and bh_berliner_platz (ParkGO of the Stadt Bad Harzburg, Ratsbeschluss 2020-12-08, in
    force 2021-01-01, sec. 2(1): at most 0.50 EUR per started half hour; the tourism page names the car parks as paid
    and publishes no price, so the ceiling is taken as the rate at every car park, ASSUMPTION D3-b (the package marks
    this rule, bh_ordinary_ceiling, a legal ceiling with the scope 'signed fee-paying areas within the ParkGO, no
    municipality-wide flat tariff', as not preferred for current use, status prior_snapshot, and ruling R-4a-3 uses it
    as the rate; the OSM tag charge='0.50 EUR/30 min' at four of the five car parks, all but Berliner Platz,
    corroborates it, crowd-sourced and no official source; the notes of the rows say so); no current source gives the
    fee window, so ASSUMPTION F1 8-18 h; the maximum stays of 6 h and 10 h are not modelled, ASSUMPTION M2; the free
    condition 'stay > 15 min' that the OSM tag of the Sole-Therme states is not modelled either, and its note says
    so);
    se_am_markt (ParkGO of the Stadt Seesen, Ratsbeschluss 2017-03-22: 0.10 EUR per started 10 min, Mo-Fr 8-18 h, the
    Saturday part not modelled; the maximum stay is 6 h in the ordinance and 10 h on the information page, so none is
    modelled, ASSUMPTION M2); and the two Braunlage car parks br_hexenritt (the published total-stay bands of the
    official tariff page, reproduced exactly by free up to 30 min, a first period of 120 min at 2.50 EUR, 2.50 EUR (1.25
    EUR/h) per started 120 min and at most 10.00 EUR per day; regional_zones._band_evidence refuses a band table it
    cannot reproduce exactly) and br_wurmberg (ParkGO of Braunlage, 0.50 EUR per started half hour; effective
    2018-01-10), both with the fee window of ASSUMPTION F1, 9-18 h, because no charging hours are published. The values
    are those of the package's tariff_rules.json (derived by regional_zones.tariff_evidence) and are checked against the
    rows by assemble_parking_zones.py --regional-tariffs: every number of a row is its rule's value or an assumption
    named in the row, and the check fails on any other (the notes must name C-a, D3-a at the Goslar lots, D3-b at the
    Bad Harzburg car parks, M2 where a source states a maximum stay (Bad Harzburg, Seesen), R2-a at the Goslar lots
    and the flagged rows and F1 for an assumed window; the notes of the Bad Harzburg rows must say that the package
    marks the ceiling rule not preferred and quote the OSM charge tag or say that there is none; the permit flag
    must be false on exactly the two new rows that state it, bs_bga_willy_brandt_platz and
    gs_parkplatz_klubgartenstrasse_zob (RESIDENT_PERMITS_NOT_VALID) and empty on every other new row; the committed-data
    test test_committed_bga_car_parks_state_that_resident_permits_are_not_valid pins all six stated rows of the table,
    the five BgA car parks and the ZOB car park, and an empty cell on every other). Removed:
    bs_bga_kannengiesserstrasse (a pocket park since April
    2026) and tu_international_house (merged into tu_campus_ost_langer_kamp, whose row is unchanged). Workplace class
    (SrV 2023): the rows of the municipalities of Landkreis Goslar take the county key 03153; bs_bga_willy_brandt_platz
    and tu_campus_volkmaroder_strasse take bs_outer by the location of the site relative to the SrV Oberbezirke (the
    Hauptbahnhof forecourt lies in the Unterbezirk Hauptbahnhof of Oberbezirk 4, Stadtteilring; the campus at
    Volkmaroder Strasse in the Stadtteilring), a reading of the location and an ASSUMPTION, since no Unterbezirk polygon
    is available; it only sets the free-parking share of the work and education stays there (share_free_total 0.9465 for
    bs_outer, against 0.939 for bs_innenbereich and 0.7938 for bs_zentrum; a campus row uses the member product, so the
    class has no effect there). The header of the table states the assumptions C-a (now also for car parks and source
    points), M2, D3-a and D3-b next to the earlier ones.
    Task 4b (2026-10-07; spec Amendments A4, D1, D2, D4 and E8, issue #436) fills the optional column
    commuter_day_eur, inserted before resident_permits_valid, on bs_zone_ib (the 30-day ticket of 79.00 EUR, ParkGO
    sec. 1(2), over 21 working days: 3.76 EUR) and on the six campus rows (the month ticket of 10 EUR for university
    members, Parkordnung sec. 6(2): 0.48 EUR, which competes with the 3.50 EUR member day ticket, A4); ASSUMPTION P2,
    rounded to the cent. The 7-day ticket of zone Ib (29.00 EUR) is no monthly or 30-day product and stays unused. Every
    monthly or 30-day product that the sources publish, used or not and with the reason, is a record of the QA table
    parking_garages_2026_qa.csv (data record parking_garages_2026); its validator checks commuter_day_eur against the
    used product. The fee window of he_innenstadt is 9-16 h (the city brochure 'Parken in Helmstedt' of 12/2024,
    retrieved 2026-10-07: Mo-Fr 09:00-16:00 at 10 of its 11 places at 0.60 EUR per started half hour, Mo-Fr 09:00-18:00
    at the Wallplatz; the package's daten/helmstedt_gebuehrenzeiten.json, source id he_parken, calls it many charged
    city spaces with per-place exceptions) and that of gs_altstadt_zone1 10-18 h (the Goslar service page
    meingoslar.de/service, retrieved 2026-10-07: the car park Kornstrasse and the other 2 EUR/h car parks that the page
    lists state 10:00-18:00); both rows are municipal_page now and no longer carry ASSUMPTION F1 (the note of the Goslar
    row states that the street machines of zone 1 showing the same times is an inference, because the page lists car
    parks and no meters). The garage columns of the loaded layout stay absent from the table, i.e. empty on every row
    (spec Amendment E8: garages enter through the dataset parking_garages_2026), and search_time_min stays empty on
    every row (decision D4). The Ia note that said the resident permits were not modelled now points to rule R2 and the
    district layer. Q3 and Q4 (fill cap and tagging completeness of lever 1) are zone-geometry rules: no tariff value rests
    on them, they are recorded in the data record parking_zones_2026 and its QA table. P3 (a night tariff that is no per-unit
    rate is not charged; no garage rests on it since the supplement of 2026-10-07) and its siblings P4 to P8, P10 (a free
    period read as a grace period) and P11 (the best available secondary evidence where no operator tariff is published) are
    assumptions of the garage dataset, not of this table: they are named in each garage's notes and in the data record
    parking_garages_2026.
storage:
  expected_path: eqasim-data/data/braunschweig/parking/parking_tariffs_2026.csv
  committed: true
  local_only: false
  notes: Force-added (git add -f); ASCII, LF line endings, '#' header lines skipped by braunschweig.parking.zones.load_tariffs.
verification:
  verifier_entry: D6
  script: scripts/validate_parking_zones.py
  notes: >-
    Listed as D6 (matsim_only, committed) in scripts/verify_braunschweig_inputs.py; read by
    braunschweig.parking.zones_stage when parking_zones_enabled is true (configs/base_bs.yml since
    ADR-0139).
    braunschweig.parking.zones.validate_tariffs (allow_fixture_marker=False) checks types, required and
    forbidden fields per zone type, paired fields, fee windows, workplace class against the county of
    municipality_ags, ISO dates and provenance; cross_validate checks one row per polygon; the validator also
    converts every row with braunschweig.parking.tariff_export.tariff_row_to_zone (the tariff-model contract).
    tests/test_parking_zones.py runs the validator over the committed files; since spec Amendment D
    test_committed_d3_sites_are_single_site_zones_with_sourced_tariffs (rate, billing unit, fee window and window
    source of each single site, the empty maximum stay, permit flag and search time, the Hexenritt bands, ASSUMPTION F1
    in exactly the assumption rows) and test_committed_braunschweig_zones_follow_spec_amendment_d1 pin the new rows; since
    Task 4b test_committed_commuter_products_follow_spec_amendment_d2 (the seven commuter values against the monthly
    products over 21 working days, no commuter value elsewhere, the campus day tickets kept, no garage product and no
    search time) and test_committed_fee_windows_of_helmstedt_and_goslar_zone_1_follow_spec_amendment_d1 (the two
    windows, no ASSUMPTION F1 in their notes, the window source counts municipal_page 17, assumption 13 and ordinance 7,
    the 13 assumption rows by id).
requirements:
  synthesis: not_needed
  matsim: required
  production: required
licensing:
  license: >-
    public tariff publications (facts), attribution to the municipalities, their companies and TU Braunschweig; the
    Wolfsburg rows: Stadt Wolfsburg, Geoviewer Themenkarte Parken (Stand 12/2024); open reuse licence not verified;
    used by owner decision 2026-10-01; the rows of spec Amendment D: the ordinances of Bad Harzburg, Seesen, Braunlage
    and Goslar (official texts) and the service and tourism pages of the towns and the Helmstedt city brochure (facts,
    attribution; the licence of the pages and the brochure is not verified), used by owner decision 2026-10-07
  restricted: false
  redistribution: allowed
limitations: >-
  Assumption-labelled fee windows (fee_window_source assumption, F1): bs_bga_an_der_martinikirche,
  bs_bga_jodutenstrasse_klint and bs_bga_willy_brandt_platz (Mo-Sa 9-20 as at the directory-listed BgA car parks),
  the three Parkscheininseln of the Stadthalle concept (8-18 h, the concept's
  regulated daytime window; their fee hours are not published), the five Bad Harzburg car parks (8-18 h) and the two
  Braunlage car parks (9-18 h): no current source states their charging hours (spec Amendment D3). The islands take
  the ParkGO zone II amounts (0.50
  EUR per 30 min, 9.00 EUR for 9-24 h), which parkraummanagement.php quotes for them. Braunschweig's ParkGO sets no
  fee hours (machine display); Ia/Ib take Mo-Sa 9-20 from the city's own car-park directory (municipal_page).
  Single paid sites (spec Amendment D3): the Goslar rows rest on a marketing service page of the city, not on the
  ordinance (the rate and the windows; the billing unit is ASSUMPTION D3-a) and carry the Saturday and holiday parts of
  the page unmodelled (D1); the Bad Harzburg rows take the ParkGO ceiling of 0.50 EUR per started half hour for every
  car park (ASSUMPTION D3-b), because the rates of the individual car parks are not published; maximum stays that a
  source states (Bad Harzburg 6 h and 10 h, Seesen 6 h against 10 h) are not modelled, so a longer stay is priced
  metered like any other (ASSUMPTION M2: the tables hold no long-stay product for them); Seesen states Mo-Fr 8-18 h in
  the ordinance and a Saturday window that is not modelled; the Braunlage row br_wurmberg rests on the ParkGO of
  Braunlage (parkgo2018.pdf, valid_from its effective date 2018-01-10) and br_hexenritt on the tariff page of
  2026-10-07, whose prose and table differ on the free period (the table, 30 min, is read). The rows of the sites
  without a sourced short-stay tariff are not written (Clausthal-Zellerfeld, see the coverage register). The fee windows of
  he_innenstadt (9-16 h) and gs_altstadt_zone1 (10-18 h) are sourced since Task 4b (spec Amendment D1), but they are
  readings of pages that list places, not of the meters: the Helmstedt brochure states Mo-Fr 09:00-16:00 at 10 of its 11
  places and Mo-Fr 09:00-18:00 at the Wallplatz (the window is the common one, not a per-meter window; the maximum stay of
  180 min at 10 places is not modelled), and the Goslar page lists car parks (the car park Kornstrasse and the three
  other 2 EUR/h car parks state 10-18 h) and no street meters, so the zone 1 window is an inference from the car parks of
  the same rate; the Saturday parts of both are not modelled (D1).
  Long-stay products chosen by assumption M1: Ia (zone Ib day ticket 9.00 EUR), Peine (8-hour lot ticket 4.20 EUR;
  overprices stays of 3-4 h, for which the same car parks sell a 4-hour ticket of 2.60 EUR), Stadthalle
  (Parkscheininsel 24-h ticket 9.00 EUR; overprices stays of 2-9 h, which cost 2.00-9.00 EUR at 1.00 EUR per hour on
  an island); the v1 schema has one long-stay product per zone. One regime per zone (S1): Wolfenbuettel takes the
  garage day tariff, Gifhorn the city meter tariff, and each Wolfsburg tariff zone the weekday window of most of its
  street sections (tariff zone 1: the sections Am Bahnhof 1 and 2 state 00:00-24:00; tariff zone 2: the section
  Klieverhagen states 07:00-15:00); night, shoulder and Saturday tariffs are not modelled (D1). Wolfsburg (since spec
  Amendment C2): the layer of Stand 12/2024 is the city's phone-parking map, and its retrieval in 2026 does not
  confirm that every tariff is still valid (the package readme); the billing unit rests on ASSUMPTION C-b; no
  maximum stay, first period or day cap is published for the sections, so none is modelled (the expected output
  change is stated in the data record parking_zones_2026); a press report of 2024-02-05 (regionalheute.de) quotes
  zone 1 of the then valid ordinance at 1.30 EUR per started half hour, which is not reconciled with the layer's
  2.00 EUR per hour (ruling R-T1d-b: the layer stays). Campus members pay the cheaper of the
  3.50 EUR day ticket (C1, owner decision 3) and the 10 EUR month ticket per working day (0.48 EUR at 21 working days; A4,
  ASSUMPTION P2), so every work or education stay on a campus costs 0.48 EUR in the model, also that of a member who holds
  no month ticket (P2 assumes regulars); the sensitivity is the empty commuter_day_eur of the campus rows. The 30-day ticket
  of zone Ib (3.76 EUR per working day) is sold by phone parking only, is offered to the work and education purposes only
  and competes with the metered street product (P1); the model does not know who holds it (P2). The resident permits A/B/C
  of Braunschweig and the Goslar permits are not part of this table: they are the second layer
  parking_resident_districts_2026 (rule R2), which frees a stay only where the table's column resident_permits_valid
  holds (ASSUMPTION R2-a, ruling R-T1e-a): by default on street and resident zones, never on a campus, and not at the five
  BgA car parks bs_bga_* and the Goslar car park gs_parkplatz_klubgartenstrasse_zob, which state false because no
  source says that resident permits are valid there (the code register of the model JSON, ASSUMPTIONS_REGISTER, names
  the BgA car parks as its example of such rows; the flag is per row and the ZOB row has no effect today). The
  exemption of zone-132 permit holders on the Parkscheininseln and the night-time residents-only rule of the
  Stadthalle concept are not modelled. Workplace classes of the Braunschweig rows follow
  the location of each zone relative to the SrV 2023 Oberbezirke (Unterbezirk names of the SrV sub-area coding), not
  a polygon overlay. The Wolfenbuettel URL of the 2026-09-21 review list (parkhaeuser-1.html) returned HTTP 404; the
  current pages were used. The release models the tariffs in force from autumn 2026, not strictly those of the
  retrieval and snapshot date 2026-09-29: tu_forschungsflughafen carries valid_from 2026-10-01 because the TU starts
  ticketing that campus on that day (GB3 page), so on the snapshot date this zone charged nothing.
notes: >-
  37 rows: street_paid 30, resident_zone 1, campus 6; fee_window_source municipal_page 17, ordinance 7,
  assumption 13 (validator summary after Task 4b, 2026-10-07; municipal_page 15, ordinance 7 and assumption 15 before the
  two window corrections of spec Amendment D1, see parking_zones_2026; 26 rows with municipal_page 12, ordinance 6 and
  assumption 8 before spec Amendment D, and 24 rows with the single Wolfsburg row wob_innenstadt before spec Amendment
  C2); commuter_day_eur on 7 rows (bs_zone_ib and the six campus rows). The synthetic test set with the same
  columns is tests/fixtures/parking/parking_tariffs_fixture.csv (pins arithmetic, not truth). v2 lever 1
  (2026-09-30) accepted no rule-based core (parking_zones_2026_qa.csv), so no zone and hence no tariff row was
  added: the planned bs_zone_ii would take the ParkGO sec. 1(2) zone II amounts (0.50 EUR per 30 min, i.e.
  1.00 EUR/h, and the 9 h (540 min) to 24 h ticket of 9.00 EUR as day cap) and bs_zone_ia_sued the Ia row; both
  rows are written only together with their polygons (cross_validate). The optional last column
  resident_permits_valid (spec Amendment C3, ruling R-T1e-a; true or false, empty = the default of the zone type: valid
  on street_paid and resident_zone rows, not valid on a campus, where true is rejected) is empty on every row but the
  five bs_bga_* rows, which state false with the note "separately operated car park (BgA); no source states that
  resident permits are valid; ASSUMPTION R2-a", and gs_parkplatz_klubgartenstrasse_zob (no resident regime stated;
  ASSUMPTION R2-a in its note). It switches off the district rule R2 only, never resident_exempt.
  scripts/validate_parking_zones.py prints where R2 is off (12 of the 37 zones on 2026-10-07: the six stated rows and
  the six campus zones).
  Expected output change of Task 4b (its one statement; spec Amendments A4, D1 and D2): with parking_zones_enabled, the
  production default, ZONES runs price a work or education stay at the commuter product where it is cheaper: a campus stay
  at 0.48 EUR instead of the 3.50 EUR day ticket, a stay in zone Ib at most 3.76 EUR instead of the metered amount up to the
  9.00 EUR day cap; and the fee windows shrink to 9-16 h in Helmstedt (9-18 h before) and to 10-18 h in Goslar zone 1 (9-18 h
  before), so a stay in the dropped hours is free. Each of the four lowers the parking cost of a car stay, so the car becomes
  cheaper against the alternatives for those stays; the garage dataset changes nothing because no stage reads it. Exposure
  indicator (scripts/curation/parking_zones_2026/count_zone_exposure.py with the production attach_parking_zones on the plans
  eqasim-data/output_bs/braunschweig_1pct_population.xml.gz of 2026-04-29: 11,472 persons, 47,362 main activities, 17,301 car
  arrivals; the zone file is unchanged, so the same 704 car arrivals lie in a zone as before): 95 of them are work or
  education arrivals in a zone with a commuter product (Zentralcampus 20, Campus Nord 10, Beethovenstrasse 9, Langer Kamp 23,
  Forschungsflughafen 18, Volkmaroder Strasse 0, zone Ib 15), 24 lie in Helmstedt (17 of them home arrivals, free by H1) and
  78 in Goslar zone 1 (60 of them home arrivals). An exposure indicator of an older model state on a 1 % sample, not a
  validation and no run of the cost model.
