limitations: >-
  VRB zones 55 (Haemelerwald Bahnhof) and 56 (Dedenhausen Bahnhof) lie in Region Hannover
  outside the Verbandsgebiet and are not in the layer; the VRB price-stage matrix has 48
  zones = these 46 plus 55 and 56, so the two station zones must be added separately (single
  station point zones, VRB terms 2026 section 9.2). Zone 92 does not exist in the matrix or the
  layer; the VRB website locality list names it once (Buendheim), an error on the website side.
  The layer is a 2023 snapshot; VRB still publishes 48 zones in 2026 and the 2026-09-24
  cross-check below found no boundary change, but the maintenance status of the service is
  unconfirmed.
notes: >-
  Supersedes the HTML-scrape place-name assignment of vrb_tariff_zones for stop and person zone
  membership: a spatial join against these polygons replaces name matching. Cross-check
  2026-09-24 against the name-based stop seeds of the regional fare branch (7,665 GTFS stop
  points matched by locality name, EPSG:25832): 7,542 lie inside a polygon, 7,448 of them
  (98.75 %) carry the same zone, 94 differ and 123 lie outside every polygon (mostly
  Braunschweig zone-40 stops at the outer edge). 56 of the 94 differences are the five
  website localities listed in the provider notes (Buendheim 92->90, Frellstedt 33->31,
  Wolsdorf 50->31, Wobeck 13->33, Wunderbuettel 53->13); the rest are same-name localities
  matched to the wrong Gemeinde. The polygons decide zone membership; the price stage of a
  relation still comes from the VRB price-stage matrix (VRB terms 2026 section 2.2), for which
  the polygon adjacency graph is a consistency check, not a replacement.
