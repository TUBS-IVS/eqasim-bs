dataset: vrb_tariff_zone_polygons
title: Official VRB tariff zone polygons (Regionalverband Grossraum Braunschweig ArcGIS)
inventory_id: null
provider: Regionalverband Grossraum Braunschweig (RGB), ArcGIS Enterprise REST service Verkehr/Tarifzonen
vintage: >-
  Portal item dated 2023-11 (created) / 2023-12 (modified) according to the discovery
  note of 2026-09-24; the service metadata itself carries no date. Retrieved 2026-09-24.
geography: The whole Verbandsgebiet (8 ZGB Kreise), 46 polygons tiling 5,090.4 km2; VRB zones 10..90
crs: EPSG:25832
roles:
- spatial_input
- supply_input
used_by: []
acquisition:
  method: manual_download
  source: https://webgis.regionalverband-braunschweig.de/server/rest/services/Verkehr/Tarifzonen/MapServer/0
  script: null
  notes: >-
    The service is not linked from the RGB "Daten & Services" page but the REST directory is
    public and anonymously queryable. Export with
    curl -G ".../Verkehr/Tarifzonen/MapServer/0/query" --data-urlencode "where=1=1"
    --data-urlencode "outFields=*" --data-urlencode "outSR=25832" --data-urlencode "f=geojson"
    -o eqasim-data/data/vrb/vrb_tarifzonen_rgb_25832.geojson (MapServer supports GeoJSON,
    maxRecordCount 2000). Retrieval 2026-09-24: 3,354,544 bytes, SHA-256
    75765a03fa9235b40e7df2f3ee29889257c3d9e8cbbb3036cbde452b9206aa4a. The pinned eqasim Python
    (3.10) fails the TLS handshake against this host; fetch with curl or the system Python.
storage:
  expected_path: eqasim-data/data/vrb/vrb_tarifzonen_rgb_25832.geojson
  committed: false
  local_only: true
  notes: Not committed until the licence is confirmed (see limitations).
verification:
  verifier_entry: D4
  notes: >-
    Checked 2026-09-24 with GeoPandas in the pinned environment: 46 features (39 Polygon,
    7 MultiPolygon), fields OBJECTID / Tarifzone (string zone id) / Code (1..46) /
    Shape.STArea() / Shape.STLength(); 46 unique zone ids; one invalid ring (zone 38) repaired
    by make_valid; total area 5,090.4 km2 equal to the union area; one overlap sliver of
    1,798 m2 between zones 20 and 15; 97 neighbour pairs with a shared boundary (shortest
    529 m, zones 35/72) plus one point contact (87/88).
requirements:
