  script: scripts/seed_lsn_university_sites.py
storage:
  expected_path: eqasim-data/data/braunschweig/schools/lsn_university_sites.csv
  committed: false
  local_only: true
verification:
  verifier_entry: B14
requirements:
  synthesis: optional
  matsim: not_needed
  production: optional
licensing:
  license: dl-de/by-2-0
  restricted: false
  redistribution: allowed
limitations: |
  Sachsen-Anhalt institutions are not in LSN and stay curated in scripts/seed_nds_hochschulen.py.
notes: |
  New file next to nds_hochschulen.csv; the OFF path keeps reading nds_hochschulen.csv.
  used_by lists synpp stages and stays empty: the script scripts/build_student_balance.py (Phase 2 of #140) reads
  this table, no stage does yet.
  The values live in the SITE_ROWS constant of the seed script (semester in its SEMESTER
  constant, pinned by tests/test_seed_student_reference_tables.py); the CSV header repeats
  semester and access date.
