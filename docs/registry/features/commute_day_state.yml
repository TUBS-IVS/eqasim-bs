evidence:
  tests:
  - tests/test_commute_day_donor_pool.py
  - tests/test_commute_day_matching.py
  - tests/test_commute_day_plan_replacement.py
  - tests/test_commute_day_state.py
  - tests/test_commute_day_state_reference.py
  - tests/test_commute_day_state_reference_pins.py
  - tests/test_commute_day_stages.py
  - tests/test_commute_day_consumers.py
  off_path_byte_identical:
    claimed: 'true'
    test: tests/test_commute_day_stages.py::test_trips_day_stage_off_returns_the_identical_object
    note: 'commute_day_state_enabled defaults true in configs/base_bs.yml; every OFF-path claim is
      proven by a dedicated test, not merely asserted: the donor-pool stage returns two empty
      frames without reading any raw MiD file
      (test_donor_stage_off_returns_empty_frames_with_the_on_path_columns), the state stage marks
      every worker at_workplace/reason=disabled (test_state_stage_off_marks_every_worker_at_workplace),
      the reporting-day trips stage returns the pre-assignment frame BY IDENTITY, not merely by
      equal values (test_trips_day_stage_off_returns_the_identical_object), the output writer keeps
      the legacy persons.csv column set
      (test_output_day_off_hands_the_enriched_frame_through_untouched), and the MATSim writer never
      reads the pre-assignment frames on the day-view path
      (test_matsim_population_load_raw_never_reads_the_pre_assignment_frames). popsim_open and
      simple_ipf_open additionally set the flag false in their own committed fixtures and never
      reach any commute_day stage in their synpp DAG at all (checked directly against the committed
      DAG snapshots, not merely against the flag).'
  fallback_rate:
    instrumented: true
    log_marker: '[commute day state]'
    note: 'log_marker names the central marker (state.py and state_stage.py, verified present in
      source); the fallback/guard rates below are actually spread across every module''s own tag,
      each independently grep-able (verified exhaustively with
      `grep -oh "\[commute day[^]]*\]" braunschweig/synthesis/commute_day/*.py
      braunschweig/analysis/synthesis/work_participation_by_kreis.py
      braunschweig/analysis/cordon_validation.py braunschweig/matsim/scenario/population.py |
      sort -u`, ten tags, listed here in full -- no others exist): [commute day donors] and
      [commute day donors stage] (donor_pool.py / home_office_donors_stage.py --
      distance-source fallback, immobile/chain-dropped counts), [commute day state] (state.py /
      state_stage.py -- the draw itself, donor-distance PRIMARY-source coverage, the
      not-replaceable downgrade and its RAISE), [commute day matching] (matching.py -- the
      coarsening cascade), [commute day plan replacement] (plan_replacement.py --
      n_home_unmatched, n_donors_without_trips and its >1% warning: the pure builder that
      actually performs the splice and owns these two guards), [commute day trips]
      (trips_day_stage.py -- the synpp-stage wrapper around plan_replacement.build_day_trips;
      logs the finished diagnostics dict but does not itself compute any of the rates above),
      [commute day activities] (activities_day_stage.py), [commute day locations]
      (spatial_locations_day.py), [commute day output] (output_day.py -- the join-coverage
      RAISE), [commute day population] (braunschweig/matsim/scenario/population.py) and
      [braunschweig.analysis.cordon_validation] (cordon_validation.py). The SEPARATE analysis-only
      tag [commute_day_state] (underscored, braunschweig/analysis/synthesis/
      work_participation_by_kreis.py) belongs to the Phase A measurement feature
      (commute_day_state_measurement), not to this one, and is listed there.

      Every substitution/exclusion path is counted, logged as an explicit rate and, where a
      collapsed rate would make the drawn shares meaningless, guarded: the donor pool''s commute-
      distance source falls back P_ARB_ENTF -> first valid work-trip length -> the literal
      "unknown" (warned above 50% unknown); the state stage''s own donor-distance PRIMARY-source
      coverage (donor_source_by_assigned_class) is warned below 50% overall
      (ADR-0104 Amendment 1: a donor who worked at home or did not work that day has no work-trip
      length, which is exactly the residual this rate must not hide); the donor-matching coarsening
      cascade counts every level (0-6) it had to fall back to, per person; a home worker the donor
      pool cannot serve at any level is downgraded to at_workplace and counted, and the stage
      RAISES above commute_day_max_not_replaceable_share (default 0.5) rather than reporting a home
      share the model did not actually produce; the reporting-day trips stage warns above 1% of
      matched donors having zero rows in donor_trips (a donor_id key/dtype mismatch symptom, not a
      genuinely immobile donor at that rate); the output writer raises if not one person in the
      enriched population matches the state frame at all (a broken join, not "no worker works
      today").'
  reference:
    kind: committed
    path: eqasim-data/data/braunschweig/mid/mid2023_workday_location_by_commute_distance.csv
    note: The MiD 2023 reporting-day work-location shares by commute-distance class (data record
      mid2023_workday_location), read by column name for the keep-probability ratio -- never typed
      from a report PDF. The regional SrV 2023 work-participation reference
      (srv2023_work_participation_by_kreis.csv, data record srv2023_work_participation) is the
      target of pre-registered check 1 (validation.note below), not an input the model reads at
      run time.
validation:
  state: measured_vs_reference
  runs:
  - commute-day-state-phase-b-proof-100pct-2026-09-06-rerun
  - commute-day-state-phase-b-proof-100pct-2026-09-05
  metric: 'ADR-0104 checks 1-6, measured at 100 % on the cached i329 population. The CURRENT
    verdicts are those of the RE-RUN after fix wave A, run manifest
    commute-day-state-phase-b-proof-100pct-2026-09-06-rerun, which carries every number; the
    2026-09-05 manifest is the superseded first attempt and its verdicts must not be quoted as
    this feature''s state. All three runs completed, so every check was evaluated on a committed
    artefact for the first time. Verdicts: (1) FAIL at the pre-registered +/- 3 pp band on the
    ZGB aggregate. Over the 540,425 employed persons with a ZGB home Kreis the model realises
    at_workplace 0.4810 (SrV 0.6511, -17.01 pp), home 0.0082 (SrV 0.1418, -13.35 pp), absent
    0.0051 (SrV 0.2071, -20.20 pp) and no_workplace 0.5056; 37,705 workers with an assigned
    workplace are not flagged employed and are reported as n_workers_not_employed rather than
    aborting the stage (ruling R6). The dominant arithmetic driver is that 50.6 % of the employed
    universe has no assigned workplace at all -- a participation deficit, not a day-state effect;
    no decomposition was measured. (2) FAIL on the 100_plus bound, pass on the no-deterioration
    half. Reporting-day universe (296,599 at_workplace workers, ruling R5): ZGB inter
    model_share_100_plus 0.0737 against the pre-registered 3 %, EMD 0.0694 (noise floor 0.0129,
    classification ok); the assigned-workplace table commute_by_kreis_all_assigned.csv is
    byte-identical to the 2026-09-04 baseline, so nothing up to 50 km deteriorated. (3) pass --
    the at_workplace share of external workers is 0.846564 (33,143 of 39,150) and scales the
    outbound cordon expectation from 60,705 to 51,393 SvB, all joins complete. (4) pass for three
    of its four items -- donor-distance PRIMARY source 100.0 % in every assigned class,
    not-replaceable 0 of 5,086 (0.00 %), coarsening levels 0/2/3/4/5 = 3,786/352/391/23/534;
    pool size per CELL is still not recorded and stays unknown. Ruling R9 settled the first
    run''s open 27.3 %: 1,435 of 5,086 matched donors (28.2 %) are genuinely immobile and
    n_donors_without_trips is 0, i.e. none of it was a donor_id key mismatch. (5) pass --
    absent_share_far 1.0 gives home 5,086 / absent 3,215, 0.6 gives home 6,345 / absent 1,956,
    with at_workplace identical and the change confined to the gt200 class; both variants now
    also produced the SrV-referenced share table. (6) pass -- the ON population was written in
    full and differs from the OFF one for EXACTLY the 8,301 persons drawn to home or absent
    (households, vehicles and vehicle_types byte-identical, persons.csv byte-identical bar the
    appended commute_day_state column, 862,163 trip blocks and 1,122,903 activity blocks
    byte-identical). The OFF population itself was not re-written by the re-run; its byte
    identity to the i329 output stands from the 2026-09-05 manifest, and the OFF analysis path
    re-ran byte-identically under the fix-wave-A code.'
  note: 'ADR-0104 fixes SIX pre-registered checks BEFORE the model exists, which Phase B is held
    to and which are NOT to be retro-fitted to the outcome (the design spec of 2026-09-04 is only
    where they were first drafted; this ADR is the durable record): (1) realised
    at_workplace/home/absent shares and the share of employed persons without a work trip,
    regionally against SrV 0.1418 / 0.6511 / 0.2071, tolerance +/- 3 pp on the REGIONAL aggregate
    only (per-Kreis values reported, never gated) -- ASSUMPTION: the band is a pre-registered
    tolerance chosen a priori, not derived from any committed source, because the SrV per-Kreis
    cells rest on 663-2,268 persons under a stratified PSU design and are assumption-grade for a
    full Kreis. (2) Inter-Gemeinde work bands re-measured with the Phase 0 stages: the 100_plus
    band below 3%, no deterioration up to 50 km against the 2026-09-04 baseline EMD --
    ASSUMPTION: the 3% bound is a chosen operating bound with NO reference behind it (every
    100_plus column of the committed SrV table is exactly 0.0, a structural survey blind spot per
    ADR-0102 Assumption 2, so a 0% bound would assert that blind spot as truth). (3) Cordon
    out-commuter gate volumes before/after, against an expectation restricted to at_workplace
    persons (braunschweig.analysis.cordon_validation''s gate_volumes_scaled.csv /
    commute_day_state_scaling.json). (4) Donor-matching diagnostics: coarsening rate per step,
    not-replaceable share, missing-donor-distance share, pool size per cell. (5) Sensitivity of
    commute_day_absent_share_far, 1.0 vs 0.6. (6) OFF-path byte identity, a 25% proof run first
    and a 100% proof in the next scheduled production run. The six were measured against a live
    population for the first time on 2026-09-05, at 100% on the cached i329 population instead of
    at 25% (controller ruling R4: the server 25% cache is from June 2026 and would have rebuilt
    PopulationSim; the substitution is disclosed in the manifest''s pipeline.notes), and RE-RUN
    on 2026-09-05/06 after fix wave A. The per-check outcome is in validation.metric above and
    every number in the re-run manifest. This record is measured_vs_reference and NOT
    behaviourally_validated: checks 1 and 2 now have verdicts and BOTH are failures against their
    pre-registered (and explicitly unsourced) bounds, so no claim is made that the realised
    three-way state split matches observed behaviour. Convergence of a MATSim run is not
    validation and is not claimed here.
    The first attempt found five things to fix; all five are in this branch and ALL have now been
    re-measured by the re-run: (a) an 8-digit AGS assumption in the Phase A analysis stage that
    rejected all 265,750 in-region destinations and (b) a NaN/str sex column that killed the
    donor-pool resample, both fixed during the first run itself; then, in fix wave A, (c) ruling
    R5 -- check 2 measured ASSIGNED workplaces, which this model never changes, so the work
    comparison now runs over the reporting-day commuters (296,599 workers) and keeps the
    assigned-workplace view as commute_by_kreis_all_assigned.csv, which the re-run confirmed is
    byte-identical to the 2026-09-04 baseline; (d) ruling R6 -- check 1''s guard conflated a
    person_id join failure with the universe difference between the model''s workers and the
    enriched population''s employed flag, and the re-run produced check 1''s table with the
    37,705 not-employed workers reported in their own column instead of aborting; (e) ruling R7
    -- 36 of the 5,086 persons drawn to "home" (0.71%) received a donor chain with an EDUCATION
    activity they have no location for, which made the secondary chainsolver raise; such a donor
    is now ineligible for a person without an education location, and the re-run''s secondary
    chainsolver completed (49 of 8,026 donors carry an education leg; 4,911 persons lost at least
    one donor to the criterion; not-replaceable stayed at 0.00%). Two further fixes are
    diagnostic only and were both confirmed in production: the plan replacement emitted ZERO
    pandas PerformanceWarnings (657,888 of them had made the first ON run''s log 254 MB, the
    re-run''s is 99,519 B), and separating an immobile donor from a missing one showed that all
    1,435 zero-row donors (28.2%) are genuinely immobile and none is a donor_id key mismatch.'
assessment:
  status: reviewed
  by: Lasse Bienzeisler with Claude (Fable 5.1)
  date: '2026-09-06'
  source: ADR-0104
  note: 'DECISION RECORDED, ADR-0104 section "Proof 2026-09-06 (Phase B, 100 % on the cached i329
    population)", which carries the reasoning and the rejected alternatives; this is the summary,
    not a second home for it. The FLAG STAYS DEFAULT ON at the current parameters
    (commute_day_state_enabled true, commute_day_far_threshold_km 200.0,
    commute_day_absent_share_far 1.0): checks 3, 4, 5 and 6 pass, the OFF path is unchanged in
    substance, the only population change is the 8,301 re-drawn far commuters (every other
    person''s plan byte-for-byte identical), and the flag''s own effect on the quantity it was
    built to move is separable -- the reporting-day zgb/inter 100_plus band is 0.100083 OFF
    against 0.073740 ON (-2.63 pp), with the workplace assignments identical in both.
    Checks 1 and 2 FAIL and NEITHER BOUND WAS RELAXED; both bounds are ASSUMPTIONS with no
    committed source behind them (ADR-0104). Check 1 (-17.01 / -13.35 / -20.20 pp on the three
    state shares) fails by construction of the comparison rather than by miscalibration -- the
    model''s home state covers only the far commuters it re-draws (0.8% of the employed universe)
    while SrV''s 14.2% covers all employed persons, and the model''s implicit home-office and
    not-working behaviour sits inside share_no_workplace 0.5056; the pre-existing participation
    gap dominates and stays an open question of ADR-0104 (issue #244), not a target of this model.
    Check 2 misses its 100_plus < 3% operating bound at 7.37%: of the 16,194 workers assigned at
    or above 100 km, 11,327 stay at_workplace at a keep probability of 0.531-0.675 read from the
    committed MiD table, and reaching the bound would need either an absent rule for the 100_200
    class or lower keep ratios -- a PARAMETER decision reserved for the maintainer, taken by
    nobody here.
    FIVE FOLLOW-UPS are named in the ADR and none is done: the 100% proof inside a scheduled
    production run (still owed, ruling R4 substituted a proof on the cached i329 population), a
    re-specification of check 1 (which needs a home-office attribution the population does not
    carry), pool size per matching cell (the fourth check-4 diagnostic, still not recorded), a
    committed JSON for the reporting-day trips diagnostics (the R8/R9 counters are log-only), and
    the 37,705 workers with an assigned workplace whom the population does not flag employed.
    The status is "reviewed" and not "assessed" precisely because those five are open; validation
    stays measured_vs_reference and NOT behaviourally_validated.'
notes: 'Depends on the raw MiD 2023 B1 delivery at run time (mid2023_b1, restricted, server-only)
  via the home-office donor pool (data record mid2023_home_office_day_donors) and on the committed
  MiD reference table (data record mid2023_workday_location) for the keep-probability ratio.
  popsim_open and simple_ipf_open are not_used, not merely inactive-by-default: their committed
  fixtures (configs/fixtures/config_popsim_open_braunschweig.yml,
  configs/fixtures/config_local_braunschweig_25pct.yml) set commute_day_state_enabled: false AND
  neither fixture''s synpp DAG snapshot contains a single commute_day stage node -- checked
  directly against docs/registry/dag/{popsim_open,simple_ipf_open}.json, not inferred from the
  flag alone. Phase A (measurement only, no model behaviour) is the separate feature record
  commute_day_state_measurement, which this feature consumes the evidence of (ADR-0104''s
  "Amendments to the design" section records the three corrections Phase A forced on the design
  before this feature was built). Cache cost, deliberate (ADR-0104 Consequences): the .final alias
  switch devalidates secondary locations and everything downstream ONCE, even with the flag OFF,
  on the order of hours at 100% scale.'
