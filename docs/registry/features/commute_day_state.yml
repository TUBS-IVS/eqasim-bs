feature: commute_day_state
title: Commute-day-state model (far/weekly out-commuters)
area: behavior
description: 'Splits the model''s WORK plan (the BA Pendleratlas register OD, which carries every
  employed person''s workplace but no commuting FREQUENCY at all) from the DAY the simulation
  actually runs, because the references the model is judged against -- SrV 2023 and MiD 2023 --
  are reporting-day surveys, and nothing in the pipeline previously converted the register
  universe into the reporting-day one (ADR-0104, issue #244). Every employed person with an
  assigned workplace receives a commute_day_state person attribute in exactly three values:
  at_workplace (the register day, unchanged), home (a matched MiD home-office-day donor''s
  COMPLETE trip chain is spliced in -- purposes, modes, times, order -- never chain surgery on
  the person''s own day, so the substitution is a real, observed day rather than a hybrid nobody
  lives), or absent (no trips at all that day -- a weekly/far commuter who is simply not in the
  region on the simulated weekday).

  The state is RE-DRAWN ONLY WHEN the person''s ASSIGNED commute-distance class (from the
  synthesised home/workplace geometry) is STRICTLY HIGHER than their MiD DONOR''s own class (from
  the donor''s first valid work-trip length): otherwise the donor''s own day already encodes that
  class''s not-working and home-office behaviour and is passed through unchanged, which avoids
  double-counting the survey''s own home-office mass. When a re-draw does happen, the keep
  probability is read BY COLUMN NAME from the committed MiD reporting-day table (never typed from
  a report): P(keep) = share_at_workplace(assigned class) / share_at_workplace(donor class), which
  is exactly the workplace/home substitution the MiD data shows rising monotonically with
  distance while not-working stays flat. Above commute_day_far_threshold_km (200 km -- the MiD
  P_ARB_ENTF top-code, ASSUMPTION) a not-kept worker becomes absent with probability
  commute_day_absent_share_far (1.0, ASSUMPTION; the pre-registered sensitivity check re-runs this
  at 0.6), except a person with an active-escort leg on their own day, who may become home but
  never absent (escort duty evidences presence at home). A home worker for whom the donor pool
  holds no day at any coarsening level (three HARD criteria -- active escort, children under 14,
  car ownership -- never coarsened, five SOFT criteria coarsened in a fixed order) is downgraded
  to at_workplace and counted, rather than silently reported as a "home" day nobody actually
  received.

  Two-view trips architecture (what keeps this out of a dependency cycle with location
  assignment): the PRE-ASSIGNMENT view (synthesis.population.trips / ...activities) stays
  untouched and keeps feeding the commute distances, the primary candidates and the primary
  location assignment the day state itself depends on; a REPORTING-DAY view
  (synthesis.population.trips.final / ...activities.final) carries the finished day and feeds
  everything that needs it -- secondary location choice, the eqasim location join, the synthesis
  output writer, and the MATSim population. With commute_day_state_enabled false every worker
  stays at_workplace and every .final stage is a byte-identical pass-through of the pre-assignment
  view (proven by an explicit test, per the project''s default-ON convention).'
stages:
- braunschweig.synthesis.commute_day.home_office_donors_stage
- braunschweig.synthesis.commute_day.state_stage
- synthesis.population.trips.final
- synthesis.population.activities.final
- synthesis.population.spatial.locations
- synthesis.output
- synthesis.population.spatial.secondary.locations
- matsim.scenario.population
- braunschweig.analysis.synthesis.work_participation_by_kreis
- braunschweig.analysis.cordon_validation
pipelines:
  popsim_mid: active
  popsim_open: not_used
  simple_ipf_open: not_used
lifecycle: active
production:
  enabled: true
  flags:
  - commute_day_state_enabled
introduced:
  issue: 244
  pr: null
  adr: ADR-0104
code_paths:
- braunschweig/synthesis/commute_day/home_office_donors_stage.py
- braunschweig/synthesis/commute_day/donor_pool.py
- braunschweig/synthesis/commute_day/state_stage.py
- braunschweig/synthesis/commute_day/state.py
- braunschweig/synthesis/commute_day/matching.py
- braunschweig/synthesis/commute_day/trips_day_stage.py
- braunschweig/synthesis/commute_day/plan_replacement.py
- braunschweig/synthesis/commute_day/activities_day_stage.py
- braunschweig/synthesis/commute_day/spatial_locations_day.py
- braunschweig/synthesis/commute_day/output_day.py
- braunschweig/synthesis/commute_day/day_view.py
- braunschweig/calibration/commute_day_state_reference.py
- braunschweig/matsim/scenario/population.py
- braunschweig/analysis/synthesis/work_participation_by_kreis.py
