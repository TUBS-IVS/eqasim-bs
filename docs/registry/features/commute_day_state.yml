evidence:
  tests:
  - tests/test_commute_day_donor_pool.py
  - tests/test_commute_day_matching.py
  - tests/test_commute_day_plan_replacement.py
  - tests/test_commute_day_state.py
  - tests/test_commute_day_state_reference.py
  - tests/test_commute_day_state_reference_pins.py
  - tests/test_commute_day_stages.py
  - tests/test_commute_day_consumers.py
  off_path_byte_identical:
    claimed: 'true'
    test: tests/test_commute_day_stages.py::test_trips_day_stage_off_returns_the_identical_object
    note: 'commute_day_state_enabled defaults true in configs/base_bs.yml; every OFF-path claim is
      proven by a dedicated test, not merely asserted: the donor-pool stage returns two empty
      frames without reading any raw MiD file
      (test_donor_stage_off_returns_empty_frames_with_the_on_path_columns), the state stage marks
      every worker at_workplace/reason=disabled (test_state_stage_off_marks_every_worker_at_workplace),
      the reporting-day trips stage returns the pre-assignment frame BY IDENTITY, not merely by
      equal values (test_trips_day_stage_off_returns_the_identical_object), the output writer keeps
      the legacy persons.csv column set
      (test_output_day_off_hands_the_enriched_frame_through_untouched), and the MATSim writer never
      reads the pre-assignment frames on the day-view path
      (test_matsim_population_load_raw_never_reads_the_pre_assignment_frames). popsim_open and
      simple_ipf_open additionally set the flag false in their own committed fixtures and never
      reach any commute_day stage in their synpp DAG at all (checked directly against the committed
      DAG snapshots, not merely against the flag).'
  fallback_rate:
    instrumented: true
    log_marker: '[commute day state]'
    note: 'log_marker names the central marker (state.py and state_stage.py, verified present in
      source); the fallback/guard rates below are actually spread across every module''s own tag,
      each independently grep-able: [commute day donors] and [commute day donors stage]
      (donor_pool.py / home_office_donors_stage.py -- distance-source fallback,
      immobile/chain-dropped counts), [commute day state] (state.py / state_stage.py -- the draw
      itself, donor-distance PRIMARY-source coverage, the not-replaceable downgrade and its
      RAISE), [commute day matching] (matching.py -- the coarsening cascade),
      [commute day trips] (trips_day_stage.py -- donors-without-trips), [commute day activities]
      (activities_day_stage.py), [commute day locations] (spatial_locations_day.py),
      [commute day output] (output_day.py -- the join-coverage RAISE),
      [commute day population] (braunschweig/matsim/scenario/population.py) and
      [braunschweig.analysis.cordon_validation] (cordon_validation.py). The SEPARATE analysis-only
      tag [commute_day_state] (underscored, braunschweig/analysis/synthesis/
      work_participation_by_kreis.py) belongs to the Phase A measurement feature
      (commute_day_state_measurement), not to this one, and is listed there.

      Every substitution/exclusion path is counted, logged as an explicit rate and, where a
      collapsed rate would make the drawn shares meaningless, guarded: the donor pool''s commute-
      distance source falls back P_ARB_ENTF -> first valid work-trip length -> the literal
      "unknown" (warned above 50% unknown); the state stage''s own donor-distance PRIMARY-source
      coverage (donor_source_by_assigned_class) is warned below 50% overall
      (ADR-0104 Amendment 1: a donor who worked at home or did not work that day has no work-trip
      length, which is exactly the residual this rate must not hide); the donor-matching coarsening
      cascade counts every level (0-6) it had to fall back to, per person; a home worker the donor
      pool cannot serve at any level is downgraded to at_workplace and counted, and the stage
      RAISES above commute_day_max_not_replaceable_share (default 0.5) rather than reporting a home
      share the model did not actually produce; the reporting-day trips stage warns above 1% of
      matched donors having zero rows in donor_trips (a donor_id key/dtype mismatch symptom, not a
      genuinely immobile donor at that rate); the output writer raises if not one person in the
      enriched population matches the state frame at all (a broken join, not "no worker works
      today").'
  reference:
    kind: committed
    path: eqasim-data/data/braunschweig/mid/mid2023_workday_location_by_commute_distance.csv
    note: The MiD 2023 reporting-day work-location shares by commute-distance class (data record
      mid2023_workday_location), read by column name for the keep-probability ratio -- never typed
      from a report PDF. The regional SrV 2023 work-participation reference
      (srv2023_work_participation_by_kreis.csv, data record srv2023_work_participation) is the
      target of pre-registered check 1 (validation.note below), not an input the model reads at
      run time.
validation:
  state: unvalidated
  runs: []
  metric: null
  note: 'ADR-0104 fixes SIX pre-registered checks BEFORE the model exists, which Phase B is held
    to and which are NOT to be retro-fitted to the outcome (the design spec of 2026-09-04 is only
    where they were first drafted; this ADR is the durable record): (1) realised
    at_workplace/home/absent shares and the share of employed persons without a work trip,
    regionally against SrV 0.1418 / 0.6511 / 0.2071, tolerance +/- 3 pp on the REGIONAL aggregate
    only (per-Kreis values reported, never gated) -- ASSUMPTION: the band is a pre-registered
    tolerance chosen a priori, not derived from any committed source, because the SrV per-Kreis
    cells rest on 663-2,268 persons under a stratified PSU design and are assumption-grade for a
    full Kreis. (2) Inter-Gemeinde work bands re-measured with the Phase 0 stages: the 100_plus
    band below 3%, no deterioration up to 50 km against the 2026-09-04 baseline EMD --
    ASSUMPTION: the 3% bound is a chosen operating bound with NO reference behind it (every
    100_plus column of the committed SrV table is exactly 0.0, a structural survey blind spot per
    ADR-0102 Assumption 2, so a 0% bound would assert that blind spot as truth). (3) Cordon
    out-commuter gate volumes before/after, against an expectation restricted to at_workplace
    persons (braunschweig.analysis.cordon_validation''s gate_volumes_scaled.csv /
    commute_day_state_scaling.json). (4) Donor-matching diagnostics: coarsening rate per step,
    not-replaceable share, missing-donor-distance share, pool size per cell. (5) Sensitivity of
    commute_day_absent_share_far, 1.0 vs 0.6. (6) OFF-path byte identity, a 25% proof run first
    and a 100% proof in the next scheduled production run. None of these six has been run against
    a live population yet -- Task 7 of this Phase B plan runs the 25% proof; until that
    comparison is recorded in a run manifest, this record stays "unvalidated": the model is wired,
    tested on synthetic frames, and its fallback rates are instrumented, but it has not yet been
    measured against any of its own pre-registered checks. Convergence of a MATSim run is not
    validation and is not claimed here.'
assessment:
  status: pending
  pending_reason: Phase B Task 7 runs the 25% proof against the six pre-registered checks recorded
    in ADR-0104 and in this record's validation.note; the assessment stays pending until that run
    is recorded in a manifest and the six checks are read off it. No owner verdict on realised
    commute-day-state behaviour exists yet.
notes: 'Depends on the raw MiD 2023 B1 delivery at run time (mid2023_b1, restricted, server-only)
  via the home-office donor pool (data record mid2023_home_office_day_donors) and on the committed
  MiD reference table (data record mid2023_workday_location) for the keep-probability ratio.
  popsim_open and simple_ipf_open are not_used, not merely inactive-by-default: their committed
  fixtures (configs/fixtures/config_popsim_open_braunschweig.yml,
  configs/fixtures/config_local_braunschweig_25pct.yml) set commute_day_state_enabled: false AND
  neither fixture''s synpp DAG snapshot contains a single commute_day stage node -- checked
  directly against docs/registry/dag/{popsim_open,simple_ipf_open}.json, not inferred from the
  flag alone. Phase A (measurement only, no model behaviour) is the separate feature record
  commute_day_state_measurement, which this feature consumes the evidence of (ADR-0104''s
  "Amendments to the design" section records the three corrections Phase A forced on the design
  before this feature was built). Cache cost, deliberate (ADR-0104 Consequences): the .final alias
  switch devalidates secondary locations and everything downstream ONCE, even with the flag OFF,
  on the order of hours at 100% scale.'
