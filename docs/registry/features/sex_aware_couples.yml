feature: sex_aware_couples
title: Sex-aware couples (~1.1%)
area: population
description: Pairs couples sex-aware (~1.1% same-sex, Destatis MZ 2025) during IPF household composition
  (ADR-0006).
stages:
- data.census.filtered
pipelines:
  popsim_mid: not_used
  popsim_open: not_used
  simple_ipf_open: inactive
lifecycle: supported
production:
  enabled: false
  flags:
  - braunschweig.chunking.sex_aware_couples
introduced:
  issue: null
  pr: null
  adr: ADR-0006
detail_doc: docs/features/household-synthesis.md
code_paths:
- braunschweig/ipf/household_composition.py
evidence:
  tests:
  - tests/test_household_composition.py
  off_path_byte_identical:
    claimed: 'true'
    test: tests/test_household_composition.py
    note: |
      test_sexes_none_is_byte_identical_to_legacy_pairing confirms the no-sex-data path (the flag only takes effect when sex is supplied) matches legacy pairing byte-for-byte. ADR-0006 itself also frames "OFF = legacy sex-blind, byte-identical."
  fallback_rate:
    instrumented: false
    note: No fallback-rate log found; the opposite-first allocation is a pure function.
  reference:
    kind: assumption
    note: |
      DEFAULT_SAME_SEX_COUPLE_SHARE=0.011 is a hardcoded constant, provenance stated only in prose (docs/features/household-synthesis.md cites Destatis Mikrozensus 2025); no CSV/table is committed under eqasim-data/.
validation:
  state: unvalidated
  runs: []
  metric: null
  note: No scalar KPI currently attributed to a recorded run.
assessment:
  status: pending
  by: null
  date: null
  pending_reason: |
    DISCREPANCY FOUND: braunschweig.chunking.sex_aware_couples is NOT set to true anywhere in any committed config -- explicitly listed as an intentionally-absent dead key on the active popsim_mid path. This contradicts PROJECT_STATUS.md's 🟢 legend ("ON in real-data run configs"), the same pattern as joint_age_size_margin.yml and age_aware_composition.yml. ADR-0006 documents the design but not this discrepancy.
  source: ADR-0006
notes: 'Issue #251: the flag is not set in any committed run configuration (PROJECT_STATUS.md
  previously marked it ON); the IPF path itself is not the production population method.'
