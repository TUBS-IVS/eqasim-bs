feature: srv_participation_controls
title: SrV participation controls (#224)
area: attributes
description: >-
  SrV-2023-anchored per-Kreis trip-participation controls (work / leisure / education
  shares, #224; escort share, #227) applied to the MiD donor draw in the PopulationSim
  workflow. The escort control counts only the ACTIVE MiD escort leg (W_ZWECK 6) to match
  the SrV E_ZWECK_9 == 6 (Holen/Bringen) target universe; the passive leg (W_ZWECK 13,
  escorted minors' own trips) is deliberately excluded.
stages:
- data.census.filtered
pipelines:
  popsim_mid: active
  popsim_open: inactive
  simple_ipf_open: not_used
lifecycle: active
production:
  enabled: true
  flags:
  - braunschweig.population.popsim.work_participation_kreis_control
  - braunschweig.population.popsim.leisure_participation_kreis_control
  - braunschweig.population.popsim.education_participation_kreis_control
  - braunschweig.population.popsim.escort_participation_kreis_control
introduced:
  issue: '#224'
  pr: '#225'
  adr: null
detail_doc: docs/features/regional-control-targets.md
code_paths:
- braunschweig/popsim/stage/
- braunschweig/analysis/population_validation/participation_fit.py
evidence:
  tests:
  - tests/test_participation_target.py
  - tests/test_participation_fit.py
  - tests/test_map_work_participation.py
  - tests/test_leisure_education_participation.py
  - tests/test_escort_participation.py
  - tests/test_run_population_validation.py
  off_path_byte_identical:
    claimed: 'true'
    test: tests/test_participation_target.py
    note: |
      PROJECT_STATUS records "default ON, OFF byte-identical" for PR #225; the specific byte-identity test function still has to be pinned in this declaration.
  fallback_rate:
    instrumented: false
    note: |
      No primary-vs-fallback rate log was found for the participation controls. Per CLAUDE.md this instrumentation is mandatory for any path with a fallback and should be added.
  reference:
    kind: committed
    path: eqasim-data/data/braunschweig/srv/srv2023_participation_by_kreis.csv
validation:
  state: unvalidated
  runs: []
  metric: participation_gap_closed_share
  note: >-
    PROJECT_STATUS reports a Kreis 03101 smoke (78/78/53/30 % of the MiD->SrV gap closed,
    residual donor-bound). Not copied here until attributable to a recorded run.
    HOW THE METRIC IS PRODUCED (since #334): run_population_validation writes
    participation_fit.csv and a participation_fit entry in report.json whenever the source
    carries a trips table. Before #334 the analysis module participation_fit.py was called
    by NOTHING, so no run produced this evidence and every check was hand-rolled. The
    control-registry route stays structurally closed -- controls.build_registry validates
    columns of the assembled population, and the participation flags are input-only popsim
    seed columns that never reach it -- so the fit is measured from the realised trips.
    It is a FIT CHECK against the steering SrV targets, never independent validation.
    DONOR-BOUND DEFICIT, ROOT CAUSE FOUND (#365, ADR-0106): the residual gap this record and the
    i329 manifest call "donor-bound" is now attributed. The controls were MET in the seed and in
    the realised plans of every person whose plan source carries a diary (work 0.314 vs 0.332,
    leisure 0.372 vs 0.383, education 0.184 vs 0.176, escort 0.104 vs 0.099); the whole deficit
    sat with the 14.1% of persons whose plan source had no collected diary (MiD anzwege1 803/804)
    and who therefore received an EMPTY plan, while the same codes were imputed for the CONTROL
    variable and the seed hit its target. diary_plan_match removes that class of plan source. The
    expectation that the participation fit improves accordingly is an ASSUMPTION until an A/B arm
    is recorded; the runs that will measure it are pre-registered in
    docs/registry/features/diary_plan_match.yml and reported by
    braunschweig.analysis.synthesis.plan_structure_vs_srv.
assessment:
  status: pending
  by: null
  date: null
  pending_reason: |
    No ADR exists for #224, so there is no written record of why the residual gap was accepted as donor-bound. This is the largest documentation gap among the pilot features. Partly closed by ADR-0106 (#365), which records what the "donor-bound" residual actually was (14.1% of plan sources had no collected diary) and removes it; the #224 control design itself still has no ADR, and no run has yet re-measured the fit.
  source: null
