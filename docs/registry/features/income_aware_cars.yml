    ADR-0017 is a combined ADR covering four flags at once (see household_income_distribution.yml). This flag lives in synthesis/population/enriched.py and is dead under the active popsim_mid production method; it is only live via the simple_ipf_open fixture. docs/features/mid-reference-tables.md exists but has no dedicated section for this feature.
  source: ADR-0017
notes: 'Issue #255: this feature is implemented in the legacy synthesis.population.enriched stage,
