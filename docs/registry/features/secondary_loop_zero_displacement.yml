feature: secondary_loop_zero_displacement
title: 'Strolls and dog walks are loops: a loop activity is placed at the place of the activity before it (#679)'
area: secondary
description: 'With the switch on, the secondary location stage takes the leisure legs that are loops (a walk or
  bicycle leg with the MiD detail code 710 or 711, or drawn where the detail was not asked) out of the chain
  before the solve and puts each loop activity back at the place of the activity it starts from, the
  eqasim-france Paris model (owner decision of 2026-11-25).'
stages:
- synthesis.population.spatial.secondary.locations
- matsim.scenario.facilities
pipelines:
  popsim_mid: active
  popsim_open: not_used
  simple_ipf_open: not_used
lifecycle: active
production:
  enabled: true
  flags:
  - secondary_loop_zero_displacement
introduced:
  issue: '#679'
  pr: null
  adr: ADR-0207
detail_doc: docs/codebase/notes/leisure-loops.md
code_paths:
- braunschweig/synthesis/locations/secondary_chainsolvers/loops.py
- braunschweig/synthesis/locations/secondary_chainsolvers/__init__.py
- braunschweig/matsim/scenario/facilities.py
- braunschweig/calibration/secondary_measurement.py
- scripts/validate_secondary_distances.py
- scripts/calibrate_detour_circuity.py
- scripts/extract_mid_w_zwd_groups.py
evidence:
  tests:
  - tests/test_secondary_loops.py
  - tests/test_secondary_loops_stage.py
  - tests/test_extract_mid_w_zwd_groups.py
  - tests/test_calibrate_detour_circuity_loops.py
  off_path_byte_identical:
    claimed: 'true'
    test: tests/test_secondary_loops_stage.py::test_the_key_off_gives_todays_result_without_the_loop_origin_column
    note: 'The test fails if any loop function or the MiD loader runs with the key off, compares the stage result
      with the solver output on the uncollapsed trips (no loop_origin column) and asserts that no report file is
      written. It is a frame-level check on hand-made fixtures, not a comparison of two runs.'
  fallback_rate:
    instrumented: true
    log_marker: '[secondary_loops]'
    note: 'Both fallbacks (cell to mode marginal; loops kept on the solver instead of collapsed, by reason: the
      loop activity is anchored or linked, or the loop starts at an outside stay) are counted with a rate in the
      log and the stage report, and legs without any detail code are counted too; see the detail_doc note, sections
      "The flag (...)" (marginal fallback, missing detail code) and "The placement rule (...)" (the Report step).'
  reference:
    kind: committed
    path: eqasim-data/data/braunschweig/mid/mid2023_w_zwd_group_reference_without_loops.csv
    note: 'The loop-free variant of the W_ZWD group reference (data record
      mid2023_w_zwd_group_reference_without_loops) is a measurement reference only; no stage reads it as a
      target. The loop probability itself is estimated at run time from the MiD Wege table.'
validation:
  state: unvalidated
  runs: []
  metric: null
  note: 'No run with the switch on is recorded here yet, so nothing compares the model with observed behaviour.
    The survey measurement behind the design is the run manifest i679-stroll-loops-survey-probe-2026-11-25
    (observed MiD donor data plus the cached tables of one earlier run; a measurement, not a validation).'
assessment:
  status: pending
  by: null
  date: null
  pending_reason: 'The end-to-end evidence (1 % synthesis with the switch off and on, RunPreparation with the
    new facility ids, a short simulation) is not recorded yet; the share of loops kept on the solver (the loop
    activity is anchored or linked, or the loop starts at an outside stay), the loops collapsed for persons with
    an escort link, a portal stay or a passive joint link, and their effect are read from that run. ADR-0207
    records the decision, its assumptions and the known limitation of the leisure subtype decider.'
  source: ADR-0207
notes: 'Toggling the key recomputes the secondary location stage and the facilities stage, which both declare it.'
