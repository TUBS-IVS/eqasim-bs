feature: driving_licence_enrichment
title: Driving licence (P17.1, 3-margin IPF)
area: attributes
description: Driving licence as a categorical 3-margin IPF (raking) on MiD 2023 P17.1 (Kreis x
  sex x age), replacing the KBA-based licence model (ADR-0013). Legacy simple_ipf_open
  mechanism -- under popsim_mid attributes.map_has_license derives the attribute from the
  donor's own P_FSCHEIN with the coverage codes 202/404 imputed, and NO per-Kreis
  control is adopted from either source (ADR-0079).
stages:
- synthesis.population.enriched
pipelines:
  popsim_mid: not_used
  popsim_open: not_used
  simple_ipf_open: active
lifecycle: active
production:
  enabled: false
  flags: []
introduced:
  issue: null
  pr: null
  adr: ADR-0013
detail_doc: docs/features/mid-reference-tables.md
code_paths:
- braunschweig/synthesis/population/enriched/base.py
evidence:
  tests:
  - tests/test_mid_reference_tables.py
  off_path_byte_identical:
    claimed: not_applicable
    note: Always-on enrichment with no config flag.
  fallback_rate:
    instrumented: false
    note: |
      By design this is fail-fast, not fallback: test_license_breakdown_missing_03zgb_raises_no_averaged_fallback confirms the loader raises rather than averaging/falling back when a required region is absent. No primary/fallback rate applies.
  reference:
    kind: committed
    path: eqasim-data/data/braunschweig/mid/mid2023_P17_1.csv
    note: Also draws on the committed by-sex/by-age P17.1 tables.
validation:
  state: unvalidated
  runs: []
  metric: null
  note: No scalar KPI currently attributed to a recorded run.
assessment:
  status: pending
  by: null
  date: null
  pending_reason: |
    Wiring decided in ADR-0079: not ported, and NO per-Kreis control from either
    source. The committed MiD P17.1 ZGB table (86.9 % ja/(ja+nein), 18+) and the
    committed SrV table (92.4 %, 17+) contradict each other by 5.5-9.3 pp through a
    between-survey measurement/selectivity difference, and KBA FE4 cannot arbitrate
    (post-1999 licences only, mandatory exchange running to 2033). Still pending: the
    realised share is UNMEASURED per Kreis and by age x sex; only the STRUCTURE is
    identifiable, the level is not.
  source: ADR-0079 (mechanism decision); ADR-0013 (original design)
notes: 'Issue #255 is resolved by ADR-0079: the legacy synthesis.population.enriched
  implementation never executes under either PopulationSim pipeline (the stage name is
  aliased to braunschweig.popsim.enriched_adapter), and it stays live under
  simple_ipf_open. This is NOT a missing attribute -- see description for the mechanism
  that runs in production.'
