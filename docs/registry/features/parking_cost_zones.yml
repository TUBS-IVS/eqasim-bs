feature: parking_cost_zones
title: Zone-based parking costs (sourced tariffs, SrV free-parking shares)
area: matsim
description: >-
  Prices the parking stay at the destination of every car trip from the parking release (ADR-0139, extended by
  ADR-0140): the parking zones (parking_zones_2026, built from municipal and sourced data), their tariffs
  (parking_tariffs_2026: fee window, free threshold, first period, billing unit, day cap, maximum stay with a
  long-stay product, TU campus member and guest day products, commuter products per working day), the resident
  parking districts (parking_resident_districts_2026) and the garage dataset (parking_garages_2026). A stay pays the
  cheapest product the driver can use (assumption P1); a work or education stay may use the commuter product (P2,
  monthly price over 21 working days). Residents are exempt in their resident zone (R1) and in the resident district of
  their home where the zone honours permits (R2, R2-a). A stay in a paid street or resident zone has the street option and
  every priced garage within 1,000 m with the weight exp(-d / lambda) (G1, G2) and is priced as the probability-weighted
  expected cost; with parking_garage_decay_m 0, the value of the canonical configuration until lambda is calibrated
  (G3, pending), the garage options are off. Outside every zone parking is free (assumption Z1; the coverage register
  parking_coverage_register_2026 states the status of every municipality). Work and education parking is free for a
  share of persons per workplace class equal to the SrV 2023 free share among car commuters (assumption A1; the paid
  zones of Wolfsburg use the share of the class bs_zentrum, A1-b) and for a share of the persons with work or education on
  a TU campus (C2, an owner estimate). Every priced stay lasts at least L = parking_minimum_stay_min minutes (assumption
  L1, 15 by default, 0 prices as before L1), so the stay of a car that arrives after the planned end of its activity is
  priced for L minutes instead of none; the rule changes the price only, never the simulated timing. The parking search
  time (lever 4) is implemented and OFF (search_time_min empty, searchTimeFactor 0.0). The Java car cost model adds the
  parking cost to the driving cost behind the existing eqasim car cost model seam; the car utility and its coefficients
  are unchanged. Replaces the legacy 8 km ring (feature urban_parking) when parking_zones_enabled is on; the two flags
  are mutually exclusive (ADR-0139). Decisions of the v2 release, rejected options and consequences: ADR-0140.
