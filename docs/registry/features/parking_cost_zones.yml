  off_path_byte_identical:
    claimed: true
    test: tests/test_population_parking_attributes.py::test_frames_without_parking_columns_match_the_prechange_writer_bytes
    note: >-
      With the flag off the plans writer attaches no parking column and writes the plans of the writer
      before this feature byte for byte (golden literals generated from base commit 1fe22664; the legacy
      ring is pinned the same way by test_legacy_ring_frames_match_the_prechange_writer_bytes, and the
      wrapper never touches braunschweig.parking.attach, test_execute_off_never_touches_the_attach_module);
      the preparation then declares only the flag and leaves the prepared config byte-identical
      (tests/test_parking_prepare_wiring.py::test_off_declares_only_the_flag_and_leaves_the_prepared_config_byte_identical),
      and the run stage calls no parking check and starts MATSim with unchanged arguments
      (tests/test_parking_run_checks.py::test_off_calls_no_parking_check_and_runs_matsim_exactly_as_before).
      Without the braunschweigParking module the Java car cost model name is unchanged (eqasim-java-bs
      BraunschweigConfiguratorParkingTest). The simulation-level check of the jar without the module is
      recorded in the run manifest parking-zones-smoke-zgb-1pct-2026-09-30: OFF and LEGACY trips and scores
      byte-identical across the jars of origin/main and the branch (jar_parity_sha256.csv).
  fallback_rate:
    instrumented: true
    log_marker: '[parking]'
    note: >-
      Every attach step logs its coverage as rates under [parking]: activities in zones with the most
      frequent zones, persons with a resident zone, and per workplace class the persons, p_free and the
      realised free share of the draw. An activity outside every zone is the modelled state of assumption
      Z1, not a fallback; zones present but not one activity inside raise (the signature of a broken join
      or a CRS mismatch), and an unknown zone id raises in Python and in Java. At controller start the Java
      ParkingPopulationCheck fails the run for unknown zone ids, legacy isParis attributes or mistyped
      parking attributes and logs the plans' zone coverage in one [parking] population line. During the run
      every pricing call is counted by outcome (ITERS/it.N/N.parking_outcomes.csv and one [parking] log line
      per iteration); the counts are pricing calls, one per car alternative that mode choice evaluated,
      chosen or not, and version 1 reports the mix without a threshold. The Java ParkingOutcomeReportListener
      also logs the active minimum stay (L1) once at startup and per iteration how many priced stays in a
      zone it extended, likewise per pricing call. When the prepared config enables
      the braunschweigParking module, matsim.simulation.run refuses a jar without the Java parking package
      before the run and a run whose last iteration wrote no outcome report after it
      (braunschweig.parking.runtime_checks), so a zones-prepared scenario cannot run unpriced. Since v2 the garage
      dataset logs its priced share and the count of rows per assumption (P3 to P12) at every load, the free-parking
      draw logs the realised free share per workplace class and per campus together with the proxy mapping, the
      outcome report (CSV v3) carries the expected garage share and the stays with a garage in range per outcome, zone
      and purpose, and the Java listener logs the garage rates per iteration while the garage options are on. An
      activity inside a resident district outside every fee zone is free by Z1, not a fallback. A garage priced from secondary evidence (P11) or from the
      municipal free default (P12) is named per row, not hidden.
  reference:
    kind: committed
    path: eqasim-data/data/braunschweig/parking/parking_tariffs_2026.csv
    note: >-
      The tariffs are committed, sourced facts per zone (data records parking_tariffs_2026,
      parking_zones_2026 and parking_coverage_register_2026) and the free shares a committed SrV 2023
      aggregate (srv2023_commute_parking_by_workplace_class). They are model inputs, not an observed
      behavioural reference: this feature compares no model output with observed behaviour yet.
      srv2023_city_center_parking is a comparison quantity of the planned runs with a universe caveat (SrV asks
      Braunschweig residents, the model counts all car arrivals), not a validation; since v2 its garage share is
      the CALIBRATION TARGET of the garage decay length (ADR-0140, parking_garage_decay_calibration_2026, pending)
      and no longer a validation quantity, while its paid share and the commuter garage share of
      srv2023_commute_parking_by_workplace_class stay independent comparison quantities
      (scripts/parking/compare_parking_targets.py).
validation:
  state: unvalidated
  runs:
  - parking-zones-smoke-zgb-1pct-2026-09-30
  metric: null
  note: >-
    The local 1 % OFF/LEGACY/ZONES smoke (run manifest parking-zones-smoke-zgb-1pct-2026-09-30) is a wiring
    proof and an indicative A/B on the June 2026 scenario after 10 iterations: the zone attributes, the tariff
    model and the braunschweigParking module work end to end, the branch jar without the module reproduces the
    origin/main jar byte for byte, and the Python reference and the Java calculator agree on the golden cases
    and in randomised differential tests. These are consistency checks, not a validation; the one comparison
    with an observed quantity (the SrV city-centre paid share) carries a universe caveat and is recorded as a
    comparison. That smoke ran the first release (ADR-0139): no run of the v2 release (ADR-0140) exists, neither
    the three-arm comparison nor the calibration of lambda, so nothing of v2 is validated and no direction or size of
    an effect on the mode shares is stated. Planned: the 25 % legacy-vs-zones A/B and the v2 arms on the server
    (task 5b of issue #436), whose run manifest will be linked here. Convergence of a run is not validation.
assessment:
  status: pending
  by: null
  date: null
  pending_reason: >-
    Owner review of the v2 release (ADR-0140) and of the runs that do not exist yet: the calibration of the
    garage decay length (parking_garage_decay_m is 0 in the canonical configuration until the calibration table
    exists) and the three-arm comparison with the SrV references on the server. Owner review of the 25 %
    legacy-vs-zones A/B (with the L1 arms parking_minimum_stay_min 0 and 30 next
    to the default 15), which is still to run on the server, and of the
    production flip of parking_zones_enabled to true, which is part of the reviewed branch although the
    design had planned it for after the A/B; the owner decides the flip at PR review. The two popsim
    fixture configurations follow the flip with the parking block of configs/base_bs.yml
    (tests/test_popsim_config_parity.py pins it), so reverting it there reverts them too.
  note: >-
    Java implementation lives in eqasim-java-bs (org.eqasim.braunschweig.parking, branch
    feature/i436-parking-cost-zones-v2, which extends feature/i249-parking-cost-zones) with its own unit tests;
    the golden cases are shared through tests/fixtures/parking/parking_golden_cases.json (schema_version 4).
notes: >-
  simple_ipf_open is not_used because its configurations write the plans with the plain
  matsim.scenario.population stage, which attaches no parking attribute and therefore rejects
  parking_zones_enabled at configure time (stage record matsim.scenario.population); the zones need the
  alias to braunschweig.matsim.scenario.population. Production state of the v2 release (ADR-0140): the flag
  parking_zones_enabled is on in configs/base_bs.yml; parking_garage_decay_m is 0 (the garage options are off) until
  scripts/parking/calibrate_garage_decay.py has run on the plans of a server run and its table
  parking_garage_decay_calibration_2026.csv is committed; the parking search time is off (searchTimeFactor 0.0, no
  zone carries a search time). introduced.adr names the first decision; ADR-0140 extends it.
