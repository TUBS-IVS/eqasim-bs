  by: null
  date: null
  pending_reason: >-
    Owner review of the 25 % legacy-vs-zones A/B, which is still to run on the server, and of the
    production flip of parking_zones_enabled to true, which is part of the reviewed branch although the
    design had planned it for after the A/B; the owner decides the flip at PR review.
  note: >-
    Java implementation lives in eqasim-java-bs (org.eqasim.braunschweig.parking, branch
    feature/i249-parking-cost-zones) with its own unit tests; the golden cases are shared through
    tests/fixtures/parking/parking_golden_cases.json.
