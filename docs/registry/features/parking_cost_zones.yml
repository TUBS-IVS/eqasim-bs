feature: parking_cost_zones
title: Zone-based parking costs (sourced tariffs, SrV free-parking shares)
area: matsim
description: >-
  Prices the parking stay at the destination of every car trip with the sourced tariff of the parking
  zone the destination lies in (release parking_zones_2026 / parking_tariffs_2026): fee window, free
  threshold, first period, billing unit, day cap, maximum stay with a long-stay product, TU campus
  member and guest day products, and the resident exemption of resident zones. Outside every zone
  parking is free (assumption Z1; the coverage register parking_coverage_register_2026 states the status
  of every municipality). Work and education parking is free for a share of persons per workplace class
  equal to the SrV 2023 free share among car commuters (assumption A1). The Java car cost model adds the
  parking cost to the driving cost behind the existing eqasim car cost model seam; the car utility and its
  coefficients are unchanged. Replaces the legacy 8 km ring (feature urban_parking) when
  parking_zones_enabled is on; the two flags are mutually exclusive (ADR-0139).
stages:
- braunschweig.parking.zones_stage
- matsim.scenario.population
- matsim.simulation.prepare
- matsim.output
pipelines:
  popsim_mid: active
  popsim_open: supported
  simple_ipf_open: not_used
lifecycle: experimental
production:
  enabled: true
  flags:
  - parking_zones_enabled
introduced:
  issue: '#436'
  pr: null
  adr: ADR-0139
detail_doc: docs/codebase/notes/parking-cost-zones.md
code_paths:
