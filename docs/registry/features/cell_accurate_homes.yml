feature: cell_accurate_homes
title: Cell-accurate homes (100m)
area: home
description: 'PopulationSim households keep their Zensus-2022 100m cell: homes are placed in an
  area-weighted ALKIS building INSIDE the household''s own grid cell instead of being re-sampled
  anywhere in the municipality (ADR-0007).'
stages:
- synthesis.population.spatial.home.locations
pipelines:
  popsim_mid: active
  popsim_open: active
  simple_ipf_open: not_used
lifecycle: active
production:
  enabled: true
  flags: []
introduced:
  issue: null
  pr: null
  adr: ADR-0007
detail_doc: docs/features/building-potentials.md
code_paths:
- braunschweig/synthesis/locations/home_cell.py
evidence:
  tests:
  - tests/test_home_cell.py
  - tests/test_home_cell_legacy_cap.py
  - tests/test_home_cell_typed.py
  - tests/test_home_cell_thinning.py
  - tests/test_building_typing_golden.py
  off_path_byte_identical:
    claimed: not_applicable
    note: |
      No dedicated config flag -- this is code-path selection driven by braunschweig.population.method (popsim vs. non-popsim), not a boolean toggle.
  fallback_rate:
    instrumented: true
    log_marker: '[home_cell] %d households: %d placed in their 100m cell'
    note: |
      Logs placed-in-own-cell vs. commune-fallback (no building in cell) vs. unplaced (no building at all) rates, escalating to a warning when either fallback occurs.
      The typed path (home_cell.assign_homes_typed) counts its census-signal fallbacks per household in the TypedHomeReport fallback fields (log marker '[home_typed] census-signal fallback households') and warns above home_cell.FALLBACK_WARN_RATE.
      The typed path also thins its slots per building type to the sampled households when the config key sampling_rate is below 1 (home_cell._thin_slots_by_type; log marker '[home_typed] slot thinning at sampling_rate'); the type routing uses the full-population household-type mix per cell read from data.census.filtered (home_cell.full_households_per_cell_type), with the sampled mix as a counted fallback (log marker '[home_typed] slot thinning type routing').
  reference:
    kind: none
    note: |
      The Zensus 100m grid parquet (eqasim-data/data/braunschweig/popsim/cells/zensus2022_grid_100m_de_prepared.parquet) is NOT committed -- no cells/ subdirectory exists under eqasim-data/data/braunschweig/popsim/.
validation:
  state: unvalidated
  runs: []
  metric: null
  note: No scalar KPI currently attributed to a recorded run.
assessment:
  status: pending
  by: null
  date: null
  pending_reason: |
    ADR-0007 documents the design; no owner verdict on realised cell-placement coverage has been recorded.
  source: ADR-0007
