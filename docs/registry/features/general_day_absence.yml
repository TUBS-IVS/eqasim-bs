feature: general_day_absence
title: General reporting-day absence (two-stage SrV-anchored state draw)
area: behavior
description: 'Gives EVERY synthetic person a reporting-day absence state,
  day_absence_state in {present, absent_household, absent_individual}, so the model can
  represent the 4.98 % of SrV 2023 respondents who were away from home over the WHOLE
  reporting day (E_ANZ_WEGE == -7) -- a state the synthetic population previously had no
  concept of at all, since every person exists and starts the day at home (issue #370,
  ADR-0110). Two seeded stages in braunschweig.synthesis.day_absence.absence
  (braunschweig.synthesis.day_absence.absence_stage): a HOUSEHOLD draw marks a whole
  household absent_household with probability p_household(size_class) (committed
  srv2023_absence_household_by_size.csv, by household size 1..5+); an INDIVIDUAL residual
  draw then marks every still-present person absent_individual per age band, at the
  probability needed so the committed per-band rate (srv2023_absence_by_age_band.csv) is
  met IN EXPECTATION net of what the household stage already realised in that band. This
  reproduces both the SrV per-band absence rates and the SrV household clustering (55.8 %
  of absent persons live in a fully absent household), which an individual-only draw at the
  same rates could not (an independent draw absorbing a 2-person household is ~0.25 % vs. the
  observed 3.40 % household-fully-absent share for that size -- about 14 times, roughly one
  order of magnitude, apart).

  Independent of employment, workplace assignment, and the pre-existing far-commuter
  commute_day_state model of ADR-0104/#244 (a person can be both a commute-day "absent" far
  commuter and a general-absence absent_household/absent_individual at once). The two states
  compose in braunschweig.synthesis.commute_day.plan_replacement.build_day_trips''s
  general_absence keyword: a person is trip-less in the reporting-day view when
  commute_day_state == "absent" OR day_absence_state != "present" -- the union, counted three
  ways (commute-only, general-only, both) in the stage''s diagnostics. The drawn state is
  exported as the day_absence_state column of persons.csv (via the existing
  PERSON_OPTIONAL_OUTPUT_COLUMNS mechanism, present for every person -- unlike
  commute_day_state''s worker-only coverage) and, in the MATSim population, as the person
  attribute dayAbsenceState. braunschweig.analysis.synthesis.plan_structure_vs_srv can
  additionally restrict its model side to the SrV at_home_only universe (mirroring the
  ADR-0109 participation-control universe) once the draw is applied, and
  braunschweig.analysis.synthesis.work_participation_by_kreis folds a generally absent
  employed person into ADR-0104 check 1''s absent share rather than leaving them a
  no-workplace remainder. With day_absence_enabled false every person is present and every
  consumer stage is byte-identical to before this feature existed.'
stages:
- braunschweig.synthesis.day_absence.absence_stage
- synthesis.population.trips.final
- synthesis.output
- matsim.scenario.population
- braunschweig.analysis.synthesis.plan_structure_vs_srv
- braunschweig.analysis.synthesis.work_participation_by_kreis
pipelines:
  popsim_mid: active
  popsim_open: not_used
  simple_ipf_open: not_used
lifecycle: active
production:
  enabled: true
  flags:
  - day_absence_enabled
introduced:
  issue: 370
  pr: 387
  adr: ADR-0110
code_paths:
- braunschweig/calibration/srv_absence.py
- scripts/extract_srv_absence.py
- braunschweig/synthesis/day_absence/absence.py
- braunschweig/synthesis/day_absence/absence_stage.py
- braunschweig/synthesis/commute_day/plan_replacement.py
- braunschweig/synthesis/commute_day/trips_day_stage.py
- synthesis/output.py
- braunschweig/synthesis/commute_day/output_day.py
- matsim/scenario/population.py
- braunschweig/matsim/scenario/population.py
- braunschweig/analysis/synthesis/plan_structure_vs_srv.py
- braunschweig/analysis/plan_structure.py
- braunschweig/analysis/synthesis/work_participation_by_kreis.py
evidence:
  tests:
  - tests/test_srv_absence.py
  - tests/test_day_absence.py
  - tests/test_day_absence_stage.py
  - tests/test_commute_day_plan_replacement.py
  - tests/test_commute_day_stages.py
  - tests/test_commute_day_consumers.py
  - tests/test_plan_structure_vs_srv.py
  - tests/test_work_participation_by_kreis.py
  off_path_byte_identical:
    claimed: 'true'
    test: tests/test_commute_day_stages.py::test_trips_day_stage_off_off_returns_the_identical_object
    note: 'day_absence_enabled defaults true in configs/base_bs.yml; every OFF-path claim is proven
      by a dedicated test, not merely asserted: the absence stage itself marks every person
      present/reason=disabled without reading either committed reference table
      (tests/test_day_absence_stage.py::test_off_path_marks_everyone_present_without_reading_any_file),
      the reporting-day trips stage returns the pre-assignment frame BY IDENTITY when BOTH flags
      are false, driven exactly the way the SDD brief spells the case out
      (tests/test_commute_day_stages.py::test_trips_day_stage_off_off_returns_the_identical_object,
      distinct from the pre-existing commute-day-only identity test
      test_trips_day_stage_off_returns_the_identical_object), the output writer emits no
      day_absence_state column when the flag is off (implicit in
      test_output_day_on_appends_the_day_absence_state_column_last only running the ON path; the
      OFF path is the untouched-frame branch already covered by the sibling commute_day_state OFF
      tests), and the MATSim writer emits dayAbsenceState only for persons that have one, never a
      substituted value, when the absence stage is declared
      (tests/test_commute_day_consumers.py::test_matsim_writer_emits_day_absence_state_only_for_persons_that_have_one).
      configs/fixtures/config_popsim_open_braunschweig.yml sets day_absence_enabled: false
      (ruling R13 of the #370 SDD plan, correcting ruling R2''s wrong premise that no
      synthesis.population.trips.final alias existed there at all): it DOES alias
      synthesis.population.trips.final, to the bare pre-assignment stage
      braunschweig.popsim.trips_stage, but it ALSO aliases matsim.scenario.population to the
      braunschweig wrapper, which gates its own declaration of
      braunschweig.synthesis.day_absence.absence_stage on this SAME flag independent of the
      trips.final alias -- false is NECESSARY there to avoid writing a dayAbsenceState attribute
      onto persons whose trips are never removed (the defect class the final-review fix wave''s
      Important finding 1 closed for configs/fixtures/config_popsim_mid_braunschweig.yml), not
      merely set for parity. configs/fixtures/config_smoke_popsim_open_mini.yml sets the same
      flag false for the ORIGINAL parity reason: it aliases neither matsim.scenario.population
      nor synthesis.output to a day-absence-aware stage (it does not even run matsim.output), so
      the flag genuinely has no consumer there. configs/fixtures/config_local_braunschweig_25pct.yml
      (simple_ipf_open) leaves the flag at its code default for the identical no-consumer reason.
      The plain DAG non-wiring in the no-consumer cases is what actually keeps those byte-identical
      (same precedent as commute_day_state_enabled''s "redundant but explicit" fixture setting, see
      docs/codebase/notes/commute-day-two-view-trips.md).'
  fallback_rate:
    instrumented: true
    log_marker: '[day absence]'
    note: 'The central marker (braunschweig/synthesis/day_absence/absence.py and absence_stage.py,
      verified present in source) instruments every guard the draw itself owns: (1)
      AbsenceReference.__post_init__ / _check_reference_coverage RAISE (not merely warn) unless
      each committed table covers EXACTLY its expected keys (the seven age bands, the five
      household size classes) with every rate in [0, 1] -- a missing band or size class must never
      silently become a NaN residual (CLAUDE.md "scalar-default-when-map-missing"); (2) the
      household-stage overshoot guard (draw_absence) WARNS, naming the band and both rates, when
      the household stage alone already exceeds a band''s reference rate (r_hh(a) > r(a)), which
      would otherwise force a negative residual; (3) the per-band deviation guard
      (day_absence_max_band_deviation_pp, default 1.0 pp, absence_stage.execute) WARNS for any band
      with >= 1,000 persons whose realised absence share deviates from the reference by more than
      the threshold, naming both rates and the deviation -- a guard against a broken reference join
      or a reference-table drift, not a target the draw is tuned to hit exactly.

      Two further guards live in DOWNSTREAM consumers under their OWN log tags (not [day absence],
      listed here because they exist specifically to make this feature''s composition observable,
      the same cross-tag convention commute_day_state''s fallback_rate note uses):
      braunschweig.analysis.synthesis.work_participation_by_kreis (tag [commute_day_state])
      WARNS when a non-empty general-absence draw overrides NOBODY in the employed universe
      (apply_general_absence) -- a real population almost always has at least one generally absent
      employed person, so a zero overlap most likely signals a person_id join defect between the
      absence stage and this one; braunschweig.analysis.synthesis.plan_structure_vs_srv (tag
      [plan_structure_vs_srv]) WARNS when universe=at_home_zero is compared WITHOUT the absence
      draw applied (day_absence_enabled false, or the pre_assignment trips view) -- the model then
      has no away-from-home concept at all while the SrV at_home_zero reference still counts such
      persons as zero-trip, the same "universe trap" ADR-0109 named for the participation controls,
      here in its plan-structure form.

      MEASURED on the 100 % population (run manifest general-day-absence-arm1-100pct-2026-09-09):
      neither the household-stage overshoot guard nor the per-band deviation guard fired -- the
      largest realised per-band deviation was 0.10 pp (65-74: 5.98 % against 5.88 %) -- and both
      downstream guards stayed silent as expected (28,826 of 535,757 employed persons were
      overridden to absent in work_participation_by_kreis; plan_structure_vs_srv ran at_home_zero
      WITH the draw applied). The guards therefore have a first live baseline; they remain guards,
      not targets.'
  reference:
    kind: committed
    path: eqasim-data/data/braunschweig/srv/srv2023_absence_by_age_band.csv
    note: SrV 2023 age-band absence rates (03ZGB, GEWICHT_P_ZENSUS), the per-band target of the
      individual residual stage and of the per-band deviation guard; its sibling
      eqasim-data/data/braunschweig/srv/srv2023_absence_household_by_size.csv (GEWICHT_HH_ZENSUS)
      is the household-size target of the household stage (data records
      srv2023_absence_by_age_band / srv2023_absence_household_by_size). Both are a
      VALIDATION-ANCHORED DRAW REFERENCE, never a PopulationSim control target -- no synthesis or
      location stage's demand distribution is controlled to these shares.
validation:
  state: measured_vs_reference
  runs:
  - general-day-absence-arm0-100pct-2026-09-09
  - general-day-absence-arm1-100pct-2026-09-09
  metric: 'ADR-0110''s pre-registered A/B (Consequences section), arms 0 (OFF) and 1 (ON,
    two-stage = base default) run at 100 % on the cached arm-4 population on 2026-09-09; every
    number below is from the two run manifests. ALL FIVE BOUNDED ROWS MET in arm 1: (1) mobility
    rate 0.8378 against SrV at_home_zero 0.8437 = -0.59 pp (bound +/- 1.0; arm 0 on the same
    reporting-day view +3.82 pp); (2) absent share per age band within 0.10 pp of the committed
    band table in every band, 57,060 of 1,130,516 persons absent = 5.05 % against 4.98 %; (3)
    63.7 % of absent persons in a fully absent household against SrV 55.8 % (band 45-65 %, met
    at its upper end for the singles reason of row 6); (4) employed persons with a work trip on the
    ADR-0104 check-1 basis 0.6376 against 0.6511 = -1.35 pp (bound +/- 1.5; arm 0 +2.25), while on
    the plan-structure group_employed reference (0.6694) the model sits -3.34 pp -- both readings
    are in the manifest; (5) participation_* on at_home_only moved by at most 0.35 pp between arm
    0 and arm 1 (bound 0.5 pp; education +0.35, work -0.11, shop -0.10, leisure -0.02, escort
    +0.08, other -0.06). Row 6, REPORTED not targeted: realised absence by household size class
    7.61 / 5.85 / 3.15 / 3.76 / 3.13 % for sizes 1..5+, i.e. singles over- and size-3 households
    under-absent, the limitation ADR-0110 names and issue #388 (arm 3) addresses. Byte identity:
    the arm-0 trips.csv md5 equals the arm-4 trips.csv md5 (8a46d5ee...). Arm 2 (individual-only
    sensitivity) is recorded in its own manifest once complete.'
  note: 'measured_vs_reference, not behaviourally_validated: rows 1 and 2 are met BY CONSTRUCTION
    (the SrV band rates are the parameters of the draw), so they prove the wiring from the draw
    to the reporting-day view, not predictive power; rows 3, 4 and 5 are the ones the design could
    have missed. The SrV tables remain a VALIDATION-ANCHORED DRAW REFERENCE (committed evidence for
    the design), and the plan-structure comparison is a validation reference no synthesis stage
    reads. Per CLAUDE.md "convergence is not validation": nothing here says the absent persons
    are the RIGHT persons, only that their number, age composition and household clustering match
    the SrV and that the rest of the plan structure is unchanged on the universe where it should
    be.'
assessment:
  status: pending
  pending_reason: 'Arms 0 and 1 of the pre-registered A/B are measured and recorded (all five
    bounded rows met, see validation.metric); the sensitivity arm 2 (individual-only draw) and
    the owner''s verdict on keeping the two-stage draw as the default are outstanding, and arm 3
    (issue #388, residual only on households of size >= 2) is the announced follow-up for the
    per-size limitation. The record moves to reviewed once the owner has read the three
    manifests.'
notes: 'Composes with the commute_day_state feature (docs/registry/features/commute_day_state.yml),
  which carries a one-sentence pointer back to this record for the composition rule -- the rule
  itself lives ONCE, in braunschweig.synthesis.commute_day.plan_replacement.build_day_trips''s
  general_absence keyword, and in the contributor note docs/codebase/notes/day-absence-state.md.
  Decision record: ADR-0110 (general day absence as a two-stage state draw) -- it carries the SrV
  evidence tables, the rejected alternatives (MiD P_STREISE as a donor, an individual-only default,
  raising the trip_class immobility target, per-Kreis rates) and the named assumptions this record
  does not repeat.'
