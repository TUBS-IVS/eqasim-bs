evidence:
  tests:
  - tests/test_overnight_open_end.py
  - tests/test_popsim_trips.py
  - tests/test_popsim_trips_stage.py
  - tests/test_popsim_plan_validation.py
  - tests/test_trip_class_seed_closure.py
  - tests/test_commute_day_donor_pool.py
  - tests/test_plan_structure_vs_srv.py
  off_path_byte_identical:
    claimed: 'true'
    test: tests/test_popsim_trips_stage.py::test_keep_overnight_open_ends_off_is_byte_identical
    note: >-
      A frame-level check on a hand-made fixture; the seed half is pinned by the neighbouring tests of
      tests/test_trip_class_seed_closure.py. Not a comparison of two runs: no switch-off run exists (see the manifest).
  fallback_rate:
    instrumented: true
    log_marker: '[popsim.overnight_open_end]'
    note: >-
      The decision logs its rates over the open-end MiD diaries (kept open by own flag and by inheritance, closed, of
      which middle days, of which no usable answer, of which children without a flagged household member), and
      trips_stage logs the share of persons kept open next to the closure share. A missing or unusable answer closes
      the day and is counted, never silent. Open ends in the study area are located by the existing chain-solver
      fallback, which reports its own rates.
  reference:
    kind: committed
    path: eqasim-data/data/braunschweig/srv/srv2023_plan_structure_reference.csv
    note: share_mobile_last_to_home (SrV open-end share); the bound of SrV +/- 1 pp is an ASSUMPTION registered before the run.
validation:
  state: measured_vs_reference
  runs:
  - i694-overnight-open-end-smoke-1pct-2026-11-27
  metric: share_mobile_last_to_home
  note: >-
    A 1 % smoke measurement, not a validation: the registered metric is inside the registered bound (numbers and every
    caveat in the run manifest). No switch-off arm, no 100 % replay, one seed.
assessment:
  status: pending
  by: null
  date: null
  pending_reason: >-
    The effect against today's closure share and the chain-solver tail count are unmeasured (no switch-off arm); the
    next production run measures them. The owner has not assessed the 1 % evidence.
  source: ADR-0214
notes: >-
  Toggling the key changes the trip stage and everything downstream; the stage cache recomputes once. The consistency
  rule of drop_leading_arrive_home_leg (ADR-0108) applies: every reader of the key must agree.
