feature: overnight_open_day_end
title: Overnight travellers keep their day open instead of an invented return home (#694)
area: behavior
description: >-
  With the switch on, a synthetic person whose MiD diary ends away from home and who answered that the reporting day
  was a trip with an overnight stay (MiD P_STREISE 2 or 3; children under 14 inherit the answer from their MiD
  household) keeps the open end: no return-home trip is appended and the plan validator does not treat the missing
  home end as an error. Middle days of a trip (diary starts away, first leg not home) and codes without a usable
  answer stay closed (counted and logged). The decision is made once per MiD diary owner in
  braunschweig.popsim.overnight_open_end, carried as the per-row column keeps_open_end of every trip chain (so a
  resampled or commute-day donor chain carries its own donor's decision) and read by the trip_class seed, which
  counts the closure (+1) only for the days that are closed. The last activity of an open day has no end time. Far
  stays keep ending outside by ADR-0183. Meaning, rejected options (B: SrV-fitted draw, C: late arrival) and
  consequences: ADR-0214, which amends ADR-0108 for these persons. The ENTD source rejects the switch ON.
stages:
- synthesis.population.trips
- braunschweig.popsim.completed_donor
- braunschweig.synthesis.commute_day.home_office_donors_stage
- braunschweig.analysis.synthesis.plan_structure_vs_srv
pipelines:
  popsim_mid: active
  popsim_open: not_used
  simple_ipf_open: not_used
lifecycle: active
production:
  enabled: true
  flags:
  - braunschweig.population.popsim.keep_overnight_open_ends
introduced:
  issue: '#694'
  pr: null
  adr: ADR-0214
detail_doc: null
code_paths:
- braunschweig/popsim/overnight_open_end.py
- braunschweig/popsim/plan_validation.py
- braunschweig/popsim/trips.py
- braunschweig/popsim/trips_stage.py
- braunschweig/popsim/mid/participation.py
- braunschweig/popsim/mid/seed_loading.py
- braunschweig/popsim/stage/__init__.py
- braunschweig/popsim/stage/config_keys.py
- braunschweig/synthesis/commute_day/donor_pool.py
- braunschweig/synthesis/commute_day/home_office_donors_stage.py
