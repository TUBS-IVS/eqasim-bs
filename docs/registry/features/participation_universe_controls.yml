feature: participation_universe_controls
title: Participation controls conditional on their universe (#368)
area: attributes
description: >-
  Replaces the two all-persons SrV participation Kreis controls whose target was met by the
  WRONG persons with controls that are conditional on the universe they describe, and makes
  the diary plan match keep the employment boundary so the two axes cannot come from two
  different MiD respondents (issue #368, ADR-0109). Three parts. (1) work_by_employment:
  four MECE cells (employed_work / employed_nowork / nonemployed_work / nonemployed_nowork)
  over persons 14+, where "employed" reads the P_BKAT-based employment_status classes
  (attributes.EMPLOYED_EMPLOYMENT_STATUS_CLASSES, in_ausbildung INCLUDED, decision Q5) and
  "work" is the realised plan source having a DIRECTLY recorded (W_RBW == 0) leg with
  W_ZWECK in {1, 2} -- never an imputed flag, so a kept-immobile MiD 803 source is nowork by
  construction. Its committed target is the employed MARGIN of the blended
  target2026_employment_status_by_kreis.csv times the SrV conditional work-trip rates, so
  this control and the employment_status control agree on the margin by construction
  (decision Q1). (2) education_0_5 / education_6_17 / education_18plus: three 2-cell
  (edu / noedu) controls on AGE-RANGE universes behind one toggle, each MECE within its band
  and each band total summed exactly from the census single-year cell columns, so no external
  age margin is committed (decision Q2); the seed reads the same map_purpose the trip builder
  uses, so a passive-escort education leg cannot be education in the plan and non-education in
  the seed. (3) diary_match_hard_employment: weekend_plan_match.match_person gained a
  keyword-only hard_keys (default empty, so the weekend caller is byte-identical) and the
  diary match passes {"employed"}, with surviving crossings counted and logged as a rate
  (decision Q6). All targets are built on ONE universe rule -- the SrV persons who were at
  home or mobile on the reporting day (at_home_only), the away-from-home persons being outside
  every target denominator because a synthetic population has no such state.
stages:
- data.census.filtered
- braunschweig.popsim.completed_donor
pipelines:
  popsim_mid: active
  popsim_open: inactive
  simple_ipf_open: not_used
lifecycle: active
production:
  enabled: true
  flags:
  - braunschweig.population.popsim.work_by_employment_kreis_control
  - braunschweig.population.popsim.education_by_age_kreis_control
  - braunschweig.population.popsim.diary_match_hard_employment
introduced:
  issue: '#368'
  pr: null
  adr: ADR-0109
code_paths:
- braunschweig/popsim/kreis_attribute_control.py
- braunschweig/popsim/mid/participation.py
- braunschweig/popsim/mid/seed_loading.py
- braunschweig/popsim/stage/
- braunschweig/popsim/control_spec.py
- braunschweig/popsim/diary_plan_match.py
- braunschweig/popsim/weekend_plan_match.py
- braunschweig/calibration/srv_participation_universe.py
- braunschweig/analysis/population_validation/participation_fit.py
