feature: verbindungen_anchor
title: Inner VerBindungen calibration anchor (#193)
area: work
description: Anchors the inner (within-ZGB) work-OD calibration on the VerBindungen 2019 sub-Kreis
  commuter matrix in addition to the BA Pendleratlas Kreis anchor (#193; default ON by ADR-0068
  human override of the pre-registered gate).
stages:
- data.od.weighted
- braunschweig.data.verbindungen.work_od
pipelines:
  popsim_mid: active
  popsim_open: active
  simple_ipf_open: active
lifecycle: active
production:
  enabled: true
  flags:
  - braunschweig.gravity.verbindungen_anchor_enabled
introduced:
  issue: '#193'
  pr: '#197'
  adr: ADR-0068
detail_doc: docs/features/gravity.md
code_paths:
- braunschweig/gravity/verbindungen_anchor.py
- braunschweig/gravity/model.py
evidence:
  tests:
  - tests/test_verbindungen_anchor.py
  off_path_byte_identical:
    claimed: 'true'
    test: tests/test_verbindungen_anchor.py
    note: test_apply_inner_anchor_idempotent_and_off_identity confirms the OFF/idempotent path
      is unchanged.
  fallback_rate:
    instrumented: false
    note: |
      Shares the same fallback-transparency instrumentation family as verbindungen_od_validation.py (imports margin_check from it), but no single marker was pinned to an exact verified line in this pass.
  reference:
    kind: committed
    path: eqasim-data/data/braunschweig/mid/mid2023_P13_commute_distance_by_rs7.csv
    note: |
      Also draws on the committed mid2023_P38_2_commute_distance_by_kreis.csv. The VerBindungen QZM "fit reference once ON" is NOT committed (same local raw-data gap as ADR-0068 notes).
validation:
  state: measured_vs_reference
  runs:
  - anchor-holdout-2026-07-17
  metric: labelled-fit TVD 0.1136 -> 0.0809; P13-by-RS7 EMD improves 5/6 classes (class 72 flagged);
    holdout gate verdict default_flip_supported=False
  note: Pre-registered k-fold holdout vs VerBindungen QZM + MiD P13/P38.2; ADR-0068 records the
    human override that set the default ON despite the neutral gate.
assessment:
  status: pending
  by: null
  date: null
  pending_reason: |
    ADR-0068 explicitly records this as a HUMAN OVERRIDE of the pre-registered gate -- default ON despite the gate not formally passing. This is exactly the kind of judgement call this register exists to surface; the owner's reasoning is in ADR-0068 but has not been restated as a register assessment.
  source: ADR-0068
