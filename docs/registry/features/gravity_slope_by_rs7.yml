feature: gravity_slope_by_rs7
title: Per-RS7 gravity slope
area: work
description: Differentiates the gravity distance-decay slope by the origin's RegioStaR-7 class
  (urban vs rural), flow-weighted mean equal to the scalar slope (ADR-0023).
stages:
- data.od.weighted
pipelines:
  popsim_mid: active
  popsim_open: active
  simple_ipf_open: active
lifecycle: active
production:
  enabled: true
  flags:
  - gravity_slope_by_regiostar7
introduced:
  issue: null
  pr: null
  adr: ADR-0023
detail_doc: docs/features/gravity.md
code_paths:
- braunschweig/gravity/base.py
- braunschweig/gravity/od.py
- braunschweig/gravity/balancing.py
- braunschweig/gravity/model.py
evidence:
  tests:
  - tests/test_gravity_ring_calibration.py
  - tests/test_gravity_slope_config.py
  - tests/test_gravity_model_core.py
  off_path_byte_identical:
    claimed: not_applicable
    note: |
      This is a dict-keyed override on top of the baseline scalar slope, not a boolean flag; no dedicated ON/OFF byte-identity test exists (unmapped RS7 falls back to the scalar, which is the tested behaviour, see fallback_rate below).
  fallback_rate:
    instrumented: true
    log_marker: 'per-RegioStaR slope:'
    note: |
      Logs a primary(per-RS7 override)-vs-fallback(scalar default) rate over origins, with a warning escalation above a configured threshold.
  reference:
    kind: none
    note: |
      The BA Pendler Poisson GLM was fitted offline from the same uncommitted BA Pendleratlas as gravity_od.yml; the fitted per-RS7 slope values are pinned directly into config YAML (per ADR-0023), not shipped as a separate data file.
validation:
  state: unvalidated
  runs: []
  metric: null
  note: No scalar KPI currently attributed to a recorded run.
assessment:
  status: pending
  by: null
  date: null
  pending_reason: |
    ADR-0023 documents the design; no owner verdict on realised per-RS7 fit quality has been recorded.
  source: ADR-0023
