feature: freight_boundary_links
title: Freight boundary endpoints linked by capacity and trip direction
area: freight
description: 'Every freight endpoint on the study-area boundary (the start of incoming and transit trips,
  the end of outgoing and transit trips) gets an explicit link: the closest car link of at least
  1,000 veh/h, by perpendicular distance, that heads in the trip direction, within 300 m. This replaces
  MATSim''s nearest-node snapping, which put the A2-west entries on a 600 veh/h residential street
  (issue #444, ADR-0144).'
stages:
- matsim.simulation.prepare
pipelines:
  popsim_mid: active
  popsim_open: inactive
  simple_ipf_open: inactive
lifecycle: active
production:
  enabled: true
  flags:
  - freight_enabled
introduced:
  issue: '#444'
  pr: null
  adr: ADR-0144
detail_doc: docs/features/freight.md
code_paths:
- braunschweig/matsim/simulation/prepare.py
- scripts/measure_freight_boundary_links.py
evidence:
  tests:
  - tests/test_freight_injection_wiring.py
  - tests/test_measure_freight_boundary_links.py
  off_path_byte_identical:
    claimed: not_applicable
    note: |
      There is no OFF switch: the rule always applies when freight_enabled is true. With freight_enabled false the injection, and with it this rule, does not run. The Java side (eqasim-java-bs FreightBoundaryLinkSelectorTest, RunInjectFreightBoundaryLinkTest) is tested in its own repository.
  fallback_rate:
    instrumented: true
    log_marker: '[freight.injection] boundary links: selected'
    note: |
      RunInjectFreight logs selected vs nearest-node fallback endpoints per role (start/end), writes them to freight_boundary_link_summary.csv in the prepare stage directory (printed by _inject_freight), and fails above freight_boundary_link_maximum_fallback_share (0.05). Measured on prod100_20260925 with the same rule: 0.05 % fallback at 300 m (run freight-boundary-links-prod100-2026-10-15). In the pipeline, 1 % smoke: selected 725 / 725, fallback 0 (run freight-boundary-links-ab-1pct-2026-10-16).
  reference:
    kind: none
    note: |
      No observed reference applies. The rule is a network-assignment correction. Its parameters (1,000 veh/h, 300 m) are measured on the 100 % network (smallest swept distance at the fallback floor; every selected link has >= 1,500 veh/h), not calibrated against data.
validation:
  state: unvalidated
  runs:
  - freight-boundary-links-prod100-2026-10-15
  - freight-boundary-links-ab-1pct-2026-10-16
  - freight-junction-west-a2-prod100-2026-10-16
  - freight-a2-east-turnaround-prod100-2026-10-23
  metric: null
  note: |
    freight-boundary-links-prod100-2026-10-15 diagnoses the old snapping and sweeps the new rule on the 100 % network. freight-boundary-links-ab-1pct-2026-10-16 is a 1 % ON/OFF smoke at MATSim iteration 0 (same population, freight sample and seed): stuck trucks 98 -> 30, on residential link 501844 51 -> 0, freight plans starting on 501844 100 -> 0. That is a simulated effect in one draw, not a validation; no observed reference is compared. 27 of the 30 remaining stuck trucks sit on the motorway_link pair 182357 / 18416, unchanged against OFF (an open finding of that run, not caused by this rule). freight-junction-west-a2-prod100-2026-10-16 traces the 356 trucks stuck at the junction 2 km west of the A2-west gate in the 100 % run before the rule (#460): every one has an old-snapping endpoint (277 end on the eastbound 199731 and U-turn there, 79 start on 501844); a 100 % run with the rule is still needed to confirm the cluster is gone. freight-a2-east-turnaround-prod100-2026-10-23 traces the up to 16 h delays at the A2-east portal (450785, outside_35) and on 38954 / 647288 upstream in the same run before the rule (#465): 11,512 trucks start on the outward carriageway 450785 and U-turn through a one-lane ramp loop at the network end that is saturated at 1,500 PCE/h from 4 h to 27 h; with insertion priority the waiting departures starve the first eastbound vehicle for 16 h, and every arrival behind it (11,396 persons ending at outside_35) waits. The 1 % rerun with the rule has no truck departure on 450785; a 100 % run is still needed. The same record finds that the #442 gate facilities of persons and in-commuters are still nearest-node snapped (all 8 motorway gates off the motorway), which this rule does not cover.
assessment:
  status: pending
  by: null
  date: null
  pending_reason: |
    Fix implemented, measured statically on the 100 % network and shown in a 1 % iteration-0 smoke (freight-boundary-links-ab-1pct-2026-10-16). No review of the feature yet, and no multi-iteration or 100 % simulation with the rule.
  source: ADR-0144
