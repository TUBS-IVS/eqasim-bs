feature: joint_age_size_margin
title: Joint age×size margin (#3)
area: population
description: Joint age x household-size IPF margin from Zensus 1000A-3082 preventing implausible
  combinations such as children in single-person households (ADR-0004).
stages:
- braunschweig.ipf.prepare
pipelines:
  popsim_mid: not_used
  popsim_open: not_used
  simple_ipf_open: active
lifecycle: supported
production:
  enabled: false
  flags:
  - braunschweig.ipf.use_joint_age_size_margin
introduced:
  issue: null
  pr: null
  adr: ADR-0004
detail_doc: docs/features/household-synthesis.md
code_paths:
- braunschweig/ipf/joint_age_size.py
- braunschweig/ipf/prepare.py
evidence:
  tests:
  - tests/test_joint_age_size.py
  off_path_byte_identical:
    claimed: not_applicable
    note: No dedicated byte-identity test name found; OFF-path coverage is via feasibility tests.
  fallback_rate:
    instrumented: false
    note: |
      A skip-count warning exists for Kreise with a zero row/column total (braunschweig/ipf/joint_age_size.py), but it is a skip count, not a primary/fallback rate percentage.
  reference:
    kind: none
    note: |
      No observed validation reference exists for this feature. The margin's INPUT,
      eqasim-data/data/braunschweig/1000A-3082_de_flat.zip (Zensus 2022, 58.6 MB), is
      present locally but gitignored, so it is not a committed reference either.
      (An earlier note recorded it as "absent from disk"; that is no longer true --
      the file is in place and braunschweig.data.census.households_size_age loads it,
      194,148 cells across 10,786 communes.)
validation:
  state: unvalidated
  runs: []
  metric: null
  note: No scalar KPI currently attributed to a recorded run.
assessment:
  status: pending
  by: null
  date: null
  pending_reason: |
    Issue #251's config discrepancy is RESOLVED: braunschweig.ipf.use_joint_age_size_margin
    is now true in all four committed simple_ipf_open run configs, and the margin was
    proven to execute on real data (SK Braunschweig, 1000A-3082: 36 joint cells raked to
    252,962 persons; post-IPF max relative deviation 0.5698%, so the extra margin does not
    make the IPF infeasible). What remains pending is SCIENTIFIC assessment, not wiring:
    no recorded run has compared the resulting age x household-size structure to an
    observed reference, so validation.state stays 'unvalidated'. The flag is correctly
    absent from the popsim_mid/popsim_open configs -- the IPF is not the production
    population method, so the key would be dead there.
  source: ADR-0004
notes: 'Issue #251 / ADR-0078: enabled in the four simple_ipf_open run configs and pinned
  by tests/test_ipf_config_parity.py. Not applicable to the production popsim_mid path.'
