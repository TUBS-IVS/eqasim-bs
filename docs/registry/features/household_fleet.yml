  flags:
  - vehicles_method
introduced:
  issue: null
  pr: null
  adr: ADR-0019
detail_doc: null
code_paths:
- braunschweig/synthesis/vehicles/cars/household.py
evidence:
  tests:
  - tests/test_vehicles_per_household.py
  off_path_byte_identical:
    claimed: 'true'
    test: tests/test_vehicles_per_household.py
    note: |
      test_default_method_is_legacy_byte_identical confirms vehicles_method:"default" reproduces the legacy one-car-per-person frame byte-identically via legacy_one_car_per_person().
