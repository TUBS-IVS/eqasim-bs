  metric: null
  note: No scalar KPI currently attributed to a recorded run.
assessment:
  status: pending
  by: null
  date: null
  pending_reason: |
    ADR-0015 documents the design (Codeplan-B1 crosswalk). docs/features/regional-control-targets.md exists but documents a different (5-entry economic_status/cars/bicycles/ebike/trip_class) registry, not this Tier-3 mechanism -- the detail_doc does not actually cover this feature, so it is omitted from this declaration rather than pointed at the wrong doc. No owner verdict on realised Tier-3 fit has been recorded.
  source: ADR-0015
