  flags:
  - braunschweig.population.popsim.control_tiers
introduced:
  issue: null
  pr: null
  adr: ADR-0015
detail_doc: null
code_paths:
- braunschweig/popsim/control_spec.py
evidence:
  tests:
  - tests/test_popsim_tier3_controls.py
  - tests/test_popsim_validation_tier3.py
  - tests/test_control_spec_catalog.py
  off_path_byte_identical:
    claimed: not_applicable
    note: control_tiers is a list-valued config key (tier0..tier3), not a boolean toggle.
  fallback_rate:
    instrumented: false
    note: |
      No rate-style fallback log found; missing kreis_controls data raises FileNotFoundError/ ValueError (fail-fast), not a silent fallback with a rate to log.
