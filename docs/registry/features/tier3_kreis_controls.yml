feature: tier3_kreis_controls
title: Tier-3 Kreis controls
area: attributes
description: Adds the Kreis-level Tier-3 PopulationSim controls (employment, school and vocational
  degrees from cleancensus Kreis tables) on top of the grid controls (ADR-0015).
