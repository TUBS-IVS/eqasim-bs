    kind: committed
    path: eqasim-data/data/braunschweig/popsim/zensus2022_employment_by_age_ref.csv
    note: |
      The Tier-3/employment-grid kreis_controls directory itself (braunschweig.population.popsim.kreis_controls_dir) is explicitly gitignored and absent from this checkout; only this companion employment-by-age reference file is committed.
validation:
