feature: carless_routing_remode
title: Carless routing re-mode
area: matsim
description: Re-modes car legs of persons whose household ends up without a vehicle so plans stay
  consistent with the synthesized fleet (ADR-0022).
stages:
- matsim.scenario.population
pipelines:
  popsim_mid: active
  popsim_open: active
  simple_ipf_open: supported
lifecycle: active
production:
  enabled: true
  flags:
  - remode_carless_car_legs
introduced:
  issue: null
  pr: null
  adr: ADR-0022
detail_doc: null
code_paths:
- matsim/scenario/population.py
evidence:
  tests:
  - tests/test_population_income_attribute.py
  off_path_byte_identical:
    claimed: not_applicable
    note: |
      remode_carless_car_legs is true in configs/base_bs.yml; no OFF-path byte-identity test is declared. tests/test_population_income_attribute.py:118 checks the flag-off case has no re-mode effect, which is a functional check, not a full byte-identity test.
  fallback_rate:
    instrumented: false
    note: |
      No fallback-rate log found for the re-mode branch (the carless car-leg branch in matsim/scenario/population.py's add_person) -- it silently re-modes without counting how many legs were affected. Gap flagged per CLAUDE.md fallback-transparency.
  reference:
    kind: none
    note: The feature enforces routing/fleet consistency; no external reference applies.
validation:
  state: unvalidated
  runs: []
  metric: null
  note: No KPI applies to this consistency fix.
assessment:
  status: pending
  by: null
  date: null
  pending_reason: |
    ADR-0022 documents the design decision. The file-path discrepancy this record reported is FIXED (issue #254, 2026-08-17): ADR-0022's Decision text now names matsim/scenario/population.py and points at the enclosing symbols (registered in configure, forwarded by write_population, applied in add_person) rather than matsim/simulation/prepare.py, which contains no remode/carless logic. The other cited source, PROJECT_STATUS.md, was retired to a pointer stub by ADR-0077.
    STILL PENDING: no owner verdict on realised re-mode coverage, and the fallback-rate gap noted above is unaddressed -- the branch does not count how many legs it re-modes.
  source: ADR-0022
