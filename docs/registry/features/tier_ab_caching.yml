feature: tier_ab_caching
title: Tier-A/B caching (32 stages + popsim)
area: infrastructure
description: Fixed shared popsim work_dir plus the verified Tier-A/B sampling-independent stage
  set, so PopulationSim batches and 32 upstream stages are reused across sampling rates (ADR-0037).
stages: []
pipelines:
  popsim_mid: active
  popsim_open: supported
  simple_ipf_open: supported
lifecycle: active
production:
  enabled: true
  flags:
  - braunschweig.population.popsim.work_dir
introduced:
  issue: null
  pr: null
  adr: ADR-0037
detail_doc: docs/features/cache-share.md
code_paths:
- braunschweig/popsim/stage/
evidence:
  tests:
  - tests/test_allfeat_caching_config.py
  - tests/test_popsim_work_dir_guard.py
  - tests/test_configs_composed.py
  - tests/test_synpp_fork_early_cutoff.py
  - tests/test_cache_share_synpp.py
  off_path_byte_identical:
    claimed: not_applicable
    note: A fixed shared work_dir changes cache reuse, not the stage outputs themselves.
  fallback_rate:
    instrumented: false
    note: |
      No primary-vs-fallback rate log exists for the caching mechanism itself (synpp's own hash-validation handles hit/miss silently). The closest instrumented log is the stale-batch guard (braunschweig/popsim/stage/), which logs how many stale batch folders were purged when the popsim config changed -- a safety guard, not a fallback rate.
  reference:
    kind: none
    note: Infrastructure feature (stage caching); no external reference applies.
validation:
  state: unvalidated
  runs:
  - cache-migration-100pct-2026-10-22
  - content-addressed-cache-acceptance-100pct-2026-10-22
  metric: null
  note: >
    No KPI applies to a caching mechanism. Since ADR-0149 (Phase 4 of #468) the vendored synpp
    fork keeps a child cached when its re-executed parent reproduces the same output hash
    (tests/test_synpp_fork_early_cutoff.py) and a primed Tier-A/B entry is judged by output hash
    (tests/test_cache_share_synpp.py, test_prime_from_another_run_is_a_hit_when_output_hashes_match).
    Both are synthetic mechanics tests; the server acceptance on a copy of the 100 % cache ran on 2026-10-22
    (a smoke, not a validation): cache-migration-100pct-2026-10-22, content-addressed-cache-acceptance-100pct-2026-10-22.
assessment:
  status: pending
  by: null
  date: null
  pending_reason: |
    The Phase 4 cache validity change of ADR-0149 is tested synthetically and smoke-tested on a copy of the 100 % cache (cache-migration-100pct-2026-10-22, content-addressed-cache-acceptance-100pct-2026-10-22); no owner verdict on realised cache-hit reliability exists.
    ADR-0037 records this feature's status as "config wiring partial" (backlog [1.3]); the base config now enumerates a populated cache_share_stages list, which may mean the backlog item is stale -- worth a fresh check before this row is marked fully "on" without caveats.
  source: ADR-0037
