evidence:
  tests:
  - tests/test_outside_tour_modes_config_keys.py
  - tests/test_outside_tour_modes_rule.py
  - tests/test_outside_tour_modes_srv_table.py
  - tests/test_outside_tour_modes_stage.py
  - tests/test_outside_tour_modes_tours.py
  - tests/test_outside_tour_modes_wiring.py
  - tests/test_outside_tour_pt_connections.py
  - tests/test_srv_mode_by_distance_band.py
  - tests/test_srv_mode_by_distance_band_pins.py
  off_path_byte_identical:
    claimed: 'true'
    test: >-
      tests/test_outside_tour_modes_stage.py::test_execute_off_passes_the_frame_through_without_counters_or_warnings;
      tests/test_outside_tour_modes_wiring.py::test_every_fixture_aliases_the_simulated_trips_to_its_final_target_and_disables_the_flag.
    note: >-
      braunschweig.outside_tour_modes.enabled defaults true in configs/base_bs.yml. The OFF claim is pinned at
      the stage (the input frame is returned as is, no counters, no warning) and at the configs (every fixture
      aliases the simulated alias to its own trips.final target and sets the flag false). A whole-pipeline OFF
      run against the pre-feature state is not recorded, and a stage-level pass-through is not an end-to-end
      proof.
  fallback_rate:
    instrumented: true
    log_marker: '[outside_tour_modes]'
    note: >-
      The stage logs, as rates and in its report, the outside tours re-moded out of all outside tours (WARNING
      above braunschweig.outside_tour_modes.warn_share), the legs re-moded and swept along, the substitution
      matrix, the cells used, the draws restricted by the person's availability and the modes removed, the
      draws relaxed to the longest leg's cell (count and share), the outside legs still implausible after the
      draw (WARNING when above zero), the portal tours re-moded and class-restricted, the presence of the
      portal_leg column, the portal tours left unchanged by reason (WARNING) and the donor modes unknown to
      the table (WARNING). It raises on a person without an
      availability row, on a leg without a realised location, on a CRS mismatch, on a table cell where neither
      pt nor walk is plausible, on a draw with no candidate for a tour without portal leg (also after the
      relaxation) and on a categorical mode column, instead of falling back; a portal tour without an
      admissible mode keeps its donor modes and is counted.
      The report is also written as outside_tour_modes_report.json in the stage's cache directory.
      Timetable check (ADR-0159), tagged [outside_tour_modes.pt_connections] and under pt_connection in the
      report: the checked tours and probed legs, per action connection_found (primary), tour_shifted,
      tour_to_car, tour_to_car_passenger, tour_to_car_passenger_lift and kept_no_connection with rates and the
      median shift; WARNING when a tour is kept or the switched, lifted and kept tours exceed
      braunschweig.outside_tour_modes.pt_no_connection_warn_share. Road-gate portal tours lifted for want of an
      admissible mode: n_portal_tours_lifted (WARNING when above zero). The batch router logs its own
      connection and no-route rates ([pt-router]).
  reference:
    kind: committed
    path: eqasim-data/data/braunschweig/srv/srv2023_mode_by_distance_band.csv
    note: >-
      The SrV 2023 mode-share table (data record srv2023_mode_by_distance_band): Zensus-weighted, GIS-routed
      lengths divided by 1.3 for the straight-line equivalent, regional (no Kreis rows). It is the reference
      the rule judges modes against, not a validation target of the model output; its limitations are in the
      data record.
validation:
  state: unvalidated
  runs:
  - i453-i443-ab-1pct-2026-10-16
  metric: null
  note: >-
    A/B direction only (run i453-i443-ab-1pct-2026-10-16: 1 % sample, MATSim iterations until the eqasim termination criterion,
    one seed and one draw per arm, flag off versus on at the same commit, no observed reference compared, so not a
    validation). Measured off -> on in the frozen tours of the final iteration: walk trips over 5 km 168 -> 63,
    bicycle trips over 30 km 47 -> 1, trips over 3 h 293 -> 164, walk trips 388 -> 290, bicycle trips 146 -> 26,
    car share 66.41 % -> 69.58 %; in-region metrics unchanged. Stage report: 136 of 891 outside tours re-moded
    (15.26 %), 0 draws relaxed, 5 outside legs still implausible after the draw, 2 portal tours left unchanged.
    63 walk trips over 5 km (22 over 20 km) remain in frozen tours with the flag on; the run does not determine
    their cause. min_share and warn_share remain assumptions; the stabilised mode shares are convergence, not
    agreement with observed behaviour.
assessment:
  status: pending
  by: null
  date: null
  pending_reason: >-
    Implemented and unit-tested; the 1 % A/B run i453-i443-ab-1pct-2026-10-16 measured the direction (not a validation). The
    whole-feature assessment has not been done. min_share (0.01) and warn_share (0.5) remain ASSUMPTIONS of
    ADR-0145 (eqasim-bs#453).
  source: ADR-0145
notes: >-
  The feature changes results by design when enabled: the alias switch recomputes the stage behind it,
  matsim.scenario.population, synthesis.output and everything downstream once. Not in scope: the plan
  feasibility check and the 30 h bound (#443). The portal feature (portal_trips) is its upstream neighbour: a
  portal stay's legs are judged here in the group all at the top band and may be re-moded, see its record.
  Config invariant: any config that aliases synthesis.population.trips.final must also alias
  synthesis.population.trips.simulated to the same target and set braunschweig.outside_tour_modes.enabled false
  (the fixtures do; tests/test_outside_tour_modes_wiring.py). Since ADR-0159 the same holds for
  synthesis.population.activities.simulated and synthesis.population.activities.final. The timetable check
  (ADR-0159) is not measured yet; the next 1 % rerun of the #465 fixes is the first run with it.
