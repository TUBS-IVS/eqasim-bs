  - braunschweig.outside_tour_modes.min_share
  - braunschweig.outside_tour_modes.warn_share
  - braunschweig.outside_tour_modes.pt_connection_check.enabled
  - braunschweig.outside_tour_modes.pt_shift_window_s
  - braunschweig.outside_tour_modes.pt_shift_step_s
  - braunschweig.outside_tour_modes.pt_no_connection_warn_share
  - braunschweig.outside_tour_modes.last_resort
introduced:
