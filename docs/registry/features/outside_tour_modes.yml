feature: outside_tour_modes
title: Outside-tour modes judged against the regional survey
area: cordon
description: >-
  The production discrete mode choice keeps the diary mode of every tour that touches an outside activity
  for the whole run (OutsideFilter), so the mode a donor reported at some distance survives even where the
  realised distance makes it implausible for the region. After the location choice this feature judges the
  mode of each such tour against the SrV 2023 mode shares by straight-line distance band and purpose group
  (data record srv2023_mode_by_distance_band) at the realised leg distance, and re-modes the whole tour
  where the survey share of the mode is below braunschweig.outside_tour_modes.min_share (ADR-0145, issue
  #453). One substitute per tour is drawn, seeded, among the modes the person may use that are plausible in
  the cell of every leg of the tour and keep the mode class of the tour's portal gate (pt at rail stations,
  other modes at road gates), weighted by the SrV shares of the cell of the tour's longest implausible leg,
  and applied to every leg of the tour so the tour keeps one mode. When no mode qualifies, plausibility is
  judged in the cell of the tour's longest leg only; the relaxation is counted and reported. A portal tour
  never aborts the run: with no admissible mode in its gate class, or with portal legs at both gate classes, it
  keeps its donor modes and is counted by reason. A leg touching an outside activity (a portal stay, ADR-0141) is judged in the purpose
  group all at the top band. The stage sits behind the alias synthesis.population.trips.simulated, which only
  the MATSim population writer and the synthesis output read; the chain solver keeps reading
  synthesis.population.trips.final. With the flag off the trips frame is returned unchanged. No Java change
  is part of the feature. The feature changes results by design when enabled.
  Since ADR-0159 (#465) the stage also checks every pt leg of an outside tour without a portal leg against the
  timetable (batch pt router on the pre-cut supply) and resolves a tour without a connection by moving it as a
  whole (earlier first, up to braunschweig.outside_tour_modes.pt_shift_window_s), then car, then a lift, and as
  the last resort (braunschweig.outside_tour_modes.last_resort car_passenger) a lift without the passenger
  availability; a road-gate portal tour without an admissible mode becomes such a lift too instead of keeping a
  walk or bicycle leg of tens of kilometres. The activities of the simulated day are rebuilt from the simulated
  trips (alias synthesis.population.activities.simulated) so a moved tour's times reach the plan.
stages:
- synthesis.population.trips.simulated
- synthesis.population.activities.simulated
- matsim.scenario.population
- synthesis.output
pipelines:
  popsim_mid: active
  popsim_open: not_used
  simple_ipf_open: not_used
lifecycle: active
