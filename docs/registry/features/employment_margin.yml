  pending_reason: |
    DISCREPANCY FOUND: braunschweig.ipf.use_employment_margin gates only an ADDITIONAL joint Kreis x hh_size x employed margin (TASK-010), which needs braunschweig.ipf.employment_by_hhsize_path -- a path that is never set in any committed config. With the flag ON but no path configured, braunschweig/ipf/model.py:631-650 silently falls back to an "outer-product proxy" (comment: "informative smoke test only; preserves marginals") instead of a real Zensus/GENESIS cross-tab, and this fallback is not logged at all. Separately, the BASE always-on employment margin (the one actually "raked to GENESIS SvB" per ADR-0014's title, unconditional, not gated by this flag) is a different mechanism entirely. The STATUS-matrix row and ADR-0014's title likely do not refer to the same mechanism as the flag they cite. docs/features/household-synthesis.md does not mention this flag at all. This needs owner attention before the row can be marked reliably "on".
  source: ADR-0014
