feature: pt_subscription_conditioned
title: PT subscription (P24.1, 3-margin IPF)
area: attributes
description: PT subscription type as a categorical 3-margin IPF on MiD P24.1 (Kreis x sex x age),
  optionally conditioned on car availability (ADR-0012). Legacy simple_ipf_open
  mechanism -- under popsim_mid attributes.map_pt_subscription_type derives the attribute
  from the donor's own P_FKARTE with RegioStaR7/age-conditioned imputation, WITHOUT a
  rake to the P24.1 margins (ADR-0079).
stages:
- synthesis.population.enriched
pipelines:
  popsim_mid: not_used
  popsim_open: not_used
  simple_ipf_open: active
lifecycle: active
production:
  enabled: false
  flags:
  - pt_subscription_conditioned
introduced:
  issue: null
  pr: null
  adr: ADR-0012
detail_doc: docs/features/mid-reference-tables.md
code_paths:
- braunschweig/synthesis/population/enriched/availability.py
evidence:
  tests:
  - tests/test_pt_subscription_conditioned.py
  off_path_byte_identical:
    claimed: not_applicable
    note: |
      No dedicated top-level flag-OFF byte-identity test was found (only a sub-mechanism absent-crosstab no-op test).
  fallback_rate:
    instrumented: true
    log_marker: '[braunschweig.enriched] WARNING: pt_subscription_conditioned'
    note: |
      Warns when a required column is missing (treated as all-False) and separately reports degenerate-row and car-margin primary/fallback counts.
  reference:
    kind: committed
    path: eqasim-data/data/braunschweig/mid/mid2023_P24_1.csv
    note: Also draws on the committed by-sex/by-age/by-car-availability P24.1 tables.
validation:
  state: unvalidated
  runs: []
  metric: null
  note: No scalar KPI currently attributed to a recorded run.
assessment:
  status: pending
  by: null
  date: null
  pending_reason: |
    Wiring decided in ADR-0079: not ported. Explicitly NOT settled: the realised
    regional subscription share is UNMEASURED, and the subscription enters
    BraunschweigPtCostModel (holders pay zero fare on every PT trip), which makes it
    the serious per-Kreis control candidate of this feature family. A regional target
    would first require extracting the full SrV E_OEV_FK category set -- the committed
    SrV aggregate covers only the Deutschlandticket, over a different universe (all
    persons vs. MiD's 14+), and is additionally distorted by the 2023-05 launch date.
  source: ADR-0079 (mechanism decision); ADR-0012 (original design)
notes: 'Issue #255 is resolved by ADR-0079: the legacy synthesis.population.enriched
  implementation never executes under either PopulationSim pipeline (the stage name is
  aliased to braunschweig.popsim.enriched_adapter), and it stays live under
  simple_ipf_open. This is NOT a missing attribute -- see description for the mechanism
  that runs in production.'
