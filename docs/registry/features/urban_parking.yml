feature: urban_parking
title: Urban parking (BS inner ring, legacy)
area: matsim
description: Marks inner-city Braunschweig residents so the Java mode choice applies parking cost
  inside the BS inner ring (ADR-0039). Superseded by parking_cost_zones (ADR-0139) and kept as legacy
  reproduction; mutually exclusive with parking_zones_enabled.
stages:
- matsim.scenario.population
pipelines:
  popsim_mid: inactive
  popsim_open: inactive
  simple_ipf_open: inactive
lifecycle: supported
production:
  enabled: false
  flags:
  - enable_urban_parking
introduced:
  issue: null
  pr: null
  adr: ADR-0039
detail_doc: null
code_paths:
- matsim/scenario/population.py
evidence:
  tests:
  - tests/test_configs_composed.py
  - tests/test_matsim_id_types.py
  - tests/test_population_income_attribute.py
  - tests/test_popsim_config_parity.py
  - tests/test_population_parking_attributes.py
  off_path_byte_identical:
    claimed: not_applicable
    note: No dedicated OFF-path byte-identity test found for this flag. The LEGACY plans (ring on, no zone
      columns) are pinned byte for byte to the writer before the zone-based parking costs by
      tests/test_population_parking_attributes.py::test_legacy_ring_frames_match_the_prechange_writer_bytes.
  fallback_rate:
    instrumented: false
    note: No fallback/primary logging pattern found near enable_urban_parking.
  reference:
    kind: none
    note: |
      Infrastructure/scenario feature scoped to the Braunschweig inner ring; no external reference applies. docs/codebase/CONCERNS.md flags a MEDIUM-severity "parking scenario parity" concern about enable_urban_parking differing between the base config and the fixtures; since issue #436 configs/base_bs.yml and both popsim fixture configurations (config_popsim_mid_braunschweig.yml, config_popsim_open_braunschweig.yml) set it false and run the zones (parking_cost_zones), so the base and those fixtures agree again.
validation:
  state: unvalidated
  runs: []
  metric: null
  note: No KPI applies to this scenario-preparation feature.
assessment:
  status: pending
  by: null
  date: null
  pending_reason: |
    ADR-0039 documents the design decision. The file-path discrepancy this record reported is FIXED (issue #254, 2026-08-17): ADR-0039's Decision text now names matsim/scenario/population.py and points at the enclosing symbols (registered in configure, forwarded by write_population, applied in add_person) rather than matsim/simulation/prepare.py, which contains no parking logic.
    SUPERSEDED by parking_cost_zones (ADR-0139), which is the canonical configuration's parking cost model; this record stays for the legacy reproduction (parking_zones_enabled false, enable_urban_parking true).
    The popsim fixture configs no longer keep the ring on: since issue #436 they run the zones like configs/base_bs.yml, and tests/test_popsim_config_parity.py pins the ring off there.
  source: ADR-0039
notes: >-
  superseded by parking_cost_zones (ADR-0139); kept as legacy reproduction. Lifecycle 'supported' is the
  closest allowed state to 'deprecated' (braunschweig.documentation.schema.LIFECYCLES has no deprecated
  value): the ring stays wired and usable but is no longer the configured default. No committed
  pipeline configuration enables it any more (inactive in all three pipelines since issue #436).
