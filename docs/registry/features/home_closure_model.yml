  - braunschweig.population.popsim.closure_dwell_min_obs
  - braunschweig.population.popsim.drop_leading_arrive_home_leg
  - braunschweig.population.popsim.trip_class_seed_counts_closure
introduced:
  issue: '#367'
  pr: null
  adr: ADR-0108
detail_doc: docs/codebase/notes/popsim-plan-source-resolution.md
code_paths:
- braunschweig/popsim/closure_dwell.py
- braunschweig/popsim/plan_validation.py
- braunschweig/popsim/trips.py
- braunschweig/popsim/trips_stage.py
- braunschweig/popsim/mid/participation.py
- braunschweig/popsim/mid/seed_loading.py
evidence:
  tests:
  - tests/test_closure_dwell.py
  - tests/test_popsim_trips_stage.py
  - tests/test_trip_class_seed_closure.py
  - tests/test_popsim_trips_rbw.py
  - tests/test_plan_structure_vs_srv.py
  off_path_byte_identical:
    claimed: 'true'
    test: tests/test_popsim_trips_stage.py::test_run_default_flags_off_is_byte_identical_to_previous_signature
    note: |
      Pinned against the PRE-#367 behaviour rather than against a second OFF run: the fixture
      chain ends AWAY from home, so a closure is actually synthesised and closure_dwell_model
      "fixed_1h" is actually drawn, and the test asserts the closure row's dwell equals the
      unchanged constant HOME_CLOSURE_DWELL_S (the earlier version of this test was vacuous
      because its fixture chain already ended at home -- review finding, fix round 1). What is
      byte-identical is precisely the fixed_1h / no-model path INCLUDING the absence of the
      plan-time cap, pinned near the bound by
      tests/test_popsim_plan_validation.py::test_repair_with_fixed_dwell_model_is_never_capped and
      ::test_repair_without_dwell_model_is_never_capped; the cap and its
      HOME_CLOSURE_DWELL_S floor are exercised on the empirical path by
      ::test_repair_caps_empirical_closure_dwell_at_plan_time_bound and
      ::test_repair_leaves_closure_uncapped_when_even_the_floor_breaches_the_bound. The seed
      half of the feature is pinned separately by
      tests/test_trip_class_seed_closure.py::test_counts_closure_off_is_previous_behaviour, and
      the arrive-home drop by
      tests/test_popsim_trips_rbw.py::test_drop_leading_arrive_home_leg_only_when_first_leg_arrives_home.
  fallback_rate:
    instrumented: true
    log_marker: '[popsim.plan_validation] closure dwell:'
    note: |
      The empirical dwell has a two-step fallback and both steps are counted and logged as rates:
      a (purpose, arrival band) cell with fewer than closure_dwell_min_obs (default 30)
      observations falls back to the purpose marginal, and that to a global marginal. A
      global-fallback rate above CLOSURE_GLOBAL_FALLBACK_WARN_RATE = 0.5 WARNS, because a majority
      hitting the global pool means the primary estimate is broken (an empty join, a wrong key)
      rather than merely thin. The cap that keeps a drawn dwell inside MAX_PLAN_TIME_SECONDS is
      counted too, together with the rows that could NOT be capped without breaching the
      HOME_CLOSURE_DWELL_S floor; that rate WARNS above CLOSURE_CAP_WARN_RATE = 0.05 and is INFO
      otherwise. The model
      build itself logs its pooled observation count under the second marker "[closure_dwell]",
      and trips_stage logs the share of persons and trips carrying a synthetic closure.
  reference:
    kind: committed
    path: eqasim-data/data/braunschweig/srv/srv2023_plan_structure_reference.csv
validation:
  state: measured_vs_reference
  runs:
  - plan-structure-fix-arm3-100pct-2026-09-07
  metric: share_work_activities_lt_2h
  note: >-
    MEASURED at 100 % (arm 3, run manifest plan-structure-fix-arm3-100pct-2026-09-07): closure trips 238,757 of 3,655,159
    (6.53 %; i329 7.3 %), 23.8 % of mobile persons closed; dwell draws 88.9 % from the
    (purpose, hour, duration-class) cell, 11.1 % purpose-marginal fallback, 0 global, 0.4 %
    capped. The fixed-1 h spike is gone (work activities before a closure: mean 4.66 h, 29 %
    < 2 h, contributing 0.9 pp of the 20.2 % short-work share). share_mobile_odd_trip_count
    0.2931 vs SrV 0.2325 (i329 0.34, inside the pre-registered 25-30 % band).
    share_trips_followed_by_same_purpose 0.1076 vs SrV 0.0453 did NOT reach the pre-registered
    < 6 %: the unique MiD donors themselves show 0.107 (leisure, other, work, education repeats
    at 14-16 % of each purpose's trips), so the gap is a survey-taxonomy difference, not a
    closure effect. Leading arrive-home legs dropped for 3,198 donors (1.07 %); 0 degenerate
    home->home first trips remain. Accepted deviations recorded by the stage: open-end 0 vs
    0.0224, open-start 0 vs 0.0219, single-trip days 0.0010 vs 0.0058.
assessment:
  status: pending
  by: null
  date: null
  pending_reason: |
    The empirical dwell distribution has only been exercised on synthetic fixtures; its cell
    occupancy, purpose-marginal fallback rate and cap rate on the real MiD Wege table are
    unmeasured, and so is the realised work-activity duration distribution. The accepted
    deviations are a recorded decision, not a finding, and stay open to challenge if a later
    project wants genuinely open days.
