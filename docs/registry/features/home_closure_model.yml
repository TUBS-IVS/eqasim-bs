feature: home_closure_model
title: Home-end closure with an observed dwell, counted in the seed (#367)
area: behavior
description: >-
  Makes the day-closing return-home trip realistic, visible and consistently counted, under the
  user's decision that MATSim plans in this project always start and end at home. Three parts, one
  feature: (1) the dwell before the appended return-home trip is DRAWN (seeded, random_seed +
  CLOSURE_SEED_OFFSET 74517) from the observed activity-duration distribution of the same purpose
  x arrival-hour band (ARRIVAL_BANDS_H (0, 14, 18, 20, 22, 48), five bands) in the directly closed
  MiD weekday chains, instead of the constant HOME_CLOSURE_DWELL_S = 3600 s that gave 65,761 work
  activities a duration of exactly 1.0 h. The pools are length-biased downward (they hold every
  activity FOLLOWED by another trip, which is never a genuine day-closing activity -- ADR-0108);
  the cell threshold is the config key closure_dwell_min_obs (default 30). closure_dwell_model
  "fixed_1h" reproduces the constant EXACTLY, including the absence of the plan-time cap: capping
  a drawn dwell at MAX_PLAN_TIME_SECONDS is an EMPIRICAL-path behaviour only (only a drawn dwell
  can exceed the bound where the constant would not), and even there the cap keeps a floor of
  HOME_CLOSURE_DWELL_S or leaves the row to the existing bound validation.
  (2) synthesised closure rows are MARKED (is_synthetic_closure, trip_key suffix _closure) so an
  invented trip is distinguishable from a reported one. (3) the trip_class PopulationSim seed
  counts the closed day (anzwege1 + 1 for a plan source whose last directly recorded non-rbW leg
  does not end at home, clipped at 50 to stay inside map_trip_class's value map), so seed, plan
  and SrV target count the same day. A leading leg that ARRIVES home (MiD W_SO1 == 2) is dropped
  rather than turned into a fabricated home->home first trip (18,231 of those in i329, 2.1% of
  persons). The consequences of the closed-plan decision -- 0% open-end days against SrV 2.24%,
  0% open-start days against 2.19%, 0% single-trip days against 0.69% -- are ACCEPTED deviations,
  reported as such by the analysis stage.
stages:
- synthesis.population.trips
- data.census.filtered
- braunschweig.analysis.synthesis.plan_structure_vs_srv
pipelines:
  popsim_mid: active
  popsim_open: inactive
  simple_ipf_open: not_used
lifecycle: active
