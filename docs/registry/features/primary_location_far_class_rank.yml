feature: primary_location_far_class_rank
title: Far primary locations assigned by rank
area: work
description: >-
  The sampled work (and, on the base education path, education) locations of an origin zone are handed to its
  persons in two classes (ADR-0164, #465). Locations farther than primary_location_far_class_min_distance_m
  (straight-line metres from the zone's mean home, default 30000) go by rank to the same number of persons with
  the longest donor commute distances; every other person takes the remaining locations with the upstream eqasim
  greedy on exact home distances, in input order. The sampled flows per origin zone are unchanged (a permutation
  inside the zone). A person without a donor distance takes the zone's median donor distance on this path
  (ASSUMPTION). Replaces the upstream greedy over the whole zone, which left far locations to whoever came last
  in the person order (person 343377 of the 1 % rerun, donor 0.38 km, got 168 km).
stages:
- synthesis.population.spatial.primary.locations
pipelines:
