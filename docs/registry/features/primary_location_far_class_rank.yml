  off_path_byte_identical:
    claimed: 'true'
    test: tests/test_primary_location_far_class_rank.py
    note: |
      test_legacy_greedy_order_is_kept_when_the_far_class_rank_is_off pins the upstream greedy result with the flag off; the measurement script additionally requires the flag-off assignment to reproduce a run's cached assignment for every worker.
  fallback_rate:
    instrumented: true
    log_marker: '[primary locations] %s (%s): %d persons, without donor distance'
    note: |
      No fallback in the assignment itself. The stage logs per purpose the persons without a donor distance (imputed by the zone median), the median and p90 of |assigned - donor| and the persons whose donor commute is below a tenth of the far-class distance but whose location lies beyond it (log_assignment_quality).
  reference:
    kind: none
    note: |
      The comparison target is the matched donor's survey commute distance, not an observed distance of the synthetic person; no observed reference is compared.
