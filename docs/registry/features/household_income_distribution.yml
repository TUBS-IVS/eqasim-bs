feature: household_income_distribution
title: Household income € + distribution
area: attributes
description: Draws household income in EUR from empirical MiD distributions with INKAR per-Kreis
  scaling (ADR-0017); under popsim_mid the donor's own MiD income plus placement_income carries
  this signal instead.
stages:
- synthesis.population.enriched
pipelines:
  popsim_mid: inactive
  popsim_open: inactive
  simple_ipf_open: active
lifecycle: active
production:
  enabled: false
  flags:
  - income_eur_from_distribution
introduced:
  issue: null
  pr: null
  adr: ADR-0017
detail_doc: docs/features/mid-reference-tables.md
code_paths:
- braunschweig/synthesis/population/enriched/income_distribution.py
evidence:
  tests:
  - tests/test_income_eur_distribution.py
  off_path_byte_identical:
    claimed: 'true'
    test: tests/test_income_eur_distribution.py
    note: test_off_equivalence_byte_identical confirms the OFF path is unchanged.
  fallback_rate:
    instrumented: true
    log_marker: 'distribution household_income_eur:'
    note: |
      Logs a primary-vs-fallback (size-only pmf + rank-alignment when the status cell / NDS base is absent) rate, plus a separate INKAR join-coverage warning.
  reference:
    kind: committed
    path: eqasim-data/data/braunschweig/mid/mid2023_H4_income_by_size.csv
    note: |
      Also draws on several further committed MiD income tables under the same directory. The INKAR fine-tilt input (braunschweig.inkar_household_income_path, braunschweig/E_Haushaltseinkommen.xls) is NOT committed.
validation:
  state: unvalidated
  runs: []
  metric: null
  note: No scalar KPI currently attributed to a recorded run.
assessment:
  status: pending
  by: null
  date: null
  pending_reason: |
    ADR-0017 is a combined ADR covering four flags at once (this one, cars_income_aware, consistent_car_availability, synthesise_housing_tenure) -- there is no ADR dedicated solely to this feature. Like economic_status_bayes.yml, this flag lives in synthesis/population/enriched.py and is dead under the active popsim_mid production method; it is only live via the simple_ipf_open fixture. docs/features/mid-reference-tables.md exists but has no dedicated section for this feature.
  source: ADR-0017
notes: 'Issue #255: this feature is implemented in the legacy synthesis.population.enriched stage,
  which both PopulationSim workflows alias to braunschweig.popsim.enriched_adapter -- it never
  executes under the production popsim_mid method and is live only under simple_ipf_open (committed
  25% fixture).'
