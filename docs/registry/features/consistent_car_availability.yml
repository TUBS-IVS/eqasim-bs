feature: consistent_car_availability
title: Consistent car_availability
area: attributes
description: Derives car_availability consistently from the MiD-P17.1 licence and the household
  vehicle count instead of sampling it independently (ADR-0017).
stages:
- synthesis.population.enriched
pipelines:
  popsim_mid: inactive
  popsim_open: inactive
  simple_ipf_open: active
lifecycle: active
production:
  enabled: false
  flags:
  - consistent_car_availability
introduced:
  issue: null
  pr: null
  adr: ADR-0017
detail_doc: docs/features/mid-reference-tables.md
code_paths:
- braunschweig/synthesis/population/enriched/availability.py
evidence:
  tests:
  - tests/test_car_availability_consistency.py
  - tests/test_cars_caravail_consistency.py
  off_path_byte_identical:
    claimed: 'true'
    test: tests/test_cars_caravail_consistency.py
    note: test_non_on_on_combos_byte_identical_to_legacy_order confirms the OFF combination matches
      legacy ordering.
  fallback_rate:
    instrumented: true
    log_marker: car_availability P19 rake fallback
    note: |
      Logs a per-zone fallback rate when the P19 "jederzeit" target is unreachable after the carless/licence floor (test_fallback_logged_when_target_unreachable confirms this is tested).
  reference:
    kind: committed
    path: eqasim-data/data/braunschweig/mid/mid2023_H7_cars_by_kreis.csv
    note: Also draws on committed P19 car-constraint and P17_1 tables under the same directory.
validation:
  state: unvalidated
  runs: []
  metric: null
  note: No scalar KPI currently attributed to a recorded run.
assessment:
  status: pending
  by: null
  date: null
  pending_reason: |
    ADR-0017 is a combined ADR covering four flags at once (see household_income_distribution.yml). This flag lives in synthesis/population/enriched.py and is dead under the active popsim_mid production method; it is only live via the simple_ipf_open fixture. docs/features/mid-reference-tables.md exists but has no dedicated section for this feature.
  source: ADR-0017
notes: 'Issue #255: this feature is implemented in the legacy synthesis.population.enriched stage,
  which both PopulationSim workflows alias to braunschweig.popsim.enriched_adapter -- it never
  executes under the production popsim_mid method and is live only under simple_ipf_open (committed
  25% fixture).'
