feature: large_facility_access_links
title: Large sites spread their car access over their parking lots or get one high-capacity link
area: matsim
description: 'Sites are all facilities at one coordinate (incommuter workplaces included; portals, external
  centroids and homes excluded), large from 1000 activities at 100 %. Work sites and universities spread their
  car access over the nearest OSM parking lots that cover 0.5 x their size within 1500 m, weighted by spaces:
  every person gets one lot group, facilities with persons in several groups get same-point sub-facilities
  <id>__access_<n>, the activity coordinates stay. Every other large site moves to the closest car link of at
  least 1000 veh/h within 1000 m that is not a motorway, trunk or ramp. Replaces, for large sites, eqasim''s
  capacity-blind nearest-link placement, under which all departures of a site such as the VW Wolfsburg plant
  location entered on one 600 veh/h side street (issue #465, ADR-0169).'
stages:
- matsim.simulation.prepare
pipelines:
  popsim_mid: active
  popsim_open: active
  simple_ipf_open: active
lifecycle: active
production:
  enabled: true
  flags:
  - large_facility_access_enabled
introduced:
  issue: '#465'
  pr: null
  adr: ADR-0169
detail_doc: null
code_paths:
- matsim/simulation/prepare.py
- scripts/build_parking_lots_from_osm.py
- scripts/measure_large_facility_access.py
evidence:
  tests:
  - tests/test_large_facility_access_prepare.py
  - tests/test_build_parking_lots_from_osm.py
  - tests/test_measure_large_facility_access.py
  off_path_byte_identical:
    claimed: false
    note: |
      large_facility_access_enabled false skips the Java step (and needs no lots file), so facilities and population are those of RunPreparation; not asserted byte for byte against a run without this code. The Java side (eqasim-java-bs LargeSiteAccessAssignmentTest, RunAdaptLargeFacilityAccessTest, AccessGroupAllocationTest, ParkingLotReaderTest, LargeFacilityAccessLinkSelectorTest) is tested in its own repository.
  fallback_rate:
    instrumented: true
    log_marker: '[matsim.simulation.prepare] large facility access:'
    note: |
      Primary path: in-scope sites distributed over parking lots; secondary rules counted and logged with their rates: distributed_partial (fewer spaces than wanted within 1500 m), in-scope sites without a usable lot (fail above large_facility_access_maximum_no_lot_share 0.10), lots on the any-capacity link rule and lots skipped without a link within 300 m, single-link fallbacks (fail above large_facility_access_maximum_fallback_share 0.15), lots outside the network extent (none left fails). Per site in large_facility_access_summary.csv, per access group in large_facility_access_groups.csv (prepare stage directory). On the 1 % rerun's prepared scenario: 39 of 39 in-scope sites distributed (2 partly), 0 without a lot; single-link rule adequate 50, moved 196, fallback 9 of 205 (4.4 %); lot links on the >= 1000 veh/h rule 800 of 962 (83.2 %), 4 lots skipped.
  reference:
    kind: none
    note: |
      No observed reference applies. The rule is a network-access correction; its parameters (1000 activities, 0.5 spaces per activity, 1500 m, 300 m, 1000 veh/h, 1000 m) are owner decisions and measured engineering choices on this network (ADR-0169), not calibrated against data.
validation:
  state: unvalidated
  runs:
  - i465-large-facility-access-1pct-2026-10-23
  metric: null
  note: |
    A simulated 1 % A/B (continued iterations from the #465 rerun's final plans), not a validation; no observed reference is compared. See the run manifest.
assessment:
  status: pending
  by: null
  date: null
  pending_reason: |
    Implemented and measured at 1 % in a continued-iteration A/B; no full pipeline run and no 100 % run with the rule yet.
  source: ADR-0169
