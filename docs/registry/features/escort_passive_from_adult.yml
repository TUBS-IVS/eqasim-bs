feature: escort_passive_from_adult
title: Passive escort legs take the purpose of the paired same-household adult leg
area: behavior
description: 'Gives a PAIRED MiD passive escort leg (W_ZWECK 13, the escorted child''s own leg;
  100 % minors) the purpose derived from the accompanying adult''s W_ZWECK, instead of the flat
  "every code-13 leg is education" relabel of escort_passive_education (#256, ADR-0072). Issue
  #372, ADR-0112. An UNPAIRED leg keeps the previous rule, counted and logged.

  Pairing (pure module braunschweig/popsim/escort_pairing.py, pair_passive_legs): the leg of a
  same-household person aged >= adult_min_age (18) whose departure is nearest in time, within
  escort_passive_pair_max_gap_minutes (default 15.0 min). Ties resolve smallest gap -> equal
  wegkm_imp with the passive leg -> lowest adult P_ID -> lowest W_ID; status precedence is
  own-time invalidity first (unpaired_no_time > unpaired_no_adult > unpaired_gap), and an adult
  leg whose own W_ZWECK is 13 is excluded from the candidate pool (a person being escorted cannot
  be the escorter). Purpose rule (trips.PASSIVE_PURPOSE_BY_ADULT_W_ZWECK, applied in map_purpose
  AFTER the escort block so it only overwrites what it could pair): adult 4 -> shop, 5 -> other,
  7/14/15/16 -> leisure, 10 -> leisure if w_zweck_10_as_leisure else other (ADR-0111), 8/9 ->
  home, 6 -> the existing passive rule (the child IS being brought to its own activity), 1/2/3 ->
  other, 99 -> other, a missing or unknown adult code -> DEFAULT_PURPOSE, WARNed and counted. Five
  passive_pair_* traceability columns travel with the trip table.

  Measured on the production universe (the WEEKDAY reporting days the PopulationSim seed keeps,
  then rbW legs excluded and the leading arrive-home leg dropped -- the same universe the trip
  build keeps, controller rulings C-R12 and C-R18; committed
  eqasim-data/data/braunschweig/mid/mid2023_escort_w_zweck_split.csv): 6,384/6,781 = 94.15 % of
  the passive legs pair within 15 minutes, and the resulting W_GEW purpose fold is education
  0.2684 (of which 0.1947 pairs with an active escort leg and 0.0738 stays unpaired), leisure
  0.2451, other 0.1804, shop 0.1778, home 0.1283, escort 0.0000 -- i.e. 73.2 % of the passive mass
  leaves education, and 12.8 % of it is a trip HOME that used to be modelled as a school trip.

  Requires escort_purpose: map_purpose raises ValueError naming BOTH keys when this flag is on and
  escort_purpose is off. Because of that dependency the CODE and DECLARED default is False
  (controller ruling C-R9, mirroring escort_passive_education) and the production ON state is
  realised ONLY by the configs/base_bs.yml line. The seed follows the same rule on the same leg
  universe (mid.participation.derive_education_flag_seed via
  _wege_without_non_education_passive_legs and trips.legs_kept_by_the_trip_build), so the
  education_by_age control counts exactly the code-13 legs the plan realises as education
  (ADR-0109''s principle). The escort validation reference follows too:
  trip_coherence.apply_escort_active_adjustment MOVES the passive Begleitung remainder onto the
  measured fold purposes, mass-preservingly, instead of dropping it (controller ruling C-R11). ENTD
  rejects both keys (no W_ZWECK vocabulary, no household/time columns to pair on). With the flag
  false every stage is byte-identical to the #256 behaviour.'
