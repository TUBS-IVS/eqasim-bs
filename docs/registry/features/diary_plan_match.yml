feature: diary_plan_match
title: Realisable normal-weekday plan sources (#365)
area: population
description: >-
  Re-draws the MiD plan source (source_H_ID / source_P_ID) of every synthetic person whose
  source cannot be realised as a normal-weekday day plan, in a second matching pass after the
  weekend-plan match inside braunschweig.popsim.completed_donor. Unrealisable means: the MiD
  diary was never collected (anzwege1 803 "Person ohne Wegeerfassung" with mobil == 1, or 804
  "Mobilitaet unbekannt"); the source's only legs are rbW legs, so nothing remains once
  rbw_leg_convention drops them; or the reporting day was a public holiday at the residence
  (feiertag == 1) while every SrV-anchored target is a normal-weekday level. A person with
  anzwege1 == 803 and mobil != 1 is KEPT -- zero trips is then the observed day. The matcher is
  weekend_plan_match.match_person reused unchanged (has_license, sex, age_band, employed, has_pt;
  hierarchical relaxation; P_GEW-weighted draw) on the completion rng, so only the plan source
  changes and the OFF path stays byte-identical. Measured motivation (i329, 2026-08-24): 159,728
  persons (14.1%) drew a no-diary source and 100% of them ended immobile, while every hard SrV
  control was met among diary-carrying sources. The eight src_* plan-source fact columns computed
  for this pass are attached unconditionally and are also what rbw_leg_convention and
  home_closure_model read.
stages:
- braunschweig.popsim.completed_donor
- data.census.filtered
pipelines:
  popsim_mid: active
  popsim_open: not_used
  simple_ipf_open: not_used
lifecycle: active
production:
  enabled: true
  flags:
  - braunschweig.population.popsim.diary_plan_match
  - braunschweig.population.popsim.exclude_holiday_plan_sources
  - braunschweig.population.popsim.diary_match_hard_employment
  - braunschweig.population.popsim.donor_match_fine_child_age_bands
introduced:
  issue: '#365'
  pr: null
  adr: ADR-0106
detail_doc: docs/codebase/notes/popsim-plan-source-resolution.md
code_paths:
- braunschweig/popsim/diary_plan_match.py
- braunschweig/popsim/diary_facts.py
- braunschweig/popsim/completed_donor.py
- braunschweig/popsim/mid/participation.py
evidence:
  tests:
  - tests/test_diary_plan_match.py
  - tests/test_diary_facts.py
  - tests/test_completed_donor_diary_match.py
  - tests/test_completed_donor_stage.py
  - tests/test_trip_class_seed_closure.py::test_forbid_no_diary_sources_raises_for_mobile_803_source
  - tests/test_trip_class_seed_closure.py::test_forbid_no_diary_sources_keeps_immobile_803_source
  - tests/test_completed_donor_diary_match.py::test_kept_immobile_803_source_survives_the_seed_guard_and_seeds_class_zero
  - tests/test_weekend_plan_match.py
  - tests/test_weekend_plan_match.py::test_match_person_with_empty_hard_keys_reproduces_todays_draw_sequence
  - tests/test_weekend_plan_match.py::test_match_person_never_relaxes_a_hard_key
  - tests/test_diary_plan_match.py::test_reassign_reports_zero_crossings_with_hard_employment_and_counts_them_without
  - tests/test_diary_plan_match.py::test_reassign_warns_when_a_crossing_survives_hard_employment
  - tests/test_completed_donor_diary_match.py::test_diary_match_keeps_the_employment_boundary_and_reports_the_crossing_rate
  - tests/test_weekend_plan_match.py::test_match_person_with_default_age_band_edges_reproduces_todays_draw_sequence
  - tests/test_weekend_plan_match.py::test_fine_child_bands_prefer_a_primary_school_donor_over_a_13_year_old
  - tests/test_diary_plan_match.py::test_reassign_with_fine_child_bands_prefers_a_primary_school_donor
  - tests/test_diary_plan_match.py::test_reassign_counts_and_logs_the_fine_child_band_crossing_rate
  - tests/test_completed_donor_diary_match.py::test_diary_match_uses_the_fine_child_bands_by_default_and_reports_the_crossing_rate
  - tests/test_weekend_plan_match.py::test_align_members_fine_child_bands_pair_a_first_grader_with_a_first_grader
  - tests/test_weekend_plan_match.py::test_fine_child_bands_leave_the_rng_stream_untouched_on_a_randomised_population
  - tests/test_popsim_member_completion.py::test_fine_child_bands_keep_the_mirror_sibling_age_structure
  - tests/test_popsim_member_completion.py::test_fine_child_bands_do_not_move_the_member_completion_rng_stream
  off_path_byte_identical:
    claimed: 'true'
    test: tests/test_completed_donor_stage.py::test_build_completed_donor_off_matches_pre_task_inline_pipeline
    note: |
      With diary_plan_match_on=False the completed-donor persons frame must equal an inline
      reference that runs ONLY member completion + weekend match and stops there (the pre-#365
      pipeline): no Wege load, no diary match, no remap. Compared on H_ID / P_ID /
      source_H_ID / source_P_ID -- the result additionally carries the src_* fact columns, which
      are attached unconditionally by design (the stopped-early reference never computes them),
      so they are outside the byte-identity claim and are documented in the stage record and in
      docs/codebase/notes/popsim-plan-source-resolution.md.
      tests/test_completed_donor_diary_match.py::test_diary_match_off_is_byte_identical_in_sources
      pins the same claim at the plan-source level, and
      tests/test_diary_plan_match.py::test_classify_respects_flags_off pins the classifier.
  fallback_rate:
    instrumented: true
    log_marker: '[diary_plan_match]'
    note: |
      The remap itself is the "fallback" whose rate must stay observable: the pass logs, per
      resolution class, the count and share of persons remapped and the match-level distribution
      of the hierarchical relaxation, and WARNS when the population has more than 1,000 persons
      AND the remapped share falls outside 5-30% (i329 magnitude: ~14%; below 1,000 persons the
      band is not statistically meaningful and the warning is suppressed). The band and the guard
      are the code constant braunschweig.popsim.diary_plan_match.EXPECTED_SHARE_REMAPPED --
      this is the single place the exact figures are stated; ADR-0106 points here rather than
      repeating them. Per-person decisions are written to diary_plan_match_trace.parquet
      next to the weekend trace, and the counters are published via context.set_info.
      Defense in depth on the other side: with the flag ON, derive_trip_class_seed RAISES if any
      resolved plan source is one this match PROMISES to remap -- anzwege1 804, or 803 with the
      SOURCE's mobil == 1 -- so a silent regression cannot hide behind a seed that keeps hitting
      its target. The guard mirrors the classification exactly (fix wave 2026-09-06, controller
      ruling R18): a 803 source with mobil != 1 is KEPT here by design, so raising on it aborted a
      correctly behaving production run; it is instead seeded as 0 trips (its plan is empty by
      construction) rather than age-band imputed, and the kept/must-have-been-remapped counts are
      logged as rates. The guard requires the MiD column mobil and fails fast without it.
      SINCE #368 (ADR-0109) the pass also counts DiaryMatchReport.n_crossed_employment_boundary --
      remaps whose donor's employment class (P_TAET in EMPLOYED_TAET, the same derivation the
      employed match key uses) differs from the receiving person's -- and logs it as n/total with a
      percentage, at WARNING when braunschweig.population.popsim.diary_match_hard_employment is on
      and a crossing survived (with the key hard the only way to cross is the whole-pool fallback,
      which fires when no donor at all shares the person's employment class), INFO otherwise. The
      match-level line now states the flag as well, because the level scale depends on it: with one
      hard key the levels count SOFT relaxations (0..4) instead of the previous 0..5, so an arm-4
      histogram is not directly comparable to arm 3's. On the arm-3 100 % run only 2 of the 74,898
      remaps relaxed past employed (match_level_counts={0: 74896, 3: 2}), so the flag is a GUARD
      against a future pool composition rather than a correction of a measured defect.
      SINCE #386 (ADR-0118) the shared key donor_match_fine_child_age_bands additionally bands
      6-13-year-olds finely (6-9 / 10-13) in ALL THREE age-matching passes of the donor build --
      member completion's mirror role matching and the weekend match's member alignment as well
      as this re-draw -- so an A/B on it is NOT an isolation of this feature; the upstream passes
      also move, and this pass's remap COUNT therefore differs between the arms (compare rates).
      The stage record braunschweig.popsim.completed_donor.yml owns the full description. Here the
      pass counts DiaryMatchReport.n_crossed_fine_child_age_band
      over n_remapped_in_split_child_band -- remaps of persons aged 6-13 (the one coarse band
      weekend_plan_match.FINE_CHILD_AGE_BAND_EDGES splits) whose donor lands in a different FINE
      band -- and logs it as n/total with a percentage. Unlike the employment counter this one is
      measured against the FINE edges in BOTH arms, so the flag-OFF arm reports today's rate and
      the two arms of an A/B are directly comparable, and it is NOT required to be 0 with the flag
      on: age_band stays a SOFT key the relaxation ladder may drop, so a residual is a legitimate
      relaxation rather than a defect. No threshold is asserted for that reason.
  reference:
    kind: committed
    path: eqasim-data/data/braunschweig/srv/srv2023_plan_structure_reference.csv
validation:
  state: measured_vs_reference
  runs:
  - plan-structure-fix-arm3-100pct-2026-09-07
  metric: mobility_rate
  note: >-
    MEASURED at 100 % (arm 3 = every package ON, run manifest plan-structure-fix-arm3-100pct-2026-09-07, analysis stage
    braunschweig.analysis.synthesis.plan_structure_vs_srv against the committed SrV reference):
    mobility_rate 0.8872 vs SrV 0.8437 (at_home_zero universe, +4.35 pp), i.e. 11.28 % of the
    head-to-head persons have no trip vs 23.0 % in the i329 baseline; the popsim control targets
    the SrV at-home share (11.2 %), which is met. diary_plan_match remapped 74,898 of 485,709
    plan sources (15.42 %, inside the expected 5-30 % band; nodiary_mobile 40,580, holiday
    22,976, only_rbw 7,024, nodiary_unknown 4,044; 3,283 kept immobile, 274 emptied). Work
    participation of employed persons rose from 0.494 to 0.584 (SrV 0.675, the residual is the
    control universe, issue #368); education participation of 6-17 not employed from 0.74 to
    0.843 (SrV 0.900). Against the at_home_zero universe the model is over-mobile by the
    construction of the target (ADR-0106 proof section). Arm 1 alone (package 1 only) was not
    run, so the attribution of the mobility gain to this package alone is by mechanism, not by
    A/B isolation.
assessment:
  status: pending
  by: null
  date: null
  pending_reason: |
    Implemented and reviewed on the branch, but no run has executed it: the remap rate, the
    match-level distribution and the effect on the realised plan structure are all unmeasured at
    production scale. Assessment stays pending until the first A/B arm is recorded.
