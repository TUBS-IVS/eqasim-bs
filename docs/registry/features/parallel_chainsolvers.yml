feature: parallel_chainsolvers
title: Parallel chainsolvers
area: infrastructure
description: >
  Runs the secondary-location chainsolvers (carla) across worker processes instead of
  single-threaded. Since ADR-0126 the person-shard count (braunschweig.chainsolvers.shards,
  SCIENTIFIC, default 62) is a separate, hashed config key from the worker-process count
  (braunschweig.chainsolvers.processes, OPERATIONAL, volatile, auto-scaled under the sentinel 0)
  -- the shard count fixes the person partition and every shard's derived rng seed, so it, not
  the worker count, determines the secondary-location realisation, and the worker count only
  decides how many processes chew through that fixed shard set. Before ADR-0126 the two
  were the same number, so a run's result silently depended on the machine's core count.
  A 2026-09-17 amendment to ADR-0126 additionally bounds the worker count by the pool's
  MEASURED memory footprint, not just cpu_count - 2: a config key
  braunschweig.chainsolvers.worker_memory_gb (OPERATIONAL, volatile; configs/base_bs.yml
  sets 1.09 GB since ADR-0135, the maximum private per-worker footprint measured in the
  100 % production run, docs/runs/chainsolver-pool-memory-2026-09-28.yml; the code default
  in braunschweig.resources is still 0.86 from docs/runs/chainsolver-worker-private-memory-2026-09-17.yml)
  is divided into the memory budget net of this process's own live RSS (the pool is forked
  from it), and the worker count is capped at min(core budget, that memory bound).
  braunschweig.resources.effective_chainsolver_workers applies this at stage start and logs
  the resulting ceiling; a worker killed outright (OOM) reports a broken executor instead of
  hanging the stage, and its shard alone is retried (ADR-0097, whose own "rejected: a static
  memory cap" alternative this amendment supersedes now that the shard/worker split removed
  its premise). ADR-0135 adds the pool's memory protections: the driver heap is frozen
  (gc.freeze) while workers are forked, so no garbage collection copies the pages they share
  with the driver; every pool worker makes itself the kernel OOM killer's first victim and
  exits when the driver is gone; and a retry generation runs with half the workers.
stages:
- synthesis.population.spatial.secondary.locations
pipelines:
  popsim_mid: active
  popsim_open: active
  simple_ipf_open: active
lifecycle: active
production:
  enabled: true
  flags:
  - braunschweig.chainsolvers.parallel
  # NOT a boolean flag: an integer person-shard count. The Feature Registry schema
  # has no other field for a production-relevant config key (production accepts only
  # `enabled` and `flags`), and this key is the one that decides the realisation this
  # record describes, so it is listed here deliberately rather than dropped. Its
  # semantics are in the description above and in ADR-0126, Decision 4.
  - braunschweig.chainsolvers.shards
introduced:
  issue: null
  pr: null
  adr: null
detail_doc: null
code_paths:
- braunschweig/synthesis/locations/secondary_chainsolvers/
evidence:
  tests:
  - tests/test_chainsolver_pool_protection.py
  - tests/test_chainsolver_worker_death.py
  - tests/test_chainsolvers_parallel.py
  - tests/test_secondary_chainsolvers.py
  - tests/test_secondary_chainsolvers_subtypes.py
  off_path_byte_identical:
    claimed: not_applicable
    note: |
      tests/test_chainsolvers_parallel.py tests parallel-vs-serial reproducibility (same seeds -> same result) rather than a boolean-flag OFF/ON byte-identity claim.
  fallback_rate:
    instrumented: true
    log_marker: 'primary/fallback split:'
    note: |
      Logs the primary(carla)-vs-fallback(rda) placement split for the chainsolver as a whole; this instruments the solver's own primary/fallback choice, not specifically the parallel-vs-serial execution mode, but fires on every run of the module regardless of braunschweig.chainsolvers.parallel.
  reference:
    kind: none
    note: Infrastructure feature (parallel execution); no external reference applies.
validation:
  state: unvalidated
  runs: []
  metric: null
  note: No KPI applies to a parallelisation mechanism.
assessment:
  status: pending
  by: null
  date: null
  pending_reason: |
    No ADR was found for the parallelisation decision itself (searched docs/DECISIONS.md for "chainsolver" and "parallel"; all hits concern the unrelated scorer/pot_weight/version-pin topics). No owner verdict on realised parallel-vs-serial correctness/performance has been recorded. ADR-0097 covers only the killed-worker recovery added after the 2026-08-20 incident (issue #344), not the parallelisation itself, and no production run has exercised that recovery yet: in the 100 % run of 2026-09-26 the kernel killed the DRIVER, not a worker, so the recovery never got to act; ADR-0135 makes a worker the first victim so that it does next time.
  source: null
