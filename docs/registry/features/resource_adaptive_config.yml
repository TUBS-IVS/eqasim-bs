feature: resource_adaptive_config
title: Resource-adaptive configuration (machine-derived budget, ceiling clamps, chainsolver shard/worker split)
area: infrastructure
description: >
  braunschweig/resources.py detects the machine a run actually lands on (cores via
  os.sched_getaffinity with an os.cpu_count fallback, memory via psutil with a
  /proc/meminfo fallback, raising ResourceDetectionError if neither source reports a
  value) and derives one ResourceBudget per run (cores - 2, memory_gb - 8, overridable
  by EQASIM_CPU_BUDGET / EQASIM_MEM_BUDGET). THREE OPERATIONAL config keys are resolved
  against that budget at their point of use -- java_memory (matsim/runtime/java.py,
  data/osm/osmosis.py), braunschweig.population.popsim.num_workers
  (braunschweig/popsim/stage/__init__.py, bounded by measured per-worker memory via
  braunschweig.population.popsim.worker_memory_gb, default 30 GB), and (2026-09-17
  amendment) braunschweig.chainsolvers.processes (braunschweig/synthesis/locations/
  secondary_chainsolvers/__init__.py's _solve_problem_set, bounded by BOTH the core
  budget and a measured per-worker memory footprint via
  braunschweig.chainsolvers.worker_memory_gb, default 0.86 GB, against THIS process's
  own live RSS at stage start since the pool is forked from it: workers = max(1,
  min(core_budget, floor((memory_budget_gb - driver_rss_gb_live) / worker_memory_gb)))
  -- see docs/runs/chainsolver-worker-private-memory-2026-09-17.yml for the measured
  basis) -- and a configured value is a CEILING: used verbatim when it fits, clamped
  down and logged when it does not. The resolved value never enters the config, so no
  synpp stage hash changes and no shared cache is invalidated by the CLAMPING itself
  (the chainsolver clamp's driver-RSS term is measured fresh every run, so it is a
  point-of-use resolution like the other two, not a config-independent constant).
  THE FEATURE AS A WHOLE IS NOT CACHE-FREE, and a planner must budget for two costs
  that come from other parts of it. ONE-TIME: landing this work invalidates BOTH the
  full-scale PopulationSim cache and the full-scale chainsolver cache -- the first
  because braunschweig/popsim/stage adds "braunschweig.resources" to its
  _DEFERRED_HELPER_MODULE_NAMES source-hash token, the second because the chainsolver
  stage adds the new HASHED key braunschweig.chainsolvers.shards to its configure()
  and lists braunschweig.resources in its _HELPER_MODULES. At 100 % scale that is a
  multi-hour recompute of both stages and everything downstream of them. PERMANENT:
  because both stages hash braunschweig/resources.py by import site via
  inspect.getsource (whole file, not a semantic diff), EVERY future edit to that file
  -- a log-message wording change or a docstring-only edit included -- invalidates
  BOTH full-scale caches again. braunschweig/resources.py must therefore be treated
  as an expensive file to touch. See ADR-0126 Consequences for both costs in full.
  `processes` (the synpp-level key, NOT braunschweig.chainsolvers.processes above) is
  DELIBERATELY NOT in this list: at its two pure read sites
  (synthesis/population/matched.py,
  synthesis/population/spatial/secondary/locations.py) it fixes both the person-chunk
  partition (np.array_split) and the seed count -- matched.py as
  random.randint(10000, size=len(chunks)) and locations.py as
  random.randint(10000, size=processes), the same quantity spelled two ways since
  len(chunks) == processes -- so it is result-affecting and is treated exactly like
  matsim_threads /
  matsim_qsim_threads: reported and warned about (below 75% of the core budget), never
  adjusted. Since the 2026-09-17 amendment both sites also declare it HASHED
  (`context.config("processes")`): they used to carry `volatile=True` from upstream
  eqasim-france #438, which kept a result-affecting key out of those two stages'
  hashes, so a changed pin served a cached realisation built under a different
  partition (measured: 8 -> 32 changes the drawn seed of 19 of 20 persons). The two
  MATSim stages that only forward the value as a thread count keep `volatile=True`.
  Cost: those two stage hashes change once, and every later change to `processes`
  recomputes them -- the correct price of a changed realisation. matsim_threads / matsim_qsim_threads are excluded for the independent
  reason that their effect on results is unverified (issue #410): the startup report
  only warns about them. A companion fix separates the secondary-location chainsolver's
  person-shard count (new hashed key braunschweig.chainsolvers.shards, default 62,
  SCIENTIFIC) from its worker-process count (braunschweig.chainsolvers.processes, now
  volatile, OPERATIONAL), because before this change the shard count WAS the worker
  count and every run's secondary-location realisation silently depended on the
  machine's core count. scripts/run_synpp.py builds the report from the resolved
  config at startup, logs it, aborts on an error-severity violation ONLY when
  braunschweig.population.method actually selects a PopulationSim workflow (so a
  MATSim-only or simple_ipf_open run is never aborted by a popsim.num_workers mismatch
  it will never hit) and only at the SCALE the 30 GB/worker figure was measured at
  (sampling_rate >= 1.0, or an explicit
  braunschweig.population.popsim.worker_memory_gb by which the operator asserts the
  figure applies to this run; otherwise the mismatch is a warning that names the
  unmeasured scale -- no scale-to-memory relationship is invented), and records the
  report in the run provenance under "resources" (the chainsolver clamp is previewed
  there as a core-budget-only, origin="reported" entry capped by any configured pin,
  because the live driver RSS is only known once the stage itself starts; the stage's
  own log line is the source of truth for the value actually used). See ADR-0126 for
  the full decision, including the rejected free-resources alternative and the
  2026-09-17 amendment that added the chainsolver memory bound.
stages:
- matsim.runtime.java
- data.osm.osmosis
- data.census.filtered
- synthesis.population.spatial.secondary.locations
- synthesis.population.matched
pipelines:
  popsim_mid: active
  popsim_open: active
  simple_ipf_open: active
lifecycle: active
production:
  enabled: true
introduced:
  issue: null
  pr: null
  adr: ADR-0126
detail_doc: docs/codebase/notes/resource-budget.md
code_paths:
- braunschweig/resources.py
- braunschweig/provenance.py
- scripts/run_synpp.py
- matsim/runtime/java.py
- data/osm/osmosis.py
- braunschweig/popsim/stage/__init__.py
- braunschweig/synthesis/locations/secondary_chainsolvers/__init__.py
- braunschweig/synthesis/locations/secondary_chainsolvers/parallel_solving.py
- braunschweig/synthesis/locations/secondary_chainsolvers/solver_defaults.py
evidence:
  tests:
  - tests/test_resources_detection.py
  - tests/test_resources_budget.py
  - tests/test_resources_java_memory.py
  - tests/test_resources_popsim_workers.py
  - tests/test_resources_processes.py
  - tests/test_resources_report.py
  - tests/test_resources_run_start.py
  - tests/test_resources_chainsolver_workers.py
  - tests/test_run_synpp_arity.py::test_main_hands_the_resource_report_to_the_provenance_record
  - tests/test_run_provenance.py::test_collect_embeds_the_resource_report_under_resources
  - tests/test_run_provenance.py::test_log_and_write_persists_the_resource_report_to_disk
  - tests/test_chainsolvers_parallel.py::test_shard_tasks_are_invariant_to_the_worker_count_and_pool_follows_workers
  - tests/test_processes_hash_coverage.py
  - tests/test_chainsolvers_parallel.py::test_shard_partition_depends_only_on_the_shard_count
  - tests/test_chainsolvers_parallel.py::test_solve_chains_parallel_is_invariant_to_the_worker_count
  - tests/test_chainsolvers_parallel.py::test_a_single_worker_still_produces_the_sharded_realisation
  - tests/test_chainsolvers_parallel.py::test_shard_count_is_hashed_but_worker_count_is_volatile
  - tests/test_chainsolvers_parallel.py::test_chain_shards_rejects_a_yaml_boolean
  - tests/test_passive_joint_two_pass.py::test_shard_attempts_rejects_a_yaml_boolean
  - tests/test_passive_joint_two_pass.py::test_solve_problem_set_obtains_its_worker_count_from_resources
  - tests/test_passive_joint_two_pass.py::test_a_pass_smaller_than_the_shard_count_prints_the_effective_shard_count
  off_path_byte_identical:
    claimed: false
    test: tests/test_chainsolvers_parallel.py::test_shard_tasks_are_invariant_to_the_worker_count_and_pool_follows_workers
    note: >
      claimed is FALSE on purpose: neither of the two claims below is a PROVEN
      byte-identity, and "true" renders as "proven" in docs/generated/FEATURES.md.
      Two claims, argued separately. (1) The java_memory / num_workers clamps
      cannot change a result by construction (each key is classified OPERATIONAL in
      the design spec by reading its consumers: java_memory only ever becomes -Xmx;
      PopulationSim submits one independent subprocess per batch with no
      worker-index-dependent seed) -- there is no ON/OFF switch to pin a
      byte-identity test against, so this claim rests on the classification itself,
      not on a dedicated test. `processes` is NOT part of this claim: reading its two
      pure consumers shows it fixes both the person-chunk partition
      (np.array_split(..., processes)) and the seed count -- matched.py as
      random.randint(10000, size=len(chunks)) and locations.py as
      random.randint(10000, size=processes), the same quantity spelled two ways
      since len(chunks) == processes -- so it is result-affecting and is
      neither clamped nor claimed byte-identical here -- it is reported and warned
      about only, exactly like matsim_threads / matsim_qsim_threads (an earlier draft
      of this record misclassified it as operational; ADR-0126, Decision 3, corrects
      that). (2) The chainsolver shard/worker split's STRUCTURAL invariance is pinned
      platform-independently by
      test_shard_tasks_are_invariant_to_the_worker_count_and_pool_follows_workers and
      test_shard_partition_depends_only_on_the_shard_count: the shard tasks depend
      only on the shard count, and the pool size follows the worker count.
      test_solve_chains_parallel_is_invariant_to_the_worker_count and
      test_a_single_worker_still_produces_the_sharded_realisation add output
      invariance across worker counts at a fixed shard count -- but at n_shards=8
      over 50 synthetic persons, against an injected stateless fake chainsolvers
      module (the optional package is not installed in the environment they were
      written in), and only where the 'fork' start method exists (Linux/CI; skipped on
      Windows). The SEPARATE claim that the production default shards:62 reproduces
      every past production run on the 64-core server bit-for-bit is an INFERENCE from
      reading the pre-change code (parallelism.resolve_workers(0) = cpu_count - 2 = 62
      there, with the shard count equal to the pool size and _make_person_shards /
      _derive_shard_seed unchanged), argued in ADR-0126 Decision 4. No test verifies
      it: neither test above runs at 62 shards or compares against a production
      artifact, and citing them as its verification (as an earlier draft of this
      record did) over-attributes the evidence. Off the server several shards can run
      sequentially inside one worker process; a code inspection of the installed
      chainsolvers package (ADR-0126 Consequences) finds the run's randomness carried
      by a per-setup RunnerContext.rng, with no module-level RNG, lru_cache or other
      module-level mutable state anywhere in the package -- so worker REUSE is
      state-free in the real package too. Two unseeded default_rng() fallbacks exist
      (Selector.select per call, dp.py's constructor per instance); both are
      per-call/per-instance, not global, so they can cost reproducibility but cannot
      make a result depend on the worker count. That narrows, but does not close,
      the back door: it is one pinned third-party version at one point in time.
      Outstanding
      discharge (not yet run): a server A/B at shards:62 comparing processes:8 against
      processes:62, asserting byte-identical secondary-location output against the
      real solver. See ADR-0126, Consequences.
  fallback_rate:
    instrumented: true
    log_marker: '[resources] sched_getaffinity unavailable'
    note: >
      Machine detection has two independent primary/fallback pairs, each logged the
      moment its fallback fires: cores (sched_getaffinity primary, os.cpu_count
      fallback, "[resources] sched_getaffinity unavailable; using os.cpu_count().") and
      memory (psutil primary, /proc/meminfo fallback, "[resources] psutil unavailable;
      using /proc/meminfo."). Neither degrades silently: MachineResources carries
      cores_source / memory_source into the run provenance on every run, and if NEITHER
      reader of a pair reports a value, detect_cores / detect_memory_gb raise
      ResourceDetectionError instead of guessing (tests/test_resources_detection.py).
      This is a fallback between DETECTION METHODS on a single machine, not a
      per-item rate over many records, so no percentage applies here; observability is
      the logged source string (and the run-provenance field) on every single run
      instead of an aggregate rate.
  reference:
    kind: none
    note: >
      Infrastructure / configuration-resolution feature; no external behavioural
      reference applies to "does this run fit on this machine". The one
      result-affecting exception -- the chainsolver shard default -- is justified by
      the committed evidence in off_path_byte_identical and ADR-0126, not by comparison
      to an external reference value.
validation:
  state: unvalidated
  runs:
  - chainsolver-worker-private-memory-2026-09-17
  metric: null
  note: >
    No real-machine smoke run has been recorded yet. The brief for this work names a
    server smoke (python scripts/run_synpp.py configs/base_bs.yml
    configs/overlays/test.yml) that must show a "[resources] machine: 64 cores" log
    block, a "java_memory 100G -> 86G" clamp line, AND a
    "braunschweig.population.popsim.num_workers 3 -> 2" clamp line (the pinned
    num_workers: 3 in this overlay does not fit the measured 86.28 GB budget at 30
    GB/worker; the same clamp applies to test_1pct.yml, test_25pct.yml,
    test_100pct.yml, test_matsim.yml, escort_reuse_5pct.yml and
    srv_location_reuse_5pct.yml, all seven pinned at 3, and
    smoke_kreis_control_fit.yml, pinned at 4, clamps to 2 as well -- see ADR-0126
    Consequences for the full list and the ~33-50% parallelism drop this
    represents), the run proceeding, and the resources block landing in
    run_provenance_<stamp>.json, as the outstanding evidence before this feature can
    be called production-proven; it has not been executed as of this record.
    EXPECTED, NOT A DEFECT, in that same smoke: "[resources] processes is pinned to
    32 but 62 cores are budgeted ..." -- configs/base_bs.yml pins processes: 32 below
    the 75% under-use threshold on purpose, and the key is result-affecting, so this
    warning fires on EVERY production run and must not be acted on (ADR-0126,
    Decision 3). The 2026-09-17 chainsolver memory-bound amendment adds one more
    expected line: "[resources] braunschweig.chainsolvers.processes: budget 62 cores /
    86.3 GB memory, driver RSS <measured> GB, worker_memory_gb 0.86 GB -> ceiling
    <n> workers", logged by effective_chainsolver_workers at
    braunschweig.synthesis.locations.secondary_chainsolvers stage start -- also not
    yet observed on a real server run. ("86.3" is 86.28 GB at the log line's one
    decimal place: 94.28 GB detected total minus the 8 GB reserve, the 94.28 figure
    being the run resource recorder's memory_total_kb recorded in the run manifest;
    "free -g" truncates the same machine to 94.) That <measured> driver RSS is the
    single most important number the smoke produces: it is the FORK-POINT quantity
    the bound divides into, which no recorded series has ever sampled, and on this
    box the bound starts to bite from about 32.96 GB upwards. Until it is observed,
    whether the chainsolver memory bound ever binds in practice is UNVERIFIED. The
    chainsolver-worker-private-memory-2026-09-17 manifest listed in validation.runs
    is a POST-HOC RESOURCE MEASUREMENT establishing the 0.86 GB/worker constant's
    measured basis, over seven already-recorded production executions -- it is NOT a
    smoke or validation run of this feature (no config, resolution, or clamp behaviour
    of this mechanism was exercised by it). Unit-level coverage is in place and green:
    detection fallbacks, budget derivation, per-key resolution, the popsim gate in
    both its method and its scale dimension (including two cases that load the
    committed popsim fixtures), the chainsolver shard/worker invariance, and the
    run-start contract itself -- that scripts/run_synpp.py builds a report, enforces
    it and embeds it in the run provenance under "resources" is pinned by
    tests/test_run_synpp_arity.py::test_main_hands_the_resource_report_to_the_provenance_record
    and tests/test_run_provenance.py, NOT by tests/test_resources_run_start.py, which
    despite its name exercises resources.enforce_report directly and never imports
    the launcher. See evidence.tests.
assessment:
  status: pending
  by: null
  date: null
  pending_reason: >
    Awaiting the real-machine smoke run named in validation.note, and the server A/B
    (shards:62, processes:8 vs processes:62) named in
    evidence.off_path_byte_identical.note as the outstanding discharge for the
    chainsolver worker-count invariance claim against the real carla_sample solver.
  source: ADR-0126
notes: >
  The chainsolver shard/worker separation is also tracked in its own feature record,
  docs/registry/features/parallel_chainsolvers.yml (the general parallel-execution
  mechanism); this record covers the resource-budget/clamp mechanism as a whole and
  the specific machine-independence property the shard/worker split establishes for
  it. EQASIM_CPU_BUDGET and EQASIM_MEM_BUDGET are environment-variable overrides, not
  config keys, and are therefore not listed under production.flags; there is no
  boolean switch that turns this mechanism off -- every run resolves its resource keys
  against the detected (or overridden) budget, so production.flags is intentionally
  omitted (always-on infrastructure, matching the convention used by
  docs/registry/features/run_resource_recorder.yml for monitoring_enabled -- except
  here there is no equivalent single toggle to name).
