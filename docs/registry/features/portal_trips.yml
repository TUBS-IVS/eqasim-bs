feature: portal_trips
title: Portal trips (long-distance legs through the cordon gates)
area: cordon
description: >-
  Trips whose destination lies beyond the supplied area (the ZGB plus the 45 km network and timetable ring)
  become one outside stay at a cordon gate, so that they are present with a mode, a distance and a timeline
  that fit together without nationwide supply (ADR-0141, issue #442). One threshold,
  braunschweig.portal.max_routable_distance_m (straight-line metres, default 45000), decides: for work and
  education legs the distance from home to the assigned location, for every other leg the donor's reported
  distance. The portal stage rewrites the reporting-day trips behind the alias
  synthesis.population.trips.final: consecutive far destinations merge into one stay, the gate is the road gate
  or the schedule-derived rail exit station with the smallest detour (always inside the cut extent, so the
  scenario cutter cuts nothing), the stay ends at a time derived from the donor's diary, and the donor's
  outbound mode is fixed for both legs after an availability check with a counted substitution order.
  Two guard rails behind the same flag bound the secondary distance CDFs by the threshold and the external
  Gemeinde candidates to the supply ring. The chain solver treats the gate as a fixed anchored activity.
  The population writer marks portal gates with the activity attribute portalGate=true so that the Java
  PortalTripConstraint (eqasim-java-bs, branch feature/i442-portal-trip-constraint) keeps the donor mode of
  those trips in the discrete mode choice and stays a no-op without portal gates.
  Reporting: every existing dashboard key keeps its pre-feature definition over all trips; the additive blocks
  in_region and cross_boundary live in run_metrics.metrics_matsim, run_mid_validation gains an additive
  long-distance block, and the SimWrapper behaviour sankey excludes trips touching an outside activity. The
  dashboard's cross_boundary block holds every trip with an outside purpose at either end, so it also contains
  the in-commuters' trips, not only portal stays of residents. MATSim's own modestats.csv has no purposes and
  keeps counting portal legs under their mode, so modestats_inside cannot separate them.
