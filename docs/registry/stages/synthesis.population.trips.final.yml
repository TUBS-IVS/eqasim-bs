stage: synthesis.population.trips.final
title: Reporting-day trips
layer: behavior
description: >-
  The finished day of the population, as every consumer of the simulated day reads it: the secondary chain
  solver, synthesis.population.activities.final, synthesis.output, the MATSim population and the analyses.
  In the production config the alias resolves to braunschweig.synthesis.portal_trips.trips_final (ADR-0141,
  issue #442), the trip table of the reporting day rewritten around portal stays at the cordon gates; that
  layer is stacked on braunschweig.synthesis.commute_day.trips_day_stage, which builds the reporting-day view
  itself (ADR-0104, issue #244). With braunschweig.portal.enabled false the alias returns the unchanged
  trips_day_stage frame, and with commute_day_state_enabled false that is in turn the pre-assignment
  synthesis.population.trips frame, so the alias is then a pure pass-through. Every configs/fixtures/* config
  aliases it to its own pre-assignment trips stage and switches both features off.
lineage:
  type: braunschweig_new
  upstream: null
  notes: >-
    No eqasim precedent; the terminal view of the trips table. Introduced as the reporting-day alias by
    ADR-0104 (implementation: braunschweig.synthesis.commute_day.trips_day_stage) and re-pointed at the portal
    layer by ADR-0141.
code:
- braunschweig/synthesis/portal_trips/trips_final.py
- braunschweig/synthesis/portal_trips/stage.py
pipelines:
  popsim_mid: active
  popsim_open: not_used
  simple_ipf_open: not_used
production: true
resolves_to:
  popsim_mid: braunschweig.synthesis.portal_trips.trips_final
inputs: []
features:
- portal_trips
- commute_day_state
- general_day_absence
- departure_time_model
decisions:
- ADR-0141
- ADR-0104
- ADR-0110
- ADR-0114
- ADR-0128
notes: >-
  The two layers keep their own records and are not described twice: the reporting-day replacement (donor
  chains, absence, departure-time model, their guards and fallback rates) is the record of
  braunschweig.synthesis.commute_day.trips_day_stage; the portal rewrite (classification, gates, times, modes,
  anchors) is the record of braunschweig.synthesis.portal_trips.stage, with
  docs/codebase/notes/portal-trips.md for maintenance rules. Consumers of the finished day keep reading this alias; none
  changed when the portal layer was added, except that the SrV plan-structure and departure-time comparisons
  and the work-participation report read braunschweig.synthesis.commute_day.trips_day_stage (the pre-portal
  frame) instead while braunschweig.portal.enabled is true, because they validate the donor-based day. Cache consequence of the re-pointing (ADR-0141): this stage and everything
  downstream recompute once, even with braunschweig.portal.enabled false, because the alias target changed.
