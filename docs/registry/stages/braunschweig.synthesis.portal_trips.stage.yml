stage: braunschweig.synthesis.portal_trips.stage
title: Portal trips (core stage)
layer: cordon
description: >-
  Rewrites the reporting-day trip table so that every leg beyond the portal threshold
  (braunschweig.portal.max_routable_distance_m) becomes one outside stay at a cordon gate
  (ADR-0141, issue #442). Per stay it classifies the legs, merges consecutive far destinations,
  chooses an external point and a gate (road gate, or a schedule-derived pt exit stop chosen
  against the timetable and the eqasim batch router, ADR-0152; both inside the cut extent; a pt stay without a
  connection is resolved by a counted chain), derives the re-entry time from the donor's diary, fixes the donor's
  outbound mode for both portal legs against the synthetic person, times the outbound arrival at
  the gate (the diary duration split by the synthetic geometry, no reported distance) and the re-entry, and rewrites
  the trip table and the anchors frame. Returns one dict {trips, anchors, report}; the two thin stages
  trips_final and anchors hand one frame each to their consumers. With
  braunschweig.portal.enabled false the trips frame is the input frame itself and the anchors
  frame is empty.
lineage:
  type: braunschweig_new
  upstream: null
  notes: >-
    No eqasim precedent. eqasim France drops every donor with a trip outside the region; this
    model keeps nationwide MiD donors and handles the far legs as portal trips at the cordon
    gates, in the same cut form the in-commuters already have.
