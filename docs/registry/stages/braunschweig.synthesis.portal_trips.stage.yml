notes: >-
  Reads braunschweig.synthesis.commute_day.trips_day_stage (the reporting-day trips),
  synthesis.population.enriched (persons with the availability columns the mode check needs),
  the home and primary locations, braunschweig.synthesis.cordon_gates, braunschweig.data.cordon_network,
  braunschweig.data.external_secondary_points, data.spatial.municipalities (cordon polygon) and
  matsim.scenario.supply.processed (timetable for the rail exit stations); no dataset ids, the
  gates and points are stages. Requires cordon_enabled (configure raises otherwise). Config keys,
  all in configs/base_bs.yml: braunschweig.portal.enabled, max_routable_distance_m,
  external_point_distance_tolerance, mode_substitution_warn_share and fallback_warn_share
  (ranges and defaults in portal_trips/config_keys.py). The external-point draw is seeded
  from random_seed plus a stage-specific offset.
  Fallback transparency: the stage logs, tagged [portal_trips] and in its report, the share of
  work/education legs classified by the reported distance instead of the assigned location
  (raises when ALL fall back), the external-point band misses, the origins proxied by home, the
  re-entry clamps, the capped re-entry and outbound shares (and how many are caused by a missing
  reported distance), the mode substitutions by reason, persons without a licence value and donor
  modes the mode check does not know; rates above the configured warn shares log at WARNING.
  The stage asserts that municipalities, home locations, gates, links and external points share one
  CRS (ValueError otherwise, before the first spatial step). With the flag on it also writes its report
  as portal_trips_report.json into its own cache directory (the OFF run writes none), so a run manifest
  can cite the counts without the log. The analyses that validate the donor-based day (SrV plan
  structure, SrV departure times, work participation) read the pre-portal trips_day_stage frame while
  the flag is on, see their records.
  Reading guide and maintenance rules: docs/codebase/notes/portal-trips.md. The validate() token
  hashes the helper modules and the cordon helper modules the stage imports inside execute.
