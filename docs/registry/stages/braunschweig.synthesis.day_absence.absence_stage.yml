stage: braunschweig.synthesis.day_absence.absence_stage
title: General reporting-day absence state draw
layer: behavior
description: 'Draws EVERY enriched person''s reporting-day absence state -- present /
  absent_household / absent_individual -- from the two committed SrV 2023 aggregates (issue
  #370, ADR-0110), independent of employment, workplace assignment and the commute-day-state
  model (ADR-0104). Two stages: a household draw (whole-household absence share by size class)
  followed by an individual residual draw (per age band, corrected for what the household stage
  already realised in that band), so both the SrV per-band absence rates (4.98 % overall) and
  the SrV household clustering (55.8 % of absent persons live in a fully absent household) are
  reproduced. The individual residual draw is restricted to ELIGIBLE present persons (issue
  #388, ADR-0110 Amendment 1): household_size (unclipped member count) >=
  day_absence_individual_stage_min_household_size, CONFIGURED default 2 -- households of size 1
  skip the residual, since the household stage alone already realises their SrV person-level
  rate. Universe: every person in synthesis.population.enriched (no workplace or
  employment precondition, unlike braunschweig.synthesis.commute_day.state_stage). Output
  {"absence": DataFrame(person_id, household_id, day_absence_state, age_band,
  household_size_class, p_household, p_individual, reason), "diagnostics": dict} with EXACTLY
  one row per person. Config keys: day_absence_enabled, day_absence_household_stage_enabled,
  day_absence_max_band_deviation_pp, day_absence_individual_stage_min_household_size. With the
  flag false every person is present with reason "disabled", no reference file is read, but the
  frame''s schema and derived columns (age_band, household_size_class) stay identical to the ON
  path.'
lineage:
  type: braunschweig_new
  upstream: null
  notes: No eqasim precedent. Every rule lives in the pure module of the package (absence.py);
    the stage owns only the synpp plumbing, the reference loading and the deviation guard.
code:
- braunschweig/synthesis/day_absence/absence_stage.py
- braunschweig/synthesis/day_absence/absence.py
- braunschweig/calibration/srv_absence.py
pipelines:
  popsim_mid: active
  popsim_open: not_used
  simple_ipf_open: not_used
production: true
inputs:
- srv2023_absence_by_age_band
- srv2023_absence_household_by_size
features:
- general_day_absence
decisions:
- ADR-0110
notes: 'Config keys and defaults: day_absence_enabled (true, KEY_ENABLED), false leaves every
  person "present" and reads no reference file at all -- the byte-identical A/B this feature''s
  default-ON convention requires. day_absence_household_stage_enabled (true, KEY_HOUSEHOLD_STAGE)
  -- false runs an INDIVIDUAL-ONLY draw at the committed band rates with no household component
  at all (draw_absence''s household_stage=False path sets p_household to 0 for every household
  and skips the household draw entirely), the pre-registered sensitivity arm of ADR-0110 that
  measures the household stage''s own contribution to the clustering. day_absence_max_band_deviation_pp
  (1.0 percentage points, KEY_MAX_BAND_DEVIATION_PP) -- a band with at least
  MIN_PERSONS_FOR_BAND_GUARD (1,000) persons whose realised absence share deviates from the
  reference by more than this WARNS, naming the band, the two rates and the deviation; small
  bands are excluded from the guard because a few dozen draws around a ~2-8 % rate carry sampling
  noise well above 1 pp on their own. day_absence_individual_stage_min_household_size (issue
  #388, ADR-0110 Amendment 1, KEY_INDIVIDUAL_STAGE_MIN_HOUSEHOLD_SIZE) -- CONFIGURED default 2 in
  configs/base_bs.yml, validated by _validate_individual_stage_min_household_size as a genuine
  integer >= 1 (a bool or a non-integral float, e.g. 2.7, raises ValueError naming the key rather
  than silently truncating); the CODE default of draw_absence''s own keyword stays 1 so every
  existing direct caller of the pure module is unaffected unless it opts in via this stage. Gates
  eligibility for the individual residual stage: eligible = present & (household_size >=
  threshold), household_size being the UNCLIPPED member count, not the capped
  household_size_class. Logged per age band as "band b: realised x.xx% vs reference y.yy%
  (n=N, n_eligible=E)" (final-review fix wave, MINOR finding 5), per size class as "size k:
  realised x.xx% vs SrV y.yy% (delta z.zz pp, n=N)" (against draw_absence''s by_size_class
  diagnostic) and the ineligible share as "n/total (x.xx%) persons are present but ineligible
  for the individual stage (household size below
  day_absence_individual_stage_min_household_size=k)".

  Draw rule (absence.draw_absence): every household gets size_class = min(household size, 5)
  (household_size_class.HOUSEHOLD_SIZE_CLASS_TOP) via braunschweig.calibration.srv_absence
  .household_size_class; a uniform draw against the committed p_all_absent_by_size marks the
  WHOLE household absent_household. Every age band a (the seven bands of
  srv_absence.AGE_BAND_LABELS, computed by srv_absence.age_band) then gets a residual probability
  computed over the ELIGIBLE present-person pool only (issue #388: eligible = present &
  household_size >= day_absence_individual_stage_min_household_size). At the threshold''s CODE
  default of 1 every present person is eligible and the expression reduces to the PR #387 formula
  p_individual(a) = max(0, (r(a) - r_hh(a)) / (1 - r_hh(a))) (r(a) the committed reference rate,
  r_hh(a) the household stage''s own realised rate in that band, measured ON THE SAME DRAW), kept
  byte-identical in _residual_probability_legacy; at the CONFIGURED default of 2 (or any higher
  threshold) the general expression _residual_probability_eligible is used instead:
  clip((r(a) * n(a) - absent_hh_n(a)) / n_eligible(a), 0, 1), which is algebraically identical to
  the legacy formula whenever every present person is eligible. Every still-ELIGIBLE present
  person in the band is drawn absent_individual with that probability; the person draw vector
  itself is still drawn for EVERY person regardless of eligibility (a mask applied on top, never a
  re-draw), so the random stream a downstream person consumes never shifts merely because of who
  is eligible. A band whose ELIGIBLE pool is too small to cover the residual shortfall
  (target_n - absent_hh_n > n_eligible -- final-review fix wave, Important finding 1: this
  subsumes the earlier n_eligible == 0 -only check and additionally catches a PARTIALLY filled
  pool that still under-shoots after the residual clips to 1.0) logs a WARNING naming the band,
  target_n, absent_hh_n, n_eligible and the shortfall in persons, rather than silently
  under-shooting; n_bands_unreachable counts how many bands this happened to. An overshoot
  (r_hh(a) > r(a), checked directly rather than only via a negative
  residual, so a band FULLY absorbed by the household stage -- r_hh(a) == 1.0 -- is caught too,
  since the division-by-zero guard there would otherwise bypass the residual formula and silently
  skip the WARNING) sets the residual to 0 and logs a WARNING naming the band and both rates
  (AbsenceReference / _check_reference_coverage raise eagerly on construction if either committed
  table does not cover exactly its expected keys with every rate in [0, 1] -- a missing size class
  or age band never silently becomes a NaN residual). The single RNG stream
  (numpy.random.RandomState(random_seed + DAY_ABSENCE_SEED_OFFSET), DAY_ABSENCE_SEED_OFFSET =
  7351, verified free of collision with every other *_SEED_OFFSET / *_RNG_OFFSET constant in the
  repository before being fixed) draws households sorted by household_id then persons sorted by
  (household_id, person_id), one draw vector per stage, so the result is reproducible independent
  of the input frame''s row order.

  Guards and fallback rates, all logged and instrumented under the [day absence] tag: the two
  committed reference tables are validated for EXACT key coverage at load time
  (load_absence_reference / AbsenceReference.__post_init__), raising by name rather than mapping
  a missing band/size class to a silent NaN probability (CLAUDE.md "scalar-default-when-map-
  missing" anti-pattern); the per-band deviation guard above (day_absence_max_band_deviation_pp);
  the household-stage overshoot WARNING above; the individual-stage eligibility gate above
  (day_absence_individual_stage_min_household_size, issue #388). Diagnostics
  (absence.draw_absence, ON path): n_persons, n_households, n_absent_household,
  n_absent_individual, n_absent_total, share_absent_total,
  share_absent_in_fully_absent_households, n_bands_overshoot, n_bands_unreachable (issue #388,
  final-review fix wave: count of bands whose eligible pool was too small to cover the residual
  shortfall), household_stage (bool),
  individual_stage_min_household_size (int, issue #388), n_persons_ineligible_individual_stage
  (issue #388), by_band (per-band n, reference_rate, realised_household_rate, residual_p,
  realised_rate, n_eligible_present [issue #388]), by_size_class (per household_size_class 1..5,
  n, realised_rate, reference_rate and delta_pp against the newly committed
  p_absent_person_by_size [issue #388] -- REPORTED, not targeted; the model does not fit a
  per-size person-level absence rate within the eligible pool, see ADR-0110 Assumptions/
  Consequences and Amendment 1) -- plus the stage''s own enabled and n_band_guard_hits. OFF
  path: {"enabled": False} only.

  OFF-path schema stability (execute._disabled_frame): the disabled frame carries EVERY column
  of the enabled frame with the SAME dtypes, including age_band and household_size_class derived
  by the identical pure helpers (srv_absence.age_band / .household_size_class) the enabled path
  uses -- a consumer never has to branch on the flag to know what columns exist. Unlike the
  enabled path (which RAISES on a missing age, since a person that cannot be banded cannot be
  drawn), the disabled path logs a warning and leaves age_band as NaN for such persons rather than
  failing on data the enabled path would reject -- the OFF path must never fail where the ON path
  would.

  The cache token (validate()) is an md5 of TWO pure modules'' sources, not the absence module
  alone (final-review fix wave, Important finding 3): synpp hashes only absence_stage.py itself,
  so an edit to either helper module would otherwise leave a stale cached output in place. The
  draw module absence.py owns the household/individual composition and the overshoot guard; the
  band edges/labels and the household-size-class top -- what a person is drawn AGAINST -- live in
  braunschweig.calibration.srv_absence (AGE_BAND_LABELS, AGE_BAND_EDGES,
  HOUSEHOLD_SIZE_CLASS_TOP, age_band, household_size_class), so an edit there must devalidate the
  stage just as much as an edit to absence.py -- the same mechanism as
  braunschweig.synthesis.commute_day.state_stage.validate.

  Composition with the commute-day-state model (ADR-0104): this stage''s output is INDEPENDENT of
  braunschweig.synthesis.commute_day.state_stage''s draw -- neither reads the other''s output, and
  a person can be both a commute-day "absent" far commuter and a general-absence
  absent_household/absent_individual at once. The UNION is composed downstream, in
  braunschweig.synthesis.commute_day.plan_replacement.build_day_trips''s general_absence keyword
  (stage record synthesis.population.trips.final), never here.

  popsim_open and simple_ipf_open declare day_absence_enabled: false in their committed fixtures
  (configs/fixtures/config_popsim_open_braunschweig.yml,
  configs/fixtures/config_smoke_popsim_open_mini.yml) for the same reason as
  commute_day_state_enabled: neither fixture aliases synthesis.population.trips.final to a
  day-absence-aware stage at all (the popsim_mid-only .final aliases point straight at
  braunschweig.popsim.trips_stage there), so this stage never enters either pipeline''s DAG --
  not_used there is the DAG''s own statement, not merely an unexercised default. Evidence:
  tests/test_srv_absence.py (the raw-table extraction rules), tests/test_day_absence.py (the pure
  draw_absence rules: household/individual composition, the overshoot guard, determinism,
  reference-coverage validation) and tests/test_day_absence_stage.py (the stage''s configure/
  execute wiring, the OFF path''s schema-identical frame, the validate() token).'
