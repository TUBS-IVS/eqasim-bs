stage: braunschweig.synthesis.student_incommuters
title: Student in-commuters
layer: cordon
description: "Adds university student in-commuters from LSN enrollment with DESTATIS origin structure
  (#140). Since ADR-0172 (#467) the student days are re-drawn from the donor pool until they fit the effective
  bound (braunschweig.incommuters.time_redraw_max_attempts, shared key, ASSUMPTION; value in configs/base_bs.yml); the whole-day shift of ADR-0154
  is the counted last resort. Since ADR-0173 (#528) the pt days are checked against the timetable with the chain
  of the commuter in-commuters (braunschweig.synthesis.incommuter_pt_connections.check_pt_days, the same switch
  braunschweig.incommuters.pt_connection_check.enabled): the whole day moves first, else the student drives from
  its home; counted and logged, reported as pt_connection. The stage therefore depends on the eqasim jar, the Java
  runtime and the supply stages. The household car_availability of a student follows its mode, and the student
  carries the household of its MiD donor, drawn weighted, by commute length and by the income level of the
  origin Kreis (braunschweig.student_incommuters.donor_min_effective_pool, ASSUMPTION; report key donor_draw),
  ADR-0191 decisions 6 and 7. With braunschweig.students.flows_enabled (default on, issue #140 Phase 4,
  ADR-0213) the count and the origin come from the outside rows of the origin-destination table T times
  the effective day factor and the sampling rate, per origin Kreis and site, rounded with the margins kept;
  each agent carries its site (destination_id), a building of the site drawn by capacity, the commute length
  T implies (home_branch records the home rule per agent), and a car or public-transport mode from the
  students' mode table by distance band with thin bands pooled. The residual count and the reverse decay are
  the OFF path."
