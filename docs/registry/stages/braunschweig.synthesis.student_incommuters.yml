notes: |-
  ON path of braunschweig.students.flows_enabled: the effective day factor is the level-weighted mean of the
  residents' factors, read from the level table and the committed SrV tables (never typed into the
  configuration); the stage refuses the flows with the day absence on and its student cells off
  (check_flow_settings). Config keys: the student flows block of configs/base_bs.yml. Rate logs under the
  [student_incommuters:flows] tag: the commute length (primary: commune curve; fallback: the distance of the
  cell of T) and the home rule per origin Kreis.
