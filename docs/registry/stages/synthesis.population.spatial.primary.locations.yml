stage: synthesis.population.spatial.primary.locations
title: Primary location assignment
layer: education
description: 'Primary (work/education) location assignment: with education gravity ON it resolves
  to braunschweig.locations.synthesis.replacement_education_gravity (gravity schools/Kita/uni),
  else to the upstream replacement sampler.'
lineage:
  type: overridden
  upstream: synthesis.population.spatial.primary.locations
  notes: Upstream eqasim stage name; the config alias table substitutes the regional implementation
    per workflow (see resolves_to).
code:
- synthesis/population/spatial/primary/locations.py
- braunschweig/locations/synthesis/replacement_education_gravity.py
- eqasim_common/locations/synthesis/replacement.py
pipelines:
  popsim_mid: active
  popsim_open: active
  simple_ipf_open: active
production: true
resolves_to:
  popsim_mid: braunschweig.locations.synthesis.replacement_education_gravity
  popsim_open: braunschweig.locations.synthesis.replacement_education_gravity
  simple_ipf_open: eqasim_common.locations.synthesis.replacement
features:
- education_gravity
- primary_location_far_class_rank
decisions:
- ADR-0164
notes: >-
  Work locations (and education on the base path) are handed to the persons of an origin zone in two classes since
  ADR-0164 (#465): the locations beyond primary_location_far_class_min_distance_m (30 km from the zone mean home) by
  rank to the longest donor commuters, the rest by the upstream greedy; primary_location_far_class_rank false is the
  upstream greedy. The stage logs the assignment quality per purpose under [primary locations].
