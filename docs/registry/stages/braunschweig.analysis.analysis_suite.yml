stage: braunschweig.analysis.analysis_suite
title: Analysis suite
layer: analysis
description: 'Post-run analysis driver: dashboard, MiD validation, population validation; excludes
  the freight subpopulation from person KPIs. Reads MATSim outputs from the <output_path>/matsim_output
  archive (config-derived, ADR-0101), never via a matsim.simulation.run stage edge. The sub-analysis
  stuck_agents (flag analysis_stuck_agents, default on, runs before the dashboard on the same MATSim
  readiness) writes <output_path>/analysis/stuck/stuck_agents.csv (one row per stuck event: person, time,
  leg_mode, link, subpopulation, frozen, at_end) and stuck_summary.json (the stuck agents of the final
  iteration by subpopulation x at the simulation end / during the day x mode x frozen tour); the same
  summary is the additive stuck block of the dashboard matsim metrics. It warns when more than
  STUCK_WARN_SHARE (0.01, an ASSUMPTION, ADR-0146) of the residents is stuck; it has no reference value.'
lineage:
  type: braunschweig_new
  upstream: null
  notes: null
code:
- braunschweig/analysis/analysis_suite.py
- braunschweig/analysis/matsim_archive.py
- braunschweig/analysis/stuck_agents.py
- braunschweig/analysis/dashboard/run_metrics.py
pipelines:
  popsim_mid: active
  popsim_open: not_used
  simple_ipf_open: not_used
production: true
features:
- freight_analysis_exclusion
- plan_feasibility_check
decisions:
- ADR-0031
- ADR-0101
- ADR-0146
