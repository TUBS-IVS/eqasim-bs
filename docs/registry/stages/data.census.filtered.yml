stage: data.census.filtered
title: Population synthesis producer
layer: population
description: 'THE population-method seam: upstream''s filtered census becomes the synthetic household/person
  producer. popsim_mid/popsim_open resolve it to braunschweig.popsim.stage (PopulationSim at the
  Zensus grid), simple_ipf_open to braunschweig.ipf.attributed (in-house IPF).'
lineage:
  type: overridden
  upstream: data.census.filtered
  notes: Upstream eqasim stage name; the config alias table substitutes the regional implementation
    per workflow (see resolves_to).
code:
- braunschweig/ipf/attributed.py
- braunschweig/popsim/stage/
- braunschweig/popsim/ownership_grid.py
- braunschweig/popsim/employment_grid.py
- braunschweig/popsim/zensus_employment_age.py
- braunschweig/popsim/building_type_targets.py
- braunschweig/popsim/tenure_targets.py
- braunschweig/popsim/seed_contract.py
- braunschweig/popsim/input_consistency.py
- braunschweig/popsim/input_consistency_guard.py
- braunschweig/popsim/employment_level.py
- braunschweig/popsim/minor_child_targets.py
- braunschweig/popsim/household_less_cells.py
pipelines:
  popsim_mid: active
  popsim_open: active
  simple_ipf_open: active
production: true
resolves_to:
  popsim_mid: braunschweig.popsim.stage
  popsim_open: braunschweig.popsim.stage
  simple_ipf_open: braunschweig.ipf.attributed
inputs:
- zensus2022_grid_cells
- cleancensus_kreis_controls
- mid2023_b1
- srv2023_reference_tables
- mid2023_cars_by_rs7_haustyp
- mid2023_bikes_by_rs7_haustyp
- zensus2022_employed_by_age_kreis
features:
- mid_passenger_availability
- age_aware_composition
- diary_plan_match
- employment_grid_control
- home_closure_model
- housing_tenure
- income_spatial_tilt
- ipf_synthesis_legacy
- kreis_income_control
- minor_child_family_controls
- ownership_grid_1km
- escort_passive_from_adult
- participation_universe_controls
- placement_income_l2
- popsim_data_dictionary
- popsim_method
- purpose_main_fold_code_10
- sex_aware_couples
- srv_participation_controls
- tier3_kreis_controls
decisions:
- ADR-0121
- ADR-0002
- ADR-0092
- ADR-0106
- ADR-0108
- ADR-0109
- ADR-0111
- ADR-0112
- ADR-0126
- ADR-0137
- ADR-0192
- ADR-0193
- ADR-0198
- ADR-0199
- ADR-0200
- ADR-0201
- ADR-0202
- ADR-0203
- ADR-0204
notes: >-
  DONOR RESOLUTION ONCE (ADR-0192): donor household counts and donor person attributes with
  imputed codes are resolved once, before the seed, and inherited by the clones.
  BATCH OUTPUT REUSE (ADR-0193): the output of a PopulationSim batch in the work dir is reused
  only for the input files it was built from (braunschweig.popsim.batch.reconcile_batch_outputs).
  RESOURCE-ADAPTIVE CONFIGURATION (ADR-0126, feature record resource_adaptive_config):
  the popsim_mid/popsim_open producer (braunschweig.popsim.stage) now clamps
  braunschweig.population.popsim.num_workers against the MACHINE's memory budget (since issue
  #656 minus this process's live resident memory, as for the chainsolver pool) at
  its point of use (_read_batching_and_scope_config,
  braunschweig/resources.py::effective_popsim_workers), bounded by an assumed per-worker
  memory via braunschweig.population.popsim.worker_memory_gb (default 30 GB, attributed
  to the 2026-07-10 OOM post-mortem; see DEFAULT_POPSIM_WORKER_MEMORY_GB). The clamp is operational only
  (PopulationSim submits one independent subprocess per batch folder with no
  worker-index-dependent seed) and never rewrites the configured value, so this
  stage's synpp cache hash is unaffected by the clamp itself. It IS affected,
  permanently, by a second consequence: braunschweig/resources.py is now listed in
  this stage's _DEFERRED_HELPER_MODULE_NAMES (its validate() source-hash token),
  because the worker-count resolution is a direct dependency of this stage's result
  -- so any future edit to resources.py, including a docstring-only change,
  invalidates the cached PopulationSim output and forces a recompute (a deliberate
  consequence of the repository's import-site cache-boundary rule, see ADR-0126
  Consequences and validate()'s own docstring, not a bug). On the server measured for
  ADR-0126 (94 GB -> 86 GB budget, 30 GB/worker), every overlay pinning num_workers: 3
  clamps to 2 and smoke_kreis_control_fit.yml's num_workers: 4 clamps to 2 as well -- a
  material, expected drop in parallelism on this stage, not yet exercised in a
  real-machine smoke (see the Feature Registry's validation.note). These clamps are those of
  the code default of 30 GB per worker; since issue #656 configs/base_bs.yml sets a smaller
  worker_memory_gb (see RUN TIME AND MEMORY OF A BATCH below), against which the overlay ceilings
  (values in configs/overlays/*.yml) are resolved; with the run-time options not both on the code
  default applies again (braunschweig.resources.popsim_worker_memory_gb).


  SETTINGS/GEOGRAPHY FAIL-FAST: before any batch folder is written or any PopulationSim
  subprocess starts, this stage validates the file at
  braunschweig.population.popsim.settings_path against the rendered controls frame
  (braunschweig.popsim.folders.validate_settings_geographies) and RAISES when the settings
  declare no "geographies" list or omit a geography the control set uses. The settings file is a
  LOCAL-ONLY path outside this repository and was previously copied into every batch folder as
  raw text with nothing relating it to the control set. PopulationSim itself DOES reject the
  mismatch -- populationsim.steps.setup_data_structures raises
  RuntimeError("unknown geography column '<geo>' in control file") -- so no run ever produced a
  silently under-constrained population: a mismatched pair CRASHES. What the guard changes is
  WHEN and HOW: the failure moved from late inside a worker subprocess, after the batch folders
  were written, with a message naming neither the settings file nor the fix, to a fail-fast in
  this stage naming the missing level, the number of controls at it, and what the settings do
  declare. The case that motivated
  the guard: the per-Kreis attribute controls (kreis_attribute_control.REGISTRY) default ON and
  render at the KREIS geography, which the 4-level settings file (WELT > STAAT > ZENSUS1km >
  ZENSUS100m) does not declare, so any local popsim_mid run from the committed fixture configs
  aborted in a PopulationSim worker; those configs therefore now point at the 5-level file. The
  production config (configs/base_bs.yml) was never affected -- its 100 % runs completed, which a
  geography mismatch makes impossible. KREIS controls are MiD-only, so popsim_open runs are
  unaffected either way.
  Two plan-structure flags are declared and read HERE as well as in the stages that own them
  (#365 / #367): braunschweig.population.popsim.diary_plan_match arms the guard that RAISES if a
  resolved plan source still carries MiD anzwege1 803/804 after the diary match (a silent
  regression would otherwise be invisible, because the imputed seed keeps hitting its target),
  and braunschweig.population.popsim.trip_class_seed_counts_closure makes the trip_class seed
  count the closed day (anzwege1 + 1 for an open-ended source, clipped at 50). Both reach only the
  member-completion branch of the seed build, which is the only one carrying the src_* plan-source
  facts they need; the ENTD branch and the legacy load_mid_seed branch keep their previous seed
  byte-identically. Declaring the keys here means THIS stage's cache hash tracks them.
  PARTICIPATION-UNIVERSE CONTROLS (#368, ADR-0109, feature participation_universe_controls): four
  more toggles are declared and read here --
  braunschweig.population.popsim.work_by_employment_kreis_control (default "on") with
  .work_participation_kreis_control (now "off"), and .education_by_age_kreis_control (default "on",
  ONE toggle for the three age-range entries education_0_5 / education_6_17 / education_18plus)
  with .education_participation_kreis_control (now "off"). Enabling a replacement together with its
  predecessor, or a replacement while .employment_status_kreis_control is off, RAISES at config
  time in source_resolution.active_kreis_entries and names both keys in full. Two further keys the
  stage did NOT declare before are declared now, because the new seed columns must count exactly
  the legs the trip build keeps and map education exactly as the trip build maps it:
  .exclude_rbw_legs and .escort_passive_education (the same keys and defaults
  braunschweig.popsim.trips_stage / braunschweig.popsim.completed_donor declare) -- which means
  changing either now invalidates THIS stage's cache as well, intended, because both change the
  seed. The two seed columns (work_by_employment, education_flag) are derived on both MiD seed
  paths only when a universe entry is active; every Kreis attribute control is empty for a non-MiD
  source, so the ENTD path is untouched.


  PURPOSE CORRECTNESS (issues #373 / #372, ADR-0111 / ADR-0112, feature records
  purpose_main_fold_code_10 and escort_passive_from_adult): four more keys are declared and read
  here for the SAME seed-vs-plan reason -- w_zweck_10_as_leisure, escort_passive_from_adult,
  escort_passive_pair_max_gap_minutes and escort_passive_pair_adult_min_age_years (unit: years,
  default 18, production 18, the pairing's accompanying-adult floor, byte-identical pre-amendment --
  ADR-0112 2026-09-17 amendment, issue #409), the same unprefixed keys and the same defaults
  braunschweig.popsim.trips_stage declares, imported from braunschweig.popsim.stage.config_keys.
  The leisure_participation control's seed must count W_ZWECK 10 as leisure exactly when the trip
  build does, and the education_flag seed must count exactly the W_ZWECK-13 legs the trip build
  realises as education: mid.participation.derive_education_flag_seed therefore runs the SAME
  pairing and the SAME purpose rule, on the SAME leg universe --
  _wege_without_non_education_passive_legs reduces the raw frame with
  trips.legs_kept_by_the_trip_build (the one definition of the rbW and leading-arrive-home drops)
  BEFORE pairing, so a leg the trip build drops also leaves the ADULT candidate pool, and
  drop_leading_arrive_home_leg is threaded into that path as
  education_flag_drop_leading_arrive_home_leg (spelled distinctly from the trip_class derivation's
  parameter of the same config key, documented at both ends). Both seed columns therefore change
  when either flag changes, which is why THIS stage's cache -- and with it the PopulationSim run --
  is invalidated by them, intended. braunschweig.popsim.escort_pairing is listed in
  _DEFERRED_HELPER_MODULE_NAMES (the third second-level exception validate() names, with the same
  standard of evidence as the other two) so an edit to the pairing rule cannot be served from a
  stale seed cache.

  POPULATIONSIM FORK AND SOLVER PATH (#645, ADR-0199, note populationsim-fork.md): the stage runs
  PopulationSim from the tracked uv project environments/populationsim and requires the key
  braunschweig.population.popsim.populationsim_version (checked by braunschweig.popsim.tool_version).
  It sets the fork's integerizer options from braunschweig.population.popsim.keep_fractional_sample_weights,
  .integerizer_draw and .integerizer_timeout_s (one seed per batch, braunschweig.popsim.folders), and
  gates the fork's solver-path record with .solver_fallback_error_rate
  (braunschweig.popsim.stage.solver_path_gate; null = warn only). Key meanings: config_keys.py.
  The batch signature includes the tool version and the options, so the first run after this change
  recomputes existing work dirs.
  CONTROLLED ROUNDING (#646, ADR-0201, note populationsim-fork.md): the keys
  braunschweig.population.popsim.integerizer_rounding, .integerizer_controlled_method and their option
  keys set the rounding of the fork's simultaneous integerizer (fork release 0.10.0+bs.2). With
  "controlled" the solver-path gate also requires every batch to prove from its record that the
  controlled path ran, and warns about households the method could not place. Evidence, and the one
  pre-registered check that was missed: run manifest popsim-ladder-arm3-2026-11-18.
  RUN TIME AND MEMORY OF A BATCH (#656, ADR-0200, note populationsim-fork.md): the keys
  braunschweig.population.popsim.store_positive_weight_rows_only and .fast_paths switch on two fork
  settings that left the synthetic population unchanged in the evidence runs (three batches on one
  machine: run manifest popsim-run-performance-2026-11-18); the stage refuses them against a fork
  older than 0.10.0+bs.2 and reports the rate of balancer calls the fast kernels answered
  (braunschweig.popsim.stage.fast_path_rate). Both are on in production; with them the config sets
  .worker_memory_gb and the 100 % overlay a higher num_workers ceiling (values and their reasoning:
  configs/base_bs.yml and configs/overlays/test_100pct.yml).
  SEED RESOLUTION AND HOUSEHOLD-BASED BUILDING-TYPE TARGETS: rules and keys are in ADR-0198
  (keys in configs/base_bs.yml and braunschweig/popsim/stage/config_keys.py); the log tags are
  in the code that logs them (braunschweig.popsim.attributes, building_type_targets,
  seed_contract).
  KREIS INPUT CONSISTENCY (#658, ADR-0203, note popsim-input-consistency.md; features tier3_kreis_controls,
  ownership_grid_1km, employment_grid_control): the keys braunschweig.population.popsim.kreis_batch_apportionment,
  .kreis_controls_follow_grids, .employment_level_source, .kreis_fine_tolerance and .kreis_fine_min_persons
  split the KREIS controls of a batch by their own age universe, set the KREIS car, bicycle and employed
  targets to the sums of the finer-level controls, and put the Zensus count under every employment control
  (production values: configs/base_bs.yml; meaning and valid values: braunschweig/popsim/stage/config_keys.py).
  The guard braunschweig.popsim.input_consistency_guard raises before any PopulationSim process starts when a
  pair differs by more than the bounds of the last two keys, and writes <work_dir>/popsim_input_consistency.csv
  (one row per batch, Kreis part and pair/check); the report file census_filtered_report.json carries the entry
  kreis_input_consistency. Evidence and the accepted check miss: ADR-0203 and the run records
  popsim-input-consistency-2026-11-18 and popsim-ladder-inputs-a-2026-11-18.
  TENURE RULE (#657, ADR-0202, feature housing_tenure): the keys
  braunschweig.population.popsim.tenure_owner_limited_to_dwellings and
  .tenure_min_households_outside_dwellings (values: configs/base_bs.yml) switch on and parameterise the
  limit of the owner targets to the dwellings of the rooms table (braunschweig.popsim.tenure_targets).
  While the key is on, the stage reads one more cell column, control_spec.OWNER_QUOTE_DWELLING_COLUMN.
  On every run it writes the report file census_filtered_report.json (CENSUS_FILTERED_REPORT_FILE): the
  counts of the ZGB cell filter, the building-type rescale and the tenure rule, each with a status
  (disabled when its key is off). Rule, evidence and the accepted check miss: ADR-0202 and its run record.
  HOUSEHOLD UNIVERSES (#659, ADR-0204, note popsim-input-consistency.md; feature popsim_method):
  the keys braunschweig.population.popsim.move_persons_of_household_less_cells,
  .household_less_cell_max_persons and .family_controls (values: configs/base_bs.yml; meaning and valid
  values: braunschweig/popsim/stage/config_keys.py) move the persons of household-less 100 m cells to the
  household cells of their square (braunschweig.popsim.household_less_cells) and replace the four 100 m
  family-type controls by two under-18 household controls (braunschweig.popsim.minor_child_targets, seed
  column hh_minor_class from seed.derive_hh_minor_class). While family_controls is minor_child_1km the stage
  also reads the prepared 1 km grid at braunschweig.population.popsim.cells_1km_path. The report file
  census_filtered_report.json carries the sections household_less_cells and family_controls (counts,
  fallback squares and rates are written there, not repeated here). The batch diagnostics table
  household_composition.csv (braunschweig.analysis.popsim_batch_diagnostics.composition) reads the result.
  Decision and current state: ADR-0204 (feature minor_child_family_controls); evidence: the
  pre-registered run record popsim-ladder-inputs-b-2026-11-19.
