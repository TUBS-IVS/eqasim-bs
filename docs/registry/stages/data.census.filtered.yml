stage: data.census.filtered
title: Population synthesis producer
layer: population
description: 'THE population-method seam: upstream''s filtered census becomes the synthetic household/person
  producer. popsim_mid/popsim_open resolve it to braunschweig.popsim.stage (PopulationSim at the
  Zensus grid), simple_ipf_open to braunschweig.ipf.attributed (in-house IPF).'
lineage:
  type: overridden
  upstream: data.census.filtered
  notes: Upstream eqasim stage name; the config alias table substitutes the regional implementation
    per workflow (see resolves_to).
code:
- data/census/filtered.py
- braunschweig/ipf/attributed.py
- braunschweig/popsim/stage/
- braunschweig/popsim/ownership_grid.py
pipelines:
  popsim_mid: active
  popsim_open: active
  simple_ipf_open: active
production: true
resolves_to:
  popsim_mid: braunschweig.popsim.stage
  popsim_open: braunschweig.popsim.stage
  simple_ipf_open: braunschweig.ipf.attributed
inputs:
- zensus2022_grid_cells
- cleancensus_kreis_controls
- mid2023_b1
- srv2023_reference_tables
- mid2023_cars_by_rs7_haustyp
- mid2023_bikes_by_rs7_haustyp
features:
- age_aware_composition
- diary_plan_match
- home_closure_model
- housing_tenure
- income_spatial_tilt
- ipf_synthesis_legacy
- kreis_income_control
- ownership_grid_1km
- escort_passive_from_adult
- participation_universe_controls
- placement_income_l2
- popsim_method
- purpose_main_fold_code_10
- sex_aware_couples
- srv_participation_controls
- tier3_kreis_controls
decisions:
- ADR-0002
- ADR-0092
- ADR-0106
- ADR-0108
- ADR-0109
- ADR-0111
- ADR-0112
notes: >-
  SETTINGS/GEOGRAPHY FAIL-FAST: before any batch folder is written or any PopulationSim
  subprocess starts, this stage validates the file at
  braunschweig.population.popsim.settings_path against the rendered controls frame
  (braunschweig.popsim.folders.validate_settings_geographies) and RAISES when the settings
  declare no "geographies" list or omit a geography the control set uses. The settings file is a
  LOCAL-ONLY path outside this repository and was previously copied into every batch folder as
  raw text with nothing relating it to the control set, so a mismatch surfaced only inside a
  subprocess -- or not at all, the controls simply never being balanced. The case that motivated
  the guard: the per-Kreis attribute controls (kreis_attribute_control.REGISTRY) default ON and
  render at the KREIS geography, which the 4-level settings file (WELT > STAAT > ZENSUS1km >
  ZENSUS100m) does not declare; the committed popsim_mid fixture configs therefore point at the
  5-level file. KREIS controls are MiD-only, so popsim_open runs are unaffected.
  Two plan-structure flags are declared and read HERE as well as in the stages that own them
  (#365 / #367): braunschweig.population.popsim.diary_plan_match arms the guard that RAISES if a
  resolved plan source still carries MiD anzwege1 803/804 after the diary match (a silent
  regression would otherwise be invisible, because the imputed seed keeps hitting its target),
  and braunschweig.population.popsim.trip_class_seed_counts_closure makes the trip_class seed
  count the closed day (anzwege1 + 1 for an open-ended source, clipped at 50). Both reach only the
  member-completion branch of the seed build, which is the only one carrying the src_* plan-source
  facts they need; the ENTD branch and the legacy load_mid_seed branch keep their previous seed
  byte-identically. Declaring the keys here means THIS stage's cache hash tracks them.
  PARTICIPATION-UNIVERSE CONTROLS (#368, ADR-0109, feature participation_universe_controls): four
  more toggles are declared and read here --
  braunschweig.population.popsim.work_by_employment_kreis_control (default "on") with
  .work_participation_kreis_control (now "off"), and .education_by_age_kreis_control (default "on",
  ONE toggle for the three age-range entries education_0_5 / education_6_17 / education_18plus)
  with .education_participation_kreis_control (now "off"). Enabling a replacement together with its
  predecessor, or a replacement while .employment_status_kreis_control is off, RAISES at config
  time in source_resolution.active_kreis_entries and names both keys in full. Two further keys the
  stage did NOT declare before are declared now, because the new seed columns must count exactly
  the legs the trip build keeps and map education exactly as the trip build maps it:
  .exclude_rbw_legs and .escort_passive_education (the same keys and defaults
  braunschweig.popsim.trips_stage / braunschweig.popsim.completed_donor declare) -- which means
  changing either now invalidates THIS stage's cache as well, intended, because both change the
  seed. The two seed columns (work_by_employment, education_flag) are derived on both MiD seed
  paths only when a universe entry is active; every Kreis attribute control is empty for a non-MiD
  source, so the ENTD path is untouched.


  PURPOSE CORRECTNESS (issues #373 / #372, ADR-0111 / ADR-0112, feature records
  purpose_main_fold_code_10 and escort_passive_from_adult): three more keys are declared and read
  here for the SAME seed-vs-plan reason -- w_zweck_10_as_leisure, escort_passive_from_adult and
  escort_passive_pair_max_gap_minutes, the same unprefixed keys and the same defaults
  braunschweig.popsim.trips_stage declares, imported from braunschweig.popsim.stage.config_keys.
  The leisure_participation control's seed must count W_ZWECK 10 as leisure exactly when the trip
  build does, and the education_flag seed must count exactly the W_ZWECK-13 legs the trip build
  realises as education: mid.participation.derive_education_flag_seed therefore runs the SAME
  pairing and the SAME purpose rule, on the SAME leg universe --
  _wege_without_non_education_passive_legs reduces the raw frame with
  trips.legs_kept_by_the_trip_build (the one definition of the rbW and leading-arrive-home drops)
  BEFORE pairing, so a leg the trip build drops also leaves the ADULT candidate pool, and
  drop_leading_arrive_home_leg is threaded into that path as
  education_flag_drop_leading_arrive_home_leg (spelled distinctly from the trip_class derivation's
  parameter of the same config key, documented at both ends). Both seed columns therefore change
  when either flag changes, which is why THIS stage's cache -- and with it the PopulationSim run --
  is invalidated by them, intended. braunschweig.popsim.escort_pairing is listed in
  _DEFERRED_HELPER_MODULE_NAMES (the third second-level exception validate() names, with the same
  standard of evidence as the other two) so an edit to the pairing rule cannot be served from a
  stale seed cache.
