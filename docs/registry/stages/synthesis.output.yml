stage: synthesis.output
title: Synthesis output writer
layer: infrastructure
description: 'Writes the unified population/trips/locations output (CSV/parquet + meta); the terminal
  synthesis stage. In the production config it resolves to
  braunschweig.synthesis.commute_day.output_day (ADR-0104, issue #244), which runs the SAME
  vendored writer on the REPORTING-DAY trips/activities (.final) and merges the drawn
  commute_day_state into the persons frame so it is exported through the existing optional-column
  mechanism (PERSON_OPTIONAL_OUTPUT_COLUMNS, appended last; empty for persons without an assigned
  workplace). With commute_day_state_enabled false the enriched frame is passed through untouched
  and the column set stays byte-identical. Since issue #370 (ADR-0110) the SAME optional-column
  mechanism, gated by its own independent flag day_absence_enabled, additionally merges in
  day_absence_state from braunschweig.synthesis.day_absence.absence_stage (present for EVERY
  person, unlike commute_day_state''s worker-only coverage); composition rule and evidence are in
  the feature record general_day_absence and the note
  docs/codebase/notes/day-absence-state.md, not repeated here.'
lineage:
  type: overridden
  upstream: synthesis.output
  notes: Upstream eqasim stage name; the config alias table substitutes the regional implementation
    per workflow (see resolves_to), the same pattern as
    synthesis.population.spatial.primary.locations.
code:
- synthesis/output.py
- braunschweig/synthesis/commute_day/output_day.py
pipelines:
  popsim_mid: active
  popsim_open: active
  simple_ipf_open: active
production: true
resolves_to:
  popsim_mid: braunschweig.synthesis.commute_day.output_day
  popsim_open: synthesis.output
  simple_ipf_open: synthesis.output
features:
- commute_day_state
- rbw_leg_convention
- general_day_absence
decisions:
- ADR-0104
- ADR-0110
