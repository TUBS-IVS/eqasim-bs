stage: braunschweig.analysis.cordon_validation
title: Cordon validation
layer: validation
description: 'Per-gate validation outputs (CSV/GPKG) for the injected cordon demand.
  Since ADR-0104 (issue #244, check 3) it also writes gate_volumes_scaled.csv when
  commute_day_state_enabled is on: the same per-gate BA SvB expectation with the OUTBOUND
  direction multiplied by the realised at_workplace share of EXTERNAL workers, beside the
  unscaled register expectation and with that share in the row, because the BA out-commuter
  volumes count every employee whose workplace lies outside the region whether or not they
  travel on a given day, whereas a synthetic worker drawn to home or absent makes no commute
  trip. INBOUND is deliberately not scaled (the injected in-commuters carry no reporting-day
  state). The unscaled gate_volumes.csv is unchanged, and with the flag off no scaled file is
  written at all. A population without a single external worker RAISES rather than being
  scaled by a factor no worker supports. The counts behind the factor -- external workers, of
  them at_workplace, workers with an unresolvable workplace, and BOTH drops of the state /
  work-location join -- are persisted beside it as commute_day_state_scaling.json (strict JSON,
  NaN written as null), so the evidence for check 3 survives the run log rather than living only
  in it.'
