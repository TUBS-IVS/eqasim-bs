stage: braunschweig.analysis.synthesis.commute_distance_by_kreis
title: Realised primary distances per Kreis vs SrV
layer: validation
description: 'Per home Kreis, compares the realised euclidean home->work / home->education
  distances (x detour factor) against the SrV 2023 band shares: EMD, SrV bootstrap noise floor,
  intra/inter-Gemeinde split for work, education by model age level, and the pre-registered gap
  rule (#358). Writes <output_path>/analysis/srv_distance_validation/. Config keys:
  srv_distance_detour_factor (default 1.3), srv_distance_emd_threshold (default 0.08),
  srv_distance_min_persons (default 200), srv_distance_output_subdir (default
  analysis/srv_distance_validation), srv_distance_max_unmatched_home_share (default 0.05, raises
  above), srv_distance_warn_unmatched_destination_share (default 0.30, warns above).'
lineage:
  type: braunschweig_new
  upstream: null
  notes: eqasim precedent analysis/synthesis/commute_distance (realised euclidean distance,
    20-point quantile curve) extended by per-Kreis band EMD and the decision rule.
code:
- braunschweig/analysis/synthesis/commute_distance_by_kreis.py
pipelines:
  popsim_mid: active
  popsim_open: supported
  simple_ipf_open: supported
production: true
features:
- srv_primary_distance_validation
