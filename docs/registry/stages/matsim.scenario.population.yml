stage: matsim.scenario.population
title: MATSim plans writer
layer: matsim
description: 'Writes plans.xml; the braunschweig wrapper adds cordon in-commuter injection and
  carless re-mode on top of the upstream writer. Since ADR-0104 (issue #244) the wrapper also
  replaces the pre-assignment trips/activities the upstream load_raw reads by the REPORTING-DAY
  views (synthesis.population.trips.final / ...activities.final) and, when
  commute_day_state_enabled is on, merges the drawn commute_day_state into the resident persons
  frame so add_person emits it as the person attribute commuteDayState (java.lang.String,
  additive via OPTIONAL_PERSON_FIELDS). The attribute is written ONLY for persons that have a
  state: persons without an assigned workplace and injected in-commuters carry no value and get
  no attribute, never a substituted one. With the flag off the state stage is not even declared
  and the plans are byte-identical. Since issue #370 (ADR-0110) the wrapper additionally merges
  the general day-absence draw (braunschweig.synthesis.day_absence.absence_stage, independent flag
  day_absence_enabled) into the resident persons frame the SAME way, so add_person emits
  dayAbsenceState for every RESIDENT person (unlike commuteDayState''s worker-only coverage);
  composition rule and evidence are in the feature record general_day_absence and the note
  docs/codebase/notes/day-absence-state.md, not repeated here. The wrapper gained a validate()
  (final-review fix wave, Important finding 8): an md5 over the vendored matsim.scenario.population
  writer''s source, so an edit to the VENDORED writer devalidates this stage''s synpp cache -- it
  previously had no validate() at all, leaving a stale cached plans.xml.gz in place after such an
  edit.'
lineage:
  type: overridden
  upstream: matsim.scenario.population
  notes: Upstream eqasim stage name; the config alias table substitutes the regional implementation
    per workflow (see resolves_to).
code:
- matsim/scenario/population.py
- braunschweig/matsim/scenario/population.py
pipelines:
  popsim_mid: active
  popsim_open: active
  simple_ipf_open: active
production: true
resolves_to:
  popsim_mid: braunschweig.matsim.scenario.population
  popsim_open: braunschweig.matsim.scenario.population
features:
- mid_passenger_availability
- carless_routing_remode
- rbw_leg_convention
- urban_parking
- general_day_absence
- portal_trips
decisions:
- ADR-0121
- ADR-0104
- ADR-0022
- ADR-0029
- ADR-0110
- ADR-0141
notes: >-
  PORTAL GATE MARKER (ADR-0141, issue #442, feature record portal_trips): the vendored writer
  matsim/scenario/population.py sets the Boolean (java.lang.Boolean) activity attribute portalGate=true on
  every activity written with the purpose outside, which only portal stays carry. It is an identification
  marker (it tells a portal gate from the outside activities of the cutter, for analyses); no Java code of
  the production configuration reads it, because the discrete mode choice already freezes the tours that
  touch an outside activity (ADR-0141, decision 6). Without outside activities the
  output is byte-identical. The writer also logs the car to car_passenger re-mode rate (the carless
  re-mode shim, now counted, with the share of portal legs among the re-moded legs).
