stage: synthesis.population.spatial.secondary.distance_distributions
title: Secondary distance CDFs
layer: secondary
description: 'Distance distributions for secondary legs: production resolves to the MiD purpose-resolved
  CDFs (braunschweig.popsim.distance_distributions, ADR-0026); popsim_open deliberately keeps
  the upstream ENTD CDFs (ENTD is its donor survey).'
lineage:
  type: overridden
  upstream: synthesis.population.spatial.secondary.distance_distributions
  notes: Upstream eqasim stage name; the config alias table substitutes the regional implementation
    per workflow (see resolves_to).
code:
- synthesis/population/spatial/secondary/distance_distributions.py
- braunschweig/popsim/distance_distributions.py
pipelines:
  popsim_mid: active
  popsim_open: active
  simple_ipf_open: active
production: true
resolves_to:
  popsim_mid: braunschweig.popsim.distance_distributions
features:
- escort_passive_from_adult
- purpose_main_fold_code_10
- secondary_distance_by_purpose
- w_zwd_codeplan_sentinels
decisions:
- ADR-0026
- ADR-0057
- ADR-0111
- ADR-0112
- ADR-0113
notes: >-
  PURPOSE CORRECTNESS (issues #373 / #372 / #242; ADR-0111 / ADR-0112 / ADR-0113): the production
  implementation braunschweig.popsim.distance_distributions declares and reads four keys of the
  purpose package, each imported from the shared constant pair in
  braunschweig.popsim.stage.config_keys rather than retyped. Three of them are the trip-build flags
  the stage must agree with, because it maps the donor legs' purposes ITSELF (run()'s purpose
  harmonisation calls the same trips.map_purpose): w_zweck_10_as_leisure (so the leisure distance
  layer contains the same legs the plan labels leisure), escort_passive_from_adult and
  escort_passive_pair_max_gap_minutes (so a passive escort leg contributes its PAIRED purpose's
  layer instead of the education layer). The fourth, purpose_subtype_codeplan_sentinels, is shared
  with braunschweig.synthesis.locations.secondary_chainsolvers and governs run()'s steps 8/9: the
  leisure and other-errand subtype donor pools are built through
  purpose_subtype.leisure_spec(...).groups / other_errand_spec(...).groups, so the no-detail codes
  W_ZWD 799/699 leave the donor pool exactly when the chainsolver decider stops labelling legs into
  their group -- threading only one of the two would make the stages disagree about what
  leisure_activity means. Known gap, NOT fixed by this package: this stage has NO validate(), so its
  synpp cache token covers only the resolved values of its declared config keys and its own module
  source, not an edit to a helper module it imports (trips.py, escort_pairing.py, purpose_subtype.py).
  Changing any of the four keys therefore DOES invalidate it; changing a rule inside those helpers
  without touching a declared value does not. Second known gap, also pre-existing and also NOT
  fixed here: this stage declares NEITHER braunschweig.population.popsim.exclude_rbw_legs NOR
  .drop_leading_arrive_home_leg, so its map_purpose call pairs passive escort legs on the
  UNFILTERED Wege frame while the trip build pairs on the filtered one. A passive leg whose nearest
  adult leg is an rbW summary leg or a leading arrive-home leg can therefore land in a different
  purpose's distance layer than the purpose the plan realises. The effect is bounded and small --
  6,386 pairs unfiltered vs 6,384 filtered on the weekday legs, measured 2026-09-10 while
  regenerating mid2023_escort_w_zweck_split.csv -- and it is proposed as an issue rather than
  changed here, because threading the two keys would widen this stage's declared key set.
