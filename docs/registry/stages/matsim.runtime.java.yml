stage: matsim.runtime.java
title: Java runtime probe
layer: infrastructure
description: Upstream Java runtime detection (JDK 25 via java_home for the eqasim-java fork). Its
  run() helper spawns every Java subprocess of the pipeline and guards it with the CPU-accumulation
  hang watchdog (ADR-0095, issue #330).
lineage:
  type: extended
  upstream: null
  notes: Inherited eqasim stage; its regional inputs/configuration differ from the Bavaria
    baseline, and the java.run helper was extended with the hang watchdog (ADR-0095) plus the
    two volatile config keys it reads.
code:
- matsim/runtime/java.py
- matsim/runtime/process_watchdog.py
- braunschweig/java_heap.py
pipelines:
  popsim_mid: active
  popsim_open: active
  simple_ipf_open: active
production: true
decisions:
- ADR-0126
notes: >-
  RESOURCE-ADAPTIVE CONFIGURATION (ADR-0126, feature record resource_adaptive_config):
  java.run's helper clamps the configured java_memory against the machine's detected
  memory budget MINUS the memory the driver process already holds, at the point of use
  (braunschweig/java_heap.py::effective_java_heap, driver-aware since 2026-11-04 / C2;
  the machine-only braunschweig/resources.py::effective_java_memory is still called by
  data/osm/osmosis.py) before it becomes the JVM's -Xmx argument -- e.g. the live
  2026-09-16 defect, java_memory: 100G configured on a 94 GB machine, clamps to 86G
  before the driver term. Operational only
  (the value only ever becomes -Xmx and cannot change any result), and the configured
  value is never rewritten, so this stage's cache hash -- inherited by every
  Java-dependent stage (network, routing, freight, MATSim) -- is unaffected by the
  clamping. The source of matsim/runtime/java.py is another matter: its semantic digest
  enters the validate() tokens of the stages that hash it, so a code edit here recomputes
  them (which stages and at what cost: docs/runs/prod100-java-heap-driver-rss-2026-11-04.yml;
  the rule: docs/codebase/notes/resource-budget.md); braunschweig/java_heap.py declares
  _SYNPP_TOKEN_EXEMPTION and enters no token.
