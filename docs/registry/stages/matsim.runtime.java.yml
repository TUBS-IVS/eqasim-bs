stage: matsim.runtime.java
title: Java runtime probe
layer: infrastructure
description: Upstream Java runtime detection (JDK 25 via java_home for the eqasim-java fork). Its
  run() helper spawns every Java subprocess of the pipeline and guards it with the CPU-accumulation
  hang watchdog (ADR-0095, issue #330).
lineage:
  type: extended
  upstream: null
  notes: Inherited eqasim stage; its regional inputs/configuration differ from the Bavaria
    baseline, and the java.run helper was extended with the hang watchdog (ADR-0095) plus the
    two volatile config keys it reads.
code:
- matsim/runtime/java.py
- matsim/runtime/process_watchdog.py
pipelines:
  popsim_mid: active
  popsim_open: active
  simple_ipf_open: active
production: true
decisions:
- ADR-0126
notes: >-
  RESOURCE-ADAPTIVE CONFIGURATION (ADR-0126, feature record resource_adaptive_config):
  java.run's helper clamps the configured java_memory against the machine's detected
  memory budget at the point of use (braunschweig/resources.py::effective_java_memory)
  before it becomes the JVM's -Xmx argument -- e.g. the live 2026-09-16 defect,
  java_memory: 100G configured on a 94 GB machine, clamps to 86G. Operational only
  (the value only ever becomes -Xmx and cannot change any result), and the configured
  value is never rewritten, so this stage's cache hash -- inherited by every
  Java-dependent stage (network, routing, freight, MATSim) -- is unaffected.
