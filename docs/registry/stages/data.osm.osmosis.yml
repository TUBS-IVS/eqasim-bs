notes: >-
  RESOURCE-ADAPTIVE CONFIGURATION (ADR-0126, feature record resource_adaptive_config):
  this stage's osmosis JAVACMD_OPTIONS clamps the configured java_memory against the
  machine's detected memory budget at the point of use
  (braunschweig/resources.py::effective_java_memory), the same mechanism and the same
  key as matsim.runtime.java. Operational only (the value only ever becomes -Xmx and
  cannot change any result), and the configured value is never rewritten, so this
  stage's cache hash is unaffected.
