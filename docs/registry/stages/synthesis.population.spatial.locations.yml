stage: synthesis.population.spatial.locations
title: Location join
layer: secondary
description: 'Upstream join of persons to their chosen activity locations. In the production
  config it resolves to braunschweig.synthesis.commute_day.spatial_locations_day (ADR-0104,
  issue #244), which runs the SAME vendored join on the REPORTING-DAY activities
  (synthesis.population.activities.final) -- the location rows must describe the activities the
  MATSim population is written from, and the reporting-day view removes the work activity of a
  home or absent worker and splices a donor day in its place. With commute_day_state_enabled
  false the .final alias is a pass-through, so the output is byte-identical.'
lineage:
