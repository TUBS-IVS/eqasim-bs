stage: synthesis.population.spatial.locations
title: Location join
layer: secondary
description: 'Upstream join of persons to their chosen activity locations. In the production
  config it resolves to braunschweig.synthesis.commute_day.spatial_locations_day (ADR-0104,
  issue #244), which runs the SAME vendored join on the REPORTING-DAY activities
  (synthesis.population.activities.final) -- the location rows must describe the activities the
  MATSim population is written from, and the reporting-day view removes the work activity of a
  home or absent worker and splices a donor day in its place. With commute_day_state_enabled
  false the .final alias is a pass-through, so the output is byte-identical. Since issue #679 (ADR-0207, feature
  record secondary_loop_zero_displacement) the day-view stage declares the loop switch and, with it on, adds the
  Boolean column is_out_and_back_stroll to its output (True on the activities the secondary location stage marked
  as out-and-back strolls, False on every other located activity); it raises when the secondary stage returns no such
  column or a marked row matches no located activity. With the switch on it also adds is_loop_stroll and
  loop_trip_diary_distance_km (the diary length of the trip into the activity when the loop placement makes that
  trip zero-length; _with_loop_lengths, which raises when a loop row matches no located activity or the trip back
  to a loop''s start place does not end at the loop''s place). With the switch off the output has none of these
  columns. The vendored join of the popsim_open and simple_ipf_open pipelines never carries them. Definition and
  path to the plans: docs/codebase/notes/leisure-loops.md.'
lineage:
  type: overridden
  upstream: synthesis.population.spatial.locations
  notes: Upstream eqasim stage name; the config alias table substitutes the regional implementation
    per workflow (see resolves_to), the same pattern as
    synthesis.population.spatial.primary.locations.
code:
- synthesis/population/spatial/locations.py
- braunschweig/synthesis/commute_day/spatial_locations_day.py
pipelines:
  popsim_mid: active
  popsim_open: active
  simple_ipf_open: active
production: true
resolves_to:
  popsim_mid: braunschweig.synthesis.commute_day.spatial_locations_day
  popsim_open: synthesis.population.spatial.locations
  simple_ipf_open: synthesis.population.spatial.locations
features:
- commute_day_state
- secondary_loop_zero_displacement
decisions:
- ADR-0207
- ADR-0104
