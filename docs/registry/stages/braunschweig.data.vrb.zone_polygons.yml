stage: braunschweig.data.vrb.zone_polygons
title: Official VRB tariff-zone polygons
layer: matsim
description: Loads the Regionalverband Grossraum Braunschweig polygon layer (46 zones, EPSG:25832),
  repairs invalid rings, trims overlap slivers to the lower zone id, adds zones 55/56 as 300 m
  station point zones from the cleaned GTFS stop names, writes vrb_tariff_zones.gpkg plus a report.
  Only wired when vrb_zone_fares_enabled is true.
lineage:
  type: braunschweig_new
  upstream: null
  notes: Replaces the name-based scrape of braunschweig.data.vrb.zones for zone membership (ADR-0133 D2).
    Conditional on vrb_zone_fares_enabled, which is off in the committed workflow configurations.
code:
- braunschweig/data/vrb/zone_polygons.py
pipelines:
  popsim_mid: not_used
  popsim_open: not_used
  simple_ipf_open: not_used
production: false
inputs:
- vrb_tariff_zone_polygons
- gtfs_feed
features: []
decisions: []
