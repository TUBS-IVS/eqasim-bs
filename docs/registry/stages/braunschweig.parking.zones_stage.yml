stage: braunschweig.parking.zones_stage
title: Parking cost zone release (polygons, tariffs, coverage register, SrV free-parking shares, districts, garages)
layer: matsim
description: 'Loads the six inputs of the zone-based parking costs (issue #249; parking cost zones v2 added the
  resident districts and the garages) as ONE release and validates them together: the zone polygons (WGS84 GeoJSON, reprojected to EPSG:25832, invalid rings
  repaired and counted, pairwise overlap at most 1 m2), the tariff table (typed, validated per zone type,
  then every row converted by braunschweig.parking.tariff_export.tariff_row_to_zone, the stricter per-row
  contract of the tariff model the Java cost model reads), exactly one tariff row per polygon, the coverage
  register against the tariffs (zoned municipalities own tariff rows and vice versa), and the SrV 2023
  free-parking shares (a level == class row with a share in [0, 1] for the workplace class of every tariff
  row), and the resident parking districts (spec Amendment C3, a second layer next to the fee zones: valid as
  stored, never repaired, unique ids, no two districts overlapping by more than 1 m2, and a coverage-register
  status row for every district municipality; a district in a municipality that is not zoned is inert and
  logged as a warning), and the garage dataset (spec Amendment E1: loaded and validated as stored by
  braunschweig.parking.garages, which logs the priced share and the assumption counts; an unpriced garage stays
  listed and is no option). Any inconsistency raises. Rows carrying the synthetic test-set marker ''fixture'' are
  accepted (the tests run the stage on tests/fixtures/parking) but logged as one WARNING naming the zones, the
  districts and the garages.
  Returns {zones, tariffs, workplace_shares (as read, both levels, workplace_class as text), coverage_register,
  districts (EPSG:25832), garages (EPSG:25832, priced and unpriced), sources}; sources lists the six inputs in a fixed order as {source_id = Data Registry dataset id, path =
  the configured path relative to data_path (POSIX), sha256 = LF-normalised content hash}, which the
  preparation stage copies into the tariff model JSON. Config keys (all relative to data_path, defaults of
  the first release): parking_zones_path (braunschweig/parking/parking_zones_2026.geojson),
  parking_tariffs_path (braunschweig/parking/parking_tariffs_2026.csv), parking_coverage_register_path
  (braunschweig/parking/parking_coverage_register_2026.csv), parking_workplace_shares_path
  (braunschweig/srv/srv2023_commute_parking_by_workplace_class.csv), parking_resident_districts_path
  (braunschweig/parking/parking_resident_districts_2026.geojson), parking_garages_path
  (braunschweig/parking/parking_garages_2026.geojson); an absolute path or one with
  backslashes is rejected at configure time. validate() hashes the LF-normalised content of the six files
  plus the source of braunschweig.parking.zones, braunschweig.parking.garages, braunschweig.parking.attach,
  braunschweig.parking.tariff_export and braunschweig.parking.cost.'
lineage:
  type: braunschweig_new
  upstream: null
  notes: New for the zone-based parking costs (ADR-0139; its inputs grew from three to six in the v2 release,
    ADR-0140), the successor of the 8 km ring of
    enable_urban_parking (legacy isParis attributes, no data stage). Declared by
    braunschweig.matsim.scenario.population (zone, resident-zone and free-parking attributes through
    braunschweig.parking.attach) and braunschweig.matsim.simulation.prepare (tariff model JSON) only when
    parking_zones_enabled is true, which configs/base_bs.yml (popsim_mid) and the popsim_open fixture
    configuration set, so the production and popsim_open DAG snapshots contain the stage. The
    simple_ipf_open configurations write the plans with the plain matsim.scenario.population stage,
    which rejects the flag at configure time, so the stage never enters that DAG.
code:
- braunschweig/parking/zones_stage.py
- braunschweig/parking/zones.py
- braunschweig/parking/garages.py
- braunschweig/parking/attach.py
- braunschweig/parking/tariff_export.py
pipelines:
  popsim_mid: active
  popsim_open: active
  simple_ipf_open: not_used
production: true
inputs:
- parking_zones_2026
- parking_tariffs_2026
- parking_coverage_register_2026
- srv2023_commute_parking_by_workplace_class
- parking_resident_districts_2026
- parking_garages_2026
features:
- parking_cost_zones
decisions:
- ADR-0139
- ADR-0140
notes: 'Mechanism, attribute names and maintenance rules: docs/codebase/notes/parking-cost-zones.md. Unit
  tests: tests/test_parking_zones_stage.py (fixture release, sources contract, missing class, rejected
  tariff row, inconsistent register, the resident districts, cache token, and the committed release through the
  stage), tests/test_parking_resident_districts.py (the district layer: loader, validator, assignment and the
  curation step), tests/test_parking_garages.py (the garage dataset: loader, validator, assumption counts) and
  tests/test_parking_attach.py (the attach functions the release feeds).'
