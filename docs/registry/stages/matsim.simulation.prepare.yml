notes: >-
  Plan feasibility check (ADR-0146, issue #443, feature record plan_feasibility_check). The last step of
  braunschweig.matsim.simulation.prepare.execute, after the cut, the freight injection and the VRB fare
  inputs, calls braunschweig.matsim.simulation.plan_check.run when braunschweig.plan_check.enabled is
  true (default true). It reads the population file that the written config names in
  plans.inputPlansFile (resolve_population_path, resolved against the config's directory, never an
  assumed file name), reports per subpopulation and per class frozen / in_region the plans with an
  activity end time after the simulated day, the plans whose last planned arrival is after it (report
  only), the plans with non-monotonic end times and the walk, bicycle and long legs, and writes
  plan_check.json into the stage directory. Keys: braunschweig.plan_check.enabled,
  .walk_max_distance_m (5000), .bicycle_max_distance_m (30000), .leg_max_duration_s (10800),
  .max_frozen_defect_share (0.005) and .fail_on_threshold (false), declared in configure() from the
  constants of plan_check and set in configs/base_bs.yml; the thresholds are ASSUMPTIONS. It raises on a
  qsim.endTime of the written config that differs from
  braunschweig.popsim.plan_validation.MAX_PLAN_TIME_SECONDS (30 h), on a config without
  plans.inputPlansFile or with a population path that does not exist, and, only when fail_on_threshold is
  true, when the share of late or non-monotonic plans of the frozen residents exceeds
  max_frozen_defect_share (false: ERROR log, the stage continues). The check also counts the legs stamped
  walkFallbackFrom (a pt leg the router replaced by walk): n_pt_as_walk, pt_as_walk_by_hour and share_pt_as_walk (over the pt-intended trips, routingMode pt) per class
  (all counted per pt-intended trip, in the class of its first leg);
  key .max_frozen_pt_as_walk_share (0.02, ASSUMPTION, default declared in configure() and pinned in configs/base_bs.yml) fails the
  stage for the frozen residents only when fail_on_threshold is true. The attribute needs the eqasim-java-bs
  PlanRouter change, so a jar built before it would make n_pt_as_walk read 0 whatever the router did: plan_check.require_walk_fallback_stamp
  therefore RAISES (before any counting, only when the check runs) unless PlanRouter.class (#465) and the scenario cutter's PlanCutter.class (#487: a cutter that rebuilds the cut trips
  without the stamp left only the stamps of its own routing, 33 of the 852 pre-cut fallbacks in run i465-wpe-smoke-1pct-2026-10-23)
  of the eqasim jar of matsim.runtime.eqasim contain walkFallbackFrom (fix: rebuild from eqasim_source_path); a WARNING is logged when pt or stamped legs exist but no leg carries a
  routingMode attribute (n_pt_trips meaningless). in_region, in-commuter and freight figures are reported, never failed on. plan_check is part of
  _HELPER_MODULES, and braunschweig.popsim.plan_validation, braunschweig.popsim.closure_dwell and
  data.hts.hts (its import closure) are in the deferred helper names, so the validate token covers
  the check (ADR-0136). Contributor note docs/codebase/notes/plan-check.md.
  Final-schedule summary (issue 465, feature record transit_next_day): _summarise_final_schedule prints
  [schedule] final schedule departures per hour {...}, max departure X h on the final, post-cordon-cut
  transit schedule on every run, independent of vrb_zone_fares_enabled; the VRB-fares path reuses that
  summary.
  First-replanning mode choice (ADR-0155, issue 465): with braunschweig.initial_mode_choice.enabled the stage adds to
  the final config, for every subpopulation with the in-the-loop DiscreteModeChoice strategy, a second
  DiscreteModeChoice strategy with braunschweig.initial_mode_choice.weight (1e6) and disableAfterIteration 1
  (braunschweig.matsim.initial_mode_choice), so almost every agent chooses its modes in iteration 1; the share is
  logged as [initial mode choice].
