stage: matsim.simulation.prepare
title: MATSim run preparation
layer: matsim
description: Prepares the MATSim run (config, freight injection, urban parking, subpopulations)
  via braunschweig.matsim.simulation.prepare. With vrb_zone_fares_enabled it attaches vrbTariffZone from
  the official polygons and writes the VRB fare inputs and the vrbFare module (ADR-0133). With
  cordon_enabled it cuts the scenario to the cordon extent with eqasim's RunScenarioCutter; the fork's
  TransitScheduleCutter keeps the last inside stop and the scheduled times of every cut transit route
  (docs/codebase/notes/eqasim-transit-schedule-cutter.md). The freight injection links every boundary
  endpoint to a high-capacity link in the trip direction (ADR-0144).
lineage:
  type: overridden
  upstream: matsim.simulation.prepare
  notes: Upstream eqasim stage name; the config alias table substitutes the regional implementation
    per workflow (see resolves_to).
code:
- matsim/simulation/prepare.py
- braunschweig/matsim/simulation/prepare.py
- braunschweig/matsim/simulation/plan_check.py
pipelines:
  popsim_mid: active
  popsim_open: active
  simple_ipf_open: active
production: true
resolves_to:
  popsim_mid: braunschweig.matsim.simulation.prepare
  popsim_open: braunschweig.matsim.simulation.prepare
  simple_ipf_open: braunschweig.matsim.simulation.prepare
features:
- mid_passenger_availability
- cordon_network_ring
- freight_assumptions
- freight_boundary_links
- mode_choice
- vrb_zone_fare_model
- plan_feasibility_check
decisions:
- ADR-0121
- ADR-0030
- ADR-0039
- ADR-0133
- ADR-0144
- ADR-0146
notes: >-
  Plan feasibility check (ADR-0146, issue #443, feature record plan_feasibility_check). The last step of
  braunschweig.matsim.simulation.prepare.execute, after the cut, the freight injection and the VRB fare
  inputs, calls braunschweig.matsim.simulation.plan_check.run when braunschweig.plan_check.enabled is
  true (default true). It reads the population file that the written config names in
  plans.inputPlansFile (resolve_population_path, resolved against the config's directory, never an
  assumed file name), reports per subpopulation and per class frozen / in_region the plans ending after
  the simulated day, the plans with non-monotonic end times and the walk, bicycle and long legs, and
  writes plan_check.json into the stage directory. Keys: braunschweig.plan_check.enabled,
  .walk_max_distance_m (5000), .bicycle_max_distance_m (30000), .leg_max_duration_s (10800) and
  .max_frozen_defect_share (0.005), declared in configure() from the constants of plan_check and set
  in configs/base_bs.yml; the thresholds are ASSUMPTIONS. It raises on a qsim.endTime of the written
  config that differs from braunschweig.popsim.plan_validation.MAX_PLAN_TIME_SECONDS (30 h), on a
  config without plans.inputPlansFile or with a population path that does not exist, and when the
  share of late or non-monotonic plans of the frozen residents exceeds max_frozen_defect_share;
  in_region, in-commuter and freight figures are reported, never failed on. plan_check is part of
  _HELPER_MODULES, and braunschweig.popsim.plan_validation, braunschweig.popsim.closure_dwell and
  data.hts.hts (its import closure) are in the deferred helper names, so the validate token covers
  the check (ADR-0136). Contributor note docs/codebase/notes/plan-check.md.
