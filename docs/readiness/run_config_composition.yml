feature: run_config_composition
title: Run-config composition (base + per-scale overlay)
status: on
status_matrix_row: "**[Infra]** Run-config composition (base + per-scale overlay)"
adr: ADR-0070
detail_doc: docs/DECISIONS.md
code_paths:
  - braunschweig/config_compose.py
  - scripts/run_synpp.py

evidence:
  tests:
    - tests/test_config_compose.py
    - tests/test_configs_composed.py
  off_path_byte_identical:
    claimed: "not_applicable"
    note: >
      There is no boolean flag; this feature IS the config-loading mechanism itself (base +
      overlay via `scripts/run_synpp.py <base> <overlay>`).
  fallback_rate:
    instrumented: false
    note: >
      Not applicable -- deterministic deep-merge, no primary/fallback distinction. Every
      override is logged instead for transparency (config_compose.py logs "[config-merge] ...
      overridden, ... added" on every compose call), which is a different kind of
      instrumentation than a fallback rate.
  reference:
    kind: none
    note: >
      ADR-0070 cites a "felix synthesis smoke (base_bs.yml + test.yml, 1 Kreis, real data)" as
      the validating run, but this is a manual smoke test described in prose, not a committed
      file or a RUNS.md-recorded run.
  kpi:
    name: null
    produced_by: null
    last_value: null
    measured_on: null
    note: No scalar KPI applies to a config-composition mechanism.

assessment:
  status: pending
  by: null
  date: null
  pending_reason: >
