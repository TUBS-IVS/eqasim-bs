evidence:
  tests:
    - tests/test_matsim_output_archive.py
  off_path_byte_identical:
    claimed: "not_applicable"
    note: >
      Archiving is a post-run copy step; when run_matsim and archive_matsim_output are both
      true it always executes, and there is no meaningful OFF-path output to compare against.
  fallback_rate:
    instrumented: true
    log_marker: "archived %d files from"
    note: >
      Logs a hardlink-vs-copy split per archived run, with a hard WARNING when the hardlink
      count is exactly 0 (source and target on different volumes -- archive used extra disk).
