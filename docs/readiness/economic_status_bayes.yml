  kpi:
    name: null
    produced_by: null
    last_value: null
    measured_on: null
    note: No scalar KPI currently attributed to a recorded run.

assessment:
  status: pending
  by: null
  date: null
  pending_reason: >
    ADR-0011 documents the design. NOTE: this flag lives entirely in
    braunschweig/synthesis/population/enriched.py, which is the legacy simple_ipf_open
    enrichment stage. configs/base_bs.yml sets braunschweig.population.method to popsim_mid,
    under which this whole stage (and this flag) is never invoked at all -- it is only live via
    configs/fixtures/config_local_braunschweig_25pct.yml. No owner verdict on realised
    Bayes-fit quality has been recorded.
  source: ADR-0011
