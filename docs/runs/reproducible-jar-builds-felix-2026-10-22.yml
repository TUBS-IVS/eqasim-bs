validation:
- metric: gated tests with the fix on the server toolchain
  reference: 'build A against build B through tests/jar_reproducibility.py; an equivalence reference, NOT observed data'
  result: >-
    PASS for both. Freight tool: digest adff375e20e4ff0f... in both working directories (7 files, 186636058 bytes with
    the exclusion; without it the builds differ only in inputFiles.lst, 168 against 203 bytes). eqasim (fork
    ab49a956): digest 018fdda6b56a8413... in both (1510 files, 218322589 bytes with the exclusion; without it only the
    4 inputFiles.lst differ). Test times 153.77 s and 211.26 s.
  artifact: docs/runs/artifacts/reproducible-jar-builds-felix-2026-10-22/gated_tests_felix.txt
- metric: freight tool jar, the Windows workstation build against the felix build of the same inputs
  reference: 'the jar of build "a" of reproducible-jar-builds-local-2026-10-22 (sha256 896959761d988e07...); an equivalence reference, NOT observed data'
  result: >-
    The files differ (felix sha256 61616a06587b368b...). Of 79979 entries 2 differ in content, both text files Maven
    stores in META-INF/maven/org.eqasim.braunschweig/freight-tool/: pom.xml (2760 against 2677 bytes) and
    pom.properties (82 against 79 bytes). Every class file, every other resource and every timestamp is equal. The
    differences are line endings: the rendered pom has 83 lines and 2677 bytes with LF, and Windows text mode writes
    CRLF (83 more bytes); pom.properties holds 3 lines, written with CRLF on Windows (read from the local jar).
  artifact: docs/runs/artifacts/reproducible-jar-builds-felix-2026-10-22/tool_jar_entries_local_vs_felix.txt
  notes: >-
    Reproducibility holds per platform. A cache moved between Windows and Linux would see a changed digest (the
    cache directory also holds the copied wrapper source with checkout-dependent line endings) and recompute the
    consumers, which is safe. In this comparison JDK 25.0.4.1 against 25.0.3 and Maven 3.9.9 against 3.6.3 gave
    identical class files; no general claim across JDK versions is made.
