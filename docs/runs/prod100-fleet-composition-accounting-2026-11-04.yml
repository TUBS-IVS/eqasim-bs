notes: >-
  Cost of landing the change. The edit of fleet_sampling_de.py changes the structured token of the stages that hash it,
  braunschweig.synthesis.incommuters and braunschweig.synthesis.student_incommuters; the edit of fleet_tables.py changes those
  two and braunschweig.analysis.analysis_suite (static audit, scripts/audit_synpp_helper_hash.py, covered[] of each stage).
  The household stage hashes neither module, so it does not re-execute. The two incommuter stages are the ones the change of
  PR #547 (run manifest prod100-fleet-composition-clip-2026-11-04, which holds their durations) already invalidates on main,
  so this change adds no further re-execution of them if no run starts between the two landings; analysis_suite (through
  fleet_tables.py) is the one addition, and its duration was not read from the run log. The new log lines appear in a run
  log only when the household stage next re-executes for another reason; this replay is the way to get the figures without
  that run.
