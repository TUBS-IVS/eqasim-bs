notes: >-
  Cost of landing the change. The edit of fleet_sampling_de.py changes the structured token of the stages that hash it,
  braunschweig.synthesis.incommuters and braunschweig.synthesis.student_incommuters; the edit of fleet_tables.py changes those
  two and braunschweig.analysis.analysis_suite (static audit, scripts/audit_synpp_helper_hash.py, covered[] of each stage).
  The household stage hashes neither module, so it does not re-execute. The two incommuter stages are the ones the change of
  prod100-fleet-composition-clip-2026-11-04 invalidates as well (its manifest holds their durations), so both changes landing
  before the next run cost one re-execution; the duration of analysis_suite was not read from the run log. The new log
  lines appear in a run log only when the household stage next re-executes for another reason; this replay is the way to get
  the figures without that run.
