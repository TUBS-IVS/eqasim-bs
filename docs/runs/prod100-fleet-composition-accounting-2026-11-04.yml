classification:
- wiring_proof
status:
  execution: completed
  notes: >-
    The replays completed on 2026-11-04 (14:42:51 to 14:47:17 CET baseline, 14:42:51 to 14:47:26 CET after, run in
    parallel; the replay of the merged module 15:54 to 15:58 CET). A check that an ACCOUNTING change alters no sampled
    vehicle, plus a measurement of the corrected rates; NOT a
