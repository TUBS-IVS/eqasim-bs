sampling:
  rate: 1.0
  scope: >-
    ONE batch of the 60 of the production popsim work directory, batch_030 (cells of the Kreise 03101, 03154, 03157, 03158;
    25649 expanded households in both runs; the Braunschweig part 03101 has 22561 of them). PROD = the same batch of the
    production run popsim100_20261120 (docs/runs/popsim-full-rerun-20261120.yml); the geo cross-walk of both is byte-identical
    (sha256 29c1116c89b263c555bd1f45bd213a71cae6db37c19a3954dbc559a6972fa0a8).
  notes: >-
    The batch was picked by scripts/pick_batch.py as the one with the highest share of persons aged 18 to 29 among the adults
    of its 03101 part: batch_030, 9880 of 33237 persons 18+ in 429 cells, share 0.2972590787 (batch_pick_03101.csv; 19 batches
    have a 03101 part). This is a deliberately student-heavy selection, so the household composition of its students is
    NOT the one of all Braunschweig students. Model counts are unweighted synthetic counts; every model person carries weight
    1; SrV shares are weighted (GEWICHT_P_ZENSUS), the SrV standard errors are SrV ones only and do not include the model's
    sampling error. The model side here is the PopulationSim output (seed households with their members), before the day-absence
    draw: it covers ALL adult students (P_TAET 10, age 18+) of the part, while the SrV cells cover students present on the
    reporting day.
