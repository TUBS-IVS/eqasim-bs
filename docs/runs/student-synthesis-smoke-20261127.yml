classification:
- smoke
status:
  execution: completed
  notes: >-
    A smoke, not a validation. One batch, two runs (ON = the bundle, PROD = the production run), no reference value is compared
    and the SrV tables are a survey, not ground truth. The run records how the control fit, the donors and the household
    composition of the students behave in one student-heavy batch and how far the model lies from SrV in SrV standard errors.
    It says nothing about the model matching reality.
validation:
- metric: >-
    fit of every hard control (importance >= 2000) in the Braunschweig part 03101 of batch_030, ON against PROD
  reference: >-
    production run popsim100_20261120, same batch (a comparison run, not ground truth). Caveat: ON and PROD differ in the
    bundle AND in everything main changed since the run commit 1041849c (the branch head contains main's later changes), and in
    the PopulationSim release (bs.3 against bs.2; identity evidence in docs/runs/popsim-bs3-release-2026-11-25.yml), so a
    difference of the fit is not attributable to the bundle alone.
  result: >-
    RULE (the author's statement that it was fixed before the numbers were read; no commit evidence exists; ASSUMPTION of the designer, the owner may tighten it): a hard control loses
    its fit when its WAPE in the 03101 part is more than 2.0 percentage points above PROD AND above 5.0 %. Hard tiers =
    importance >= 2000 (control_spec IMPORTANCE_PROFILES: anchor 1e9, son 20000, six / employed / kreis_hard 2000). WAPE
    of a KREIS control = |synthetic - target| / target on the 03101 row of the batch's (apportioned) KREIS totals; of a
    100 m or 1 km control = sum over the cells of the 03101 part of |synthetic - target| / sum of targets (the cells of
    the crosswalk in 03101 plus the used cells, as control_fit counts). RESULT from docs/runs/artifacts/student-synthesis-smoke-20261127/fit_03101.csv:
    49 hard controls in the union, 40 on both sides, 7 only in ON (the student_education entries) and 2 only in PROD (education_18plus_edu
    and _noedu, which the student entries replace). Controls losing the fit under the rule: 0. Of the 40 hard controls on
    both sides 18 have a higher WAPE in ON than in PROD, 16 a lower one, 6 the same. Largest increase of a hard control:
    EMPLOYED_F_60plus_agg_ZENSUS100m_target: WAPE ON 0.051047120418848166, PROD 0.03926701570680628 (difference 1.1780104712041883
    pp); the next ones: EMPLOYED_F_40_49_agg_ZENSUS100m_target: WAPE ON 0.031097560975609756, PROD 0.021341463414634148
    (difference 0.9756097560975608 pp); EMPLOYED_F_30_39_agg_ZENSUS100m_target: WAPE ON 0.034585824081981215, PROD 0.027684563758389263
    (difference 0.6901260323591951 pp). Hard controls above 5 % WAPE in ON: 6_Personen_und_mehr_Groesse_des_privaten_Haushalts_100m_Gitter_ZENSUS100m_target,
    EMPLOYED_F_60plus_agg_ZENSUS100m_target (each below the 2 pp difference or lower than PROD, so none is a loss by the
    rule): EMPLOYED_F_60plus_agg_ZENSUS100m_target: WAPE ON 0.051047120418848166, PROD 0.03926701570680628 (difference 1.1780104712041883
    pp); 6-person households 100 m: WAPE ON 0.30357142857142855, PROD 0.35714285714285715 (difference -5.35714285714286
    pp) (target sum 168, small counts); building_type_sonstiges (importance 20000) is below 5 %: WAPE ON 0.04744787922358016,
    PROD 0.04960460100647016 (difference -0.21567217828900032 pp). Caveat: the employed controls (KREIS employed and the
    four EMPLOYED grid entries of ages 16 to 39) carry LOWER targets in ON (the student employment concept), so their WAPE
    is measured against a different target than in PROD; 15 controls have different batch targets (employed, the six employment_status,
    the four work_by_employment and the four grid entries; fit_batch_check.csv and diag_*/control_fit.csv). Outside the
