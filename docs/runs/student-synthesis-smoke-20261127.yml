- metric: >-
    donors, weight dispersion and the maximum expansion factor of households with a student, ON against PROD (batch_030)
  reference: production run popsim100_20261120, same batch (a comparison run)
  result: >-
    Read from docs/runs/artifacts/student-synthesis-smoke-20261127/student_donors_weights.csv. Student household = a seed
    household with a member P_TAET 10 and age 18+. Expansion weight = the number of copies of a seed household in final_expanded_household_ids.csv
    (integer weights). MAX EXPANSION: PopulationSim applies max_expansion_factor 100 inside its balancer to float weights
    that this batch folder does not write (no pipeline store), so its own hit count is not observable. Closest observable
    used: the inflation ratio = copies / (N_scope x H_GEW / sum of H_GEW over the whole seed), N_scope = expanded households
