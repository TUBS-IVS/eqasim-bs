    popsim100_20261120 (run commit 1041849c); `git log 1041849c..HEAD -- braunschweig/data/bbsr braunschweig/data/inkar` is empty,
    so their code did not change between that run commit and the code state of this smoke. The smoke ran on the
    PopulationSim environment as it was before PR #697 (the uv lock change on main).
