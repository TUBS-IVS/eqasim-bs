    about 24 times the outside-zone difference in both samples. The outside-zone difference is NOT a noise estimate between
    independent runs (no such estimate exists, one run per arm); it only shows how far the car share of trips without a
    priced destination differs between the same two runs. MATSim modestats car share (pooled 51-60): 0.5214 against 0.5196 at
    1 %, 0.5178 against 0.5159 at 25 %. Legacy ring against v3 at 1 %: modestats car share 0.5062 against 0.5196. The cost
