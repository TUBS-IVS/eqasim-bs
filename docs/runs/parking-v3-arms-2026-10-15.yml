  notes: 'configuration.overlays holds ONE BLOCK PER ARM (the run-manifest schema has no separate per-arm key): overlay, resolved
    config, pipeline log, start and end (felix local time, CEST; start = the time stamp of the pipeline log file name, end = the
    line of ~/parking_v3_arms.status), exit code and the arm_sanity result. The overlays were composed on the CURRENT
    configs/base_bs.yml by ~/launch_parking_v3_arm.sh (braunschweig.config_compose) and are scale-, path- and lever-only (ruling
    R-C-4: no tuning; configs/ of this branch is unchanged against 69fc8fc4); the SHA-256 prefixes of the overlays equal the files
    on felix (read-only check 2026-10-17), and those of the resolved configs equal the files on felix and the copies in the
    output folders. Diff of the resolved configs against arm v3 (against v3_25pct for off_25pct), output_path and output_prefix
    left out: off and off_25pct parking_zones_enabled true -> false; legacy parking_zones_enabled true -> false and
    enable_urban_parking false -> true; v3_cost_0.5 and v3_cost_2.0 parking_cost_utility_factor 1.0 -> 0.5 and 2.0;
    v3_free_shift_-0.1 and -0.2 parking_workplace_free_share_shift 0.0 -> -0.1 and -0.2; v3_ev_off
    parking_ev_exemption_enabled true -> false; v3_25pct sampling_rate 0.01 -> 0.25 with working_directory and
    analysis_working_directory cache_bs_25pct_parking_v2b. Common overlay keys: run synthesis.output and matsim.output;
    matsim_last_iteration 60; matsim_write_plans_interval 5; popsim work_dir eqasim-data/popsim_work_allfeat, max_cells 750,
    num_workers 3; cache_share_export false; random_seed 1234 and the model flags from the base. Installed restricted inputs
    (ruling R-C-2, SHA-256 prefix of the inputs report of every zone arm): parking_zones_2026 7b200b87963e,
    parking_resident_districts_2026 5cc8d31d6b78, parking_garages_2026 84cf09f68ec3, parking_tariffs_2026 7de2d35e1808,
    parking_coverage_register_2026 df4589aea744, srv2023_commute_parking_by_workplace_class bff6aa4eade4.'
sampling:
  rate: 1 % (eight arms) and 25 % (two arms)
  scope: 'ZGB-8 full pipeline population with cordon in-commuters. POPULATION OF THE ARMS: every arm re-ran the stages that write
    its scenario in its own working directory (cache_bs_1pct_allfeat_popsim for the 1 % arms, cache_bs_25pct_parking_v2b for the
    25 % pair): the pipeline log of each of the ten arms executes the primary candidates, the secondary chain solvers and the
    scenario writers incl. the population writer (18 stages per log, 22 in the first arm of each sample); the PopSim stages came
    from the cache (no popsim stage was executed in any log). So the arms do not share a cached population file, but they
    simulated the same persons: the written synthetic-population tables persons, households, activities, trips and vehicles of
    the eight 1 % arms have identical SHA-256 (prefixes persons 98b5bb3f99afa7dc, households 7957017471142ea8, activities
    810f546980407128, trips d34f709ce4a85254, vehicles b7841b7e488c11e4; read-only sha256sum on felix, 2026-10-17) and those of
    the two 25 % arms too (persons eda08d7cfeabde71, households 6aac7070fc945773, activities 42e84a2070c4d2c3, trips
    d007882dbfa4787b, vehicles b5cc9aade8047f66), consistent with a deterministic build at random_seed 1234 (the determinism
    itself was not tested separately). The MATSim plans file differs between arms only where the arm changes the attributes
    written into it: v3, v3_cost_0.5 and v3_cost_2.0 have the byte-identical file (prefix e373ac2152c64792); off, legacy, the two
    free-share arms and v3_ev_off differ from it. The committed identity check of the final-iteration eqasim_trips tables
    (scripts/parking/summarize_arm_set.py --check-population-identity, tables *_population_identity.csv) finds the same 10,171
    persons in all eight 1 % arms with identical endpoints of every matched trip and 0 to 2 of 37,032 trips present in one table
    only, and at 25 % 254,660 persons in v3_25pct against 254,661 in off_25pct with identical endpoints of all 926,900 matched
    trips and 28 unmatched trips (18 only in v3_25pct, 10 only in off_25pct; 22 persons). INDIRECT LINK TO THE 2026-10-12 PLANS:
    the 25 % population is the one of the plans run of docs/runs/parking-v2-plans-25pct-2026-10-12.yml (same working directory
    and random seed): its free-parking draw log line (300,855 persons, 13,584 in street or resident zones, 11,679 of them drawn
    free, campus 5,740 persons of whom 1,128 free, RandomState 1234 + 7371) has the same counts as that of v3_25pct (an
    indirect link by counts; the two files were not compared). The 1 % and 25 % populations are separate builds, so the 1 % and
    25 % results are not nested samples. Counts are sample counts, never expanded. EV exemption: 443 of 11,953 car
    owners at 1 %, 10,725 of 298,166 car owners at 25 % (the pipeline log lines of the arms that built the populations).'
  notes: 'One run per arm. random_seed 1234 in every arm (the arms differ in the lever only), so a difference between two arms is
    one stochastic run each, not a tested effect.'
pipeline:
  targets:
  - synthesis.output
  - matsim.output
  notes: 'Full MATSim runs of 60 iterations each (matsim_last_iteration 60, controler.lastIteration 60 on the command line), not a
    smoke. The dry-run of the v3 arm on felix before its start (controller ledger of the campaign, not committed) counted 92 stages of
    which 18 had no cache entry (commute day, education gravity, secondary_chainsolvers, primary candidates, the braunschweig
    scenario writers, prepare, run, output; PopSim cached); the later arms of one sample reused the cached stages and re-ran prepare/run/output only. Termination:
    NO arm stopped by the eqasim mode-share termination criterion. All ten runs ended at the iteration limit 60 (modestats.csv
    has the iterations 0 to 60); the criterion value of the car share in the last row of eqasim_termination.csv (threshold 0.001,
    smoothing 20, horizon 10 in the config echo) is above the threshold in every arm: legacy 0.0029, v3_cost_2.0 0.0035,
    v3_free_shift_-0.2 0.0037, v3_25pct 0.0038, v3 0.0038, v3_ev_off 0.0038, off_25pct 0.0039, off 0.0040, v3_cost_0.5 0.0041,
    v3_free_shift_-0.1 0.0041 (rounded from the file). The iteration column of the last two rows of eqasim_termination.csv both
    reads 59 because eqasim labels both writes iteration - 1 (EqasimTerminationCriterion.prepareTerminationData): the call at
    the start of iteration 60 (mayTerminateAfterIteration) writes the state after iteration 59, and doTerminate after iteration
    60 writes a second row with the same label; the second row is the state after iteration 60 and its value is the one quoted
    here. A THIRD CAR SHARE: the termination indicator indicator:mode_share:car of the last row is 0.617 to 0.636 in the ten
    arms (v3 0.6334), a share over a five-mode list without outside and truck, while the modestats car share is 0.5196 (v3,
    pooled 51-60; 0.5220 at iteration 60) and the car share of the eqasim_trips table is 0.5304 (v3, all trips); the three
    universes were not reconciled and none of them is a reference. Stable mode shares would be convergence, never validation; here the criterion was not even met, and the
    comparison tables pool the iterations 51 to 60 as a late-iteration window, not as an equilibrium. The outcome report (CSV
    v4, 13 columns) is written per iteration; its iterations 51 to 60 and the eqasim_trips table of iteration 60 are the
    inputs of the comparison tables.'
classification:
- ab_test
status:
  execution: completed
  notes: 'All ten runs completed with exit 0 (status file ~/parking_v3_arms.status on felix, last line "all arms done" at
    2026-10-17 00:29:46 CEST; per-arm times above). The arm_sanity check (scripts/parking/arm_sanity.py, ruling R-C-3) passed for
    all ten arms (artifact arm_sanity_results_2026-10-15.txt): module active and v4 report header, config echo (cost factor,
    option price coefficient 0.310998, decay lengths 575.27 and 69.69 m, tariff snapshot 2026-10-14), source hashes equal the
    install list, EV exemption evidence (exempt persons > 0 in the v3 arms, "disabled" in v3_ev_off), NO_FEASIBLE_OPTION 0 in
    every zone group (the check reads the final report: at 1 % that is 0 of 17 priced stays in Ia and 0 of 2 in Ib in every zone
    arm, so the 1 % check has almost no power against its 1 % hard-stop bound; the 25 % pair has 0 of 519 in Ia and 0 of 101 in
    Ib; pooled over the iterations 51 to 60 the zone group tables count 228 and 65 pricing calls in Ia and Ib at 1 % (arm v3) and
    5,441 and 1,127 at 25 % (v3_25pct), all with no_feasible_option_count 0), and for off, legacy and off_25pct the absence of the zone model (a plausibility check of the mechanics, not
    a validation). SHUTDOWN ERRORS (non-fatal, all ten logs): at the end of every run the three optional SimWrapper dashboard
    analyses CreateAvroNetwork (illegal Avro attribute names such as osm:way:highway), TripAnalysis (writeModeShift: the
    matchInput suffix match picked the per-iteration eqasim trips file, so the column euclidean_distance ''50214.108711817535''
    was parsed into an integer column: tech.tablesaw AddCellToColumnException) and PublicTransitAnalysis (the households file
    was resolved against simulation_output: FileNotFoundException; the root causes are those established in the review of PR #33) are logged by CommandRunner as ERROR and the pipeline goes on
    (exit 0); they are optional dashboard analyses, not part of the model, and the comparison tables read none of their
    outputs. The root causes are fixed in eqasim-java-bs PR TUBS-IVS/eqasim-java-bs#33 (state MERGED when read on 2026-10-17;
    households input linker cd23d4d7e, Avro-legal network copy cfa1691a8, on top of PR #31, which renamed the per-iteration eqasim
    files), which was NOT deployed to felix during this campaign so that all arms of a sample ran one jar. The ERROR lines are in
    the local-only pipeline logs (eqasim-data/output_bs_*pv3*/parking_v3_<arm>.log, 3 ERROR CommandRunner lines per log), not
    committed. STUCK AGENTS (eqasim stuck_analysis.csv of every arm, read-only on felix on 2026-10-17: the number of
    PersonStuckEvents of an iteration, an indicator of the run mechanics and no validation quantity): iteration 0 and
    iteration 60 are 662 and 373 (off, legacy and v3 and v3_ev_off), 372 (v3_cost_0.5), 373 (v3_cost_2.0), 371
    (v3_free_shift_-0.1) and 374 (v3_free_shift_-0.2) at 1 %, and 18,024 and 9,394 (v3_25pct) against 18,024 and 9,385
    (off_25pct) at 25 %; the files of v3 and v3_ev_off are byte-identical.'
environment: 'felix (Ubuntu, 64 cores), conda env eqasim (Python 3.10.10 per the
  provenance line), JDK 25.0.3+9 (the log line "Using JDK 25 at /home/felix/tools/jdk-25.0.3+9"), the shaded jar
  braunschweig-2.3.1.jar of eqasim-java-bs (eqasim 2.3.1; the MATSim version is the one pinned by eqasim-java-bs ab49a956b and was not
  re-read here); the analysis tables were produced on the controller workstation (Windows, conda env eqasim)'
validation:
- metric: arm mechanics (arm_sanity, ruling R-C-3)
  reference: 'none -- a plausibility check of the run mechanics, not a comparison with an observed quantity'
  result: 'ARM SANE for 10 of 10 arms (exit 0 for each); the zone arms echo the intended levers, the installed source hashes
    and the v4 report; off, legacy and off_25pct carry no zone-model trace.'
  artifact: docs/runs/artifacts/parking-v3-arms-2026-10-15/arm_sanity_results_2026-10-15.txt
- metric: population identity of the arms (final-iteration eqasim_trips, committed check)
  reference: 'none -- an internal consistency check that the arms of a sample simulated the same persons and activity
    locations, not a comparison with an observed quantity'
  result: '1 %: all eight arms have the same 10,171 persons, every matched trip has identical origin and destination, 0 to 2 of
    37,032 trips are in one table only. 25 %: 254,660 persons in v3_25pct and 254,661 in off_25pct, identical endpoints of all
    926,900 matched trips, 28 trips unmatched (share 3.0e-5, below the assumed bound 0.001 of the check). The written synthetic
    population tables are byte-identical across the arms of a sample (sampling.scope).'
  artifact: docs/runs/artifacts/parking-v3-arms-2026-10-15/arm_set_summary_25pct_pv3_2026-10-15_population_identity.csv
  notes: 'Written by scripts/parking/summarize_arm_set.py --check-population-identity (tests/test_summarize_arm_set.py); the
    bound on the share of unmatched trips is an ASSUMPTION that separates a handful of unwritten trips from a differently built
    population. The check says nothing about the plans, the mode choice or the quality of the population.'
- metric: effect of the zone model on the mode shares (v3 against off, descriptive)
  reference: 'none -- the comparison arm is the model without parking cost, not an observation; a difference between arms is a
    model-internal sensitivity, one run per arm'
