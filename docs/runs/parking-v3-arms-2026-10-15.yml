source: 'controller transcription of the status file ~/parking_v3_arms.status and the pipeline log file names on felix, of the
  resolved configs, meta files, termination tables and pipeline logs downloaded to eqasim-data/output_bs_1pct_pv3_<arm>/ and
  eqasim-data/output_bs_pv3_<arm>_25pct/ (the comparison subset of every arm, local-only), of read-only sha256sum, git rev-parse and
  unzip -v calls on felix (2026-10-17), and of the tables of the artifact folder (written by the Part C helper scripts; every
  number in this manifest is a value of one of these files)'
notes: 'Outputs are local-only: the full run outputs stay on felix (eqasim-data/output_bs_1pct_pv3_<arm>/,
  eqasim-data/output_bs_pv3_<arm>_25pct/, per-person data of a synthetic population), the comparison subsets were downloaded to the
  controller workstation, and the zone polygons used by the helper scripts are a restricted file that is not in the repository
  (data record parking_zones_2026). The README of the artifact folder holds the commands to regenerate every table. This set is a
  comparison of model arms, never a validation: no table compares a model value with a validated reference, one run per arm and
  sample, and a run that reaches the iteration limit with mode shares still changing is not converged, let alone calibrated.
  Open follow-ups: the effect of the EV exemption at 25 % (an EV-off arm at that scale does not exist), an observed garage
  quantity (issue TUBS-IVS/eqasim-bs#448) and the production decision on the v3 flags stay with the owner.'
