id: popsim-ladder-inputs-b-2026-11-19
date: '2026-11-19'
repository:
  commit: 6633c522
  branch: fix/i659-popsim-household-universes
  notes: >-
    PRE-REGISTRATION: this file was committed with the checks and bounds below before any PopulationSim run
    of arm 7a, 7b or 8 started; only results, artifacts and execution notes are added afterwards. The commit
    is the eqasim-bs code archived on the run server (git archive) that prepares the arm folders
    (scripts/prepare_household_arm.py), runs the diagnostics (household_composition.csv needs --cells-1km)
    and compares the arms (scripts/compare_household_arms.py, which imports Part A's compare_input_arms.py).
    The branch contains Part A (fix/i658-popsim-kreis-consistency, merged at 2f97dd48) and Part T; all are
    stacked on the unmerged branches of issues #646 and #656. PopulationSim is the release-candidate build
    of the arm-3 record (popsim-ladder-arm3-2026-11-18: fork 0.10.0+bs.2 candidate, commit
    d9a2e2810139e822ff2870a1845c30a509461462, its environment on the run server, read-only).
configuration:
  base: configs/base_bs.yml
  overlays:
  - the run overlay of prod100_20261031 (server-local), only as the configuration that produced the batch folders
  notes: >-
    Arm 6 (baseline) = arm 5 plus the Zensus employment level (popsim-ladder-inputs-a-2026-11-18; its three
    keys are on in configs/base_bs.yml). Arm 7a = arm 6 without the four family-type controls (households
    by Zensus family type, hh_type5; key braunschweig.population.popsim.family_controls = "none"). Arm 7b =
    arm 6 with the four controls replaced by two 1 km household controls of the under-18 definition
    (households with a member under 18 and exactly one adult / two or more adults; targets from the Zensus
    table Typ_der_Kernfamilie_nach_Kindern, 1 km; key family_controls = "minor_child_1km"; seed column
    hh_minor_class). Arm 8 = the arm 7 chosen by the rule below plus the move of the persons of 100 m cells
    without households and with fewer than 20 persons to the household cells of their 1 km square (keys
    move_persons_of_household_less_cells = true, household_less_cell_max_persons = 20). Owner decisions
    D-fam and D-cells of 2026-11-18 (plan of issues #657 to #659). prepare_household_arm.py copies the
    base folder of a batch and rewrites only: configs/controls.csv (7a: four rows removed; 7b: four removed,
    two added with the library's catalog rows), data/control_totals_ZENSUS100m.csv and
    data/control_totals_ZENSUS1km.csv (7b: the two HH_MINOR_* columns added; 8: the 22 age x sex bands and
    the ten EMPLOYED_*_agg columns rebuilt from their float values with the move, then integerised within
    the 1 km squares as the stage does), data/seed_households.csv (7b: hh_minor_class added). It proves
    file by file and column by column that nothing else changed. Self-check done before this
    pre-registration: the arm-8 rebuild WITHOUT the move reproduces the person columns of all four arm-6
    folders exactly (prepare_logs/selfcheck_*.json, no changed column). Difference to a pipeline run: the
    other control tables, the seed and the settings are those of arm 6, not rebuilt by data.census.filtered;
    the pipeline path of the three keys is covered by the unit and stage tests of the branch and by the full
    rerun (#648). The keys stay at their legacy values in configs/base_bs.yml until this record meets its checks.
sampling:
  rate: 1.0
  scope: >-
    the four batches of the Part A record (batch_000, batch_013, batch_028, batch_032 of prod100_20261031)
    with their full seed pool.
  notes: The rate is the share of each batch's cells simulated (all of them), not a population sampling rate.
pipeline:
  targets: []
  notes: >-
    No synpp pipeline run. Baseline: the arm-6 folders and diagnostics of popsim-ladder-inputs-a-2026-11-18
    (run server ~/i658_a/arms/arm_6, diag_arm_6). The arm-6 household composition (not in Part A's
    diagnostics) was computed for this record from the arm-6 folders with the diagnostics of the commit
    above (baseline_eval/arm6_household_composition.csv). Runs: scripts/run_household_arms.sh (prepare;
    PopulationSim two processes at a time with run_arm.sh of the arm-3 record; diagnostics with --misfit and
    --cells-1km), then scripts/compare_household_arms.py with checks/arm7_vs_arm6.json (7a and 7b, each
    against arm 6) and checks/arm8_vs_arm7.json (arm 8 against the chosen arm 7). Arms 7a and 7b run
    first; arm 8 is prepared from the chosen arm-7 folders after the arm-7 verdict.
classification:
- ab_test
status:
  execution: completed
  notes: >-
    Pre-registered 2026-11-19 before the arm-7 and arm-8 runs. Done before the pre-registration, without a
    PopulationSim run of arm 7 or 8: the self-check of the arm-8 rebuild on all four batches, the
    preparation of the arm-7a and arm-7b folders of all four batches (deterministic; prepare_logs/), the
    arm-6 household composition and the evaluation of the arm-7 checks on arm 6 against itself
    (baseline_eval/), which fixes the baseline values below.
    Choice rule (D-fam): arm 7a is chosen if it meets O-fam and every N check; else arm 7b if it does; else
    Part B stops before arm 8 and goes to the owner. A missed check stops the part and goes to the owner;
    no tuning, no bound changed after a run.
    Verdict (filled after the runs; the text above is unchanged): arm 7a misses O-fam (one-adult ratio in all
    four batches, the share gap in batch_013) and N-conservation (batch_000); arm 7b meets every check, so
    the rule chooses arm 7b and family_controls = "minor_child_1km" is switched on in configs/base_bs.yml in
    the commit that adds these results. Arm 8 (on arm 7b) meets O-cells, its age-WAPE part and every N check
    except N-conservation on batch_000 at ZENSUS100m (abs_deviation_sum 114 against 113 households of arm
    7b; bound delta 0). The record as pre-registered is therefore NOT passed for arm 8: the move keys stay
    at their legacy values and Part B stops there for the owner's decision. No tuning, no bound changed.
    Execution notes (added after the runs): (1) DEVIATION from the plan's global constraint that the arms
    run with the run-time options of #656 (STORE_POSITIVE_WEIGHT_ROWS_ONLY, FAST_PATHS) and from the
    statement above that the settings are those of arm 6: arm 6 (and Parts T and A) ran with both options
    off, for comparability with the earlier arms. Arm 7a batch_000 and batch_013 ran with the options off;
    after an owner question during the runs (2026-11-19: why not use the optimisation) the lead switched
    both options on in configs/settings.yaml of every folder not yet run (arm 7a batch_028 and batch_032,
    all of arm 7b and, prepared from arm 7b, all of arm 8). The options are designed and recorded to leave
    the synthetic population unchanged (popsim-run-performance-2026-11-18: identical hashes in six pairs).
    Identity check for this record: arm 7a batch_000 run again with both options on (idcheck_arm) gives
    the same sha256 of final_expanded_household_ids.csv, synthetic_households.csv and synthetic_persons.csv
    as its run with the options off (run_records/outputs_sha256.txt). Effect: peak RSS 2.7 GB instead of
    27-34 GB, wall time 3.6-6.7 min instead of 10.8-11.1 min (run_records/run_times.txt). (2) The first
    PopulationSim start used a wrong project directory and exited at once without output; the first
    diagnostics start fired on that start's completion marker and exited rc 1 at once without output; arm
    7a batch_028 and batch_032 were stopped after one minute (options off) for the switch in (1). All three
    are logged in run_records/progress.log; their partial files were removed and the runs restarted from
    the unchanged prepared folders. (3) Every PopulationSim run of the record exits 0 and reports fork
    0.10.0+bs.2, commit d9a2e28 (run_records/tool_versions.txt). Checkpoint stores were deleted after the
    diagnostics.
source: >-
  run server, ~/i659_b (code archives, self-check, arms, diagnostics, comparisons); committed copy in
  docs/runs/artifacts/popsim-ladder-inputs-b-2026-11-19/.
environment: >-
  run server (Linux); PopulationSim environment of the arm-3 record (fork release candidate d9a2e28), used
  read-only; preparation, diagnostics and comparison in the conda eqasim environment with PYTHONPATH set to
  the code archive of the commit above.
validation:
- metric: >-
    O-fam (arms 7a and 7b, against arm 6): per batch, (1) |share of synthetic households with a member
    under 18 - census share of families with a child under 18| <= 1.0 percentage point, and (2) one-adult
    share among the synthetic households with a member under 18, divided by the census share of lone
    parents among the families with a child under 18, within [0.75, 1.05]. Table household_composition.csv
    of the arm's diagnostics.
  reference: >-
    Zensus 2022 family-type table Typ_der_Kernfamilie_nach_Kindern and Typ_priv_HH_Familie, 1 km grid,
    summed over the batch's 1 km squares (observed census data, prepared 1 km parquet of the production
    run). Denominator: all private households of the family-type table (Insgesamt_Haushalte_Typ_priv_HH_Familie),
    the same universe as all synthetic households. Blind spots: a household with two families counts once
    in the model and twice in the census numerator; minors living without a parent are in the model's
    numerator only; (2) is one-sided: a lone parent living with a further adult is a two-adult household in
    the seed (the bound is therefore asymmetric, ASSUMPTION-grade). Arm 6: (1) 0.050, 0.109, 0.049, 0.074;
    (2) 1.082, 1.170, 1.177, 1.195 (batch_000, 013, 028, 032; baseline_eval/arm6_on_ofam)
  result: >-
    MET for arm 7b on all four batches: |share gap| 0.0008, 0.0008, 0.0002, 0.0003; one-adult ratio 0.998,
    0.997, 0.995, 0.996 (batch_000, 013, 028, 032). NOT MET for arm 7a: share gap 0.0047, 0.0194, 0.0015,
    0.0022 (batch_013 above 0.01); one-adult ratio 0.611, 0.675, 0.553, 0.564 (all below 0.75).
  artifact: docs/runs/artifacts/popsim-ladder-inputs-b-2026-11-19/comparison_arm7b_vs_arm6/comparison.csv
- metric: >-
    O-cells (arm 8, from the prepare step): per batch, no 100 m cell with 0 integer households and a float
    age-band sum above 0 and below 20 keeps a person target after the move (cells in a 1 km square without
    any household cell are reported, not gated), and the 1 km sum of every moved person column is unchanged
    (max abs change 0); and the pooled 100 m WAPE of the 22 age x sex controls over the four batches is not
    above that of the chosen arm 7 (delta 0)
  reference: >-
    none for the first two parts (properties of the inputs, household_cells_check.json of each arm-8
    folder); the third compares with the chosen arm 7 (model output). Blind spot: the arm-8 age targets
    differ from the arm-7 targets in the donor and receiving cells, so the WAPE compares fits to different
    100 m targets with the same 1 km sums
  result: >-
    MET on all four batches (arm 7b -> arm 8): cells_left 0 in every batch (household-less cells below 20
    persons before the move: 96, 94, 32, 57; reported, not gated, cells left in squares without any
    household cell: 8, 0, 1, 0); max change of a 1 km sum 0; pooled 100 m WAPE of the 22 age x sex controls
    0.2336 -> 0.2265. Move reports (persons moved, large cells kept) in prepare_logs/arm_8_*.json.
  artifact: docs/runs/artifacts/popsim-ladder-inputs-b-2026-11-19/comparison_arm8_vs_arm7b/comparison.csv
- metric: >-
    N (no harm, each arm against its base: 7a and 7b vs arm 6, arm 8 vs the chosen arm 7): pooled WAPE over
    the four batches per geography, over the controls whose targets the arm did not change (target above 0;
    building_type_*, employment_status_*, work_by_employment_* left out as in Part A; arm 7: the family
    controls left out; arm 8: the 100 m age x sex and employed-grid controls left out), bound base + 0.02
    (ZENSUS100m), + 0.02 (ZENSUS1km), + 0.01 (KREIS); household conservation per batch and level not worse
    than the base (abs_deviation_share, conserved_pair_share, delta 0); no sequential fallback
    (non_simultaneous 0 at every level); G4 judged against the base: no batch with more ZENSUS100m controls
    outside the rounding-shift bound than in the base arm
  reference: >-
    the base arm (model output); ASSUMPTION-grade design bounds of the ladder (as in Part A). Arm 6 pooled
    WAPE over the arm-7 control set: ZENSUS100m 0.1258, ZENSUS1km 0.0095, KREIS 0.0018
    (baseline_eval/arm6_on_arm7_checks). Arm 6 household conservation: batch_000 at ZENSUS100m is above
    zero (popsim-ladder-inputs-a-2026-11-18, post hoc entry); the other batches conserve exactly
  result: >-
    Arms 7a and 7b vs arm 6: WAPE MET (ZENSUS100m 0.1258 -> 0.1119 (7a) / 0.1107 (7b); ZENSUS1km 0.0095 ->
    0.0093 / 0.0092; KREIS 0.0018 -> 0.0017 / 0.0015); no sequential fallback MET; G4 MET (0 controls
    outside in every batch); household conservation: arm 7b MET (batch_000 at ZENSUS100m abs_deviation_sum
    132 -> 113 households, the other batches exact), arm 7a NOT MET (batch_000 132 -> 143). Arm 8 vs arm 7b:
    WAPE MET (ZENSUS100m 0.0475 -> 0.0471, ZENSUS1km 0.0111 -> 0.0111, KREIS 0.0015 -> 0.0015 over the
    arm-8 control set); no sequential fallback MET; G4 MET; household conservation NOT MET on batch_000 at
    ZENSUS100m (abs_deviation_sum 113 -> 114 households, abs_deviation_share 0.01705 -> 0.01720), MET on
    every other batch and level (exact).
  artifact: docs/runs/artifacts/popsim-ladder-inputs-b-2026-11-19/comparison_arm8_vs_arm7b/comparison.csv
features:
  note: >-
    Evidence for the household-universe repairs of issue #659 (D-fam, D-cells): four batches, one draw
    (random_seed of the arm folders). The full population is the full rerun (#648).
