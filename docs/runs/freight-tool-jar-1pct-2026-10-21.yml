notes: >-
  What this run is evidence for: the freight extraction built from its own MATSim contrib jar
  (braunschweig.freight.extraction_tool) reproduces, bit for bit, the output of the previous extraction built through
  the fork jar, on this input and MATSim version (2026.0-2026w12), and a non-freight Java edit in the fork no longer
  changes the freight stages' keys. What it does not show: (1) no validation of any kind, since no observed reference
  is compared; (2) equivalence for other inputs or MATSim versions; (3) the INTERNAL determinism controls do not cover
  the other three categories. RUN 1 FAILED, a real bug: the build stopped with "Source option 5 is no longer
  supported. Use 8 or later." (run1_failed_log_excerpt.txt) because the rendered tool pom pinned no compiler plugin
  and the server's Maven 3.6.3 compiles for Java 5 by default; the local Maven 3.9.9 had hidden it. Fix 2425ea25 pins
  the build plugins, and run 2 ran from that commit; cause and decision are in ADR-0148 Decision item 8. RUNTIME OBSERVATION, NOT A
  PERFORMANCE MEASUREMENT: run 2 took 2 h 59 min for the extraction (11:41:59 -> 14:41:12; transit alone 12:02 ->
  14:41) against 1 h 0 min for the reference entry (2026-10-15 14:42 -> 15:42, file timestamps). In a same-conditions
  A/B started simultaneously at 13:50:51 (INTERNAL), the new jar took 138 s and the old jar 154 s; further INTERNAL
  runs of the new jar took 89 s (plain), 97 s (conda env) and 90 s (Python parent). For the same person blocks of
  TRANSIT, the pipeline JVM (started 12:02) against a control JVM (started 13:54) needed 154 s vs 25 s (10k to 20k),
  48 s vs 11.5 s (490k to 500k), 45 s vs 13.8 s (500k to 510k) and 324 s vs 134 s (510k to 520k); the control TRANSIT
  run was stopped at 590 000 persons (last progress line 14:42:19, controller observation; not in a committed
  artifact, whose last block is 510k to 520k) because it would not add to the equivalence evidence
  (transit_block_timing.txt). Excluded as causes: the jar (A/B above, committed), and, observed interactively on felix
  by the controller with jcmd, jstat, jstack and /proc, raw outputs not retained: JVM flags (identical except the CDS
  base address), JIT (hot SpeedyALT methods C2-compiled in both), GC (pipeline JVM total GC 6.6 s), environment
  variables, rlimits, scheduler class, nice, ionice, cgroup, THP, steal time, run-queue wait, and the study area
  (geometrically identical; .shp bytes identical). Maintainer statement (2026-10-21): a colleague was computing on the
  same host at the time, and the VM's CPU and RAM are shared and allocated dynamically. Observation: the control
  TRANSIT JVM (from 13:54) ran at normal speed while the pipeline JVM (from 12:02) stayed 2.4 to 6.2 times slower (ratios of the four block pairs above) on the
  same VM at overlapping times, so the effect is tied to the process lifetime. The mechanism is not identified and not
  proven at the host level (no perf, no host access); the colleague's load is the maintainer's report. The runtime
  difference is therefore not attributed to the tool jar.
