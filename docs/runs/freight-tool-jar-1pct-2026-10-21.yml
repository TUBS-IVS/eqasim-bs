    run target, not_in_meta, cache_missing). Full test_1pct overlay on the same copy: 102 stages, 51 stale for own
    reasons. Four are attributable to this branch's own changes: matsim.runtime.eqasim (module_hash_changed,
    token_changed:opaque), braunschweig.freight.extraction_tool, braunschweig.freight.extraction and
    braunschweig.freight.trips. The other 47 are stale for main's changes since the cache was last updated (e.g. the
