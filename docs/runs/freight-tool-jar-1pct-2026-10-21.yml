  artifact: docs/runs/artifacts/freight-tool-jar-1pct-2026-10-21/jar_artifacts.json
  notes: >-
    None of the dependency differences changed the output (byte identity in the first entry), on this input.
- metric: stale-stage explainer (scripts/explain_stale_stages.py) before the run, after the run, and with the full test_1pct overlay
  reference: 'none -- a wiring check of the explainer against the stages the change is expected to affect'
  result: >-
    Freight-only overlay before the run: 8 stages, exactly 2 stale for own reasons, braunschweig.freight.extraction_tool
    (not_in_meta, cache_missing) and braunschweig.freight.extraction (not_in_meta, cache_missing; config versus the
