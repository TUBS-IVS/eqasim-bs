source: >-
  The five felix probes (driver_rss_by_stage.py, tree_at_stage.py, memory_observer_stats.py,
  lowest_available_memory.py, series_end_state.py in the artifact folder) run read-only over the inputs named
  under environment, the "[resources]" and "Executing java:" lines of the launch-1 log, and three probes run in
  the repository: cache_impact.py (which wraps scripts/audit_synpp_helper_hash.py), dag_descendants.py (over
  docs/registry/dag/production.json and the aliases of configs/base_bs.yml) and replay_clamp.py (which calls the
  code of the fix with the recorder values of the first matsim.simulation.run sample of each launch). Stage wall
  times are the differences of first-sample timestamps of consecutive stages in the recorder series. The _launch1
  and _launch2 outputs differ only in the series they read.
