validation:
- metric: persons in and out of every step, and are freight and in-commuters handled as the exclusion says?
  reference: 'none: a wiring check on model output'
  result: >-
    Third attempt: 1,261,590 persons in the population file after the jar check, the config edit, the initial mode
    choice (persons_before = persons_after = 1,261,590 in initial_mode_choice.json), the lift and the plan check; no
    person lost. The runner: "Excluded subpopulations: 56364 of 1261590 persons (4.47 %) keep their plan unchanged",
    1,205,226 plans chosen in 1,206 chunks, choice phase 15:26:53 to 15:50:32, Java wall time 2,593 s, peak resident
    memory of the largest process 45,798,356 kB. All 56,364 freight plans are identical to the input after the initial
    choice and after the lift. In-commuters (not excluded in this pre-#566 run): 669 of 74,804 plans differ after the
    choice (second attempt 2,535: the difference is the re-routing of kept trips the Java fix removed), 1,256 of their
    221,700 trips changed mode (same in both attempts), and the lift lifted 483 of their legs (second attempt 511).
  artifact: docs/runs/artifacts/i678-reach-replay-prod100-2026-11-25/analysis_replay3.json
- metric: trips the standalone runner keeps unchanged because its filters reject them (new log line of PR #66)
  reference: 'none: a count of model output'
  result: >-
    "Standalone mode choice: 660457 of 3919594 trips (16.85 %) are rejected by the model's filter and not re-chosen;
    they were kept unchanged (persons without a valid alternative are not counted)". The count covers residents and
    in-commuters (freight is excluded before the choice) under the runner's own filters for the initial rule; it is
    not the same classification as the Python reach classes below and is not compared with them. The second attempt's
    jar had no such line.
  artifact: docs/runs/artifacts/i678-reach-replay-prod100-2026-11-25/replay3_lines_output.txt
- metric: resident trips not reached by reason, before and after
  reference: 'none: a count of model output, classified with plan_check.leg_reach of the branch'
  result: >-
    Identical in the second and third attempt. 3,697,894 resident trips. Before, today's loop rule (coarse, 6):
    reached 3,160,049, fixed_border 486,324, fixed_length 51,521. The branch's loop rule (coarse, 11), which also holds
    after the initial choice and after the lift (the classes depend only on the activities, which neither step
    changes): reached 3,207,293, fixed_border 486,324, fixed_length 4,277. The branch's initial rule (finer, 11):
    reached 3,223,256, fixed_border 444,614, fixed_vehicle 25,747, fixed_length 4,277. The lift report (residents and
    in-commuters, 3,919,594 trips) counts under the loop rule fixed_border 698,210 and fixed_length 4,277.
  artifact: docs/runs/artifacts/i678-reach-replay-prod100-2026-11-25/analysis_replay3.json
- metric: trips the initial choice newly reached (not reached under today's rule, reached under the initial rule) that changed their mode, by from-mode and to-mode
  reference: 'none: model output under free-flow travel times'
  result: >-
    Identical in the second and third attempt (analysis_replay3.json differs from analysis_replay2.json only in the
    in-commuter plan counts, the walks over 5 km after the choice and the lifted trips). 63,207 newly reached (15,963 in
    border tours, 47,244 in tours of 7 to 11 trips); 32,114 changed mode (7,546 and 24,568). From -> to: car -> walk
    8,234; walk -> car_passenger 4,800; walk -> car 3,851; pt -> car_passenger 3,023; bicycle -> car 2,687;
    car_passenger -> pt 1,849; car_passenger -> walk 1,691; car_passenger -> car 1,381; bicycle -> walk 1,003; walk ->
    pt 819; car -> car_passenger 765; pt -> car 502; walk -> bicycle 427; car -> bicycle 301; bicycle -> pt 207; car ->
    pt 194; bicycle -> car_passenger 155; pt -> walk 86; car_passenger -> bicycle 75; pt -> bicycle 64. Over all trips
    the initial rule reaches, 1,679,072 of 3,223,256 changed mode. 598 resident trips that the Python classification
    counts as not reached changed mode as well: all of class fixed_vehicle (car or bicycle in a border tour), i.e. the
    vehicle legs the constraint frees for missing availability. In the third attempt these 598 are the ONLY changes in
    not-reached resident trips (unreached_changes_replay3_output.txt); in the second attempt the 760 dropped stamps and
    the 67 re-routed pt trips came on top.
  artifact: docs/runs/artifacts/i678-reach-replay-prod100-2026-11-25/unreached_changes_replay3_output.txt
- metric: trips of border tours that the initial choice reached but that still have an unfitting mode after it (the number behind the loop switch)
  reference: 'none: model output; bounds of the plan check (walk 5 km, bicycle 30 km, pt-as-walk 5 km)'
  result: >-
    Identical in the second and third attempt. Of the 15,963 border-tour trips the initial choice reached, 1,433 were
    plain walks over 5 km and 538 pt-as-walk trips over 5 km before the choice; after it, 123 plain walks over 5 km
    remain unfit (no pt-as-walk, no bicycle). The loop (coarse rule) does not reach them, so the lift repaired them.
    The 538 pt-as-walk trips are inside trips of border tours that the initial choice REACHED and re-chose or
    re-routed (real repairs); they are distinct from the 760 border pt-as-walk trips the initial choice does NOT reach
    (lift row).
  artifact: docs/runs/artifacts/i678-reach-replay-prod100-2026-11-25/analysis_replay3.json
- metric: lifted trips by mode and reason, the taken-along bicycle trips, and the share of the other modes against max_share_other_modes
  reference: 'the bounds of the branch: max_share_other_modes 0.002 (an ASSUMPTION, ADR-0206) and max_frozen_pt_as_walk_share 0.02 (an ASSUMPTION, ADR-0188 and ADR-0189)'
  result: >-
    Third attempt, lift report (residents and in-commuters): pt 1,212, walk 258, bicycle 5, all fixed_border
    (fixed_vehicle 0, fixed_length 0); 2 bicycle trips taken along with their tour; share_lifted_other_modes 0.0000671
    (263 of 3,919,594 trips) against 0.002, not exceeded; share_lifted (pt) 0.0268 (1,212 of 45,216 frozen pt-intended
    trips, all detected by the walkFallbackFrom stamp; 5-10 km 578, 10 km and more 634) against 0.02, EXCEEDED
    (pre-existing, plan check row). Residents only: pt 760, walk 227, bicycle 5 (3 unfit, 2 taken along);
    in-commuters the other 483 (pt 452, walk 31). The 760 resident pt lifts are the border pt-as-walk trips the
    initial choice does not reach, kept with their stamp: of the 1,298 resident pt-as-walk trips over 5 km that the
    loop does not reach on the input, 538 were repaired by the initial choice (row above) and 760 = 1,298 - 538 keep
    their class. The 227 resident walks are 123 inside trips the initial choice reached but left unfit, 99 border trips
    that were long walks already, and 5 freed vehicle legs that became walks. Second attempt (before the Java fix): pt
    95, walk 1,470, bicycle 5, share_lifted_other_modes 0.000376, share_lifted 0.00231; residents walk 987 (the 227
    plus the 760 trips whose stamp the runner had dropped, so they were lifted as walks) and pt 67 (border pt trips
    the runner had re-routed to walk-only). Total lifted trips: 1,570 in the second attempt
    (replay2_frozen_pt_walk_lift.json) and 1,475 in the third.
  artifact: docs/runs/artifacts/i678-reach-replay-prod100-2026-11-25/replay3_frozen_pt_walk_lift.json
- metric: n_unreached_unfit and the plan check's threshold result
  reference: 'the plan check invariant of the branch (n_unreached_unfit must be 0 with all_modes) and its thresholds (max_frozen_defect_share 0.005, max_frozen_pt_as_walk_share 0.02; both ASSUMPTIONS of ADR-0188 and ADR-0189, fail_on_threshold false)'
  result: >-
    Third attempt: n_unreached_unfit 0 in the frozen and the in-region resident block of plan_check.json (the same
    code gives 3,320 on the input and 1,473 after the initial choice; the 1,473 are the trips the lift then repaired,
    2 taken-along bicycles aside; second attempt 1,568). Threshold result: exceeded [share_plans_non_monotonic_large,
    share_lifted_frozen_pt_walk]; share_plans_late 0.003 % and share_pt_as_walk_long 0.0 are within their bounds. The
    pt-as-walk share of frozen pt-intended trips over 5 km (plan check rule, residents and in-commuters) is 3.93 %
    (1,785 / 45,469) in the input, 2.68 % (1,212 / 45,216) after the initial mode choice, and 0 after the lift (0 of
    44,004). The bound max_frozen_pt_as_walk_share 0.02 was already exceeded before #678: the lift replay of #575 on
    the same run measured 3.9 % (1,785 of 45,469) (docs/runs/i575-frozen-pt-walk-lift-prod100-2026-11-06.yml). The
    input predates ADR-0186: prod100_20261031 was cut in the old extent mode (its prepare cache has no
    transit_cut_summary.csv), which split pt trips at the extent polygon and re-routed the inside pieces on the cut
    timetable, the mechanism that ADR-0186's kept-stops cut (the production setting since) addresses. This replay
    therefore does not measure the share under the current cut; the next 100 % production run (#22) does. The
    second attempt's 0.23 % (95 of 41,140) after the initial choice was an artefact of the dropped stamps, not a
    repair. Of the fall from 1,785 to 1,212, the residents' part is 538 real repairs by the initial choice (1,298 ->
    760); the rest (487 -> 452) is in-commuters, re-chosen in this pre-#566 run, plus any trips where the plan
    check's pt-as-walk rule and unfit_mode differ; not traced, because the committed analysis splits only residents.
    share_plans_non_monotonic_large 1.12 % (1,702 of 151,733 frozen residents) against 0.50 %, the same in both
    attempts; a property of the input: the branch's plan check gives 1.14 % (1,726) on the input and 1.13 % (1,722)
    after the initial choice (plan_check_compare_replay3.json). The run's own plan_check.json (older code) already
    listed share_plans_non_monotonic as exceeded.
  artifact: docs/runs/artifacts/i678-reach-replay-prod100-2026-11-25/plan_check_compare_replay3.json
- metric: resident plain walk trips over 5 km (straight line; mode walk, only walk legs, not pt-intended), before and after
  reference: 'the "before" manifest docs/runs/i678-mode-choice-reach-probe-prod100-2026-11-25.yml (1,433 + 1,122 = 2,555 walks over 5 km in trips of frozen tours that do not touch outside and in tours over 6 trips); model output, not observed data'
  result: >-
    Input, today's rule: not reached 1,433 (not touching outside) + 1,122 (long tours) = 2,555, equal to the "before"
    manifest, plus 99 that touch outside; reached 88,112. Input, the branch's loop rule: not reached 1,532, reached
    89,234. After the initial choice, loop rule: not reached 227 (the walks the lift had to repair: 123 left unfit by
    the initial choice, 99 long walks already at the border, 5 freed vehicle legs), reached 1,817. Second attempt: 987
    not reached, of which 760 were border pt-as-walk trips relabelled by the dropped stamp. After the lift: not reached
    0, which is the invariant holding by construction (the lift repairs every unreached unfit trip, the plan check
    enforces n_unreached_unfit = 0), not a further result; reached 1,817, which the loop can still re-choose.
  artifact: docs/runs/artifacts/i678-reach-replay-prod100-2026-11-25/analysis_replay3.json
- metric: border-tour vehicle legs relaxed for missing availability, own count against the runner's running log lines
  reference: 'the running summary lines of BorderTourVehicleConstraint.Factory (written whenever the relaxed count reaches a power of two); model output'
  result: >-
    Counted from the input population: a trip of a home-based tour with a trip at outside whose routing mode is car or
    bicycle, where BraunschweigModeAvailability does not offer that mode (car: carAvailability none or hasLicense no;
    bicycle: bicycleAvailability none). Residents: car 2,394 of 162,153, bicycle 67 of 1,415; in-commuters: car 0 of
    134,649. Total 2,461 of 298,217 (0.83 %). The runner's last running line in the third attempt: "2050 of 264771
    (0.77 %)" at 15:44:48 (second attempt "2049 of 264642 (0.77 %)"; the running counts differ by thread timing). Both
    figures of that line are running counts at the moment the relaxed count passed 2,048: 264,771 is the number of
    border-tour vehicle legs counted UP TO THAT MOMENT, not the total, so it is not comparable with the denominator
    298,217. No line for 4,096 followed, so the runner's final relaxed total lies between 2,050 and 4,095, and its
    final vehicle-leg total is at least 264,771. The counted 2,461 of 298,217 lies in both ranges; that is the extent
    of the agreement (the standalone runner writes no final summary line for this constraint).
  artifact: docs/runs/artifacts/i678-reach-replay-prod100-2026-11-25/replay3_lines_output.txt
- metric: the gap of the step-1 manifest (uncut 365 tours of 13 trips and 1,193 of 9 to 11 trips against 329 and 815 persons in the prepared population)
  reference: 'none: a count of model output'
  result: >-
    Explained by the cordon cut. Of the uncut resident home-based tours without an outside activity and with more
    than 6 trips (7,355), the same tour in the prepared population (matched by its index among the person's home
    tours; every person's tour count matched) has the same length and no outside activity in 6,554 cases and touches
    outside in 801 cases: 13 trips 329 + 36, 9 to 11 trips 812 + 381, 7 to 8 trips 5,413 + 384. A tour with an
    activity beyond the cut extent becomes a border tour, which the finer rule cuts into shorter runs. The 815 persons
    of step 1 with a longest run of 9 to 11 trips are these 812 plus 3 whose long run lies inside a border tour; the
    5,473 with 7 to 8 trips are 5,413 plus 60. The same 801 tours are the unexplained difference between 7,355 and
    6,554 in the "before" manifest.
  artifact: docs/runs/artifacts/i678-reach-replay-prod100-2026-11-25/analysis_before_output.txt
- metric: first attempt (79d0bcbd, no exclusion) - does the replay run on the full population?
  reference: 'none: a wiring check on model output'
  result: >-
    No: the freight NullPointerException and the hang described in status; residents and in-commuters (1,205,226) had
    finished their choice, no output was written, no population was replaced. The same failure on 500 freight persons
    with the initial config and with the stock config (diag_freight_*_output.txt).
  artifact: docs/runs/artifacts/i678-reach-replay-prod100-2026-11-25/diag_freight_final_output.txt
