environment: 'server (felix, hostname matsim, 64 cores, 94 GB), conda eqasim (~/miniforge3/envs/eqasim, Python 3.10), Java ~/tools/jdk-25.0.3+9 (25.0.3), Maven 3.6.3; 32 threads, -Xmx56G; load average about 1 to 4 (another session ran populationsim workers and a Java job)'
validation:
- metric: persons in and out of every step (second attempt), and are freight and in-commuters handled as the exclusion says?
  reference: 'none: a wiring check on model output'
  result: >-
    1,261,590 persons in the population file after the jar check, the config edit, the initial mode choice
    (persons_before = persons_after = 1,261,590 in initial_mode_choice.json), the lift and the plan check; no person
    lost. The runner: "Excluded subpopulations: 56364 of 1261590 persons (4.47 %) keep their plan unchanged", 1,205,226
    plans chosen in 1,206 chunks, choice phase 18:27:37 to 18:51:44, Java wall time 2,593 s, peak resident memory of the
    largest process 45,425,616 kB. All 56,364 freight plans are identical to the input after the initial choice and
    after the lift. In-commuters (not excluded in this pre-#566 run): 2,535 of 74,804 plans differ after the choice,
    1,256 of their 221,700 trips changed mode, and the lift lifted 511 of their legs.
  artifact: docs/runs/artifacts/i678-reach-replay-prod100-2026-11-25/analysis_replay2.json
- metric: resident trips not reached by reason, before and after
  reference: 'none: a count of model output, classified with plan_check.leg_reach of the branch'
  result: >-
    3,697,894 resident trips. Before, today's loop rule (coarse, 6): reached 3,160,049, fixed_border 486,324,
    fixed_length 51,521. The branch's loop rule (coarse, 11), which also holds after the initial choice and after the
    lift (the classes depend only on the activities, which neither step changes): reached 3,207,293, fixed_border
    486,324, fixed_length 4,277. The branch's initial rule (finer, 11): reached 3,223,256, fixed_border 444,614,
    fixed_vehicle 25,747, fixed_length 4,277. The lift report (residents and in-commuters, 3,919,594 trips) counts
    under the loop rule fixed_border 698,210 and fixed_length 4,277.
  artifact: docs/runs/artifacts/i678-reach-replay-prod100-2026-11-25/analysis_replay2.json
- metric: trips the initial choice newly reached (not reached under today's rule, reached under the initial rule) that changed their mode, by from-mode and to-mode
  reference: 'none: model output under free-flow travel times'
  result: >-
    63,207 newly reached (15,963 in border tours, 47,244 in tours of 7 to 11 trips); 32,114 changed mode (7,546 and
    24,568). From -> to: car -> walk 8,234; walk -> car_passenger 4,800; walk -> car 3,851; pt -> car_passenger 3,023;
    bicycle -> car 2,687; car_passenger -> pt 1,849; car_passenger -> walk 1,691; car_passenger -> car 1,381;
    bicycle -> walk 1,003; walk -> pt 819; car -> car_passenger 765; pt -> car 502; walk -> bicycle 427; car -> bicycle
    301; bicycle -> pt 207; car -> pt 194; bicycle -> car_passenger 155; pt -> walk 86; car_passenger -> bicycle 75;
    pt -> bicycle 64. Over all trips the initial rule reaches, 1,679,072 of 3,223,256 changed mode. 598 resident trips
    that the Python classification counts as not reached changed mode as well: all of class fixed_vehicle (car or
    bicycle in a border tour), i.e. the vehicle legs the constraint frees for missing availability
