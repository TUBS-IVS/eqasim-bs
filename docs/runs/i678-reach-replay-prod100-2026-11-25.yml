    as modified (the shade plugin rewrites it). The population and the final config are those of the run
    prod100_20261031 (code 7a41f0ba), read only; both attempts worked on copies.
configuration:
  config: >-
    configs/base_bs.yml of the clone (the branch defaults: initial mode choice isolate_outside_trips true and
    max_tour_length 11, loop isolate_outside_trips false and max_tour_length 11, lift all_modes true,
    max_share_other_modes 0.002; plan check keys, cordon_enabled and freight_enabled as in the file), read by the
    stand-in context of the replay driver, with three operational overrides: java_binary (JDK 25.0.3), java_memory 56G,
    matsim_threads 32. The MATSim config is a copy of the final config of prod100_20261031.
  notes: >-
    mode_choice_reach.apply with the loop settings changed one value of the final config (maximumLength 6 -> 11,
    config_diff_final_output.txt); the second file of the initial mode choice differs from it in tourFinder
    (IsolatedOutsideTrips) and tourConstraints (FromTripBased, BorderTourVehicleContinuity)
    (config_diff_initial_output.txt); both files are byte-identical between the two attempts
    (config_diff_replay2_vs_replay1_output.txt). Runner arguments from initial_mode_choice.arguments with 32 threads
    and the default chunk size of 1,000. Excluded subpopulations, second attempt: the list of the branch's
    prepare._initial_mode_choice_excluded_subpopulations for this config, incommuter, student_incommuter and freight.
    The runner kept 56,364 freight persons unchanged and warned that the two in-commuter names match nobody:
    prod100_20261031 predates #566, its in-commuters carry no subpopulation attribute, so unlike in a post-#566 prepare
    they were re-chosen, and the lift and the plan check count them as residents (subpopulation-attribute rule). First
    attempt: no exclusion.
sampling:
  rate: 1.0
  scope: >-
    the prepared population of prod100_20261031: 1,261,590 persons, of which 1,130,422 residents (no subpopulation
    attribute and no ic_ facility in the uncut plan, the rule of the "before" probe), 74,804 in-commuters and 56,364
    freight (subpopulation freight). The counts of the analysis scripts are residents only unless a row says otherwise;
    the step reports of the code (initial_mode_choice.json, frozen_pt_walk_lift.json, plan_check.json) count the
    in-commuters among the residents.
pipeline:
  targets: []
  notes: >-
    No synpp pipeline run. The run script made the stage directory (symbolic links to the files of the run's prepare
    stage directory, copies of the final config and of the population, cmp-identical) and ran the replay driver, which
    calls the steps of prepare.execute in their order through a stand-in context (config, path, stage): the jar check,
    mode_choice_reach.apply, initial_mode_choice.run(reach=initial settings), frozen_pt_walk_lift.run and
    plan_check.run with the lift report. The driver keeps the population after the initial mode choice as a hard link
    (snapshots/). Second attempt: i678_run_replay_v2.sh and i678_reach_replay_v2.py (exclusion from the branch
    function), 1:15:59 wall time for the driver, exit 0. Then, read only: i678_reach_analysis_v2.py over the uncut,
    input, after-initial and final populations (1,564 s); i678_plan_check_compare.py (plan_check.summarise of the
    branch on the input and the after-initial population); i678_unreached_changes.py (the trips the initial rule does
    not reach that differ after the choice). First attempt: i678_run_replay.sh, i678_reach_replay.py,
    i678_reach_analysis.py (input only), i678_cut_subpopulation.py and i678_diag_freight.sh (reproduction).
classification:
- wiring_proof
status:
  execution: completed
  notes: >-
    A replay on production inputs, NOT a validation. The second attempt ran all four steps to the end. One plan check
    threshold is exceeded: share_plans_non_monotonic_large of the frozen resident block (planned lateness over 900 s);
    fail_on_threshold is false, so the check logged it at ERROR and continued. The same share is already over the
    bound in the INPUT population (measured with the branch's plan check code, see the validation rows), so it does not
    come from the replayed steps; it was reported to the controller under the task's stop rule, and no bound or code
    was changed. First attempt (79d0bcbd, kept as evidence): BLOCKED at the initial mode choice. The runner failed with
    java.lang.NullPointerException "Cannot invoke String.equals(Object) because the return value of
    DiscreteModeChoiceTrip.getInitialMode() is null" in
    org.eqasim.core.simulation.mode_choice.constraints.OutsideConstraint.validateBeforeEstimation: the injected freight
    legs are a bare leg mode="truck" without routingMode. Reproduced on 500 freight persons with the initial config and
    with the stock rule (ActivityBased, VehicleContinuity), so independent of the #678 settings. After the worker
    exception the JVM did not exit (a non-daemon ParallelProgress thread kept it alive, the G1 collector kept about 11
    cores busy, so the hang watchdog of matsim.runtime.java never fired); it was stopped by hand after 35 minutes (exit
    143) and wrote no output. Fixed on the branch by commit 884627f0, which the second attempt exercises.
