    (older code) already listed share_plans_non_monotonic as exceeded.
  artifact: docs/runs/artifacts/i678-reach-replay-prod100-2026-11-25/plan_check_compare.json
- metric: resident plain walk trips over 5 km (straight line; mode walk, only walk legs, not pt-intended), before and after
  reference: 'the "before" manifest docs/runs/i678-mode-choice-reach-probe-prod100-2026-11-25.yml (1,433 + 1,122 = 2,555 walks over 5 km in trips of frozen tours that do not touch outside and in tours over 6 trips); model output, not observed data'
  result: >-
    Input, today's rule: not reached 1,433 (not touching outside) + 1,122 (long tours) = 2,555, equal to the "before"
    manifest, plus 99 that touch outside; reached 88,112. Input, the branch's loop rule: not reached 1,532, reached
