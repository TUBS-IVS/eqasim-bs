    (~/i678_replay2/eqasim-bs, 0 changes). First (failed) attempt: the same branch at 79d0bcbd
    (~/i678_replay/eqasim-bs). Both used eqasim-java-bs main at ae6a10a1c753537597145cc722ad0277ede58cfb (the merge of
    PR #65, the border tour vehicle constraint with its review fixes), a clean clone (~/i678_replay/eqasim-java-bs);
