id: i678-reach-replay-prod100-2026-11-25
date: '2026-11-25'
repository:
  commit: 79d0bcbd3fb4001e23c19ee6f4685023c3e7fcce
  branch: fix/i678-mode-choice-reach
  notes: >-
    eqasim-bs fix/i678-mode-choice-reach at 79d0bcbd and eqasim-java-bs main at
    ae6a10a1c753537597145cc722ad0277ede58cfb (the merge of PR #65, the border tour vehicle constraint with its review
    fixes), both clean clones on felix (~/i678_replay/eqasim-bs and ~/i678_replay/eqasim-java-bs) made from git bundles
    of these commits. The jar was rebuilt in the Java clone with -Pstandalone and the fixed build timestamp of
    matsim.runtime.eqasim (braunschweig-2.3.1.jar, 193,786,595 bytes, sha256
    8cf877113730d4ddd4397d660386189cd2b6d110bfbdf61e60f6b4c5962e6bb8; it holds BorderTourVehicleConstraint,
    its Factory and BorderTourVehicleSummaryListener); after the build the clone shows only
    braunschweig/dependency-reduced-pom.xml as modified (the shade plugin rewrites it). The population and the final
    config are those of the run prod100_20261031 (code 7a41f0ba), read only; the replay worked on copies.
configuration:
  config: >-
    configs/base_bs.yml of the clone (the branch defaults: initial mode choice isolate_outside_trips true and
    max_tour_length 11, loop isolate_outside_trips false and max_tour_length 11, lift all_modes true,
    max_share_other_modes 0.002; plan check keys as in the file), read by the stand-in context of
    i678_reach_replay.py, with three operational overrides: java_binary (JDK 25.0.3), java_memory 56G, matsim_threads 32.
    The MATSim config is a copy of the final config of prod100_20261031.
  notes: >-
    mode_choice_reach.apply with the loop settings changed one value of the final config (maximumLength 6 -> 11,
    config_diff_final_output.txt); the second file of the initial mode choice differs from it in tourFinder
    (IsolatedOutsideTrips) and tourConstraints (FromTripBased, BorderTourVehicleContinuity)
    (config_diff_initial_output.txt). Runner arguments from initial_mode_choice.arguments with 32 threads and the
    default chunk size of 1,000 (1,262 chunks). Excluded subpopulations: none; prod100_20261031 predates #566, its
    in-commuters carry no subpopulation attribute and the runner fails when the exclusion list matches nobody, so
    unlike a post-#566 prepare the in-commuters were given to the choice.
sampling:
  rate: 1.0
  scope: >-
    the prepared population of prod100_20261031: 1,261,590 persons, of which 1,130,422 residents (no subpopulation
    attribute and no ic_ facility in the uncut plan, the rule of the "before" probe), 74,804 in-commuters and 56,364
    freight (subpopulation freight). The counts below are residents only unless a row says otherwise.
pipeline:
  targets: []
  notes: >-
    No synpp pipeline run. i678_run_replay.sh made the stage directory (symbolic links to the files of the run's
    prepare stage directory, copies of the final config and of the population, cmp-identical) and ran
    i678_reach_replay.py, which calls the four steps of prepare.execute in their order through a stand-in context
    (config, path, stage): the jar check, mode_choice_reach.apply, initial_mode_choice.run(reach=initial settings),
    frozen_pt_walk_lift.run and plan_check.run. Only the first two steps finished; see status. i678_reach_analysis.py
    then counted the uncut and the prepared input population with the branch's classification functions (659 s).
    i678_cut_subpopulation.py and i678_diag_freight.sh reproduced the failure on 500 freight persons.
classification:
- wiring_proof
status:
  execution: partial
  notes: >-
    A replay on production inputs, NOT a validation. BLOCKED at the initial mode choice. The standalone runner
    (RunStandaloneModeChoice of eqasim-java-bs ae6a10a1) failed with java.lang.NullPointerException in a worker
    chunk: "Cannot invoke String.equals(Object) because the return value of DiscreteModeChoiceTrip.getInitialMode()
    is null", at org.eqasim.core.simulation.mode_choice.constraints.OutsideConstraint.validateBeforeEstimation. The
    freight legs of the population are written as a bare leg mode="truck" without routingMode, so the trip has no
    initial mode. Reproduced on the first 500 freight persons with BOTH configs, the initial config of #678 and the
    final config with the stock rule (ActivityBased, VehicleContinuity), so the failure does not depend on the #678
    reach settings. The progress counter stopped at 1,205,226 of 1,261,590 persons, i.e. all residents and
    in-commuters were chosen and the 56,364 freight persons failed. After the main thread's exception the JVM did not
    exit: a non-daemon progress thread (ParallelProgress, Thread-1) kept it alive and the G1 collector kept about 11
    cores busy, so the hang watchdog of matsim.runtime.java (java_hang_timeout_s 900, which needs the JVM to stop using
    CPU) never fired. The JVM was stopped by hand after 35 minutes of hang (exit 143); the runner wrote no output
    plans, so the lift, the plan check and every "after" count were not run. initial_mode_choice.run raised before its
    os.replace, so the population copy in the stage directory was not replaced. The counts of the input
    population, the relaxed vehicle legs and the explanation of the step-1 gap below come from the input alone.
source: >-
  felix:~/i678_replay (stage/ the stage directory, replay_output.txt the full log, thread_dump_1.txt the thread dump
  of the hung JVM, diag_freight/ the reproduction). Committed in
  docs/runs/artifacts/i678-reach-replay-prod100-2026-11-25/ with the sha256 of the server file (sha256_output.txt):
  i678_reach_replay.py (eedbe6cce01ce5e54e8665ee79e5b1d627d4599465b6db4216ec4aa722b05a33), i678_run_replay.sh
  (1713b6e83529f59decf6b782044fa3108e4191bbf6595849456df618057cd862), i678_reach_analysis.py
  (01789407e6eed9ff714aabc0df6463db38d06cf645e1a92bc3823949bb5dea21), i678_cut_subpopulation.py
  (4effc0aeb53be0bc58cd0cb802b4839ba5a52aa6a5fa4eebe646db6c4ff6e714), i678_diag_freight.sh
  (e62578e19eb72a7a9980eb9f58963eedcdf6602026c2a01d81193ea4e8af605b); the replay's summary replay_summary.json, the
  selected log lines replay_lines_output.txt (the line numbers of the server log kept), the thread dump excerpt
  thread_dump_excerpt_output.txt, the analysis analysis_before.json with its log analysis_before_output.txt, the
  reproduction diag_freight_{initial,final,driver}_output.txt and the config diffs config_diff_*_output.txt. Home
  directory paths are written as ~ in the committed outputs; nothing else differs from the server files.
environment: 'server (felix, hostname matsim, 64 cores, 94 GB), conda eqasim (~/miniforge3/envs/eqasim, Python 3.10), Java ~/tools/jdk-25.0.3+9 (25.0.3), Maven 3.6.3; 32 threads, -Xmx56G; load average about 4 at the start (another session ran populationsim workers)'
validation:
- metric: does the replay of the four prepare steps run on the full prepared population, and is a person lost?
  reference: 'none: a wiring check on model output'
  result: >-
    No. The jar check and mode_choice_reach.apply passed (1,261,590 persons in the file after each). The initial mode
    choice failed on the freight persons (NullPointerException in OutsideConstraint, initial mode null; see status)
    and wrote no output; the JVM hung after the exception and was stopped by hand after a wall time of 1:13:19 for the
    whole driver (choice phase 16:48:38 to 17:12:58 for the 1,205,226 persons that finished; peak resident memory of
    the largest process, the JVM, 48,625,136 kB as /usr/bin/time reports it). No population was replaced, so no person was lost, and the lift, the plan
    check, n_unreached_unfit and the threshold result do not exist for this replay.
  artifact: docs/runs/artifacts/i678-reach-replay-prod100-2026-11-25/replay_lines_output.txt
- metric: the failure on freight persons does not depend on the #678 settings
  reference: 'none: a reproduction on model input'
  result: >-
    The first 500 freight persons (freight_incoming_0 onwards; one leg mode="truck" without routingMode between
    freight_start and freight_end) fail with the same NullPointerException and the same stack (OutsideConstraint,
    CompositeTripConstraint, TourFromTripConstraint, TourBasedModel.chooseModes) with the initial config of #678 and
    with the final config (ActivityBased, VehicleContinuity, length 11); 4 threads, chunk size 100,
    -XX:-OmitStackTraceInFastThrow. Both JVMs hung after the exception as in the replay and were stopped.
  artifact: docs/runs/artifacts/i678-reach-replay-prod100-2026-11-25/diag_freight_final_output.txt
- metric: resident trips by reach class of the input population, under today's loop rule (coarse, 6), the branch's loop rule (coarse, 11) and the branch's initial rule (finer, 11)
  reference: 'none: a count of model output, classified with plan_check.leg_reach of the branch'
  result: >-
    3,697,894 resident trips. Today: reached 3,160,049, fixed_border 486,324, fixed_length 51,521. Loop of the
    branch: reached 3,207,293, fixed_border 486,324, fixed_length 4,277. Initial choice of the branch: reached
    3,223,256, fixed_border 444,614, fixed_vehicle 25,747, fixed_length 4,277. Trips not reached under today's rule but
    reached by the initial rule: 3,223,256 - 3,160,049 = 63,207 (difference of the reached counts; reached under
    today's rule implies reached under the initial rule, since the finer rule only cuts tours further). The
    classes of the loop rule hold before and after the initial choice and the lift (they depend only on the
    activities, which neither step changes). How many of the newly reached trips change their mode was not measured
    (no output of the choice).
  artifact: docs/runs/artifacts/i678-reach-replay-prod100-2026-11-25/analysis_before.json
- metric: resident plain walk trips over 5 km (straight line; mode walk, only walk legs, not pt-intended) of the input population by reach class
  reference: 'the "before" manifest docs/runs/i678-mode-choice-reach-probe-prod100-2026-11-25.yml (1,433 + 1,122 = 2,555 walks over 5 km in the trips of frozen tours that do not touch outside and in tours over 6 trips); model output, not observed data'
  result: >-
    Today's rule: fixed_border 1,433 (not touching outside) + 99 (touching outside), fixed_length 1,122, reached
    88,112. The 1,433 + 1,122 = 2,555 equal the "before" manifest. Loop of the branch: fixed_border 1,532, reached
    89,234 (fixed_length 0). Initial rule of the branch: fixed_border 99, reached 90,667. The counts after the
    initial choice and after the lift were not measured (no output of the choice).
  artifact: docs/runs/artifacts/i678-reach-replay-prod100-2026-11-25/analysis_before.json
- metric: border-tour vehicle legs relaxed for missing availability (counted from the input population) against the runner's running log lines
  reference: 'the running summary lines of BorderTourVehicleConstraint.Factory in the replay log (written whenever the relaxed count reaches a power of two); model output'
  result: >-
    Counted rule: a trip of a home-based tour with a trip at outside whose routing mode is car or bicycle, where
    BraunschweigModeAvailability does not offer that mode (car: carAvailability none or hasLicense no; bicycle:
    bicycleAvailability none). Residents: car 2,394 relaxed of 162,153, bicycle 67 of 1,415; in-commuters: car 0 of
    134,649; freight: none (truck). In total 2,461 of 298,217 (0.83 %). The runner's last running line was "2049 of
    264776 (0.77 %)" at 17:07:07 and no line for 4,096 appeared up to the end of the choice of all residents and
    in-commuters, so the runner's total lies between 2,049 and 4,095; the counted 2,461 lies in that range. The
    runner's own final total does not exist (the standalone runner writes no final summary line, and this run failed).
  artifact: docs/runs/artifacts/i678-reach-replay-prod100-2026-11-25/replay_lines_output.txt
- metric: the gap of the step-1 manifest (uncut 365 tours of 13 trips and 1,193 of 9 to 11 trips against 329 and 815 persons in the prepared population)
  reference: 'none: a count of model output'
  result: >-
    Explained by the cordon cut. Of the uncut resident home-based tours without an outside activity and with more
    than 6 trips (7,355), the same tour in the prepared population (matched by its index among the person's home
    tours; every person's tour count matched) has the same length and no outside activity in 6,554 cases and touches
    outside in 801 cases: 13 trips 329 + 36, 9 to 11 trips 812 + 381, 7 to 8 trips 5,413 + 384. A tour with an
    activity beyond the cut extent becomes a border tour, which the finer rule cuts into shorter runs. The 815 persons
    of step 1 with a longest run of 9 to 11 trips are these 812 plus 3 whose long run lies inside a border tour; the
    5,473 with 7 to 8 trips are 5,413 plus 60 (the 63 persons of step 1). The same 801 tours are the unexplained
    difference between 7,355 and 6,554 in the "before" manifest.
  artifact: docs/runs/artifacts/i678-reach-replay-prod100-2026-11-25/analysis_before_output.txt
