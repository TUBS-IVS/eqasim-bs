  artifact: docs/runs/artifacts/i678-reach-replay-prod100-2026-11-25/analysis_replay2.json
- metric: trips of border tours that the initial choice reached but that still have an unfitting mode after it (the number behind the loop switch)
  reference: 'none: model output; bounds of the plan check (walk 5 km, bicycle 30 km, pt-as-walk 5 km)'
  result: >-
    Of the 15,963 border-tour trips the initial choice reached, 1,433 were plain walks over 5 km and 538 pt-as-walk
    trips over 5 km before the choice; after it, 123 plain walks over 5 km remain unfit (no pt-as-walk, no bicycle).
    The loop (coarse rule) does not reach them, so the lift repaired them.
  artifact: docs/runs/artifacts/i678-reach-replay-prod100-2026-11-25/analysis_replay2.json
- metric: lifted trips by mode and reason, the taken-along bicycle trips, and the share of the other modes against max_share_other_modes
  reference: 'the bounds of the branch: max_share_other_modes 0.002 (an ASSUMPTION, ADR-0206) and the plan check pt share 0.02'
  result: >-
    Lift report (residents and in-commuters): pt 95, walk 1,470, bicycle 5, all fixed_border (fixed_vehicle 0,
    fixed_length 0); 2 bicycle trips taken along with their tour; share_lifted_other_modes 0.000376 (1,475 of 3,919,594
    trips) against 0.002, not exceeded; share_lifted (pt) 0.00231 (95 of 41,140) against 0.02, not exceeded. Residents
    only: walk 987, pt 67, bicycle 5 (3 unfit, 2 taken along); in-commuters the other 511. The 987 resident walks are
    123 inside trips the initial choice reached but left unfit, 99 border trips that were long walks already, 760
    border trips that were pt-as-walk before the choice (walk legs with the walkFallbackFrom=pt stamp) and lost the
    stamp in the runner's output although their mode was not re-chosen (same walk legs), so the plan check now judges
    them as walks, and 5 freed vehicle legs that became walks (unreached_changes_output.txt). The runner's re-routing
    of trips it did not re-choose also explains all 67 resident pt lifts: pt trips at the border with a pt leg before
    the choice that are walk-only after it.
  artifact: docs/runs/artifacts/i678-reach-replay-prod100-2026-11-25/replay2_frozen_pt_walk_lift.json
- metric: n_unreached_unfit and the plan check's threshold result
  reference: 'the plan check invariant of the branch (n_unreached_unfit must be 0 with all_modes) and its thresholds (max_frozen_defect_share 0.005, max_frozen_pt_as_walk_share 0.02)'
  result: >-
    n_unreached_unfit 0 in the frozen and the in-region resident block of plan_check.json (the same code gives 3,320 on
    the input and 1,568 after the initial choice). Threshold result: exceeded [share_plans_non_monotonic_large], 1.12 %
    (1,702 of 151,733 frozen residents) against 0.50 %; share_plans_late 0.003 % and share_pt_as_walk_long 0.0 are
