    build timestamp of matsim.runtime.eqasim (braunschweig-2.3.1.jar, 193,786,595 bytes, sha256
    8cf877113730d4ddd4397d660386189cd2b6d110bfbdf61e60f6b4c5962e6bb8; it holds BorderTourVehicleConstraint, its Factory
