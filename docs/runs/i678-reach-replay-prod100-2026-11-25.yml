  artifact: docs/runs/artifacts/i678-reach-replay-prod100-2026-11-25/analysis_replay2.json
- metric: border-tour vehicle legs relaxed for missing availability, own count against the runner's running log lines
  reference: 'the running summary lines of BorderTourVehicleConstraint.Factory (written whenever the relaxed count reaches a power of two); model output'
  result: >-
    Counted from the input population: a trip of a home-based tour with a trip at outside whose routing mode is car or
    bicycle, where BraunschweigModeAvailability does not offer that mode (car: carAvailability none or hasLicense no;
    bicycle: bicycleAvailability none). Residents: car 2,394 of 162,153, bicycle 67 of 1,415; in-commuters: car 0 of
    134,649. Total 2,461 of 298,217 (0.83 %). The runner's last running line in the second attempt: "2049 of 264642
    (0.77 %)" at 18:45:44; no line for 4,096 followed before "Done!", so the runner's total lies between 2,049 and
    4,095, consistent with the count. The standalone runner writes no final summary line.
  artifact: docs/runs/artifacts/i678-reach-replay-prod100-2026-11-25/replay2_lines_output.txt
- metric: the gap of the step-1 manifest (uncut 365 tours of 13 trips and 1,193 of 9 to 11 trips against 329 and 815 persons in the prepared population)
  reference: 'none: a count of model output'
  result: >-
    Explained by the cordon cut. Of the uncut resident home-based tours without an outside activity and with more
    than 6 trips (7,355), the same tour in the prepared population (matched by its index among the person's home
    tours; every person's tour count matched) has the same length and no outside activity in 6,554 cases and touches
    outside in 801 cases: 13 trips 329 + 36, 9 to 11 trips 812 + 381, 7 to 8 trips 5,413 + 384. A tour with an
    activity beyond the cut extent becomes a border tour, which the finer rule cuts into shorter runs. The 815 persons
    of step 1 with a longest run of 9 to 11 trips are these 812 plus 3 whose long run lies inside a border tour; the
    5,473 with 7 to 8 trips are 5,413 plus 60. The same 801 tours are the unexplained difference between 7,355 and
    6,554 in the "before" manifest.
  artifact: docs/runs/artifacts/i678-reach-replay-prod100-2026-11-25/analysis_before_output.txt
- metric: first attempt (79d0bcbd, no exclusion) - does the replay run on the full population?
  reference: 'none: a wiring check on model output'
  result: >-
    No: the freight NullPointerException and the hang described in status; residents and in-commuters (1,205,226) had
    finished their choice, no output was written, no population was replaced. The same failure on 500 freight persons
    with the initial config and with the stock config (diag_freight_*_output.txt).
  artifact: docs/runs/artifacts/i678-reach-replay-prod100-2026-11-25/diag_freight_final_output.txt
