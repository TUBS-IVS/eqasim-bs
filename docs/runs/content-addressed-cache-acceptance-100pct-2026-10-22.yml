decisions:
- ADR-0149
notes: >-
  What this run is evidence for: the content-addressed cache validity of ADR-0149 (Phase 3 tokens and migration, Phase
  4 early cutoff and cache_share coherence) behaves as designed on real stages of a real 100 % cache copy: comment edits
  and a touched Java tree change nothing, a body edit devalidates exactly the one stage, an unchanged output spares its
  two children, and a primed fresh directory reuses the jars when the recomputed parents reproduce their output.
  What it does not show: (1) no validation of any kind and no saved hours or hit rate (nothing was timed as a
  performance measurement); (2) the chain at scale: the plan's early-cutoff run on secondary_chainsolvers/escort.py was
  infeasible because secondary_chainsolvers is not_in_meta in this copy (the 2026-08-21 cache predates the current
  code, so a run would recompute popsim and chainsolver for hours); the comment edit in escort.py is checked (S1), the
  body-edit and early-cutoff runs use matsim.runtime.java with its two jar children, which share the same run() code
  path; (3) the production launcher's behaviour for non-target stages; (4) the three older matsim.runtime.eqasim
  variants, which carry no envelope; (5) the planned scenario-4 cases that were not run: a primed entry whose parents
  are ALL shared (expected HIT with no legacy timestamp rule lines for fork-written entries), and the expected
  recompute of braunschweig.freight.extraction after the rebuilt braunschweig.freight.extraction_tool jar (R17-2);
  only the unshared-parent case (R17-3) was run, and the expected R17-2 recompute is known from the jar finding
  only, not observed on the extraction stage; (6) X2 and X4 re-execute parents with a 4-byte output (wiring only;
  X5 is the non-trivial case, on one stage pair). HARNESS RULING (S2 versus X2): the launcher always passes rerun_required=True,
  so run targets re-execute whatever their parents produced; the early-cutoff scenarios therefore use the driver
  run_targets_cached_i468p4.py, which runs the same composed configuration through the installed fork with
  rerun_required=False (a harness detail; the stages to be spared must not be run targets, and production benefits on
  non-target stages, where the expensive chain lies). FAILED FIRST ATTEMPT: the first run of cutoff_scenarios_i468p4.sh
  failed at once with ModuleNotFoundError for braunschweig (the driver lives outside the worktree); it was fixed by
  putting the working directory on sys.path and re-run; the log of the failed attempt is
  run_logs/cutoff_attempt1_driver_import_error.log.txt. NON-REPRODUCIBLE JARS: see the last validation entry.
