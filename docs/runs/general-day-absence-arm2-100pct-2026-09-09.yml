notes: 'HOW TO READ THIS MANIFEST. (1) Arm 2 is a SENSITIVITY arm: it is not a candidate production
  configuration and "missing" row 3 is its RESULT, not a failure. Read it as the counterfactual that
  licenses the household stage, which ADR-0110 otherwise justified by a design argument alone.
  (2) Exactly ONE row discriminates between arm 1 and arm 2 -- row 3, clustering, 63.7 % against
  24.2 %. Rows 1, 2, 4 and the whole at_home_zero participation block are identical between the arms
  to within 0.07 pp, because the number and age composition of absent persons is the same in both
  and only their household allocation differs. Anyone tempted to judge the household stage by the
  headline metrics should note that those metrics CANNOT see it. (3) The 24.2 % residual clustering
  is a definitional artefact of single-person households, not behaviour: about 22 of those 24 points
  are singles who are a "fully absent household" the moment they are drawn at all. (4) Row 6 and the
  escort diagnostic are the two places where this arm contributes beyond its ladder position: the
  singles rate (5.53 % vs arm 1 7.61 %, reference 5.14 %) isolates the DOUBLE draw as the cause of
  the #388 defect, and the children-with-absent-escorter count (4,095 vs 2,006) shows the household
  stage halves an escort-coherence gap that no pre-registered row measures. (5) Row 5 is a genuine
  gap, not an omission of this record: it needs an at_home_only follow-up run that was never
  executed for arm 2. (6) The run stopped inside synthesis.output with no error marker; both
  analysis targets had already completed, so no measurement in this manifest depends on the missing
  part.'
source: 'Arm 2 (individual-only sensitivity: day_absence_household_stage_enabled false) of the
  pre-registered A/B ladder of ADR-0110, run at 100 % on a hardlink copy of the arm-4 cache from a
  detached worktree at the pushed PR #387 head 9184f594 (tree-identical to main ada06b61), measured
  by braunschweig.analysis.synthesis.plan_structure_vs_srv (reporting-day view, universe
  at_home_zero) and braunschweig.analysis.synthesis.work_participation_by_kreis against the
  committed SrV references (issue #370; #370 SDD plan Task 10). Recorded on 2026-09-18 from the
  server artefacts and log of the 2026-09-09 run; no stage was re-executed for this record.'
