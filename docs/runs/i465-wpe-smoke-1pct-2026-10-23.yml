  artifact: 'docs/runs/artifacts/i465-wpe-smoke-1pct-2026-10-23/schedule_hours.txt (schedule_hours_i465.py); felix:~/wt-i465-wpe/logs/run_wpe_20261022T230108.log (lines [transit_next_day])'
  notes: >-
    The doubling the ADR expected between 24 and 26 h is small in the full schedule (+46, +24, +19 departures) and
    absent after the cut: the cut extent has no departure before 03:00, so nothing is repeated at 24 to 26 h there.
    What the extension adds in the study area are the morning departures of the next day at 27 to 29 h (03:00 to
