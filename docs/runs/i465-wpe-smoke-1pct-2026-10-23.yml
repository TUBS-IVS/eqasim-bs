environment: 'server felix (Linux, 64 cores, 94 GB), conda env eqasim (Python 3.10.10), JAVA_HOME ~/tools/jdk-25.0.3+9 (set by launch_wpe.sh); no other job ran on the server during the run'
validation:
- metric: residents stuck walking at the end of the simulated day in frozen tours (issue #465, done-when item 3)
  reference: 'baseline arm 2 of i453-i443-ab-1pct-2026-10-16 (same seed and persons, code 3123cc4f, jar 923d3d7); no observed reference'
  result: >-
    Frozen residents stuck at the simulation end (108,000 s) with legMode walk: 58 (baseline) -> 20 (this run). Of
    these, planned as pt in the scenario population (leg with the nearest planned departure): 56 (49 exact departure
    matches) -> 17 (11 exact). The 20 are 10 incommuters (persons of braunschweig.synthesis.incommuters, ids 1125708
    to 1126281, all with a work <-> outside or work <-> home leg) and 10 synthesis residents; 19 of the 20 stuck legs
    are 24.7 to 125.3 km long (plan distance of the final iteration), one 8.3 km, and they depart between 17:11 and
    29:23 (stuck_trace columns plan_leg_dist_km, plan_leg_dep_h; computed on launch 2, identical metrics). The
    incommuters are not touched by the timetable-aware gate choice (WP-C works on the portal stays of residents);
    the same 10 incommuter legs, with identical planned times and distances, are stuck in the baseline too. No #465
    work package checks the timetable for incommuter pt legs (#467 concerns incommuter plans beyond 30 h).
  artifact: 'docs/runs/artifacts/i465-wpe-smoke-1pct-2026-10-23/stuck_walkers_run1.txt, stuck_walkers_baseline_arm2.txt (stuck_walkers_i465.py on the stuck traces of stuck_trace_i453.py)'
  notes: >-
    Bounded, not gone: 20 remain. This is the done-when wording "gone or bounded" read as a fall from 58 to 20 in one
    draw; no bound was fixed in advance, so "bounded" here means only "counted and much smaller", not "below a target".
    One draw per run; differences of a few agents are not separable from run-to-run variation, which is not estimated.
    The code differs from the baseline in everything merged between 3123cc4f and 3ebe789a, not only in WP-A/B/C, so
    the fall is not attributed to one work package.
- metric: planned-pt portal trips realised as walk after prepare (routing plus cordon cut)
  reference: 'baseline arm 2, the same script portal_trip_modes_i453.py on both runs; no observed reference'
  result: >-
    Planned-pt portal trips (outside activity with portalGate=true) 246 -> 110, of which walk after prepare 90 (36.6 %)
    -> 21 (19.1 %). Outbound 123 -> 55 planned pt, walk 28 -> 5; return 123 -> 55, walk 62 -> 16. Departing at 23:00
    or later: 33 of 33 walk (baseline) -> 5 of 6 walk (this run; 24 h 1 of 1, 26 to 28 h 2 of 2, 28 to 30 h 2 of 3).
    Distance of the trips that became walk: median 8.7 -> 9.1 km, maximum 111.5 -> 83.2 km.
  artifact: 'docs/runs/artifacts/i465-wpe-smoke-1pct-2026-10-23/portal_trips_baseline_arm2.txt, portal_trips_run1.txt'
  notes: >-
    The denominator falls because the no-connection chain switched 68 portal stays to car or car passenger (see the
    gate-choice entry), so the share and the count both fall for two reasons: fewer pt trips planned, and fewer of the
    remaining ones without a connection. The baseline table reproduces the figures of issue #465 (246, 90, 33 of 33).
- metric: plan check of the prepared population, pt trips replaced by a walk (WP-B), per class and hour, against braunschweig.plan_check.max_frozen_pt_as_walk_share
  reference: 'max_frozen_pt_as_walk_share 0.02, an ASSUMPTION (base value of #480); no observed reference. The baseline jar 923d3d7 writes no walkFallbackFrom stamp, so the baseline has no comparable count'
  result: >-
    Frozen residents: 33 of 461 pt-intended trips are walks (7.16 %, above 2 %); by departure hour {1: 1, 3: 3, 5: 2,
    8: 2, 9: 1, 10: 1, 11: 1, 14: 2, 15: 1, 16: 3, 17: 3, 18: 4, 19: 1, 20: 4, 21: 2, 22: 2}. In-region residents: 0
    of 2,166. Freight: no pt trips. The prepare stage logged ERROR for the frozen share and continued
    (fail_on_threshold false, production value). The eqasim PlanRouter log of prepare counts two routing passes:
    before the cordon cut pt 852 of 3,432 trips replaced by a walk (24.8 %), and the re-routing inside the cut 33 of
    2,627 (1.3 %); the plan check reads the cut population.
  artifact: 'felix:~/wt-i465-wpe/logs/run_wpe_20261023T003208.log (lines [plan_check] and [PlanRouter] walk fallback); docs/runs/artifacts/i465-wpe-smoke-1pct-2026-10-23/metrics_final.json (key plan_check.subpopulations.residents)'
  notes: >-
    OPEN FINDING: the stamp count undercounts the walks that matter. Of the 20 frozen residents stuck walking at the
    end of the day, only 4 have a leg stamped walkFallbackFrom=pt in the prepared plan, while 17 were planned as pt
    (stuck_walkers_run1.txt). The walk legs of the other planned-pt trips reach the simulation without the stamp, so
