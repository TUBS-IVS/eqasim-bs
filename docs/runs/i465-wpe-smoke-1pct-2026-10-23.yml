- metric: next-day departures (WP-A, ADR-0151), departures per hour before and after the cordon cut
  reference: 'baseline arm 2 output schedule; ADR-0151 consequence "doubled service between 24 h and about 26 h" is an ASSUMPTION; no observed reference'
  result: >-
    Full pt2matsim schedule (log [transit_next_day]): 2,560 of 49,906 departures (5.1 %) duplicated up to 6 h, 2,560
