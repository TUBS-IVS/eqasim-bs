id: i465-wpe-smoke-1pct-2026-10-23
date: '2026-10-23'
repository:
  commit: 'b8564d02 (final launch); a485104e (second launch); 3ebe789a (first launch, origin/main)'
  branch: fix/i465-wp-e-smoke
  notes: >-
    eqasim-bs: origin/main 3ebe789a (after the merges of #478 WP-A, #480 WP-B and #481 WP-C) plus the two fixes this
    run needed, both on the branch of this manifest: a485104e (the batch pt router config gets the qsim values the
    eqasim injector requires) and b8564d02 (matsim.simulation.run replaces the symlinks of the MATSim output before
    synpp hashes it). The commits reached felix as a git bundle, not by a push; the felix worktree was checked out
    detached at exactly these commits. If the PR is squash-merged, main gets one commit with the same tree. Java:
    eqasim-java-bs main 863c09a (after #36 WP-B and #37 WP-C), detached worktree ~/wt-i465-wpe/eqasim-java-bs; the jar
    was built by matsim.runtime.eqasim from that tree (braunschweig-2.3.1.jar, stamps walkFallbackFrom, checked by the
    plan check at 00:52:05). The eqasim-java-bs fix "classify batch router walk legs by their position among the legs"
    (branch fix/batch-router-egress-walk, not merged at the time of the run) is NOT in this jar; it changes no output
    for legs-only router results, see the validation entry "batch router walk-leg classification". The shared checkouts
    ~/eqasim-bs (branch feature/i436-v3-b-data) and ~/eqasim-java-bs (feature/i436-v3-a-mechanics) were only fetched,
    never switched or pulled (scripts/update_server.sh was not run because it pulls whatever branch is checked out).
configuration:
  base: configs/base_bs.yml
  overlays:
  - docs/runs/artifacts/i465-wpe-smoke-1pct-2026-10-23/i465_wpe.yml
  notes: >-
    Throwaway server overlay, derived from the overlay of arm 2 of the baseline A/B (i453_arm2.yml of
    i453-i443-ab-1pct-2026-10-16): sampling_rate 0.01, matsim_last_iteration 100 (MATSim iterates until the eqasim
    mode-share termination criterion or 100 iterations), braunschweig.population.popsim.max_cells 750, num_workers 1,
    the same popsim work-dir STRING as arm 2 (it enters the popsim hash; popsim stayed cached and never ran),
    cache_share off, braunschweig.outside_tour_modes.enabled true. Own working directory (a physical copy of the
    baseline's cache_arms12), own output_path and output_prefix. Every other key keeps the base value of 3ebe789a,
    including the new keys of WP-A/B/C (next_day_hours 6.0, plan_check.max_frozen_pt_as_walk_share 0.02, the
    braunschweig.portal.* gate keys). The overlay carries the launcher gate synpp_expected_stale_stages (the 35 stages
    of explain_first_launch.txt); run targets synthesis.output and matsim.output, like the baseline.
sampling:
  rate: 1% (sampling_rate 0.01)
  scope: ZGB-8, full region, cordon on (base configuration)
  notes: >-
    Sample counts at sampling_rate 0.01, never expanded. Residents in the MATSim output 12,041 (baseline arm 2:
    12,041), freight agents 521 (521). Same random seed (base value), same synthetic persons, donors and trips as
    baseline arm 2 (popsim, mid_donor, completed_donor and popsim.trips_stage were cache hits of the copied working
    directory, see pipeline).
pipeline:
  targets:
  - synthesis.output
  - matsim.output
  notes: >-
    Cache procedure: ~/wt-i465-wpe/cache_wpe is a physical copy (cp -a, 24 GB) of the baseline's
    ~/wt-i453-ab/cache_arms12. Because the copy predates ADR-0149, scripts/migrate_cache_metadata.py was run on the
    COPY with --legacy-source-rev 3123cc4f (the commit that wrote the arm-2 entries; the default revision 205a0fb7 is
    later): 248 of 392 entries migrated, 144 kept legacy (log migrate_cache_metadata.txt). The explainer then listed 35
    stages stale for own reasons and 62 hits, popsim, mid_donor, completed_donor and trips_stage among the hits
    (explain_first_launch.txt): the supply chain (WP-A: supply_gtfs, supply.processed, cordon network, pt gates,
    cordon gates), the jar and freight (matsim.runtime.eqasim, freight extraction tool, extraction, trips), the location
    chain from synthesis.population.spatial.primary.candidates (output_path enters it), the portal stages (WP-C),
    prepare, MATSim and output, plus distance_distributions, secondary_candidates and parking.zones_stage (code changed
    on main). Three launches. Launch 1 (23:01, 3ebe789a) failed at 00:25 in braunschweig.synthesis.portal_trips.stage:
    RunBatchPublicTransportRouter builds the full eqasim injector, and the minimal router config of WP-C lacked
    qsim.personInitializedEvents=all and qsim.endTime (fixed in a485104e, see the validation entry "gate choice").
    Launch 2 (00:32, a485104e) ran the gate choice, prepare and 87 MATSim iterations and failed at 03:08 in the synpp
    fork's output hash: the eqasim-java-bs SimWrapperHouseholdsInputLinker leaves a symlink in simulation_output, and
    ADR-0149 refuses symlinks (fixed in b8564d02). Its MATSim output was moved aside to
    ~/wt-i465-wpe/run1_matsim_simulation_run.cache before launch 3. Launch 3 (03:13, b8564d02) recomputed only
    output_day, matsim.simulation.run and matsim.output (explain_final_launch.txt).
classification:
- smoke
status:
  execution: completed
  notes: >-
    Final launch completed with exit 0 (server clock, CEST): launch 1 2026-10-22 23:01 to 2026-10-23 00:25 (exit 1,
    portal stage), launch 2 00:32 to 03:08 (exit 1 after MATSim, output hash), launch 3 03:13 to 05:27 (exit 0). MATSim
    was stopped by the eqasim mode-share termination criterion after iteration 87 of at most 100 in launches 2 and 3:
    the mode shares stabilised (change below the threshold), which is convergence, NOT validation. Launches 2 and 3
    simulated the same prepared scenario; their modestats.csv are identical and every metric of this manifest is
    identical between them (metrics computed on both), while output_events.xml.gz is not byte-identical (the first
    differences are the order of events with the same time stamp). The figures below come from launch 3 (output
    ~/wt-i465-wpe/output_wpe); stuck_walkers_run1.txt and portal_trips_run1.txt were computed on launch 2 and the
    prepared population both launches share. After the run the explainer reports only the two run targets stale
