    56 threads); tasks without a route per call 4, 8, 0, 5, 0, 6, 0, 4, 1, 3 (largest shares 6 of 10 and 3 of 5, logged
    as WARNING above NO_ROUTE_WARN_SHARE 0.5). By hand with the same jar: the 183 tasks of the first call in 31 s
    (5.1 GB RSS), the same tasks replicated 100 times (18,300 tasks, 32 threads) in 55 s, of which 20 s routing
    (about 915 tasks per s), 11.3 GB RSS.
  artifact: 'felix:~/wt-i465-wpe/cache_wpe/braunschweig.synthesis.portal_trips.stage__f19f2d15ddc5414759d8e8957d6f005f.cache/portal_trips_report.json (copied into metrics_final.json, key stage_reports); docs/runs/artifacts/i465-wpe-smoke-1pct-2026-10-23/router_probe_i465.sh; felix:~/wt-i465-wpe/analysis/router_try, router_x100'
  notes: >-
    The 100 % runtime is NOT measured by a 100 % run. Estimate from these numbers: 10 calls at the task count of a
