- metric: timetable-aware gate choice and no-connection chain (WP-C, ADR-0152), batch router runtime and no-route behaviour
  reference: 'ADR-0152 ASSUMPTION "under 15 min at 100 %" and no_connection_warn_share 0.05 (an ASSUMPTION); no observed reference'
  result: >-
    123 pt portal stays. Gate reasons: gate_found 41, no_gate_served 36, no_connection 46. Chain: gate_found 39,
    tour_to_car 60, tour_to_car_passenger 8, departure_shifted 2 (median shift 3,600 s), kept_no_connection 14;
    68 stays switched for the reason no_pt_connection; 55 pt stays remain. The stage logged WARNING: 84 of 123 pt stays
