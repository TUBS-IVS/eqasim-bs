validation:
- metric: first gate choice of the 11,930 pt stays (choose_pt_gates over all pt stays)
  reference: 'the run''s own report (prod100_20261031, old rule: five smallest detours before the service check); model output, NOT observed data'
  result: >-
    gate_found 3,842 -> 6,708 (32.2 % -> 56.2 %), no_gate_served 4,481 -> 2,014 (37.6 % -> 16.9 %), no_connection
    3,607 -> 3,208. New rates of that call: 2,918 of 11,930 stays (24.5 %) took a gate beyond the old five smallest
    detours; 1,620 (13.6 %) have no served stop within the 10 km cap although a directional stop beyond it is served.
    The served share within the cap (83.1 %) equals the read-only probe figure for +10 km in issue #572 (a second
    model computation, not an independent reference).
  artifact: docs/runs/artifacts/i572-portal-replay-prod100-2026-11-05/summary.json
- metric: pt stays after the no-connection chain, and stays by mode
  reference: 'the run''s own report (prod100_20261031); model output, NOT observed data'
  result: >-
    gate_found 3,784 -> 6,672, tour_to_car 6,214 -> 4,142, tour_to_car_passenger 757 -> 445, lift 933 -> 364,
    departure_shifted 242 -> 307. Stays by mode: pt 4,026 -> 6,979, car 37,517 -> 35,445, car_passenger 10,609 -> 9,728
    (bicycle and walk unchanged); mode substitutions 9,624 -> 6,791. The stage still WARNs: 5,258 of 11,930 pt stays
    (44.1 %) end without a timetable-aware gate (warn above 5 %); the other items of the findings behind #572
    (issues #573 to #576) address further causes; this rule does not. No trip arrives after 30.0 h and no trip has a negative duration.
  artifact: docs/runs/artifacts/i572-portal-replay-prod100-2026-11-05/summary.json
