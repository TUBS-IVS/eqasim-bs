issues:
- '#370'
- '#388'
- '#373'
- '#385'
decisions:
- ADR-0110
- ADR-0104
- ADR-0109
notes: 'HOW TO READ THIS MANIFEST. (1) Rows 1 and 2 are met BY CONSTRUCTION: the SrV band rates are
  the parameters of the draw, so meeting them proves the wiring (draw -> reporting-day view ->
  analysis), not predictive power. Row 3 (clustering), row 4 (check 1) and row 5 (participation on
  at_home_only) are the rows the design could have missed. (2) The at_home_zero participations fall
  mechanically when 5 % of persons lose their day; the fair participation comparison is
  at_home_only, where the absent persons are removed from both sides (row 5). (3) Arm 0 of this
  ladder, not the arm-4 manifest, is the OFF baseline for every delta quoted here: arm 4 was
  measured on the pre-assignment view. (4) The per-size row shows the limitation ADR-0110 states; it
  is the motivation of issue #388 and is compared, not corrected, here. (5) The absence stage ran
  once in the harness smoke and was a cache hit in the arm run; its log lines therefore come from
  ~/b370_smoke.log and the cache hash cb2a892e ties the two together.'
source: 'Arm 1 (base_bs.yml defaults: two-stage general day-absence draw ON) of the pre-registered
  A/B ladder of ADR-0110, run at 100 % on a hardlink copy of the arm-4 cache from a detached
  worktree at the pushed PR #387 head 9184f594 (tree-identical to main ada06b61), measured by
  braunschweig.analysis.synthesis.plan_structure_vs_srv (reporting-day view, universe at_home_zero
  primary and at_home_only sensitivity) and braunschweig.analysis.synthesis.work_participation_by_kreis
  against the committed SrV references (issue #370; #370 SDD plan Task 10)'
