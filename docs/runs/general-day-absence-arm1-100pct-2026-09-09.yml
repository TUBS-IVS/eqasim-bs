  notes: 'ARM 1 IS THE BASE CONFIG DEFAULT STATE: no flag of the package is overridden.
    day_absence_enabled true, day_absence_household_stage_enabled true,
    day_absence_max_band_deviation_pp 1.0, random_seed 1234 plus the fixed DAY_ABSENCE_SEED_OFFSET
