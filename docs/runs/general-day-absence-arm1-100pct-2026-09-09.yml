    eqasim_version "2.3.1", run list [synthesis.output,
    braunschweig.analysis.synthesis.plan_structure_vs_srv,
    braunschweig.analysis.synthesis.work_participation_by_kreis]. The DATA DIRECTORY
    ~/b370_data/data was built as for arm 4: every top-level input tree except braunschweig
