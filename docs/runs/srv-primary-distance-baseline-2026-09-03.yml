  python -c "import sys; sys.path.insert(0, ''.''); D=''eqasim-data/data/braunschweig/calibration/srv_distance_baseline_2026-09-03''; from documentation.plots import srv_commute_distance as P; P.plot_work_bands(D + ''/commute_by_kreis.csv'', D + ''/work_intra.png'', scope=''intra'')";
  python -c "import sys; sys.path.insert(0, ''.''); D=''eqasim-data/data/braunschweig/calibration/srv_distance_baseline_2026-09-03''; from documentation.plots import srv_commute_distance as P; P.plot_education_bands(D + ''/education_by_kreis_level.csv'', D + ''/education.png'')"'
