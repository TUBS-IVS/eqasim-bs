  notes: >-
    Code state of every table of this run: 855b10fd (written in the header of each committed table, calibration artifact,
    option table and the decision aid). Commit 1b88c47d holds the tables of that re-run (the five committed tables and every
    run artifact); the sha256 values under pipeline.notes are those of the blobs at 1b88c47d. The commits of the phase are
    listed by git log bd7844f7..HEAD. The run directory, host and user are not recorded in tracked files.
configuration:
  base: configs/base_bs.yml
  notes: >-
    No model configuration. No synpp stage reads the tables yet (Phases 3 and 4 of #140). The settings of the build are
    CLI arguments (weights, mover share, weight rule, max_commute_km); the values used are in the Weights and Weight rule
    lines of every table header.
sampling:
  rate: not applicable (head-count tables from published aggregates)
  scope: >-
    Study region ZGB (eight Kreise as homes), the 21 sites of 16 institutions of the choice set (two distance-learning institutions are dropped), CHE origins WS 2022/23 scaled to LSN
    enrollment WS 2024/25, SrV 2023 destination reference of the seven surveyed Kreise (Wolfsburg 03103 is not surveyed).
  notes: The table rules (two CHE views, censored cells, art academy, distance learning) are in ADR-0210.
pipeline:
  targets:
  - scripts/build_student_balance.py
  notes: |-
    Commands (local-only inputs are named by file name and sha256, never by path). Calibration: python -X utf8 scripts/build_student_balance.py calibrate
    --sites lsn_university_sites.csv --vg250 vg250-ew_12-31.utm32s.gpkg.ebenen.zip --source-commit 855b10fd --out-dir <run artifact dir>
    (the comparison run adds --weight-rule centroid_bands).
    Final tables (option C, the five committed tables): python -X utf8 scripts/build_student_balance.py balance --sites lsn_university_sites.csv
    --vg250 vg250-ew_12-31.utm32s.gpkg.ebenen.zip --zensus-students zensus2022_students_20_29_kreis.csv --zensus-employed zensus2022_employed_by_age_kreis.csv
    --weights 1,1,0.3 --mover-share 0.4 --mover-site-kreise 03158 --weights-source owner --source-commit 855b10fd
    --artifact-dir <run artifact dir> --final --out-dir eqasim-data
    (--mover-site-kreise has a default, 03102,03103,03158, that the final run does NOT use.)
    Option runs (options/<label>/): the same call with --label <option> instead of --final --out-dir; the weights, mover share, mover site Kreise and
    source of each option are in the Weights line of its table headers (A: 1,1,0.95 and 0, calibrated; B: 1,1,0.55 and 0.15, calibrated; C: as the final run;
    comparison_centroid_bands: --weight-rule centroid_bands with 1,1,0.5 and 0.2, calibrated; A, B and the comparison use the default mover site Kreise).
    The decision aid is weights_decision/analyse_weight_candidates.py in the artifact directory (arguments in its docstring).
