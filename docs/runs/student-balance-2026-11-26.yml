notes: >-
  Limitations. (a) The in-commuters are observed nowhere; the CHE counts only bound them (the censored bound columns).
  (b) The pooled level lies below SrV in comparison 1 (and far below in comparison 2, see the validation entries); the
  cause is not measured. Candidate explanations: distance-learning students and institutions outside the choice set
  are not in the balance (counts in the Diagnostics line); the balance counts enrolled students while SrV counts
  students by main activity (assumption A16, two errors in opposite directions); the SrV count covers only the
  surveyed municipalities of a Kreis, and the whole-Kreis comparison applies their share to all municipalities. (c)
  Goslar (03153) lies far above the SrV estimate in comparison 1; SrV covers selected municipalities of that Kreis
  only. (d) The weights are not identified by SrV: the calibration ranges within the noise floor (validation entries)
  span most of their interval; the triple and the mover share are an assumption of the owner. (e) The owner has not
  decided the level (design A2): the two gate comparisons disagree (validation entries). (f) The distance yardsticks
  of the decision aid compare a straight line times the detour factor 1.3 (an assumption) with routed SrV distances.
  (g) A table build and a calibration on survey aggregates, not a validation; the tables count heads, no day factor is
  applied. Decisions: ADR-0210.
