notes: >-
  Limitations. (a) The in-commuters are observed nowhere; the CHE counts only bound them (the censored bound columns). (b)
  The pooled level lies below SrV: distance learning and institutions outside the choice set are not in the balance (assumption
  A16 of braunschweig/calibration/student_level_table.py); sign and size per row are in the gate file. (c) Goslar (03153)
  lies far above the SrV estimate; SrV covers selected municipalities of that Kreis only. (d) The weights are not identified
  by SrV: the calibration ranges within the noise floor (validation entries) span most of their interval. (e) A table build
  and a calibration on survey aggregates, not a validation; the tables count heads, no day factor is applied. Decisions:
  ADR-0210.
