notes: >-
  Cost of landing the changes (static audit, scripts/audit_synpp_helper_hash.py, covered[] of each stage; durations are single observations of the
  production log of this run, 2026-10-31/11-01, not a benchmark). Whichever stage hashes an edited module re-executes once on the next run that starts
  from a valid cache; early cutoff spares descendants whose input digest is unchanged, and no output changes here. (1) The staleness report and the
  launcher are no stage input: no cost. (2) braunschweig/data/hts/mid_donor.py is itself a stage: 146 s. (4) braunschweig/synthesis/vehicles/fleet_sampling_de.py is hashed by
  braunschweig.synthesis.incommuters (32 min 27 s) and braunschweig.synthesis.student_incommuters (8 min 6 s), the two stages the branches
  fix/c5a-composition-clip-residual and fix/c5b-composition-sole-gemeinde-not-applicable invalidate as well, so landing any of them with the
  others costs one re-execution. (3) braunschweig/popsim/mid/donor.py is hashed by seven stages: analysis_suite (38 min 43 s),
  data.hts.mid_donor (146 s, the stage of (2)), popsim.completed_donor (42 min 44 s), popsim.distance_distributions (61 s), popsim.stage (12 h 55 min 55 s),
  synthesis.commute_day.home_office_donors_stage (37 s) and synthesis.locations.secondary_chainsolvers (32 min 2 s), 14 h 53 min in total with
  data.hts.mid_donor counted once, which is the price of changing the level of one log line there. The change is a separate commit so that it can be landed together with the next change that
  re-executes the PopulationSim stage anyway, or left out.
