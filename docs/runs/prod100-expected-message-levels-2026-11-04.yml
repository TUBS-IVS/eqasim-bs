  artifact: docs/runs/artifacts/prod100-expected-message-levels-2026-11-04/production_log_lines.txt
- metric: HP_SEX codes of the raw MiD 2023 person file (message 2)
  reference: 'felix:/home/felix/eqasim-bs/eqasim-data/data/braunschweig/popsim/mid2023_raw/MiD2023_Personen.csv (349,281,354 bytes, dated 2026-06-16, sha256 fcb458bf720a0686aa63a5a00e36f489e23b42b6c4b02a7210636da58dc4a0cb); the file the run read, NOT observed reality'
  result: >-
    420,979 persons; HP_SEX 1: 209,094, 2: 211,144, 3: 614, 9: 127. 741 persons (0.1760 %) carry a code other than 1 and 2, exactly the 741/420979
    of the production log. The sex imputation is therefore a property of the survey file, not a defect of the run. The warn bound
    SEX_IMPUTED_WARN_SHARE of braunschweig/data/hts/mid_donor.py is an ASSUMPTION of 1 %, about 5.7 times the measured share, so that a
    change of the file or of the coding reaches it and the file as delivered does not.
  artifact: docs/runs/artifacts/prod100-expected-message-levels-2026-11-04/mid_raw_measurement.txt
  notes: >-
    The same imputation is logged at INFO by the resident path (braunschweig.popsim.expand.map_demographics); the donor stage was the only one that warned.
- metric: the H_ID=0 bucket of the raw MiD 2023 files (message 3)
  reference: 'felix:/home/felix/eqasim-bs/eqasim-data/data/braunschweig/popsim/mid2023_raw/MiD2023_Personen.csv and MiD2023_Haushalte.csv (the files the run read); NOT observed reality'
  result: >-
    312 of the 420,979 person rows have H_ID 0 (one distinct id, no null), and none of the 218,101 household rows has H_ID 0 or null: the
    pair (0 household rows, 312 persons) of the production log. It is a fixed property of the delivery, recorded as
    MID_2023_INVALID_HOUSEHOLD_ROWS and MID_2023_INVALID_HOUSEHOLD_PERSONS in braunschweig/popsim/mid/donor.py. load_completed_donor now logs exactly
    that pair at INFO and any other pair (more, fewer or none) as a warning.
  artifact: docs/runs/artifacts/prod100-expected-message-levels-2026-11-04/mid_raw_measurement.txt
- metric: metadata census of the production cache against the two states of the legacy md5 hint (message 1)
  reference: 'felix:~/prod100_20261031/cache/pipeline.json.before_token_patch (dated 2026-10-16) and pipeline.json (dated 2026-11-01 05:01); the files as they stand, NOT observed data'
  result: >-
    The backup of 2026-10-16 holds 348 entries, all with a 32-hex md5 module hash and none with an output digest or fork marker: a cache that was never migrated.
    The file after the run holds 513 entries, 139 with an md5 hash and 374 with both an output digest and a fork marker; no entry has both. The
    migration therefore leaves an entry either fully migrated or byte-for-byte unchanged, and a cache the migration or a fork run has been through holds
    output digests, which is the marker the explainer now uses. At launch the explain report named exactly one stage of the graph with a legacy hash,
    braunschweig.data.verbindungen.margins, STALE [module_hash_changed]; it re-executed at 22:03:51 in about one second (0 files, 2,798 bytes), so
    its cost was nil. The ERROR was a state that is genuinely stale and needs no action.
  artifact: docs/runs/artifacts/prod100-expected-message-levels-2026-11-04/pipeline_json_census.txt
  notes: >-
    The pipeline.json of the launch moment (2026-10-31 07:13) is not preserved; the file after the run is what the census reads. Which of its 139 md5
    entries belong to the graph of that launch was not examined: the explainer counts only stages of the graph, and it counted one.
- metric: the in-commuter Gemeinde-tilt accounting on the committed tables (message 4)
  reference: 'eqasim-data/data/braunschweig/kba/derived/kba_gemeinde_ev.csv and kba_kreis_fuel.csv as committed (NOT observed fleet data); braunschweig.data.cordon.demand.select_inbound_flows (origins that are ZGB Kreise are excluded) and braunschweig.synthesis.incommuters.build_incommuter_fleet (the home Gemeinde of an in-commuter car is NaN)'
  result: >-
    The Gemeinde EV table covers 8 Kreise (03101, 03102, 03103, 03151, 03153, 03154, 03157, 03158, the ZGB), the Kreis fuel table 403. An in-commuter car has
    no home-Gemeinde label and its origin Kreis is not a ZGB Kreis, so its Gemeinde tilt can never fire; counted as a fallback it read 100 % on every
    run. Run through build_incommuter_fleet with 400 illustrative agents whose origin Kreise lie outside the table, the changed code logs at INFO
    "primary 0/0 (0.0%), fallback 0 (0.0%); not applicable 400" with the Kreis lookup at 100 % primary, the same shape as the production block. A car
    with a label that cannot be used, or in a Kreis the table covers, stays a fallback and warns above 50 % of the applicable cars (tests/test_fleet_gemeinde_tilt_not_applicable.py).
  artifact: docs/runs/artifacts/prod100-expected-message-levels-2026-11-04/incommuter_fleet_log_observation.txt
  notes: >-
    The change only counts one car in one of two counters; no pmf, draw or random stream changes, so no sampled vehicle can change. The observation
    is an illustration of the log line on the committed tables, not a replay of the production in-commuter population.
