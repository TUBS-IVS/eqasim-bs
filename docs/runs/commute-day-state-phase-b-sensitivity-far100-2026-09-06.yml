issues:
- '#244'
- '#377'
decisions:
- ADR-0104
notes: 'Sensitivity companion to the 2026-09-06 proof re-run, adding two new points
  (far_threshold_km=100.0 at absent_share_far=1.0 and 0.6) beside the two the proof re-run already
  measured at far_threshold_km=200.0 (absent_share_far 1.0 the production default, 0.6 ADR-0104
  check 5). KEY FINDING, stated once here and not duplicated elsewhere: the reporting-day and
  assigned commute-distance bands (check 2''s metric) are COMPLETELY INSENSITIVE to both parameters
  across the points tested -- only check 1''s home/absent split moves, by at most 0.16 percentage
  points, which cannot close SrV gaps of 13-20 pp. No default in configs/base_bs.yml is changed by
  this manifest; the parameter decision on far_threshold_km / absent_share_far, and on the two
  mechanisms ADR-0104 names as capable of actually moving check 2 (extending the absent rule to
  shorter classes, or lowering the keep ratios below the committed MiD values), is explicitly left
  to the maintainer under issue #377.'
source: 'Sensitivity measurement of the commute-day-state (far/weekly commuters) model''s
  far_threshold_km (100 vs the production default 200 km) and absent_share_far (1.0 vs 0.6)
  parameters at 100% on the cached i329 population, narrowed to the state/participation/distance
