configuration:
  base: 'configs/config_local_i385_mini.yml (gitignored local test bed =
    configs/fixtures/config_smoke_popsim_mid_mini.yml + the base_bs.yml escort/purpose block,
    secondary_building_potentials false, commute-day model off,
    braunschweig.population.popsim.max_cells 1000, braunschweig.population.popsim.num_workers 1)'
  overlays: []
  notes: 'Local smoke, not a production or overlay-based configuration. Run target restricted
    to braunschweig.synthesis.locations.secondary_chainsolvers (the config''s own run list),
    so only the stages the chainsolver depends on execute. Test-bed deviations from production:
