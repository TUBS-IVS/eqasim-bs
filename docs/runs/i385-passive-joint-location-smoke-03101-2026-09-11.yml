    the KREIS geography the default-ON Kreis controls render).'
sampling:
  rate: 1% (sampling_rate 0.01)
  scope: Kreis 03101 only
pipeline:
  targets:
  - braunschweig.synthesis.locations.secondary_chainsolvers
classification:
- smoke
status:
  execution: completed
environment: local (Windows, eqasim env)
validation:
- metric: passive joint link rate (measure-first, build_passive_joint_links on the fresh trips/persons
    frames before the two-pass wiring)
  reference: none -- a descriptive rate, not a target
  result: '36/74 paired passive legs linked (48.6 %). Exclusions: adult not in the synthetic
    household (plan source) 23 (31.1 %), purpose not secondary 15 (20.3 %), adult leg missing
    0, adult is a linked child 0, duplicate child activity 0. Adult purposes of the links:
    other 14, leisure 11, shop 11; 20 distinct linked children, 22 distinct adults, 10 children
    with more than one linked activity. n = 74 paired legs on a 1 %-sampled single Kreis --
    a smoke-scale count, not a population rate.'
- metric: OFF-path frame equality after the _solve_problem_set extraction (pd.testing.assert_frame_equal
    on df_locations sorted by person_id/activity_index, and on df_convergence, pre- vs post-refactor
    stage output)
  reference: the pre-refactor stage output on the same test bed
  result: 'FRAME-EQUAL. Pre-refactor baseline (commit b5b94d6a, detached worktree, stage
    pickle ...__d0016af890806fcccb42a5f2f9cec8c9.p) vs the refactored stage with the flag
    OFF (commit ef75223a, pickle ...__65f86fb5db47c9d6a54f31989d9556aa.p): 3,415 location
    rows each; pandas assert_frame_equal on the locations frame minus geometry, per-row
    geometry equality, and assert_frame_equal on the convergence frame all pass. Both runs:
    2,237 problems, success rate 1.0000, carla placed 2,236/2,237, fallback 1 (the single
    unbounded chain).'
- metric: 'ON run: children placed at the adult''s location (link rate, anchor-resolution rate,
    share of anchored child activities whose geometry equals the adult''s -- expected 100% of
    resolved links by construction --, fallback accounting vs OFF, pass sizes, wall time of both
    passes)'
  reference: none -- a descriptive/mechanism check, not a behavioural target
  result: 'Two passes ran. Pass 1 (adults + unlinked): 2,208 problems, 2,207 persons, 5,408
    plan rows, cs.solve 19.0 s. Pass 2 (linked children): 6 problems, 6 persons, 12 plan
    rows, cs.solve 19.1 s; 20 linked children entered pass 2. Anchors resolved 36/36 (100.0
    %), 0 unresolved. Every resolved link places the child at the adult''s location:
    child_at_adult_location 36/36, duplicate child rows 0, 3,415 location rows, success
    rate 1.0000, carla 2,213/2,214 with 1 fallback.'
features:
  note: 'First test-bed exercise of escort_passive_joint_location (issue #385, ADR-0119). The
    measurement, OFF-path, and ON-run steps have all completed; the three validation entries
    above record the measured results. This remains a SMOKE on a 1 %-sampled single Kreis, not
    a validation: no observed reference exists for joint locations, and both solver passes
    share one RandomState, so an ON/OFF difference reflects a different Monte-Carlo realisation,
    not the anchoring mechanism alone.'
artifacts:
