  and no target value is stated here. Wolfsburg (03103) is not surveyed by SrV: its rows are model-only. Small cells are
  shown with their number of respondents, not pooled (owner decision, 2026-11-26). Rule 1 and the area rule are
  designer-set measurement rules (assumptions), not sourced thresholds. The other stage outputs (student_level_by_kreis,
  student_plan_source, student_behaviour_vs_srv, student_work_class, young_adult_status_by_kreis) are identical to
  the Phase 1 manifest student-measurement-popsim100-20261120-20261126 and are not restated here; its numbers stay the
  owner of those tables.
