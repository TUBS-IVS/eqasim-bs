- metric: matching-rule comparison against the SrV distance reference (final runs)
  reference: SrV 2023 education-leg distance bands (a survey, not ground truth), rows 03101 and all (all is the SrV total row 03ZGB); noise floor emd_noise_95 of each row
  result: >-
    Read from student_distance_bands.csv (reference srv; EMD of the model distance bands against the SrV bands, with
    emd_noise_95) and student_allotment_by_kreis.csv of each rule folder, and the allotment_diagnostics of
    education_university_report.json. EMD, plan_length against home_distance (noise floor): row 03101 (n_model 3855,
    n_reference 68, noise 0.06346545741): detour 1.2 0.07639311623 against 0.04636953211, detour 1.3 0.08848131337 against
    0.05316590046, detour 1.4 0.09787171545 against 0.06177809242 (home_distance inside the noise floor at all three,
    plan_length outside at all three). Row all (n_model 8989, n_reference 111, noise 0.0691843247): 1.2 0.1123234751
    against 0.07928309245, 1.3 0.1314802223 against 0.09641514274, 1.4 0.1451191143 against 0.1135026942 (neither rule
    inside the noise floor). The rule fixed before the run (plan_length unless home_distance is better by more than the
    noise floor at 1.3 and lower at 1.2 and 1.4) gives plan_length: the EMD gain of home_distance at 1.3 is
    0.03532 in row 03101 (noise floor 0.0635) and 0.03506 in row all (0.0692), both below the floor; home_distance is
    lower at 1.2 and 1.4 in both rows. THE OWNER DECIDED on 2026-11-28 for home_distance on realism grounds (ADR-0213
    Decision 3); this is a decision against the pre-fixed rule, not a result of it. Students living within 2 km of a local
    site (allotment_diagnostics, present students): 1881 under both rules; of them sent to another site 480 under
    plan_length and 62 under home_distance (row 03101 of student_allotment_by_kreis.csv: 1344 near a site, 316 against 0
    sent elsewhere). Mean |plan leg - assigned distance| over students with an observed plan leg (n 8748):
    8.57022468185295 km under plan_length against 13.835496394988448 km under home_distance; mean assigned
    distance 16.168661243921033 km against 14.902990000357564 km. The plan rule used the observed plan leg of 8748
    present students and the decay fallback for 241; home_distance uses neither. The comparison is to be repeated
    after the next full population run, because the student level and the home areas change with it; the SrV
    comparison rests on 68 and 111 respondents.
