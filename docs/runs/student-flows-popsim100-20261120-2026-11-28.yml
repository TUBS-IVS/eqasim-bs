pipeline:
  targets:
  - braunschweig.analysis.synthesis.student_flows
  - braunschweig.synthesis.day_absence.absence_stage (checkpoint run only)
  notes: >-
    Why no cache copy: the run server had less free disk than the cache takes, so scripts/isolated_run.py setup ran
    WITHOUT a cache copy (run.json: cache null), as in the Phase 3 measurement. scripts/explain_stale_stages.py ran
    against the source cache (explain_readonly.log of each artifacts folder); the chain driver scripts/run_stages_readonly.py
    (in docs/runs/artifacts/student-flows-checkpoint/scripts/) executed the stages in order, reading the dependency
    pickles of the source cache through symlinks and writing results to its own work directory. The session reported that
    afterwards no file of the source cache was newer than the start stamp, for both runs; no artifact file records that
    check (run.json holds only the unchanged state of the two shared checkouts), so it is a report of the session, not
    committed evidence. Logs are force-added although *.log is gitignored; the artifacts are scrubbed of host, user and paths.
    EXPLAIN, final runs (explain_readonly.log, last line): 52 stages, 6 stale for their own reasons, 0 will recompute,
    0 may recompute, 46 hits; PopulationSim stage braunschweig.popsim.stage HIT. Stale: the Phase 4 stages
    braunschweig.analysis.synthesis.student_flows, braunschweig.data.schools.university_facilities,
    braunschweig.synthesis.day_absence.absence_stage, braunschweig.synthesis.locations.education_gravity and
    braunschweig.synthesis.student_incommuters, and braunschweig.data.hts.mid_donor (module hash and tokens changed).
    DEVIATION: the cached mid_donor pickle came from an older code state and lacked seven donor columns that the
    in-commuter stage requires, so the chain RECOMPUTED mid_donor (111.6 s in chain_home_distance.json, 112.3 s in
    chain_plan_length.json) in its work directory, not in the source cache; the recomputed donor therefore differs in
    code state from the donor under the cached population. The checkpoint explain (flows_ckpt, 41 stages) listed 7 stale stages
    for own reasons (the target students_vs_srv, university_facilities, replacement_education_gravity, the two
    commute_day stages, absence_stage, education_gravity) and no mid_donor. Chain stage times of the plan_length run
    (chain_plan_length.json, seconds): mid_donor 112.3, university_facilities 0.3, absence_stage 25.1,
    education_gravity 33.8, student_incommuters 118.9, student_flows 29.9; home_distance run: 111.6, 0.3, 23.3, 33.2,
    115.3, 29.6. Checkpoint chain: absence_stage 34.2 s. NOT RUN: (a) no 1 % smoke, because a 1 % population at this
    code state would need a PopulationSim recompute; the stage tests and this 100 % run replace it. (b) The
    out-commuter reports (student_out_commuters) need the final-view trips of a new synthesis and run with the next full
    run.
classification:
- smoke
status:
  execution: completed
  notes: >-
    Classified smoke because the run-manifest schema has no measurement class: a measurement and a mechanism check on a
    cached population, not a validation. No target value is stated; the SrV tables are a survey, not ground truth; the
    destination totals T rest on the CHE origins and the owner's weights (ADR-0210). The acceptance rule (ASSUMPTION
    A17 of the stage: balance of at least 200 persons and deviation above 5.0 %) is the one pass/fail check; its
    verdict is FAIL (below). The checkpoint run only records what the day-absence step produced.
validation:
- metric: day-absence cells, realised share of persons absent (checkpoint run flows_ckpt, absence mode cells, 100 %)
  reference: SrV 2023 absence rates per cell (srv2023_absence_by_age_band.csv and the student cell rates; a survey, not ground truth)
  result: >-
    Read from docs/runs/artifacts/student-flows-checkpoint/away_share_by_cell.csv (columns persons, away, share_away,
    reference_rate) and chain_absence.log. Student cells: student:braunschweig 897 of 10180 absent, realised
    0.0881139489194499 against 0.0869729022; student:surrounding 2481 of 14093, 0.17604484495849004 against
    0.1729445122; student:wolfsburg 328 of 2940, 0.11156462585034013 against 0.1239264157 (difference -0.012361789850
    in share, -1.24 pp in the log). The Wolfsburg student cell missed its region value by more than the configured guard
    day_absence_max_band_deviation_pp=1.00 pp and the log carries the WARNING (chain_absence.log, line of
    absence_stage). Adult cells realise their reference closely (adult:18-29 0.062347368593578416
    against 0.06266962597, adult:30-44 0.04419408229042655 against 0.04415038849, adult:45-64 0.04895980646993962
    against 0.04900494797, adult:65-74 0.05819280179839165 against 0.0588485102, adult:75+ 0.05808186807207375 against
    0.05812049317). The small cells without the adult: prefix are 18-29 (n 29) 0.034482758620689655 against 0.08305189101 and 45-64 (n 523) 0.040152963671128104 against 0.04890702348, with n_eligible 27 and 225; the guard only fired for Wolfsburg. The
    rates per age band are reported, not targeted, for the age bands (chain_absence.log, "cells path").
    Adults with an unreadable P_TAET code: 1487 of 942846 (0.16 %) on the fallback (drawn in their band at the rate
    of all persons), primary 941359 (99.84 %). The log of the checkpoint run holds no line on households without a
    Kreis; the final run's report counts 2 of 558179 households without a VG250 Kreis and 61 whose home-zone Kreis
    differs from the VG250 Kreis (student_flows_report.json, home_kreis_vs_vg250).
