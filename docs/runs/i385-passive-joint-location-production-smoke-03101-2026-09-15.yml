  result: |
    | frame | link rate |
    |---|---|
    | synthesis.population.trips (before the commute-day splice) | 14/60 = 23.3 % |
    | synthesis.population.trips.final (production, after the splice) | 12/58 = 20.7 % |

    The commute-day / day-absence splice costs 2.6 percentage points and introduces all
    three adult_leg_missing cases (0 before the splice). It does NOT explain the gap to the
    local 48.6 %: the local smoke ran the mini fixture
    (configs/fixtures/config_smoke_popsim_mid_mini.yml as a gitignored copy) --
