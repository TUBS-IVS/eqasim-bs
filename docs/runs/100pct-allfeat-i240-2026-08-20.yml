- 'felix:/home/felix/eqasim-bs/eqasim-data/output_bs_100pct_allfeat_popsim_i240/'
- 'report Artifact: https://claude.ai/code/artifact/99751eba-6064-4b5a-8d8f-88f10fb6aa92'
issues:
- '#240'
- '#320'
- '#321'
- '#329'
- '#330'
decisions:
- ADR-0088
- ADR-0089
- ADR-0091
- ADR-0092
source: 'the 2026-08-19/20 overnight 100% run and its deep analysis'
