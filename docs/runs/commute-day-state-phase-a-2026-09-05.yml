environment: server
validation:
- metric: 'share of employed persons with a home->work trip on the simulated day, per home Kreis
    and for the ZGB total, against the SrV 2023 reference (delta in percentage points)'
  reference: eqasim-data/data/braunschweig/srv/srv2023_work_participation_by_kreis.csv
  result: 'ZGB: 540,425 employed persons in the model, 267,194 of them with a work trip =
    share_work_trip 0.4944, against the SrV reference 0.6511 (n_persons 8,016) -- delta -15.67
    pp. The model share is below the reference in EVERY surveyed Kreis, with the deltas ranging
    from -12.27 pp to -20.55 pp: 03101 Braunschweig 0.5048 vs 0.6275 (-12.27, SrV n 2,268), 03102
    Salzgitter 0.5084 vs 0.7139 (-20.55, n 663), 03151 Gifhorn 0.4730 vs 0.6441 (-17.12, n
    1,521), 03153 Goslar 0.4981 vs 0.6924 (-19.43, n 935), 03154 Helmstedt 0.4872 vs 0.6671
    (-17.99, n 754), 03157 Peine 0.4732 vs 0.6119 (-13.87, n 1,067), 03158 Wolfenbuettel 0.4948
    vs 0.6603 (-16.56, n 808). 03103 Wolfsburg has a model share of 0.5192 and NO delta: its SrV
    row carries n_persons 0 (not surveyed), and the stage keeps NaN rather than reading the
    absent reference as a zero gap.'
  artifact: 'eqasim-data/data/braunschweig/calibration/commute_day_state_phase_a_2026-09-05/work_participation_by_kreis.csv'
  notes: 'ONLY share_work_trip is comparable. The model has no day state, so its share_no_work_trip
    (ZGB 0.5056) is the sum of the two SrV remainder states (home-office day 0.1418 + neither
    0.2071) and is never differenced against either of them individually. This is a measurement
    against a committed reference, NOT a validation against observed behaviour, and it decides
    nothing: no target is set and no threshold is attached in Phase A.
    NOT INDEPENDENT OF EXISTING MACHINERY, and deliberately not decomposed here: the synthesis
    already applies hard SrV participation controls (feature record
    docs/registry/features/srv_participation_controls.yml, whose work_participation target is
    defined over ALL persons, not over the employed), and the i329 run manifest
    docs/runs/100pct-allfeat-i329-2026-08-24.yml documents a donor-bound participation deficit.
    How much of this -15.67 pp is that documented deficit, how much is the different universe
    (employed persons here vs all persons there), and how much is a genuine day-state gap is
    UNKNOWN from this run: no decomposition was measured, and none is claimed.'
- metric: 'workers per assigned commute-distance class (euclidean home->work distance x detour
    factor 1.3), ZGB total, split by destination scope'
  reference: none (model-internal distribution; the class edges are those of
    braunschweig.calibration.commute_day_state_reference.COMMUTE_CLASS_LABELS)
  result: 'All 304,900 workers were classified (0 unclassified, 0 unresolved destinations). ZGB
    scope all: lt10 141,352 (0.4636), 10_25 71,528 (0.2346), 25_50 54,311 (0.1781), 50_100 21,515
    (0.0706), 100_200 5,235 (0.0172), gt200 10,959 (0.0359). Scope external (39,150 workers, the
    fabricated EXT workplaces): lt10 27, 10_25 689, 25_50 6,583, 50_100 15,700 (0.4010), 100_200
    5,192 (0.1326), gt200 10,959 (0.2799). Scope internal (265,750 workers): lt10 141,325
    (0.5318), 10_25 70,839 (0.2666), 25_50 47,728 (0.1796), 50_100 5,815 (0.0219), 100_200 43,
    gt200 0. Scope unresolved: 0 workers in every class. The two long classes the day-state model
    would act on therefore hold 21,515 workers (50_100) and 16,194 workers (100_200 plus gt200) =
    37,709 in total, of which 31,851 sit in the external scope (15,700 + 5,192 + 10,959) and 5,858
    in the internal one (5,815 + 43 + 0).'
  artifact: 'eqasim-data/data/braunschweig/calibration/commute_day_state_phase_a_2026-09-05/assigned_distance_classes.csv'
  notes: 'Model distances are straight-line distances scaled by the configured detour factor 1.3,
    not routed distances. gt200 exists only in the external scope by construction (no ZGB-internal
    pair is that far apart). The per-Kreis rows of the same table are not repeated here.'
- metric: 'realised model distance to a fabricated EXT workplace vs the plain Kreis-centroid to
    Kreis-centroid distance of the same (home, destination) Kreis pair, and the share of workers
    sitting within 5 km of a class edge'
  reference: 'VG250 vg250_krs Kreis centroids (400 Kreise) and the BA Pendleratlas flows via
    braunschweig.data.census.pendler (48,340 flow pairs)'
  result: 'Worker-weighted share of the 39,150 EXT workers whose model distance class equals the
    centroid distance class: 0.8258. Measured over 646 (home, destination) Kreis pairs; 0 pairs
    lack a VG250 centroid and 1 pair has no BA Pendler flow (the BA export suppresses small cells,
    so that flow is unknown, not zero). Class-edge fragility over ALL 304,900 workers: 129,906
    (0.4261) lie within the configured 5.0 km tolerance of a class edge (10, 25, 50, 100, 200 km),
    i.e. their assigned class would flip under a small change of the distance or the detour
    factor.'
  artifact: 'eqasim-data/data/braunschweig/calibration/commute_day_state_phase_a_2026-09-05/ext_destination_distances.csv'
  notes: 'The direction of the 17.4% class disagreement (model class above or below the centroid
    class) was not aggregated by this run: unknown. The near-edge share is computed on the full
    worker cohort, not on the EXT subset.'
- metric: 'donor-vs-assigned commute-distance class: share of synthetic workers whose ASSIGNED
    class is strictly higher than the class of the MiD donor their attributes came from'
  reference: 'raw MiD 2023 P_ARB_ENTF of the matched donor (server-only microdata), cleaned with
    clean_mid_commute_distance_km'
  result: 'All four join rates are 100.0000%: assigned_class_by_person.csv -> persons.csv
    304,900/304,900; pseudonym_map.csv -> MiD2023_Personen.csv 24,194/24,194; workers (hts_id) ->
    pseudonym_map.source_person_id 304,900/304,900; and the composed chain workers -> donor rows
    304,900/304,900. Of the 304,900 matched workers, 224,045 (73.48%) have a donor whose
    P_ARB_ENTF is missing or a MiD filter/skip code, so their donor class is "missing" and they
    are NOT comparable. Among the 80,855 comparable workers: 14,806 (share_assigned_gt_donor
    0.1831) have an assigned class strictly ABOVE the donor class, 16,776 strictly below, and
    49,273 equal. The 14,806 by ASSIGNED class: 10_25 3,639, 25_50 5,104, 50_100 2,626, 100_200
    944, gt200 2,493 (lt10 cannot occur by construction). Donor reporting-day states over all
    304,900 matched workers: 171,334 donors worked on the reporting day and 1,190 did not; of
    those who worked, 74,305 were at their usual workplace and 1,260 at home. The residual
    304,900 - 171,334 - 1,190 = 132,376 workers have a donor whose P_STARB1 is outside (1, 2),
    i.e. the question was not asked of them or was not answered -- they are neither "worked" nor
    "did not work". A SECOND residual sits INSIDE the 171,334 who worked and is named here so
    that account closes too: 171,334 - 74,305 - 1,260 = 95,769 workers have a donor who worked
    but whose starb2 is neither 2 (usual workplace) nor 1 (at home), i.e. an "other place" code
    (3, 4, 5, 96) or an unmapped / no-answer one (e.g. 99). All four counts are read from
    donor_vs_assigned_diagnostics.json (n_donor_worked_on_day, n_donor_at_workplace,
    n_donor_at_home, n_donor_did_not_work_on_day); the SPLIT of those 95,769 across the remaining
    starb2 codes was NOT measured by this run and no distribution over them is claimed. The
    committed MiD reference table mid2023_workday_location_by_commute_distance.csv does carry the
    full state taxonomy (its other_place and missing columns), but on the MiD universe rather than
    on this worker cohort, so it is not a substitute for the unmeasured split.'
  artifact: 'eqasim-data/data/braunschweig/calibration/commute_day_state_phase_a_2026-09-05/donor_vs_assigned_class.csv'
  notes: 'The 73.48% missing-donor-distance rate is the dominant caveat of this table: the 0.1831
    share is a share OF THE COMPARABLE SUBSET (80,855 workers), not of the cohort, and the script
    logs a WARNING to that effect whenever the non-comparable share exceeds the configurable
    warn_missing_share (0.5 here). The reason is measured in the next two entries and is
    STRUCTURAL, not a data-quality accident: P_ARB_ENTF is a question of the MiD home-office
    module. Consequence for the spec: the commute-day-state design foresees the donor''s WORK-TRIP
    LENGTH as the FALLBACK for a missing P_ARB_ENTF -- on this population that fallback is the
    MAIN path for the ~73% of workers this table cannot compare, and it was NOT applied inside
    this table. It is measured separately, on the same workers, in the entry below (fix round 1);
    the two tables are reported side by side and are never merged into one distance. Whether the
    missing-P_ARB_ENTF workers differ systematically from the comparable ones in ways beyond the
    module flag is UNKNOWN. Privacy: the cross-tab and the diagnostics contain aggregates only --
    the script asserts that no person, household or MiD identifier reaches an output file, over
    both the table columns and the JSON keys, and the per-person assigned_class_by_person.csv
    (304,900 rows) was deliberately left on the server.'
- metric: 'donor-vs-assigned commute-distance class with the donor''s FIRST valid WORK-TRIP LENGTH
    as the donor distance (the spec''s fallback source, measured in fix round 1)'
  reference: 'raw MiD 2023 MiD2023_Wege.csv (server-only microdata): wegkm of a W_ZWECK == 1 trip
    with 0 < wegkm < 1000, first qualifying trip per person in file order'
  result: '76,436 of the 1,087,393 raw MiD trips qualify, giving 70,947 distinct MiD persons a
    work-trip length. Over the same 304,900 workers: 41,480 (13.60%) have no such length -- their
    donor made no qualifying work trip on the reporting day -- against 224,045 (73.48%) without a
    P_ARB_ENTF, so this source covers 263,420 comparable workers instead of 80,855. Among them:
    57,177 (share_assigned_gt_donor 0.2171) have an assigned class strictly ABOVE the donor class,
    24,383 strictly below, 181,860 equal. The 57,177 by ASSIGNED class: 10_25 17,639, 25_50
    21,565, 50_100 7,815, 100_200 2,465, gt200 7,693.'
  artifact: 'eqasim-data/data/braunschweig/calibration/commute_day_state_phase_a_2026-09-05/donor_vs_assigned_class_trip_length.csv'
  notes: 'The two sources are NOT interchangeable and this record does not treat them as one
    number: P_ARB_ENTF is the respondent''s USUAL commute distance, while a work-trip length is a
    property of the REPORTING DAY (a donor who worked from home or did not work that day has no
    length, which is exactly the state the day-state model wants to represent -- so using it as a
    commute-distance proxy is itself an assumption the later phase must justify). The 13.60%
    without a length and the 73.48% without a P_ARB_ENTF are not nested in an obvious way; no
    combined "either source" coverage is stated here because it was not measured.'
- metric: 'the donors behind the synthetic workers: home-office-module membership, P_ARB_ENTF
    validity by module flag, and the donors reporting-day codes (fix round 1)'
  reference: none (structure of the donor pool the population inherited)
  result: 'Of the 304,900 workers, 151,571 (49.71%) have a donor inside the MiD home-office module
    (M_HOFF == 1) and 153,329 outside it; no worker has an unmapped module flag. P_ARB_ENTF is
    valid for 80,855 of the in-module donors (53.34%) and for 0 of the 153,329 out-of-module
    donors (0.00%), i.e. 26.52% overall -- so the 73.48% missing rate of the entry above is
    explained by the module structure plus a 46.66% item-non-response inside the module, not by a
    broken join. Reporting day: ALL 304,900 workers have a donor with arbwo == 1 (reporting day is
    a weekday); the raw ST_WOTAG codes are 1: 61,744, 2: 73,096, 3: 60,817, 4: 56,617, 5: 52,626,
    with codes 6 and 7 absent entirely.'
  artifact: 'eqasim-data/data/braunschweig/calibration/commute_day_state_phase_a_2026-09-05/donor_vs_assigned_diagnostics.json'
  notes: 'Counts are per WORKER, not per donor person: a donor used by many workers is counted once
    per worker, which is the quantity that matters when asking what the synthetic population
    inherited. This record asserts NO mapping from a ST_WOTAG code to a named weekday -- the
    repository carries no committed statement of that coding -- so the codes are reported raw; that
    only five of the seven codes occur, together with arbwo == 1 for every worker, is the measured
    fact. The 46.66% in-module item-non-response and the 0.00% out-of-module validity are measured
    here for the first time; the earlier ad-hoc figures that motivated the check are deliberately
    NOT carried into this manifest.'
- metric: 'join and coverage diagnostics of the analysis stage (fallback transparency)'
  reference: none (internal consistency of the stage)
