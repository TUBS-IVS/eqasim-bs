notes: >-
  Re-assessment for #648: ADR-0059 attributed the 6+ household shortfall to the donor pool; this run meets the 6+
  household target with the same pool, so the count gap was not a property of the pool. The run changed the fork core,
  the rounding, the seed records and several household targets together and does not isolate which change closed
  it; the 6+ error inside the 100 m cells grew (WAPE 0.515 to 0.651). The pool still limits the variety of large
  households (reuse by household size above), which keeps #278 relevant for diversity, not for counts. Committed copies
  of server files carry the run server's home directory as ~ (provenance.json, report.json, summaries, run overlays).
  After the run, an accidental gate call on popsim100_20261120 (18:16) rewrote its run.yml gate list; the launched
  list was restored from a copy, and run.json records that later gate; run_overlay.yml here is the launched list.
  The published dashboard reads dashboard/facts.csv (as JSON), dashboard/controls.csv, dashboard/plausibility.csv,
  dashboard/cells_1km.csv and dashboard/activity_grid_combined.csv; the analysis scripts were rerun after the final
  review's changes (fallback rates logged, split-cell rule) and reproduced the committed zone tables byte for byte and
  the activity grid in every earlier column (activity_grid.py added university_pot). The published dashboard shows every table of this record with charts, a 1 km map and a
  500 m activity heatmap; it reads the files under dashboard/, zones/new and activity_grid/.
