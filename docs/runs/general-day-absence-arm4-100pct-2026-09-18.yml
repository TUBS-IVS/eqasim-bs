notes: 'HOW TO READ THIS MANIFEST. (1) Arm 3 vs arm 4 is a clean contrast: identical population
  cache, identical seed, identical overlay structure, one flag, and the measured code differs from
  arm 3''s in exactly the day_absence package plus one new pure module (the shipped patch). (2) The
  row the gate exists for went from 2,574 to 0; the row that could have broken (per-band rates over
  a pool a further 9 % smaller) held at 0.08 pp; the household stage drew the identical 30,690
  persons for the third arm, which is what "the gate acts on the individual stage only" looks like
  in numbers. (3) The gain the pre-registration did not anticipate: escort participation on
  at_home_zero moved from -0.29 pp to -0.02 pp against SrV, because escorters'' trips are no longer
  deleted with them. (4) The cost, stated as an assumption in the ADR and now visible: within a
  band, absence falls on non-escorters (2.02 % vs 5.41 %), and sizes 2 and 5+ sit a little further
  above their per-size reference as the multi-person pool absorbs a second redistributed residual.
  (5) The reverse incoherence (689 children) is unchanged and is NOT this gate''s job; the manifest
  measures it so the decision about a symmetric gate can be taken on numbers. (6) Per CLAUDE.md
  "convergence is not validation": nothing here says the absent persons are the RIGHT persons; it
  says the model no longer produces a combination the survey cannot contain, at no measurable cost
  to any pre-registered row.'
source: 'Arm 4 (ADR-0110 Amendment 2: day_absence_escort_protection_enabled true, the production
  default after PR #425) of the pre-registered A/B ladder of ADR-0110, run at 100 % on a hardlink
  copy of the arm-4 cache from a detached worktree at the #388 merge 00a4a1cc plus the #425
  day_absence/escort_duty code as a patch from the pushed branch tip c611bff4, measured by
  braunschweig.analysis.synthesis.plan_structure_vs_srv (reporting-day view, universes at_home_zero
  and at_home_only) and braunschweig.analysis.synthesis.work_participation_by_kreis against the
  committed SrV references, and by build_day_trips''s escort diagnostics (issue #425).'
