    exactly like arm 2 -- ONE flag is set in the overlay and everything else is the arm-3 state:
    day_absence_enabled true, day_absence_household_stage_enabled true,
    day_absence_individual_stage_min_household_size 2, day_absence_max_band_deviation_pp 1.0,
