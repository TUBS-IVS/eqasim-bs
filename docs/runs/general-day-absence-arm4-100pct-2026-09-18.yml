id: general-day-absence-arm4-100pct-2026-09-18
date: '2026-09-18'
repository:
  commit: 00a4a1cc
  branch: feature/i425-absence-escort-protection
  notes: 'MEASUREMENT BASE = arm 3''s commit 00a4a1cc (the #388 merge) PLUS the #425 code applied as
    a patch: "git diff 7cfeeb15..c611bff4 -- braunschweig/synthesis/day_absence/
    braunschweig/synthesis/escort_duty.py" (452 lines; the file is committed beside this run''s
    artefacts as code_patch_7cfeeb15_to_c611bff4_day_absence.patch), where c611bff4 is the pushed
    tip of feature/i425-absence-escort-protection. Why not the branch tip itself: c611bff4 sits on
    main 291 commits after 00a4a1cc with braunschweig/popsim changed, which would have forced a
    full re-synthesis AND confounded the arm-3 contrast; the day_absence modules are byte-identical
    between 00a4a1cc and main, so the patch applies cleanly ("git apply --check" passed) and arm 3
    vs arm 4 differs in exactly the gate. NOT part of the measured code: the commute_day
    consolidation of c611bff4 (state_stage / plan_replacement / trips_day_stage calling
    escort_duty), which conflicts with the base commit and is behaviour-neutral, pinned by
    tests/test_escort_duty.py -- the three call sites select the same persons, so the measured
    stranded-children metric is the same metric. Run from the DETACHED server worktree ~/wt-b425
    ("git worktree add --detach ~/wt-b425 00a4a1cc"). The reports record pipeline_commit
    "00a4a1cc+dirty"; the dirt is the eqasim-data symlink swap plus exactly the four patched paths
    (__init__.py, absence.py, absence_stage.py modified; escort_duty.py untracked) -- "git status
    --porcelain -- braunschweig/" lists those four and nothing else.'
