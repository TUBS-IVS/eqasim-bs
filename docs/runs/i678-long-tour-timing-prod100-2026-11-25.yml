id: i678-long-tour-timing-prod100-2026-11-25
date: '2026-11-25'
repository:
  commit: 17f5e9235592ea82edd12577ca1f3a7b6a9730cb
  branch: fix/i678-mode-choice-reach
  notes: >-
    eqasim-bs fix/i678-mode-choice-reach at 17f5e923 and eqasim-java-bs feat/i678-border-tour-vehicle-rule at
    ab56318a118ab17777ba57bc6b149b25c95ea8fb, both clean clones on the project server (work folder i678_work, eqasim-bs and
    eqasim-java-bs, 0 changes) made from git bundles of the two branches. The jar was built in the Java
    clone with -Pstandalone and the fixed build timestamp of matsim.runtime.eqasim (braunschweig-2.3.1.jar,
    193,785,113 bytes, sha256 11d8abb6b6afb5fb737cb44fe402e7443a451afc7144db8d91330db1ff399728); after the build the
    clone shows only braunschweig/dependency-reduced-pom.xml as modified (the shade plugin rewrites it). The branch's
    mode_choice_reach.require_border_vehicle_constraint passed on this jar. The population and the final config are
    those of the run prod100_20261031 (code 7a41f0ba), read only.
configuration:
  config: >-
    the final MATSim config of prod100_20261031 (prepare stage directory, braunschweig_100pct_prod20261031_config.xml,
    copied unchanged) and its second file from mode_choice_reach.write_initial_config(config, ReachSettings(True, 13))
  notes: >-
    The second file differs from the final config in three values only (initial_config_diff_*_output.txt): tourFinder
    ActivityBased -> IsolatedOutsideTrips, tourConstraints "FromTripBased, VehicleContinuity" -> "FromTripBased,
    BorderTourVehicleContinuity", maximumLength of tourFilter:TourLength 6 -> 13. Runner arguments from the branch's
    initial_mode_choice.arguments(config, population, 16, ()) with no excluded subpopulation (the files hold residents
    only), plus --config:standaloneModeChoice.chunkSize 1 in the runs this record times (see status notes). JVM:
    JDK 25.0.3 (jdk-25.0.3+9), -Xmx40G (7 to 8 and 9 to 11 trips) and -Xmx48G (13 trips), cwd the run directory,
    as matsim.runtime.java.run sets it. 16 threads in every run.
sampling:
  rate: 1.0
  scope: >-
    residents of the prepared population of prod100_20261031 whose longest enumerated run has more than 6 trips, in
    three files: 7 to 8 trips 5,473 persons (43,230 trips), 9 to 11 trips 815 persons (7,889 trips), 13 trips 329 persons
    (4,277 trips). Residents: persons without a subpopulation attribute whose uncut plan has no ic_ facility (the rule of
    the "before" probe), 1,130,422 of 1,261,590 persons. Runs as in the finer rule (isolate_outside_trips true):
    plan_check.leg_reach, cross-checked trip by trip in i678_cut_long_tours.py; an enumerated run is a run that does not
    start or end at outside and has at most 13 trips. No resident has a longest run of 12 trips or a run of more than 13
    trips.
pipeline:
  targets: []
  notes: >-
    No synpp pipeline run. i678_cut_long_tours.py cut the three files (416 s); i678_setup_run_dir.sh made one run
    directory per file (links to the prepare stage files, a copy of the final config);
    i678_run_initial_choice.py wrote the second config and started eqasim's RunStandaloneModeChoice as the branch's
    initial_mode_choice.run does, then counted persons with count_persons and changed trips with summarise. The
    population was not replaced (no prepare stage ran). run_two.sh started the first two runs (chunk size 1,000),
    run_three.sh the timed runs (chunk size 1); java_capped_4h.sh put a four-hour cap on the 13-trip run, which never
    fired because that run was stopped by hand before (exit 143).
classification:
- wiring_proof
status:
  execution: partial
  notes: >-
    Model output, NOT a validation: a timing of the initial mode choice on cut files and the first real run of the
    constraint name. The 7 to 8 and 9 to 11 files completed; the 13-trip file was stopped by hand after 1,998 s (exit
    143; the four-hour cap of java_capped_4h.sh never fired) under the stop rule of the task (more than four hours),
    once its first 16 persons had finished. The stop rule was applied to a PROJECTION from those 16 of 329 persons
    (about 10 hours at 16 threads), not to a measured run of four hours. Chunk size: the runner hands chunks of standaloneModeChoice.chunkSize plans (default 1,000) to its
    threads, so a file of fewer than 1,000 persons runs on one thread whatever numberOfThreads says (13-trip file:
    "Splitting 329 plans into 1 chunks"; 7 to 8 trips: 6 chunks). The first runs with the default chunk size were
    therefore stopped (9 to 11 and 13 trips) or kept only for comparison (7 to 8 trips) and the timed runs use chunk
    size 1, which spreads the long-tour persons over the threads as the full population does (about 1,262 chunks of 1,000);
    it changes the chunk random seeds, not the model. The 7 to 8 file gave the same number of changed trips with both
    chunk sizes (23,233). The server was shared with another session (load average about 25 on 64 cores during the
    13-trip run, of which 16 threads plus garbage collection were ours). The final summary line of the border-tour
    constraint is written by a MATSim end-of-run listener, which the standalone runner does not call; the constraint
    itself logs a line only when it relaxes a leg.
