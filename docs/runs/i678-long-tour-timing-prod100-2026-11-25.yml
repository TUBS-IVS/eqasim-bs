environment: 'the project server (64 cores, 94 GB), conda env eqasim (Python 3.10), Java JDK 25.0.3+9 (25.0.3), Maven 3.6.3; 16 threads per run'
validation:
- metric: does the finer rule with the constraint name BorderTourVehicleContinuity run in eqasim's standalone mode choice, and are persons lost?
  reference: 'none: a wiring check on model output'
  result: >-
    Yes. The runs with the second config exited 0 for 7 to 8 trips (5,473 persons before and after) and 9 to 11 trips
    (815 before and after); persons removed 0; no exception line. The stopped 13-trip run had no exception before it
    was stopped. No "border-tour vehicle legs relaxed for missing availability" line appeared in any run, i.e. no leg
    was relaxed in the persons processed. Trips with a changed mode: 23,233 of 43,230 (53.7 %) for 7 to 8 trips, 2,486
    of 7,889 (31.5 %) for 9 to 11 trips (free-flow travel times; the prepared population of this run had no initial
    mode choice before).
  artifact: docs/runs/artifacts/i678-long-tour-timing-prod100-2026-11-25/run_summary_long_9_11.json
- metric: wall time of the initial mode choice per file (16 threads, chunk size 1)
  reference: 'ASSUMPTION of the design (1 to 2 microseconds per mode chain); enumeration sizes per tour length from docs/runs/i678-mode-choice-reach-probe-prod100-2026-11-25.yml'
  result: >-
    7 to 8 trips: Java 297.7 s in total, of which the choice phase ("Splitting" to "Done!") 176 s; CPU 3,253 s.
    9 to 11 trips: Java 633.5 s, choice phase 523 s; CPU 10,535 s. 13 trips: stopped after 1,998 s; choice phase
    started 14:23:22, the first person finished after 1,770 s and 16 persons after 1,840 s (all 16 threads busy, one
    person each); CPU 41,996 s. The scenario load before the choice phase takes about two minutes in every run. With
    the default chunk size of 1,000 the 7 to 8 file took 502.4 s (choice phase 385 s on 6 chunks).
  artifact: docs/runs/artifacts/i678-long-tour-timing-prod100-2026-11-25/runner_lines_long_12_13_output.txt
- metric: time per mode chain against the assumption, and the projection for the 13-trip file
  reference: 'ASSUMPTION of the design: 1 to 2 microseconds per chain; chain counts are an ESTIMATE (available modes to the power of the run length, modes as in long_tour_cost_probe.py)'
  result: >-
    Chains per file (estimate): 665,521,815 (7 to 8), 5,779,665,662 (9 to 11), 401,611,328,125 (13; 329 runs of 13 trips,
    all with five modes, 1,220,703,125 each). Thread time per chain (choice phase times 16 threads, or the per-person
    time for 13 trips): 4.2 microseconds for 7 to 8 trips (short runs: the work per trip dominates), 1.45 for 9 to 11
    and 1.45 to 1.51 for 13 trips; CPU per chain including load and garbage collection 4.9 and 1.8. For runs of 9 and
    more trips the assumption of 1 to 2 microseconds per chain holds. The wall time it was meant to give does not at 16
    threads. ESTIMATE, based on the first 16 of 329 persons, under a server load of about 25; scatter between persons
    not measured: one 13-trip person takes about 30 minutes of one thread, so the 329 persons take about
    329 x 1,800 s / 16 = 37,000 s, about 10 hours at 16 threads (more than the four-hour stop bound), against "2 to 4
    hours" in the design. For these 329 persons the chain count times 1 to 2 microseconds is 401,611 to 803,223 s, i.e.
    112 to 223 hours of one thread (at the measured 1.45 to 1.51 microseconds: 162 to 168 hours); 2 to 4 hours follow
    only with about 56 threads (ASSUMPTION, not measured: linear scaling). Peak resident memory of the JVM
    21,555,112 kB (about 20.6 GiB) at 16 threads for the 13-trip file.
  artifact: docs/runs/artifacts/i678-long-tour-timing-prod100-2026-11-25/run_summary_long_12_13.json
- metric: residents with a long enumerated run (finer rule) in the prepared population, by longest run
  reference: 'none: a count of model output'
  result: >-
    Runs of more than 6 trips: 7 trips 3,880, 8 trips 1,593, 9 trips 351, 10 trips 439, 11 trips 25, 13 trips 329 (6,617
    runs in 6,617 persons, one each; none of 12 or of more than 13 trips). 6,554 of these persons also have a tour of
    more than 6 trips without an outside activity under the coarse rule, the same number as the tours of that kind the
    "before" manifest counts in the prepared population; the other 63 persons (60 with 7 to 8 trips, 3 with 9 to 11) have
    their long run only inside a border tour, which the finer rule cuts out. The "before"
    manifest counts 365 tours of 13 trips and 1,193 of 9 to 11 trips in the UNCUT population, against 329 and 815
    persons with such a run in the prepared population here; the difference is not explained here, to be checked in
    the replay manifest.
  artifact: docs/runs/artifacts/i678-long-tour-timing-prod100-2026-11-25/cut_output.txt
issues:
- '#678'
