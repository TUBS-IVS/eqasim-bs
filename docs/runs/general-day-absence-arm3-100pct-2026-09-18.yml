notes: 'HOW TO READ THIS MANIFEST. (1) This is the ONLY arm of the ladder that measures the
  PRODUCTION default: configs/base_bs.yml sets day_absence_individual_stage_min_household_size to 2,
  and arm 3 runs that value with no override, while arms 0, 1 and 2 were all measured at the
  pre-#388 value 1. Until this run the recorded A/B evidence described a configuration the model no
  longer used. (2) The comparison that matters is arm 1 vs arm 3, and it is clean: identical
  population cache, identical seed, identical overlay structure, 7 commits apart with only the
  day_absence modules changed. (3) What #388 bought: singles 7.61 % -> 5.26 % against a 5.14 %
  reference, and clustering 63.7 % -> 54.4 % against 55.8 % -- the second follows from the first,
  since arm 1''s excess clustering WAS the singles double-draw. The household stage drew the same
  30,690 persons in both arms. (4) What it cost: escort coherence, 2,006 -> 2,574 children with an
  absent escorter, and a slightly worse fit for household sizes 2 and 5+ whose residual now absorbs
  what singles no longer take. Both are reported, neither is pre-registered, and the first is
  additional motivation for #385. (5) Rows 1, 2 and 4 are essentially unchanged from arm 1 (<= 0.04
  pp) -- as they must be, since the gate redistributes absence rather than changing how much of it
  there is. Row 2 is nonetheless the row that could have broken, because the residual is now drawn
  over a 19.24 % smaller eligible pool; it did not. (6) Per CLAUDE.md "convergence is not
  validation": nothing here says the absent persons are the RIGHT persons. It says their number, age
  composition, household clustering and now their household-size distribution at size 1 match the
  SrV, and that the rest of the plan structure is unchanged on the universe where it should be.'
source: 'Arm 3 (the #388 eligibility gate, = the base_bs.yml default state at commit 00a4a1cc and
  the configuration production runs) of the pre-registered A/B ladder of ADR-0110 and its
  Amendment 1, run at 100 % on a hardlink copy of the arm-4 cache from a detached worktree at the
  #388 merge 00a4a1cc, measured by braunschweig.analysis.synthesis.plan_structure_vs_srv
  (reporting-day view, universe at_home_zero primary and at_home_only sensitivity) and
  braunschweig.analysis.synthesis.work_participation_by_kreis against the committed SrV references
  (issues #388 and #370).'
