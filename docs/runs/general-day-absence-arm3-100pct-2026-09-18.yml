  reference: 'eqasim-data/data/braunschweig/srv/srv2023_absence_household_by_size.csv, header line
    "# Clustering": 0.5585 person-weighted (0.4937 unweighted, 471 of 954), computed by
    braunschweig.calibration.srv_absence.clustering_share; pre-registered band 45-65 %'
  result: 'MET, and closer to the SrV value than any other arm: 54.4 % against 55.8 %, a gap of
