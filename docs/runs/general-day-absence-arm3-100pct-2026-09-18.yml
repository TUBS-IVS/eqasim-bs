- metric: 'PRE-REGISTERED ROW 6 -- absence rate by household size class for sizes >= 2 (REPORTED as
    a hold-out with no tolerance: ADR-0110 Amendment 1 RETAINS the limitation above the threshold)'
  reference: 'srv2023_absence_household_by_size.csv p_absent_person: size 2 5.87 %, 3 5.43 %,
    4 4.16 %, 5+ 1.75 %'
  result: 'REPORTED, not gated, and the retained limitation is visible exactly where the ADR says it
    is. Realised (arm 1 in brackets): size 2 6.57 % (5.85), size 3 3.57 % (3.15), size 4 4.34 %
    (3.76), size 5+ 3.82 % (3.13); deltas against the reference +0.70, -1.86, +0.18, +2.06 pp. All
    four move UPWARD against arm 1, which is the mechanical consequence of bound A: the residual
    that singles no longer receive is redistributed across the multi-person pool to hold the band
    marginals. Size 4 improves (+0.18 from -0.40), size 2 and 5+ overshoot more than in arm 1, size
