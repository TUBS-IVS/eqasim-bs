    persons (19.24 %) from the individual residual stage -- present persons in households below
    size 2 -- so singles now receive absence from the household stage ALONE, which is what their
    5.29 % household-level rate is calibrated to produce. Arm 2 independently showed that the
    household stage was not the cause of the over-absence (singles 5.53 % there with the household
    stage OFF): the cause was the DOUBLE draw, and removing exactly that is what arm 3 does.'
  artifact: 'eqasim-data/data/braunschweig/calibration/general_day_absence_arm3_100pct_2026-09-18/run_log_excerpts.txt'
- metric: 'PRE-REGISTERED ROW 3 / AMENDMENT 1 BOUND B -- share of absent persons living in a fully
