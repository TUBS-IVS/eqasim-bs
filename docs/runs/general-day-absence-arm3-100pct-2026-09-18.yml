- metric: 'Escort coherence and composition with the far-commuter commute_day_state (ADR-0104) --
    a COST of the eligibility gate, reported because no pre-registered row covers it'
  reference: 'braunschweig.synthesis.commute_day.plan_replacement.build_day_trips diagnostics; no
    external reference'
  result: 'MEASURED, and it is the one place where arm 3 is WORSE than arm 1: children living in a
    household with an absent member who carried an escort leg number 2,574, against 2,006 in arm 1
    (arm 2, the individual-only counterfactual, had 4,095). Two further escort figures of THIS run
    are recorded here because ADR-0110 Amendment 2 (issue #425) sizes its pre-registration with
    them and a run''s measured numbers belong in its manifest, not in an ADR: 113,819 of 1,001,503
    persons with a trip (11.4 %) carry an escort leg on their pre-assignment day
    ("[commute day state] escort duty" line of ~/b370_arm3.log, the SAME both-trip-ends definition
    braunschweig.synthesis.escort_duty.escort_person_ids uses, i.e. exactly the population the
    #425 gate would protect), and 752 far commuters were kept present by the pre-existing ADR-0104
