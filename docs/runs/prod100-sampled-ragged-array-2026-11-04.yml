notes: >-
  Cost of landing. For the FINAL code of the branch: synthesis.population.sampled re-executes (its module hash
  changes, ADR-0149) AND, because the stable sort changes its output digest, the 30 STALE-IF stages recompute once with
  everything behind them (hours at 100 %); a real launch also carries whatever else main has changed since. For the
  ragged-array change alone (production commit plus the module with sha256 8f0eea49..., what the replay measured)
  only that one stage would re-execute: 21 s in the production log (20:57:34 to 20:57:55: load of its input,
  execute, cache write and the 5.0 s output hash), 5.5 s of it the execute call in the replay, with the 30 STALE-IF
  stages spared by the equal digest. The stage has no helper modules (audit category (a) of
  docs/codebase/notes/synpp-helper-hash-audit.md), so no other token moves.

  Why this construction. The blocks of row positions are repeated as a Python list. Kept out on purpose:
  np.array(..., dtype=object), which keeps the ragged array and makes the shape depend on whether the household sizes
  happen to be equal, and index arithmetic over the household sizes, which removes the intermediate structure but is
  the cleverer code and a larger edit to a vendored stage. zip(strict=True) only states that the numbers of blocks
  and multiplicators agree; since change (3) below, the per-household check before it guarantees that.

  Found by this replay and fixed on the same branch, at the owner's request, AFTER it ran (so the replay above covers
  the ragged-array change only). (1) The stage sorted by household_id with numpy's default, unstable sort, and the input
  is not sorted by household_id: 376,969 of 1,130,422 rows land at another place than a stable sort puts them, so the
  order of the members inside a household was numpy's choice and could change with a numpy upgrade. The sort is now
  stable. This CHANGES the output: those rows move inside their household and get other person ids (which households
  and members are kept does not change; the seeded test still passes), so the output digest changes and the 30
  STALE-IF stages above recompute once, with everything behind them, on the next launch. That figure of moved rows is
  the measurement in results.json, not a replay of the stable-sort code. (2) The pandas DeprecationWarning at the
  household_id assignment (pandas 1.5.3, an in-place write announced for a later pandas) is gone: the column is
  assigned directly; output unchanged on 500 random censuses (frames and pickle bytes identical in all 500), comparing
  the module after the ragged-array change with that module plus only the column assignment
  (random_equivalence_column_assignment_log.txt, which names both module hashes). The 100 % replay ran before this
  change and does not cover it. (3) Added after the PR review: the stage raises a ValueError when household_size
  differs from the person rows of any household. The old code (np.repeat, then zip) only failed when the TOTALS
  differed; two households off in opposite directions silently exchanged a member. Valid input is unaffected (500
  random censuses identical against the previous commit), and the production input has no such household (the
  household_size measurement in results.json). Still true and not touched: every household weight is
  1.0, so at the production input the rounding and the replication of this stage change nothing; the stage only sorts
  the rows by household_id and renumbers households and persons.
