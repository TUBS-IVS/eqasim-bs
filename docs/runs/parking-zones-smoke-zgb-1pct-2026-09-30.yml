  notes: 'The Java counts are per evaluated car CANDIDATE of mode choice, not per chosen trip.'
- metric: OFF-path and legacy parity of the branch jar
  reference: 'the OFF and LEGACY arms run with the jar of origin/main 21c1045c4 (2.3.1) on the same inputs'
  result: 'pass: eqasim_trips.csv.gz (decompressed) and scorestats.csv are byte-identical across the jars of
    origin/main, 3b2232176 and 06b65b3c8, for OFF and for LEGACY; eqasim_legs.csv.gz is identical as a sorted row set
