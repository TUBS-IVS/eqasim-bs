id: parking-zones-smoke-zgb-1pct-2026-09-30
date: '2026-09-30'
repository:
  commit: 2d990e702721e1f281b88f47340966f3c585350a
  branch: feature/i249-parking-cost-zones
  notes: 'eqasim-bs integration branch of #436. The ZONES inputs were prepared on 2026-09-30 05:31 from e557b1fb;
    re-preparing them from 2d990e70 (the two commits in between merge the final-wave golden cases and change the
    default snapshot date to the value the run already passed explicitly) gives byte-identical files (sha256
    prefixes: population 7ce5ba6a, tariff model e0770b1b, config 6d5e8768). Java: eqasim-java-bs
    feature/i249-parking-cost-zones, shaded jar built from 06b65b3c8 with `mvn -pl braunschweig -am -DskipTests
    -Pstandalone package` (the later commit 1e32c87b6 changes tests only). The same jar ran all three arms. The OFF
    and LEGACY arms were also run with the jar of origin/main 21c1045c4 (2.3.1) and with the branch jar of
    3b2232176; see validation.'
configuration:
  base: configs/base_bs.yml
  config: 'local: prepared MATSim scenario of 2026-06 (eqasim-data/cache_bs_cordon_gatecheck/braunschweig.matsim.simulation.prepare__326159939484cb8cd4c639f4e9c53e56.cache,
    prefix braunschweig_cordon_gatecheck_), copied once per arm'
  notes: 'NOT a pipeline run: the local machine has no raw MATSim inputs (OSM, GTFS, VG250), so the three arms ran
    MATSim directly on the June 2026 prepared 1 % scenario. Harness (committed under the artifact directory, harness/):
    the scenario config was regenerated with the branch jar (RunGenerateConfig --sample-size 0.01 --threads 6
    --random-seed 1234, then RunAdaptConfig), because the June config named a DMC tour filter that no longer
    exists; qsim.personInitializedEvents all; 676 missing car/car_passenger vehicles added identically in every arm
    (complete_vehicles.py). OFF = the June plans with every isParis attribute removed. LEGACY = isParis attributes
    re-added by the 8 km rule around Braunschweig Hbf (605170/5790274, EPSG:25832; the person flag APPROXIMATED by
    a home activity within the ring). ZONES = the OFF plans plus parkingZone / parkingFree / residentParkingZone
    computed by the real package code (braunschweig.parking.zones_stage on the committed release,
    braunschweig.parking.attach with random_seed 1234 and parking_workplace_free_share_shift 0.0), the tariff model
    JSON of braunschweig.parking.tariff_export (snapshot 2026-09-29, terminal stay rule until_fee_end) and the
    braunschweigParking config module written by braunschweig.matsim.config_modules, exactly as
    braunschweig.matsim.simulation.prepare does. MATSim: 10 iterations, 6 threads, writeEventsInterval 10.'
sampling:
  rate: 1% (the June 2026 1 % scenario)
  scope: ZGB-8 with cordon in-commuters (12,073 persons in the plans)
  notes: 'Counts are sample counts of the final iteration, never expanded. The June population predates several
    current pipeline features; it is a wiring and A/B vehicle, not the current synthetic population.'
pipeline:
  notes: 'No synpp stage ran. Three direct MATSim runs (org.eqasim.braunschweig.RunSimulation) via harness/run_arm.sh:
    ZONES and OFF concurrently 2026-09-30 05:31-05:44, LEGACY alone 05:45-05:55, each exit 0 with no ERROR line in
    logfileWarningsErrors.log.'
classification:
- smoke
- wiring_proof
- ab_test
status:
  execution: completed
  notes: 'About 12.5 min per arm with two arms running concurrently and 9.5 min alone, on the local machine (Windows
    11, 22 cores, 63 GB; an unrelated MATSim run with a 16 GB heap limit ran at the same time). 10 iterations at the eqasim default of 5 % DMC replanning per iteration: an agent replans in an
    iteration with probability 0.05, so about 40 % of the agents replanned at least once; the arms are far from an
    equilibrium. A smoke, not a validation, and not the planned 25 % A/B on the server.'
environment: 'Windows 11 Pro; conda env eqasim (Python 3.10.10, pandas 1.5.3, geopandas 1.0.1); Temurin JDK
  25.0.4.1; MATSim 2026.0-2026w12 and eqasim 2.3.1 as pinned by eqasim-java-bs'
