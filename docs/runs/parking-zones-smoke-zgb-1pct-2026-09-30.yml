  artifact: 'docs/runs/artifacts/parking-zones-smoke-zgb-1pct-2026-09-30/centre_paid_share_comparison.csv,
    docs/runs/artifacts/parking-zones-smoke-zgb-1pct-2026-09-30/centre_outside_fee_hours_breakdown.csv, docs/runs/artifacts/parking-zones-smoke-zgb-1pct-2026-09-30/zero_length_stays.csv'
  notes: 'The closest model universe (non-home, non-commute arrivals) is small (47) and inflated in its free share by
    zero-length stays of an unconverged run; commute arrivals follow the separate SrV commute table through the
    employer-free draw. The SrV figure also covers the garages and large lots that 70.8 % of those respondents use,
    which v1 prices only for the five BgA car parks.'
