    the Python attach functions reported. Iteration 0 prices no car stay (no replanning); iterations 1-10 price
    1,078-1,321 car candidates each: NO_ZONE 94.1-97.0 %, HOME 0.9-3.3 %, EMPLOYER_FREE 0.4-1.7 %, paid outcomes
    0.74-1.97 %, all ten outcome rows written to ITERS/it.N/N.parking_outcomes.csv.'
