  artifact: docs/runs/artifacts/parking-zones-smoke-zgb-1pct-2026-09-30/jar_parity_sha256.csv
  notes: 'Without a braunschweigParking module the branch changes nothing; the legacy ring reproduces exactly.'
- metric: Python reference vs Java calculator on the committed 24-zone release
  reference: 'none -- consistency of the two implementations of the ADR-0139 rules'
  result: '60,000 random stays (seed 20260929), 0 mismatches in cents and outcome; all nine calculator outcomes
    occur (NO_ZONE is decided before the calculator and is pinned by unit tests on both sides).'
  artifact: docs/runs/artifacts/parking-zones-smoke-zgb-1pct-2026-09-30/python_java_differential.txt
- metric: car share of the final iteration, OFF / LEGACY / ZONES
  reference: 'none -- a change between the arms, not a comparison with observed behaviour'
  result: 'All trips (36,124; LEGACY 36,122): 49.03 / 48.33 / 48.96 %. Trips ending within 8 km of Braunschweig Hbf
    (7,984): 44.04 / 42.21 / 43.79 %. Trips ending in a parking zone polygon of the release (1,393): 47.24 / 46.37 /
    46.45 %. The zones reduce the car share of zone-bound trips by 0.8 pp (about 11 trips at this scale) and of
    ring-bound trips by 0.25 pp; the ring by 1.8 pp on ring-bound trips, because it charged every non-resident
    stay within 8 km at 3 EUR per started hour. No direction or size can be read from one 1 % draw after 10
    iterations.'
  artifact: docs/runs/artifacts/parking-zones-smoke-zgb-1pct-2026-09-30/mode_shares_by_arm.csv
- metric: outcomes of the CHOSEN car trips ending in a zone (ZONES arm, final iteration, Python reference on the
    executed times)
  reference: 'none -- descriptive'
  result: '703 chosen car arrivals in a zone: HOME 269, EMPLOYER_FREE 213, PAID_CAMPUS_MEMBER 104, PAID_METERED 67,
    OUTSIDE_FEE_HOURS 39, PAID_CAMPUS_GUEST 5, PAID_LONG_STAY 4, FREE_WITHIN_LIMIT 2; 180 paid (25.6 %) at a mean
    of 3.23 EUR per paid stay. 49 of the 703 (7.0 %) are zero-length stays (the car arrives after the planned end
    of the activity) and pay nothing; over all 17,685 chosen car arrivals the share of zero-length stays is 11.8 %.'
  artifact: 'docs/runs/artifacts/parking-zones-smoke-zgb-1pct-2026-09-30/zone_outcomes_chosen_car_trips.csv,
    docs/runs/artifacts/parking-zones-smoke-zgb-1pct-2026-09-30/zero_length_stays.csv'
  notes: 'Arrival = destination activity start, departure = its end, terminal activities by rule T1, from
    eqasim_activities.csv.gz of the final iteration.'
- metric: share of chosen car arrivals in the Braunschweig centre street zones (bs_zone_*) with a paid outcome
  reference: 'eqasim-data/data/braunschweig/srv/srv2023_city_center_parking.csv paid_share_overall = 0.8333 -- a
    COMPARISON with a universe caveat, not a validation: SrV asks Braunschweig residents where they USUALLY park
    when they drive to the city centre, including garages and large lots; the model counts executed car arrivals
    in the street zones of one simulated day'
  result: 'All 225 arrivals: 17.3 % paid. Without home arrivals (151): 25.8 %. Without home, work and education
    arrivals (47): 59.6 % paid, 40.4 % outside fee hours; persons whose home lies within 8 km of the Hbf (43, an
