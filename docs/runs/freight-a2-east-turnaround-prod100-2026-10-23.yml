issues:
- '#465'
- '#444'
decisions:
- ADR-0144
source: 'Scripts run in felix:~/i465-portal35 on 2026-10-23 with the commands in the docstrings, e.g.
  python3 events_probe.py --run <run> --out <dir> --bbox 640000,5780000,660000,5792000;
  python3 analyse_portal.py <run> <dir> 450785 321213 <flowCapacityFactor>;
  python3 blocking_probe.py <dir>/bbox_events.csv 450785;
  python3 upstream_probe.py <delayed_traversals.csv> <dir>/bbox_events.csv 38954,647288 450784,450785;
  python3 portal_inventory.py <run> <out.csv> [prefix]; python3 portal_load.py <run> <inventory.csv> <out.csv>
  <flowCapacityFactor> [prefix]; python gate_links.py <run> <cordon_gates pickle> <out.csv>;
  python3 gate_departures.py <run> gate_links_rerun.csv 0.01 > gate_departures_rerun.txt. An empty
  return_detour_m in the portal_load CSVs means no return to the link start within 30 km of driving.'
