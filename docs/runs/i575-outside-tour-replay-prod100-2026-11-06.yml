validation:
- metric: home-based tours with pt legs that the outside-tour timetable check covers, and their outcome, by portal class
  reference: 'the run''s own stage report (prod100_20261031); model output, NOT observed data'
  result: >-
    Before: 4,330 tours (9,487 pt legs), only tours without a portal leg. After: 8,609 tours (18,767 pt legs).
    Without portal leg 4,330 (unchanged set): connection_found 3,313, tour_shifted 290, tour_to_car 348,
    tour_to_car_passenger 233, tour_to_car_passenger_lift 146. Road-gate portal tours 299 (314 legs), new:
    connection_found 117, tour_shifted 63, tour_to_car 116, tour_to_car_passenger 3. Rail-gate portal tours 3,980
    (8,966 legs), new: connection_found 3,342, tour_shifted 308, pt_legs_to_car_passenger_lift 330 tours with 453
    lifted legs. kept_no_connection 0 in every class; median shift 3,600 s. Persons whose late day moved earlier
    (writer rule) 53 -> 178, because more persons are checked.
  artifact: docs/runs/artifacts/i575-outside-tour-replay-prod100-2026-11-06/outside_tour_modes_report_after.json
- metric: share of checked portal tours whose pt legs had no connection at their written times
  reference: 'the same replay; before the change these tours were not checked at all (no before value exists)'
  result: >-
    Road gate 182/299 (60.9 %) not connected at first, 63 of them by a shift. Rail gate 638/3,980 (16.0 %), 308 of
    them by a shift; the other 330 tours lift 453 legs. After the chain no checked portal tour keeps a pt leg
    without a connection.
  artifact: docs/runs/artifacts/i575-outside-tour-replay-prod100-2026-11-06/outside_tour_modes_report_after.json
- metric: 'group 3 of #575: are the 489 unconnected legs labelled outside_tour by the B3 long-walk probe in tours the stage checks?'
  reference: 'felix ~/scratch_b3/out_b2/legs_connection.csv.gz of the B3 probe (model output) joined with the stage''s own tour flags on its cached inputs'
  result: >-
    All 489 legs (mode pt in trips.final) are in tours with neither an outside destination, an outside activity nor a
    portal leg, so neither the old nor the new check covers them: they lie outside the stage's scope.
  artifact: docs/runs/artifacts/i575-outside-tour-replay-prod100-2026-11-06/group3_output.txt
- metric: 'group 3 of #575: is each of the 489 legs frozen in the prepared population, and what puts an outside activity into its tour?'
  reference: 'the run''s uncut (braunschweig.matsim.scenario.population) and prepared (prepare, routed and cut) populations; the plan check''s freeze rule (plan_check.leg_tour_frozen); model output, NOT observed data'
  result: >-
    The B3 probe labelled every pt leg of its persons, frozen or not. Matched in the prepared plan 471 (18 ambiguous).
    Not frozen 89: mode choice can still change them. Frozen 382 (straight-line p50 14.8 km, p90 23.7 km). Of these,
    324 are walks stamped walkFallbackFrom=pt. The other 58 are NOT walks: the cause probe recorded only the mode of
    the trip's first leg (an access walk); read as whole trips (i575_group3_plain_walk_trips.py), the 47 that match
    uniquely are routed pt trips with a pt leg, 38 of them the trip that is itself cut at the extent and 9 reaching an
    inside place; 11 do not match uniquely. In 379 of the 382 the uncut plan has no outside activity at all: the
    outside activities of the tour come from the cutter on a trip of the same inside-only tour whose routed path
    leaves the extent (for the 324 walks another trip of the tour; by the routing mode of the trip that exits, over all
    382: pt 337, pt and walk 7, pt and car 2, walk 18, car_passenger 10, car 7, car_passenger and walk 1). Example
    person 733417: home -walk-> leisure -pt-> work -pt-> home; the work -> home pt route runs outside the extent and is
    cut, the tour freezes, and the unconnected leisure -> work pt leg stays a walk of 2:22 h in every iteration.
  artifact: docs/runs/artifacts/i575-outside-tour-replay-prod100-2026-11-06/group3_frozen_cause_output.txt
