configuration:
  base: configs/base_bs.yml
  overlays:
  - configs/overlays/smoke_kreis_control_fit.yml
  notes: 'First run of the two-layer control smoke (#282): Braunschweig (03101) only, target
    data.census.filtered, own cache eqasim-data/cache_smoke_control_fit (shared production
    cache untouched; 61 entries primed from cache_shared). All three unproven changes of this
