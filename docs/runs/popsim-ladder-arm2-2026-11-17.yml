id: popsim-ladder-arm2-2026-11-17
date: '2026-11-17'
repository:
  commit: 81e41c9b316295a22e4b4ee4004757aa650cc5e3
  branch: fix/i647-popsim-seed-controls
  notes: >-
    PRE-REGISTRATION: this file was committed with the bounds below before the arm-2 PopulationSim runs
    started; only results, artifacts and execution notes are added afterwards. Code used for the seed and
    target repairs and the checks: eqasim-bs 81e41c9b (git archive on the run server). Scripts:
    scripts/prepare_arm2.py and scripts/real_cells_check.py of the artifact directory.
configuration:
  base: configs/base_bs.yml
  overlays:
  - the run overlay of prod100_20261031 (server-local), only as the configuration that produced the batch folders
  notes: >-
    Arm 2 = arm 1 of popsim-ladder-arm1-2026-11-17 (WP2, #645: fork 0.10.0+bs.1, fractional seed weights,
    Gumbel draw, random_seed 1234, timeout 7200 s) plus WP3 (#647, ADR-0198) applied to the same batch
    inputs. The arm-1 folders ~/i645/arm1g_A/batch_000 and batch_032 are copied; prepare_arm2.py then
    changes only (a) the seed tables: HP_SEX, H_MIETE and haustyp resolved with
    attributes.resolve_binary_sex and attributes.resolve_tenure_and_building_type (one stream
    RandomState(1234 + 97531)), raw codes kept in HP_SEX_raw, H_MIETE_raw, haustyp_raw; and (b) the three
    building-type columns of control_totals_ZENSUS100m.csv, rescaled to the household total with
    building_type_targets.rescale_building_type_to_households and integerised per column within the 1 km
    parent (controls.integerize_within_parents). A column-by-column diff against arm 1 confirms that
    nothing else changed (settings.yaml, controls.csv, all other control totals and seed columns
    identical). Deviation from a pipeline run: the pipeline rescales the float census dwelling counts
    before integerising; here the rescale starts from the arm-1 integer dwelling targets. The pipeline
    resolves on the completed donor tables (same records, other row order, other individual draws).
sampling:
  rate: 1.0
  scope: >-
    two of the 60 batches of prod100_20261031 with their full seed pool of 218,097 MiD 2023 households
    (scope as in popsim-ladder-baseline-2026-11-16).
  notes: The rate is the share of each batch's cells simulated (all of them), not a population sampling rate.
pipeline:
  targets: []
  notes: >-
    No synpp pipeline run: PopulationSim standalone on the prepared batch folders (run_arm.sh of
    popsim-ladder-arm1-2026-11-17, environment environments/populationsim of the WP2 branch), evaluated
    with braunschweig.analysis.popsim_batch_diagnostics at 81e41c9b (includes resolved_record_shares).
classification:
- ab_test
status:
  execution: running
  notes: >-
    Pre-registered 2026-11-17 before the runs. Already done before the runs (inputs, not results):
    real_cells_check.py on the prepared 100 m cells of the eight ZGB Kreise and prepare_arm2.py; their
    outputs are artifacts of this record.
source: >-
  felix run server, ~/i647 (arm folder arm2_A, logs, real_cells_check); committed copy in
  docs/runs/artifacts/popsim-ladder-arm2-2026-11-17/.
environment: >-
  run server (Linux KVM guest, not x86-64-v2); PopulationSim environment as in
  popsim-ladder-arm1-2026-11-17; checks and diagnostics in the conda eqasim environment.
validation:
- metric: >-
    G6 seed coverage: every seed record in the universe of an exhaustive control group matches exactly one
    category (seed_contract.check_seed_coverage, error mode, on the arm-2 seed and the batch controls.csv)
  reference: none (property of the inputs)
  result: pending
  artifact: docs/runs/artifacts/popsim-ladder-arm2-2026-11-17/batch_000_seed_coverage.csv
- metric: >-
    G6 household totals on the real prepared 100 m cells of the eight ZGB Kreise: per resolved Kreis,
    household_size, tenure and building_type (rescale on) target sums against the household total; bound
    |ratio - 1| <= 0.02 (seed_contract.UNIVERSE_RATIO_TOLERANCE, the WP1 universe threshold)
  reference: none (property of the control targets); the 0.02 bound is an ASSUMPTION-grade design bound
  result: pending
  artifact: docs/runs/artifacts/popsim-ladder-arm2-2026-11-17/real_cells_household_group_totals.csv
- metric: >-
    G3: integer control fit WAPE per geography (as in popsim-ladder-baseline-2026-11-16) against arm 1
    (Gumbel, random_seed 1234) of the same batch; bound arm 2 <= arm 1 + 0.02 (ZENSUS100m), + 0.02
    (ZENSUS1km), + 0.01 (KREIS). Reported twice: over all controls, and over the controls without
    building_type_* (their targets change in arm 2, so the all-controls figure is not like for like); the
    bound applies to the second
  reference: >-
    arm 1 of popsim-ladder-arm1-2026-11-17 (model output, NOT observed data); ASSUMPTION-grade design bounds
  result: pending
  artifact: docs/runs/artifacts/popsim-ladder-arm2-2026-11-17/arm2_comparison.csv
- metric: >-
    Use of the resolved records: per batch, the synthetic share of the seed records with HP_SEX_raw 3 or 9,
    with H_MIETE_raw not 1 or 2, and with haustyp_raw 95, divided by their seed weight share
    (resolved_record_shares.csv); bound 0.5 <= ratio <= 2.0
  reference: >-
    the seed's own H_GEW-weighted shares (survey data); the bounds are the WP1 coverage warning thresholds
    coverage_ratio_low / coverage_ratio_high, ASSUMPTION-grade
  result: pending
  artifact: docs/runs/artifacts/popsim-ladder-arm2-2026-11-17/arm_2_A/resolved_record_shares.csv
- metric: >-
    G2 kept: per H_GEW weight class the synthetic household share minus the class's seed weight share,
    per batch; bound |gap| <= 5 percentage points in every class (as for arm 1)
  reference: the seed's own H_GEW shares (survey data); ASSUMPTION-grade design bound
  result: pending
  artifact: docs/runs/artifacts/popsim-ladder-arm2-2026-11-17/arm2_comparison.csv
- metric: >-
    Reported without a bound, against arm 1: building-type control fit, distinct seed households and Kish
    effective size, household totals, non-simultaneous integerizer parents per level, wall time and peak RSS
  reference: arm 1 (model output)
  result: pending
  artifact: docs/runs/artifacts/popsim-ladder-arm2-2026-11-17/arm2_comparison.csv
features:
  note: >-
    Evidence for popsim_method (WP3 of the PopulationSim repair, issue #647, ADR-0198). Single-batch
    evidence on two batches; the verdict for the full population is the full rerun (#648).
artifacts:
- docs/runs/artifacts/popsim-ladder-arm2-2026-11-17/scripts/prepare_arm2.py
- docs/runs/artifacts/popsim-ladder-arm2-2026-11-17/scripts/real_cells_check.py
issues:
- '#647'
- '#645'
- '#138'
notes: >-
  Control fit against the model's own targets is not validation against observed behaviour.
