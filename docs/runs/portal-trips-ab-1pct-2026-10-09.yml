- ADR-0141
notes: >-
  What this run is evidence for: the portal wiring works end to end at a 1 % sample (stage, chain solver anchors,
  facilities, population writer and MATSim iteration 0 run through; counts of the stages agree), and the direction of
  the plan-feasibility indicators (stuck agents, plans ending after 30:00, non-monotonic end times, long walk trips)
  moves toward fewer problems with the flag on. What it does not show: (1) no validation of any kind (no observed
  reference was compared; there is no committed reference for long-distance legs in the simulated population and
  the donor diaries long-distance legs measured in the same run are not recorded here); (2) the OFF arm is the flag
  switched off at aa2726e5, not a byte comparison with the pre-feature state, so the whole-pipeline byte identity of
  the OFF path stays unproven beyond the component tests; (3) the run has 0 MATSim iterations, so convergence and
  equilibrium behaviour are untested. Open findings, recorded as findings and not as defects of the run: share_out
  capped for 440 / 617 stays (141 from synthetic home closure legs without reported distance, about 299 not
  decomposed); 134 walk trips above 20 km and 68 plans ending after 30:00 remain with the portal on (other causes,
  #443); trucks stuck unchanged (#444). Caveats: the run was concurrent with another session on the same server
  (runtimes not comparable); the Java jar is a cached artifact of an unknown eqasim-java-bs commit (same md5 in both
  arms, no portal class); the cache is a physical copy of a 1 % all-features popsim cache with entries older than
  08:40 plus pipeline.json, and the first launch was killed after two minutes because pipeline.json was missing.
  Server-only data: output_persons / output_plans of the two arms and the portal stage cache directory.
source: >-
  The figures come from the run notes of the controller session (felix:~/wt-i442/logs/run_20261009T085020.log for the
  ON arm, felix:~/wt-i442/logs/run_20261009T093812.log for the OFF arm), the committed i442_metrics_{on,off}.json (output of
  smoke_metrics_i442.py run against each arm, argument order <output_dir> <prefix> <cache_dir> <arm>), and
  portal_trips_report.json (stage report copied from the stage cache directory of the ON arm). The share_out split (141 closure legs without a reported
  distance) comes from share_cap_probe.py (committed artifact), run against the ON arm's cached
  trips_day_stage and portal stage pickles.
