notes: >-
  Comparison with the scratch probes behind the repair design and issues #645 to #647 (those figures were never
  evidence; these are). Reproduced exactly: 15,248 of 218,097 seed households used, Kish size 1,293, top 1,000 carry
  57 %; weight below 1 at 0.6 % synthetic against 27.6 % of the weight; base sample 65.8 % against 38.7 %; persons
  without a binary sex 7.2 times over-selected; building-type targets 609,816 against 558,151 households (ratio
  1.093); 26 of 172 parents fell back at the level below KREIS (the probe called them "KREIS-level parents": the
  parent label is KREIS_<id>, the level integerized is ZENSUS1km); the probe's 18 parents at the 60 s limit are the
  11 first attempts plus 7 retries ending NOT_SOLVED at that level. Differences by definition: the probe's
  "households without tenure or building type, 9.5 % of the weight, 0.35 % synthetic" is the union of two groups;
  this tool reports each group (tenure 3.50 % / 0.35 %, building type 6.18 % / 0.004 %) and not the union. The
  design's "batch_000 with 6,629 households" is the batch's household target; the batch's output has 6,724
  households. Not measured here: the share of seed groups entering PopulationSim at weight 0 (needs the checkpoint
  store; goal G1 belongs to WP2) and the rounding shift of goal G4 (needs the store; measured on the re-run arms in
  popsim-ladder-baseline-2026-11-16).
