    beyond what the 09-03 manifest already records. Cache side effects of THIS run:
    braunschweig.analysis.reference.srv.commute_distance__dbe8ad3b.p overwritten (same hash, new
    payload: the dict now carries the sensitivity table);
    braunschweig.analysis.synthesis.commute_distance_by_kreis__c00735bf.{p,cache} added as NEW
    entries, leaving the 09-03 entry __5080c980 in place but orphaned; .merged_config.yml
