id: srv-primary-distance-baseline-2026-09-04
date: '2026-09-04'
repository:
  commit: 7ac21e2d
  branch: feature/srv-primary-distance-targets
  notes: 'RE-MEASUREMENT of srv-primary-distance-baseline-2026-09-03 on the same cached 100%
    population, with two additions and one rule change; it supersedes nothing -- the 09-03
    manifest remains the record of the PRE-REGISTERED measurement. (1) The decision rule was
    sharpened after that baseline (ADR-0103 section "Amendment 2026-09-04",
    braunschweig.calibration.decision): the ZGB aggregate now needs the same
    srv_distance_min_persons floor as any Kreis to be decisive, and a frame in which NO cell is
    decisive reports undecidable rather than a false "do not build". (2) Three SENSITIVITY
    reference variants (inter_zgb, all_gis_fallback, inter_gis_fallback) are now measured beside
    the pre-registered comparison, and (3) every scope/level/variant is re-decided at EMD
    thresholds 0.06 / 0.08 / 0.10. Code = branch HEAD 7ac21e2d; its files under
    braunschweig/analysis, braunschweig/calibration/{srv_distance_targets,decision}.py,
    documentation/plots and scripts/extract_srv_primary_distance_targets.py (10 files, new and
    changed relative to origin/main 379223f2) were synced onto a DETACHED server worktree at
    b7eed9a5 (~/wt_srv_baseline) without a git push, exactly as for the 09-03 run; the four
    committed SrV CSVs (commute, quantiles, education, sensitivity) were copied into the data
    trees separately. b7eed9a5 is deliberately the commit of 100pct-allfeat-i329-2026-08-24, so
    the analysis executes against the i329 cache under the identical code state. Files that
    changed between b7eed9a5 and 379223f2 in those paths (analysis_suite, dashboard,
    matsim_archive, run_mid_validation, simwrapper) were deliberately NOT synced: none is in this
    stage''s import closure, and syncing them would have moved the code state away from i329.'
configuration:
  base: configs/base_bs.yml
  overlays:
  - 'felix:~/srv_baseline_100pct.yml'
  notes: 'The overlay is byte-identical to the one used on 2026-09-03 (unchanged file, mtime
    2026-09-03 23:31, 1,789 bytes): working_directory eqasim-data/cache_bs_100pct_i329,
    output_path eqasim-data/output_bs_100pct_i329, output_prefix braunschweig_100pct_i329_,
    popsim work_dir / max_cells 750 / num_workers 3 / importance_profile optimized_2026_06_30,
    cache_share_export, eqasim_version 2.3.1, run: the single stage
    braunschweig.analysis.synthesis.commute_distance_by_kreis. Merge log: "0 overridden, 14
    added", identical to the 09-03 run. The stage''s own parameters again ran at their defaults,
    now including the two new ones: srv_distance_detour_factor 1.3, srv_distance_emd_threshold
    0.08, srv_distance_min_persons 200, srv_distance_aggregate_requires_min_persons true,
    srv_distance_max_unmatched_home_share 0.05, srv_distance_warn_unmatched_destination_share
    0.3, srv_distance_sensitivity_thresholds [0.06, 0.08, 0.1].'
sampling:
  rate: 100%
  scope: ZGB-8
  notes: 'No population was synthesised by this run; the measured population is the one the i329
    run wrote (manifest 100pct-allfeat-i329-2026-08-24), reached through the same cache as on
    2026-09-03. Cohorts measured: 304,900 workers with a work destination and 178,763
    pupils/students -- identical to the 09-03 run, as are commute_by_kreis.csv,
    education_by_kreis_level.csv and commute_quantiles_model.csv, which are BYTE-IDENTICAL to
    their 09-03 counterparts (verified with cmp) -- and consequently so are all four PNGs
    (work_all, work_inter, work_intra, education), which are re-rendered from those identical
    CSVs and were likewise verified byte-identical to the 09-03 files. They are committed under
    the 09-04 directory for self-containment, not because they show anything new. The measurement
    did not move; only the decision rule and the added sensitivity section did.'
pipeline:
  targets:
  - braunschweig.analysis.synthesis.commute_distance_by_kreis
  notes: 'synpp resolved a 2-stage plan and devalidated exactly those two:
    braunschweig.analysis.reference.srv.commute_distance (__dbe8ad3b, re-executed because its
    cached payload predates the sensitivity table) and the target stage, whose hash moved from
    __5080c980 to __c00735bf with the new srv_distance_sensitivity_thresholds config key. Both
    executed; EVERY other stage loaded from the i329 cache. Abort-criterion check (grep over the
    log for "Executing stage"): no braunschweig.data.*, braunschweig.popsim.*,
    braunschweig.gravity.*, data.*, synthesis.population.spatial.home.* or matsim.* stage
    executed, and -- unlike the 09-03 run -- neither did
    synthesis.population.spatial.primary.candidates or the two education-gravity stages, because
    the 09-03 run had already rewritten those pickles consistently under b7eed9a5.'
classification:
- validation
status:
  execution: completed
  notes: 'Ran 2026-09-04 08:22:18 -> 08:22:32 CEST (14 s wall for the two stages, pipeline
    progress 2/2), exit without error, no ERROR line and no traceback in the log. CACHE STATE:
    this run again reset the i329 stage-hash bookkeeping ("Successfully reset meta data",
