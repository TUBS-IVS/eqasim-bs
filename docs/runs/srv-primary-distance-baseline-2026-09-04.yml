    two new files inside the existing analysis/srv_distance_validation/ subfolder (the other six
    were overwritten with identical or extended content). Shared-checkout invariants on felix:
    ~/eqasim-bs porcelain 26 entries and HEAD 2714b857 before and after; ~/wt-i329 intact at
    b7eed9a5; the detached worktree ~/wt_srv_baseline was removed afterwards (worktree list back
    to the 19 pre-existing entries) together with its eqasim-data symlink, the eqasim-data._tracked
