classification:
- ab_test
- validation
status:
  execution: completed
  notes: 'COMPLETE, exit 0. The OFF path is byte-identical to arm 4 on the reporting-day trip
    table (md5 equal), and this run provides the first plan-structure numbers of the base state on
    the REPORTING-DAY view, which the arm-4 manifest did not have (it read the pre-assignment view).
    It is the baseline every arm-1 and arm-2 delta of this ladder is quoted against.'
environment: server
validation:
- metric: 'BYTE IDENTITY of the OFF path against arm 4 (ADR-0110 Consequences, pre-registered:
    "The OFF arm must be byte-identical to arm 4 on trips.final")'
  reference: 'felix:~/pb4_data/output_bs_100pct_pb4/braunschweig_100pct_pb4_trips.csv (arm 4,
    manifest participation-universe-controls-arm4-100pct-2026-09-08), md5
    8a46d5eedc4f18fa8ff2cc0e16b028cc'
  result: 'MET EXACTLY. md5 of braunschweig_100pct_b370_arm0_trips.csv =
    8a46d5eedc4f18fa8ff2cc0e16b028cc, identical to the arm-4 file, over 190,821,549 bytes. The
    whole #370 package (a new unconditional stage declaration in trips_day_stage, the union rule in
    build_day_trips, the persons.csv column mechanism, the MATSim attribute, the analysis-stage
    universe handling and the plan_structure_trips_view switch) therefore leaves the OFF trip
    table bit-for-bit unchanged on a live 100 % population, which is what the unit test
    tests/test_commute_day_stages.py::test_trips_day_stage_off_off_returns_the_identical_object
    pins on synthetic data. The comparison is restricted to trips.csv on purpose: arm 4 measured
    plan structure on the pre-assignment view, so its headline.csv is NOT comparable to this one.'
  artifact: 'eqasim-data/data/braunschweig/calibration/general_day_absence_arm0_100pct_2026-09-09/run_log_excerpts.txt'
- metric: 'Plan structure of the base state on the REPORTING-DAY view (first measurement; the
    OFF baseline of the ladder), segment all, universe at_home_zero'
  reference: 'eqasim-data/data/braunschweig/srv/srv2023_plan_structure_reference.csv, at_home_zero,
    segment all (n 18,223)'
  result: 'MEASURED. mobility_rate 0.8819 vs 0.8437 = +3.82 pp (the arm-4 manifest quoted +4.4 pp on
    the pre-assignment view; the 0.6 pp between the two OFF numbers is the far-commuter absent
    state of ADR-0104, which the reporting-day view applies and the pre-assignment view does not);
    share_trips_0 0.1181 vs 0.1563 = -3.82 pp; trips_per_person 3.2216 vs 3.1865;
    trips_per_mobile_person 3.6529 vs 3.7767; participation_work 0.3382 (+0.67 pp), education
    0.1752 (-0.09), shop 0.2177 (-6.17), leisure 0.3756 (-0.76), escort 0.1010 (+0.18), other
    0.2529 (+8.17); purpose_share_shop -3.02 pp, purpose_share_other +4.04 pp. The +3.8 pp mobility
    overshoot is the away-from-home mass the model had no concept of before #370 (SrV counts 4.98
    % of persons as away the whole day); the shop/other gap is the purpose-labelling problem of
    issue #373, untouched here.'
  artifact: 'eqasim-data/data/braunschweig/calibration/general_day_absence_arm0_100pct_2026-09-09/headline.csv'
- metric: 'Plan structure of the base state on the at_home_only universe (the OFF baseline for
    pre-registered row 5 of ADR-0110), segment all'
  reference: 'srv2023_plan_structure_reference.csv, universe at_home_only, segment all (n 17,269)'
  result: 'MEASURED by the analysis-only follow-up. With the draw off no model person is away from
    home, so the model side is the full 1,002,871 in-scope persons and only the SrV side changes
    universe: mobility_rate 0.8819 vs 0.8879 (-0.60 pp), share_trips_0 0.1181 vs 0.1121 (+0.60),
    participation_work 0.3382 vs 0.3489 (-1.07), education 0.1752 vs 0.1853 (-1.01), shop 0.2177 vs
    0.2940 (-7.63), leisure 0.3756 vs 0.4032 (-2.77), escort 0.1010 vs 0.1044 (-0.34), other 0.2529
    vs 0.1801 (+7.28), trips_per_person 3.2216 vs 3.3534. These are the values the arm-1 row 5
    deltas are measured against.'
  artifact: 'eqasim-data/data/braunschweig/calibration/general_day_absence_arm0_100pct_2026-09-09/at_home_only_comparison.csv'
- metric: 'ADR-0104 check 1 -- employed persons with a work trip (ZGB, employed attribute basis)'
  reference: 'eqasim-data/data/braunschweig/srv/srv2023_work_participation_by_kreis.csv, zgb row,
    srv_share_work_trip = 0.6511223931 (n 8,016)'
  result: 'MEASURED, identical to arm 4 as it must be: 360,910 of 535,757 employed persons with a
    work trip = 0.6736, delta +2.25 pp (tolerance +/- 3 pp, regional aggregate); reporting-day
    states at_workplace 0.673 / home 0.013 / absent 0.008 / no_workplace 0.306; 0 of 535,757
    employed persons set to absent by the general draw (n_absent_general 0 in every Kreis row).'
  artifact: 'eqasim-data/data/braunschweig/calibration/general_day_absence_arm0_100pct_2026-09-09/commute_day_state_shares.csv'
- metric: 'Reporting-day composition diagnostics with the draw off (the control values for the
    arm-1 union diagnostics)'
  reference: 'braunschweig.synthesis.commute_day.plan_replacement.build_day_trips diagnostics; no
    external reference'
  result: 'MEASURED. 7,379 far commuters replaced (+21,313 / -48,040 trips), 4,470 commute-absent
    (n_persons_absent_general 0, n_persons_absent_both 0, n_trips_removed_general 0), 1,356 of the
    7,379 donors immobile (18.4 %), 0 home persons unmatched; escort diagnostics 0 of 4,470 absent
    persons with an escort leg and 0 of 185,532 present children with an absent escorter, i.e. the
    far-commuter absent state alone never removes an escort leg. Synthetic home closure 226,471
    trips = 6.23 % of 3,636,198 trips, 22.7 % of the 995,671 mobile persons.'
  artifact: 'eqasim-data/data/braunschweig/calibration/general_day_absence_arm0_100pct_2026-09-09/run_log_excerpts.txt'
artifacts:
- 'eqasim-data/data/braunschweig/calibration/general_day_absence_arm0_100pct_2026-09-09/ --
