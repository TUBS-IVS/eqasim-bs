issues:
- '#444'
decisions:
- ADR-0144
notes: >-
  What this run is evidence for: the rule is wired end to end at a 1 % sample (the Java injector linked all 725
  boundary endpoints, 0 fallback; the prepare stage logged and wrote the summary), and in the simulation the
  queue on residential link 501844 is gone (51 -> 0 stuck trucks, 100 -> 0 freight starts on that link), with
  68 more trucks arriving. What it does not show: (1) no validation of any kind (no observed reference, e.g.
  truck counts, was compared); (2) iteration 0 only, so no replanning and no equilibrium; (3) one 1 % draw, so
  the 100 % queue size is not reproduced (prod100_20260925 had 6,907 of 7,595 stuck trucks on 501844).
  30 trucks stay stuck in the ON arm, 27 of them on the motorway_link pair 182357 / 18416, unchanged against
  OFF (see the open finding above). Caveats: the felix shared data lacks zensus2022_employed_by_age_kreis.csv
  (copied into the arm worktrees only); run_provenance records eqasim_java_commit unknown for a worktree Java
  tree (the commits are in the run logs).
