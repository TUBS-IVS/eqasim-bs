id: prod100-guice-asm-line-numbers-2026-11-05
date: '2026-11-05'
repository:
  commit: f3f1e2dd7f7d92028abed16680e8296411deb76b
  branch: fix/guice-asm-java25-class-files (TUBS-IVS/eqasim-java-bs)
  notes: >-
    The commit is in the eqasim-java-bs fork, not in this repository. Every measurement below ran from a local work
    tree of that fork cut from its origin/main c4051c167 (the merge of the DMC trip cache fix, #59) with the change
    uncommitted; it became the commit above. Two edits followed the full suite of core and braunschweig, the jars, the A/B
    runs and the test-compile of all modules, which therefore ran on the earlier text: the pom comments and the Javadocs
    were shortened (text only, no build input), and the two test classes were hardened after an independent review (a
    single copy of the ASM reader and a direct read of a class file with it, both in GuiceClasspathTest; the copy check of
    the Guice classes moved out of GuiceSourceLinesTest). The red and green runs of the tests and the runs with a
    deliberate mutation ran on the final text, and the affected tests ran again on the clean commit. The baseline
    ("before") runs read the two poms of origin/main c4051c167; the test classes stayed.
