  branch: fix/i678-mode-choice-reach
  notes: >-
    commit is the code that PRODUCED the run prod100_20261031 (the measured state), not the code of this branch; branch is
    only the branch that commits this record. The probes read the products of the run prod100_20261031, which was produced by code 7a41f0ba, i.e. before #570 to
