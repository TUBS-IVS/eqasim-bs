    Production mode choice as the run's MATSim config sets it (tour finder on [home, outside], tour filters
    OutsideFilter and TourLength with maximumLength 6); see issue #678 for the mechanism.
sampling:
  rate: 1.0
  scope: >-
    the uncut population (braunschweig.matsim.scenario.population) and the prepared population (routed and cut, the file
