status:
  execution: completed
  notes: >-
    A table build and a calibration check on survey aggregates, not a validation. The calibration check is still
    undecided in both stages (validation entries); the weight triple and the mover share are those the owner set on
    2026-11-26. The owner decided on 2026-11-27 not to scale the level to SrV.
validation:
- metric: enrollment by semester and the fallback of the three institutions outside the LSN statistics
  reference: none (a count of how the enrollment was taken, with the rate of the fallback)
  result: >-
    Read from docs/runs/artifacts/student-balance-2026-11-27/balance_logs.txt (the two lines '[build_student_balance]
    enrollment outside LSN') and from the Diagnostics line of eqasim-data/data/braunschweig/schools/student_balance_by_site.csv
    (keys of the object 'sites': enrollment_semester, outside_lsn_enrollment, census_year_semester, outside_lsn_enrollment_census_year). Model semester WS 2025/26 (--sites, column
    semester of the table): primary 1/3 of the three institutions outside LSN (own semester), fallback 2/3 (last published
    winter semester, WS 2024/25: Hochschule Magdeburg-Stendal, Hochschule Harz). Census-year semester WS 2022/23
    (--sites-census-year): primary 3/3, fallback 0/3. The sum of column enrollment_persons of student_balance_by_site.csv
    is 27952 (model semester).
- metric: level per Kreis next to the balance row sums (the census split of the level)
  reference: row sums of T (the balance), the same run
  result: >-
    Read from docs/runs/artifacts/student-balance-2026-11-27/student_level_gate.csv, columns balance_students_persons and
    level_students_persons, per code (row 03ZGB = the seven surveyed Kreise without 03103): 03101 balance 15132.48495 level 12367.08101; 03102 balance 1810.583734 level 2079.147212; 03103 balance 2624.440449 level 2567.690089; 03151 balance 1191.360862 level 2066.753304; 03153 balance 3706.098338 level 3338.301276; 03154 balance 568.0523154 level 1590.522449; 03157 balance 1502.509355 level 2261.533638; 03158 balance 2226.247203 level 2490.748226; 03ZGB balance 26137.33675 level 26194.08711. The level keeps the
    total of the eight Kreise (header key level_total_persons of student_level_table.csv) and splits it by the census
    pattern (the shares are in the header key shares_json). Gate flags (header lines of student_level_gate.csv):
    gate_triggered=True (the pooled row 03ZGB is beyond 2.0 SrV standard errors in column beyond_two_se, value of
    difference_in_srv_se -2.126828; the Braunschweig row 03101 is not, -1.675192) and gate_triggered_area_consistent=True (rows
    03101 and 03ZGB, column beyond_two_se_20_29). The trigger flipped between the two final runs: gate_triggered was False in the
    header of docs/runs/artifacts/student-balance-2026-11-26/student_level_gate.csv (pooled row 03ZGB difference_in_srv_se
    -1.851002, Braunschweig row 03101 -1.398051) and is True in this run. The owner decided on 2026-11-27 not to scale the level
    to SrV, a decision that predates this run; that it covers the trigger of this run is a call of the designer, pending the
    owner's confirmation (ADR-0210, Decision 5; by design a trigger means the owner decides). The gate still compares the
    balance row sums with SrV. The second comparison (columns difference_20_29_in_srv_se, beyond_two_se_20_29) moved on its balance
    side: balance_students_20_29_persons now uses the MiD share of the ages 20 to 29 (age_share_20_29_among_adult_students
    0.8408838729) instead of the SrV share (0.898307, the ratio of balance_students_20_29_persons to balance_students_persons in
    the 2026-11-26 file). Pooled row 03ZGB difference_20_29_in_srv_se -4.989373 (2026-11-26) to -5.997433 (this run); row 03101
    -2.250166 to -3.268816. The balance row sum falls by 1.84 % (26628.31803 to 26137.33675), the age share by 6.39 %, together
    balance_students_20_29_persons falls by 8.12 % at the pooled row (23920.41769 to 21978.46496), so the share accounts for most
    of the shift.
- metric: omega = 1 - Z / S in one year (census year)
  reference: Zensus 2022 pupils and students without paid work aged 20 to 29 (Z), balance of the census-year semester (S)
  result: >-
    Read from the header line '# omega=' of eqasim-data/data/braunschweig/popsim/student_level_table.csv. omega=0.5348793385;
    Z=12226.80196 (zensus_students_nonemployed_persons=12930 times mid_students_to_pupils_and_students_ratio=0.9456150007);
    S=26287.37653 (students_living_census_year_persons=31261.60148 under the enrollment of WS 2022/23 times
    age_share_20_29_among_adult_students=0.8408838729); level_total_persons=28761.7772 (the same eight Kreise under the
    enrollment of WS 2025/26). Both semesters are named in the header (enrollment_semester=WS_2025/26,
    census_year_semester=WS_2022/23).
- metric: age and sex shares of the level
  reference: MiD 2023 adult students by main activity, Germany (area DE)
  result: >-
    Read from the header line '# Age and sex (A9)' of student_level_table.csv, source
    eqasim-data/data/braunschweig/mid/mid2023_student_age_sex.csv (rows of area DE, column share_of_adult_students; the same
    joint mix in every Kreis). Age shares of the cells: age_share_18_19=0.09022380062, age_share_20_24=0.62426711,
    age_share_25_29=0.2166167629, age_share_30plus=0.06889232645.
- metric: students aged 20 to 29 of the census year, the stated uncertainty of the level
  reference: school-corrected SrV count and census extrapolation of docs/runs/artifacts/student-balance-2026-11-26/level_decision/student_level_estimates_20_29.csv
  result: >-
    Level value: docs/runs/artifacts/student-balance-2026-11-27/student_level_gate.csv, column
    level_census_year_students_20_29_persons (the level of the census year under the enrollment of WS 2022/23 and the MiD share
    of the ages 20 to 29). Row 03101: level 11425.7584; srv_school_corrected_students_20_29_persons 12767.34043;
    census_extrapolation_students_20_29_persons 13312.15528; census_extrapolation_ws2022_23_students_20_29_persons
    13682.01446. Row 03ZGB (seven surveyed Kreise): level 24071.34865; srv_school_corrected_students_20_29_persons 26766.98267;
    census_extrapolation_students_20_29_persons 28045.53711; census_extrapolation_ws2022_23_students_20_29_persons 28824.7422.
    Difference of the level to each count in percent, computed as (level - count) / count * 100: row 03101 against the
    school-corrected SrV count -10.507920873227624, against census_extrapolation_students_20_29_persons -14.1704843454921,
    against census_extrapolation_ws2022_23_students_20_29_persons -16.490671505985237; row 03ZGB against the school-corrected SrV
    count -10.070742949377047, against census_extrapolation_students_20_29_persons -14.170484396189199, against
    census_extrapolation_ws2022_23_students_20_29_persons -16.49067151067183. The two census-extrapolation columns of the
    2026-11-26 file differ in the national ratio (enrolled students aged 20 to 29 in Germany over the census count for Germany)
    that scales the Kreis census count: census_extrapolation_students_20_29_persons uses the ratio of the census-day semester
    (SS 2022), census_extrapolation_ws2022_23_students_20_29_persons that of WS 2022/23 (header of the 2026-11-26 file). The
    level of the census year is built under the enrollment of WS 2022/23 (census_year_semester), so the WS 2022/23 column is the
    like-for-like comparison (-16.49 %); the SS 2022 column (-14.17 %) is reported next to it. The Braunschweig row and the pooled
    row give the same ratio to each census extrapolation by construction (level and extrapolation are both proportional to the
    census count of the Kreis), so they are one ratio, not two independent checks; only the comparison with the school-corrected
    SrV count differs between the rows. These differences are the stated uncertainty of the level.
- metric: 'calibration check (stage weights, stage weights and movers): total variation distance to the SrV destination reference'
  reference: SrV 2023 destination reference (survey aggregate; sampling noise is the noise floor)
  result: >-
    Read from docs/runs/artifacts/student-balance-2026-11-27/calibration_check/student_commuter_weight_calibration.csv, lines
    '# Stage weights:' and '# Stage weights_and_movers:' (the check ran with the enrollment of WS 2025/26). Stage weights: optimum
    short=1 middle=1 long=0.85 mover_share=0; objective_tvd=0.1572448396; noise_floor_tvd_95=0.2225188096; decided=False. Stage
    weights_and_movers: optimum short=1 middle=0.95 long=0.65 mover_share=0.1; objective_tvd=0.1521655978; decided=False. In both
    stages the ranges within the noise floor span most of the interval (key ranges= of the same lines). The calibration wrote no
    configuration value; the weights stay the owner's assumption of 2026-11-26.
issues:
- '#140'
- '#279'
decisions:
- ADR-0210
notes: >-
  Limitations. (a) Every Kreis gets the same age and sex mix (the national MiD cells); the rows regiostar7_* of
  eqasim-data/data/braunschweig/mid/mid2023_student_age_sex.csv show that the mix differs by RegioStaR 7 type, so those rows are
  the evidence of the direction of what the same mix leaves out. (b) The sex share is a national survey share (MiD); official
  enrollment by sex per site is not used. (c) Two institutions (Hochschule Magdeburg-Stendal, Hochschule Harz) are at WS 2024/25,
  their last published winter semester (fallback 2/3 of the institutions outside LSN). (d) The two gate triggers still compare
  the balance row sums with SrV, not the level; the level is not scaled to SrV (owner decision of 2026-11-27). (e) The level
  counts students by the Kreis they live in under the census split (assumptions A18 and A19); its uncertainty is the difference
  in the validation entry above. (f) A table build and a calibration check on survey aggregates, not a validation; the tables
  count heads, no day factor is applied. (g) The yardstick scores of the weights decision (weight_candidates.csv under
  docs/runs/artifacts/student-balance-2026-11-26/weights_decision) are of the run of 2026-11-26 (enrollment WS 2024/25, record student-balance-2026-11-26) and were not re-scored under the enrollment
  of WS 2025/26. Decisions: ADR-0210.
source: >-
  scripts/build_student_balance.py over the inputs under pipeline.notes; outputs committed under eqasim-data/data/braunschweig/schools,
  eqasim-data/data/braunschweig/popsim and docs/runs/artifacts/student-balance-2026-11-27/.
