    Iteration 0, defaults / today: car 0.5251 / 0.5244, car_passenger 0.1277 / 0.1280, walk 0.1467 / 0.1463, bicycle
    0.0830 / 0.0839, pt 0.0603 / 0.0601, outside 0.0439 / 0.0439, truck 0.0133 / 0.0133. Iteration 5, defaults / today:
    car 0.5230 / 0.5221, car_passenger 0.1258 / 0.1264, walk 0.1472 / 0.1469, bicycle 0.0849 / 0.0858, pt 0.0618 /
    0.0615, outside 0.0439 / 0.0439, truck 0.0133 / 0.0133. Every difference between the arms is below 0.001 (0.1
