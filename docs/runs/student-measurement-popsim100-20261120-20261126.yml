sampling:
  rate: 1.0
  scope: >-
    the cached full population of run popsim100_20261120 (the full model area, ZGB-8). The SrV side covers the seven
    surveyed Kreise (the ZGB-8 without Wolfsburg 03103); Wolfsburg is reported model-only with NaN SrV columns.
  notes: >-
    Universes. Shares of attributes and of the day are over PRESENT persons: SrV adult students at home at some point
    of the reporting day against model adult students whose day_absence_state is present. The away-all-day share is
    over ALL persons: all model adult students against all SrV adult students before the universe filter. Student
    counts: the SrV count srv_students_weighted_persons of student_level_by_kreis.csv counts only the SrV adult students
    at home at some point of the reporting day (the participation universe; on the 03ZGB row it equals the weight_sum of
    row day,away_all_day,students_all,no of eqasim-data/data/braunschweig/srv/srv2023_student_parameters.csv), so it
    leaves out the SrV students away all day (added back in Phase 2, design A11). Its like-for-like model count is
    model_present_students_adults (present model adult students), not model_students_expanded_persons (all model adult
    students). Students are SrV V_ERW 7 and model P_TAET 10; adults are 18 and older. Model counts are sample counts at
    sampling_rate 1.0, unweighted; SrV shares are weighted with GEWICHT_P_ZENSUS.
