decisions: []
notes: >-
  Small cells are shown with their number of respondents (n_unweighted, srv_n_unweighted), not pooled (owner decision,
  2026-11-26); a reader judges a cell by that number and its standard error, srv_cell_ok marks the cells with at least
  the respondent minimum of the control rule. Wolfsburg rule: Wolfsburg (03103) is not surveyed by SrV, its rows are
  model-only with NaN SrV columns. Universes: shares over present persons on both sides, the away-all-day share over
  all persons; the SrV student count covers only the students at home on the reporting day, so it is set beside the
  present model students (see sampling.notes). The other_adults_all rows of the behaviour table are SrV-only by
  design (the model side is empty there). The work-class table has one row: all adult students fall in the
  not-employed class. By definition the class comes from employment_status (the class of the work control), not from a
  work trip on the day. An SrV standard error
  of 0 gives a NaN difference_in_se and an NA beyond_two_se. This is a measurement on a cached population, not a
  validation; the SrV aggregates are a survey, not ground truth, and no target value is stated here.
