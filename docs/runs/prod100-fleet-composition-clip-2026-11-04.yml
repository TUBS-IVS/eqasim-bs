notes: >-
  Cost of landing the change. The edit of fleet_sampling_de.py changes the structured token of exactly two stages,
  braunschweig.synthesis.incommuters and braunschweig.synthesis.student_incommuters (static audit,
  scripts/audit_synpp_helper_hash.py: their tokens cover that module). In the run prod100_20261031 they took about 32.5 and
  8 min (read from the log of prod100_20261031); if their output digests stay equal the early cutoff spares their
  descendants, which is NOT measured here. The household stage (braunschweig.synthesis.vehicles.cars.household) does not
  hash its helpers, so it does NOT re-execute: the new residents log line appears only when that stage next runs for
  another reason (49 min in that log); this replay is the way to get the figures without that run. Whether the next run
  re-executes the household stage anyway is not predicted by this manifest. The September production run logged 44,357
  clipped cars for a different population draw; it was not replayed.
