id: prod100-fleet-composition-clip-2026-11-04
date: '2026-11-04'
repository:
  commit: 7a41f0ba57bb9abdb862c59bcc14c73653e8510a
  branch: origin/main (the detached worktree of the production run)
  notes: >-
    The code the 100 % production run prod100_20261031 ran (felix:~/prod100_20261031/eqasim-bs, a clean detached
    worktree of origin/main), used READ ONLY and unmodified for the baseline replay. The "after" replay swapped in ONE
    file, braunschweig/synthesis/vehicles/fleet_sampling_de.py of branch fix/c5a-composition-clip-residual (the
    committed blob, LF line endings, sha256 c02fba7aac28abc867e6d92781b8586f616f66d02ce0a270e0e944d8b45f1442) and
    nothing else.
    The two fleet modules have no commit between 7a41f0ba and the base of that branch (6ef8f99c), so the swapped file
