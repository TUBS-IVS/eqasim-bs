## Student measurement on run popsim100_20261120 (issue #140, Phase 1 of the student layer): runs only the
## analysis stage braunschweig.analysis.synthesis.students_vs_srv on the cached population of that run.
## Derived from docs/runs/artifacts/popsim-full-rerun-20261120/run_overlay_source.yml with only the run list
## changed (pattern: run_overlay_incommuters.yml of the same run). Code: the run commit plus the new stage and
## its modules (measurement ref, see the run manifest).
working_directory: ../cache

run:
  - braunschweig.analysis.synthesis.students_vs_srv

config:
  sampling_rate: 1.0
  output_path: ../output
  analysis_working_directory: ../cache
  output_prefix: braunschweig_100pct_popsim20261120_
  matsim_last_iteration: 0
  braunschweig.population.popsim.work_dir: ../popsim_work
  braunschweig.population.popsim.max_cells: 750
  braunschweig.population.popsim.num_workers: "auto"
  cache_share_enabled: false
  cache_share_export: false
  cache_share_recompute: []
  braunschweig.chainsolvers.processes: 16
