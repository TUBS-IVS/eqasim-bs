## Full PopulationSim rerun 2026-11-20 on main 1041849c (issue #648, WP5): PopulationSim and the synthesis
## up to finished persons (synthesis.output), plus the existing synthesis analyses. No MATSim (owner, 2026-11-20).
## Derived from configs/overlays/test_100pct.yml of the run commit with only these changes:
##   run list without matsim.output and the MATSim-based analyses; output_path / popsim work_dir /
##   analysis_working_directory inside the run directory (isolated_run.py layout); output_prefix of this run;
##   cache_share off (isolated run); braunschweig.chainsolvers.processes 16 (as prod100_20261031, OOM guard).
working_directory: ../cache

run:
  - synthesis.output
  - braunschweig.analysis.synthesis.plan_structure_vs_srv
  - braunschweig.analysis.synthesis.departure_time_vs_srv
  - braunschweig.analysis.synthesis.commute_distance_by_kreis
  - braunschweig.analysis.synthesis.work_participation_by_kreis

config:
  sampling_rate: 1.0
  output_path: ../output
  analysis_working_directory: ../cache
  output_prefix: braunschweig_100pct_popsim20261120_
  matsim_last_iteration: 0
  braunschweig.population.popsim.work_dir: ../popsim_work
  braunschweig.population.popsim.max_cells: 750
  braunschweig.population.popsim.num_workers: "auto"
  cache_share_enabled: false
  cache_share_export: false
  cache_share_recompute: []
  braunschweig.chainsolvers.processes: 16
