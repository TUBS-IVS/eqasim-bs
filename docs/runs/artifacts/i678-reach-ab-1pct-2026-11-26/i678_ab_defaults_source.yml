## Source overlay of the #678 1 % comparison, arm "defaults": the branch defaults of the reach keys (no overrides).
working_directory: ../cache
run:
- matsim.output
config:
  sampling_rate: 0.01
  output_path: ../output
  analysis_working_directory: ../cache
  output_prefix: braunschweig_1pct_i678_
  matsim_last_iteration: 5
  matsim_threads: 16
  braunschweig.population.popsim.work_dir: ../popsim_work
  braunschweig.population.popsim.max_cells: 750
  braunschweig.population.popsim.num_workers: 4
  braunschweig.chainsolvers.processes: 8
  cache_share_enabled: false
  cache_share_export: false
  cache_share_recompute: []
