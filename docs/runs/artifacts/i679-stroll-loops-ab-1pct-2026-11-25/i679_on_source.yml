## Issue #679 task C7, arm ON: 1 % synthesis at eqasim-bs 66da6ee0 with the loop placement switched on.
## Step 2 adds matsim.output (prepare, RunPreparation, 5 MATSim iterations); run targets do not enter stage hashes.
## Derived from configs/overlays/test_1pct.yml; differs from the ON arm only in secondary_loop_zero_displacement.
working_directory: ../cache
run:
  - synthesis.output
  - braunschweig.matsim.scenario.facilities
  - matsim.output
config:
  sampling_rate: 0.01
  output_path: ../output
  analysis_working_directory: ../cache
  output_prefix: braunschweig_1pct_i679_
  matsim_last_iteration: 5
  braunschweig.population.popsim.work_dir: ../popsim_work
  braunschweig.population.popsim.max_cells: 750
  braunschweig.population.popsim.num_workers: 4
  braunschweig.chainsolvers.processes: 8
  cache_share_enabled: false
  cache_share_export: false
  cache_share_recompute: []
  secondary_loop_zero_displacement: true
