## A1 comparison at ONE code state (issue #140, Phase 3, ADR-0211): runs only the stage braunschweig.popsim.completed_donor
## with the student donor key ON, on the cached upstream stages of run popsim100_20261120 (read-only driver);
## derived from popsim100_20261120_source.yml (docs/runs/popsim-full-rerun-20261120.yml): run list changed, the key set.
working_directory: ../cache

run:
  - braunschweig.popsim.completed_donor

config:
  sampling_rate: 1.0
  output_path: ../output
  analysis_working_directory: ../cache
  output_prefix: braunschweig_100pct_popsim20261120_
  matsim_last_iteration: 0
  braunschweig.population.popsim.work_dir: ../popsim_work
  braunschweig.population.popsim.max_cells: 750
  braunschweig.population.popsim.num_workers: "auto"
  braunschweig.population.popsim.donor_match_student_status: true
  cache_share_enabled: false
  cache_share_export: false
  cache_share_recompute: []
  braunschweig.chainsolvers.processes: 16
