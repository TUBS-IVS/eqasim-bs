## One-batch smoke of the student synthesis bundle (issue #140, Phase 3, ADR-0211): runs ONLY the PopulationSim stage
## braunschweig.popsim.stage up to the written batch folders (assemble_batches_only: the stage stops with
## AssembleBatchesOnlyStop before PopulationSim), on the cached upstream stages of run popsim100_20261120.
## Derived from popsim100_20261120_source.yml (docs/runs/popsim-full-rerun-20261120.yml) with only the run list
## changed and the smoke key added; every model value is that run's, the code is the branch head.
working_directory: ../cache

run:
  - braunschweig.popsim.stage

config:
  sampling_rate: 1.0
  output_path: ../output
  analysis_working_directory: ../cache
  output_prefix: braunschweig_100pct_popsim20261120_
  matsim_last_iteration: 0
  braunschweig.population.popsim.work_dir: ../popsim_work
  braunschweig.population.popsim.max_cells: 750
  braunschweig.population.popsim.num_workers: "auto"
  braunschweig.population.popsim.assemble_batches_only: true
  cache_share_enabled: false
  cache_share_export: false
  cache_share_recompute: []
  braunschweig.chainsolvers.processes: 16
