- felix:~/i138_ladder/arm0a, arm0b (batch folders with outputs and logs; checkpoint stores of about 8.1 and 9.8 GB per arm deleted after the diagnostics)
- felix:~/i138_ladder/populationsim_master (the arm-0b PopulationSim checkout and its virtual environment)
issues:
- '#138'
- '#645'
- '#646'
notes: >-
  Decision input, stated without a recommendation: by the design's fallback rule the fork is based on tag v0.10.0
  if arm 0b misses G3 against arm 0a OR falls back more often. G3 is met; "falls back more often" holds for batch_032
  (12 against 11 non-simultaneous ZENSUS100m parents of 26) but not for batch_000 (14 against 15) or for both batches
  together (26 against 26). A second finding for that decision: upstream master's uv.lock installs numpy 2.4.6 for
  Python >= 3.11, whose wheels need x86-64-v2 CPU features that the run server does not report, so numpy refuses to
  import there; only the lock's Python 3.10 branch (numpy 2.2.6) runs, and the shared uv (0.11.21) is older than
  the uv >= 0.13.4 upstream master requires. Checkpoint stores written by arm 0b need numpy 2 to be read. Against
  the scratch probes: the design's "households with 6 or more persons +4 % before rounding, -47 % after" (one
  batch_000 probe variant) is +4.3 % / -48.9 % in arm 0a here (integer 24 of target 47); the probe's G4 "up to
  0.51" is 0.532 (0a) and 0.511 (0b) here.
