- docs/runs/artifacts/popsim-ladder-baseline-2026-11-16/arm_0b/popsim_batch_diagnostics.md
- docs/runs/artifacts/popsim-ladder-baseline-2026-11-16/arm_0b/misfit_split.csv
- docs/runs/artifacts/popsim-ladder-baseline-2026-11-16/arm_0b/rounding_shift.csv
- docs/runs/artifacts/popsim-ladder-baseline-2026-11-16/scripts/run_arm.sh
- docs/runs/artifacts/popsim-ladder-baseline-2026-11-16/scripts/run_diag_v2.sh
- docs/runs/artifacts/popsim-ladder-baseline-2026-11-16/scripts/compare_ladder.py
