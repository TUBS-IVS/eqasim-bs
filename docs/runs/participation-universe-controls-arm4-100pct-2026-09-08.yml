notes: 'HOW TO READ THIS MANIFEST. (1) Every row is judged on the universe named in its reference
  field. The control TARGETS the at-home-or-mobile universe (at_home_only) while the analysis stage
  MEASURES the model on its primary universe (at_home_zero, which counts away-from-home persons as
  zero-trip); the two are about 3.4 pp apart for the employed segment, so a row judged against the
  wrong denominator would read as a hit or a miss that never happened. On the at_home_only universe
  the three controlled segments land within 1 pp: employed work -0.97, education 6-17 +0.89,
  education 0-5 +0.77. (2) CONVERGENCE IS NOT VALIDATION. These controls were RAKED to the
  committed targets, so agreement with them is convergence, not independent agreement with
  reality; the at_home_zero comparison is the closest thing here to an independent check and
  there the model overshoots by 2.4 to 3.0 pp for exactly the universe reason in (1). (3) Two
  reference values in the pre-registered table moved with decision Q5 (apprentices, SrV V_ERW 8,
  entered the employed set), so arm-3 and arm-4 delta_pp columns are not comparable for
  group_employed and group_school_age_6_17_not_employed -- only the model columns are, and this
  manifest compares models across arms and deltas within an arm. (4) Row 4''s two rates sit on
  different denominators and the entry says so. (5) The one NOT MET row has a mechanism, not a
  tuning problem: the controlled cell is nonemployed_work over all persons 14+, and age
  composition inside it is unconstrained.'
source: 'Arm 4 (arm 3 plus the participation-universe controls = the base_bs.yml default state) of
  the pre-registered A/B ladder, run at 100 % on a hardlink copy of the arm-3 cache from a detached
  worktree at the pushed commit 30cde0a1, measured by
  braunschweig.analysis.synthesis.plan_structure_vs_srv and
  braunschweig.analysis.synthesis.work_participation_by_kreis against the committed SrV references
  (issues #368, #374; design of 2026-09-07 section 2.6)'
