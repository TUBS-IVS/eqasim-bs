issues:
- '#465'
decisions:
- ADR-0169
notes: >-
  What this run is evidence for: in a 1 % continuation from equilibrated plans, spreading the car access of the work
  and university sites over their parking lots (with one high-capacity link for the other large sites and departing
  vehicles yielding to traffic) removes the site-caused queues, including the one behind person 693334, while the car
  time stays within the +2 % limit (car legs -3.5 %; car trips door to door, with the longer walks, +1.0 % in total and
  -0.6 % per trip). What it does not show: (1) no validation (no observed counts, delays or
  mode shares compared); (2) one draw per arm at 1 %, where a site holds few persons and an access group's share is
  coarse; (3) no 100 % run with the rule; (4) the rise of the car share at the large work sites (54.9 % -> 67.7 %) is a
  simulated reaction that needs a check against observed commute mode shares before it is relied on.
