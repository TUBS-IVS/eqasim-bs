notes: >-
  What this run is evidence for: the direction of the indicators at a 1 % sample, with one draw per arm. With the mode
  flag on (arm2 against arm1, same code, same persons and donors, same seed), the walk trips over 5 km in frozen
  tours fall from 168 to 63, the bicycle trips over 30 km from 47 to 1, the frozen trips over 3 h from 293 to 164, the
  non-monotonic frozen plan ends from 30 to 22 plans, the residents stuck at the end of the day in frozen tours from 78
  to 66 and all stuck residents from 116 to 104; the in-region metrics do not change between these arms. Between arm0
  and arm1 (the merged code with the flag off, chiefly the 30 h plan-time bound by decision) the plans with an activity
  end after the day fall (frozen 15 -> 4, in region 47 -> 1), the stuck residents fall from 153 to 116 (mostly in region
  at the end of the day, 51 -> 17, and the group none, 57 -> 3), while the in-region stuck during the day (11 -> 17),
  the in-region walk trips over 5 km (47 -> 65) and the frozen trips over 3 h (261 -> 293) rise. What it does not
  show: (1) no validation of any kind; no observed reference was compared, the thresholds of the plan check and the
  min_share of the rule are assumptions, and the stabilised mode shares are convergence, not agreement with
  observed behaviour; (2) one random seed and one draw per arm, so differences of a few agents or trips are not
  distinguishable from run-to-run variation, which was not estimated; (3) a 1 % equilibrium is not the 100 %
  equilibrium on which the findings of ADR-0145 and ADR-0146 were made (prod100_20260925), and the 1 % counts are
  not expanded; (4) arm1 and arm2 reused the popsim, mid_donor and completed_donor results of arm0 through a token
  patch (static call-site proof, no empirical equality test), see the pipeline notes; (5) the analysis suite, its
  stuck sub-analysis and the dashboard did not run in any arm (OOM, targets dropped), the stuck metrics come from
  the committed stuck_agents module called by ab_metrics_i453.py. Open findings, recorded and not treated as
