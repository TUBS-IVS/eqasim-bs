configuration:
  base: configs/base_bs.yml
  overlays:
  - docs/runs/artifacts/i453-i443-ab-1pct-2026-10-16/i453_arm0.yml
  - docs/runs/artifacts/i453-i443-ab-1pct-2026-10-16/i453_arm1.yml
  - docs/runs/artifacts/i453-i443-ab-1pct-2026-10-16/i453_arm2.yml
  notes: >-
    Throwaway server overlays (committed here as artifacts, not as configs/overlays), derived from
    configs/overlays/test_1pct.yml. Per arm: own working directory (cache_arm0 for arm0, cache_arms12 for arm1 and
    arm2), own output directory output_arm{0,1,2} and own output prefix braunschweig_1pct_i453_arm{0,1,2}_,
    sampling_rate 0.01, matsim_last_iteration 100 (MATSim iterates until the eqasim mode-share termination criterion
    or 100 iterations), braunschweig.population.popsim.max_cells 750, num_workers 1 (a resource budget next to
    another session's run, not a model parameter), a physical copy of the popsim work directory
    (~/wt-i453-ab/popsim_work, because a shared work directory would purge another session's batches on a signature
    mismatch), cache_share_enabled false. run targets are synthesis.output and matsim.output only (the analysis
    targets were dropped, see the pipeline notes). The arms differ in code (arm0 versus arm1/arm2) and, between arm1
    and arm2, ONLY in braunschweig.outside_tour_modes.enabled (false, true). The plan check of the prepare stage ran
    with the base values of braunschweig.plan_check (walk 5,000 m, bicycle 30,000 m, leg duration 10,800 s,
    max_frozen_defect_share 0.005, fail_on_threshold false); arm0's code has no plan check, so for arm0 the same
    thresholds were applied afterwards by ab_metrics_i453.py to its written population.
sampling:
  rate: 1% (sampling_rate 0.01)
  scope: ZGB-8, full region, cordon on (base configuration)
  notes: >-
    Every count is a sample count at sampling_rate 0.01, never expanded. Residents in the MATSim output: 12,046
    (arm0), 12,041 (arm1), 12,041 (arm2); freight agents 521 in every arm. The resident count of arm0 differs by 5
    from arms 1 and 2; the difference was not decomposed here. The synthesis stage of the mode feature worked on 9,563
    persons and 34,861 legs (arm2 stage report). All metrics are taken from the FINAL iteration of each arm (iteration
    79 for arm0, 84 for arm1 and arm2) or from the prepared input population of that arm; the arms therefore compare
    final iterations of different length.
pipeline:
  targets:
  - synthesis.output
  - matsim.output
  notes: >-
    Recomputed stages of the FINAL launch of each arm (lists in devalidated_arm{0,1,2}.txt, read from synpp's
    "Devalidating N stages" block by launch_guarded.sh): arm0 4 stages (output_day, prepare, matsim.simulation.run,
    matsim.output; it follows launch 2, whose 45 stages included popsim, the locations, population and facilities and
    were cached before the out-of-memory kill; the list of the 45 is not committed), arm1 28 stages, arm2 22 stages.
    Cache procedure: cache_arm0 is a physical copy (cp -a, 21 GB) of ~/eqasim-bs/eqasim-data/cache_bs_1pct_allfeat_popsim.
    A hash pre-check found no felix cache holding a 1 % popsim for the configuration of main, so popsim ran once in
    arm0 (launch 2, 17:02 server time). Launch 1 of arm0 (17:01) was killed by the guard of launch_guarded.sh because
    mid_donor, completed_donor and home_office_donors_stage would recompute (main's own code changes since the copied
    cache); they were allowed and launch 2 started with 45 stages. Launch 2 was OOM-killed at 18:11 (58 GB anonymous
    RSS) inside braunschweig.analysis.analysis_suite, next to another session's 25 % MATSim run (the same place as the
    portal A/B of 2026-10-09). The analysis targets were removed from all three overlays (targets do not enter stage
    hashes), the final launch of arm0 started at 18:14 with 4 stages. As a consequence the analysis suite, its stuck
    sub-analysis and the dashboard did not run in any arm; every metric of this manifest comes from
    ab_metrics_i453.py, which calls the committed braunschweig.analysis.stuck_agents.stuck_summary and
    braunschweig.matsim.simulation.plan_check.summarise with the arms12 code on all three arms. METHODOLOGICAL CHOICE
    the reader must see: arm1 and arm2 did NOT recompute popsim, mid_donor and completed_donor. cache_arms12 is a
    physical copy of cache_arm0 after arm0 finished. token_diff.py (arms12 code, arm1 overlay) found six stages whose
    stored validation token differs (mid_donor, completed_donor, distance_distributions, popsim.stage, trips_stage,
    home_office_donors_stage). Only the stored tokens of mid_donor, completed_donor and popsim.stage were patched in
    cache_arms12/pipeline.json (backup pipeline.json.before_token_patch); distance_distributions, trips_stage and
    home_office_donors_stage recompute. The justification is a static call-site proof recorded in the controller's
    ledger and not an empirical equality test: PlanValidator, build_validated_trip_table, impute_chain_times,
    resample_chains and apply_departure_time_model are called only from braunschweig/popsim/trips_stage.py (including
    the sources.*.build_trips reached through trips_stage), braunschweig/synthesis/commute_day/donor_pool.py and
    plan_replacement.py, while mid_donor, completed_donor and popsim.stage list plan_validation only in their token
    closures; per the ledger the 30 h constant is read only by trips_stage, departure_time_model, plan_check and
    stuck_agents. The persons and donor tables of arm1 and arm2 are
    therefore the products of the arm0 code (ec825087); arm1 differs from arm0 in everything downstream of
    trips_stage and in the merged code of #455 to #457 with the mode flag off. Arm1 launch 1 (about 20:01) was killed by the guard
    (the trips cascade commute_distance, absence_stage, synthesis.population.activities) and relaunched with them
