classification:
- calibration
status:
  execution: completed
  notes: >-
    A table build on published aggregates, not a validation. The weights and the mover share are the owner's of 2026-11-26;
    the origin pattern of the art academy is an ASSUMPTION of the owner of 2026-11-27 (ADR-0210).
validation:
- metric: 'calibration check with the rule (stage weights, stage weights and movers): total variation distance to the SrV destination reference'
  reference: SrV 2023 destination reference; the calibration check of run student-balance-2026-11-27 (without the rule)
  result: >-
    Read from the header lines 'Stage ...' of calibration_check/student_commuter_weight_calibration.csv of both runs. Both
    stages stay undecided (decided=False) with unchanged ranges (weights: short 0.05 to 1, middle 0 to 1, long 0 to 1; weights
    and movers: the same plus mover_share 0 to 1) and the unchanged noise floor noise_floor_tvd_95=0.2225188096. Stage weights:
    optimum short=1 middle=1 long=0.85, objective_tvd 0.1572448396 (without the rule) -> short=1 middle=1 long=0.8,
    objective_tvd 0.1524691863 (with it). Stage weights_and_movers: optimum short=1 middle=0.95 long=0.65 mover_share=0.1,
    objective_tvd 0.1521655978 -> short=1 middle=0.9 long=0.65 mover_share=0.1, objective_tvd 0.1495142568. Each optimum moves
    by one grid step (0.05) in one weight and stays inside the earlier ranges. The weights 1 / 1 / 0.3 and the mover share 0.4
    at 03158 stay the owner's assumption of 2026-11-26, set before this rule; they were not changed.
- metric: weights decision aid with and without the rule (option C = the owner's weights 1 / 1 / 0.3, mover share 0.4 at 03158)
  reference: the pooled SrV yardsticks of the aid of 2026-11-26 (approximate standard errors, an ASSUMPTION of the aid)
  result: >-
    Read from weights_decision/weight_candidates_proxy_off.csv and weight_candidates_proxy_on.csv (row label
    option_c_lead_recommendation; both under the enrollment of WS 2025/26, so the off file is the like-for-like baseline, not
    the aid of 2026-11-26, which used WS 2024/25). sum_squared_z_yardsticks 5.989425 (off) -> 6.133348 (on); objective_tvd
    0.146211 -> 0.143344; z_distance_50_km_or_more 1.373614 -> 1.369747; z_bs_study_in_bs -0.098051 -> -0.159294;
    level_difference_in_srv_se_03ZGB -2.126828 -> -2.191823 (the same values as the gate rows of the two runs). Option C ranks
    third of the 22 candidates by sum_squared_z_yardsticks in both files (the lowest is c_short_0.9_middle_0.9 in both) and
    lies below options A and B on sum_squared_z_yardsticks in both files. The copy of the aid passes the balance rows as the
    two level arguments that gate_table gained after the aid was written; the columns the aid reads do not use them
    (docstring of the copy).
- metric: the art academy in T (student_od_table.csv, destination 'Hochsch. f. Bildende Künste Braunschweig | 03101000')
  reference: TU Braunschweig in the same table (the proxy); the art academy's rows of run student-balance-2026-11-27
  result: >-
    Before (blob of student_od_table.csv at a5e99557): 51 rows, Braunschweig row 03101 (local) 873 persons with origin 216
    (the CHE Kreis-view cell) and 657 movers; every other row 0 (7 region Kreise, 43 Kreise outside the region). After (this
    run, column students_persons): Braunschweig row 03101 622.93629 (origin 216, movers 406.93629); the seven other region
    Kreise 03102 22.12493307, 03103 32.40835267, 03151 29.20124612, 03153 16.77263499, 03154 14.38640014, 03157 27.68213457,
    03158 24.20239158 (sum 166.778093, rounded); the 43 Kreise outside the region 83.2856169 together (column
    in_commuters_persons of student_balance_by_site.csv; largest rows 03241 35.03941012, 03254 20.26401636, 03351 8.208256153,
    15085 5.349784406, 15083 2.211897851). Column sum 873 before and after. Share of the enrollment from outside the
    region: TU Braunschweig 0.095402, art academy 0.095402 after (0 before); the share per origin Kreis equals TU Braunschweig's
    within 1e-9 (pin test test_art_academy_takes_the_origin_pattern_of_tu_braunschweig_2026_11_27). The Diagnostics line
    (object origin_pattern_proxy) counts 50 proxy cells in both builds, origin persons 341.74192396930215 (model semester,
    enrollment 873) and 366.7951692545661 (census-year semester, enrollment 937), CHE total of TU Braunschweig 16809, and no
    proxy cell above the art academy's own CHE censoring bound; 250.06371003635516 students on the proxy rows of T, of which
    166.7780931389599 with home in the region.
- metric: art academy in the balance by site (student_balance_by_site.csv)
  reference: the same row of run student-balance-2026-11-27
  result: >-
    residents_region_persons 873 -> 789.7143831; in_commuters_persons 0 -> 83.2856169; censored_upper_bound_persons 4129 ->
    96.34213814 (the bounds are now TU Braunschweig's scaled bounds); censored_upper_bound_commuters_persons 657 (capped at
    enrollment minus the own-Kreis origin) -> 1.080472569 (no site capped; key censored_upper_bound_commuters_capped_sites of the
    Diagnostics line is empty). Every other site row and every row of student_balance_out_commuters.csv is unchanged; every row of
