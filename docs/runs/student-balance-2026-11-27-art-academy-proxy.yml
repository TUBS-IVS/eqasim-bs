id: student-balance-2026-11-27-art-academy-proxy
date: '2026-11-27'
repository:
  commit: '3b2704cb'
  branch: claude/i140-student-flows-fde844
  notes: >-
    Code state of every table and artifact of this run: 3b2704cb (written in each header). A first build at 352850b4
    (commit 53aa810c) had the same data rows; the rebuild at 3b2704cb changes only the header (the CHE cell counts now list the
    proxy cells under their own source, see pipeline.notes). The five tables, the run artifacts and this manifest are committed
    together; the sha256 values under pipeline.notes are those of the committed blobs (LF). This run supersedes the five tables of run
    student-balance-2026-11-27 (record docs/runs/student-balance-2026-11-27.yml), whose weights, mover share, inputs and level
    rule it keeps. The run directory, host and user are not recorded in tracked files.
configuration:
  base: configs/base_bs.yml
  notes: >-
    No model configuration. The settings of the build are CLI arguments; the one new argument is --origin-pattern-proxy
    (the art academy takes the origin pattern of TU Braunschweig, owner decision of 2026-11-27, ADR-0210 Decision 1 as
    amended). Its value and counts are in the Diagnostics line (object origin_pattern_proxy) of every table header.
sampling:
  rate: not applicable (head-count tables from published aggregates)
  scope: >-
    As in run student-balance-2026-11-27: study region ZGB (eight Kreise as homes), the 21 sites of 16 institutions of the
    choice set, CHE origins WS 2022/23 scaled to LSN enrollment WS 2025/26 (model semester) and, for omega, to WS 2022/23
    (census-year semester).
  notes: The table rules are in ADR-0210; the art academy rule is Decision 1, third bullet (amended 2026-11-27).
pipeline:
  targets:
  - scripts/build_student_balance.py
  notes: |-
    Command (local-only inputs are named by file name and sha256, never by path; the command of run student-balance-2026-11-27
    plus --origin-pattern-proxy, written to a scratch directory and copied back):
    python -X utf8 scripts/build_student_balance.py balance --sites lsn_university_sites.csv --sites-census-year lsn_university_sites_ws2022_23.csv --vg250 vg250-ew_12-31.utm32s.gpkg.ebenen.zip --zensus-students zensus2022_students_20_29_kreis.csv --zensus-employed zensus2022_employed_by_age_kreis.csv --weights 1,1,0.3 --mover-share 0.4 --mover-site-kreise 03158 --weights-source owner --origin-pattern-proxy "Hochsch. f. Bildende Künste Braunschweig=TU Braunschweig" --source-commit 3b2704cb --final --out-dir <scratch>/eqasim-data --artifact-dir <scratch>/artifacts
    python -X utf8 scripts/build_student_balance.py calibrate --sites lsn_university_sites.csv --vg250 vg250-ew_12-31.utm32s.gpkg.ebenen.zip --origin-pattern-proxy "Hochsch. f. Bildende Künste Braunschweig=TU Braunschweig" --source-commit 3b2704cb --out-dir docs/runs/artifacts/student-balance-2026-11-27-art-academy-proxy/calibration_check
    (the calibrate command of run student-balance-2026-11-27 plus --origin-pattern-proxy; grid defaults, mover_site_kreise default 03102,03103,03158)
    python -X utf8 docs/runs/artifacts/student-balance-2026-11-27-art-academy-proxy/weights_decision/analyse_weight_candidates.py --sites lsn_university_sites.csv --sites-census-year lsn_university_sites_ws2022_23.csv --vg250 vg250-ew_12-31.utm32s.gpkg.ebenen.zip --zensus-students zensus2022_students_20_29_kreis.csv --zensus-employed zensus2022_employed_by_age_kreis.csv --source-commit 3b2704cb --origin-pattern-proxy <value> --out docs/runs/artifacts/student-balance-2026-11-27-art-academy-proxy/weights_decision/weight_candidates_proxy_<on|off>.csv
    (run twice: <value> = the art academy pair above, output weight_candidates_proxy_on.csv, and none, output
    weight_candidates_proxy_off.csv; the script is a copy of the aid of 2026-11-26 with the three changes named in its docstring)
    The local-only inputs were checked against the sha256 values of run student-balance-2026-11-27 before the run (all five equal).
    Every input is listed with its sha256 in the Inputs lines of the table headers. One committed input differs from run
    student-balance-2026-11-27: eqasim-data/data/braunschweig/srv/srv2023_student_parameters.csv, sha256
    865f5d697a98e89951608b18203f7c3e57fd9d190a513765458343249919e459 (rewritten by commit 74ce7d46 of Phase 3). The build reads
    from it only the education-leg share and the away share of the day-factor line; both are unchanged
    (education_leg_share_control_definition=0.3705664224, away_all_day_share=0.1239264157 in the Day factor line of both runs).
    OFF check: the same command with --origin-pattern-proxy none reproduces the data rows of the five tables of run
    student-balance-2026-11-27 (test test_without_origin_pattern_proxy_the_balance_equals_the_tables_of_2026_11_27 in
    tests/test_student_balance_pins.py, data-gated, passed locally on 2026-11-27).
    Header of the rebuild at 3b2704cb: the object origin_cells of the Diagnostics line counts the cells the builder reads, so
    the 50 proxy cells of the art academy appear under source proxy_pattern (with their summed bound,
    proxy_pattern_upper_bound_persons) and censored_upper_bound_persons covers only the cells still censored. The data rows of
    the five tables and of the gate and pre-check artifacts are identical to those of commit 53aa810c (line-by-line comparison
    of every non-header line).
    Logs in the artifact directory: balance_logs.txt, calibration_check/calibration_logs.txt (local paths scrubbed to placeholders).
