  note: >-
    Evidence for secondary_loop_zero_displacement (both switches): the switch-off path is unchanged, the loop placement
    and the loop-free estimates run end to end through the facility check, RunPreparation, the initial mode choice and a
    short MATSim run, with the counts above. A wiring proof and an A/B of model output, not a validation.
    Arm D is the evidence for loop_trips_non_motorised: the rule is selected, keeps the caught trips the mode choice
    evaluates on foot or by bicycle and leaves only the trips of tours it does not re-choose with a motorised mode.
    Arm E is the evidence for the out-and-back split and for both rules together: the 103 out-and-back strolls are
    placed by the solver with a length, carry the attribute into the plans, and the trips into them stay on foot or
    by bicycle after the initial mode choice and after iteration 5; their ways home are free and 10 of 99 aligned
    ones are motorised.
