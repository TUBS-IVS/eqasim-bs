repository:
  commit: ff83decf83b61646dd02c638f76a6b6d8b179bd6
  branch: feature/i679-stroll-loops
  notes: >-
    The three arms (A, B, C) ran from 2026-11-25 to 2026-11-26 at eqasim-bs ff83decf, shipped to the run server as a git
    bundle (sha256 91d56e85df46692177dbb5865dbc6bc65f0cc44587684a92fd4fbda9b180bda2) and checked out as isolated runs
    (scripts/isolated_run.py, run directories i679_a, i679_b, i679_c). The branch head when arms A to C were first recorded was
    84a91698; the two commits after ff83decf (01628248 and 84a91698) change only scripts/validate_secondary_distances.py,
    scripts/calibrate_detour_circuity.py, their tests and one sentence of docs/codebase/notes/leisure-loops.md, so no
    stage the arms ran differs. The comparison script runs of this record used the code of 84a91698 (git archive of
    braunschweig/ and scripts/, sha256 50b78560b30619ec3ff63908b9b79faa61da02304304847947a9f340f0a5b400) against the arms'
    caches, without touching the arms' checkouts. Java: eqasim-java-bs cb7e81fa3851c1338cfd80921c9d55aaeef2e600
    (origin/main), shaded jar of the runtime stage md5 926f6dce5a4b309589830ec67cc2c60b (the same runtime stage in every
    arm; i679_provenance.txt). PopulationSim: fork release 0.10.0+bs.3 (the uv project environments/populationsim of
    ff83decf, synced with uv sync --frozen in the run worktree of arm C). SUPERSEDED LAUNCHES (kept as a record, their
    numbers are not used here): (1) 66da6ee0 (bundle sha256 4eaad1f6...): the switch-off arm i679_off completed (first
    launch exit 1 after 4 min because the run worktree had no PopulationSim environment; relaunched after uv sync, exit 0);
    the switch-on arm i679_on was stopped by hand during the preparation stage (its log has no exit line) because the
    whole-branch review found that the loop draw's random stream offset (loops.LOOP_SEED_OFFSET) equalled the SrV
    location-type draw's offset, so both draws read the same uniform sequence; fixed on the branch (own offset).
    (2) 0611505f (bundle sha256 255eb0a1...): the switch-off arm i679_off2 completed (exit 0) and is the identity
    reference for arm A; the switch-on arm i679_on2 crashed in the standalone initial mode choice of the preparation stage
    (NullPointerException in OutsideConstraint, DiscreteModeChoiceTrip.getInitialMode() null) and its JVM then idled until
    stopped by hand: the 521 injected freight agents have legs without a routing mode and were not excluded from the
    initial mode choice, a defect of main (not of the loop change; i679_on2_null_initial_mode_probe.json: every trip
    without a routing mode is a freight trip, none is a loop or resident trip); fixed by ff83decf ("Exclude injected
    freight from the standalone initial mode choice", cherry-picked from the #678 branch). The JVM idled because the
    progress thread of StandaloneModeChoicePerformer stays alive when a worker throws (i679_on2_prepare_jstack.txt).
    ARM D (2026-11-26): arm C plus the mode rule for same-facility leisure trips. Stage code: eqasim-bs 55d9b194
    (bundle sha256 1cdd1270e5018550b15fe057bd11ae5c87631a57eaed225a02a155423788e328) and eqasim-java-bs f8accd10c
    (branch feat/i679-same-facility-leisure-trips, NOT merged yet; it sits on eqasim-java-bs main ae6a10a1c, which
    since arm C's cb7e81fa also carries PR #65, the border-tour vehicle rule of #678; that rule is not selected in
    arm D's prepared config, whose tourConstraints are FromTripBased and VehicleContinuity as in arm C). Shaded jar
    md5 97776a08bbe5f2ac061a84536dbd0fbb (i679_provenance_d.txt). The branch head differs from 55d9b194 in
    braunschweig/matsim/config_modules.py by f98da12b (XML comments are ignored when the direct parameters of a
    config module are scanned; no change on the configs MATSim writes) and in records; between ff83decf and 55d9b194
    the stage code changed only in the prepare stage (braunschweig/matsim/simulation/prepare.py, loop_mode_rule.py,
    config_modules.py) and configs/base_bs.yml (the switch braunschweig.mode_choice.loop_trips_non_motorised, true).
    The run directory i679_d was set up at eqasim-bs 5b212d47 and eqasim-java-bs 7ad6ae72e; before any launch the
    Java worktree was moved by hand (git checkout of commits fetched from bundles into the run's own ref namespace)
    to 496d362cc and then f8accd10c, the commits the review of the Java rule produced. FAILED FIRST LAUNCH at
    5b212d47 (2026-11-26 08:47:35 to 09:11:19, exit 1): the prepare stage raised ValueError in loop_mode_rule.apply
    ("module 'DiscreteModeChoice' has parameter sets (<parameterset>); only flat modules can be compared",
    config_modules.read_module) after RunPreparation, the cut and the freight injection and BEFORE the initial mode
    choice, so no mode was chosen and no JVM stayed behind (i679_d_first_launch_failure_excerpt_log.txt); fixed by
    55d9b194, to which the eqasim-bs worktree was then moved by hand. Final launch 09:20:33 to 09:44:25, exit 0.
configuration:
  base: configs/base_bs.yml
  overlays:
  - docs/runs/artifacts/i679-stroll-loops-ab-1pct-2026-11-25/i679_a_run.yml
  - docs/runs/artifacts/i679-stroll-loops-ab-1pct-2026-11-25/i679_b_run.yml
  - docs/runs/artifacts/i679-stroll-loops-ab-1pct-2026-11-25/i679_c_run.yml
  - docs/runs/artifacts/i679-stroll-loops-ab-1pct-2026-11-25/i679_d_run.yml
  notes: >-
    Throwaway server overlays (committed as artifacts, together with the source overlays i679_{a,b,c}_ff83decf_source.yml
    they were written from), derived from configs/overlays/test_1pct.yml: sampling_rate 0.01, matsim_last_iteration 5,
    braunschweig.population.popsim.max_cells 750 and num_workers 4 (a resource choice on a shared server, not a model
    parameter), braunschweig.chainsolvers.processes 8, the shared cache store off, output_prefix braunschweig_1pct_i679_.
    The arms differ ONLY in the two switches of issue #679 (and in their run targets, which do not enter stage hashes):
    A secondary_loop_zero_displacement false and secondary_leisure_estimates_without_loops false; B true and false; C true
    and true (the production values of configs/base_bs.yml). random_seed is the base value in every arm (1234,
    configs/base_bs.yml). The run.yml files carry each launch's gate list of the stages allowed to recompute.
    Arm D uses the overlay of arm C unchanged in its config block (source i679_d_5b212d47_source.yml; its header
    names the code); the switch braunschweig.mode_choice.loop_trips_non_motorised comes from configs/base_bs.yml
    (true), so all three switches of issue #679 are at their production values. The prepare stage added
    SameFacilityLeisureNonMotorised to DiscreteModeChoice.tripConstraints of the prepared config
    (i679_d_loop_mode_rule_report.json). The run.yml of arm D was written for the first launch; its header still
    names the overlay source written before the code moved.
sampling:
  rate: 0.01
  scope: 'ZGB-8, full region, cordon on (base configuration)'
  notes: >-
    Every count is a sample count at sampling_rate 0.01, never expanded. All three arms share the population and the
    upstream trip table (trips.final identical between A, B and C; equality block of the metrics JSONs): 11,466 persons,
    9,571 of them with at least one trip, 34,466 trips. The MATSim population of arms A and C holds 12,667 persons
    (residents plus 599 in-commuters, 81 student in-commuters and 521 freight agents; i679_*_run_log_excerpt_log.txt).
pipeline:
  targets:
  - synthesis.output
  - braunschweig.matsim.scenario.facilities
  - matsim.simulation.prepare
  - matsim.output
  notes: >-
    Targets per arm: A synthesis.output, braunschweig.matsim.scenario.facilities and matsim.simulation.prepare
    (RunPreparation and the initial mode choice, no MATSim iteration); B synthesis.output and
    braunschweig.matsim.scenario.facilities; C synthesis.output, braunschweig.matsim.scenario.facilities and matsim.output
    (preparation and 5 MATSim iterations). Caches (always physical cp -a copies, never hard links): the chain started from
    the cache of popsim100_20261120; arm C was copied from the cache of i679_on2 (64,679,955,112 bytes), which descends
    from it; arms B and A were copied from arm C's cache after C had finished (65,987,971,436 bytes; i679_provenance.txt).
    Recomputed stages (the launch gate lists in the run.yml files; stage start times in i679_{a,b,c}_stage_starts.txt):
    C 40 stages, among them PopulationSim (braunschweig.popsim.stage started 23:57:04, the next stage 01:18:36), because
    main had moved to PopulationSim fork release 0.10.0+bs.3 (#677) since the cache; B 7 stages and A 9 stages, all
    downstream of the distance distributions stage, PopulationSim cached. The freight extraction was a cache hit in every
    arm. The MATSim run of C started 01:52:37 and matsim.output 02:03:11 (server clock, CET).
    Arm D: cache a cp -a copy of arm C's cache (65,987,971,436 bytes). First launch (5b212d47): re-executed the Java
    runtime stage (new Java source), the cut transit schedule, both in-commuter stages, the portal-trip stage,
    trips.final and the anchors, the households and vehicles of the MATSim scenario, the facilities stage, the
    outside-tour mode stage and its activities, synthesis.output, the population stage and the prepare stage
    (failed); the secondary location stage, the day activities and day locations and PopulationSim stayed cached
    (early cutoff after the portal-trip stages; i679_d_first_launch_stage_starts.txt). Final launch (55d9b194): the
    facilities stage and synthesis.output (run targets synpp re-executes), the prepare stage, the MATSim run
    (09:33:59) and matsim.output (09:44:23) (i679_d_stage_starts.txt).
