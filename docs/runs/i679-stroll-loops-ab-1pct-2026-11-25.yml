    caches, without touching the arms' checkouts. Java: eqasim-java-bs cb7e81fa3851c1338cfd80921c9d55aaeef2e600
    (origin/main), shaded jar of the runtime stage md5 926f6dce5a4b309589830ec67cc2c60b (the same runtime stage in every
    arm; i679_provenance.txt). PopulationSim: fork release 0.10.0+bs.3 (the uv project environments/populationsim of
    ff83decf, synced with uv sync --frozen in the run worktree of arm C). SUPERSEDED LAUNCHES (kept as a record, their
    numbers are not used here): (1) 66da6ee0 (bundle sha256 4eaad1f6...): the switch-off arm i679_off completed (first
    launch exit 1 after 4 min because the run worktree had no PopulationSim environment; relaunched after uv sync, exit 0);
    the switch-on arm i679_on was stopped by hand during the preparation stage (its log has no exit line) because the
    whole-branch review found that the loop draw's random stream offset (loops.LOOP_SEED_OFFSET) equalled the SrV
    location-type draw's offset, so both draws read the same uniform sequence; fixed on the branch (own offset).
    (2) 0611505f (bundle sha256 255eb0a1...): the switch-off arm i679_off2 completed (exit 0) and is the identity
    reference for arm A; the switch-on arm i679_on2 crashed in the standalone initial mode choice of the preparation stage
    (NullPointerException in OutsideConstraint, DiscreteModeChoiceTrip.getInitialMode() null) and its JVM then idled until
    stopped by hand: the 521 injected freight agents have legs without a routing mode and were not excluded from the
    initial mode choice, a defect of main (not of the loop change; i679_on2_null_initial_mode_probe.json: every trip
    without a routing mode is a freight trip, none is a loop or resident trip); fixed by ff83decf ("Exclude injected
    freight from the standalone initial mode choice", cherry-picked from the #678 branch). The JVM idled because the
    progress thread of StandaloneModeChoicePerformer stays alive when a worker throws (i679_on2_prepare_jstack.txt).
    ARM D (2026-11-26): arm C plus the mode rule for same-facility leisure trips. Stage code: eqasim-bs 55d9b194
    (bundle sha256 1cdd1270e5018550b15fe057bd11ae5c87631a57eaed225a02a155423788e328) and eqasim-java-bs f8accd10c
    (branch feat/i679-same-facility-leisure-trips, NOT merged yet). Stated by the operator, not checked in a
    committed artifact: f8accd10c sits on eqasim-java-bs main ae6a10a1c, which since arm C's cb7e81fa also carries
    PR #65, the border-tour vehicle rule of #678. That rule is not selected in arm D's prepared config: its
    tourConstraints are FromTripBased and VehicleContinuity as in arm C (i679_provenance_d.txt). Shaded jar md5
    97776a08bbe5f2ac061a84536dbd0fbb (i679_provenance_d.txt). The branch head differs from 55d9b194 in
    braunschweig/matsim/config_modules.py by f98da12b (XML comments are ignored when the direct parameters of a
    config module are scanned) and in records; that the edit of the real DiscreteModeChoice module is unchanged by
    it is pinned by tests/test_loop_mode_rule.py on the fixture tests/fixtures/dmc_module_real.xml, a copy of arm
    D's module (stated by the operator). Between ff83decf and 55d9b194 the stage code changed only in the prepare
    stage (braunschweig/matsim/simulation/prepare.py, loop_mode_rule.py, config_modules.py) and configs/base_bs.yml
    (the switch braunschweig.mode_choice.loop_trips_non_motorised, true). The run directory i679_d was set up at
    eqasim-bs 5b212d47 and eqasim-java-bs 7ad6ae72e (i679_provenance_d.txt); before any launch the Java worktree was
    moved by hand (git checkout of commits fetched from bundles into the run's own ref namespace) to 496d362cc and
    then f8accd10c, the commits the review of the Java rule produced. FAILED FIRST LAUNCH at 5b212d47 (2026-11-26
    08:47:35 to 09:11:19, exit 1; i679_provenance_d.txt): the prepare stage raised ValueError in
    loop_mode_rule.apply ("module 'DiscreteModeChoice' has parameter sets (<parameterset>); only flat modules can be
    compared", config_modules.read_module; i679_d_first_launch_failure_excerpt_log.txt). Read from the full run log
    on the run server, not from the committed excerpt: the error came after RunPreparation, the cut and the freight
    injection and before the initial mode choice, so no mode was chosen and no JVM stayed behind. Fixed by 55d9b194,
    to which the eqasim-bs worktree was then moved by hand. Final launch 09:20:33 to 09:44:25, exit 0.
    ARM E (2026-11-26): arm D plus the out-and-back split of the strolls (docs/codebase/notes/leisure-loops.md,
    section "Definitions"): a stroll that starts at home and is followed in the diary by its own way home is placed
    by the solver, carries the activity attribute outAndBackStroll, and the Java rule StrollNonMotorised keeps the
    trip into it on walk or bicycle; the loop-free leisure estimates keep such legs. Stage code: eqasim-bs 33abe12f
    (bundle sha256 bcbadf3f13bfbd26bb3838bd98a3b7258f32b56072255f58ae1fc386447c7e13, 55d9b194..33abe12f) and
    eqasim-java-bs e83ca961f (bundle sha256 ff75c224c4cbe1b0d5748192c203bef8a46e7ea9dc6eff46ec5e10d11096f6d2,
    f8accd10c..e83ca961f; branch feat/i679-same-facility-leisure-trips, NOT merged yet); shaded jar md5
    5eecbd7fdeb943d981325d79c3a2bb96, built by the runtime stage of this launch (i679_provenance_e.txt). One launch,
    2026-11-26 16:46:39 to 17:30:34, exit 0. The comparison scripts ran on the run server in a separate directory
    against the caches of arms D and E, read-only, with the scripts of this record as committed in the same commit
    as the E entries (i679_ab_metrics.py and i679_loop_mode_rule_premise.py gained the out-and-back blocks; the
