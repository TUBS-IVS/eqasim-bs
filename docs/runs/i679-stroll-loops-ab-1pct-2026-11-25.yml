source: >-
  The run caches and logs of i679_a, i679_b, i679_c (and of the superseded i679_off, i679_on, i679_off2, i679_on2) on
  the run server, read by the committed scripts of docs/runs/artifacts/i679-stroll-loops-ab-1pct-2026-11-25/
  (i679_ab_metrics.py, i679_e2e_metrics.py, i679_off_identity.py, i679_gpkg_content_check.py, i679_plan_mode_diff.py,
  i679_null_initial_mode_probe.py, i679_keep_stage_pickles.py) and by scripts/validate_secondary_distances.py at 84a91698;
  every number below is copied from the artifact named in its entry. A stage pickle is the pipeline.json entry of that
  stage with the newest `updated` time whose pickle exists (i679_ab_metrics.py::resolve_stage); the chosen keys are in
  the `provenance` block of each metrics JSON. Arms D and E: the caches and logs of i679_d and i679_e, read by
  i679_ab_metrics.py, i679_loop_mode_rule_premise.py, i679_e2e_metrics.py and i679_rule_trip_diff.py.
