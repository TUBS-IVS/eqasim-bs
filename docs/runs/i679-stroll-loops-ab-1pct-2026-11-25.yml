- metric: trips and activities per purpose, and leisure participation, A vs B vs C
  reference: 'the other arms of the same run (same seed, shared upstream trip table); no observed reference'
  result: >-
    Equal in all three arms (model output). trips.final 34,466 trips by following purpose: education 2,181, escort
    1,867, home 14,468, leisure 5,491, other 2,709, outside 567, shop 3,003, work 4,180; activities of the simulated day
    45,932 (home 25,934, the other purposes as the trips); persons with a leisure activity 4,038 of 11,466. trips.final is
    identical frame for frame. The simulated trips (trips.simulated, the trips as written) differ in mode and time:
    A vs C 314 trip modes (112 persons) and 38 departure/arrival times (11 persons); B vs C 38 trip modes (11 persons),
    no time. Of the trips that differ (mode or time), 83 of 333 (A vs C) and 1 of 38 (B vs C) belong to persons with an
    `outside` activity. Cause, measured: trips.simulated is the output of the outside-tour mode stage on trips.final
    (identical in all arms) and the located activities; that stage re-decides only the tours it flags, home-based tours
    with an `outside` activity OR a destination outside the cordon polygon. Recomputing the flags per arm with the
    stage's own functions: every differing trip lies in a tour flagged in at least one of the two arms (A vs C modes: 98
    flagged in both, 123 only in A, 93 only in C, 0 in neither; B vs C modes: 35 / 2 / 1 / 0); the flagged legs are 2,378
    (A), 2,310 (B), 2,311 (C), and the stage reports count 949 (A) and 932 (B, C) flagged tours of 14,614. The flagged
    set changes because the located places change (destinations move across the cordon polygon); differences inside
    tours flagged in both arms are consistent with the stage drawing its substitutes from one random stream over all
    flagged tours (code reading of remode_outside_tours, not measured). The two sets of 38 trips are not the same trips:
    the 38 time changes of A vs C are exactly the 38 time changes of A vs B (switch off against either switch-on arm),
    and only 4 of them are among the 38 mode changes of B vs C.
  artifact: 'docs/runs/artifacts/i679-stroll-loops-ab-1pct-2026-11-25/i679_ab_metrics_A_vs_C_ff83decf.json, docs/runs/artifacts/i679-stroll-loops-ab-1pct-2026-11-25/i679_ab_metrics_B_vs_C_ff83decf.json (keys equality, differences_downstream_of_locations, off/on), docs/runs/artifacts/i679-stroll-loops-ab-1pct-2026-11-25/i679_followup_metrics.json (keys differences, flagged_tour_legs, outside_tour_reports, same_trips)'
