    (45,932 rows) are frame-equal (columns, dtypes, row order, values, geometries as WKB), the secondary stage folder is
    byte-equal. Written population: 11 of 12 files byte-equal; braunschweig_1pct_i679_commutes_pre_portal.gpkg differs
    only in the write time of its layer `education`, both layers are content-identical (3,689 and 1,903 rows). i679_off2
    itself equals the switch-off arm of 66da6ee0 in the same way (i679_off_identity_66da6ee0_vs_0611505f.json), so the
    switch-off path is unchanged across all three commits. As the written persons, households and trips files are
    byte-equal too, PopulationSim 0.10.0+bs.3 reproduced the population of 0.10.0+bs.2 in this run.
  artifact: 'docs/runs/artifacts/i679-stroll-loops-ab-1pct-2026-11-25/i679_identity_a_vs_off2_0611505f.json, docs/runs/artifacts/i679-stroll-loops-ab-1pct-2026-11-25/i679_identity_a_vs_off2_pre_portal_gpkg.txt, docs/runs/artifacts/i679-stroll-loops-ab-1pct-2026-11-25/i679_off_identity_66da6ee0_vs_0611505f.json, docs/runs/artifacts/i679-stroll-loops-ab-1pct-2026-11-25/i679_off_identity_pre_portal_gpkg.txt'
