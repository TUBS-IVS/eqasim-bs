    (i329 3.902); tours_per_mobile 1.512 vs 1.595; nonhome_acts_per_mobile 2.135 vs 2.182.
    Trip-count shares model vs SrV: 0 trips 0.113 vs 0.156, 1 trip 0.001 vs 0.006, 2 trips 0.339
