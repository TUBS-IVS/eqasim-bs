classification:
- ab_test
- validation
status:
  execution: running
  notes: 'PENDING TAIL: invocation (2) is executing the vehicle fleet, the location chain,
    synthesis.output and work_participation_by_kreis; this field is updated when it ends. The
    plan-structure evidence below is COMPLETE: the analysis stage ran on the finished trip table
    and its outputs are committed.
    OUTCOME OF THE PRE-REGISTERED EXPECTATIONS (design spec section 3, "expected after arm 4";
    measured after arm 3 because package 4 is not built), without interpretation: persons without
    trip 11.28 % (expected 11-13 %) MET; trips per person 3.235 (3.2-3.5) MET; mobile persons with
    odd trip count 29.3 % (25-30 %) MET; degenerate home->home first trips 0 (0 %) MET; employed
    with work trip 58.4 % (>= 60 %, package 4 pending) NOT YET; education participation 6-17
    84.3 % (>= 85 %, package 4 pending) NOT YET; trips followed by the same purpose 10.8 % (< 6 %)
    NOT MET; work activities < 2 h 20.2 % (< 8 %) NOT MET. The two NOT MET rows were diagnosed on
    the trip table (validation entries 6 and 7): both values are reproduced by the unique MiD
    donor diaries themselves (10.7 % and 19.0 %), so the pre-registered bounds rested on a wrong
    attribution (to rbW legs and the fixed closure dwell, both of which are gone) and the residual
    is the donor survey''s recording granularity. No threshold was relaxed; the spec table is
    left as written and this manifest carries the measured values.'
environment: server
validation:
- metric: 'Persons without a trip (complement of mobility_rate), head-to-head universe of the
    seven SrV Kreise, at_home_zero universe of the reference'
  reference: eqasim-data/data/braunschweig/srv/srv2023_plan_structure_reference.csv
  result: 'model mobility_rate 0.8872 (11.28 % without a trip) vs SrV 0.8437 (+4.35 pp); i329
    0.7708 (23.0 %). The popsim trip_class control targets the SrV AT-HOME share of 11.2 % (persons
    at home all day, E_ANZ_WEGE2 universe), which the realised population now hits; the analysis
    stage''s primary universe additionally counts SrV persons away from home with zero trips
    (15.6 % in total), which the model does not represent (follow-up issue #370, general absence).
    Per Kreis: 03101 0.9006 vs 0.8533, 03102 0.8797 vs 0.8519, 03151 0.8779 vs 0.8359, 03153
    0.8794 vs 0.8324, 03154 0.8852 vs 0.8423, 03157 0.8774 vs 0.8212, 03158 0.9000 vs 0.8599
    (deltas +2.8 to +5.6 pp, all the same sign, i.e. the universe offset, not Kreis noise).
    By group: employed 0.9308 vs 0.8849, children 0-5 0.9132 vs 0.8944, school age 6-17 0.9400 vs
    0.9362, adults 18-64 not employed 0.8297 vs 0.7814, seniors 65+ 0.7912 vs 0.7434.'
  artifact: eqasim-data/data/braunschweig/calibration/plan_structure_fix_arm3_100pct_2026-09-07/headline.csv
- metric: 'trips_per_person, trips_per_mobile_person, tours_per_mobile, trip-count distribution'
