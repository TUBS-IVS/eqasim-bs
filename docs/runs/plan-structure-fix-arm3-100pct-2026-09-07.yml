    +0.01 to +0.09.'
  artifact: eqasim-data/data/braunschweig/calibration/plan_structure_fix_arm3_100pct_2026-09-07/headline.csv
- metric: 'Purpose participation and purpose shares (work, education, shop, leisure, escort,
    other), segment all and the employment / age groups'
  reference: eqasim-data/data/braunschweig/srv/srv2023_plan_structure_reference.csv
  result: 'participation all: work 0.3176 vs 0.3316 (i329 0.270), education 0.1799 vs 0.1761,
