notes: 'The pre-registered table of the design spec (docs/superpowers/specs/2026-09-05-plan-structure-fix-design.md,
  gitignored) states its bounds "after arm 4"; arm 4 needs package 4 (#368), which is not built,
  so this manifest records arm 3 against those bounds and marks the two package-4 rows as
  pending rather than failed. The two rows that ARE failed (same-purpose repeats, short work
  activities) were pre-registered on the assumption that rbW legs and the fixed closure dwell
  caused them; the donor-inheritance diagnostic shows the MiD diaries carry both patterns at the
  same rate, which is a finding about the reference comparison, not a reason to move a bound.
  SrV note on definitions: the spec table quoted "work activities < 2 h 4.8 %" from the 1-2 h bin
  of the 2026-09-05 report; the committed reference column share_work_activities_lt_2h (0.1096)
  counts everything below 2 h and is the figure used here.'
source: 'Arm 3 (every package of the plan-structure fix ON = base_bs.yml defaults) of the
  pre-registered A/B ladder, run at 100 % on a hardlink copy of the i329 cache with a
  re-synthesised population, measured by braunschweig.analysis.synthesis.plan_structure_vs_srv
  against the committed SrV 2023 plan-structure reference (issues #365, #366, #367, #369)'
