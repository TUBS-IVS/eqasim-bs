- metric: 'diary_plan_match report and the trip_class seed guards (package 1, ADR-0106)'
  reference: 'braunschweig.popsim.diary_plan_match EXPECTED_SHARE_REMAPPED = (0.05, 0.30)'
  result: '485,709 plan sources; 407,528 realisable as drawn, 74,898 remapped (15.42 %, inside
