- metric: 'share_trips_followed_by_same_purpose (pre-registered < 6 % after the ladder)'
  reference: eqasim-data/data/braunschweig/srv/srv2023_plan_structure_reference.csv
  result: 'VERDICT not met: model 0.1076 vs SrV 0.0453 (+6.22 pp); i329 by the same stage
    definition is not available (the stage did not exist), the 2026-09-05 boundary measurement
