  artifact: eqasim-data/data/braunschweig/calibration/plan_structure_fix_arm3_100pct_2026-09-07/donor_inheritance_diagnostics_arm3.txt
- metric: 'share_work_activities_lt_2h and mean_work_activity_h (pre-registered < 8 % after
    packages 2 + 3)'
  reference: eqasim-data/data/braunschweig/srv/srv2023_plan_structure_reference.csv
  result: 'VERDICT not met: 0.2025 vs SrV 0.1096 (+9.29 pp); mean 5.68 h vs 6.29 h. On the raw
    trip table (same definition, all Kreise): arm 3 0.202 over 449,692 measurable work
    activities, i329 0.264 over 464,689 -- so the branch removed a quarter of the excess, not
    all of it. Decomposition of the 20.2 % by what follows the work activity: work->work
    repeat 72,531 activities (16.1 %), 64.9 % of them < 2 h, contributing 10.5 pp; work->home
    (real leg) 269,528 (59.9 %), 10.3 % < 2 h, 6.1 pp; work->other purpose 93,393 (20.8 %),
    12.8 % < 2 h, 2.6 pp; work->synthetic closure 14,240 (3.2 %), 29.4 % < 2 h, 0.9 pp (i329:
    the fixed 1 h dwell made every closure-preceding activity exactly 1.0 h). The remaining
    work->work pairs are W_ZWECK 2->2 30,512 (67.9 % < 2 h, mean 1.61 h), 1->2 25,622 (65.4 %),
    1->1 10,358 (63.4 %), 2->1 6,039 (49.7 %): non-rbW business legs recorded one by one.
    INHERITED: the unique MiD donors show 0.190 with the identical composition (2->2 68.7 %,
    1->2 52.8 %, 1->1 68.4 % < 2 h). Reading: the SrV/MiD difference in how business legs are
    recorded, plus part-time and short work days; follow-up issue #371 (business-trip chains
    as one work activity). Observed but not pursued: some 1->1 pairs have a zero dwell (arrival
    equals the next departure), visible in the diagnostic sample.'
  artifact: eqasim-data/data/braunschweig/calibration/plan_structure_fix_arm3_100pct_2026-09-07/trip_table_diagnostics_arm3.txt
- metric: 'Synthetic home closure and the closure dwell model (package 3, ADR-0108)'
  reference: 'ClosureDwellModel rate logs (CLOSURE_GLOBAL_FALLBACK_WARN_RATE 0.5, CLOSURE_CAP_WARN_RATE 0.05)'
  result: '238,757 synthetic closure trips of 3,655,159 (6.53 %; i329 248,355 = 7.3 %), 238,757
    of 1,002,332 mobile persons (23.8 %) closed, 15.76 % of all home trips synthetic. Dwell
    model built from 23,538 unique donor diaries; draws 88.9 % from the full cell, 11.1 %
    purpose-marginal fallback, 0 global fallback, 0.3-0.4 % capped at the observed maximum --
    all below the warn rates. Stage A repair 743,926 valid / 216,635 repaired / 41,771
    unfixable; after time imputation 979,051 / 22,134 / 1,147; stage B replaced 1,147 persons.
    Accepted deviations written by the stage: share_mobile_last_to_home 1.0 vs 0.9776,
