  overlays:
  - 'felix:~/psf_arm3_100pct.yml (copy in the session scratchpad; content reproduced in notes)'
  notes: 'Merge log "composed configs/base_bs.yml + /home/felix/psf_arm3_100pct.yml: 0 overridden,
    14 added". The overlay is scale/paths only: working_directory
    eqasim-data/cache_bs_100pct_psf3 (a cp -al hardlink copy of the i329 cache
    cache_bs_100pct_i329, so every stage the branch does not devalidate is a cache hit), run
    list [synthesis.output, braunschweig.analysis.synthesis.plan_structure_vs_srv,
    braunschweig.analysis.synthesis.work_participation_by_kreis], sampling_rate 1.0,
    output_path eqasim-data/output_bs_100pct_psf3, analysis_working_directory = the cache,
    output_prefix braunschweig_100pct_psf3_, matsim_last_iteration 0,
    braunschweig.population.popsim.work_dir eqasim-data/popsim_work_psf3, max_cells 750,
    num_workers 3, importance_profile optimized_2026_06_30, cache_share_export false,
    cache_share_recompute [], eqasim_version "2.3.1". ARM 3 of the pre-registered ladder = the
    base_bs.yml DEFAULTS of the seven new flags, none overridden: diary_plan_match true,
    exclude_holiday_plan_sources true, exclude_rbw_legs true, drop_leading_arrive_home_leg true,
    closure_dwell_model empirical, closure_dwell_min_obs 30, trip_class_seed_counts_closure
    true. Package 4 (#368, controls conditional on employment / school age) is NOT built, so arm
    4 does not exist; arms 1 and 2 (package 1 alone; 1+2) were NOT run (controller ruling: one
    100 % proof of the default state first, the isolating arms at 25 % remain optional).
    Launched with "python scripts/run_synpp.py configs/base_bs.yml ~/psf_arm3_100pct.yml" in
    tmux session psf3.'
sampling:
  rate: 100%
  scope: ZGB-8
  notes: 'The population WAS re-synthesised: braunschweig.popsim.completed_donor and
    braunschweig.popsim.stage devalidated (new diary_plan_match step, new trip_class seed) and
    ran for 36 min and 6 h 39 min (60 batches). The result has 1,131,314 persons (i329:
    1,131,204; the two populations are different draws and are compared as populations, not
    person by person). 1,003,727 persons (88.72 %) live in one of the seven SrV-surveyed Kreise
    and form the head-to-head universe; 127,585 live in 03103 Wolfsburg (model-only rows) and 2
    have no resolvable home Kreis. 1,002,332 persons carry 3,655,159 trips (i329: 3,392,698).
    Every n_* below is a SAMPLE count at sampling_rate 1.0, never expanded; SrV values are the
    committed weighted reference (18,223 respondents, 787,251 weighted persons).'
pipeline:
  targets:
  - synthesis.output
  - braunschweig.analysis.synthesis.plan_structure_vs_srv
  - braunschweig.analysis.synthesis.work_participation_by_kreis
  notes: 'TWO synpp invocations (times CEST). (1) 2026-09-06 20:33:57 -> 2026-09-07 06:26:21,
    log ~/psf_arm3_100pct_part1.log: 59 stages found; completed_donor 20:45-21:21 (diary_facts
    over 305,206 donor persons with Wege, diary_plan_match report below); popsim.stage
    21:21-04:00 (6 h 39 min); trips_stage 04:01-05:32 (rbW drop, arrive-home drop, closure
    dwell model, stage A repair 743,926 valid / 216,635 repaired / 41,771 unfixable, time
    imputation 40,520/40,520 coded-time persons, stage B 1,147 unfixable persons -> 1,147
    matched chains, 0 home-only); plan_structure_vs_srv finished 06:04; the run then CRASHED at
    06:26 in braunschweig.synthesis.vehicles.cars.household: fleet_wohnmobile_age_tilt raised
