    committed-table guard worked as designed; cause = the controller''s incomplete copy, see
    repository.notes). (2) 2026-09-07 08:32:05 -> (running at the time of writing), log
    ~/psf_arm3_100pct.log: after copying the two KBA files, the same command; 14 stages to run,
    the population, trips and analysis stages are cache hits; plan_structure_vs_srv re-executed
