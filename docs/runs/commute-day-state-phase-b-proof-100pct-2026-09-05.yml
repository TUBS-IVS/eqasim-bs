id: commute-day-state-phase-b-proof-100pct-2026-09-05
date: '2026-09-05'
repository:
  commit: 96e35e65
  branch: feature/commute-day-state-phase-b
  notes: 'The branch was NOT pushed. The 60 files it changes relative to origin/main c9b841d9
    (the commute_day package, the two analysis stages, the vendored synthesis/output.py and
    matsim/scenario/population.py hunks, configs/base_bs.yml plus the nine fixture configs, the
    registry records and the generated views) were tarred and extracted onto a DETACHED server
    worktree at c9b841d9 (~/wt_cds_b), exactly as for Phase A and the SrV baselines; c9b841d9
    already contains Phase A (#363) and the deterministic-stage-hash fix (#362), so no Phase A
    file needed to travel in the tar. TWO CODE FIXES were made DURING this run, both forced by a
    crash on real data, both scp''d onto the same worktree and re-run from there; they are part of
    the branch commit that records this manifest, so the code state of the later runs is
    96e35e65 + those two fixes:
    (1) braunschweig/analysis/synthesis/work_participation_by_kreis.py::_destination_ars5 --
    origin/main commit 43f74008 (a Phase A review "minor" hardening, merged AFTER the Phase A run
    had already executed) pinned an in-region workplace commune_id to exactly 8 digits, but
    braunschweig.locations.work writes the 12-digit Regionalschluessel ("031010000000"): 265,750
    of 304,900 workers (87.2 %) became unresolvable and the stage raised on
    cds_max_unresolved_destination_share. The internal branch now accepts 8 OR 12 digits (7/9/13
    digits and non-digits still rejected) and a test pins the real 12-digit format.
    (2) braunschweig/synthesis/commute_day/donor_pool.py::donor_trips -- 12 of the 8,026
    home-office-day donors carry an HP_SEX code outside {1, 2} and get sex=NaN; eqasim''s
    statistical_matching sorts the union of each matching column''s values, so the mixed
    NaN/str column raised TypeError and killed the whole donor build. The persons frame handed
    to the resample now carries an explicit "unknown" stratum (counted and logged); the
    attributes frame still carries NaN, unchanged for every other consumer.
    Neither fix relaxes any threshold. A THIRD defect was found and NOT fixed (see
    status.notes and validation entry 6).'
configuration:
