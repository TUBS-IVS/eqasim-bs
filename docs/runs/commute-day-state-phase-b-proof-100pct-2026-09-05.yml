  overlays:
  - 'felix:~/cds_b_off.yml (run 1, commute_day_state_enabled false)'
  - 'felix:~/cds_b_on.yml (run 2, flag true)'
  - 'felix:~/cds_b_on2.yml (run 2c, flag true, run list without the blocked analysis stage)'
  - 'felix:~/cds_b_sens2.yml (run 3, flag true, commute_day_absent_share_far 0.6)'
  notes: 'All four overlays are the i329 production config block
    (docs/runs/100pct-allfeat-i329-2026-08-24.yml) with working_directory
    eqasim-data/cache_bs_100pct_i329 and differ from each other in EXACTLY the keys named here:
    commute_day_state_enabled, commute_day_absent_share_far, output_path, output_prefix and the
    run list. Run 1 output_path eqasim-data/output_bs_100pct_cds_off / prefix
    braunschweig_100pct_cds_off_; runs 2/2c eqasim-data/output_bs_100pct_cds_on /
    braunschweig_100pct_cds_on_; run 3 eqasim-data/output_bs_100pct_cds_sens /
    braunschweig_100pct_cds_sens_. Everything else is the i329 block verbatim: sampling_rate 1.0,
    random_seed 1234, popsim work_dir eqasim-data/popsim_work_i329, max_cells 750, num_workers 3,
    importance_profile optimized_2026_06_30, cache_share_enabled/export true, eqasim_version
    2.3.1, matsim_last_iteration 0. The commute-day stages ran at their base_bs.yml values:
    commute_day_state_enabled true (run 1: false), commute_day_far_threshold_km 200.0,
    commute_day_absent_share_far 1.0 (run 3: 0.6), commute_day_max_not_replaceable_share 0.5, and
    the analysis stages at their defaults (cds_detour_factor 1.3, cds_output_subdir
    analysis/commute_day_state_phase_a, cds_max_unmatched_home_share 0.05,
    cds_max_unresolved_destination_share 0.05, cds_edge_tolerance_km 5.0,
    cds_max_states_outside_employed_share 0.05). Launched with
    "python scripts/run_synpp.py configs/base_bs.yml <overlay>" (the wrapper installs the
    ADR-0105 deterministic-hash patch). Merge log for every run: "0 overridden, 15 added".'
sampling:
  rate: 100%
  scope: ZGB-8
  notes: 'No population was synthesised: the persons, households and home locations are the i329
    ones (manifest 100pct-allfeat-i329-2026-08-24), reached through the same cache as the SrV
    baselines of 2026-09-03/04 and the Phase A measurement. braunschweig.popsim.stage,
    braunschweig.popsim.completed_donor, braunschweig.popsim.enriched_adapter and
    braunschweig.synthesis.locations.home_cell were CACHE HITS in every run -- the escalation
    criterion of the task (a popsim stage starting to execute) never fired. Cohorts: 1,131,204
    persons, 540,426 flagged employed (540,425 after excluding the one person without a home
    Kreis match), 304,900 workers with an assigned workplace, of which 39,150 (12.84 %) have a
    fabricated external destination -- identical to Phase A and to
    srv-primary-distance-baseline-2026-09-04. Every n_* count is a SAMPLE count at sampling_rate
    1.0 and is never expanded. NEWLY MEASURED here, where Phase A recorded it as unknown: the
    worker cohort and the employed cohort do NOT coincide -- 267,194 of the 304,900 workers
    (87.63 %) are also flagged employed and 37,706 (12.37 %) are not. That is exactly the
    arithmetic gap Phase A observed between 304,900 workers and 267,194 employed persons with a
    work trip, now measured as a per-person join rather than inferred from two totals.'
pipeline:
  targets:
  - synthesis.output
  - braunschweig.analysis.cordon_validation
  - braunschweig.analysis.synthesis.commute_distance_by_kreis
  - braunschweig.analysis.synthesis.work_participation_by_kreis
  - braunschweig.synthesis.commute_day.state_stage
  notes: 'CONTROLLER RULING R4, disclosed here because it substitutes a pre-registered wording:
    ADR-0104 check 6 asks for "a 25 % proof run first and a 100 % proof in the next scheduled
    production run". The server 25 % cache (cache_bs_25pct_allfeat_popsim) dates from 2026-06-24
    and would have rebuilt PopulationSim from scratch (hours), so the proof was run at 100 % ON
    THE CACHED i329 POPULATION instead, where popsim is a cache hit. The SUBSTANCE of check 6 --
    OFF-path byte identity of the written population, an ON run, and the absent-share sensitivity
    -- is unchanged; only the scale of the first proof is. A 25 % run remains available and was
    not executed.
    SIX synpp invocations were made, in this order (all times CEST, 2026-09-05):
    (0) 16:55:27-16:55:35, OFF: aborted immediately because documentation.meta_output cannot
    create its own output directory; the three output directories were created by hand and the
    run restarted. Two cheap stages (home_office_donors_stage, data.external_workplaces) had
    already been written.
    (1a) 16:56:10-19:26:55 (2 h 31 min), OFF: synpp found 76 stages and DEVALIDATED 45.
    braunschweig.popsim.trips_stage re-executed (1 h 25 min, 3,392,698 trips), then the location
    chain, the fleet model, the cordon stages, the analysis stages and the six commute_day
    stages. The run ABORTED in
    braunschweig.analysis.synthesis.work_participation_by_kreis on the 12-digit-AGS defect
    described in repository.notes.
    (1b) 19:30:26-20:24:53 (54 min), OFF, resumed after that fix: 7 stages devalidated, 6
    executed (commute_distance_by_kreis, cordon_validation, work_participation_by_kreis,
    activities_day_stage, secondary_chainsolvers 44 min / success rate 0.9998 over 860,733
    problems, spatial_locations_day, output_day). COMPLETED, exit without error.
    (2a) 20:25:28-20:25:52, ON: aborted in the donor-pool build on the mixed-type sex defect
    described in repository.notes.
    (2b) 20:28:22-20:43:46 (15 min), ON, after that fix: 14 stages devalidated, 10 executed
    (home_office_donors_stage, meta_output, primary.candidates, education_gravity,
    replacement_education_gravity, commute_distance_by_kreis, state_stage, cordon_validation,
    trips_day_stage, work_participation_by_kreis). ABORTED at the LAST of them by the
    pre-registered guard cds_max_states_outside_employed_share (validation entry 1). The
    threshold was NOT relaxed.
    (2c) 20:44:49-20:49:04 (4 min), ON with the blocked analysis stage removed from the run list,
    to obtain the ON population itself: 6 stages devalidated, 4 executed. ABORTED inside
    braunschweig.synthesis.locations.secondary_chainsolvers while ENUMERATING assignment
    problems (validation entry 6). No ON population file was written.
    (3) 20:52:24-21:00:18 (8 min), sensitivity: 4 stages devalidated (state_stage,
    education_gravity, replacement_education_gravity, primary.candidates), all executed.
    COMPLETED.
    CACHE EFFECT, disclosed: every run wrote new cache entries into the SHARED i329 cache and
    reset its stage-hash bookkeeping ("Successfully reset meta data"), the same hazard ADR-0104
    already records for Phase A. Verified read-only afterwards:
    braunschweig.locations.work__1a0249bd (this run) is BYTE-IDENTICAL to
    braunschweig.locations.work__a1ae6592 (Phase A, 18,359,292 B), and
    replacement_education_gravity__50816214 (ON) is BYTE-IDENTICAL to __9dba1a37 (OFF,
    23,666,794 B) -- the work and education assignments the ON and the OFF run measured are the
    same per-person assignments, so every ON/OFF difference below is the flag''s own effect.
    .merged_config.yml in the cache directory was rewritten by each run (as any run does); the
    pre-run copy is kept at felix:~/cds_b_merged_config_prerun_backup.yml.'
classification:
- validation
status:
  execution: partial
  notes: 'PARTIAL, deliberately: the OFF line and the sensitivity line completed, the ON line
    produced its state draw and two of its three analysis outputs and then hit two stops.
    THE THREE DEFECTS THIS PROOF RUN FOUND, in the order they fired:
    (1) 12-digit AGS -- FIXED in this branch, see repository.notes. Evidence that the fix
    restores the pre-hardening behaviour exactly rather than papering over it: the OFF run''s
    work_participation_by_kreis.csv, assigned_distance_classes.csv and
    ext_destination_distances.csv are BYTE-IDENTICAL to the committed Phase A measurement
    (cmp_results.txt), i.e. the same numbers the permissive pre-43f74008 code produced.
    (2) mixed-type donor sex -- FIXED in this branch, see repository.notes.
    (3) NOT FIXED, and the reason the ON population line is incomplete: 36 of the 5,086 persons
    drawn to "home" (0.71 %) receive a MiD home-office-day donor whose chain contains an
    EDUCATION activity while the receiving person has no education location. ADR-0104''s hard
    matching criteria (active escort, children under 14, car availability) do not cover fixed
    purposes the receiving person cannot anchor, so the transplanted chain leaves
    synthesis/population/spatial/secondary/problems.py::find_assignment_problems with
    origin/destination None and the secondary chainsolver raises AttributeError. Measured on the
    cached ON frames: all 296,727 persons with a work activity and 178,564 of the 178,600 with
    an education activity DO have the matching location; the 36 exceptions are all in state
    "home" (with the flag OFF, all 178,763 education-activity persons have one, so the 36 GAINED
    the activity from their donor). Fixing this needs a design decision ADR-0104 does not contain (reject such donors as
    a hard criterion / re-anchor the activity / drop the leg), so it was left to the maintainer
    rather than decided inside this run.
    A fourth, non-blocking observation: plan_replacement.py emits a pandas
    "DataFrame is highly fragmented" PerformanceWarning 657,888 times in the ON run (one per
    replaced column write), which alone made the run log 254 MB.
    SERVER STATE. Left in place as run evidence: the three output directories
    /home/felix/wt-i329/eqasim-data/output_bs_100pct_cds_{off,on,sens} (2.1 G / 496 K / 4 K), the
    four overlays and six logs in ~ (the two large ones gzipped), ~/cds_b_artifacts (the
    aggregates committed below) and ~/cds_b_merged_config_prerun_backup.yml. Cleanup performed
    and verified: the three reference CSVs copied into
    /home/felix/wt-i329/eqasim-data/data/braunschweig/{mid,srv}/ were removed (absence verified
    with ls), the eqasim-data symlink was removed BEFORE anything else and eqasim-data._tracked
    deleted, ~/wt_cds_b removed with git worktree remove --force + prune, /tmp/cds_b*.tgz
    deleted. Shared-checkout invariants on felix, identical before and after: ~/eqasim-bs with 26
    porcelain entries and 19 worktrees; nothing under ~/wt-i329/eqasim-data/output_bs_100pct_i329
    or any cache_* directory was deleted. Disk after: 459 G used of 786 G.'
environment: server
validation:
- metric: 'ADR-0104 check 1 -- realised at_workplace / home / absent shares and the share of
    employed persons without a work trip, regionally against the SrV 2023 reference
    0.1418 / 0.6511 / 0.2071, at the pre-registered tolerance of +/- 3 pp on the REGIONAL
    aggregate only'
  reference: eqasim-data/data/braunschweig/srv/srv2023_work_participation_by_kreis.csv
  result: 'VERDICT not_run (BLOCKED by a pre-registered guard; the threshold was NOT relaxed).
    The pre-registered table commute_day_state_shares.csv was never written: with the flag ON,
    commute_day_state_shares raised RuntimeError because 37,706 of the 304,900 drawn states
    (12.37 %) fall OUTSIDE the employed universe, above cds_max_states_outside_employed_share =
    0.050. The guard exists to catch a person_id join that matches nothing; here the join works
    (267,194 workers, 87.63 %, DO match) and the 12.37 % is a real universe difference -- the
    model assigns workplaces to 37,706 persons the enriched population does not flag employed.
    Deciding which universe check 1 should use is a maintainer decision, not a threshold to move.
    MEASURED ANYWAY, and NOT a substitute for check 1 because the denominator differs from the
    SrV one: over the 304,900 WORKERS the realised states are at_workplace 296,599 (0.9728),
    home 5,086 (0.0167), absent 3,215 (0.0105). Over the EMPLOYED universe the model''s work
    participation is 267,194/540,425 = 0.4944 with the flag OFF (delta -15.67 pp against the SrV
    0.6511) and 260,082/540,425 = 0.4813 with the flag ON (delta -16.98 pp): the day-state model
    moves this share FURTHER DOWN by 1.31 pp, which ADR-0104 predicted and explicitly declined to
    treat as this model''s fit criterion. The ON figure is read from the run log; the ON table
    was not written because the raise came after it was computed.'
  artifact: 'eqasim-data/data/braunschweig/calibration/commute_day_state_phase_b_proof_100pct_2026-09-05/off/work_participation_by_kreis.csv
    (the OFF table, byte-identical to the committed Phase A one),
    .../on/state_diagnostics.json (the worker-universe state counts),
    .../run_log_excerpts.txt (the ON participation line and the traceback)'
  notes: 'The +/- 3 pp band is an ASSUMPTION recorded in ADR-0104, chosen a priori and derived
    from no committed source; it is not applied here because the comparison it governs was not
    produced. The per-Kreis OFF deltas are unchanged from Phase A (-12.27 pp for 03101 to -20.55
    pp for 03102; 03103 Wolfsburg has no SrV row and keeps NaN). How much of the -15.67 pp is
    the documented donor-bound participation deficit, how much is the different universe and how
    much is a genuine day-state gap remains UNKNOWN -- no decomposition was measured.'
- metric: 'ADR-0104 check 2 -- inter-Gemeinde work distance bands re-measured with the Phase 0
    stage: the 100_plus band below 3 %, and no deterioration of the bands up to 50 km against the
    2026-09-04 baseline EMD'
  reference: eqasim-data/data/braunschweig/calibration/srv_distance_baseline_2026-09-04/commute_by_kreis.csv
  result: 'VERDICT fail on the 100_plus bound, pass on the no-deterioration half. ZGB inter
    scope, flag ON: model_share_100_plus 0.100083 (10.01 %) against the pre-registered bound of
    3 %; EMD 0.085194 with noise floor 0.012915, classification "gap". ZGB all scope EMD 0.051201
    ("ok"), ZGB intra EMD 0.010904 ("ok"). The bands up to 50 km did not deteriorate -- they did
    not move at all: commute_by_kreis.csv, commute_quantiles_model.csv and sensitivity.csv from
    the ON run are BYTE-IDENTICAL to the OFF run AND to the committed 2026-09-04 baseline
    (decisions.json differs only in a JSON key spelling, "0.10" vs "0.1", with no numeric change).
    MECHANISM, stated as a measured fact rather than an interpretation:
    braunschweig.analysis.synthesis.commute_distance_by_kreis reads
    synthesis.population.spatial.primary.locations and synthesis.population.enriched -- the
    ASSIGNED workplaces -- and not the reporting-day trips, and the ON and OFF primary.locations
    pickles are byte-identical (23,666,794 B). The commute-day-state model changes WHO TRAVELS on
    the simulated day, not WHERE anyone works, so this check as pre-registered cannot be moved by
    it.'
  artifact: 'eqasim-data/data/braunschweig/calibration/commute_day_state_phase_b_proof_100pct_2026-09-05/on/commute_by_kreis.csv,
    .../on/decisions.json, .../on/sensitivity.csv, .../cmp_results.txt'
  notes: 'The 3 % bound is an ASSUMPTION recorded in ADR-0104: it is a chosen operating bound with
    NO reference behind it, because every 100_plus column of the committed SrV table is exactly
    0.0 in all 15 rows (a structural survey blind spot, ADR-0102 Assumption 2), so a 0 % bound
    would assert that blind spot as truth. The "fail" above is therefore a failure against an
    unsourced operating bound, not against an observed value.'
- metric: 'ADR-0104 check 3 -- cordon out-commuter gate volumes before/after, against an
    expectation restricted to at_workplace persons'
  reference: none (the expectation is derived from the BA Pendleratlas register the model is
    itself anchored to; ADR-0104 records that this makes it self-referential for out-commuters,
    which is why it is restricted to at_workplace persons before use)
  result: 'VERDICT pass (the pre-registered artefact was produced with complete joins). With the
    flag ON, commute_day_state_scaling.json records 304,900 workers, 39,150 of them with an
    external destination, 33,143 of those in state at_workplace -> share 0.846564. Applied to the
    register expectation, the outbound cordon volume falls from 60,705 SvB to 51,393 SvB, i.e.
    -9,312 (-15.34 %). Every join is complete: n_workplace_unresolved 0,
    n_states_without_work_location 0, n_work_locations_without_state 0. The UNSCALED
    gate_volumes.csv is byte-identical between the ON and the OFF run, by design -- the OFF run
    writes no scaled file at all.'
  artifact: 'eqasim-data/data/braunschweig/calibration/commute_day_state_phase_b_proof_100pct_2026-09-05/on/commute_day_state_scaling.json,
    .../on/gate_volumes_scaled.csv, .../off/cordon_gate_volumes.csv'
  notes: 'This is a before/after of the EXPECTATION, not of simulated gate counts: no MATSim
    iteration was run (matsim_last_iteration 0 and no matsim.* stage was in any run list), so
    nothing here states that the simulated flows across the cordon changed. The 15.34 %
    reduction is arithmetic on the drawn states.'
- metric: 'ADR-0104 check 4 -- donor matching diagnostics: coarsening rate per step,
    not-replaceable share, missing-donor-distance share, pool size per cell'
  reference: none (model-internal diagnostics; the guards are
    commute_day_max_not_replaceable_share 0.5 and the 50 % warn bound on the primary donor-distance
    source)
  result: 'VERDICT pass for three of the four listed diagnostics; the fourth was not produced.
    Over 304,900 workers with the flag ON: 60,970 (20.00 %) eligible for re-draw, 0 with a
    missing donor class. DONOR-DISTANCE SOURCE (ADR-0104 Amendment 1): the PRIMARY source (the
    donor''s first valid work-trip length) covers 100.0 % of workers in EVERY assigned class
    (lt10 141,352/141,352, 10_25 71,528/71,528, 25_50 54,311/54,311, 50_100 21,515/21,515,
    100_200 5,235/5,235, gt200 10,959/10,959; share_donor_source_primary 1.0), so the 50 % warn
    bound never fired and the residual the Amendment insisted must not pass silently is zero on
    this population. NOT-REPLACEABLE: 0 of the 5,086 persons drawn to home (0.00 %) lacked a
    donor at every level, far below commute_day_max_not_replaceable_share 0.5. COARSENING, per
    step over the 5,086 matched persons: level 0 3,790 (74.5 %), level 1 0, level 2 348 (6.8 %),
    level 3 391 (7.7 %), level 4 23 (0.5 %), level 5 534 (10.5 %), level 6 0. Soft criteria
    actually used: distance_class, sex, age_class, household_size_class -- has_license was
    SKIPPED and logged because MiD donors carry no such column. n_persons_hard_criteria_missing
    0, n_donors_hard_excluded_has_car_unknown 0, n_workers_without_home_geometry 0, 523 persons
    escort-protected from absent. DONOR POOL: 8,026 donors from 420,979 MiD persons (1.91 %
    unweighted, 1.64 % P_GEW-weighted), 18,564 trips for 5,421 of them, 2,605 immobile (32.5 %),
    0 chains dropped by the resample, 1,780 (22.2 %) with no usable commute distance, 12 with
    sex outside {1, 2}. POOL SIZE PER CELL is UNKNOWN: the diagnostics dict records the level a
    person was matched at, not the number of donors available in each matching cell, so the
    fourth pre-registered diagnostic is not measured by this run.'
  artifact: 'eqasim-data/data/braunschweig/calibration/commute_day_state_phase_b_proof_100pct_2026-09-05/on/state_diagnostics.json,
    .../run_log_excerpts.txt'
  notes: 'The 22.2 % of donors with no usable commute distance is a property of the DONOR POOL
    (they neither answered P_ARB_ENTF usably nor made a work trip on their reporting day -- which
    is exactly the state being modelled); it is not the rate at which the MODEL falls back, which
    is the 0.0 % above.'
- metric: 'ADR-0104 check 5 -- sensitivity of commute_day_absent_share_far, 1.0 vs 0.6'
  reference: none (a parameter sensitivity; ADR-0104 Assumption 2 records 1.0 as the single
    largest uncertainty of the design)
  result: 'VERDICT pass (both variants executed on the same population and the same seed).
    Over 304,900 workers: at commute_day_absent_share_far 1.0 -> at_workplace 296,599 (97.28 %),
    home 5,086 (1.67 %), absent 3,215 (1.05 %); at 0.6 -> at_workplace 296,599 (97.28 %), home
    6,345 (2.08 %), absent 1,956 (0.64 %). The at_workplace count is IDENTICAL in both and the
    change is confined entirely to the gt200 class, where absent falls 3,215 -> 1,956 and home
    rises 523 -> 1,782; home + absent is 8,301 in both variants. The 523 escort-protected persons
    are home in both by construction. The coarsening cascade absorbs the extra home persons at
    its loosest level: level 5 rises 534 -> 1,793, with not-replaceable still 0 of 6,345
    (0.00 %). The SrV-referenced share table for this variant was NOT produced -- it is blocked
    by the same guard as check 1.'
  artifact: 'eqasim-data/data/braunschweig/calibration/commute_day_state_phase_b_proof_100pct_2026-09-05/sens_0.6/state_diagnostics.json
    (0.6) and .../on/state_diagnostics.json (1.0)'
  notes: 'Both variants use random_seed 1234 + the commute-day offset 7301 and the same cached
    trips and donor pool, so the difference is the parameter''s own effect and nothing else.
    Neither value is observed: 1.0 and 0.6 are both ASSUMPTIONS recorded in ADR-0104.'
- metric: 'ADR-0104 check 6 -- OFF-path byte identity of the written population, and the proof
    run itself'
  reference: 'eqasim-data/output_bs_100pct_i329/ on felix (the i329 production output, manifest
    100pct-allfeat-i329-2026-08-24)'
  result: 'VERDICT pass for the OFF byte identity; the ON end-to-end population write did NOT
    complete. With commute_day_state_enabled false, all SIX written tables are BYTE-IDENTICAL to
    the i329 production output: persons.csv (107,221,539 B), households.csv (32,105,146 B),
    trips.csv (178,103,236 B), activities.csv (226,610,983 B), vehicles.csv (385,317,779 B) and
    vehicle_types.csv (9,534 B). This is a stronger result than the alias pass-through alone
    guarantees: the OFF run RE-EXECUTED braunschweig.popsim.trips_stage (3,392,698 trips) and the
    secondary chainsolver (860,733 problems, success rate 0.9998) from the same seeds, so the
    identity also demonstrates that those two stages reproduce bit-for-bit under the branch code.
    The ON run (2c) ABORTED before synthesis.output while enumerating assignment problems, on the
    education-anchor defect recorded in status.notes, so NO ON population file exists and the
    ON-vs-OFF comparison of persons/trips/activities is not_run. What IS measured about the
    flag''s effect on the day, from the cached reporting-day trip frames: 3,369,358 trips for
    865,859 persons with the flag ON against 3,392,698 trips for 870,464 persons with it OFF,
    i.e. -23,340 trips (-0.69 %) and -4,605 persons losing their last trip.'
  artifact: 'eqasim-data/data/braunschweig/calibration/commute_day_state_phase_b_proof_100pct_2026-09-05/cmp_results.txt'
  notes: 'Check 6 as written asks for "a 25 % proof run first and a 100 % proof in the next
    scheduled production run". Ruling R4 substituted a 100 % proof on the CACHED i329 population
    for the 25 % run (pipeline.notes); the 100 % proof in a scheduled production run is still
