issues:
- '#657'
- '#646'
notes: >-
  Control fit against the model's own targets is not validation against observed behaviour. The tenure rule
  rests on the ASSUMPTION that households outside every dwelling counted in the rooms table rent; the rooms
  table counts more dwellings than the owner quote covers, so the rule corrects too little rather than too
  much.
