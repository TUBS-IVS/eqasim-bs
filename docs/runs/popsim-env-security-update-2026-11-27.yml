issues: []
notes: >-
  Identity of two runs of the same model is not validation against observed behaviour. Related records:
  popsim-bs3-release-2026-11-25 (reference hashes and batch folders), popsim-run-performance-2026-11-18.
  The one high-severity alert of protobuf stays open, because fork release 0.10.0+bs.3 pins ortools 9.14.6206,
  which requires protobuf >=6.31.1,<6.32 while the fix is 6.33.5; the next ortools (9.15.6755) requires NumPy 2,
  so the fix needs a new fork release with its own evidence. The advisory (GHSA-7gcm-g887-7qv7) concerns
  `google.protobuf.json_format.ParseDict()` on input from an attacker.
