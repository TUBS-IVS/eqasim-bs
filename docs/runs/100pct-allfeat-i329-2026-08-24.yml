- metric: 'the participation/mobility deficit: donor-vs-instrument decomposition (deep-dive answer
    to "should we add a control?"); measured on the raw MiD donor file
    eqasim-data/.../popsim/mid2023_raw/MiD2023_Personen.csv (420,979 rows, comma-separated, dot
    decimals) -- outside the pipeline''s own analysis tooling'
  reference: 'the same raw MiD donor file the popsim participation/trip_class seed is drawn from,
    and the configured SrV per-Kreis mobility target'
  result: 'MiD donor mobility (anzwege1 > 0, code 803 excluded, as the pipeline does), P_GEW-
    weighted: all reporting days 78.18% | Mon-Fri 80.54% | Mon-Fri no holiday 81.09% | Tue-Thu no
    holiday 81.08% | weekend only 72.23%. MiD anzwege3 (wider trip definition) Mon-Fri no holiday:
    84.16%, identical to MiD''s own `mobil` flag on the same universe. Cross-tab (Mon-Fri no holiday,
    n=253,365, weighted): mobil=1 & anzwege1>0 81.09% | mobil=1 & anzwege1=0 3.07% (4,622 persons,
    "mobile non-reporters") | mobil=0 & anzwege1>0 0.00% | mobil=0 & anzwege1=0 15.84%. Realised in
    the synthetic population (03101): 79.2% vs an SrV target of 90.0% (10.8pp gap). Decomposition of
    that gap: ~3.0pp a measurement artefact in the first (all-days) figure vs the workday-only SrV
    universe; ~3.1pp MiD''s own "mobile non-reporters" (classed mobile, no trip diary to copy);
    ~5.8pp genuine MiD-vs-SrV instrument difference (84.16% vs 90.0%); ~2.0pp the model (79.2%) below
    its own weekday donor pool (81.09%), flagged as the one part that looks like a pipeline
    question.'
  notes: 'ANSWER: no participation control should be added. The four existing hard controls
    (work/leisure/education/escort_participation, trip_class promoted soft->hard in #224 for
    exactly this) already exist and the deficit persists despite them, because a donor-based
    synthesis structurally cannot exceed its donor pool''s reported-trip rate -- MiD compensates for
    non-reporters in the trip WEIGHT (Hebefaktor, docs/data/MID2023_HANDBOOK_REFERENCE.md Kap.
    6.1-6.2), not by giving the person a trip chain to copy. HYPOTHESIS for the control-fit report
    above: four hard controls chasing a level the donor pool cannot supply may be spending weight on
    an infeasible constraint, a candidate explanation for cars_per_hh and employment_status slipping
    just over the "very good" threshold in this run. OPTIONS recorded for the deep dive: (a)
    reclassify the SrV participation rate as a corridor/reference and take the four controls back to
    soft; (b) change the donor -- issue #226 (SrV as a regional HTS chain donor), the only route that
    changes the ceiling; (c) synthesise additional trips for immobile persons, which would need its
    own ADR. Two 2023 surveys of the same population disagreeing by ~12pp on mobility is itself a
    research finding, not something a control should paper over.'
- metric: 'performance finding: the phased-run design (chosen to isolate one wedged analysis stage,
    the 2026-08-20 lesson) costs a devalidation cascade per invocation'
  reference: none (log-derived, not a fit metric)
  result: 'Chainsolver executions in this one run (grep "cs.solve() finished"): phase A a26f14ca
    2389.3s + 9a510cd1 2306.9s | phase B e3528f78 2568.0s | phase C 9a510cd1 2334.9s = 9599s (2h40m)
    of solve time. 9a510cd1 ran TWICE with the same hash (~39 min each): phase A executed it
    08:44-09:29 and wrote its cache, but phase C re-executed it 17:45-18:30 anyway. Cause, from the
    logs, not guessed: each phase start logs "Devalidating N stages" (44 at phase B''s start, 26 at
    phase C''s), a cascade starting at low-level supply stages (data.gtfs.cleaned,
    data.osm.cleaned) and propagating through the whole synthesis and matsim.scenario.* chain.
    cache_share is NOT the trigger: phase C logs "prime: primed 0, already-present 38, forced 0,
    missing-in-store 7". Phase C additionally re-ran matsim.simulation.run at 19:54:10 because
    analysis_suite declares a dependency on it that it uses only to resolve a path (issue #354,
    filed and agreed by the user).'
  notes: 'Trade-off to carry into the next run design: robustness (one wedged analysis stage cannot
    take the other three down) vs. this per-invocation devalidation cost. The driver''s CPU-stall
    watchdog added mid-run now covers the risk that originally motivated phasing, so the next run
    should consider either a single invocation or investigating why synpp devalidates identical-hash
    stages across invocations. A separate provenance defect was also found: every phase logs
    "eqasim_source_path ''../eqasim-java-bs'' does not exist relative to the config; recording
