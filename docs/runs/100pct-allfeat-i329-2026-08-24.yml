validation:
- metric: 'run incident: secondary_chainsolvers misdiagnosed as wedged and killed, then corrected'
  reference: none (process diagnosis)
  result: 'At ~06:30 on 2026-08-24 the controller killed phase A''s secondary_chainsolvers stage
    after seeing "shard 61/62 done", zero CPU accumulation over 25s and 60s windows, 93 threads
    parked on futexes, and only 3 python processes left, and interpreted this as a second, new
    wedge mode distinct from ADR-0097. The log settles it as a MISDIAGNOSIS: the stage had started
    06:54:06 (a typo-free re-read shows the earlier attempt actually began before the kill),
    logged "shard 62/62 done (elapsed=2385s)" and "cs.solve() finished in 2389.3s; persons
    solved=860,148, failed=126", wrote its cache at 07:40:41 and finished at 07:40:42 -- the kill at
    ~07:42 landed about three minutes AFTER the stage had already completed successfully. There was
    no deadlock. Root cause of the misdiagnosis, four parts: (1) `ps --sort=-rss | head -6` shows
    the six biggest-RSS processes, and with 62 forked workers the still-computing ones fell outside
    that window while the six sampled were finished-by-design idle workers with frozen CPU; (2) the
    log file''s own growth was never checked (it was growing); (3) `futex_wait_queue_me` on idle
    workers was misread as a deadlock signature although both ADR-0097 and the operator''s own prior
    notes say verbatim that a worker which delivered its single shard is idle by design; (4) the
    "only 3 python procs" reading was taken after the executor had already shut down normally. The
    2026-08-20 OOM-worker hang remains correctly explained by ADR-0097; "61/62 done" in both logs is
    just "one result outstanding", the normal state during the last minutes of a healthy run.'
  notes: 'Cost: about 2 minutes of a downstream stage; the chainsolver cache had already been
    written and survived, so the 07:43 relaunch reloaded it rather than recomputing. The proposed
    issue for a "second wedge mode" was NOT filed once the log evidence retracted the diagnosis.
    Kept: the driver''s CPU-stall watchdog (samples whole-tree utime+stime AND log growth, killing
    a phase only after 2700s of both zero CPU and zero log growth) -- it measures exactly what the
    manual diagnosis failed to check, and stayed armed with zero further interventions for the rest
    of the run. Issue #350 (run resource recorder: whole-tree CPU, per-process peak RSS, system
    RAM/swap/disk/IO and log growth into a per-run time series) was filed from this incident and is
    now closed.'
