  scope: >-
    SrV 2023 Braunschweig and RGB (the surveyed Kreise of the ZGB-8; Wolfsburg 03103 is not surveyed), MiD 2023
    Germany (adults 18+, reporting day Tuesday to Thursday for the behaviour table), census 2022 Kreis table of
    pupils and students aged 20-29.
  notes: >-
    Universes of the three level estimates (columns of student_level_gate.csv): the SrV estimate is the weighted
    share of students aged 20-29 in the surveyed municipalities times the census population aged 20-29 of the whole
    Kreis; the census estimate is the census group of pupils and students without paid work aged 20-29 of the whole
    Kreis times the MiD-to-census ratio; enrollment is the head count of enrolled students at local university sites
    (where they study, not where they live), all ages, neither residents nor one day's presence.
