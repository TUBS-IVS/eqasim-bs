configuration:
  base: configs/base_bs.yml
  notes: >-
    No model configuration. The MiD extraction reads three settings from configs/base_bs.yml: exclude_rbw_legs,
    exclude_holiday_plan_sources and drop_leading_arrive_home_leg (all true); their effects are counted in the
    Exclusions headers of the MiD tables (n_work_legs_dropped_rbw, n_holiday_reporting_day, and in the behaviour
    table n_students_only_rbw_diary, n_non_students_only_rbw_diary, n_students_emptied_by_arrive_home_drop,
    n_non_students_emptied_by_arrive_home_drop).
sampling:
  rate: not applicable (survey microdata, weighted with SrV GEWICHT_P_ZENSUS and MiD P_GEW)
  scope: >-
    SrV 2023 Braunschweig and RGB (the surveyed Kreise of the ZGB-8; Wolfsburg 03103 is not surveyed; persons at home
    at some point of the reporting day), MiD 2023 Germany (adults 18+, reporting day Tuesday to Thursday and not a
    public holiday for the day tables), census 2022 Kreis table of pupils and students WITHOUT paid work aged 20-29.
  notes: >-
    Universes of the level estimates (columns of student_level_gate.csv; definitions in its header): the SrV estimate
    is the weighted share of students aged 20-29 in the surveyed municipalities times the census population aged 20-29
    of the whole Kreis; the census estimate scales the census group of pupils and students without paid work by the
    MiD-to-census ratio; enrollment is the head count at local university sites (where students study, all ages, one
    semester), a comparison figure, neither residents nor one day's presence.
