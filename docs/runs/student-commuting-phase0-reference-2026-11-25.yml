decisions: []
notes: >-
  Limitations. (a) The MiD cells of the four diary-dependent controls (status_x_education_leg, trip_class, arrival,
  work_leg) exclude persons without a diary of the day, students and non-students alike; the counts are in the
  Exclusions header of eqasim-data/data/braunschweig/mid/mid2023_student_behaviour_seed.csv
  (n_students_without_diary, n_non_students_without_diary, n_adults, n_students), so the comparison with the regional
  survey rests on a reduced MiD base and assumes persons without a diary are not a distinct group. (b) Rule 2 of the
  build rule compares shares within students and uses only the standard error of the regional survey (the SrV
  Kish effective size of the students universe); the MiD sampling error is not included. (c) The level gate compares
  students by main activity in the surveys (V_ERW 7, working students included) with the census group of pupils and
  students without paid work; enrollment counts students where they study, at all ages, while the estimates cover ages
  20-29. The third estimate (residents implied by enrollment) follows in Phase 1; enrollment is the bound until
  then. (d) The two thresholds of the build rule (MIN_RESPONDENTS_PER_CELL and MIN_DIFFERENCE_STANDARD_ERRORS, values
  in the header of student_control_build_rule.csv) are assumptions, not sourced values. (e) This is a measurement, not
  a validation; no reference or ground truth was compared. If the SrV estimate exceeds what enrollment allows, the
  owner decides the level (design 6.8).
