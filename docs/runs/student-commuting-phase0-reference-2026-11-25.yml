decisions: []
notes: >-
  Limitations. (a) Universe differences between the two surveys in the behaviour comparison. The MiD cells of the four
  diary-dependent controls (status_x_education_leg, trip_class, arrival, work_leg) exclude persons with an unknown day,
  students and non-students alike: no diary of the day, or a diary the popsim seed replaces by a donor's (only rbW
  legs; only a leading arrive-home leg). The counts are n_students_without_diary, n_non_students_without_diary,
  n_students_only_rbw_diary, n_non_students_only_rbw_diary, n_students_emptied_by_arrive_home_drop and
  n_non_students_emptied_by_arrive_home_drop in the Exclusions header of
  eqasim-data/data/braunschweig/mid/mid2023_student_behaviour_seed.csv. The comparison therefore rests on a reduced MiD
  base and assumes persons with an unknown day are not a distinct group. The SrV universe drops persons away
  from home all day, MiD keeps them: the adult students dropped this way are n_adult_students_away_from_home in the
  Exclusions header of eqasim-data/data/braunschweig/srv/srv2023_student_behaviour.csv, against n_students adult
  students kept in the same line. Both behaviour headers state this gap. MiD public-holiday reporting days are
  excluded (n_holiday_reporting_day), as the SrV reference days exclude public holidays. (b) Rule 2 compares shares
  within students and uses only the standard error of the regional survey (the SrV Kish effective size of the
  students universe); the MiD sampling error is not included, the standard error ignores the clustering of persons in
  households (the Kish size reflects only the unequal weights), and the 14 cells of the five controls are tested
  without a correction for multiple comparisons. (c) The level gate compares students by main activity in the surveys
  (V_ERW 7, working students included) with the census group of pupils and students without paid work. Enrollment is
  a comparison figure, not a bound: residents who study elsewhere or by distance learning are survey students but not
  local enrollment (the CHE Kreis view for Braunschweig, by Kreis of the school leaving certificate, lists the
  FernUniversitaet in Hagen and the IU Internationale Hochschule among its ten largest destinations; file
  che_student_origins_ws2022_23.csv), and local
  enrollment includes students who live elsewhere; it counts all ages for one semester, where the estimates cover
  residents aged 20-29. The third estimate (residents implied by enrollment) follows in Phase 1. (d) The two thresholds
  of the build rule (MIN_RESPONDENTS_PER_CELL and MIN_DIFFERENCE_STANDARD_ERRORS, values in the header of
  student_control_build_rule.csv) are assumptions, not sourced values. (e) This is a measurement, not a validation; no
  reference or ground truth was compared; the owner decides the level from the level gate.
