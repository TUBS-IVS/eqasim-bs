    rule, not confirmations.
validation:
- metric: build-rule verdict per candidate behaviour control (SrV vs MiD, students universe)
  reference: none (measurement)
  result: >-
    Read from docs/runs/artifacts/student-commuting-phase0-reference-2026-11-25/student_control_build_rule.csv
    (columns verdict and difference_in_se): every control is comparison_only. All 14 cells pass rule 1 (at least 30
    SrV respondents); no cell passes rule 2 (more than 2.0 standard errors). Largest absolute difference per control:
    status_x_education_leg 1.902765672 (student_edu; student_noedu -1.902765672), arrival -1.913354468
    (student_no_education_leg), trip_class -1.424407399 (student_trips_1_2), work_leg 1.270387539 (student_nowork;
    student_work -1.270387539), season_ticket 0.9246324781 (student_flatrate; student_no_flatrate -0.9246324781). Rule 3 (one-batch
    smoke) is pending_phase2 for all. Finding for the owner: the status control (students with and without an
    education leg on the reporting day) does not pass the build rule; it sits just below the assumed threshold. The
    first extraction of 2026-11-25, which kept public-holiday reporting days in MiD, had it at 2.180108458, and the
    run before the unknown-day rule for diaries the seed replaces at 1.92565954 (git history of this file), so this
    verdict turns on how MiD reporting days are filtered and on a threshold that is an assumption.
    It also rests on universes that are not identical: the regional survey leaves out students who were away from
    home all day (73 adult students dropped against 438 adult students kept; n_adult_students_away_from_home and
    n_students in the Exclusions header of eqasim-data/data/braunschweig/srv/srv2023_student_behaviour.csv), while
    MiD keeps them; how the share with an education leg would move with them is not measured (the regional survey
    records no day for them). Second finding: the arrival cell student_no_education_leg and the status cell
    student_noedu share one definition, on slightly different control bases (the arrival base leaves out students
    with an unreadable start or arrival hour), so the arrival cell nearly repeats the status difference; none of the
    three arrival-time cells passes rule 2 (generated Overlap line of the same file, which gives both cells'
    unweighted counts and states that the two controls must not be built together). car_availability and
    driving_licence are comparison tables by decision (file student_comparison_only.csv).
- metric: level gate, students aged 20-29, Braunschweig (03101) and the pooled covered area (03ZGB = ZGB without the
    unsurveyed Wolfsburg)
  reference: none (measurement)
  result: >-
    Read from docs/runs/artifacts/student-commuting-phase0-reference-2026-11-25/student_level_gate.csv. Braunschweig
    (03101): srv_estimate_students_20_29_persons is 16776.12607 (residents aged 20-29 of the regional survey, persons
    away from home all day left out) and enrollment_local_sites_persons is 16534 (winter semester 2024/25, as the file
    header states; students of all ages at the local university sites, in-commuters included, residents who study
    elsewhere left out). These are different quantities (limitation c), so the size of their difference does not
    corroborate either figure. Derived from the same row and rounded: the difference srv_estimate_students_20_29_persons
    minus enrollment_local_sites_persons is 242.13 persons, which is 0.195 standard errors of the estimate (its own
    standard error srv_se_student_share_20_29 (0.03382719049) x census_population_20_29_persons (36640) is 1239.43
    persons). Enrollment moves between
    semesters: the committed CHE table (eqasim-data/data/braunschweig/schools/che_student_origins_ws2022_23.csv) has
    the Technische Universitaet Braunschweig at 16809 students in winter semester 2022/23, the site table
    (scripts/seed_lsn_university_sites.py, SITE_ROWS) at 15632 in winter semester 2024/25. The survey's own expansion
    of adult students of all ages in the same row, srv_students_weighted_persons, is 15577.31682. Pooled area
    (03ZGB): the pooled estimate srv_estimate_students_20_29_persons 36697.77653 is the pooled share times the pooled
    census population and differs from the sum of the seven surveyed Kreis rows of that column, 33532.074204 (summed
    from the same file); the survey's own expansion srv_students_weighted_persons is 26214.89897 and the enrollment
    26054 (local sites in four of the seven Kreise; the other three are listed in the file's Exclusions line). All SrV figures exclude persons away from home all day (see
    limitation a). The census-based estimates and the third estimate (residents implied by enrollment, empty until
    Phase 1) are in the same file.
