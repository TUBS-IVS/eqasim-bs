id: vrb-zone-fares-routing-surcharge-1pct-2026-09-25
date: '2026-09-25'
repository:
  commit: ab2a2c90
  branch: feature/i430-vrb-zone-fare-model
  notes: 'A rerun of ONLY the MATSim stage of the ON arm of vrb-zone-fares-smoke-1pct-2026-09-25, on its
    unchanged prepared scenario (prepare cache braunschweig.matsim.simulation.prepare__acc3a371..., built by
    eqasim-bs ab2a2c90), with the JAR of eqasim-java-bs 23e7c66f9 (the long-distance routing surcharge,
    valued per person and trip; ADR-0133 D6) instead of 9998db31d. JAR built on felix from
    ~/eqasim-java-bs-i430 with the pipeline''s own Maven arguments (-Pstandalone --projects braunschweig
    --also-make package -DskipTests=true), sha256
    1b0ac7cb22c7b2c87ad5272d98aa8bd7f9f2c41a36e5c72f9ee48f064c180094. Of the eqasim-bs commits after ab2a2c90,
    only 3d0f5152 changes what prepare writes for this config: the key
    vrb_fare_long_distance_routing_surcharge_enabled (written as vrbFare.longDistanceRoutingSurchargeEnabled,
    passed here on the command line with the same value true); the others flip the production flag (already
    true in the ON overlay), make the polygon input required in the input verifier, or change documentation. The full pipeline was not rerun: the Java change re-validates matsim.runtime.eqasim and with it
    the ~3 h freight extraction, while the question is the routing effect on an identical scenario.'
configuration:
  base: configs/base_bs.yml
  overlays:
  - 'felix:~/i430_vrb_fares_on.yml'
  notes: 'Same MATSim config file as the ON arm of the smoke (prepare cache acc3a371, sha256
    38b7c92f5fbafc3e7657b08bf0e8fe2f86535eb80972b0c81eef78e8b1f9d485) and the same command-line overrides
    as its matsim.simulation.run stage (lastIteration 20, writeEventsInterval 20, writePlansInterval 5,
    global.numberOfThreads 56, qsim.numberOfThreads 16, compressionType gzip, simwrapper true, -Xmx86G),
    plus --config:vrbFare.longDistanceRoutingSurchargeEnabled true. Driver
    felix:~/i430_data/on_surcharge/run_on_surcharge.sh (throwaway, not committed), outputs under
    felix:~/i430_data/on_surcharge/simulation_output.'
sampling:
  rate: 1% (sampling_rate 0.01)
  scope: ZGB-8, full region, cordon on (base configuration)
  notes: 'The ON arm''s population, network, schedule and fare inputs, read unchanged from the prepare
    cache. Every count is a sample count at sampling_rate 0.01, never expanded.'
pipeline:
  targets:
  - matsim.simulation.run (direct RunSimulation, outside synpp)
  notes: 'JAR build 08:40:36 -> 08:41:15, MATSim 08:41:16 -> 09:10:51 CEST (2026-09-25), exit 0, iterations
    0-20. The run.log errors are the SimWrapper post-run analyses (TripAnalysis NumberFormatException,
