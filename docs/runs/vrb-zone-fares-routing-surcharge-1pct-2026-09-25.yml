validation:
- metric: routed PT candidates containing a long-distance ride (fare outcome long_distance_flat), iterations 1-20
  reference: 'the ON arm of vrb-zone-fares-smoke-1pct-2026-09-25 (same prepared scenario, no routing surcharge)'
  result: '51 of 49,984 PT quotes before, 0 of 49,979 after. With the surcharge the router never returned a
    DB Fernverkehr or Flix route for a mode choice candidate; the other outcomes moved by at most a few
    quotes each (e.g. vrb_single_adult 17,744 -> 17,772, no_pt_leg 20,726 -> 20,731).'
  artifact: docs/runs/artifacts/vrb-zone-fares-routing-surcharge-1pct-2026-09-25/summary.json
  notes: 'Quotes are counted per DMC trip estimate, so these are evaluated PT candidates, not chosen trips.'
- metric: the surcharge is active and valued per trip
  reference: 'none -- implementation check'
  result: 'The calculator logged "long-distance routing surcharge on 17 vehicles of 5 lines; reference person
    16025 s (267.1 min)". The reference-fallback warning (a long-distance ride evaluated without a
    per-trip valuation) was logged 0 times. The stop finder''s count line is written every 1,000,000
    searches and did not occur in this 1 % run, so the number of valued searches is not recorded; the
    absent warning is indirect evidence that every evaluated long-distance ride had a per-trip value.'
  artifact: docs/runs/artifacts/vrb-zone-fares-routing-surcharge-1pct-2026-09-25/summary.json
- metric: fallback share and final-plan PT trips
  reference: 'the ON arm of the smoke'
  result: 'Fallback share 0.0000 in every iteration 0-20 (as before). Final plans: 2,637 -> 2,630 PT trips,
    0 of them with a long-distance ride in both runs.'
  artifact: 'docs/runs/artifacts/vrb-zone-fares-routing-surcharge-1pct-2026-09-25/fare_outcomes_after/'
- metric: mode shares of the final iteration
  reference: 'the ON arm of the smoke; a change between runs, not a comparison with observed behaviour'
  result: 'PT 7.08 % -> 7.06 %, car 47.25 % -> 47.27 %, walk 18.61 % -> 18.62 %, car_passenger
    12.04 % -> 12.03 %, bicycle unchanged 10.24 %. The differences are a few trips at this scale and within
    replanning noise; no direction is read from them.'
  artifact: 'docs/runs/artifacts/vrb-zone-fares-routing-surcharge-1pct-2026-09-25/modestats_after.csv,
    docs/runs/artifacts/vrb-zone-fares-smoke-1pct-2026-09-25/modestats_on.csv'
- metric: MATSim runtime per iteration, iterations 1-20
  reference: 'the ON arm of the smoke (same host, same thread settings)'
  result: 'Replanning 1.8 s -> 1.6 s mean, mobsim 68.6 s -> 70.0 s, whole iteration 74.6 s -> 75.8 s. The
    per-search valuation in the stop finder costs no measurable replanning time.'
  artifact: 'docs/runs/artifacts/vrb-zone-fares-routing-surcharge-1pct-2026-09-25/stopwatch_after.csv,
    docs/runs/artifacts/vrb-zone-fares-smoke-1pct-2026-09-25/stopwatch_on.csv'
