## Synthetic population pipeline for the Braunschweig region (ZGB-8, Niedersachsen).
## Population method: popsim_mid (PopulationSim + restricted MiD 2023 raw microdata).
## Sampling rate: 1% (smoke / dev iteration). Adjust sampling_rate as needed.
##
## This config wires the popsim_mid producer and its downstream stage aliases into
## the synpp DAG. Everything outside the popsim-specific sections is identical to
## config_local_braunschweig.yml. The default config is unchanged.
##
## LOCAL-ONLY PATHS: Several paths under braunschweig.population.popsim.* point to
## restricted or large local-only data. Lines marked "# local-only, set to your path"
## must be adjusted to your local layout (see docs/population/DATA_LAYOUT.md).
## The canonical defaults follow the layout from scripts/popsim_mid_smoke.py.

working_directory: eqasim-data/cache_bs_popsim_mid

run:
  - synthesis.output
  - matsim.output
  # VerBindungen sub-Kreis work-OD validation (#124): compares the synthetic
  # home->work assignment against the 2019 VerBindungen QZM reference.
  # Requires eqasim-data/data/verbindungen/ (scripts/download_verbindungen.py).
  - braunschweig.analysis.verbindungen_validation

config:
  processes: 8

  # ENTD 2008 remains the HTS for v1 (keep_bavaria_hts user preference)
  hts: entd

  sampling_rate: 0.01
  random_seed: 1234

  freight_enabled: false  # avoid requiring the local-only german-wide-freight inputs

  # Building-level activity potentials OFF (no local-only parquet required);
  # see the real-data run configs for the ON path.
  work_building_potentials: false
  secondary_building_potentials: false
  education_building_distribution: false

  data_path: eqasim-data/data
  output_path: eqasim-data/output_bs_popsim_mid
  output_prefix: braunschweig_popsim_mid_1pct_

  java_memory: 32G

  home_location_sampling: weighted
  mode_choice: false
  matching_attributes: ["sex", "age_class", "employed", "has_license", "household_size_class", "urban_class"]

  # --- Population method: popsim_mid ----------------------------------------
  # Selects the PopulationSim + MiD 2023 producer (braunschweig.popsim.stage).
  # The selector (braunschweig.population.selector) maps this to the stage but
  # does NOT wire the synpp alias; the aliases block below does that.
  braunschweig.population.method: popsim_mid

  # --- popsim_mid input paths -----------------------------------------------
  # Zensus 2022 INSPIRE grid parquets (large; local-only, not committed).
  # Canonical layout: eqasim-data/data/braunschweig/popsim/cells/
  # See docs/population/DATA_LAYOUT.md for the rename mapping.
  braunschweig.population.popsim.cells_1km_path: eqasim-data/data/braunschweig/popsim/cells/zensus2022_grid_1km_de_binned.parquet  # local-only, set to your path
  braunschweig.population.popsim.cells_100m_path: eqasim-data/data/braunschweig/popsim/cells/zensus2022_grid_100m_de_prepared.parquet  # local-only, set to your path

  # MiD 2023 raw microdata directory (RESTRICTED; scientific-use licence, never committed).
  # Must contain: MiD2023_Haushalte.csv, MiD2023_Personen.csv, MiD2023_Wege.csv
  # Used by braunschweig.popsim.stage (KEY_MID = mid_raw_path) and
  # braunschweig.popsim.trips_stage (mid_dir key). Both point to the same directory.
  braunschweig.population.popsim.mid_raw_path: eqasim-data/data/braunschweig/popsim/mid2023_raw  # local-only, set to your path
  braunschweig.population.popsim.mid_dir: eqasim-data/data/braunschweig/popsim/mid2023_raw  # local-only, same dir as mid_raw_path

  # Control source: the typed catalog (control_spec) is the source of truth and is
  # REQUIRED here because the per-Kreis attribute controls (economic_status /
  # number_of_cars / number_of_bicycles / has_ebike / trip_class) default ON and the
  # hand-edited CSV cannot express them (build_controls_df fail-fasts on csv + active
  # kreis controls). tier0-2 backbone + the default-on kreis attribute controls run from
  # committed data; tier3 + employment_grid are intentionally omitted here (they need the
  # local cleancensus kreis_controls_dir -- see config_server_*_allfeat_popsim.yml).
  braunschweig.population.popsim.controls_source: catalog
  braunschweig.population.popsim.control_tiers: tier0,tier1,tier2

  # PopulationSim control spec and run configs from the popsimprep repo.
  # Canonical: popsimprep/popsim/configs/ (controls_path is UNUSED under controls_source:
  # catalog above -- kept for the csv opt-out / reference).
  braunschweig.population.popsim.controls_path: C:/Users/bienzeisler/Documents/GitHub/popsimprep/popsim/configs/_prep3_controls.csv  # local-only, set to your path
  braunschweig.population.popsim.settings_path: C:/Users/bienzeisler/Documents/GitHub/popsimprep/popsim/configs/settings.yaml  # local-only, set to your path
  braunschweig.population.popsim.logging_path: C:/Users/bienzeisler/Documents/GitHub/popsimprep/popsim/configs/logging.yaml  # local-only, set to your path

  # popsimprep repo root (cwd for `uv run populationsim`).
  braunschweig.population.popsim.popsimprep_dir: C:/Users/bienzeisler/Documents/GitHub/popsimprep  # local-only, set to your path

  # uv executable (used to launch PopulationSim in its own venv).
  braunschweig.population.popsim.uv_path: C:/Users/bienzeisler/.local/bin/uv.exe  # local-only, set to your path

  # Working directory for per-batch PopulationSim folder trees.
  braunschweig.population.popsim.work_dir: eqasim-data/cache_bs_popsim_mid/popsim_work

  # Batch tuning: max 100 m cells per PopulationSim run (default 3000),
  # and number of parallel PopulationSim subprocesses (default 3).
  braunschweig.population.popsim.max_cells: 3000
  braunschweig.population.popsim.num_workers: 3

  # --- R-A: Gravity calibration (TASK-001).
  gravity_slope: -0.065
  gravity_constant: -2.4
  gravity_diagonal: 1.0

  # --- R-A.2: Per-RegioStaR-7 slope (TASK-RS-001).
  gravity_slope_by_regiostar7:
    72: -0.0558   # Regiopole / Grossstadt
    73: -0.0638   # Mittelstadt / staedt. Raum
    74: -0.0640   # Kleinstadt / doerfl. Raum (Stadtregion)
    75: -0.0704   # Zentrale Stadt (laendlich)
    76: -0.0719   # Mittelstadt (laendlich)
    77: -0.0667   # Kleinstadt / doerfl. (laendlich)

  # --- IPF: per-commune household-size margin (Zensus 2022 1000A-2081)
  braunschweig.ipf.use_household_size_margin: true

  # --- IPF: post-formation hh_type assignment (Zensus 2022 1000A-2081)
  braunschweig.ipf.use_household_type_margin: true

  # --- Phase 2 IPF (TASK-010, TASK-011, 2026-04-26)
  braunschweig.ipf.use_employment_margin: true
  braunschweig.ipf.dirichlet_prior_strength: 0.5

  # Germany-wide GTFS (de_full), cut to the enlarged cordon extent (required with
  # cordon_enabled; same value as config_local_braunschweig_25pct_allfeat.yml).
  gtfs_path: gtfs_cordon
  osm_path: osm

  vrb_stations_path: vrb/stations.json

  # --- Braunschweig region scope (ZGB-8) ------------------------------------
  braunschweig.political_prefix:
    - "03101"
    - "03102"
    - "03103"
    - "03151"
    - "03153"
    - "03154"
    - "03157"
    - "03158"

  # --- Input data paths (Braunschweig / Niedersachsen) ----------------------
  braunschweig.population_path: braunschweig/12111-0001_population_ni.xlsx
  braunschweig.employment_path: braunschweig/13111-06-02-4.xlsx
  braunschweig.employment_gemband_path: braunschweig/gemband-dlk-0-202506-xlsx.xlsx
  braunschweig.employees_path: braunschweig/13111-01-03-5.xlsx
  braunschweig.work_flow_path:  braunschweig/pendler_ni.xlsx

  braunschweig.pendler_ein_path: braunschweig/statistik_pendler_2026042493412.csv
  braunschweig.pendler_aus_path: braunschweig/statistik_pendler_2026042493430.csv

  braunschweig.zensus_households_path: braunschweig/5000H-2001_de_flat.csv

  braunschweig.inkar_household_income_path: braunschweig/E_Haushaltseinkommen.xls
  braunschweig.inkar_year: latest

  braunschweig.home_density_weighting: true

  braunschweig.buildings_path: braunschweig/buildings

  osm_path_bavaria: osm/niedersachsen-latest.osm.pbf

  osmosis_binary: C:/Users/bienzeisler/tools/osmosis/osmosis-0.49.2/bin/osmosis.bat
  osmconvert_binary: C:/Users/bienzeisler/tools/osmconvert/osmconvert.exe

  # --- Feature flags --------------------------------------------------------
  # WORK gravity at TAZ (sub-commune) resolution: fixes intra-city commute
  # distances in kreisfreie Staedte (e.g. Braunschweig). Requires local-only
  # RVB VISUM Verkehrszellen data (gitignored). Default OFF; set to true only
  # in configs where that proprietary parquet is present.
  taz_work_location_choice: false

  # Education gravity over the real NDS school/Kita/Hochschule registers
  # (ON per the default-ON rule; calibrated slopes below are copied from
  # config_local_braunschweig_25pct_allfeat.yml).
  education_gravity_enabled: true

  education_gravity_slope_by_level_rs7:
    kindergarten: {72: -3.0000, 73: -2.0251, 74: -3.0000, 75: -3.0000, 76: -0.5167, 77: -2.8138}
    grundschule: {72: -1.3354, 73: -0.6835, 74: -0.4507, 75: -1.0793, 76: -0.1248, 77: -0.2412}
    sekundar_1: {72: -0.4944, 73: -0.2383, 74: -0.4303, 75: -0.5700, 76: -0.1568, 77: -0.1160}
    oberstufe: {72: -1.5100, 73: -0.7650, 74: -3.0000, 75: -1.2588, 76: -1.2588, 77: -1.2588}
    bbs: {72: -0.0350, 73: -0.0898, 74: -0.1524, 75: -0.0666, 76: -0.1346, 77: -3.0000}

  education_bbs_share: 0.681

  education_university_slope: -0.1415
  education_university_max_radius_km: 150.0

  # --- Feature parity with config_local_braunschweig_25pct_allfeat.yml -------
  # Project rule: flag-gated model features default ON in run configs so they
  # are not forgotten. Values copied 1:1 from the validated all-features run.

  # Household vehicle fleet (real NDS fleet sampling + HSN/TSN attributes).
  vehicles_method: household
  fleet_model_enabled: true
  fleet_model_brands: true
  fleet_hsn_tsn_attributes: true
  fleet_electric_calibration: kreis_mix_gemeinde_bev_tilt

  # Urban parking (3 EUR/h for non-resident car trips into the BS inner ring).
  enable_urban_parking: true

  # Household fleet routing-consistency: re-mode the initial car-driver legs of
  # carless persons (0-car households own no "car" vehicle) to car_passenger
  # before MATSim's pre-loop routing. Required with vehicles_method=household.
  remode_carless_car_legs: true

  # Secondary-location chain solving: parallelised (seeded per shard ->
  # reproducible for a fixed worker count).
  braunschweig.chainsolvers.parallel: true
  braunschweig.chainsolvers.processes: 8

  # Cross-cordon external demand (einpendler injection). Enlarges the OSM
  # network clip, cuts the prepared scenario at the cordon, and injects
  # in-commuter agents at the terminal MATSim writers (see the
  # braunschweig.matsim.scenario.* aliases below -- without them this flag
  # does nothing).
  cordon_enabled: true
  cordon_network_source_buffer_m: 30000     # 30 km network ring beyond the ZGB outline
  cordon_network_buffer_fraction: 0.10      # cordon = ZGB + 10% of half-diagonal (~7.6 km)

  # Student in-commuters (#140): default-ON tri-state, dependency-gated on
  # education_gravity_enabled (already true above). Explicit here for visibility
  # per the "feature parity" rule -- unset also resolves to true given the parent
  # is on, so this line does not change behaviour (see
  # braunschweig/synthesis/student_incommuters.py::_active and
  # docs/features/student-incommuters.md).
  cordon_student_incommuters_enabled: true

  # Build our OWN editable Java project (../eqasim-java-bs, braunschweig module) -
  # REQUIRED for the cordon scenario cutter (org.eqasim.braunschweig.* +
  # RunScenarioCutter).
  eqasim_source_path: ../eqasim-java-bs

  # --- Spatial income tilt (Nettokaltmiete GAMMA layer) -----------------------
  # Within-Kreis income redistribution guided by per-cell net cold rent (renters)
  # and Eigentümerquote (owners). Default ON (project rule). Preserves per-Kreis
  # income mean exactly. Set to false to reproduce the pre-tilt income distribution.
  braunschweig.population.popsim.income_spatial_tilt: true
  braunschweig.population.popsim.income_tilt_beta: 0.3
  braunschweig.population.popsim.income_tilt_clip: 0.30

  # --- placement_income (L2, issue #108) --------------------------------------
  # Each synthetic household keeps its OWN MiD income (a seeded draw within its own
  # hheink_gr1 bracket); the per-Kreis INKAR relativity is approached by signature-
  # preserving donor reallocation after the popsim merge (every control aggregate and
  # every donor's clone count are preserved). Default ON (project rule). When ON it
  # OVERRIDES both income_kreis_control (the per-Kreis redraw) and income_spatial_tilt
  # above (each override is logged). Set to false to fall back to the redraw + tilt path.
  braunschweig.population.popsim.placement_income: true

  # --- Kreis-Income-Control (real MiD income draw + max-entropy per-Kreis calibration) -
  # Replaces the class-midpoint x INKAR_scale income with a real continuous MiD draw,
  # reshaped per Kreis to the construct-corrected INKAR target. Default ON; set to false
  # to reproduce the legacy midpoint x INKAR_scale income byte-identically.
  braunschweig.population.popsim.income_kreis_control: true
  braunschweig.population.popsim.income_draw_method: combined
  braunschweig.population.popsim.income_kreis_control_hhsize_correct: true
  # Open-top (>7000 EUR) income tail: truncated Pareto (alpha ~3.0 for German net-HH
  # income; Bach/Corneo/Steiner 2013, Toda et al. 2020) instead of the exponential
  # fallback. Default ON.
  braunschweig.population.popsim.income_open_top_pareto: true
  braunschweig.population.popsim.income_open_top_pareto_alpha: 3.0

  # Legacy-IPF-only flags intentionally absent (popsim replaces the enriched
  # stage: synthesis.population.enriched -> braunschweig.popsim.enriched_adapter
  # and data.census.filtered -> braunschweig.popsim.stage, so these would be
  # dead keys here): reactivate_person_attributes, status_from_hhtype,
  # consistent_car_availability, cars_income_aware, income_eur_from_distribution,
  # synthesise_housing_tenure, pt_subscription_conditioned,
  # braunschweig.ipf.use_joint_age_size_margin,
  # braunschweig.ipf.age_aware_chunking, braunschweig.chunking.sex_aware_couples.

# --- Aliases ------------------------------------------------------------------
# Same pattern as config_local_braunschweig.yml. The key difference from the
# default config is the data.census.filtered alias, which is redirected from
# the IPF producer (braunschweig.ipf.attributed) to the popsim_mid producer
# (braunschweig.popsim.stage). The selector (braunschweig.population.selector)
# only resolves the producer name; wiring the synpp alias is this config's job.
# The trips and enriched stages are also replaced by their popsim_mid variants.
aliases:
  # popsim_mid producer: replaces the IPF chain for population synthesis.
  # Default config uses: data.census.filtered: braunschweig.ipf.attributed
  data.census.filtered: braunschweig.popsim.stage

  # popsim_mid trips stage: builds the MiD Wege trip table in the
  # synthesis.population.trips contract (departure/arrival times, mode, purpose).
  synthesis.population.trips: braunschweig.popsim.trips_stage

  # popsim_mid enriched adapter: maps source_* provenance to the writer's id
  # fields (hts_id / hts_household_id) without an HTS matching step.
  synthesis.population.enriched: braunschweig.popsim.enriched_adapter

  # popsim_mid commute-distance stage: takes work/education commute distances
  # directly from the MiD donor trips (no HTS join needed).
  synthesis.population.spatial.commute_distance: braunschweig.popsim.commute_distance

  # popsim_mid secondary distance distributions: builds mode x travel-time CDFs
  # from the German MiD 2023 Wege survey instead of the French ENTD, so secondary
  # activities are placed at German empirical distances (bug D3 fix).
  synthesis.population.spatial.secondary.distance_distributions: braunschweig.popsim.distance_distributions

  # --- All other aliases are identical to config_local_braunschweig.yml -----
  synthesis.population.income.selected: braunschweig.synthesis.income
  synthesis.population.spatial.home.zones: braunschweig.synthesis.spatial.home_zones
  synthesis.locations.home.locations: braunschweig.locations.home
  # popsim cell->building handoff: place each household in a building INSIDE its
  # real Zensus 2022 100 m cell (ZENSUS100m, EPSG:3035) instead of the legacy
  # Gemeinde-level area-weighted sampling. Replaces the FINAL home-point stage, so
  # the two input aliases above are no longer reached for popsim (left harmless).
  synthesis.population.spatial.home.locations: braunschweig.synthesis.locations.home_cell
  synthesis.locations.education: eqasim_common.locations.education
  synthesis.locations.secondary: braunschweig.locations.secondary
  synthesis.population.spatial.secondary.locations: braunschweig.synthesis.locations.secondary_chainsolvers
  synthesis.locations.work: braunschweig.locations.work
  data.od.weighted: braunschweig.gravity.model
  data.spatial.iris: eqasim_common.data.spatial.iris
  data.spatial.codes: eqasim_common.spatial.entd_codes
  synthesis.population.spatial.primary.locations: braunschweig.locations.synthesis.replacement_education_gravity
  matsim.simulation.prepare: braunschweig.matsim.simulation.prepare

  # Cross-cordon einpendler injection: terminal injection at the MATSim writers
  # (no-op when cordon_enabled=false). Resident synthesis chain untouched.
  matsim.scenario.population: braunschweig.matsim.scenario.population
  matsim.scenario.households: braunschweig.matsim.scenario.households
  matsim.scenario.vehicles: braunschweig.matsim.scenario.vehicles
  matsim.scenario.facilities: braunschweig.matsim.scenario.facilities
