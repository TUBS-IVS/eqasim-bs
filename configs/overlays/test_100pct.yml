## 100% all-features overlay (full region, full pipeline, 0 MATSim iterations).
## matsim_last_iteration: 0 is deliberate (ADR-0070): this overlay is the full-scale
## pipeline run without MATSim replanning. A production MATSim run overrides the value
## per run (the eqasim mode-share termination may stop it earlier); the value used must be
## recorded in a run manifest under docs/runs/, not here. For prod100_20261031 it is in
## docs/runs/prod100-java-heap-driver-rss-2026-11-04.yml; prod100_20260925 has no manifest
## of its own (see docs/runs/freight-boundary-links-prod100-2026-10-15.yml).
## Memory-bound scale. num_workers "auto": the resource gate (ADR-0126,
## braunschweig/resources.py) sizes the PopulationSim batch workers at the stage start from the
## machine's memory budget minus the driver's live resident memory, divided by worker_memory_gb
## (configs/base_bs.yml; the 30 GiB default unless both run-time options of issue #656 are on),
## and at most the core budget (braunschweig.resources.effective_popsim_workers, all figures in
## GiB). Until issue #656 this overlay pinned 3, which the 30 GiB default clamped to 2 on the run
## server (run prod100_20261031; per-worker peak: docs/runs/prod100-java-heap-driver-rss-2026-11-04.yml).
## Owner decision 2026-11-20: let the gate fill the machine. ASSUMPTION: other jobs on the shared
## run server leave the budget free (override with EQASIM_MEM_BUDGET). The worker count cannot
## change results (braunschweig.resources.resolve_popsim_workers); issue #281 tunes it on the
## full rerun.
working_directory: eqasim-data/cache_bs_100pct_allfeat_popsim

run:
  - synthesis.output
  - matsim.output
  - braunschweig.analysis.cordon_validation
  - braunschweig.analysis.simwrapper_export
  - braunschweig.analysis.analysis_suite
  - braunschweig.analysis.synthesis.plan_structure_vs_srv
  - braunschweig.analysis.synthesis.departure_time_vs_srv
  - braunschweig.analysis.verbindungen_validation
  - braunschweig.analysis.synthesis.commute_distance_by_kreis
  - braunschweig.analysis.synthesis.work_participation_by_kreis

config:
  sampling_rate: 1.0
  output_path: eqasim-data/output_bs_100pct_allfeat_popsim
  analysis_working_directory: eqasim-data/cache_bs_100pct_allfeat_popsim
  output_prefix: braunschweig_100pct_allfeat_popsim_
  matsim_last_iteration: 0
  braunschweig.population.popsim.work_dir: eqasim-data/popsim_work_allfeat_opt
  braunschweig.population.popsim.max_cells: 750
  braunschweig.population.popsim.num_workers: "auto"
  cache_share_export: true
  cache_share_recompute: []
