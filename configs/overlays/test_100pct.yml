## 100% all-features overlay (full region, full pipeline, 0 MATSim iterations).
## Memory-bound scale. num_workers 3 is a ceiling: the resource gate (ADR-0126,
## braunschweig/resources.py) clamps it at run start to what the machine's memory
## budget allows. The run server has 94.28 GiB total memory (recorder value, see
## docs/runs/chainsolver-worker-private-memory-2026-09-17.yml). The gate sizes each
## worker at its 30 GB default (DEFAULT_POPSIM_WORKER_MEMORY_GB), so run prod100_20261031
## (2026-10-31) was clamped from 3 to 2 workers.
working_directory: eqasim-data/cache_bs_100pct_allfeat_popsim

run:
  - synthesis.output
  - matsim.output
  - braunschweig.analysis.cordon_validation
  - braunschweig.analysis.simwrapper_export
  - braunschweig.analysis.analysis_suite
  - braunschweig.analysis.synthesis.plan_structure_vs_srv
  - braunschweig.analysis.synthesis.departure_time_vs_srv
  - braunschweig.analysis.verbindungen_validation
  - braunschweig.analysis.synthesis.commute_distance_by_kreis
  - braunschweig.analysis.synthesis.work_participation_by_kreis

config:
  sampling_rate: 1.0
  output_path: eqasim-data/output_bs_100pct_allfeat_popsim
  analysis_working_directory: eqasim-data/cache_bs_100pct_allfeat_popsim
  output_prefix: braunschweig_100pct_allfeat_popsim_
  matsim_last_iteration: 0
  braunschweig.population.popsim.work_dir: eqasim-data/popsim_work_allfeat_opt
  braunschweig.population.popsim.max_cells: 750
  braunschweig.population.popsim.num_workers: 3
  # OPTIMIZED per-control importance weights (control_spec.IMPORTANCE_PROFILES):
  # lowered the count-weighted Gesamtabweichung 3.365% -> 2.868% on batch_020.
  braunschweig.population.popsim.importance_profile: optimized_2026_06_30
  cache_share_export: true
  cache_share_recompute: []
