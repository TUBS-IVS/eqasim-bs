## SrV location-types validation reuse run (issue #262): 5% downstream on the
## completed 100% popsim batches, mirroring overlays/escort_reuse_5pct.yml.
## SERVER paths: popsim_work_escort_reuse is a copy of popsim_work_allfeat_opt
## (popsim is SKIPPED -> no PopulationSim workers; num_workers: 3 is a
## fail-safe only). cache_share_export: false -> this run never writes the
## shared store. The A run uses the composed base as-is
## (secondary_srv_location_types: true); the B run toggles the flag to false
## on a server-local config copy with working_directory/output_path suffixed
## _off (see docs/features/secondary-location-types.md, A/B recipe).
working_directory: eqasim-data/cache_bs_5pct_srv262

run:
  - synthesis.output

config:
  sampling_rate: 0.05
  output_path: eqasim-data/output_bs_5pct_srv262
  analysis_working_directory: eqasim-data/cache_bs_5pct_srv262
  output_prefix: braunschweig_5pct_srv262_
  matsim_last_iteration: 0
  braunschweig.population.popsim.work_dir: eqasim-data/popsim_work_escort_reuse
  braunschweig.population.popsim.max_cells: 750
  braunschweig.population.popsim.num_workers: 3
  braunschweig.population.popsim.importance_profile: optimized_2026_06_30
  cache_share_export: false
  cache_share_recompute: []
