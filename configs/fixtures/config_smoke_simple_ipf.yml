## Synthetic population pipeline for the Braunschweig region (ZGB-8, Niedersachsen).
## Sampling rate: 1% (smoke / dev iteration).
## Forked stages live in `braunschweig/` and `eqasim_common/`; the remaining
## bavaria.* stages still referenced are inherited utilities pending Phase 4.
## Required input data: see eqasim-data/DOWNLOAD_CHECKLIST_BS.md.

working_directory: eqasim-data/cache_smoke_ipf

run:
  - synthesis.output

config:
  processes: 8

  # ENTD 2008 remains the HTS for v1 (keep_bavaria_hts user preference)
  hts: entd

  sampling_rate: 0.01
  random_seed: 1234

  freight_enabled: false  # avoid requiring the local-only german-wide-freight inputs

  # Building-level activity potentials OFF (no local-only parquet required);
  # see the real-data run configs for the ON path.
  work_building_potentials: false
  secondary_building_potentials: false
  education_building_distribution: false

  data_path: eqasim-data/data
  output_path: eqasim-data/output_bs
  output_prefix: braunschweig_1pct_

  java_memory: 32G

  home_location_sampling: weighted
  mode_choice: false
  # Optimization step (1): richer exogenous HTS matching keys. See
  # config_local_braunschweig_25pct.yml for the full rationale.
  matching_attributes: ["sex", "age_class", "employed", "has_license", "household_size_class", "urban_class"]

  # --- R-A: Gravity calibration (TASK-001).
  # Poisson-GLM MLE on BA Pendleratlas (α_O+γ_D+β d_ij; 939 ZGB pairs)
  # → β=−0.065 ± 0.0002, log-L +82 % vs default −0.18.
  # Note: braunschweig.gravity.model post-IPFs Gemeinde flows against
  # BA Kreis totals, so β affects only sub-Kreis distribution
  # (commute_distance KPI is MiD-P13-overridden, see commute_distance.py).
  gravity_slope: -0.065
  gravity_constant: -2.4
  gravity_diagonal: 1.0

  # --- R-A.2: Per-RegioStaR-7 slope (TASK-RS-001).
  # Origin-Gemeinde distance-decay slope keyed by the BMV/BBSR RegioStaR-7
  # class (71..77); origins whose code is not listed fall back to
  # ``gravity_slope`` above. Values are an identified full-panel Poisson GLM
  # (origin FE + dest FE + RS7 x distance) on the 225 km ring around ZGB
  # (141 anchor Kreise), rescaled so the flow-weighted mean over the ZGB codes
  # equals ``gravity_slope``. Direction: urban (72) flatter -> longer commutes,
  # rural region (75-77) steeper -> shorter. See CLAUDE.md "Gravity model" and
  # scripts/calibrate_gravity_per_rs7.py --anchor-scope ring.
  gravity_slope_by_regiostar7:
    72: -0.0558   # Regiopole / Grossstadt
    73: -0.0638   # Mittelstadt / staedt. Raum
    74: -0.0640   # Kleinstadt / doerfl. Raum (Stadtregion)
    75: -0.0704   # Zentrale Stadt (laendlich)
    76: -0.0719   # Mittelstadt (laendlich)
    77: -0.0667   # Kleinstadt / doerfl. (laendlich)

  # --- IPF: per-commune household-size margin (Zensus 2022 1000A-2081)
  braunschweig.ipf.use_household_size_margin: true

  # --- IPF: post-formation hh_type assignment (Zensus 2022 1000A-2081)
  # Draws one Familien-Haushaltstyp per household within its
  # (commune_id, hh_size) bucket. No cell-explosion in the IPF itself.
  braunschweig.ipf.use_household_type_margin: true

  # --- Phase 2 IPF (TASK-010, TASK-011, 2026-04-26) ----------------------
  # 4-way IPF (sex × age × hh_size × employment) with Dirichlet
  # smoothing. Outer-product proxy when no external CSV is supplied.
  braunschweig.ipf.use_employment_margin: true
  braunschweig.ipf.dirichlet_prior_strength: 0.5

  # --- IPF household realism (#251): joint age x household-size margin
  # (ADR-0004), age-aware household composition (ADR-0005), sex-aware couple
  # pairing (ADR-0006). All three require the size margin above; sex-aware
  # pairing additionally requires age-aware chunking. See
  # config_local_braunschweig_25pct.yml for the full rationale and the
  # provenance caveats on the two hardcoded shares.
  braunschweig.ipf.use_joint_age_size_margin: true
  braunschweig.ipf.age_aware_chunking: true
  braunschweig.chunking.sex_aware_couples: true

  gtfs_path: gtfs
  osm_path: osm

  # VRB tariff zones (Verkehrsverbund Region Braunschweig).
  # Built by scripts/build_vrb_stations_json.py from GTFS stops + VRB Waben
  # polygons; consumed by braunschweig.data.vrb.zones (analogue of the
  # MVG stage). See DOWNLOAD_CHECKLIST_BS.md entry D3.
  vrb_stations_path: vrb/stations.json

  # --- Braunschweig region scope -----------------------------------------
  # Zweckverband Großraum Braunschweig (ZGB) — 8 Kreise (~1.13 M EW),
  # matches the region reported in the MiD 2023 regional tables (sample 7555).
  # Göttingen (03159) and Northeim (03155) are EXCLUDED (outside ZGB).
  #   03101 SK Braunschweig, 03102 SK Salzgitter, 03103 SK Wolfsburg,
  #   03151 LK Gifhorn,      03153 LK Goslar,     03154 LK Helmstedt,
  #   03157 LK Peine,        03158 LK Wolfenbüttel
  braunschweig.political_prefix:
    - "03101"
    - "03102"
    - "03103"
    - "03151"
    - "03153"
    - "03154"
    - "03157"
    - "03158"

  # --- Input data paths (Braunschweig / Niedersachsen) ---------------------
  # GENESIS / Regionaldatenbank exports for Niedersachsen
  braunschweig.population_path: braunschweig/12111-0001_population_ni.xlsx
  # Fork-spezifische Pfade (braunschweig.* — siehe braunschweig/data/census/*)
  braunschweig.employment_path: braunschweig/13111-06-02-4.xlsx
  braunschweig.employment_gemband_path: braunschweig/gemband-dlk-0-202506-xlsx.xlsx
  braunschweig.employees_path: braunschweig/13111-01-03-5.xlsx
  braunschweig.work_flow_path:  braunschweig/pendler_ni.xlsx

  # BA Pendleratlas 2025 (Beschäftigtenstatistik, Gebietsstand 6/2025)
  # Kreis→Kreis OD-Matrix für Einpendler (Arbeitsort ZGB) und Auspendler
  # (Wohnort ZGB). Genutzt von braunschweig.gravity.model zur Kalibrierung.
  braunschweig.pendler_ein_path: braunschweig/statistik_pendler_2026042493412.csv
  braunschweig.pendler_aus_path: braunschweig/statistik_pendler_2026042493430.csv

  # Zensus 2022 — Haushalte nach Gemeinde × Größe × Typ (Tabelle 5000H-2001,
  # Flatfile-Download von ergebnisse.zensus2022.de). Ersetzt die MiD-basierte
  # Näherung sowie Bavarias GENESIS 12211-105. Registergestützte Vollerhebung,
  # Referenz-Stichtag 2022-05-15.
  braunschweig.zensus_households_path: braunschweig/5000H-2001_de_flat.csv

  # BBSR INKAR Indikatorenexport "Haushaltseinkommen" (€/EW/Monat je Kreis,
  # Zeitreihe 2000–2021). Liefert die fehlende Kreis-Dimension für die
  # regionslose MiD H4 Quintil-Verteilung. Wird in enriched.py multiplikativ
  # auf die Class-Midpoints angewandt (vgl. Wolfsburg 2197 € vs. Goslar 1905 €).
  braunschweig.inkar_household_income_path: braunschweig/E_Haushaltseinkommen.xls
  braunschweig.inkar_year: latest

  # TASK-003: Density-weighted home sampling. Multiplies per-building
  # area weight by spatially-joined Zensus 2022 100m population, then
  # normalises per Gemeinde so inter-Gemeinde totals stay pinned.
  braunschweig.home_density_weighting: true

  # LGLN Hausumringe Niedersachsen (Shapefile deliveries)
  braunschweig.buildings_path: braunschweig/buildings

  # Geofabrik snapshot for Niedersachsen
  osm_path_bavaria: osm/niedersachsen-latest.osm.pbf

  # External toolchain (Windows paths)
  osmosis_binary: C:/Users/bienzeisler/tools/osmosis/osmosis-0.49.2/bin/osmosis.bat
  osmconvert_binary: C:/Users/bienzeisler/tools/osmconvert/osmconvert.exe

  # --- Feature flags -----------------------------------------------------------
  # OFF (false, default): education locations come from the OSM per-person
  # sampler (eqasim_common.locations.synthesis.education) -> byte-identical to
  # the legacy replacement stage. ON: capacity-constrained gravity model
  # (braunschweig.synthesis.locations.education_gravity, NDS school register).
  education_gravity_enabled: false

  # Per-(RegioStaR-7, level) education decay slopes, calibrated against MiD 2023
  # Tabelle 43 (school-trip length by raumtyp x age group) on the 25% synthesis
  # via scripts/calibrate_education_slopes.py (detour factor 1.3). Unset (None)
  # -> fall back to the scalar education_gravity_slope_by_level. Re-run the
  # calibration script and paste its YAML to update; do not hand-tune.
  # Note: sekundar_2 rural cells (74/77) sit at the -3.0 floor (sparse rural
  # Oberstufe/BBS -> nearest school already ~10 km; see calibration_summary.md).
  education_gravity_slope_by_level_rs7:
    kindergarten: {72: -3.0000, 73: -2.0251, 74: -3.0000, 75: -3.0000, 76: -0.5167, 77: -2.8138}
    grundschule: {72: -1.3354, 73: -0.6835, 74: -0.4507, 75: -1.0793, 76: -0.1248, 77: -0.2412}
    sekundar_1: {72: -0.4944, 73: -0.2383, 74: -0.4303, 75: -0.5700, 76: -0.1568, 77: -0.1160}
    oberstufe: {72: -1.5100, 73: -0.7650, 74: -3.0000, 75: -1.2588, 76: -1.2588, 77: -1.2588}
    bbs: {72: -0.0350, 73: -0.0898, 74: -0.1524, 75: -0.0666, 76: -0.1346, 77: -3.0000}

  # Share of upper-secondary (age 16-19) pupils assigned to berufsbildende
  # Schulen (BBS); the rest go to academic Oberstufe. NDS enrollment ~0.681.
  education_bbs_share: 0.681

  # University (Hochschule) students (age 20+): singly-constrained distance-decay
  # over real LSN-enrollment campus points (braunschweig.data.schools.university_
  # facilities). Slope calibrated so the mean ZGB student commute matches the
  # Destatis MZ 2024 Hochschule mean (~15.2 km straight-line); ~91% study locally
  # (TU BS/Ostfalia/Clausthal/HBK), ~9% commute to Hildesheim/Hannover/Harz/
  # Magdeburg/Goettingen.
  education_university_slope: -0.1415
  education_university_max_radius_km: 150.0

# --- Aliases ------------------------------------------------------------------
# Same pattern as config_local_bavaria.yml but with three census loaders and the
# buildings loader redirected to the forked Braunschweig implementations.
aliases:
  # Top-level overrides (identical to Bavaria — reuse the bavaria.* stages)
  data.census.filtered: braunschweig.ipf.attributed
  synthesis.population.income.selected: braunschweig.synthesis.income
  synthesis.population.spatial.home.zones: braunschweig.synthesis.spatial.home_zones
  synthesis.locations.home.locations: braunschweig.locations.home
  synthesis.locations.education: eqasim_common.locations.education
  synthesis.locations.secondary: braunschweig.locations.secondary
  # Phase 2 (TASK-CS01, 2026-04-26): chainsolvers carla solver as a
  # drop-in replacement for the legacy RDA secondary-location stage.
  synthesis.population.spatial.secondary.locations: braunschweig.synthesis.locations.secondary_chainsolvers
  # Work-locations: Bavaria ALKIS/OSM pool for ZGB-8 + one synthetic
  # workplace per external Kreis derived from BA Pendler outbound.
  # Required so ~28% of ZGB commuters can reach workplaces outside the
  # 8-Kreis scope (BA P2025 reports 61 160 SvB outbound). See
  # braunschweig/locations/work.py + braunschweig/data/external_workplaces.py.
  synthesis.locations.work: braunschweig.locations.work
  # OD-Matrix: BA Pendleratlas 2025 auf Kreis-Ebene (empirisch beobachtet)
  # kalibriert den Bavaria-Gravity-Output auf Gemeinde-Ebene.
  data.od.weighted: braunschweig.gravity.model
  data.spatial.iris: eqasim_common.data.spatial.iris
  data.spatial.codes: eqasim_common.spatial.entd_codes
  synthesis.population.spatial.primary.locations: braunschweig.locations.synthesis.replacement_education_gravity
  # Enriched-population stage: point directly to the Braunschweig fork so
  # synpp's single-step alias resolution picks it up (synpp.resolve_stage
  # substitutes once, so aliasing via the intermediate bavaria.* entry below
  # would silently fall back to the Bavaria delegate).
  synthesis.population.enriched: braunschweig.synthesis.population.enriched
  matsim.simulation.prepare: braunschweig.matsim.simulation.prepare

  # Region-specific loader overrides: redirect selected eqasim_common.data.* stages
  # to their Braunschweig forks. Only stages whose input layout differs.
  # Population fork uses urbistat.com scraped data (11-class age scheme)
  # Employment fork uses GENESIS 13111-06-02-4 (Wohnort x Alter x Geschlecht)
  # Employees-at-workplace fork uses GENESIS 13111-01-03-5 (SvB Arbeitsort, Gemeinde)
  # MiD 2023 Großraum Braunschweig (infas sample 7555, 8 Teilgebiete = ZGB Kreise).
  # Replaces the hard-coded Munich 2017 values from bavaria/data/mid/data.py.
  # Household size and income from MiD 2023 H1/H4 — replaces Bavaria-specific
  # GENESIS files (12211-105 / 12211-101) that are not available for NDS.
  # Enriched-population fork: already registered directly as
  # synthesis.population.enriched above (synpp resolves aliases only one
  # step deep, so chaining via bavaria.synthesis.population.enriched would
  # be ignored).
  # Buildings fork: ALKIS Hausumringe NDS (LGLN) preprocessed to GeoParquet
  # via scripts/preprocess_alkis_landuse.py, filtered to residential AAA-GFK
  # codes. See braunschweig/data/buildings.py for the area / activity rules.
  # Activity-locations fork: ALKIS GFK codes + ATKIS landuse polygons
  # replace the OSM-tag based bavaria stage. Feeds work / education /
  # secondary samplers directly — no OSM parsing needed anymore.
  # Commute-distance fork: overrides the ENTD-sampled work commute
  # distances with MiD 2023 P13 Kreis-level distributions for ZGB
  # residents. See braunschweig/synthesis/spatial/commute_distance.py.
  synthesis.population.spatial.commute_distance: braunschweig.synthesis.spatial.commute_distance
