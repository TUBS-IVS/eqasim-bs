## BASE config for all Braunschweig (ZGB-8) all-features popsim_mid runs.
## NOT runnable alone: per-scale keys (working_directory, run, sampling_rate,
## output paths, worker counts, matsim_last_iteration, ...) live in
## configs/overlays/*.yml and are deep-merged over this base by
##   python scripts/run_synpp.py configs/base_bs.yml configs/overlays/<scale>.yml
## (scripts/run_synpp.py writes the resolved doc to
## <working_directory>/.merged_config.yml and runs that file; every overridden
## key is logged as [config-merge]). Everything FIXED across scales lives here
## exactly once, so feature wiring cannot drift between scales again
## (see docs/superpowers/specs/2026-07-20-config-composition-cleanup-design.md).
##
## PREREQUISITES on the server (see the runbook in docs/runs/):
##   1. git pull in ~/eqasim-bs
##   2. eqasim-data/data synced (incl. braunschweig/popsim/{cells,mid2023_raw} +
##      braunschweig/freight/german-wide-freight-v3 + osm/cordon ring + gtfs_cordon)
##      via scripts/sync_data_to_server.ps1
##   3. popsimprep repo cloned at /home/felix/popsimprep
##   4. uv installed at /home/felix/.local/bin/uv
##   5. sibling Java project at ~/eqasim-java-bs (eqasim_source_path)

config:
  processes: 32
  hts: entd
  random_seed: 1234

  freight_enabled: true

  # Building-level activity potentials (OSM/ALKIS redistribution, TUBS-IVS
  # Activities-and-Potentials-Calculation-Pipeline). Aggregate references
  # (Census SvB, NDS) stay authoritative; the gpkg supplies the within-zone
  # building weight. Requires the local-only parquet (see
  # scripts/import_building_activity_potentials.py).
  building_potentials_path: braunschweig/buildings/building_activity_potentials.parquet
  work_building_potentials: true
  secondary_building_potentials: true
  secondary_other_smart_potential: true
  secondary_other_broad_share: 0.54
  secondary_other_errand_share: 0.46
  secondary_other_min_volume_m3: 50.0
  secondary_other_cap_percentile: 0.99
  # Part B scorer scale-alignment -- byte-identical defaults until calibrated:
  secondary_scorer_attr_transform: linear
  secondary_scorer_selection: top_n
  secondary_external_candidates: true
  secondary_scorer_mode: combined
  secondary_scorer_pot_weight: 1.0
  secondary_scorer_dist_dev_weight: 1.0
  # Purpose-resolved secondary distances (MiD, popsim_mid). Tier 1: distance
  # distributions per (purpose x mode); Tier 2: shop daily/non-daily split
  # (distance + retail_daily/non_daily placement). Defaults False elsewhere ->
  # byte-identical. See docs/superpowers/specs/2026-06-25-purpose-resolved-secondary-distances-design.md
  secondary_distance_by_purpose: true
  secondary_shop_daily_split: true
  # Tier 2 leisure (4-group: local/visit/activity/excursion) + other/errand
  # subtype split (issue #127). Defaults False elsewhere -> byte-identical.
  # See docs/superpowers/specs/2026-07-09-wzwd-leisure-errand-split-design.md
  secondary_leisure_subtype_split: true
  secondary_other_subtype_split: true
  # Places leisure_visit legs on residential building potential (pot_visit)
  # instead of the generic leisure potential; requires the leisure split above.
  leisure_visit_building_potential: true
  secondary_distance_min_obs: 30
  # Escort as dedicated activity purpose (issue #201, analog eqasim-france #495).
  # Location-type draw weights derived from SrV 2023 BS+RGB V_ZWECK_BHOL
  # (scripts/derive_escort_location_weights.py ->
  # eqasim-data/data/braunschweig/srv/srv2023_escort_destination_types.csv;
  # GEWICHT_W-weighted, 98.8% coverage). Defaults False in code -> byte-identical OFF.
  escort_purpose: true
  escort_locations_activities: [edu_kindergarten, edu_school, edu_university, other, leisure, residential, shop]
  escort_locations_weights: [0.433, 0.199, 0.004, 0.141, 0.113, 0.105, 0.005]
  # Phase 2: anchor escort activities at the education location of the youngest
  # child (<= max age) in the same household; unlinked escorters use the draw.
  escort_household_link: true
  escort_household_link_max_child_age_years: 17
  # A3: per-destination-type escort distance layers -- SrV between-type structure
  # factors on the MiD escort level (srv2023_escort_distance_factors.csv).
  escort_distance_by_type: true
  # Passive escort side (issue #256): MiD W_ZWECK 13 legs (the escorted child's
  # own leg; 100% minors) become the child's own education trip at their own
  # assigned Kita/school. Active Bringen/Holen (code 6) stays 'escort'.
  escort_passive_education: true
  # Explicit W_ZWECK purposes (issue #241, ADR-0091): MiD codes 14 Sport/Sportverein,
  # 15 Freunde besuchen/treffen and 16 Unterricht (nicht Schule) map to 'leisure' instead of
  # reaching 'other' through a silent fillna. Verified on the raw Wege file: 3.03% of all legs
  # (W_GEW-weighted) used to arrive at their purpose by fallback, 1.06% of them these three
  # codes. false reproduces the pre-#241 assignment for the A/B.
  explicit_round_trip_purposes: true
  education_building_distribution: true
  # SrV-grounded location types for leisure/other secondary activities (issue
  # #262). Every leisure/other leg draws an OBSERVED SrV 2023 BS+RGB location
  # category conditioned on (E_HVM_5 mode, euclidean-equivalent distance band)
  # AFTER its desired distance is sampled (design A2;
  # docs/superpowers/specs/2026-08-12-srv-location-types-design.md); the drawn
  # category -- not the MiD distance subtype -- decides WHERE the leg is
  # placed (buildings via the Bosserhof mapping, green/open space via ATKIS
  # landuse grid seeding, or the existing residential visit pool). Requires
  # secondary_building_potentials, secondary_leisure_subtype_split,
  # secondary_other_subtype_split, leisure_visit_building_potential all ON
  # (checked, fail-fast). Defaults False in code -> byte-identical OFF.
  secondary_srv_location_types: true

  data_path: eqasim-data/data
  # Archive simulation_output/ into <output_path>/matsim_output/ after the run
  # (hardlink; survives a synpp cache-dir wipe). Default ON (issue #156).
  archive_matsim_output: true
  simwrapper_include_matsim: true

  # === ALL POPULATION-SYNTHESIS FEATURES ON ===
  braunschweig.population.popsim.controls_source: catalog
  # Full LOSSLESS-reduced catalog tier0+tier1+tier2+tier3 (incl. the 7 Kreis-level
  # employment/education controls). tier3 needs the KREIS geography -> settings_tier3_mef100_intseed_numba.yaml
  # (a superset of the normal settings: WELT/STAAT/KREIS/ZENSUS1km/ZENSUS100m) and the
  # imported cleancensus kreis_controls data (kreis_controls_dir below).
  braunschweig.population.popsim.control_tiers: tier0,tier1,tier2,tier3
  braunschweig.population.popsim.stratify_regiostar: false
  # Per-cell employment grid (EMPLOYED_{M,F} x 5 age bands; Zensus age shapes rescaled
  # to the census Erwerbstaetige Kreis levels in kreis_erwerbsstatus.parquet). 'on'
  # QUOTED -- YAML 1.1 parses bare on->True, but the stage checks ==\"on\".
  braunschweig.population.popsim.employment_grid: "on"
  # Ownership grid (issue #240): 9 per-1km-cell car/bike ownership shape controls
  # (OWN_CARS_{0,1,2,3plus}_agg + OWN_BIKES_{0,1,2,3,4plus}_agg). Shape from the
  # committed MiD B1 RS7 x haustyp conditionals; level raked per Kreis to the SAME
  # blended target2026 tables the KREIS ownership controls consume. Requires the
  # number_of_cars + number_of_bicycles KREIS controls (default on). "off" is
  # byte-identical to today's control set.
  braunschweig.population.popsim.ownership_grid_1km: "on"
  # Fine teen age bands in the tier0 backbone (issue #320): replaces the ten-year 10-19
  # age x sex controls with 10-15 / 16-17 / 18-19 (22 instead of 18 controls at 100m).
  # The ten-year band leaves the composition INSIDE it unconstrained, which produced a
  # 15-17 excess of +64% and an 18-19 shortfall of -75% against DESTATIS 12411-0018 on
  # the 100% population (issue #307). Targets come from the single-year cell columns,
  # whose provenance is recorded in docs/registry/data/zensus2022_grid_cells.yml. 'on'
  # QUOTED -- YAML 1.1 parses bare on->True, but the stage checks =="on".
  braunschweig.population.popsim.fine_teen_age_bands: "on"
  # Imported cleancensus Kreis control tables (kreis_erwerbsstatus / schulabschluss /
  # berufl_abschluss.parquet) -- required by BOTH employment_grid and tier3.
  braunschweig.population.popsim.kreis_controls_dir: eqasim-data/data/braunschweig/popsim/kreis_controls
  # PT-subscription per-Kreis control (issue #321, ADR-0089): three groups
  # (deutschlandticket / other_flatrate / not_flatrate) at 14+, soft tier. Target is
  # MiD P24.1 blended with SrV E_OEV_FK on a matched 14+ universe. Steers the quantity
  # BraunschweigPtCostModel reads (holders pay zero fare on every PT trip), which #307
  # measured at +3.06pp region / +4.18pp Braunschweig. 'on' QUOTED -- YAML 1.1 parses
  # bare on->True, but the stage compares against the string "on".
  braunschweig.population.popsim.pt_ticket_kreis_control: "on"

  # --- Shared persistent stage-cache (prime-on-launch) ---------------------
  # Reuse expensive sampling-independent stage caches from a shared, synced store so
  # they are not recomputed every run (primarily the ~3 h freight extraction). The
  # launcher (scripts/run_synpp.py) primes the working_directory from the store before
  # synpp runs; synpp validates each artifact's hash, so a mismatch is a safe recompute
  # (never corruption). Force a recompute by listing the module in cache_share_recompute
  # ("*" = all). See docs/superpowers/specs/2026-06-22-shared-stage-cache-design.md.
  cache_share_enabled: true
  cache_share_store: eqasim-data/cache_shared
  cache_share_stages:
    # Freight chain (input validation + the ~3 h Java routing).
    - braunschweig.data.freight.german_wide
    - braunschweig.freight.extraction
    - braunschweig.freight.trips
    # Tier A: 32 verified sampling- AND path-independent stages (identical hash at
    # 1% and 25%). Shared from the store instead of recomputed every run.
    - braunschweig.data.buildings
    - braunschweig.data.census.employees
    - braunschweig.data.census.employment
    - braunschweig.data.cordon_network
    - braunschweig.data.cordon_pt_gates
    - braunschweig.data.locations
    - braunschweig.data.mid.zones
    - braunschweig.data.schools.kita_facilities
    - braunschweig.data.schools.university_facilities
    - braunschweig.locations.secondary
    - braunschweig.locations.work
    - braunschweig.synthesis.cordon_gates
    - data.gtfs.cleaned
    - data.hts.entd.cleaned
    - data.hts.entd.filtered
    - data.hts.entd.reweighted
    - data.hts.selected
    - data.osm.cleaned
    - data.spatial.departments
    - data.spatial.municipalities
    - eqasim_common.data.osm.chunked
    - eqasim_common.data.osm.locations
    - eqasim_common.data.spatial.iris
    - eqasim_common.gravity.distance_matrix
    - eqasim_common.locations.education
    - eqasim_common.spatial.codes
    - eqasim_common.spatial.entd_codes
    - matsim.scenario.supply.gtfs
    - matsim.scenario.supply.osm
    - matsim.scenario.supply.processed
    # Tier B1: popsim.stage is sampling-independent; sharing it reuses the donor
    # build + the 33 per-1km PopulationSim batches across runs (requires the fixed
    # shared work_dir below so its hash is identical).
    - braunschweig.popsim.stage
    - braunschweig.popsim.distance_distributions
    # Tier B2: the completed-donor build (member completion + weekend match) depends
    # only on mid/seed/day_filter/weekend -> cached once, shared across ALL runs.
    - braunschweig.popsim.completed_donor

  java_memory: 100G

  mode_choice: false
  matching_attributes: ["sex", "age_class", "employed", "has_license", "household_size_class", "urban_class"]

  # --- MATSim runtime (64-core box) ---
  matsim_write_events_interval: 0
  matsim_write_plans_interval: 5
  matsim_threads: 56
  matsim_qsim_threads: 16

  # --- Population method: popsim_mid ---
  braunschweig.population.method: popsim_mid

  # popsim_mid inputs (relative to repo root; synced into eqasim-data/data).
  braunschweig.population.popsim.cells_1km_path: eqasim-data/data/braunschweig/popsim/cells/zensus2022_grid_1km_de_binned.parquet
  braunschweig.population.popsim.cells_100m_path: eqasim-data/data/braunschweig/popsim/cells/zensus2022_grid_100m_de_prepared.parquet
  braunschweig.population.popsim.mid_raw_path: eqasim-data/data/braunschweig/popsim/mid2023_raw
  braunschweig.population.popsim.mid_dir: eqasim-data/data/braunschweig/popsim/mid2023_raw
  # popsimprep + uv live OUTSIDE the repo on the server (absolute Linux paths).
  braunschweig.population.popsim.controls_path: /home/felix/popsimprep/popsim/configs/_prep3_controls.csv
  # settings_tier3_mef100_intseed_numba.yaml adds the KREIS geography (superset of
  # settings.yaml; required for the tier3 Kreis controls) AND pins the validated
  # ADR-0056 balancing regime: SUB_BALANCE_WITH_FLOAT_SEED_WEIGHTS=false +
  # USE_NUMBA=true + max_expansion_factor=100. The float-seed regime (~20x slower,
  # non-converging sub-balancing; #155) must never be wired into a run config again.
  braunschweig.population.popsim.settings_path: /home/felix/popsimprep/popsim/configs/settings_tier3_mef100_intseed_numba.yaml
  braunschweig.population.popsim.logging_path: /home/felix/popsimprep/popsim/configs/logging.yaml
  braunschweig.population.popsim.popsimprep_dir: /home/felix/popsimprep
  braunschweig.population.popsim.uv_path: /home/felix/.local/bin/uv
  # No per-batch timeout: heavy control sets converge slowly; batches must run to
  # completion no matter how long (0 -> timeout disabled, see batch.make_populationsim_run_one).
  braunschweig.population.popsim.batch_timeout_s: 0
  # Delete each batch's dead pipeline.h5 checkpoint store after verified completion
  # (issue #153). true is the code default; stated explicitly for traceability.
  braunschweig.population.popsim.cleanup_batch_pipeline: true

  # --- Gravity calibration ---
  gravity_slope: -0.065
  gravity_constant: -2.4
  gravity_diagonal: 1.0
  gravity_slope_by_regiostar7:
    72: -0.0558
    73: -0.0638
    74: -0.0640
    75: -0.0704
    76: -0.0719
    77: -0.0667

  # --- IPF margins ---
  braunschweig.ipf.use_household_size_margin: true
  braunschweig.ipf.use_household_type_margin: true
  braunschweig.ipf.dirichlet_prior_strength: 0.5

  gtfs_path: gtfs_cordon
  vrb_stations_path: vrb/stations.json

  # --- Braunschweig region scope (ZGB-8) ---
  braunschweig.political_prefix:
    - "03101"
    - "03102"
    - "03103"
    - "03151"
    - "03153"
    - "03154"
    - "03157"
    - "03158"

  # --- Input data paths ---
  braunschweig.employment_path: braunschweig/13111-06-02-4.xlsx
  braunschweig.employment_gemband_path: braunschweig/gemband-dlk-0-202506-xlsx.xlsx
  braunschweig.employees_path: braunschweig/13111-01-03-5.xlsx
  braunschweig.pendler_ein_path: braunschweig/statistik_pendler_2026042493412.csv
  braunschweig.pendler_aus_path: braunschweig/statistik_pendler_2026042493430.csv
  braunschweig.zensus_households_path: braunschweig/5000H-2001_de_flat.csv
  braunschweig.inkar_household_income_path: braunschweig/E_Haushaltseinkommen.xls
  braunschweig.inkar_year: latest
  braunschweig.home_density_weighting: true

  # WORK gravity at TAZ (sub-commune) resolution: fixes intra-city commute
  # distances in kreisfreie Staedte (e.g. Braunschweig). Requires local-only
  # RVB VISUM Verkehrszellen data (gitignored). Default OFF; set to true only
  # in configs where that proprietary parquet is present.
  taz_work_location_choice: false

  # --- Education gravity (real NDS schools / Kita / Hochschule) ---
  education_gravity_enabled: true
  education_gravity_slope_by_level_rs7:
    kindergarten: {72: -3.0000, 73: -2.0251, 74: -3.0000, 75: -3.0000, 76: -0.5167, 77: -2.8138}
    grundschule: {72: -1.3354, 73: -0.6835, 74: -0.4507, 75: -1.0793, 76: -0.1248, 77: -0.2412}
    sekundar_1: {72: -0.4944, 73: -0.2383, 74: -0.4303, 75: -0.5700, 76: -0.1568, 77: -0.1160}
    oberstufe: {72: -1.5100, 73: -0.7650, 74: -3.0000, 75: -1.2588, 76: -1.2588, 77: -1.2588}
    bbs: {72: -0.0350, 73: -0.0898, 74: -0.1524, 75: -0.0666, 76: -0.1346, 77: -3.0000}
  education_bbs_share: 0.681
  education_university_slope: -0.1415
  education_university_max_radius_km: 150.0

  # --- Vehicle fleet (all features ON) ---
  vehicles_method: household
  fleet_model_enabled: true
  fleet_model_brands: true
  fleet_hsn_tsn_attributes: true
  # Fleet realism upgrade (issue #277, ADR-0081..ADR-0086). Stated explicitly here
  # even though configure() registers the same defaults: the resolved canonical
  # config is the active-state truth, and a production-enabled feature that appears
  # nowhere in it is exactly the defect class ADR-0078/#253 removed.
  fleet_ev_income_tilt: true
  fleet_euro6_substage: true
  # Grid mode adds the sub-communal 5 km EV tilt on top of the Gemeinde tilt; its
  # input kba_ev_grid.csv (714 cells) is committed since #277. Falls back to
  # Gemeinde-only (logged) if the CSV or the home-location geometry is missing.
  fleet_electric_calibration: kreis_mix_gemeinde_grid_bev_tilt

  enable_urban_parking: true
  remode_carless_car_legs: true

  # --- Parallel chainsolvers: auto-scale (0 -> cpu_count - 2) ---
  braunschweig.chainsolvers.parallel: true
  braunschweig.chainsolvers.processes: 0

  # --- Cross-cordon external demand (einpendler injection), whole-region gates ---
  cordon_enabled: true
  # cordon_student_incommuters_enabled: default ON (unset) when education_gravity_enabled is on;
  # set to false to disable, do NOT set true unless education_gravity is on (else RuntimeError).
  # See docs/features/student-incommuters.md.
  cordon_network_source_buffer_m: 45000
  cordon_network_buffer_fraction: 0.10
  osm_path: osm/cordon
  osm_network_path: osm/germany-latest.zgb_ring.osm.pbf
  eqasim_source_path: ../eqasim-java-bs
  # The eqasim-java fork targets Java 25; the felix system default is JDK 21. Point the
  # Maven build (java_home) and the MATSim run (java_binary) at the JDK 25 installed
  # under ~/tools. See docs/UPGRADE_SYNPP_AND_JAVA.md.
  java_home: /home/felix/tools/jdk-25.0.3+9
  java_binary: /home/felix/tools/jdk-25.0.3+9/bin/java

  # External toolchain (Linux paths).
  osmosis_binary: /usr/bin/osmosis
  osmconvert_binary: /usr/bin/osmconvert

  # --- Spatial income tilt + Kreis-Income-Control ---
  braunschweig.population.popsim.income_spatial_tilt: true
  braunschweig.population.popsim.income_tilt_beta: 0.3
  braunschweig.population.popsim.income_tilt_clip: 0.30
  braunschweig.population.popsim.income_kreis_control: true
  braunschweig.population.popsim.income_draw_method: combined
  braunschweig.population.popsim.income_kreis_control_hhsize_correct: true
  braunschweig.population.popsim.income_open_top_pareto: true
  braunschweig.population.popsim.income_open_top_pareto_alpha: 3.0

# --- Aliases (popsim_mid producer + cordon injection writers) ---
aliases:
  data.census.filtered: braunschweig.popsim.stage
  synthesis.population.trips: braunschweig.popsim.trips_stage
  synthesis.population.enriched: braunschweig.popsim.enriched_adapter
  synthesis.population.spatial.commute_distance: braunschweig.popsim.commute_distance
  synthesis.population.spatial.secondary.distance_distributions: braunschweig.popsim.distance_distributions
  synthesis.population.income.selected: braunschweig.synthesis.income
  synthesis.population.spatial.home.zones: braunschweig.synthesis.spatial.home_zones
  synthesis.locations.home.locations: braunschweig.locations.home
  synthesis.population.spatial.home.locations: braunschweig.synthesis.locations.home_cell
  synthesis.locations.education: eqasim_common.locations.education
  synthesis.locations.secondary: braunschweig.locations.secondary
  synthesis.population.spatial.secondary.locations: braunschweig.synthesis.locations.secondary_chainsolvers
  synthesis.locations.work: braunschweig.locations.work
  data.od.weighted: braunschweig.gravity.model
  data.spatial.iris: eqasim_common.data.spatial.iris
  data.spatial.codes: eqasim_common.spatial.entd_codes
  synthesis.population.spatial.primary.locations: braunschweig.locations.synthesis.replacement_education_gravity
  matsim.simulation.prepare: braunschweig.matsim.simulation.prepare
  matsim.scenario.population: braunschweig.matsim.scenario.population
  matsim.scenario.households: braunschweig.matsim.scenario.households
  matsim.scenario.vehicles: braunschweig.matsim.scenario.vehicles
  matsim.scenario.facilities: braunschweig.matsim.scenario.facilities
