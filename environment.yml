name: ile-de-france

channels:
  - conda-forge

dependencies:
  - matplotlib=3.7.1
  - pandas=1.5.3
  - scipy=1.10.1
  - numpy=1.23.5
  - geopandas=1.0.1
  - numba=0.56.4
  - palettable=3.3.0
  - scikit-learn=1.2.2
  - shapely=2.0.6
  - tqdm=4.65.0
  - pytables=3.9.2
  - xlrd=2.0.1
  - openpyxl=3.1.0
  - pip=23.0.1
  - python=3.10.10
  - py7zr=0.20.8
  - pytest=7.2.2
  - xlwt=1.3.0
  - fiona=1.10.1
  - sqlite=3.49.1
  - mock=5.1.0
  - pyarrow=16.1.0
  - pyrosm=0.6.2
  - statsmodels=0.14.3
  - requests=2.32.3
  - pyogrio=0.10.0

  - pip:
    - synpp==1.5.1
    - bhepop2==2.0.0
    # Secondary-location chain solver used by
    # braunschweig.synthesis.locations.secondary_chainsolvers (default solver
    # "carla"). Pure-python (py3-none-any), MIT. Without it the secondary-
    # locations stage aborts with "ModuleNotFoundError: No module named
    # 'chainsolvers'".
    #
    # Pinned to the TUBS-IVS commit that adds native attr_transform to Scorer
    # (attr_transform="linear"/"log1p"/"log"), the mnl selection strategy, and
    # the carla_sample / dp_sample solvers -- required by the smart-other-potential
    # feature (Task 2+). The combined Scorer (mode="geometric"/"potential"/"combined",
    # pot_weight/dist_dev_weight) is still present and the default attr_transform
    # "linear" is byte-identical to the previous pin, so existing runs are unaffected.
    # The PyPI 0.1.0 release has a stubbed scorer; no newer PyPI release exists yet.
    # Swap to chainsolvers==0.2.0 once that release is published.
    - git+https://github.com/TUBS-IVS/chainsolvers.git@d8d8ae7de5bf2504d44b8422abcfe827ed7d054b

    # --- braunschweig.runcontrol (run-management GUI, issue #119) ---------
    # FastAPI + uvicorn serve the local GUI; jinja2 renders the server-side
    # HTML; python-multipart parses the launch form; tomli reads
    # runcontrol.toml (stdlib tomllib exists only from Python 3.11).
    # All pure-python, MIT/BSD/Apache licensed.
    - fastapi==0.115.12
    - uvicorn==0.34.0
    - jinja2==3.1.4
    - python-multipart==0.0.20
    - tomli==2.2.1
    # starlette.testclient.TestClient (used by tests/runcontrol/test_app_api.py)
    # requires httpx as its HTTP transport since starlette 0.36; test-only, never
    # imported by application code. MIT licensed.
    - httpx==0.27.2
