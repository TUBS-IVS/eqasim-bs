## Re-run only the gravity stage so we can inspect its output after the
## _calibrate / _append_outbound_flows scale fix.

working_directory: eqasim-data/cache_bs

run:
  - braunschweig.gravity.model

config:
  processes: 4
  data_path: eqasim-data/data

  sampling_rate: 0.01
  random_seed: 1234
  hts: entd

  braunschweig.political_prefix:
    - "03101"
    - "03102"
    - "03103"
    - "03151"
    - "03153"
    - "03154"
    - "03157"
    - "03158"

  braunschweig.population_path: braunschweig/12111-0001_population_ni.xlsx
  braunschweig.employment_path: braunschweig/13111-06-02-4.xlsx
  braunschweig.employment_gemband_path: braunschweig/gemband-dlk-0-202506-xlsx.xlsx
  braunschweig.employees_path: braunschweig/13111-01-03-5.xlsx
  braunschweig.work_flow_path:  braunschweig/pendler_ni.xlsx
  braunschweig.pendler_ein_path: braunschweig/statistik_pendler_2026042493412.csv
  braunschweig.pendler_aus_path: braunschweig/statistik_pendler_2026042493430.csv
  braunschweig.zensus_households_path: braunschweig/5000H-2001_de_flat.csv
  braunschweig.inkar_household_income_path: braunschweig/E_Haushaltseinkommen.xls
  braunschweig.inkar_year: latest

  # Match production config so the gravity-only run picks up the per-RS7
  # slope override calibrated via scripts/calibrate_gravity_per_rs7.py.
  gravity_slope: -0.065
  gravity_constant: -2.4
  gravity_diagonal: 1.0
  gravity_slope_by_regiostar7:
    # Identified full-panel GLM on the 225 km ring; see
    # scripts/calibrate_gravity_per_rs7.py --anchor-scope ring.
    72: -0.0558
    73: -0.0638
    74: -0.0640
    75: -0.0704
    76: -0.0719
    77: -0.0667

aliases:
  eqasim_common.data.census.licenses:  braunschweig.data.census.licenses
  eqasim_common.data.census.population: braunschweig.data.census.population
  eqasim_common.data.census.employment: braunschweig.data.census.employment
  eqasim_common.data.census.employees:  braunschweig.data.census.employees
  eqasim_common.data.mid.data:  braunschweig.data.mid.data
  eqasim_common.data.mid.zones: braunschweig.data.mid.zones
  eqasim_common.data.census.household_size:   braunschweig.data.census.household_size
  eqasim_common.data.census.household_income: braunschweig.data.census.household_income
  eqasim_common.data.buildings: braunschweig.data.buildings
  eqasim_common.data.osm.locations: braunschweig.data.locations
