name: Braunschweig input sources are still reachable

# Weekly reachability check of the DOWNLOAD SOURCE URLs documented in
# scripts/verify_braunschweig_inputs.py (and mirrored in
# eqasim-data/DOWNLOAD_CHECKLIST_BS.md). It answers the only data question a
# runner can answer: did a statistical portal move, rename or retire a source we
# depend on. Local file presence -- the script's default mode -- cannot be checked
# here because CI has no data.
#
# History of the upstream French verifier this workflow once ran:
# docs/codebase/notes/ci-data-availability-checks.md.

on:
  schedule:
  - cron: "0 10 * * 0" # every sunday 10am
  workflow_dispatch:

jobs:
  check-source-urls:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    # The check needs requests and nothing else: verify_braunschweig_inputs.py
    # imports only argparse / os / sys / dataclasses / typing at module level and
    # requests lazily inside the --check-urls path. No conda environment, no
    # geospatial stack.
    - name: Install the only dependency the check needs
      run: pip install requests

    - name: Verify the documented Braunschweig download sources are reachable
      run: python scripts/verify_braunschweig_inputs.py --check-urls
