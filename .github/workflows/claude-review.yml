name: Claude PR review

# Advisory code review by Claude on pull requests to main. A model-free gate job
# (scripts/claude_review.py classify, thresholds in .github/claude-review.yml) decides
# whether a review runs and at which tier; only then is the API called. Each review
# records its API cost in the job summary and as an artifact. The review posts comments
# only; it is not a required check. See docs/codebase/notes/claude-pr-review.md.
#
# Prerequisite: repository secret ANTHROPIC_API_KEY. Comments are posted with the
# workflow's GITHUB_TOKEN (as github-actions[bot]).

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
      tier: ${{ steps.gate.outputs.tier }}
      model: ${{ steps.gate.outputs.model }}
      max_turns: ${{ steps.gate.outputs.max_turns }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install gate dependencies
        run: pip install pyyaml
      - name: Decide whether and how to review (no model call)
        id: gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          # Secrets are not available to PRs from forks; say so instead of failing later.
          if [ "$SAME_REPO" != "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "### Claude review gate" >> "$GITHUB_STEP_SUMMARY"
            echo "- Skipped: PR from a fork, no API secret available." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --numstat "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/numstat.tsv"
          draft_flag=""
          if [ "$IS_DRAFT" = "true" ]; then draft_flag="--draft"; fi
          python scripts/claude_review.py classify \
            --config .github/claude-review.yml \
            --numstat "$RUNNER_TEMP/numstat.tsv" \
            --branch "$HEAD_REF" --labels "$LABELS" $draft_flag \
            --event-action "$EVENT_ACTION" --event-label "$EVENT_LABEL"

  review:
    needs: classify
    if: needs.classify.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Claude review
        id: claude
        # v1.0.99, pinned by commit for reproducible review behaviour.
        uses: anthropics/claude-code-action@c3d45e8e941e1b2ad7b278c57482d9c5bf1f35b3
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The workflow token instead of the Claude GitHub App's OIDC token exchange
          # (src/github/token.ts of the action): no app installation is needed.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            REVIEW TIER: ${{ needs.classify.outputs.tier }}

            You review a pull request of eqasim-bs, MATSim/eqasim transport-simulation
            research software. Correctness, reproducibility and traceability outrank
            everything else. First read CLAUDE.md, .claude/rules/coding-standards.md and
            .claude/rules/tests.md: they are the binding rules. Read the change with
            `gh pr view` and `gh pr diff`; open surrounding code with Read/Grep/Glob where
            a finding depends on it. Review only what this diff changes.

            Look for, in this order:
            1. Correctness bugs: wrong results, crashes, wrong joins/keys/units, broken
               edge cases, a changed scientific output that the PR does not declare.
            2. Silent fallbacks (CLAUDE.md "Fallback transparency"): a fallback without
               primary/fallback rate logging, or a test that only exercises the fallback.
            3. Invented reference values, or convergence reported as validation.
            4. Tests that miss the primary path of the new behaviour.
            5. Documentation governance: hand-edited docs/generated/*.md, one fact copied
               into two files, code referenced by line number.

            Rules for findings: report only what you are confident about, each with a
            concrete failure scenario (input or state -> wrong outcome). No style nits,
            no praise, no restating the diff. Light tier: keep it short and stop after
            categories 1-3. Post each finding as an inline comment on the changed line.
            Finish with exactly one top-level comment via `gh pr comment` that starts with
            "Claude review (${{ needs.classify.outputs.tier }} tier)" and lists the findings
            by severity, or says that none were found.
          claude_args: |
            --model ${{ needs.classify.outputs.model }}
            --max-turns ${{ needs.classify.outputs.max_turns }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
      - name: Record review cost
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          TIER: ${{ needs.classify.outputs.tier }}
          MODEL: ${{ needs.classify.outputs.model }}
        run: |
          python3 scripts/claude_review.py cost --execution-file "$EXECUTION_FILE" \
            --tier "$TIER" --model "$MODEL" --json claude-review-cost.json
      - name: Upload cost record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-cost-pr${{ github.event.pull_request.number }}-run${{ github.run_id }}-${{ github.run_attempt }}
          path: claude-review-cost.json
          if-no-files-found: warn
          retention-days: 90
