name: Unit and integration tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        shell: bash -el {0}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: lock-tools
          python-version: "3.11"
      - name: Install locked project environment
        run: |
          python -m pip install conda-lock==4.0.2
          conda-lock install --name eqasim environments/conda-lock.yml
      - name: Report actual environment
        run: conda run --no-capture-output -n eqasim python scripts/run_tests.py --check
      - name: Regression tests with duration report
        run: conda run --no-capture-output -n eqasim python scripts/run_tests.py -q --durations=30 --junitxml=test-results.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.os }}
          path: test-results.xml
          if-no-files-found: ignore
          retention-days: 14
