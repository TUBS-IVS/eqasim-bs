name: Unit and integration tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        shell: bash -el {0}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          # Pinned, not "latest": Miniforge3 26.9.4-0 (released 2026-10-22) fails on the Windows
          # runner in setup-miniconda's conda init ("needs sudo ... conda.exe", exit 1) before any
          # test runs (run 39978419378 on main); 26.7.2-1 was the last version green on both
          # platforms (run 39966999531). Bump deliberately and watch the Windows job.
          miniforge-version: 26.7.2-1
          activate-environment: lock-tools
          python-version: "3.11"
      - name: Install production Linux snapshot
        if: runner.os == 'Linux'
        run: |
          conda create --yes --name eqasim --file environments/server-linux-64.lock
          conda run --no-capture-output -n eqasim python -m pip install --no-deps -r environments/requirements-server-linux-64.txt
      - name: Install locked Windows environment
        if: runner.os == 'Windows'
        run: |
          python -m pip install conda-lock==4.0.2
          conda-lock install --name eqasim environments/conda-lock.yml
      - name: Verify dependency consistency
        run: conda run --no-capture-output -n eqasim python -m pip check
      - name: Report actual environment
        run: conda run --no-capture-output -n eqasim python scripts/run_tests.py --check
      - name: Regression tests with duration report
        run: conda run --no-capture-output -n eqasim python scripts/run_tests.py -q --durations=30 --junitxml=test-results.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.os }}
          path: test-results.xml
          if-no-files-found: ignore
          retention-days: 14
