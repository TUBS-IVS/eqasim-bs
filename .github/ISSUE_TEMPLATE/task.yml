name: Task
description: Work with a defined end that is not a bug, feature, analysis or decision (refactoring, server run, config wiring, tooling, docs)
title: "<module or run>: <what is done>"
type: Task
body:
  - type: markdown
    attributes:
      value: |
        Conventions: `docs/codebase/notes/issue-and-pr-conventions.md`. The first four fields are the plain-language head: someone who has never opened this repository must understand them. Tooling/docs tasks carry `area:tooling` / `area:docs` and no `step:*`; model tasks carry both.
  - type: input
    id: stages
    attributes:
      label: Stages
      description: Registry stage id(s) touched, or `none` for tooling/docs.
    validations:
      required: true
  - type: input
    id: short
    attributes:
      label: In short
      description: One plain sentence, everyday words. What is wrong and what should happen. Someone who reads only this line knows what the issue is.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or awkward today, as two to four short bullets. One fact each, about fifteen words, everyday words. A cross-reference ("see #77") is not a description.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Why it matters
      description: What it costs the results or the work to leave this as it is. One sentence.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: The observable end state, one checkable outcome per line (tests green, config committed, run manifest recorded, docs rebuilt).
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ### Details
        Everything below is the technical record. Numbers, stage ids, code paths and prior work belong here, not in the head above.
  - type: textarea
    id: behaviour
    attributes:
      label: Behaviour change?
      description: Byte-identical outputs expected? If not, what changes and how it is verified.
  - type: textarea
    id: approach
    attributes:
      label: Approach / steps
      description: How the work is done, and anything that must be measured or checked first.
  - type: input
    id: links
    attributes:
      label: Linked issue / PR / ADR
