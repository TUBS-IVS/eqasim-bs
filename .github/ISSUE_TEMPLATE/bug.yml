name: Bug
description: A wrong, non-reproducible or scientifically indefensible result, including a silent fallback
title: "<stage or attribute>: <what is wrong>"
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Conventions: `docs/codebase/notes/issue-and-pr-conventions.md`. The first four fields are the plain-language head: someone who has never opened this repository must understand them. After creating, add one `step:*` label and one or two `area:*` labels. `prio:*` is set at triage.
  - type: input
    id: stages
    attributes:
      label: Stages
      description: Registry stage id(s) from docs/registry/stages/, e.g. `synthesis.population.trips`. `unknown` is allowed.
      placeholder: "synthesis.population.trips"
    validations:
      required: true
  - type: input
    id: short
    attributes:
      label: In short
      description: One plain sentence, everyday words. What is wrong and what should happen. Someone who reads only this line knows what the issue is.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong today, as two to four short bullets. One fact each, about fifteen words, everyday words ("the national travel survey", not MiD). No solution yet. A cross-reference ("see #77") is not a description.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Why it matters
      description: What this does to the results, the model or the work. One sentence.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: The observable end state, one checkable outcome per line.
      placeholder: |
        - [ ] The wrong value is gone and a test covers the case
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ### Details
        Everything below is the technical record. Numbers, stage ids, code paths and prior work belong here, not in the head above.
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Exact config (base + overlay), sampling rate, command, environment (local / server), commit.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      description: Expected behaviour or value with its committed reference (path), vs what happened.
    validations:
      required: true
  - type: textarea
    id: fallback
    attributes:
      label: Suspected cause / silent fallback
      description: Is a primary method silently falling back? State the primary-vs-fallback rate if known.
  - type: input
    id: links
    attributes:
      label: Linked ADR / PR / run manifest
      placeholder: "ADR-00NN, PR #NN, docs/runs/<run_id>.yml"
