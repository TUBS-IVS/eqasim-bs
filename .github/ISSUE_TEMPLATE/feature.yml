name: Feature
description: A model extension or data integration (flag-gated, OFF path byte-identical)
title: "<stage or attribute>: <what is produced>"
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Conventions: `docs/codebase/notes/issue-and-pr-conventions.md`. The first four fields are the plain-language head: someone who has never opened this repository must understand them. After creating, add one `step:*` label and one or two `area:*` labels. `prio:*` is set at triage. Programme steps get a parent (`gh issue edit N --parent M`).
  - type: input
    id: stages
    attributes:
      label: Stages
      description: Registry stage id(s) touched or added (docs/registry/stages/). `unknown` is allowed.
    validations:
      required: true
  - type: input
    id: short
    attributes:
      label: In short
      description: One plain sentence, everyday words. What is wrong and what should happen. Someone who reads only this line knows what the issue is.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What the model cannot do today, as two to four short bullets. One fact each, about fifteen words, everyday words. No solution yet. A cross-reference ("see #77") is not a description.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Why it matters
      description: What the gap costs the results or the work. One sentence.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: The observable end state, one checkable outcome per line (tests, A/B, registry records).
      placeholder: |
        - [ ] The flag is ON by default and the OFF path is byte-identical (tested)
        - [ ] The result is compared to <committed reference>
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ### Details
        Everything below is the technical record. Numbers, stage ids, code paths and prior work belong here, not in the head above.
  - type: textarea
    id: flag
    attributes:
      label: Config flag (default ON/OFF) and OFF-path expectation
      description: New behaviour MUST be flag-gated. Flag name, default, and that the OFF path stays byte-identical (tested).
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: Reference data / source
      description: The committed CSV / Zensus / MiD / SrV table or publication this is grounded in. No invented reference values; label assumptions as ASSUMPTION.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validated against
      description: Which observed reference the result is compared to. Convergence is NOT validation.
  - type: textarea
    id: approach
    attributes:
      label: Approach / open questions
      description: Sketch of the method, the alternatives still open, and anything that must be measured first.
  - type: input
    id: links
    attributes:
      label: Linked ADR / parent issue
      placeholder: "ADR-00NN, parent #NN"
